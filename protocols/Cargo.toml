[package]
name = "dynamo-protocols"
readme = "README.md"
version = "8.0.0"
edition.workspace = true
description = "Protocol types for OpenAI-compatible inference APIs with inference-serving extensions."
authors.workspace = true
license = "Apache-2.0 AND MIT"
homepage.workspace = true
repository.workspace = true
keywords = ["llm", "genai", "inference", "openai", "anthropic"]
include = ["src/**/*", "Cargo.toml", "README.md"]

[features]
# Metadata only: no request deserialization or response serialization changes.
protocol-schema = ["dep:utoipa"]

[dependencies]
utoipa = { version = "5.5.0", optional = true, features = ["url", "uuid"] }
# Upstream OpenAI types (types-only, no HTTP client)
async-openai = { workspace = true, features = [
    "batch-types",
    "chat-completion-types",
    "response-types",
    "completion-types",
    "embedding-types",
    "file-types",
    "image-types",
    "realtime-types",
] }

# Serialization
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
derive_builder.workspace = true

# Type support
thiserror.workspace = true
tracing.workspace = true
url = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["v4", "serde"] }
futures.workspace = true

[dev-dependencies]
jsonschema = { version = "0.29", default-features = false }
tokio = { workspace = true, features = ["full"] }
tokio-test.workspace = true
serde_json.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
