[package]
name = "dynamo-agent-tools"
readme = "README.md"
version = "0.1.0"
edition.workspace = true
description = "External tool executors for dynamo-agent-rt."
authors.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
keywords = ["agents", "tools", "search"]
include = ["src/**/*", "Cargo.toml", "README.md"]

[dependencies]
dynamo-agent-rt.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["query", "rustls"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
url.workspace = true

[dev-dependencies]
axum.workspace = true
dynamo-agent-rt-store = { path = "../store", features = ["sqlite"] }
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
