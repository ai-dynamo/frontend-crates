[package]
name = "dynamo-agent-rt-store"
readme = "README.md"
version = "0.1.0"
edition.workspace = true
description = "Durable SQLite and PostgreSQL stores for dynamo-agent-rt."
authors.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
keywords = ["agents", "sqlite", "postgresql", "state"]
include = ["src/**/*", "migrations/**/*", "Cargo.toml", "README.md"]

[dependencies]
dynamo-agent-rt.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }

[dependencies.rusqlite]
version = "0.40.1"
default-features = false
features = ["bundled"]
optional = true

[dependencies.deadpool-postgres]
version = "0.14.1"
optional = true

[dependencies.tokio-postgres]
version = "0.7.18"
optional = true

[dependencies.postgresql_embedded]
version = "0.21.0"
default-features = false
features = ["theseus", "tls-rustls-ring", "tokio"]
optional = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[features]
default = []
sqlite = ["dep:rusqlite"]
postgres = ["dep:deadpool-postgres", "dep:tokio-postgres"]
postgres-integration = ["postgres", "dep:postgresql_embedded"]

[[test]]
name = "postgres_two_replica"
required-features = ["postgres-integration"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
