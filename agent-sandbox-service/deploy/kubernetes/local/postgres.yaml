apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: agent-rt-sandbox-system
spec:
  selector:
    app.kubernetes.io/name: agent-rt-sandbox-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: agent-rt-sandbox-system
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-rt-sandbox-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-rt-sandbox-postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-bookworm
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: agent_rt_sandbox
            - name: POSTGRES_USER
              value: agent_rt_sandbox
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agent-rt-sandbox-secrets
                  key: postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - agent_rt_sandbox
                - -d
                - agent_rt_sandbox
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 2Gi
        - name: run
          emptyDir:
            sizeLimit: 16Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
  namespace: agent-rt-sandbox-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agent-rt-sandbox-postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agent-rt-sandbox-service
      ports:
        - protocol: TCP
          port: 5432
