[package]
name = "dynamo-mm-preprocessor"
readme = "README.md"
version = "0.1.0"
edition.workspace = true
description = "Model-family multimodal preprocessing for LLM inference serving: a Rust replacement for HF AutoProcessor image pipelines."
authors.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
keywords = ["llm", "multimodal", "vision", "preprocessing", "inference"]
include = ["src/**/*", "Cargo.toml", "README.md"]
# Skeleton (design-review) stage: flips to publishable once the implementation
# lands. release-plz mirrors this (publish = false, release = false).
publish = false

[features]
default = ["parallel"]
# Trusted-source compatibility helper (data:/base64/file/http), not an
# untrusted URL security boundary. The implementation wires the deps:
# `fetch = ["dep:ureq", "dep:base64"]`.
fetch = []
# Links rayon; kernels still run inline until `execution::init_pool` arms the
# crate-owned pool at runtime. Opt out (`default-features = false`) to drop
# rayon from the dependency graph and force the inline path at compile time.
# The implementation wires `parallel = ["dep:rayon"]`.
parallel = []

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
