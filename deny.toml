[graph]
all-features = true

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # Boost Software License (xxhash-rust, the XXH3 crate Dynamo's canonical
    # media identity uses).
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]

# jsonschema's local-reference resolver uses this MIT No Attribution crate.
# Keep the exception scoped to the audited package/version rather than allowing
# MIT-0 for future dependencies globally.
[[licenses.exceptions]]
name = "borrow-or-share"
version = "=0.2.4"
allow = ["MIT-0"]

[bans]
multiple-versions = "allow"
wildcards = "deny"
