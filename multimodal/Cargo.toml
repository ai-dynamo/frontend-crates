[package]
name = "dynamo-multimodal"
readme = "README.md"
version = "0.1.0"
edition.workspace = true
description = "Shared multimodal input processing, prompt geometry, token accounting, and content identity for LLM inference serving."
authors.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
keywords = ["llm", "multimodal", "vision", "preprocessing", "inference"]
include = ["src/**/*", "Cargo.toml", "README.md"]

[features]
default = ["parallel"]
# Trusted-source compatibility helper (data:/base64/file/http), not an
# untrusted URL security boundary. Still a stub; its implementation wires the
# deps: `fetch = ["dep:ureq", "dep:base64"]`.
fetch = []
# Links rayon; kernels still run inline until `execution::init_pool` arms the
# crate-owned pool at runtime. Opt out (`default-features = false`) to drop
# rayon from the dependency graph and force the inline path at compile time.
parallel = ["dep:rayon"]
# `video_decode`: MP4 / WebM / Matroska demuxing, probing, frame sampling, and
# hardware decoding through NVDEC. NVIDIA's driver libraries are loaded at
# runtime when present; nothing is linked at build time. No software decoder.
video-decode = ["dep:matroska-demuxer", "dep:re_mp4"]

[dependencies]
blake3.workspace = true
gif.workspace = true
image.workspace = true
matroska-demuxer = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
re_mp4 = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
turbojpeg.workspace = true
xxhash-rust.workspace = true
