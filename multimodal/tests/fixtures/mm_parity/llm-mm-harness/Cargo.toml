# The llm-multimodal column's worker (README.md). Its own workspace and lock
# keep llm-multimodal out of the repo's dependency graph.
[workspace]

[package]
name = "llm-mm-harness"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Default features only add hf-hub downloads; opencv-video is off.
llm-multimodal = { version = "=1.15.0", default-features = false }
reqwest = { version = "0.13.4", default-features = false }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt"] }
