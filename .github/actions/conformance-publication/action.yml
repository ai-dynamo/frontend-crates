name: Restore candidate conformance publication
description: Restore one matching site, source catalog, and native publisher for qualification.
runs:
  using: composite
  steps:
    - name: Download candidate native publication
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: conformance-native-publication
        path: ${{ runner.temp }}/native-publication
    - name: Restore matching publication inputs
      shell: bash
      run: |
        printf 'CONFORMANCE_PUBLISHER=%s/native-publication/conformance-publish\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
        printf 'CONFORMANCE_PUBLISHED_SITE=%s/pages\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
        chmod u+x "$RUNNER_TEMP/native-publication/conformance-publish"
        mkdir -p "$RUNNER_TEMP/pages"
        tar -xf "$RUNNER_TEMP/native-publication/native-pages.tar" -C "$RUNNER_TEMP/pages"
        tar -xf "$RUNNER_TEMP/native-publication/source-catalogs.tar" -C "$GITHUB_WORKSPACE"
