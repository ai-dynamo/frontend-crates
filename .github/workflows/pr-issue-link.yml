# Verifies GitHub/Linear issue references using the trusted base branch's code.
# Missing links warn and pass while BLOCKING_BRANCH is empty.
name: PR Issue Link

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    branches: [main]

env:
  # Empty keeps this check advisory. Before enabling enforcement, choose a
  # branch and arrange to re-check open PRs when it is cut, then require
  # `Require an issue link` in the repository's merge rules.
  BLOCKING_BRANCH: ""

jobs:
  check-issue-link:
    name: Require an issue link
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'pull_request_target' && !github.event.pull_request.draft }}
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout base repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          sparse-checkout: .github/workflows
          persist-credentials: false
      - name: Check for a linked issue
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          REPO: ${{ github.repository }}
        run: python3 .github/workflows/pr_issue_link.py
