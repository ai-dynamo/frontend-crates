name: release

on:
  push:
    # `pull-request/<n>` is the copy-pr-bot mirror pushed after `/ok to test`.
    # Mirror pushes run only the read-only preview job below.
    branches:
      - main
      - "pull-request/[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Dry run of the bump step against the squash commit this PR would land.
  # Fails when release-plz would generate a major version, so the author either
  # drops the breaking marker or pegs the major version before merge.
  preview:
    if: startsWith(github.ref, 'refs/heads/pull-request/')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read  # read the PR title
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      # release-plz sizes bumps from the commit that lands on main: the squash
      # commit titled with the PR title, not the branch's own commits.
      - name: Build the squash commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title=$(gh pr view "${GITHUB_REF_NAME#pull-request/}" --repo "$GITHUB_REPOSITORY" --json title -q .title)
          git config user.name  "release-preview"
          git config user.email "release-preview@invalid"
          git fetch -q origin "$GITHUB_SHA"
          git merge --squash "$GITHUB_SHA"
          git commit -q -m "$title"

      # After the squash, so the PR's own scripts and toolchain are used.
      - name: Install Rust
        run: rustup toolchain install

      - name: Install release tools
        run: .github/scripts/install-release-tools.sh

      - name: Bump versions (dry run)
        run: .github/scripts/bump-versions.sh

      - name: Reject generated major versions
        run: .github/scripts/check-major-bumps.sh

  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Scope OIDC + secrets to a protected environment. crates.io trusted
    # publishing entries should reference this environment so the OIDC
    # claim is bound to it — a misconfigured workflow elsewhere can't
    # publish even if it lands on main.
    environment: automated-release
    permissions:
      contents: write       # push the release commit + tags
      pull-requests: write  # release-plz may interact with PRs
      id-token: write       # OIDC for crates.io trusted publishing
    # Recursion guard: skip the run triggered by our own "chore: release" push.
    # workflow_dispatch bypasses the guard so a partial publish can be re-run.
    # Mirror branches never publish.
    if: "${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore: release')) }}"
    steps:
      - name: Generate release app token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          token: ${{ steps.release-token.outputs.token }}

      - name: Configure git identity
        run: |
          git config user.name  "release-plz[bot]"
          git config user.email "release-plz[bot]@users.noreply.github.com"

      - name: Install Rust
        run: rustup toolchain install

      - name: Install release tools
        run: .github/scripts/install-release-tools.sh

      # Path-scoped auto-bump; see the script header. Generated major
      # versions are rejected by the preview job before merge, so this step
      # publishes whatever was merged.
      - name: Bump versions for crates whose own files changed
        run: .github/scripts/bump-versions.sh

      - name: Commit and push version bumps (if any)
        run: |
          if git diff --quiet; then
            echo "No version bumps proposed."
            exit 0
          fi
          # Informative subject listing every crate whose [package] version
          # changed this run, e.g. "chore: release dynamo-protocols v1.4.0,
          # dynamo-renderer v0.1.1". The name + literal version guard skips the
          # workspace root. The "chore: release" prefix is mandatory — the
          # recursion guard above keys off it.
          git add -A
          summary=$(for toml in $(git ls-files | grep -E '(^|/)Cargo\.toml$'); do
            name=$(grep -m1 '^name *=' "$toml" | sed -E 's/.*"([^"]+)".*/\1/')
            newver=$(grep -m1 '^version *=' "$toml" | sed -E 's/.*"([^"]+)".*/\1/')
            oldver=$(git show "HEAD:$toml" 2>/dev/null | grep -m1 '^version *=' | sed -E 's/.*"([^"]+)".*/\1/')
            if [ -n "$name" ] && [ -n "$newver" ] && [ "$newver" != "$oldver" ]; then
              printf '%s v%s, ' "$name" "$newver"
            fi
          done | sed 's/, $//')
          [ -z "$summary" ] && summary="version bumps"
          git commit -s -m "chore: release $summary"
          git push origin HEAD:main

      # Always run (not gated on the bump step): a merge that only manually
      # pegged a version produces no auto-bump commit but must still publish.
      # `release-plz release` publishes enabled packages whose Cargo.toml
      # versions aren't on crates.io yet and pushes their tags; it's a no-op
      # otherwise.
      - name: Publish to crates.io (trusted publishing)
        # The release-plz binary needs the forge token passed explicitly via
        # --git-token; unlike release-plz/action it does NOT read GITHUB_TOKEN
        # from the env. Even with git_release_enable=false, `release` builds a
        # forge client unconditionally, so a missing token aborts the publish.
        # Reference the env var (not the ${{ }} expression) so the token value
        # is never expanded into the echoed command.
        run: release-plz release --git-token "$GITHUB_TOKEN"
        env:
          GITHUB_TOKEN: ${{ steps.release-token.outputs.token }}
          # No CARGO_REGISTRY_TOKEN — trusted publishing via OIDC is used
          # instead. release-plz exchanges the GitHub OIDC token for a
          # short-lived crates.io token automatically.
