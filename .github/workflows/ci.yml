name: ci

on:
  push:
    # `pull-request/<n>` is the internal mirror branch copy-pr-bot pushes after a
    # maintainer runs `/ok to test <sha>`. External contributions run CI from the
    # mirror so maintainers vet the code before it executes with repo access.
    branches:
      - main
      - "pull-request/[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Decide which optional jobs need to run for this change. `conformance-table`
  # is expensive (downloads the private fixture dataset, renders both charts) and
  # is only affected by conformance/parser changes, so skip it otherwise.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      conformance: ${{ steps.filter.outputs.conformance }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Detect conformance/parser changes
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            conformance:
              - 'conformance/**'
              - 'parsers/**'
              - '.github/workflows/ci.yml'

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_DENY_VERSION: "0.19.4"
      CARGO_MACHETE_VERSION: "0.9.2"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Fixture shards live in-repo under conformance/fixtures/ via git-lfs;
          # cargo test extracts them locally (extract_fixtures.py, stdlib-only).
          lfs: true
          # Release identity compares parser source with the release tag.
          fetch-depth: 0

      - name: Install Rust
        run: rustup toolchain install

      - name: Cache cargo tools
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-machete
          key: ${{ runner.os }}-cargo-tools-deny-${{ env.CARGO_DENY_VERSION }}-machete-${{ env.CARGO_MACHETE_VERSION }}-${{ hashFiles('rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-tools-

      - name: Install cargo tools
        run: |
          cargo-deny --version 2>/dev/null | grep -qF "${CARGO_DENY_VERSION}" || cargo install "cargo-deny@${CARGO_DENY_VERSION}" --locked
          cargo-machete --version 2>/dev/null | grep -qF "${CARGO_MACHETE_VERSION}" || cargo install "cargo-machete@${CARGO_MACHETE_VERSION}" --locked

      - name: Check unused dependencies
        run: cargo machete

      - name: Check dependency policy
        run: cargo deny --all-features check bans licenses

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets --locked

      - name: Run tests
        run: cargo test --workspace --all-targets --locked

      - name: Run multimodal tests with all features
        run: cargo test -p dynamo-multimodal --all-targets --all-features --locked

      - name: Run parser recovery work-bound tests
        run: cargo test --locked -p dynamo-parsers-v2 --features test-utils --test gemma4_native_recovery

      - name: Run doctests
        run: cargo test --workspace --doc --locked

      - name: Run protocol schema tests
        run: cargo test -p dynamo-protocols --features protocol-schema --locked

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Verify crates are publishable
        run: cargo publish --workspace --dry-run --locked

  # Validate the maintained conformance viewer and its source resources.
  # Python + PyYAML/Selenium — no engines (vLLM/SGLang conformance runs in
  # dynamo's CI lanes; here the engine lanes are on-demand/local).
  conformance-table:
    needs: changes
    if: ${{ needs.changes.outputs.conformance == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    # Render cost scales with the number of peer version dirs: every <impl>-<version>
    # is another compare candidate on every cell. main sat at ~8m24s of a 10m budget,
    # so adding the vLLM 0.26.0 / vLLM Rust 0.24.0+0.26.0 captures timed the job out.
    # Raised to match the `rust` lane's headroom. If this creeps toward 20m, the fix is
    # to make the render cheaper (or shard it), not to raise the ceiling again.
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Fixture shards live in-repo under conformance/fixtures/ via git-lfs;
          # the render + guard steps extract them locally on first use.
          lfs: true
          # The renderer needs release tags to distinguish releases from changed source.
          fetch-depth: 0

      - name: Configure GitHub Pages
        if: ${{ github.ref == 'refs/heads/main' }}
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      # Single stable entry point: validate the browser catalog, fixture coverage,
      # legacy storage, and invariant tests.
      # Add/change conformance gates in check.sh's run_ci(), NOT here — this
      # workflow step should never need another edit for a new gate.
      - name: Conformance gate (catalog + lint + invariants)
        run: |
          python3 -m venv /tmp/pvenv
          /tmp/pvenv/bin/pip install --quiet pyyaml pytest pytest-xdist selenium
          PATH="/tmp/pvenv/bin:$PATH" PYTEST_ADDOPTS="--numprocesses=4 --dist=loadfile --no-loadscope-reorder --durations=25" conformance/utils/check.sh ci

      - name: Prepare GitHub Pages artifact
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          python3 conformance/utils/src/publish_viewer.py --output "$RUNNER_TEMP/pages" --revision "$GITHUB_SHA"

      - name: Upload GitHub Pages artifact
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: ${{ runner.temp }}/pages

      - name: Comment on PR
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/pull-request/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${GITHUB_REF_NAME#pull-request/}"
          gh pr comment "$PR_NUMBER" \
            --edit-last --create-if-none \
            --body "📊 **Parser conformance viewer** validated — [view in CI summary](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"

  deploy-pages:
    name: Deploy conformance matrix to GitHub Pages
    needs: conformance-table
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
