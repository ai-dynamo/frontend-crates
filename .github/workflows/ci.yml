name: ci

on:
  push:
    # `pull-request/<n>` is the internal mirror branch copy-pr-bot pushes after a
    # maintainer runs `/ok to test <sha>`. External contributions run CI from the
    # mirror so maintainers vet the code before it executes with repo access.
    branches:
      - main
      - "pull-request/[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Decide which optional jobs need to run for this change. `conformance-table`
  # is expensive (downloads the private fixture dataset, renders both charts) and
  # is only affected by conformance/parser changes, so skip it otherwise.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      conformance: ${{ steps.filter.outputs.conformance }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Detect conformance/parser changes
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            conformance:
              - 'conformance/**'
              - 'parsers/**'
              - '.github/workflows/ci.yml'

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_DENY_VERSION: "0.19.4"
      CARGO_MACHETE_VERSION: "0.9.2"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Fixture shards live in-repo under conformance/fixtures/ via git-lfs;
          # cargo test extracts them locally (extract_fixtures.py, stdlib-only).
          lfs: true

      - name: Install Rust
        run: rustup toolchain install

      - name: Cache cargo tools
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-machete
          key: ${{ runner.os }}-cargo-tools-deny-${{ env.CARGO_DENY_VERSION }}-machete-${{ env.CARGO_MACHETE_VERSION }}-${{ hashFiles('rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-tools-

      - name: Install cargo tools
        run: |
          cargo-deny --version 2>/dev/null | grep -qF "${CARGO_DENY_VERSION}" || cargo install "cargo-deny@${CARGO_DENY_VERSION}" --locked
          cargo-machete --version 2>/dev/null | grep -qF "${CARGO_MACHETE_VERSION}" || cargo install "cargo-machete@${CARGO_MACHETE_VERSION}" --locked

      - name: Check unused dependencies
        run: cargo machete

      - name: Check dependency policy
        run: cargo deny --all-features check bans licenses

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets --locked

      - name: Run tests
        run: cargo test --workspace --all-targets --locked

      - name: Run doctests
        run: cargo test --workspace --doc --locked

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Verify crates are publishable
        run: cargo publish --workspace --dry-run --locked

  # Render-smoke for the vendored conformance-table generator. Catches generator/fixture
  # breakage. Python + pyyaml/jinja2 only — no engines (vLLM/SGLang conformance runs in
  # dynamo's CI lanes; here the engine lanes are on-demand/local).
  conformance-table:
    needs: changes
    if: ${{ needs.changes.outputs.conformance == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Fixture shards live in-repo under conformance/fixtures/ via git-lfs;
          # the render + guard steps extract them locally on first use.
          lfs: true

      - name: Render conformance matrix (no engines)
        run: |
          python3 -m venv /tmp/pvenv
          /tmp/pvenv/bin/pip install --quiet pyyaml jinja2 pytest
          PATH="/tmp/pvenv/bin:$PATH" conformance/utils/render_table_v1.sh
          PATH="/tmp/pvenv/bin:$PATH" conformance/utils/render_table_v2.sh
          OUT=conformance/PARITY_v1.html
          test -s "$OUT"
          grep -q "TOOLCALLING.batch" "$OUT"
          grep -q "REASONING.batch" "$OUT"
          test -s conformance/CONFORMANCE_v2.html
          echo "conformance matrix rendered: $(wc -c < "$OUT") bytes"
          cp "$OUT" conformance/utils/CONFORMITY.html

      # Structural regression guards on the rendered charts + JSON data model: parser
      # selectors present, every candidate versioned from fixture provenance (not the
      # live Cargo.toml), all peer versions present, no "not yet implemented", coloring
      # intact, and the model's structural invariants (DIS-2434). Reuse the HTML above.
      # See test_chart_invariants.py / test_model.py / test_stream_on_batch.py.
      - name: Model + parser invariants
        run: |
          PATH="/tmp/pvenv/bin:$PATH" python3 -m pytest \
            conformance/utils/tests/test_model.py \
            conformance/utils/tests/test_stream_on_batch.py -q

      - name: Upload conformance matrix
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: conformity-html
          path: conformance/utils/CONFORMITY.html
          retention-days: 14

      - name: Comment on PR
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/pull-request/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${GITHUB_REF_NAME#pull-request/}"
          gh pr comment "$PR_NUMBER" \
            --edit-last --create-if-none \
            --body "📊 **Conformance matrix** rendered — [view in CI summary](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
