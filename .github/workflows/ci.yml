name: ci

on:
  push:
    # `pull-request/<n>` is the internal mirror branch copy-pr-bot pushes after a
    # maintainer runs `/ok to test <sha>`. External contributions run CI from the
    # mirror so maintainers vet the code before it executes with repo access.
    branches:
      - main
      - "pull-request/[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Decide which optional jobs need to run for this change. `conformance-table`
  # is expensive (downloads the private fixture dataset, renders both charts) and
  # is only affected by conformance/parser changes, so skip it otherwise.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      conformance: ${{ steps.filter.outputs.conformance }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Detect conformance/parser changes
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            conformance:
              - 'conformance/**'
              - 'parsers/**'
              - '.github/workflows/ci.yml'

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_DENY_VERSION: "0.19.4"
      CARGO_MACHETE_VERSION: "0.9.2"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Fixture shards live in-repo under conformance/fixtures/ via git-lfs;
          # cargo test extracts them locally (extract_fixtures.py, stdlib-only).
          lfs: true

      - name: Install Rust
        run: rustup toolchain install

      - name: Cache cargo tools
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-machete
          key: ${{ runner.os }}-cargo-tools-deny-${{ env.CARGO_DENY_VERSION }}-machete-${{ env.CARGO_MACHETE_VERSION }}-${{ hashFiles('rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-tools-

      - name: Install cargo tools
        run: |
          cargo-deny --version 2>/dev/null | grep -qF "${CARGO_DENY_VERSION}" || cargo install "cargo-deny@${CARGO_DENY_VERSION}" --locked
          cargo-machete --version 2>/dev/null | grep -qF "${CARGO_MACHETE_VERSION}" || cargo install "cargo-machete@${CARGO_MACHETE_VERSION}" --locked

      - name: Check unused dependencies
        run: cargo machete

      - name: Check dependency policy
        run: cargo deny --all-features check bans licenses

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets --locked

      - name: Run tests
        run: cargo test --workspace --all-targets --locked

      - name: Run doctests
        run: cargo test --workspace --doc --locked

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Verify crates are publishable
        run: cargo publish --workspace --dry-run --locked

  # Render-smoke for the vendored conformance-table generator. Catches generator/fixture
  # breakage. Python + pyyaml/jinja2 only — no engines (vLLM/SGLang conformance runs in
  # dynamo's CI lanes; here the engine lanes are on-demand/local).
  conformance-table:
    needs: changes
    if: ${{ needs.changes.outputs.conformance == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    # Render cost scales with the number of peer version dirs: every <impl>-<version>
    # is another compare candidate on every cell. main sat at ~8m24s of a 10m budget,
    # so adding the vLLM 0.26.0 / vLLM Rust 0.24.0+0.26.0 captures timed the job out.
    # Raised to match the `rust` lane's headroom. If this creeps toward 20m, the fix is
    # to make the render cheaper (or shard it), not to raise the ceiling again.
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Fixture shards live in-repo under conformance/fixtures/ via git-lfs;
          # the render + guard steps extract them locally on first use.
          lfs: true

      - name: Configure GitHub Pages
        if: ${{ github.ref == 'refs/heads/main' }}
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      # Single stable entry point: render both charts, structural sanity, fixture-
      # coverage + marker-registration lint (DIS-2442), chart-invariant guards.
      # Add/change conformance gates in check.sh's run_ci(), NOT here — this
      # workflow step should never need another edit for a new gate.
      - name: Conformance gate (render + lint + invariants)
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python3 -m venv /tmp/pvenv
          /tmp/pvenv/bin/pip install --quiet pyyaml jinja2 pytest
          render_args=()
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            test -n "$PAGES_BASE_URL"
            render_args=(
              --github-repository "$GITHUB_REPOSITORY"
              --github-revision "$GITHUB_SHA"
              --fixture-base-url "${PAGES_BASE_URL%/}/fixtures/"
            )
          fi
          PATH="/tmp/pvenv/bin:$PATH" conformance/utils/check.sh ci "${render_args[@]}"

      - name: Upload conformance matrix
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: conformity-html
          path: conformance/utils/CONFORMITY.html
          retention-days: 14

      - name: Prepare GitHub Pages artifact
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/pages"
          fixtures_root="$(python3 conformance/utils/src/extract_fixtures.py)"
          mkdir -p "$site"
          cp conformance/CONFORMANCE_v2.html "$site/index.html"
          for relative in \
            toolcalling/fixtures-batch-v1/inputs \
            toolcalling/fixtures-stream-v2/inputs \
            reasoning/fixtures-v1/inputs
          do
            test -d "$fixtures_root/$relative"
            mkdir -p "$site/fixtures/$(dirname "$relative")"
            cp -R "$fixtures_root/$relative" "$site/fixtures/$relative"
          done
          if find "$site" -type l -print -quit | grep -q .; then
            echo "GitHub Pages artifact must not contain symbolic links" >&2
            exit 1
          fi
          if find "$site" -type f -links +1 -print -quit | grep -q .; then
            echo "GitHub Pages artifact must not contain hard links" >&2
            exit 1
          fi

      - name: Upload GitHub Pages artifact
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: ${{ runner.temp }}/pages

      - name: Comment on PR
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/pull-request/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${GITHUB_REF_NAME#pull-request/}"
          gh pr comment "$PR_NUMBER" \
            --edit-last --create-if-none \
            --body "📊 **Conformance matrix** rendered — [view in CI summary](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"

  deploy-pages:
    name: Deploy conformance matrix to GitHub Pages
    needs: conformance-table
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
