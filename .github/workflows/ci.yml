name: ci

on:
  push:
    # `pull-request/<n>` is the internal mirror branch copy-pr-bot pushes after a
    # maintainer runs `/ok to test <sha>`. External contributions run CI from the
    # mirror so maintainers vet the code before it executes with repo access.
    branches:
      - main
      - "pull-request/[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-artifacts-${{ github.run_id }}
  cancel-in-progress: false

env:
  CONFORMANCE_INCLUDE_HISTORY: "true"
  CONFORMANCE_COVERAGE: exhaustive

jobs:
  # PRs and main qualify the same history artifact; required checks never depend on path filters.
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      validation_matrix: ${{ steps.validation.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Select complete validation matrix
        id: validation
        run: |
          matrix=$(python3 conformance/utils/src/ci_plan.py --matrix)
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  structural-tag-compat:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Rust
        run: rustup toolchain install
      - name: Install lean XGrammar 0.2.7 compatibility verifier
        run: |
          python3 -m venv /tmp/structural-tag-compat
          /tmp/structural-tag-compat/bin/pip install --no-deps -r conformance/utils/structural-tag-requirements.in
          /tmp/structural-tag-compat/bin/pip install --no-deps xgrammar==0.2.7
      - name: Execute structural-tag contracts
        env:
          CONFORMANCE_GRAMMAR_PYTHON: /tmp/structural-tag-compat/bin/python
          CONFORMANCE_GRAMMAR_VERSION: "0.2.7"
        run: cargo test --locked -p dynamo-parsers-v2 --test structural_tag_xgrammar -- --ignored --nocapture

  rust:
    runs-on:
      group: Fastchecker
    timeout-minutes: 40
    env:
      CARGO_DENY_VERSION: "0.19.4"
      CARGO_MACHETE_VERSION: "0.9.2"
      CARGO_NEXTEST_VERSION: "0.9.145"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Current fixture YAML is local; cargo tests materialize it without
          # a publisher build or history access.
          lfs: true
          # Release identity compares parser source with the release tag.
          fetch-depth: 0

      - name: Install Rust
        run: rustup toolchain install

      - name: Install supported Python for PyO3
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install cargo tools
        uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2.87.16
        with:
          tool: cargo-deny@${{ env.CARGO_DENY_VERSION }},cargo-machete@${{ env.CARGO_MACHETE_VERSION }},cargo-nextest@${{ env.CARGO_NEXTEST_VERSION }}

      - name: Cache workspace compilation
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps
            target/release/.fingerprint
            target/release/build
            target/release/deps
          key: ${{ runner.os }}-workspace-v2-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-workspace-v2-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-

      - name: Rust checks
        id: rust
        run: ci/rust.sh

      - name: Retain executed capture comparisons
        if: ${{ !cancelled() && steps.rust.outputs.capture_report_directory != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capture-verification
          path: ${{ steps.rust.outputs.capture_report_directory }}/*.json
          if-no-files-found: error
      - name: Run parser arbitrary-precision feature mode
        run: cargo test --locked -p dynamo-parsers-v2 --features arbitrary-precision --lib --test harmony_continuation_allocations

  # Validate the maintained conformance viewer and its source resources.
  # Python + PyYAML/Selenium — no engines (vLLM/SGLang conformance runs in
  # dynamo's CI lanes; here the engine lanes are on-demand/local).
  pages-build:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout publication sources
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          lfs: true
          fetch-depth: 0
      - name: Configure publication output
        run: python3 conformance/utils/src/ci_publication.py configure
      - name: Install publication identity dependencies
        run: python3 conformance/utils/src/ci_plan.py --setup
      - name: Identify exact publication inputs and reader
        id: identity
        run: python3 conformance/utils/src/ci_publication.py identify
      - name: Restore exact publication cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ runner.temp }}/native-publication
          key: ${{ runner.os }}-native-publication-v4-${{ github.ref }}-${{ steps.identity.outputs.key }}
      - name: Admit cached publication or fall back to cold generation
        id: cache
        run: python3 conformance/utils/src/ci_publication.py restore --identity '${{ steps.identity.outputs.key }}'
      - name: Install locked production JavaScript bundler
        if: ${{ steps.cache.outputs.usable != 'true' }}
        uses: ./.github/actions/conformance-viewer-build
      # The required Rust lane owns publisher unit/integration tests. The
      # qualification jobs below exercise this release binary on the full store.
      - name: Build native publisher
        if: ${{ steps.cache.outputs.usable != 'true' }}
        run: python3 conformance/utils/src/ci_publication.py build
      - name: Snapshot permanent evidence and YAML paths
        if: ${{ steps.cache.outputs.usable != 'true' }}
        run: python3 conformance/utils/src/ci_publication.py snapshot
      - name: Restore compatible family conversion fragments
        if: ${{ steps.cache.outputs.usable != 'true' }}
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ runner.temp }}/conversion-cache
          key: ${{ runner.os }}-conversion-v1-${{ github.ref }}-${{ steps.identity.outputs.key }}
          restore-keys: |
            ${{ runner.os }}-conversion-v1-${{ github.ref }}-
      - name: Generate source catalog inputs
        if: ${{ steps.cache.outputs.usable != 'true' }}
        run: python3 conformance/utils/src/ci_publication.py catalog
      - name: Publish native site
        if: ${{ steps.cache.outputs.usable != 'true' }}
        run: python3 conformance/utils/src/ci_publication.py publish
      - name: Verify publication preserved evidence without per-case YAML expansion
        if: ${{ steps.cache.outputs.usable != 'true' }}
        run: python3 conformance/utils/src/ci_publication.py verify
      - name: Bind publication metadata to this commit
        run: python3 conformance/utils/src/ci_publication.py stamp
      - name: Package candidate site and matching binary
        run: python3 conformance/utils/src/ci_publication.py package
      - name: Seal reusable publication payload
        run: python3 conformance/utils/src/ci_publication.py seal --identity '${{ steps.identity.outputs.key }}'
      - name: Retain candidate inputs for independent qualification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: conformance-native-publication
          path: ${{ runner.temp }}/native-publication/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Retain generated site if candidate packaging failed
        if: ${{ !cancelled() && failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: conformance-site-candidate
          path: ${{ runner.temp }}/pages/
          retention-days: 7
          if-no-files-found: ignore

  conformance-fixtures:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CONFORMANCE_SELECTION_DIR: /tmp/conformance-selection
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Fixture shards live in-repo under conformance/fixtures/ via git-lfs;
          # the render + guard steps extract them locally on first use.
          lfs: true
          # The renderer needs release tags to distinguish releases from changed source.
          fetch-depth: 0

      - name: Build isolated-fixture publisher
        run: cargo build --locked --release -p conformance-publisher
      - name: Fixture-only checks (start alongside publication)
        run: python3 conformance/utils/src/ci_plan.py --setup --run fixtures
      - name: Retain complete collection baseline
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: conformance-test-baseline
          path: ${{ runner.temp }}/baseline-selection/*.json
          if-no-files-found: error
      - name: Retain collected test assignments
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: conformance-selection-${{ github.job }}-${{ strategy.job-index }}
          path: /tmp/conformance-selection/*.json
          if-no-files-found: error


  # Every plan entry gets its own runner; workload policy lives in ci_plan.py.
  conformance-check:
    name: conformance-check (${{ matrix.id }})
    needs: [prepare, pages-build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.validation_matrix) }}
    env:
      CONFORMANCE_SELECTION_DIR: /tmp/conformance-selection
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          lfs: true
          fetch-depth: 0
      - name: Restore candidate publication for qualification
        uses: ./.github/actions/conformance-publication
      - name: Install bundler for isolated publication fixtures
        if: ${{ matrix.bundler }}
        uses: ./.github/actions/conformance-viewer-build
      - name: Run planned validation
        env:
          PLAN_LANE: ${{ matrix.lane }}
          PLAN_INDEX: ${{ matrix.index }}
          PLAN_COUNT: ${{ matrix.count }}
        run: python3 conformance/utils/src/ci_plan.py --setup --run "$PLAN_LANE" --index "$PLAN_INDEX" --count "$PLAN_COUNT"
      - name: Retain collected test assignments
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: conformance-selection-${{ github.job }}-${{ strategy.job-index }}
          path: /tmp/conformance-selection/*.json
          if-no-files-found: error


  conformance-table:
    needs: [prepare, rust, structural-tag-compat, pages-build, conformance-fixtures, conformance-check]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      validation: ${{ steps.accounting.outcome }}
    permissions:
      contents: read
      pages: read
      actions: read
    steps:
      - name: Checkout qualified source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          lfs: true
          fetch-depth: 0
      - name: Install gate dependencies
        run: python3 conformance/utils/src/ci_plan.py --setup
      - name: Require every validation job
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$NEEDS_JSON" > "$RUNNER_TEMP/validation-results.json"
          python3 conformance/utils/src/verify_ci_selection.py --job-results "$RUNNER_TEMP/validation-results.json" 2>&1 | tee "$RUNNER_TEMP/validation-jobs.log"
      - name: Restore qualified publication
        uses: ./.github/actions/conformance-publication
      - name: Restore latest accounting transfers by creation time
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 conformance/utils/src/ci_publication_finalize.py receipts
      - name: Select fresh or retained receipts once per artifact
        run: python3 conformance/utils/src/ci_publication.py selections
      - name: Account for every collected test before publication
        id: accounting
        shell: bash
        run: |
          python3 conformance/utils/src/verify_ci_selection.py --baseline "$RUNNER_TEMP/baseline-selection" --selections "$RUNNER_TEMP/assignments" --require-history --publication "$CONFORMANCE_PUBLISHED_SITE" --revision "$GITHUB_SHA" 2>&1 | tee "$RUNNER_TEMP/validation-accounting.log"

      - name: Configure GitHub Pages
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Upload GitHub Pages artifact
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: ${{ runner.temp }}/pages

      - name: Retain validation results and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: conformance-validation
          path: |
            ${{ runner.temp }}/validation-results.json
            ${{ runner.temp }}/validation-jobs.log
            ${{ runner.temp }}/validation-accounting.log
          retention-days: 7
          if-no-files-found: error

  deploy-pages:
    name: Deploy conformance matrix to GitHub Pages
    needs: conformance-table
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout deployed source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          lfs: true
          fetch-depth: 0
      - name: Restore deployed publication
        uses: ./.github/actions/conformance-publication
      - name: Install delivery dependencies
        run: python3 conformance/utils/src/ci_plan.py --setup
      - name: Check candidate is still current main
        id: current
        run: python3 conformance/utils/src/ci_publication.py current
      - name: Check Pages transfer availability after cleanup
        if: ${{ steps.current.outputs.current == 'true' }}
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 conformance/utils/src/ci_publication.py pages-needed
      - name: Recreate Pages transfer for a deployment rerun
        if: ${{ steps.pages.outputs.needed == 'true' }}
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: ${{ runner.temp }}/pages
      - name: Deploy GitHub Pages
        if: ${{ steps.current.outputs.current == 'true' }}
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
      - name: Verify public artifact and browser journey
        if: ${{ steps.current.outputs.current == 'true' }}
        env:
          PUBLICATION_URL: ${{ steps.deployment.outputs.page_url }}
          CONFORMANCE_DELIVERY_REPORT: ${{ runner.temp }}/conformance-delivery.json
        run: python3 conformance/utils/src/ci_publication.py delivery --url "$PUBLICATION_URL"
      - name: Retain delivery evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: conformance-delivery-${{ github.sha }}
          path: |
            ${{ runner.temp }}/conformance-delivery.json
            ${{ runner.temp }}/conformance-deployment.json
          if-no-files-found: error

  finalize-publication:
    needs: [conformance-table, deploy-pages]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - name: Checkout finalization tools
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Collect generated site and available evidence
        id: collect
        run: python3 conformance/utils/src/ci_publication_finalize.py collect
      # Reruns have a new artifact namespace. Never use overwrite: it deletes
      # the previous publication before the replacement upload can succeed.
      - name: Retain one downloadable publication
        if: ${{ steps.collect.outputs.available == 'true' }}
        id: publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: conformance-publication
          path: ${{ runner.temp }}/conformance-publication/
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: error
      - name: Link publication from summary and PR
        if: ${{ steps.publication.outputs.artifact-id != '' }}
        env:
          ARTIFACT_ID: ${{ steps.publication.outputs.artifact-id }}
        run: python3 conformance/utils/src/ci_publication_finalize.py announce --artifact-id "$ARTIFACT_ID"
