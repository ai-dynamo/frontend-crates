suite_exemptions:
  harmony_text:
    toolcalling.batch: harmony_text is the text-driven conformance variant of harmony; the v1 batch corpus is captured under the harmony family.
  muse_glimmer:
    toolcalling.batch: muse has no v1 batch parser; it is captured through the legacy stream-v1 and unified corpora only.

