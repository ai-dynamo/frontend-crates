[package]
name = "dynamo-conformance"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
description = "Runs the vendored Dynamo parity fixtures against dynamo-parsers (DIS-2159)"
publish = false

[dev-dependencies]
dynamo-parsers = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = "0.9"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
