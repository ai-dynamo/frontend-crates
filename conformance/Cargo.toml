[package]
name = "dynamo-conformance-fixtures-v2"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
description = "Runs the authored Unified parser corpus against registered implementations"
publish = false

[dependencies]
anyhow = { workspace = true }
dynamo-parsers-v2 = { path = "../parsers/v2", version = "0.9.11" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }
serde_yaml = "0.9"

[dev-dependencies]
dynamo-parsers = { workspace = true }
dynamo-protocols = { workspace = true }
dynamo-renderer = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
