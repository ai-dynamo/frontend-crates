# Streaming fixture (per-chunk, per-impl). Each chunk: input (delta_text +
# optional delta_token_ids) and `expected.<impl>` = tool-call deltas emitted at
# that chunk. `normal_text.<impl>` (when non-empty) = non-tool text (leaks show
# here). Assembled result is derived by concatenating per index. A delta:
# {index, id?, name?, arguments?}; id:true = an id was emitted.

family: llama3_json
model_label: 'Llama 3 (JSON fmt)'
mode: streamv2
captured_with:
  vllm: '0.22.0'
  sglang: '0.5.12.post1'
cases:
  TOOLCALLING.streamv2.2.a:
    description: 'Parallel calls (semicolon-separated)'
    ref: 'derived from TOOLCALLING.batch.2.a'
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    - name: get_time
      parameters:
        type: object
        properties:
          timezone:
            type: string
    unavailable:
      dynamo: 'Dynamo parser v2 TC streaming not yet implemented for this family; vLLM/SGLang per-chunk output is the target to match.'
    chunks:
    - delta_text: '<|python_tag|>{"name":'
      expected:
        vllm: []
        sglang: []
    - delta_text: ' "get_weather",'
      expected:
        vllm:
        - {index: 0, id: true, name: 'get_weather'}
        sglang:
        - {index: 0, name: 'get_weather'}
    - delta_text: ' "arguments": {"location": "NYC"}};{"name":'
      expected:
        vllm:
        - {index: 0, arguments: '{"location": "NYC"}'}
        sglang:
        - {index: 0, arguments: '{"location": "NYC"}'}
    - delta_text: ' "get_time", "arguments":'
      expected:
        vllm: []
        sglang:
        - {index: 1, name: 'get_time'}
    - delta_text: ' {"timezone":'
      expected:
        vllm: []
        sglang: []
    - delta_text: ' "EST"}}'
      expected:
        vllm: []
        sglang:
        - {index: 1, arguments: '{"timezone": "EST"}'}
    - delta_text: ''
      finish_reason: tool_calls
      expected:
        vllm: []
        sglang: []
  TOOLCALLING.streamv2.2.c:
    description: 'With surrounding narration'
    ref: 'derived from TOOLCALLING.batch.2.c'
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    - name: get_time
      parameters:
        type: object
        properties:
          timezone:
            type: string
    unavailable:
      dynamo: 'Dynamo parser v2 TC streaming not yet implemented for this family; vLLM/SGLang per-chunk output is the target to match.'
    chunks:
    - delta_text: 'Both: <|python_tag|>'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: 'Both: <|python_tag|>'
    - delta_text: '{"name":'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: '{"name":'
    - delta_text: ' "get_weather", "arguments": {"location":'
      expected:
        vllm: []
        sglang:
        - {index: 0, name: 'get_weather'}
      normal_text:
        vllm: ' "get_weather", "arguments": {"location":'
    - delta_text: ' "NYC"}};{"name": "get_time",'
      expected:
        vllm: []
        sglang:
        - {index: 0, arguments: '{"location": "NYC"}'}
      normal_text:
        vllm: ' "NYC"}};{"name": "get_time",'
    - delta_text: ' "arguments":'
      expected:
        vllm: []
        sglang:
        - {index: 1, name: 'get_time'}
      normal_text:
        vllm: ' "arguments":'
    - delta_text: ' {"timezone": "EST"}}'
      expected:
        vllm: []
        sglang:
        - {index: 1, arguments: '{"timezone": "EST"}'}
      normal_text:
        vllm: ' {"timezone": "EST"}}'
    - delta_text: ' Done.'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: ' Done.'
        sglang: ' Done.'
    - delta_text: ''
      finish_reason: tool_calls
      expected:
        vllm: []
        sglang: []
  TOOLCALLING.streamv2.2.d:
    description: 'Same-name twice (semicolon-separated)'
    ref: 'derived from TOOLCALLING.batch.2.d'
    tools:
    - &id001
      name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    - *id001
    unavailable:
      dynamo: 'Dynamo parser v2 TC streaming not yet implemented for this family; vLLM/SGLang per-chunk output is the target to match.'
    chunks:
    - delta_text: '<|python_tag|>{"name":'
      expected:
        vllm: []
        sglang: []
    - delta_text: ' "get_weather",'
      expected:
        vllm:
        - {index: 0, id: true, name: 'get_weather'}
        sglang:
        - {index: 0, name: 'get_weather'}
    - delta_text: ' "arguments": {"location": "NYC"}};{"name":'
      expected:
        vllm:
        - {index: 0, arguments: '{"location": "NYC"}'}
        sglang:
        - {index: 0, arguments: '{"location": "NYC"}'}
    - delta_text: ' "get_weather", "arguments":'
      expected:
        vllm: []
        sglang:
        - {index: 1, name: 'get_weather'}
    - delta_text: ' {"location":'
      expected:
        vllm: []
        sglang: []
    - delta_text: ' "LA"}}'
      expected:
        vllm: []
        sglang:
        - {index: 1, arguments: '{"location": "LA"}'}
    - delta_text: ''
      finish_reason: tool_calls
      expected:
        vllm: []
        sglang: []
