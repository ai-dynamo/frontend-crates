# Streaming fixture (per-chunk, per-impl). Each chunk: input (delta_text +
# optional delta_token_ids) and `expected.<impl>` = tool-call deltas emitted at
# that chunk. `normal_text.<impl>` (when non-empty) = non-tool text (leaks show
# here). Assembled result is derived by concatenating per index. A delta:
# {index, id?, name?, arguments?}; id:true = an id was emitted.

family: llama3_json
model_label: 'Llama 3 (JSON fmt)'
mode: streamv2
captured_with:
  vllm_rust: 'v0.23.0 78743ab5bffd381e88f97e1c8ba20473b0ae6d75'
  vllm_python: '0.23.0'
  sglang_python: '0.5.12.post1'
cases:
  TOOLCALLING.streamv2.2.a:
    description: 'Parallel calls (semicolon-separated)'
    ref: 'derived from TOOLCALLING.batch.2.a'
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    - name: get_time
      parameters:
        type: object
        properties:
          timezone:
            type: string
    unavailable:
      dynamo_rust: 'Dynamo parser v2 TC streaming not yet implemented for this family; vLLM Python/SGLang per-chunk output is the target to match.'
    chunks:
    - delta_text: '<|python_tag|>{"name":'
      expected:
        vllm_rust: []
        vllm_python: []
        sglang_python: []
      normal_text:
        vllm_rust: '<|python_tag|>{"name":'
    - delta_text: ' "get_weather",'
      expected:
        vllm_rust: []
        vllm_python:
        - {index: 0, id: true, name: 'get_weather'}
        sglang_python:
        - {index: 0, name: 'get_weather'}
      normal_text:
        vllm_rust: ' "get_weather",'
    - delta_text: ' "arguments": {"location": "NYC"}};{"name":'
      expected:
        vllm_rust: []
        vllm_python:
        - {index: 0, arguments: '{"location": "NYC"}'}
        sglang_python:
        - {index: 0, arguments: '{"location": "NYC"}'}
      normal_text:
        vllm_rust: ' "arguments": {"location": "NYC"}};{"name":'
    - delta_text: ' "get_time", "arguments":'
      expected:
        vllm_rust: []
        vllm_python: []
        sglang_python:
        - {index: 1, name: 'get_time'}
      normal_text:
        vllm_rust: ' "get_time", "arguments":'
    - delta_text: ' {"timezone":'
      expected:
        vllm_rust: []
        vllm_python: []
        sglang_python: []
      normal_text:
        vllm_rust: ' {"timezone":'
    - delta_text: ' "EST"}}'
      expected:
        vllm_rust: []
        vllm_python: []
        sglang_python:
        - {index: 1, arguments: '{"timezone": "EST"}'}
      normal_text:
        vllm_rust: ' "EST"}}'
    - delta_text: ''
      finish_reason: tool_calls
      expected:
        vllm_rust: []
        vllm_python: []
        sglang_python: []
  TOOLCALLING.streamv2.2.c:
    description: 'With surrounding narration'
    dynamo_note: 'Llama 3.x publishes only a prompt-format/chat-template spec (an encoder); its ''no prefix or suffix'' line instructs the model, not a parser but is silent on natural-language text that follows the tool-call block. The model can emit trailing or inter-call prose, and nothing in the spec dictates whether a parser keeps or drops it; both readings are defensible. Because dropping silently discards genuine user-facing assistant text, Dynamo keeps it — it strips only the tool-call markup and preserves the surrounding narration verbatim. No published rule is violated, because the spec does not address this case. Source: https://raw.githubusercontent.com/meta-llama/llama-models/main/models/llama3_1/prompt_format.md'
    ref: 'derived from TOOLCALLING.batch.2.c'
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    - name: get_time
      parameters:
        type: object
        properties:
          timezone:
            type: string
    unavailable:
      dynamo_rust: 'Dynamo parser v2 TC streaming not yet implemented for this family; vLLM Python/SGLang per-chunk output is the target to match.'
    chunks:
    - delta_text: 'Both: <|python_tag|>'
      expected:
        vllm_rust: []
        vllm_python: []
        sglang_python: []
      normal_text:
        vllm_rust: 'Both: <|python_tag|>'
        vllm_python: 'Both: <|python_tag|>'
    - delta_text: '{"name":'
      expected:
        vllm_rust: []
        vllm_python: []
        sglang_python: []
      normal_text:
        vllm_rust: '{"name":'
        vllm_python: '{"name":'
    - delta_text: ' "get_weather", "arguments": {"location":'
      expected:
        vllm_rust: []
        vllm_python: []
        sglang_python:
        - {index: 0, name: 'get_weather'}
      normal_text:
        vllm_rust: ' "get_weather", "arguments": {"location":'
        vllm_python: ' "get_weather", "arguments": {"location":'
    - delta_text: ' "NYC"}};{"name": "get_time",'
      expected:
        vllm_rust: []
        vllm_python: []
        sglang_python:
        - {index: 0, arguments: '{"location": "NYC"}'}
      normal_text:
        vllm_rust: ' "NYC"}};{"name": "get_time",'
        vllm_python: ' "NYC"}};{"name": "get_time",'
    - delta_text: ' "arguments":'
      expected:
        vllm_rust: []
        vllm_python: []
        sglang_python:
        - {index: 1, name: 'get_time'}
      normal_text:
        vllm_rust: ' "arguments":'
        vllm_python: ' "arguments":'
    - delta_text: ' {"timezone": "EST"}}'
      expected:
        vllm_rust: []
        vllm_python: []
        sglang_python:
        - {index: 1, arguments: '{"timezone": "EST"}'}
      normal_text:
        vllm_rust: ' {"timezone": "EST"}}'
        vllm_python: ' {"timezone": "EST"}}'
    - delta_text: ' Done.'
      expected:
        vllm_rust: []
        vllm_python: []
        sglang_python: []
      normal_text:
        vllm_rust: ' Done.'
        vllm_python: ' Done.'
        sglang_python: ' Done.'
    - delta_text: ''
      finish_reason: tool_calls
      expected:
        vllm_rust: []
        vllm_python: []
        sglang_python: []
