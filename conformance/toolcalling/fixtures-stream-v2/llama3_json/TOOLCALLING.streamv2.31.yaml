      normal_text:
        vllm_rust: ' ]'
    - delta_text: '"}};{"name": "get_time",'
      expected:
        vllm_rust: []
        vllm_python:
        - {index: 0, arguments: ' ]"}'}
        sglang_python:
        - {index: 0, arguments: ' ]"}'}
      normal_text:
