    - delta_text: ' "arguments":'
      expected:
        vllm_rust: []
        vllm_python: []
        sglang_python:
        - {index: 1, name: 'get_time'}
      normal_text:
        vllm_rust: ' "arguments":'
    - delta_text: ' {"timezone": "EST"}}'
      expected:
        vllm_rust: []
        vllm_python: []
        sglang_python:
        - {index: 1, arguments: '{"timezone": "EST"}'}
      normal_text:
