# Streaming fixture (per-chunk, per-impl). Each chunk: input (delta_text +
# optional delta_token_ids) and `expected.<impl>` = tool-call deltas emitted at
# that chunk. `normal_text.<impl>` (when non-empty) = non-tool text (leaks show
# here). Assembled result is derived by concatenating per index. A delta:
# {index, id?, name?, arguments?}; id:true = an id was emitted.

family: llama3_json
model_label: 'Llama 3 (JSON fmt)'
mode: streamv2
captured_with:
  vllm_rust: 'v0.23.0 78743ab5bffd381e88f97e1c8ba20473b0ae6d75'
  vllm_python: '0.23.0'
  sglang_python: '0.5.12.post1'
cases:
  TOOLCALLING.streamv2.50:
    description: 'Complete single tool call with a grammar token split across chunk boundaries'
    ref: 'derived from TOOLCALLING.batch.1'
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    unavailable:
      dynamo_rust: 'Dynamo parser v2 TC streaming not yet implemented for this family; vLLM Python/SGLang per-chunk output is the target to match.'
    chunks:
    - delta_text: '<|'
      expected:
        vllm_rust: []
        vllm_python: []
        sglang_python: []
      normal_text:
        vllm_rust: '<|'
        vllm_python: '<|'
    - delta_text: 'pyt'
      expected:
        vllm_rust: []
        vllm_python: []
        sglang_python: []
      normal_text:
        vllm_rust: 'pyt'
        vllm_python: 'pyt'
    - delta_text: 'hon_t'
      expected:
        vllm_rust: []
        vllm_python: []
        sglang_python: []
      normal_text:
        vllm_rust: 'hon_t'
        vllm_python: 'hon_t'
    - delta_text: 'ag|>{"name"'
      expected:
        vllm_rust: []
        vllm_python: []
        sglang_python: []
      normal_text:
        vllm_rust: 'ag|>{"name"'
    - delta_text: ': "get_weather", "a'
      expected:
        vllm_rust: []
        vllm_python:
        - {index: 0, id: true, name: 'get_weather'}
        sglang_python:
        - {index: 0, name: 'get_weather'}
      normal_text:
        vllm_rust: ': "get_weather", "a'
    - delta_text: 'rg'
      expected:
        vllm_rust: []
        vllm_python: []
        sglang_python: []
      normal_text:
        vllm_rust: 'rg'
    - delta_text: 'ume'
      expected:
        vllm_rust: []
        vllm_python: []
        sglang_python: []
      normal_text:
        vllm_rust: 'ume'
    - delta_text: 'nts":'
      expected:
        vllm_rust: []
        vllm_python: []
        sglang_python: []
      normal_text:
        vllm_rust: 'nts":'
    - delta_text: ' {"location'
      expected:
        vllm_rust: []
        vllm_python: []
        sglang_python: []
      normal_text:
        vllm_rust: ' {"location'
    - delta_text: '": "NYC"}}'
      expected:
        vllm_rust: []
        vllm_python:
        - {index: 0, arguments: '{"location": "NYC"}'}
        sglang_python:
        - {index: 0, arguments: '{"location": "NYC"}'}
      normal_text:
        vllm_rust: '": "NYC"}}'
    - delta_text: ''
      finish_reason: tool_calls
      expected:
        vllm_rust: []
        vllm_python:
        - {index: 0, arguments: ''}
        sglang_python: []
