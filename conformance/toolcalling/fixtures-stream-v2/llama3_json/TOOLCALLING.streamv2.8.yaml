      normal_text:
        vllm: ' Let me know'
        sglang: ' Let me know'
    - delta_text: ' if'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: ' if'
        sglang: ' if'
    - delta_text: ' you need'
      expected:
        vllm: []
