# Streaming fixture (per-chunk, per-impl). Each chunk: input (delta_text +
# optional delta_token_ids) and `expected.<impl>` = tool-call deltas emitted at
# that chunk. `normal_text.<impl>` (when non-empty) = non-tool text (leaks show
# here). Assembled result is derived by concatenating per index. A delta:
# {index, id?, name?, arguments?}; id:true = an id was emitted.

family: qwen25
model_label: 'Qwen 2.5'
mode: streamv2
captured_with:
  vllm: '0.22.0'
  sglang: '0.5.12.post1'
cases:
  TOOLCALLING.streamv2.4.a:
    description: 'Tool_call wrapper with non-JSON garbage'
    ref: 'derived from TOOLCALLING.batch.4.a'
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    unavailable:
      dynamo: 'Dynamo parser v2 TC streaming not yet implemented for this family; vLLM/SGLang per-chunk output is the target to match.'
    chunks:
    - delta_text: '<tool_call>not'
      expected:
        vllm: []
        sglang: []
      normal_text:
        sglang: '<tool_call>not'
    - delta_text: ' even'
      expected:
        vllm: []
        sglang: []
      normal_text:
        sglang: ' even'
    - delta_text: ' json</tool_call>'
      expected:
        vllm: []
        sglang: []
      normal_text:
        sglang: ' json'
    - delta_text: ''
      finish_reason: stop
      expected:
        vllm: []
        sglang: []
  TOOLCALLING.streamv2.4.b:
    description: 'Missing close brace in JSON body'
    ref: 'derived from TOOLCALLING.batch.4.b'
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    unavailable:
      dynamo: 'Dynamo parser v2 TC streaming not yet implemented for this family; vLLM/SGLang per-chunk output is the target to match.'
    chunks:
    - delta_text: '<tool_call>{"name":'
      expected:
        vllm: []
        sglang: []
      normal_text:
        sglang: '<tool_call>{"name":'
    - delta_text: ' "get_weather",'
      expected:
        vllm:
        - {index: 0, id: true, name: 'get_weather'}
        sglang: []
      normal_text:
        sglang: ' "get_weather",'
    - delta_text: ' "arguments": {"location": "NYC"</tool_call>'
      expected:
        vllm:
        - {index: 0, arguments: '{"location": "NYC"'}
        sglang: []
      normal_text:
        sglang: ' "arguments": {"location": "NYC"'
    - delta_text: ''
      finish_reason: tool_calls
      expected:
        vllm: []
        sglang: []
  TOOLCALLING.streamv2.4.c:
    description: 'Missing name key'
    ref: 'derived from TOOLCALLING.batch.4.c'
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    unavailable:
      dynamo: 'Dynamo parser v2 TC streaming not yet implemented for this family; vLLM/SGLang per-chunk output is the target to match.'
    chunks:
    - delta_text: '<tool_call>{"arguments":'
      expected:
        vllm: []
        sglang: []
      normal_text:
        sglang: '<tool_call>{"arguments":'
    - delta_text: ' {"location":'
      expected:
        vllm: []
        sglang: []
      normal_text:
        sglang: ' {"location":'
    - delta_text: ' "NYC"}}</tool_call>'
      expected:
        vllm: []
        sglang: []
      normal_text:
        sglang: ' "NYC"}}'
    - delta_text: ''
      finish_reason: stop
      expected:
        vllm: []
        sglang: []
  TOOLCALLING.streamv2.4.d:
    description: 'Missing </tool_call> close'
    ref: 'derived from TOOLCALLING.batch.4.d'
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    unavailable:
      dynamo: 'Dynamo parser v2 TC streaming not yet implemented for this family; vLLM/SGLang per-chunk output is the target to match.'
    chunks:
    - delta_text: '<tool_call>{"name":'
      expected:
        vllm: []
        sglang: []
      normal_text:
        sglang: '<tool_call>{"name":'
    - delta_text: ' "get_weather",'
      expected:
        vllm:
        - {index: 0, id: true, name: 'get_weather'}
        sglang: []
      normal_text:
        sglang: ' "get_weather",'
    - delta_text: ' "arguments": {"location": "NYC"}}'
      expected:
        vllm:
        - {index: 0, arguments: '{"location": "NYC"}'}
        sglang: []
      normal_text:
        sglang: ' "arguments": {"location": "NYC"}}'
    - delta_text: ''
      finish_reason: tool_calls
      expected:
        vllm: []
        sglang: []
