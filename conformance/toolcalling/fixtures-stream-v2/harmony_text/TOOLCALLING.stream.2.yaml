# Streaming fixture (per-chunk, per-impl). Each chunk: input (delta_text +
# optional delta_token_ids) and `expected.<impl>` = tool-call deltas emitted at
# that chunk. `normal_text.<impl>` (when non-empty) = non-tool text (leaks show
# here). Assembled result is derived by concatenating per index. A delta:
# {index, id?, name?, arguments?}; id:true = an id was emitted.

family: harmony_text
model_label: 'gpt-oss (harmony, text)'
mode: stream
captured_with:
  vllm: '0.22.0'
  sglang: '0.5.12.post1'
cases:
  TOOLCALLING.stream.2:
    description: 'Multiple tool calls split across multiple content chunks'
    ref: 'derived from TOOLCALLING.batch.2.a'
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    - name: get_time
      parameters:
        type: object
        properties:
          timezone:
            type: string
    chunks:
    - delta_text: '<|start|>'
      expected:
        dynamo: []
        vllm: []
        sglang: []
    - delta_text: 'assista'
      expected:
        dynamo: []
        vllm: []
        sglang: []
    - delta_text: 'nt<|channel|>'
      expected:
        dynamo: []
        vllm: []
        sglang: []
    - delta_text: 'comme'
      expected:
        dynamo: []
        vllm: []
        sglang: []
    - delta_text: 'ntary to=function'
      expected:
        dynamo: []
        vllm: []
        sglang: []
    - delta_text: 's.g'
      expected:
        dynamo: []
        vllm: []
        sglang: []
    - delta_text: 'et_weathe'
      expected:
        dynamo: []
        vllm: []
        sglang: []
    - delta_text: 'r <|con'
      expected:
        dynamo: []
        vllm: []
        sglang: []
    - delta_text: 'strain|>json<'
      expected:
        dynamo: []
        vllm: []
        sglang: []
    - delta_text: '|mess'
      expected:
        dynamo: []
        vllm: []
        sglang: []
    - delta_text: 'age|>{"location":'
      expected:
        dynamo: []
        vllm:
        - {index: 0, id: true, name: 'get_weather', arguments: ''}
        - {index: 0, arguments: '{"'}
        - {index: 0, arguments: 'location'}
        sglang: []
    - delta_text: '"NY'
      expected:
        dynamo: []
        vllm:
        - {index: 0, arguments: '":"'}
        - {index: 0, arguments: 'NY'}
        sglang: []
    - delta_text: 'C"}<|call'
      expected:
        dynamo:
        - {index: 0, id: true, name: 'get_weather'}
        - {index: 0, arguments: '{"'}
        vllm:
        - {index: 0, arguments: 'C'}
        - {index: 0, arguments: '"}'}
        sglang: []
    - delta_text: '|><|sta'
      expected:
        dynamo:
        - {index: 0, arguments: 'location'}
        - {index: 0, arguments: '":"'}
        - {index: 0, arguments: 'NY'}
        vllm: []
        sglang:
        - {index: 0, name: 'get_weather', arguments: '{"location": "NYC"}'}
    - delta_text: 'rt|>assistant'
      expected:
        dynamo:
        - {index: 0, arguments: 'C'}
        - {index: 0, arguments: '"}'}
        vllm: []
        sglang: []
      normal_text:
        sglang: 'rt|>assistant'
    - delta_text: '<|cha'
      expected:
        dynamo: []
        vllm: []
        sglang: []
      normal_text:
        sglang: '<|cha'
    - delta_text: 'nnel|>commentary '
