    - delta_text: '"}<|cal'
      expected:
        dynamo:
        - {index: 1, arguments: '{"'}
        vllm:
        - {index: 1, arguments: '"}'}
        sglang: []
    - delta_text: 'l|>'
      expected:
        dynamo:
        - {index: 1, arguments: 'timezone'}
        vllm: []
        sglang: []
    - delta_text: ''
      finish_reason: tool_calls
      expected:
        dynamo:
        - {index: 1, arguments: '":"'}
        - {index: 1, arguments: 'EST'}
        - {index: 1, arguments: '"}'}
        vllm: []
        sglang: []
