        vllm: []
        sglang: []
      normal_text:
        sglang: '.get_ti'
    - delta_text: 'me <|constrai'
      expected:
        dynamo: []
        vllm: []
        sglang: []
      normal_text:
        sglang: 'me <|constrai'
    - delta_text: 'n|>js'
      expected:
        dynamo: []
        vllm: []
        sglang: []
      normal_text:
        sglang: 'n|>js'
    - delta_text: 'on<|message|>{"ti'
      expected:
