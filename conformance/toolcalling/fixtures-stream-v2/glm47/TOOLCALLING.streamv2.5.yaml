    chunks:
    - delta_text: 'get_weather<arg_key>location</arg_key>'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: 'get_weather<arg_key>location</arg_key>'
        sglang: 'get_weather<arg_key>location</arg_key>'
    - delta_text: '<arg_value>'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: '<arg_value>'
        sglang: '<arg_value>'
    - delta_text: 'NYC</arg_value></tool_call>'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: 'NYC</arg_value></tool_call>'
        sglang: 'NYC</arg_value>'
    - delta_text: ''
      finish_reason: tool_calls
      expected:
        vllm: []
        sglang: []
