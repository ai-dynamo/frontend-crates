    unavailable:
      dynamo: 'Dynamo parser v2 TC streaming not yet implemented for this family; vLLM/SGLang per-chunk output is the target to match.'
    chunks:
    - delta_text: '<tool_call>get_weather<arg_key>'
      expected:
        vllm:
        - {index: 0, id: true, name: 'get_weather', arguments: ''}
        sglang:
        - {index: 0, name: 'get_weather'}
        - {index: 0, arguments: '{'}
    - delta_text: 'location</arg_key>'
      expected:
        vllm: []
        sglang:
        - {index: 0, arguments: '"location": '}
    - delta_text: '<arg_value>NYC</arg_value></tool_call>'
      expected:
        vllm:
        - {index: 0, arguments: '{"location": "NYC"}'}
        sglang:
        - {index: 0, arguments: '"NYC"'}
        - {index: 0, arguments: '}'}
    - delta_text: ' Let me'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: ' Let me'
        sglang: ' Let me'
    - delta_text: ' know'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: ' know'
        sglang: ' know'
    - delta_text: ' if you'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: ' if you'
        sglang: ' if you'
    - delta_text: ' need more.'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: ' need more.'
        sglang: ' need more.'
    - delta_text: ''
      finish_reason: tool_calls
      expected:
        vllm: []
        sglang: []
