    - delta_text: '<arg_value>NYC</arg_value></tool_call>'
      expected:
        vllm_rust:
        - {index: 0, name: 'get_weather', arguments: '{"location":"NYC"}'}
        vllm_python:
        - {index: 0, arguments: '{"location": "NYC"}'}
        sglang_python:
        - {index: 0, arguments: '"NYC"'}
        - {index: 0, arguments: '}'}
    - delta_text: ' Let me'
      expected:
        vllm_rust: []
        vllm_python: []
        sglang_python: []
      normal_text:
        vllm_python: ' Let me'
        sglang_python: ' Let me'
    - delta_text: ' know'
      expected:
        vllm_rust: []
        vllm_python: []
        sglang_python: []
      normal_text:
        vllm_python: ' know'
        sglang_python: ' know'
    - delta_text: ' if you'
      expected:
        vllm_rust: []
        vllm_python: []
        sglang_python: []
      normal_text:
        vllm_python: ' if you'
        sglang_python: ' if you'
    - delta_text: ' need more.'
      expected:
        vllm_rust: []
        vllm_python: []
        sglang_python: []
      normal_text:
        vllm_python: ' need more.'
        sglang_python: ' need more.'
    - delta_text: ''
      finish_reason: tool_calls
      expected:
        vllm_rust: []
        vllm_python: []
        sglang_python: []
