    ref: derived from TOOLCALLING.batch.2.b
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    - name: get_time
      parameters:
        type: object
        properties:
          timezone:
            type: string
    chunks:
    - delta_text: <|tool_calls_section_begin|><|tool_call_begin|>
