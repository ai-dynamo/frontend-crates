    ref: derived from TOOLCALLING.batch.2.c
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    - name: get_time
      parameters:
        type: object
        properties:
          timezone:
            type: string
    chunks:
    - delta_text: I will
    - delta_text: ' check'
    - delta_text: ' both. <|tool_calls_section_begin|><|tool_call_begin|>'
