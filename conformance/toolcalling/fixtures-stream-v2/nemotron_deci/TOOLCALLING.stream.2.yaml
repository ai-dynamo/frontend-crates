# Streaming fixture (per-chunk, per-impl). Each chunk: input (delta_text +
# optional delta_token_ids) and `expected.<impl>` = tool-call deltas emitted at
# that chunk. `normal_text.<impl>` (when non-empty) = non-tool text (leaks show
# here). Assembled result is derived by concatenating per index. A delta:
# {index, id?, name?, arguments?}; id:true = an id was emitted.

family: nemotron_deci
model_label: 'Nemotron (DeciLM) v1/v2'
mode: stream
captured_with:
  vllm: '0.22.0'
cases:
  TOOLCALLING.stream.2:
    description: 'Multiple tool calls split across multiple content chunks'
    ref: 'derived from TOOLCALLING.batch.2.a'
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    - name: get_time
      parameters:
        type: object
        properties:
          timezone:
            type: string
    unavailable:
      dynamo: 'Dynamo parser v2 TC streaming not yet implemented for this family; vLLM/SGLang per-chunk output is the target to match.'
      sglang: 'No SGLang parser for family ''nemotron_deci''.'
    chunks:
    - delta_text: '<TOOLCALL'
      expected:
        vllm: []
      normal_text:
        vllm: '<TOOLCALL'
    - delta_text: '>[{"nam'
      expected:
        vllm: []
      normal_text:
        vllm: '>[{"nam'
    - delta_text: 'e": "get_weat'
      expected:
        vllm: []
      normal_text:
        vllm: 'e": "get_weat'
    - delta_text: 'her",'
      expected:
        vllm: []
      normal_text:
        vllm: 'her",'
    - delta_text: ' "arguments": {"l'
      expected:
        vllm: []
      normal_text:
        vllm: ' "arguments": {"l'
    - delta_text: 'oca'
      expected:
        vllm: []
      normal_text:
        vllm: 'oca'
    - delta_text: 'tion": "N'
      expected:
        vllm: []
      normal_text:
        vllm: 'tion": "N'
    - delta_text: 'YC"}}, '
      expected:
        vllm: []
      normal_text:
        vllm: 'YC"}}, '
    - delta_text: '{"name": "get'
      expected:
        vllm: []
      normal_text:
        vllm: '{"name": "get'
    - delta_text: '_time'
      expected:
        vllm: []
      normal_text:
        vllm: '_time'
    - delta_text: '", "arguments": {'
      expected:
        vllm: []
      normal_text:
        vllm: '", "arguments": {'
    - delta_text: '"ti'
      expected:
        vllm: []
      normal_text:
        vllm: '"ti'
    - delta_text: 'mezone": '
      expected:
        vllm: []
      normal_text:
        vllm: 'mezone": '
    - delta_text: '"EST"}}'
      expected:
        vllm: []
      normal_text:
        vllm: '"EST"}}'
    - delta_text: ']</TOOLCALL>'
      expected:
        vllm: []
      normal_text:
        vllm: ']</TOOLCALL>'
    - delta_text: ''
      finish_reason: tool_calls
      expected:
        vllm: []
