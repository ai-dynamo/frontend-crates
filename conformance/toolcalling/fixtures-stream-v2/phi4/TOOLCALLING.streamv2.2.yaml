# Streaming fixture (per-chunk, per-impl). Each chunk: input (delta_text +
# optional delta_token_ids) and `expected.<impl>` = tool-call deltas emitted at
# that chunk. `normal_text.<impl>` (when non-empty) = non-tool text (leaks show
# here). Assembled result is derived by concatenating per index. A delta:
# {index, id?, name?, arguments?}; id:true = an id was emitted.

family: phi4
model_label: 'Phi-4'
mode: streamv2
captured_with:
  vllm_python: '0.23.0'
cases:
  TOOLCALLING.streamv2.2.a:
    description: 'Parallel calls in JSON array'
    ref: 'derived from TOOLCALLING.batch.2.a'
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    - name: get_time
      parameters:
        type: object
        properties:
          timezone:
            type: string
    unavailable:
      dynamo_rust: 'Dynamo parser v2 TC streaming not yet implemented for this family; vLLM Python/SGLang per-chunk output is the target to match.'
      vllm_rust: 'No vLLM Rust parser for family ''phi4''.'
      sglang_python: 'No SGLang Python parser for family ''phi4''.'
    chunks:
    - delta_text: 'functools[{"name": "get_weather",'
      expected:
        vllm_python: []
    - delta_text: ' "arguments":'
      expected:
        vllm_python: []
    - delta_text: ' {"location": "NYC"}}, {"name":'
      expected:
        vllm_python: []
    - delta_text: ' "get_time", "arguments":'
      expected:
        vllm_python: []
    - delta_text: ' {"timezone":'
      expected:
        vllm_python: []
    - delta_text: ' "EST"}}]'
      expected:
        vllm_python: []
    - delta_text: ''
      finish_reason: stop
      expected:
        vllm_python: []
  TOOLCALLING.streamv2.2.c:
    description: 'With surrounding narration'
    dynamo_note: 'Phi-4 publishes only the input/tool-definition format in the system prompt; no output decoder but is silent on natural-language text that follows the tool-call block. The model can emit trailing or inter-call prose, and nothing in the spec dictates whether a parser keeps or drops it; both readings are defensible. Because dropping silently discards genuine user-facing assistant text, Dynamo keeps it — it strips only the tool-call markup and preserves the surrounding narration verbatim. No published rule is violated, because the spec does not address this case. Source: https://huggingface.co/microsoft/Phi-4-mini-instruct'
    ref: 'derived from TOOLCALLING.batch.2.c'
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    - name: get_time
      parameters:
        type: object
        properties:
          timezone:
            type: string
