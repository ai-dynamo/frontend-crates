# Streaming fixture (per-chunk, per-impl). Each chunk: input (delta_text +
# optional delta_token_ids) and `expected.<impl>` = tool-call deltas emitted at
# that chunk. `normal_text.<impl>` (when non-empty) = non-tool text (leaks show
# here). Assembled result is derived by concatenating per index. A delta:
# {index, id?, name?, arguments?}; id:true = an id was emitted.

family: phi4
model_label: 'Phi-4'
mode: streamv2
captured_with:
  vllm: '0.22.0'
cases:
  TOOLCALLING.streamv2.2.a:
    description: 'Parallel calls in JSON array'
    ref: 'derived from TOOLCALLING.batch.2.a'
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    - name: get_time
      parameters:
        type: object
        properties:
          timezone:
            type: string
    unavailable:
      dynamo: 'Dynamo parser v2 TC streaming not yet implemented for this family; vLLM/SGLang per-chunk output is the target to match.'
      sglang: 'No SGLang parser for family ''phi4''.'
    chunks:
    - delta_text: 'functools[{"name": "get_weather",'
      expected:
        vllm: []
    - delta_text: ' "arguments":'
      expected:
        vllm: []
    - delta_text: ' {"location": "NYC"}}, {"name":'
      expected:
        vllm: []
    - delta_text: ' "get_time", "arguments":'
      expected:
        vllm: []
    - delta_text: ' {"timezone":'
      expected:
        vllm: []
    - delta_text: ' "EST"}}]'
      expected:
        vllm: []
    - delta_text: ''
      finish_reason: tool_calls
      expected:
        vllm: []
  TOOLCALLING.streamv2.2.c:
    description: 'With surrounding narration'
    ref: 'derived from TOOLCALLING.batch.2.c'
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    - name: get_time
      parameters:
        type: object
        properties:
          timezone:
            type: string
    unavailable:
      dynamo: 'Dynamo parser v2 TC streaming not yet implemented for this family; vLLM/SGLang per-chunk output is the target to match.'
      sglang: 'No SGLang parser for family ''phi4''.'
    chunks:
    - delta_text: 'Both: functools[{"name":'
      expected:
        vllm: []
    - delta_text: ' "get_weather",'
      expected:
        vllm: []
    - delta_text: ' "arguments": {"location": "NYC"}},'
      expected:
        vllm: []
    - delta_text: ' {"name": "get_time",'
      expected:
        vllm: []
    - delta_text: ' "arguments":'
      expected:
        vllm: []
    - delta_text: ' {"timezone": "EST"}}]'
      expected:
        vllm: []
    - delta_text: ' Done.'
      expected:
        vllm: []
    - delta_text: ''
      finish_reason: tool_calls
      expected:
        vllm: []
  TOOLCALLING.streamv2.2.d:
    description: 'Same-name twice'
    ref: 'derived from TOOLCALLING.batch.2.d'
    tools:
    - &id001
      name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    - *id001
    unavailable:
      dynamo: 'Dynamo parser v2 TC streaming not yet implemented for this family; vLLM/SGLang per-chunk output is the target to match.'
      sglang: 'No SGLang parser for family ''phi4''.'
    chunks:
    - delta_text: 'functools[{"name": "get_weather",'
      expected:
        vllm: []
    - delta_text: ' "arguments":'
      expected:
        vllm: []
    - delta_text: ' {"location": "NYC"}}, {"name":'
      expected:
        vllm: []
    - delta_text: ' "get_weather", "arguments":'
      expected:
        vllm: []
    - delta_text: ' {"location":'
      expected:
        vllm: []
    - delta_text: ' "LA"}}]'
      expected:
        vllm: []
    - delta_text: ''
      finish_reason: tool_calls
      expected:
        vllm: []
