      sglang: 'No SGLang parser for family ''phi4''.'
    chunks:
    - delta_text: 'functools[{"name": "run_query",'
      expected:
        vllm: []
    - delta_text: ' "arguments":'
      expected:
        vllm: []
    - delta_text: ' {"sql": "SELECT value'
      expected:
        vllm: []
    - delta_text: ' WHERE note'
      expected:
        vllm: []
    - delta_text: ' has'
      expected:
        vllm: []
    - delta_text: ' brace }'
      expected:
        vllm: []
    - delta_text: ' and bracket ]'
      expected:
        vllm: []
    - delta_text: '"}},'
      expected:
