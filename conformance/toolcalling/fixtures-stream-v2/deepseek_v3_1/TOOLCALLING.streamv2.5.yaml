      expected:
        vllm: []
        sglang:
        - {index: 0, name: 'get_weather'}
      normal_text:
        vllm: '<｜tool▁call▁begin｜>get_weather<｜tool▁sep｜>'
    - delta_text: '{"location":"NYC"}<｜tool▁call▁end｜>'
      expected:
        vllm: []
        sglang:
        - {index: 0, arguments: '{"location":"NYC"}'}
      normal_text:
        vllm: '{"location":"NYC"}<｜tool▁call▁end｜>'
    - delta_text: '<｜tool▁calls▁end｜>'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: '<｜tool▁calls▁end｜>'
    - delta_text: ''
      finish_reason: tool_calls
      expected:
        vllm: []
        sglang: []
