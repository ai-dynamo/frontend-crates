        sglang: []
      normal_text:
        vllm: '<｜tool▁sep｜>{'
        sglang: '<｜tool▁sep｜>{'
    - delta_text: '"time'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: '"time'
        sglang: '"time'
    - delta_text: 'zone":"EST"}<｜too'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: 'zone":"EST"}<｜too'
        sglang: 'zone":"EST"}<｜too'
    - delta_text: 'l▁c'
      expected:
