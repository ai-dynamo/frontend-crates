# Streaming fixture (per-chunk, per-impl). Each chunk: input (delta_text +
# optional delta_token_ids) and `expected.<impl>` = tool-call deltas emitted at
# that chunk. `normal_text.<impl>` (when non-empty) = non-tool text (leaks show
# here). Assembled result is derived by concatenating per index. A delta:
# {index, id?, name?, arguments?}; id:true = an id was emitted.

family: deepseek_v3_1
model_label: 'DeepSeek V3.1'
mode: streamv2
captured_with:
  vllm: '0.22.0'
  sglang: '0.5.12.post1'
cases:
  TOOLCALLING.streamv2.50:
    description: 'Complete single tool call with a grammar token split across chunk boundaries'
    ref: 'derived from TOOLCALLING.batch.1'
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    unavailable:
      dynamo: 'Dynamo parser v2 TC streaming not yet implemented for this family; vLLM/SGLang per-chunk output is the target to match.'
    chunks:
    - delta_text: '<｜'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: '<｜'
        sglang: '<｜'
    - delta_text: 'too'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: 'too'
        sglang: 'too'
    - delta_text: 'l▁cal'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: 'l▁cal'
        sglang: 'l▁cal'
    - delta_text: 'ls▁begin｜><'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: 'ls▁begin｜><'
        sglang: 'ls▁begin｜><'
    - delta_text: '｜tool▁call▁begin｜>g'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: '｜tool▁call▁begin｜>g'
        sglang: '｜tool▁call▁begin｜>g'
    - delta_text: 'et'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: 'et'
        sglang: 'et'
    - delta_text: '_we'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: '_we'
        sglang: '_we'
    - delta_text: 'ather'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: 'ather'
        sglang: 'ather'
    - delta_text: '<｜tool▁sep｜'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: '<｜tool▁sep｜'
        sglang: '<｜tool▁sep｜'
    - delta_text: '>{"location":"NYC"}'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: '>{"location":"NYC"}'
        sglang: '>{"location":"NYC"}'
    - delta_text: '<｜'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: '<｜'
        sglang: '<｜'
    - delta_text: 'too'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: 'too'
        sglang: 'too'
    - delta_text: 'l▁cal'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: 'l▁cal'
        sglang: 'l▁cal'
    - delta_text: 'l▁end｜><｜to'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: 'l▁end｜><｜to'
        sglang: 'l▁end｜><｜to'
    - delta_text: 'ol▁calls▁end｜>'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: 'ol▁calls▁end｜>'
        sglang: 'ol▁calls▁end｜>'
    - delta_text: ''
      finish_reason: tool_calls
      expected:
        vllm: []
        sglang: []
