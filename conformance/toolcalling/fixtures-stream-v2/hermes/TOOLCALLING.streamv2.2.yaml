  TOOLCALLING.streamv2.2.a:
    description: Parallel calls (back-to-back tool_call wrappers)
    ref: derived from TOOLCALLING.batch.2.a
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    - name: get_time
      parameters:
        type: object
        properties:
          timezone:
            type: string
    unavailable:
      dynamo_rust: Dynamo parser v2 TC streaming not yet implemented for this family; vLLM/SGLang
        per-chunk output is the target to match.
    chunks:
    - delta_text: '<tool_call>{"name":'
      expected:
        vllm_python: []
        sglang_python: []
        vllm_rust: []
    - delta_text: ' "get_weather",'
      expected:
        vllm_python:
        - index: 0
          id: true
          name: get_weather
        sglang_python:
        - index: 0
          name: get_weather
        vllm_rust: []
    - delta_text: ' "arguments": {"location": "NYC"}}</tool_call>'
      expected:
        vllm_python:
        - index: 0
          arguments: '{"location": "NYC"}'
        sglang_python:
        - index: 0
          arguments: '{"location": "NYC"}'
        vllm_rust:
        - index: 0
          name: get_weather
        - arguments: '{"location": "NYC"}'
          index: 0
    - delta_text: '<tool_call>{"name":'
      expected:
        vllm_python: []
        sglang_python: []
        vllm_rust: []
      normal_text:
        sglang_python: </tool_call>
    - delta_text: ' "get_time",'
      expected:
        vllm_python:
        - index: 1
          id: true
          name: get_time
        sglang_python:
        - index: 1
          name: get_time
        vllm_rust: []
    - delta_text: ' "arguments": {"timezone":'
      expected:
        vllm_python:
        - index: 1
          arguments: '{"timezone":'
        sglang_python: []
        vllm_rust:
        - index: 1
          name: get_time
        - arguments: '{"timezone":'
          index: 1
    - delta_text: ' "EST"}}</tool_call>'
      expected:
        vllm_python:
        - index: 1
          arguments: ' "EST"}'
        sglang_python:
        - index: 1
          arguments: '{"timezone": "EST"}'
        vllm_rust:
        - arguments: ' "EST"}'
          index: 1
    - delta_text: ''
      finish_reason: tool_calls
      expected:
        vllm_python: []
        sglang_python: []
        vllm_rust: []
