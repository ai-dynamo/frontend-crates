# Streaming fixture (per-chunk, per-impl). Each chunk: input (delta_text +
# optional delta_token_ids) and `expected.<impl>` = tool-call deltas emitted at
# that chunk. `normal_text.<impl>` (when non-empty) = non-tool text (leaks show
# here). Assembled result is derived by concatenating per index. A delta:
# {index, id?, name?, arguments?}; id:true = an id was emitted.

family: pythonic
model_label: 'Llama 4 (pythonic fmt)'
mode: streamv2
captured_with:
  vllm_python: '0.22.0'
  sglang_python: '0.5.12.post1'
cases:
  TOOLCALLING.streamv2.4.a:
    description: 'Bracket form with garbage call'
    ref: 'derived from TOOLCALLING.batch.4.a'
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    unavailable:
      dynamo_rust: 'Dynamo parser v2 TC streaming not yet implemented for this family; vLLM/SGLang per-chunk output is the target to match.'
    chunks:
    - delta_text: '[not a'
      expected:
        vllm_python: []
        sglang_python: []
    - delta_text: ' valid'
      expected:
        vllm_python: []
        sglang_python: []
    - delta_text: ' python call]'
      expected:
        vllm_python: []
        sglang_python: []
      normal_text:
        sglang_python: '[not a valid python call]'
    - delta_text: ''
      finish_reason: stop
      expected:
        vllm_python: []
        sglang_python: []
  TOOLCALLING.streamv2.4.b:
    description: 'Missing closing bracket'
    ref: 'derived from TOOLCALLING.batch.4.b'
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    unavailable:
      dynamo_rust: 'Dynamo parser v2 TC streaming not yet implemented for this family; vLLM/SGLang per-chunk output is the target to match.'
    chunks:
    - delta_text: '[get_weather(location="NYC"'
      expected:
        vllm_python: []
        sglang_python: []
    - delta_text: ''
      finish_reason: stop
      expected:
        vllm_python: []
        sglang_python: []
  TOOLCALLING.streamv2.4.d:
    description: 'Mismatched paren / bracket'
    ref: 'derived from TOOLCALLING.batch.4.d'
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    unavailable:
      dynamo_rust: 'Dynamo parser v2 TC streaming not yet implemented for this family; vLLM/SGLang per-chunk output is the target to match.'
    chunks:
    - delta_text: '[get_weather(location="NYC"]'
      expected:
        vllm_python: []
        sglang_python: []
      normal_text:
        sglang_python: '[get_weather(location="NYC"]'
    - delta_text: ''
      finish_reason: stop
      expected:
        vllm_python: []
        sglang_python: []
