# Streaming fixture (per-chunk, per-impl). Each chunk: input (delta_text +
# optional delta_token_ids) and `expected.<impl>` = tool-call deltas emitted at
# that chunk. `normal_text.<impl>` (when non-empty) = non-tool text (leaks show
# here). Assembled result is derived by concatenating per index. A delta:
# {index, id?, name?, arguments?}; id:true = an id was emitted.

family: pythonic
model_label: 'Llama 4 (pythonic fmt)'
mode: streamv2
captured_with:
  vllm: '0.22.0'
  sglang: '0.5.12.post1'
cases:
  TOOLCALLING.streamv2.6.a:
    description: 'Empty parens (no args)'
    ref: 'derived from TOOLCALLING.batch.6.a'
    tools:
    - name: get_time
      parameters:
        type: object
        properties: {}
    unavailable:
      dynamo: 'Dynamo parser v2 TC streaming not yet implemented for this family; vLLM/SGLang per-chunk output is the target to match.'
    chunks:
    - delta_text: '[get_time()]'
      expected:
        vllm:
        - {index: 0, id: true, name: 'get_time', arguments: '{}'}
        sglang:
        - {index: 0, name: 'get_time', arguments: '{}'}
    - delta_text: ''
      finish_reason: tool_calls
      expected:
        vllm: []
        sglang: []
  TOOLCALLING.streamv2.6.b:
    description: 'Whitespace inside parens'
    ref: 'derived from TOOLCALLING.batch.6.b'
    tools:
    - name: get_time
      parameters:
        type: object
        properties: {}
    unavailable:
      dynamo: 'Dynamo parser v2 TC streaming not yet implemented for this family; vLLM/SGLang per-chunk output is the target to match.'
    chunks:
    - delta_text: '[get_time( )]'
      expected:
        vllm:
        - {index: 0, id: true, name: 'get_time', arguments: '{}'}
        sglang: []
      normal_text:
        sglang: '[get_time( )]'
    - delta_text: ''
      finish_reason: stop
      expected:
        vllm: []
        sglang: []
