# Streaming fixture (per-chunk, per-impl). Each chunk: input (delta_text +
# optional delta_token_ids) and `expected.<impl>` = tool-call deltas emitted at
# that chunk. `normal_text.<impl>` (when non-empty) = non-tool text (leaks show
# here). Assembled result is derived by concatenating per index. A delta:
# {index, id?, name?, arguments?}; id:true = an id was emitted.

family: pythonic
model_label: 'Llama 4 (pythonic fmt)'
mode: streamv2
captured_with:
  vllm: '0.22.0'
  sglang: '0.5.12.post1'
cases:
  TOOLCALLING.streamv2.5.a:
    description: 'Missing closing `]` end marker'
    ref: 'derived from TOOLCALLING.batch.5.a'
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    unavailable:
      dynamo: 'Dynamo parser v2 TC streaming not yet implemented for this family; vLLM/SGLang per-chunk output is the target to match.'
    chunks:
    - delta_text: '[get_weather(location="NYC")'
      expected:
        vllm:
        - {index: 0, id: true, name: 'get_weather', arguments: '{"location": "NYC"}'}
        sglang: []
    - delta_text: ''
      finish_reason: stop
      expected:
        vllm: []
        sglang: []
  TOOLCALLING.streamv2.5.b:
    description: 'Closing `]` without matching `[` open'
    ref: 'derived from TOOLCALLING.batch.5.b'
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    unavailable:
      dynamo: 'Dynamo parser v2 TC streaming not yet implemented for this family; vLLM/SGLang per-chunk output is the target to match.'
    chunks:
    - delta_text: 'get_weather(location="NYC")]'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: 'get_weather(location="NYC")]'
        sglang: 'get_weather(location="NYC")]'
    - delta_text: ''
      finish_reason: stop
      expected:
        vllm: []
        sglang: []
  TOOLCALLING.streamv2.5.c:
    description: 'Truncation mid-argument value'
    ref: 'derived from TOOLCALLING.batch.5.c'
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    unavailable:
      dynamo: 'Dynamo parser v2 TC streaming not yet implemented for this family; vLLM/SGLang per-chunk output is the target to match.'
    chunks:
    - delta_text: '[get_weather(location="N'
      expected:
        vllm:
        - {index: 0, id: true, name: 'get_weather', arguments: '{"location": "N'}
        sglang: []
    - delta_text: ''
      finish_reason: stop
      expected:
        vllm: []
        sglang: []
  TOOLCALLING.streamv2.5.d:
    description: 'Multi-call, last call missing only end marker (body complete)'
    ref: 'derived from TOOLCALLING.batch.5.d'
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    unavailable:
      dynamo: 'Dynamo parser v2 TC streaming not yet implemented for this family; vLLM/SGLang per-chunk output is the target to match.'
    chunks:
    - delta_text: 'I''ll start'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: 'I''ll start'
        sglang: 'I''ll start'
    - delta_text: ' by'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: ' by'
        sglang: ' by'
    - delta_text: ' fetching the weather'
