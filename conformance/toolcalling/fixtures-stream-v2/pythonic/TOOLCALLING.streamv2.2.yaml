# Streaming fixture (per-chunk, per-impl). Each chunk: input (delta_text +
# optional delta_token_ids) and `expected.<impl>` = tool-call deltas emitted at
# that chunk. `normal_text.<impl>` (when non-empty) = non-tool text (leaks show
# here). Assembled result is derived by concatenating per index. A delta:
# {index, id?, name?, arguments?}; id:true = an id was emitted.

family: pythonic
model_label: 'Llama 4 (pythonic fmt)'
mode: streamv2
captured_with:
  vllm_python: '0.23.0'
  sglang_python: '0.5.12.post1'
cases:
  TOOLCALLING.streamv2.2.a:
    description: 'Parallel calls in single bracket'
    ref: 'derived from TOOLCALLING.batch.2.a'
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    - name: get_time
      parameters:
        type: object
        properties:
          timezone:
            type: string
    unavailable:
      dynamo_rust: 'Dynamo parser v2 TC streaming not yet implemented for this family; vLLM Python/SGLang per-chunk output is the target to match.'
      vllm_rust: 'No vLLM Rust parser for family ''pythonic''.'
    chunks:
    - delta_text: '[get_weather(location="NYC"), get_time(timezone="EST")]'
      expected:
        vllm_python:
        - {index: 0, id: true, name: 'get_weather', arguments: '{"location": "NYC"}'}
        - {index: 1, id: true, name: 'get_time', arguments: '{"timezone": "EST"}'}
        sglang_python:
        - {index: 0, name: 'get_weather', arguments: '{"location": "NYC"}'}
        - {index: 1, name: 'get_time', arguments: '{"timezone": "EST"}'}
    - delta_text: ''
      finish_reason: tool_calls
      expected:
        vllm_python: []
        sglang_python: []
  TOOLCALLING.streamv2.2.c:
    description: 'With surrounding narration'
    dynamo_note: 'Pythonic tool calls are terminal only by a prompt-side instruction — Meta''s Llama-4 prompt format tells the model it "SHOULD NOT include any other text in the response" — but there is no published parser rule that forbids or drops trailing text. That instruction constrains the model''s generation, not a decoder, and the model can still emit trailing prose; Dynamo preserves it rather than discard real user-facing content. Source: https://github.com/meta-llama/llama-models/blob/main/models/llama4/prompt_format.md'
    ref: 'derived from TOOLCALLING.batch.2.c'
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    - name: get_time
      parameters:
        type: object
        properties:
          timezone:
            type: string
    unavailable:
      dynamo_rust: 'Dynamo parser v2 TC streaming not yet implemented for this family; vLLM Python/SGLang per-chunk output is the target to match.'
      vllm_rust: 'No vLLM Rust parser for family ''pythonic''.'
    chunks:
    - delta_text: 'Both: [get_weather(location="NYC"),'
      expected:
        vllm_python: []
        sglang_python: []
      normal_text:
        vllm_python: 'Both: [get_weather(location="NYC"),'
        sglang_python: 'Both: '
    - delta_text: ' get_time(timezone="EST")]'
      expected:
        vllm_python: []
        sglang_python:
        - {index: 0, name: 'get_weather', arguments: '{"location": "NYC"}'}
        - {index: 1, name: 'get_time', arguments: '{"timezone": "EST"}'}
      normal_text:
        vllm_python: ' get_time(timezone="EST")]'
    - delta_text: ' Done.'
      expected:
        vllm_python: []
        sglang_python: []
      normal_text:
        vllm_python: ' Done.'
        sglang_python: ' Done.'
    - delta_text: ''
      finish_reason: tool_calls
      expected:
        vllm_python: []
        sglang_python: []
  TOOLCALLING.streamv2.2.d:
    description: 'Same-name twice'
    ref: 'derived from TOOLCALLING.batch.2.d'
    tools:
    - &id001
      name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    - *id001
    unavailable:
      dynamo_rust: 'Dynamo parser v2 TC streaming not yet implemented for this family; vLLM Python/SGLang per-chunk output is the target to match.'
      vllm_rust: 'No vLLM Rust parser for family ''pythonic''.'
    chunks:
    - delta_text: '[get_weather(location="NYC"), get_weather(location="LA")]'
      expected:
        vllm_python:
        - {index: 0, id: true, name: 'get_weather', arguments: '{"location": "NYC"}'}
        - {index: 1, id: true, name: 'get_weather', arguments: '{"location": "LA"}'}
        sglang_python:
        - {index: 0, name: 'get_weather', arguments: '{"location": "NYC"}'}
        - {index: 1, name: 'get_weather', arguments: '{"location": "LA"}'}
    - delta_text: ''
      finish_reason: tool_calls
      expected:
        vllm_python: []
        sglang_python: []
