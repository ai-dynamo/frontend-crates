# Streaming fixture (per-chunk, per-impl). Each chunk: input (delta_text +
# optional delta_token_ids) and `expected.<impl>` = tool-call deltas emitted at
# that chunk. `normal_text.<impl>` (when non-empty) = non-tool text (leaks show
# here). Assembled result is derived by concatenating per index. A delta:
# {index, id?, name?, arguments?}; id:true = an id was emitted.

family: pythonic
model_label: 'Llama 4 (pythonic fmt)'
mode: streamv2
captured_with:
  vllm_python: '0.22.0'
  sglang_python: '0.5.12.post1'
cases:
  TOOLCALLING.streamv2.31.a:
    description: 'Multi-call Pythonic list with call separator `,` inside the first argument string'
    ref: 'derived from TOOLCALLING.batch.31.a'
    tools:
    - name: run_query
      parameters:
        type: object
        properties:
          sql:
            type: string
    - name: get_time
      parameters:
        type: object
        properties:
          timezone:
            type: string
    unavailable:
      dynamo_rust: 'Dynamo parser v2 TC streaming not yet implemented for this family; vLLM/SGLang per-chunk output is the target to match.'
    chunks:
    - delta_text: '[run_query(sql="SELECT a,'
      expected:
        vllm_python:
        - {index: 0, id: true, name: 'run_query', arguments: '{"sql": "SELECT a'}
        sglang_python: []
    - delta_text: ' SELECT'
      expected:
        vllm_python:
        - {index: 0, arguments: ', SELECT'}
        sglang_python: []
    - delta_text: ' b"), get_time(timezone="EST")]'
      expected:
        vllm_python:
        - {index: 0, arguments: ' b"}'}
        - {index: 1, id: true, name: 'get_time', arguments: '{"timezone": "EST"}'}
        sglang_python:
        - {index: 0, name: 'run_query', arguments: '{"sql": "SELECT a, SELECT b"}'}
        - {index: 1, name: 'get_time', arguments: '{"timezone": "EST"}'}
    - delta_text: ''
      finish_reason: tool_calls
      expected:
        vllm_python: []
        sglang_python: []
  TOOLCALLING.streamv2.31.b:
    description: 'Multi-call response with structural delimiters inside one argument string value'
    ref: 'derived from TOOLCALLING.batch.31.b'
    tools:
    - name: run_query
      parameters:
        type: object
        properties:
          sql:
            type: string
    - name: get_time
      parameters:
        type: object
        properties:
          timezone:
            type: string
    unavailable:
      dynamo_rust: 'Dynamo parser v2 TC streaming not yet implemented for this family; vLLM/SGLang per-chunk output is the target to match.'
    chunks:
    - delta_text: '[run_query(sql="SELECT value'
      expected:
        vllm_python:
        - {index: 0, id: true, name: 'run_query', arguments: '{"sql": "SELECT value'}
        sglang_python: []
    - delta_text: ' WHERE'
      expected:
        vllm_python:
        - {index: 0, arguments: ' WHERE'}
        sglang_python: []
    - delta_text: ' note has brace'
      expected:
        vllm_python:
        - {index: 0, arguments: ' note has brace'}
        sglang_python: []
    - delta_text: ' } and'
      expected:
        vllm_python: []
        sglang_python: []
    - delta_text: ' bracket'
      expected:
        vllm_python: []
        sglang_python: []
    - delta_text: ' ]"),'
      expected:
        vllm_python: []
        sglang_python: []
      normal_text:
        sglang_python: '[run_query(sql="SELECT value WHERE note has brace } and bracket ]'
    - delta_text: ' get_time(timezone="EST")]'
      expected:
        vllm_python: []
        sglang_python: []
      normal_text:
        sglang_python: '"), get_time(timezone="EST")]'
    - delta_text: ''
      finish_reason: tool_calls
      expected:
        vllm_python: []
        sglang_python: []
