# Streaming fixture (per-chunk, per-impl). Each chunk: input (delta_text +
# optional delta_token_ids) and `expected.<impl>` = tool-call deltas emitted at
# that chunk. `normal_text.<impl>` (when non-empty) = non-tool text (leaks show
# here). Assembled result is derived by concatenating per index. A delta:
# {index, id?, name?, arguments?}; id:true = an id was emitted.

family: harmony
model_label: 'gpt-oss (harmony, token-id)'
mode: streamv2
captured_with:
  vllm_python: '0.22.0'
  sglang_python: '0.5.12.post1'
  dynamo_rust: 'Dynamo parser v2'
cases:
  TOOLCALLING.streamv2.3:
    description: 'No tool call (bare text without final channel)'
    ref: 'derived from TOOLCALLING.batch.3'
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    chunks:
    - delta_text: 'Hello,'
      delta_token_ids: [13225, 11]
      expected:
        dynamo_rust: []
        vllm_python: []
        sglang_python: []
      normal_text:
        sglang_python: 'Hello,'
    - delta_text: ' how can'
      delta_token_ids: [1495, 665]
      expected:
        dynamo_rust: []
        vllm_python: []
        sglang_python: []
      normal_text:
        sglang_python: ' how can'
    - delta_text: ' I help'
      delta_token_ids: [357, 1652]
      expected:
        dynamo_rust: []
        vllm_python: []
        sglang_python: []
      normal_text:
        sglang_python: ' I help'
    - delta_text: ' you today'
      delta_token_ids: [481, 4044]
      expected:
        dynamo_rust: []
        vllm_python: []
        sglang_python: []
      normal_text:
        sglang_python: ' you today'
    - delta_text: '?'
      delta_token_ids: [30]
      expected:
        dynamo_rust: []
        vllm_python: []
        sglang_python: []
      normal_text:
        sglang_python: '?'
    - delta_text: ''
      delta_token_ids: []
      finish_reason: stop
      expected:
        dynamo_rust: []
        vllm_python: []
        sglang_python: []
