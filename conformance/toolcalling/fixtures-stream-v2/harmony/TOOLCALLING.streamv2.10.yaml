        - {index: 0, arguments: '{"'}
        - {index: 0, arguments: 'location'}
        vllm:
        - {index: 0, arguments: '{"'}
        - {index: 0, arguments: 'location'}
        sglang: []
    - delta_text: '":"NY'
      delta_token_ids: [7534, 24202]
      expected:
