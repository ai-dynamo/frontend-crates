    - delta_text: '<|call|><|start|>'
      delta_token_ids: [200012, 200006]
      expected:
        dynamo: []
        vllm: []
        sglang:
        - {index: 0, name: 'get_weather', arguments: '{"location": "NYC"}'}
    - delta_text: 'assistant<|channel|>'
