# Streaming fixture (per-chunk, per-impl). Each chunk: input (delta_text +
# optional delta_token_ids) and `expected.<impl>` = tool-call deltas emitted at
# that chunk. `normal_text.<impl>` (when non-empty) = non-tool text (leaks show
# here). Assembled result is derived by concatenating per index. A delta:
# {index, id?, name?, arguments?}; id:true = an id was emitted.

family: harmony
model_label: 'gpt-oss (harmony, token-id)'
mode: streamv2
captured_with:
  vllm_python: '0.22.0'
  sglang_python: '0.5.12.post1'
  dynamo_rust: 'Dynamo parser v2'
cases:
  TOOLCALLING.streamv2.13:
    description: 'Unknown tool name absent from supplied tools'
    ref: 'derived from TOOLCALLING.batch.13'
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    chunks:
    - delta_text: '<|channel|>comment'
      delta_token_ids: [200005, 12606]
      expected:
        dynamo_rust: []
        vllm_python: []
        sglang_python: []
    - delta_text: 'ary to'
      delta_token_ids: [815, 316]
      expected:
        dynamo_rust: []
        vllm_python: []
        sglang_python: []
    - delta_text: '=functions'
      delta_token_ids: [28, 44580]
      expected:
        dynamo_rust: []
        vllm_python: []
        sglang_python: []
    - delta_text: '.unknown'
      delta_token_ids: [13, 33936]
      expected:
        dynamo_rust: []
        vllm_python: []
        sglang_python: []
    - delta_text: '_tool '
      delta_token_ids: [53637, 220]
      expected:
        dynamo_rust: []
        vllm_python: []
        sglang_python: []
    - delta_text: '<|constrain|>json'
      delta_token_ids: [200003, 4108]
      expected:
        dynamo_rust: []
        vllm_python: []
        sglang_python: []
    - delta_text: '<|message|>{"'
      delta_token_ids: [200008, 10848]
      expected:
        dynamo_rust: []
        vllm_python:
        - {index: 0, id: true, name: 'unknown_tool', arguments: ''}
        - {index: 0, arguments: '{"'}
        sglang_python: []
    - delta_text: 'location":"'
      delta_token_ids: [7693, 7534]
      expected:
        dynamo_rust: []
        vllm_python:
        - {index: 0, arguments: 'location'}
        - {index: 0, arguments: '":"'}
        sglang_python: []
    - delta_text: 'NYC'
      delta_token_ids: [24202, 34]
      expected:
        dynamo_rust: []
        vllm_python:
        - {index: 0, arguments: 'NY'}
        - {index: 0, arguments: 'C'}
        sglang_python: []
    - delta_text: '"}<|call|>'
      delta_token_ids: [18583, 200012]
      expected:
        dynamo_rust:
        - {index: 0, id: true, name: 'unknown_tool'}
        - {index: 0, arguments: '{"location":"NYC"}'}
        vllm_python:
        - {index: 0, arguments: '"}'}
        sglang_python: []
    - delta_text: ''
      delta_token_ids: []
      finish_reason: tool_calls
      expected:
        dynamo_rust: []
        vllm_python: []
        sglang_python: []
