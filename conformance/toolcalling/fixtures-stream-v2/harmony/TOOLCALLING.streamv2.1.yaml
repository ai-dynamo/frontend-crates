# Streaming fixture (per-chunk, per-impl). Each chunk: input (delta_text +
# optional delta_token_ids) and `expected.<impl>` = tool-call deltas emitted at
# that chunk. `normal_text.<impl>` (when non-empty) = non-tool text (leaks show
# here). Assembled result is derived by concatenating per index. A delta:
# {index, id?, name?, arguments?}; id:true = an id was emitted.

family: harmony
model_label: 'gpt-oss (harmony, token-id)'
mode: streamv2
captured_with:
  vllm: '0.22.0'
  sglang: '0.5.12.post1'
cases:
  TOOLCALLING.streamv2.1:
    description: 'Single tool call (basic complete envelope)'
    ref: 'derived from TOOLCALLING.batch.1'
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    chunks:
    - delta_text: '<|channel|>comment'
      delta_token_ids: [200005, 12606]
      expected:
        dynamo: []
        vllm: []
        sglang: []
    - delta_text: 'ary to'
      delta_token_ids: [815, 316]
      expected:
        dynamo: []
        vllm: []
        sglang: []
    - delta_text: '=functions'
      delta_token_ids: [28, 44580]
      expected:
        dynamo: []
        vllm: []
        sglang: []
    - delta_text: '.get_weather'
      delta_token_ids: [775, 170154]
      expected:
        dynamo: []
        vllm: []
        sglang: []
    - delta_text: ' <|constrain|>'
      delta_token_ids: [220, 200003]
      expected:
        dynamo: []
        vllm: []
        sglang: []
    - delta_text: 'json<|message|>'
      delta_token_ids: [4108, 200008]
      expected:
        dynamo:
        - {index: 0, id: true, name: 'get_weather'}
        vllm:
        - {index: 0, id: true, name: 'get_weather', arguments: ''}
        sglang: []
    - delta_text: '{"location'
      delta_token_ids: [10848, 7693]
      expected:
        dynamo:
        - {index: 0, arguments: '{"'}
        - {index: 0, arguments: 'location'}
        vllm:
        - {index: 0, arguments: '{"'}
        - {index: 0, arguments: 'location'}
        sglang: []
    - delta_text: '":"NY'
      delta_token_ids: [7534, 24202]
      expected:
        dynamo:
        - {index: 0, arguments: '":"'}
        - {index: 0, arguments: 'NY'}
        vllm:
        - {index: 0, arguments: '":"'}
        - {index: 0, arguments: 'NY'}
        sglang: []
    - delta_text: 'C"}'
      delta_token_ids: [34, 18583]
      expected:
        dynamo:
        - {index: 0, arguments: 'C'}
        - {index: 0, arguments: '"}'}
        vllm:
        - {index: 0, arguments: 'C'}
        - {index: 0, arguments: '"}'}
        sglang: []
    - delta_text: '<|call|>'
      delta_token_ids: [200012]
      expected:
        dynamo: []
        vllm: []
        sglang:
        - {index: 0, name: 'get_weather', arguments: '{"location": "NYC"}'}
    - delta_text: ''
      delta_token_ids: []
      finish_reason: tool_calls
      expected:
        dynamo: []
        vllm: []
        sglang: []
