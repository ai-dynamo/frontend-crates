        vllm: ' check'
        sglang: ' check'
    - delta_text: ' the weather. <|tool_call>'
      expected:
        vllm: []
        sglang: []
      normal_text:
        sglang: ' the weather. '
    - delta_text: 'call:get_weather{location:<|"|>NYC<|"|>'
      expected:
