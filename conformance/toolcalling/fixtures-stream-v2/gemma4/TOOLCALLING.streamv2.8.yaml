        - {index: 0, id: true, name: 'get_weather', arguments: ''}
        sglang:
        - {index: 0, name: 'get_weather'}
    - delta_text: '}<tool_call|>'
      expected:
        vllm:
        - {index: 0, arguments: '{"location": "NYC"}'}
        sglang:
        - {index: 0, arguments: '{"location": "NYC"}'}
    - delta_text: ' Let me'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: ' Let me'
        sglang: ' Let me'
    - delta_text: ' know if you'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: ' know if you'
        sglang: ' know if you'
    - delta_text: ' need'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: ' need'
        sglang: ' need'
    - delta_text: ' more.'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: ' more.'
        sglang: ' more.'
    - delta_text: ''
      finish_reason: tool_calls
      expected:
        vllm: []
        sglang: []
  TOOLCALLING.streamv2.8.d:
    description: 'Narration between multiple tool calls'
