        properties:
          location:
            type: string
    unavailable:
      dynamo: 'Dynamo parser v2 TC streaming not yet implemented for this family; vLLM/SGLang per-chunk output is the target to match.'
    chunks:
    - delta_text: '<|tool_call>call:get_weather{location:<|"|>'
      expected:
        vllm:
        - {index: 0, id: true, name: 'get_weather', arguments: ''}
        sglang:
        - {index: 0, name: 'get_weather'}
    - delta_text: 'NYC<|"|>'
      expected:
        vllm:
        - {index: 0, arguments: '{"location": "NYC'}
        sglang: []
    - delta_text: '}<tool_call|> Let me'
      expected:
        vllm:
        - {index: 0, arguments: '"}'}
        sglang:
        - {index: 0, arguments: '{"location": "NYC"}'}
      normal_text:
        sglang: ' Let me'
    - delta_text: ' know if'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: ' know if'
        sglang: ' know if'
    - delta_text: ' you'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: ' you'
        sglang: ' you'
    - delta_text: ' need more.'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: ' need more.'
        sglang: ' need more.'
    - delta_text: ''
      finish_reason: tool_calls
      expected:
        vllm: []
        sglang: []
