# Streaming fixture (per-chunk, per-impl). Each chunk: input (delta_text +
# optional delta_token_ids) and `expected.<impl>` = tool-call deltas emitted at
# that chunk. `normal_text.<impl>` (when non-empty) = non-tool text (leaks show
# here). Assembled result is derived by concatenating per index. A delta:
# {index, id?, name?, arguments?}; id:true = an id was emitted.

family: gemma4
model_label: 'Gemma 4'
mode: streamv2
captured_with:
  vllm_rust: 'v0.23.0 78743ab5bffd381e88f97e1c8ba20473b0ae6d75'
  vllm_python: '0.23.0'
  sglang_python: '0.5.12.post1'
cases:
  TOOLCALLING.streamv2.8.a:
    description: 'Narration before tool call only'
    ref: 'derived from TOOLCALLING.batch.8.a'
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    unavailable:
      dynamo_rust: 'Dynamo parser v2 TC streaming not yet implemented for this family; vLLM Python/SGLang per-chunk output is the target to match.'
    chunks:
    - delta_text: 'I will'
      expected:
        vllm_rust: []
        vllm_python: []
        sglang_python: []
      normal_text:
        vllm_rust: 'I will'
        vllm_python: 'I will'
        sglang_python: 'I will'
    - delta_text: ' check'
      expected:
        vllm_rust: []
        vllm_python: []
        sglang_python: []
      normal_text:
        vllm_rust: ' check'
        vllm_python: ' check'
        sglang_python: ' check'
    - delta_text: ' the weather. <|tool_call>'
      expected:
        vllm_rust: []
        vllm_python: []
        sglang_python: []
      normal_text:
        vllm_rust: ' the weather. '
        sglang_python: ' the weather. '
    - delta_text: 'call:get_weather{location:<|"|>NYC<|"|>'
      expected:
        vllm_rust: []
        vllm_python:
        - {index: 0, id: true, name: 'get_weather', arguments: ''}
        sglang_python:
        - {index: 0, name: 'get_weather'}
    - delta_text: '}<tool_call|>'
      expected:
        vllm_rust:
        - {index: 0, name: 'get_weather', arguments: '{"location":"NYC"}'}
        vllm_python:
        - {index: 0, arguments: '{"location": "NYC"}'}
        sglang_python:
        - {index: 0, arguments: '{"location": "NYC"}'}
    - delta_text: ''
      finish_reason: tool_calls
      expected:
        vllm_rust: []
        vllm_python: []
        sglang_python: []
  TOOLCALLING.streamv2.8.b:
    description: 'Narration after tool call only'
    dynamo_note: 'Gemma publishes only a chat-template plus a non-normative regex recipe; two reference decoders (vLLM, SGLang) even disagree on trailing text but is silent on natural-language text that follows the tool-call block. The model can emit trailing or inter-call prose, and nothing in the spec dictates whether a parser keeps or drops it; both readings are defensible. Because dropping silently discards genuine user-facing assistant text, Dynamo keeps it — it strips only the tool-call markup and preserves the surrounding narration verbatim. No published rule is violated, because the spec does not address this case. Source: https://ai.google.dev/gemma/docs/capabilities/text/function-calling-gemma4'
    ref: 'derived from TOOLCALLING.batch.8.b'
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    unavailable:
      dynamo_rust: 'Dynamo parser v2 TC streaming not yet implemented for this family; vLLM Python/SGLang per-chunk output is the target to match.'
    chunks:
    - delta_text: '<|tool_call>call:get_weather{location:<|"|>'
      expected:
        vllm_rust: []
        vllm_python:
        - {index: 0, id: true, name: 'get_weather', arguments: ''}
        sglang_python:
        - {index: 0, name: 'get_weather'}
    - delta_text: 'NYC<|"|>'
      expected:
        vllm_rust: []
        vllm_python:
        - {index: 0, arguments: '{"location": "NYC'}
        sglang_python: []
    - delta_text: '}<tool_call|> Let me'
      expected:
        vllm_rust:
        - {index: 0, name: 'get_weather', arguments: '{"location":"NYC"}'}
        vllm_python:
        - {index: 0, arguments: '"}'}
        sglang_python:
        - {index: 0, arguments: '{"location": "NYC"}'}
      normal_text:
        vllm_rust: ' Let me'
        sglang_python: ' Let me'
    - delta_text: ' know if'
      expected:
        vllm_rust: []
        vllm_python: []
        sglang_python: []
      normal_text:
        vllm_rust: ' know if'
        vllm_python: ' know if'
        sglang_python: ' know if'
    - delta_text: ' you'
      expected:
        vllm_rust: []
        vllm_python: []
        sglang_python: []
      normal_text:
        vllm_rust: ' you'
        vllm_python: ' you'
        sglang_python: ' you'
    - delta_text: ' need more.'
      expected:
        vllm_rust: []
        vllm_python: []
        sglang_python: []
      normal_text:
        vllm_rust: ' need more.'
        vllm_python: ' need more.'
        sglang_python: ' need more.'
    - delta_text: ''
      finish_reason: tool_calls
      expected:
        vllm_rust: []
        vllm_python: []
        sglang_python: []
