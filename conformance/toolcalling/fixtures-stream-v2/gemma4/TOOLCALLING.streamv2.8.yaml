      normal_text:
        sglang: ' LA weather. '
    - delta_text: 'call:get_weather{location:<|"|>'
      expected:
        vllm:
        - {index: 1, id: true, name: 'get_weather', arguments: ''}
        sglang:
        - {index: 0, name: 'get_weather'}
    - delta_text: 'LA<|"|>}<tool_call|>'
      expected:
