      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: 'call:get_weather{location:<|"|>NYC<|"|>'
        sglang: 'call:get_weather{location:<|"|>NYC<|"|>'
    - delta_text: '}<tool_call|>'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: '}<tool_call|>'
        sglang: '}<tool_call|>'
    - delta_text: ''
      finish_reason: tool_calls
      expected:
        vllm: []
        sglang: []
