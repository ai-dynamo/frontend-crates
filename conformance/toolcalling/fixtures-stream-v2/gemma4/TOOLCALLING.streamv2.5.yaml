        sglang:
        - {index: 0, name: 'get_weather'}
    - delta_text: 'N'
      expected:
        vllm:
        - {index: 0, arguments: '{"location": "N'}
        sglang: []
    - delta_text: ''
      finish_reason: stop
      expected:
        vllm: []
        sglang: []
  TOOLCALLING.streamv2.5.d:
    description: 'Multi-call, last call missing only end marker (body complete)'
