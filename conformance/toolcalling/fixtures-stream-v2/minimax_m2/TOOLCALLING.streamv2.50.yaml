# Streaming fixture (per-chunk, per-impl). Each chunk: input (delta_text +
# optional delta_token_ids) and `expected.<impl>` = tool-call deltas emitted at
# that chunk. `normal_text.<impl>` (when non-empty) = non-tool text (leaks show
# here). Assembled result is derived by concatenating per index. A delta:
# {index, id?, name?, arguments?}; id:true = an id was emitted.

family: minimax_m2
model_label: 'MiniMax 2.7'
mode: streamv2
captured_with:
  vllm: '0.22.0'
  sglang: '0.5.12.post1'
cases:
  TOOLCALLING.streamv2.50:
    description: 'Complete single tool call with a grammar token split across chunk boundaries'
    ref: 'derived from TOOLCALLING.batch.1'
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    unavailable:
      dynamo: 'Dynamo parser v2 TC streaming not yet implemented for this family; vLLM/SGLang per-chunk output is the target to match.'
    chunks:
    - delta_text: '<m'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: '<m'
        sglang: '<m'
    - delta_text: 'ini'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: 'ini'
        sglang: 'ini'
    - delta_text: 'max:t'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: 'max:t'
        sglang: 'max:t'
    - delta_text: 'ool_call>
<'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: 'ool_call>
<'
        sglang: 'ool_call>
<'
    - delta_text: 'invoke name="get_we'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: 'invoke name="get_we'
        sglang: 'invoke name="get_we'
    - delta_text: 'at'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: 'at'
        sglang: 'at'
    - delta_text: 'her'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: 'her'
        sglang: 'her'
    - delta_text: '">
<p'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: '">
<p'
        sglang: '">
<p'
    - delta_text: 'arameter na'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: 'arameter na'
        sglang: 'arameter na'
    - delta_text: 'me="location">NYC</'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: 'me="location">NYC</'
        sglang: 'me="location">NYC</'
    - delta_text: 'pa'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: 'pa'
        sglang: 'pa'
    - delta_text: 'ram'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: 'ram'
        sglang: 'ram'
    - delta_text: 'eter>'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: 'eter>'
        sglang: 'eter>'
    - delta_text: '
</invoke>
'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: '
</invoke>
'
        sglang: '
</invoke>
'
    - delta_text: '</minimax:tool_call'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: '</minimax:tool_call'
        sglang: '</minimax:tool_call'
    - delta_text: '>'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: '>'
        sglang: '>'
    - delta_text: ''
      finish_reason: tool_calls
      expected:
        vllm: []
        sglang: []
