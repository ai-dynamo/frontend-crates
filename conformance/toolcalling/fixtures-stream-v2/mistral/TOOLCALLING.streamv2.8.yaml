        - {index: 0, arguments: '{"location": "NYC"}'}
        sglang: []
    - delta_text: '[/TOOL_CALLS] Let'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: '[/TOOL_CALLS] Let'
    - delta_text: ' me'
