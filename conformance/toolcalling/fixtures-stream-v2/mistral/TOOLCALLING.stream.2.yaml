# Streaming fixture (per-chunk, per-impl). Each chunk: input (delta_text +
# optional delta_token_ids) and `expected.<impl>` = tool-call deltas emitted at
# that chunk. `normal_text.<impl>` (when non-empty) = non-tool text (leaks show
# here). Assembled result is derived by concatenating per index. A delta:
# {index, id?, name?, arguments?}; id:true = an id was emitted.

family: mistral
model_label: 'Mistral series'
mode: stream
captured_with:
  vllm: '0.22.0'
  sglang: '0.5.12.post1'
cases:
  TOOLCALLING.stream.2:
    description: 'Multiple tool calls split across multiple content chunks'
    ref: 'derived from TOOLCALLING.batch.2.a'
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    - name: get_time
      parameters:
        type: object
        properties:
          timezone:
            type: string
    unavailable:
      dynamo: 'Dynamo parser v2 TC streaming not yet implemented for this family; vLLM/SGLang per-chunk output is the target to match.'
    chunks:
    - delta_text: '[TOOL_CAL'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: '[TOOL_CAL'
    - delta_text: 'LS][{"n'
      expected:
        vllm: []
        sglang: []
    - delta_text: 'ame": "get_we'
      expected:
        vllm: []
        sglang: []
    - delta_text: 'ather'
      expected:
        vllm: []
        sglang: []
    - delta_text: '", "arguments": {'
      expected:
        vllm: []
        sglang: []
    - delta_text: '"lo'
      expected:
        vllm: []
        sglang: []
    - delta_text: 'cation": '
      expected:
        vllm: []
        sglang: []
    - delta_text: '"NYC"}}'
      expected:
        vllm: []
        sglang: []
    - delta_text: ', {"name": "g'
      expected:
        vllm: []
        sglang: []
    - delta_text: 'et_ti'
      expected:
        vllm: []
        sglang: []
    - delta_text: 'me", "arguments":'
      expected:
        vllm: []
        sglang: []
    - delta_text: ' {"'
      expected:
        vllm: []
        sglang: []
    - delta_text: 'timezone"'
      expected:
        vllm: []
        sglang: []
    - delta_text: ': "EST"'
      expected:
        vllm: []
        sglang: []
    - delta_text: '}}][/TOOL_CAL'
      expected:
        vllm: []
        sglang: []
    - delta_text: 'LS]'
      expected:
        vllm: []
        sglang: []
    - delta_text: ''
      finish_reason: tool_calls
      expected:
        vllm: []
        sglang: []
