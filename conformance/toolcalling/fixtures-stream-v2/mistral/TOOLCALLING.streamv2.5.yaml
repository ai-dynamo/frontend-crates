        sglang: []
    - delta_text: ' "get_weather",'
      expected:
        vllm:
        - {index: 0, id: true, name: 'get_weather'}
        sglang: []
    - delta_text: ' "arguments": {"loc'
      expected:
        vllm:
        - {index: 0, arguments: '{"loc'}
        sglang: []
    - delta_text: ''
      finish_reason: stop
      expected:
        vllm: []
        sglang: []
  TOOLCALLING.streamv2.5.d:
    description: 'Multi-call, last call missing only end marker (body complete)'
    ref: 'derived from TOOLCALLING.batch.5.d'
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    unavailable:
      dynamo: 'Dynamo parser v2 TC streaming not yet implemented for this family; vLLM/SGLang per-chunk output is the target to match.'
    chunks:
    - delta_text: 'I''ll start'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: 'I''ll start'
        sglang: 'I''ll start'
    - delta_text: ' by'
      expected:
        vllm: []
        sglang: []
      normal_text:
