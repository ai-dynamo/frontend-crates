        vllm: []
        sglang: []
      normal_text:
        vllm: ' time!'
        sglang: ' time!'
    - delta_text: ' "get_weather",'
      expected:
        vllm:
        - {index: 0, id: true, name: 'get_weather'}
        sglang: []
    - delta_text: ' "arguments": {"location":'
      expected:
