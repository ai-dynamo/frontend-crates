        - {index: 0, arguments: '{"location":'}
        sglang: []
    - delta_text: ' "Boston"}},'
      expected:
        vllm:
        - {index: 0, arguments: ' "Boston"}'}
        sglang: []
    - delta_text: ' {"name": "get_weather", "arguments":'
      expected:
        vllm:
        - {index: 1, id: true, name: 'get_weather'}
        sglang: []
    - delta_text: ' {"location": "New'
      expected:
