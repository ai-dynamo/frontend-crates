# Streaming fixture (per-chunk, per-impl). Each chunk: input (delta_text +
# optional delta_token_ids) and `expected.<impl>` = tool-call deltas emitted at
# that chunk. `normal_text.<impl>` (when non-empty) = non-tool text (leaks show
# here). Assembled result is derived by concatenating per index. A delta:
# {index, id?, name?, arguments?}; id:true = an id was emitted.

family: mistral
model_label: 'Mistral series'
mode: streamv2
captured_with:
  vllm_rust: 'v0.23.0 78743ab5bffd381e88f97e1c8ba20473b0ae6d75'
  vllm_python: '0.23.0'
  sglang_python: '0.5.12.post1'
cases:
  TOOLCALLING.streamv2.50:
    description: 'Complete single tool call with a grammar token split across chunk boundaries'
    ref: 'derived from TOOLCALLING.batch.1'
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    unavailable:
      dynamo_rust: 'Dynamo parser v2 TC streaming not yet implemented for this family; vLLM Python/SGLang per-chunk output is the target to match.'
    chunks:
    - delta_text: '[T'
      expected:
        vllm_rust: []
        vllm_python: []
        sglang_python: []
      normal_text:
        vllm_python: '[T'
    - delta_text: 'OOL'
      expected:
        vllm_rust: []
        vllm_python: []
        sglang_python: []
      normal_text:
        vllm_python: 'OOL'
    - delta_text: '_CALL'
      expected:
        vllm_rust: []
        vllm_python: []
        sglang_python: []
      normal_text:
        vllm_python: '_CALL'
    - delta_text: 'S][{"name":'
      expected:
        vllm_rust: []
        vllm_python: []
        sglang_python: []
      normal_text:
        vllm_rust: '[TOOL_CALLS][{"name":'
    - delta_text: ' "get_weather", "ar'
      expected:
        vllm_rust: []
        vllm_python: []
        sglang_python: []
      normal_text:
        vllm_rust: ' "get_weather", "ar'
    - delta_text: 'gu'
      expected:
        vllm_rust: []
        vllm_python: []
        sglang_python: []
      normal_text:
        vllm_rust: 'gu'
    - delta_text: 'men'
      expected:
        vllm_rust: []
        vllm_python: []
        sglang_python: []
      normal_text:
        vllm_rust: 'men'
    - delta_text: 'ts": '
      expected:
        vllm_rust: []
        vllm_python: []
        sglang_python: []
      normal_text:
        vllm_rust: 'ts": '
    - delta_text: '{"location"'
      expected:
        vllm_rust: []
        vllm_python: []
        sglang_python: []
      normal_text:
        vllm_rust: '{"location"'
    - delta_text: ': "NYC"}}][/TOOL_CA'
      expected:
        vllm_rust: []
        vllm_python: []
        sglang_python: []
      normal_text:
        vllm_rust: ': "NYC"}}][/TOOL_CA'
    - delta_text: 'LL'
      expected:
        vllm_rust: []
        vllm_python: []
        sglang_python: []
      normal_text:
        vllm_rust: 'LL'
    - delta_text: 'S]'
      expected:
        vllm_rust: []
        vllm_python: []
        sglang_python: []
      normal_text:
        vllm_rust: 'S]'
    - delta_text: ''
      finish_reason: tool_calls
      expected:
        vllm_rust: []
        vllm_python: []
        sglang_python: []
