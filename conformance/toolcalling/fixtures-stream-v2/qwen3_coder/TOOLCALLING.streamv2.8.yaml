    - delta_text: '
</tool_call> Let me'
      expected:
        vllm:
        - {index: 0, arguments: '}'}
        sglang: []
      normal_text:
        sglang: ' Let me'
    - delta_text: ' know'
      expected:
        vllm: []
        sglang: []
      normal_text:
        sglang: ' know'
    - delta_text: ' if you'
      expected:
        vllm: []
        sglang: []
      normal_text:
