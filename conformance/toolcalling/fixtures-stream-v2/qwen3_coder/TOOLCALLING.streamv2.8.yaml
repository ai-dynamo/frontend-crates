# Streaming fixture (per-chunk, per-impl). Each chunk: input (delta_text +
# optional delta_token_ids) and `expected.<impl>` = tool-call deltas emitted at
# that chunk. `normal_text.<impl>` (when non-empty) = non-tool text (leaks show
# here). Assembled result is derived by concatenating per index. A delta:
# {index, id?, name?, arguments?}; id:true = an id was emitted.

family: qwen3_coder
model_label: 'Qwen 3 Coder'
mode: streamv2
captured_with:
  vllm: '0.22.0'
  sglang: '0.5.12.post1'
cases:
  TOOLCALLING.streamv2.8.a:
    description: 'Narration before tool call only'
    ref: 'derived from TOOLCALLING.batch.8.a'
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    unavailable:
      dynamo: 'Dynamo parser v2 TC streaming not yet implemented for this family; vLLM/SGLang per-chunk output is the target to match.'
    chunks:
    - delta_text: 'I will'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: 'I will'
        sglang: 'I will'
    - delta_text: ' check'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: ' check'
        sglang: ' check'
    - delta_text: ' the weather. <tool_call>'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: ' the weather. '
        sglang: ' the weather. '
    - delta_text: '
<function=get_weather>
<parameter=location>'
      expected:
        vllm:
        - {index: 0, id: true, name: 'get_weather', arguments: ''}
        sglang:
        - {index: 0, name: 'get_weather'}
    - delta_text: '
NYC'
      expected:
        vllm:
        - {index: 0, arguments: '{'}
        sglang: []
    - delta_text: '
</parameter>
</function>'
      expected:
        vllm:
        - {index: 0, arguments: '"location": "NYC"'}
        sglang:
        - {index: 0, arguments: '{'}
        - {index: 0, arguments: '"location": "NYC"'}
        - {index: 0, arguments: '}'}
    - delta_text: '
</tool_call>'
      expected:
        vllm:
        - {index: 0, arguments: '}'}
        sglang: []
    - delta_text: ''
      finish_reason: tool_calls
      expected:
        vllm: []
        sglang: []
  TOOLCALLING.streamv2.8.b:
    description: 'Narration after tool call only'
    ref: 'derived from TOOLCALLING.batch.8.b'
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
