            type: string
    unavailable:
      dynamo: 'Dynamo parser v2 TC streaming not yet implemented for this family; vLLM/SGLang per-chunk output is the target to match.'
    chunks:
    - delta_text: '<tool_call>
<function=get_weather>'
      expected:
        vllm: []
        sglang:
        - {index: 0, name: 'get_weather'}
    - delta_text: '
<parameter=location>'
      expected:
        vllm:
        - {index: 0, id: true, name: 'get_weather', arguments: ''}
        sglang: []
    - delta_text: '
NYC
</parameter>
</function>'
      expected:
        vllm:
        - {index: 0, arguments: '{'}
        sglang:
        - {index: 0, arguments: '{'}
        - {index: 0, arguments: '"location": "NYC"'}
        - {index: 0, arguments: '}'}
    - delta_text: '
</tool_call> Let'
      expected:
        vllm:
        - {index: 0, arguments: '"location": "NYC"'}
        sglang: []
      normal_text:
        sglang: ' Let'
    - delta_text: ' me'
      expected:
        vllm:
        - {index: 0, arguments: '}'}
        sglang: []
      normal_text:
        sglang: ' me'
    - delta_text: ' know if'
      expected:
        vllm: []
        sglang: []
      normal_text:
        sglang: ' know if'
    - delta_text: ' you need more.'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: ' you need more.'
        sglang: ' you need more.'
    - delta_text: ''
      finish_reason: tool_calls
      expected:
        vllm: []
        sglang: []
