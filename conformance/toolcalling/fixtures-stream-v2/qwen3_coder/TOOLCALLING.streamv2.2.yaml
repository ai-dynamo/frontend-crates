    unavailable:
      dynamo: 'Dynamo parser v2 TC streaming not yet implemented for this family; vLLM/SGLang per-chunk output is the target to match.'
    chunks:
    - delta_text: '<tool_call>
<function=get_weather>'
      expected:
        vllm: []
        sglang:
        - {index: 0, name: 'get_weather'}
    - delta_text: '
<parameter=location>'
      expected:
        vllm:
        - {index: 0, id: true, name: 'get_weather', arguments: ''}
        sglang: []
    - delta_text: '
NYC
</parameter>
</function>'
      expected:
        vllm:
        - {index: 0, arguments: '{'}
        sglang:
        - {index: 0, arguments: '{'}
        - {index: 0, arguments: '"location": "NYC"'}
        - {index: 0, arguments: '}'}
    - delta_text: '
</tool_call>
<tool_call>'
      expected:
        vllm:
        - {index: 0, arguments: '"location": "NYC"'}
        sglang: []
      normal_text:
        sglang: '
'
    - delta_text: '
<function=get_weather>'
      expected:
        vllm:
        - {index: 0, arguments: '}'}
        sglang:
        - {index: 1, name: 'get_weather'}
    - delta_text: '
<parameter=location>
LA'
      expected:
        vllm: []
        sglang: []
    - delta_text: '
</parameter>
</function>
</tool_call>'
      expected:
        vllm:
        - {index: 1, id: true, name: 'get_weather', arguments: ''}
        sglang:
        - {index: 1, arguments: '{'}
        - {index: 1, arguments: '"location": "LA"'}
        - {index: 1, arguments: '}'}
    - delta_text: ''
      finish_reason: tool_calls
