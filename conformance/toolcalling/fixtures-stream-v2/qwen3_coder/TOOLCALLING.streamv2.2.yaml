  TOOLCALLING.streamv2.2.a:
    description: Parallel calls (different names)
    ref: derived from TOOLCALLING.batch.2.a
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    - name: get_time
      parameters:
        type: object
        properties:
          timezone:
            type: string
    unavailable:
      dynamo_rust: Dynamo parser v2 TC streaming not yet implemented for this family; vLLM/SGLang
        per-chunk output is the target to match.
    chunks:
    - delta_text: <tool_call> <function=get_weather>
      expected:
        vllm_python: []
        sglang_python:
        - index: 0
          name: get_weather
        vllm_rust: []
    - delta_text: ' <parameter=location>'
      expected:
        vllm_python:
        - index: 0
          id: true
          name: get_weather
          arguments: ''
        sglang_python: []
        vllm_rust: []
    - delta_text: ' NYC </parameter> </function>'
      expected:
        vllm_python:
        - index: 0
          arguments: '{'
        sglang_python:
        - index: 0
          arguments: '{'
        - index: 0
          arguments: '"location": "NYC"'
        - index: 0
          arguments: '}'
        vllm_rust: []
    - delta_text: ' </tool_call> <tool_call>'
      expected:
        vllm_python:
        - index: 0
          arguments: '"location": "NYC"'
        sglang_python: []
        vllm_rust:
        - arguments: '{"location":" NYC "}'
          index: 0
          name: get_weather
      normal_text:
        sglang_python: ' '
        vllm_rust: ' '
    - delta_text: ' <function=get_time>'
      expected:
        vllm_python:
        - index: 0
          arguments: '}'
        sglang_python:
        - index: 1
          name: get_time
        vllm_rust: []
    - delta_text: ' <parameter=timezone> EST'
      expected:
        vllm_python: []
        sglang_python: []
        vllm_rust: []
    - delta_text: ' </parameter> </function> </tool_call>'
      expected:
        vllm_python:
        - index: 1
          id: true
          name: get_time
          arguments: ''
        sglang_python:
        - index: 1
          arguments: '{'
        - index: 1
          arguments: '"timezone": "EST"'
        - index: 1
          arguments: '}'
        vllm_rust:
        - arguments: '{"timezone":" EST "}'
          index: 1
          name: get_time
    - delta_text: ''
      finish_reason: tool_calls
      expected:
        vllm_python: []
        sglang_python: []
        vllm_rust: []
