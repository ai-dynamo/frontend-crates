# Streaming fixture (per-chunk, per-impl). Each chunk: input (delta_text +
# optional delta_token_ids) and `expected.<impl>` = tool-call deltas emitted at
# that chunk. `normal_text.<impl>` (when non-empty) = non-tool text (leaks show
# here). Assembled result is derived by concatenating per index. A delta:
# {index, id?, name?, arguments?}; id:true = an id was emitted.

family: qwen3_coder
model_label: 'Qwen 3 Coder'
mode: stream
captured_with:
  vllm: '0.22.0'
  sglang: '0.5.12.post1'
cases:
  TOOLCALLING.stream.2:
    description: 'Multiple tool calls split across multiple content chunks'
    ref: 'derived from TOOLCALLING.batch.2.a'
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    - name: get_time
      parameters:
        type: object
        properties:
          timezone:
            type: string
    unavailable:
      dynamo: 'Dynamo parser v2 TC streaming not yet implemented for this family; vLLM/SGLang per-chunk output is the target to match.'
    chunks:
    - delta_text: '<tool_cal'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: '<tool_cal'
    - delta_text: 'l>
<fun'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: 'l>
<fun'
    - delta_text: 'ction=get_wea'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: 'ction=get_wea'
    - delta_text: 'ther>'
      expected:
        vllm: []
        sglang:
        - {index: 0, name: 'get_weather'}
      normal_text:
        vllm: 'ther>'
    - delta_text: '
<parameter=locat'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: '
<parameter=locat'
    - delta_text: 'ion'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: 'ion'
    - delta_text: '>
NYC
</p'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: '>
NYC
</p'
    - delta_text: 'aramete'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: 'aramete'
    - delta_text: 'r>
</function'
      expected:
        vllm: []
        sglang:
        - {index: 0, arguments: '{'}
        - {index: 0, arguments: '"location": "NYC"'}
      normal_text:
        vllm: 'r>
</function'
    - delta_text: '>
</t'
      expected:
        vllm: []
        sglang:
        - {index: 0, arguments: '}'}
      normal_text:
        vllm: '>
</t'
    - delta_text: 'ool_call>
<tool_c'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: 'ool_call>
<tool_c'
        sglang: '
'
    - delta_text: 'all'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: 'all'
    - delta_text: '>
<functi'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: '>
<functi'
    - delta_text: 'on=get_'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: 'on=get_'
    - delta_text: 'time>
<parame'
      expected:
        vllm: []
        sglang:
        - {index: 1, name: 'get_time'}
      normal_text:
        vllm: 'time>
<parame'
    - delta_text: 'ter=t'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: 'ter=t'
    - delta_text: 'imezone>
EST
</pa'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: 'imezone>
EST
</pa'
    - delta_text: 'ram'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: 'ram'
    - delta_text: 'eter>
</f'
      expected:
        vllm: []
        sglang:
        - {index: 1, arguments: '{'}
        - {index: 1, arguments: '"timezone": "EST"'}
      normal_text:
        vllm: 'eter>
</f'
    - delta_text: 'unction'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: 'unction'
    - delta_text: '>
</tool_call'
      expected:
        vllm: []
        sglang:
        - {index: 1, arguments: '}'}
      normal_text:
        vllm: '>
</tool_call'
    - delta_text: '>'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: '>'
    - delta_text: ''
      finish_reason: tool_calls
      expected:
        vllm: []
        sglang: []
