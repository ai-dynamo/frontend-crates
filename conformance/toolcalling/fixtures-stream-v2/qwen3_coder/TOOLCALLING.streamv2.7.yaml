# Streaming fixture (per-chunk, per-impl). Each chunk: input (delta_text +
# optional delta_token_ids) and `expected.<impl>` = tool-call deltas emitted at
# that chunk. `normal_text.<impl>` (when non-empty) = non-tool text (leaks show
# here). Assembled result is derived by concatenating per index. A delta:
# {index, id?, name?, arguments?}; id:true = an id was emitted.

family: qwen3_coder
model_label: 'Qwen 3 Coder'
mode: streamv2
captured_with:
  vllm: '0.22.0'
  sglang: '0.5.12.post1'
cases:
  TOOLCALLING.streamv2.7.a:
    description: 'Multiple parameters (existing multi-arg shape)'
    ref: 'derived from TOOLCALLING.batch.7.a'
    tools:
    - name: book_flight
      parameters:
        type: object
        properties:
          destination:
            type: string
          passengers:
            type: integer
          first_class:
            type: boolean
    unavailable:
      dynamo: 'Dynamo parser v2 TC streaming not yet implemented for this family; vLLM/SGLang per-chunk output is the target to match.'
    chunks:
    - delta_text: '<tool_call>
<function=book_flight>'
      expected:
        vllm: []
        sglang:
        - {index: 0, name: 'book_flight'}
    - delta_text: '
<parameter=destination>'
      expected:
        vllm:
        - {index: 0, id: true, name: 'book_flight', arguments: ''}
        sglang: []
    - delta_text: '
Paris
</parameter>
<parameter=passengers>'
      expected:
        vllm:
        - {index: 0, arguments: '{'}
        sglang:
        - {index: 0, arguments: '{'}
        - {index: 0, arguments: '"destination": "Paris"'}
    - delta_text: '
2
</parameter>'
      expected:
        vllm:
        - {index: 0, arguments: '"destination": "Paris", "passengers": "2"'}
        sglang:
        - {index: 0, arguments: ', "passengers": 2'}
    - delta_text: '
<parameter=first_class>'
      expected:
        vllm: []
        sglang: []
    - delta_text: '
true
</parameter>'
      expected:
        vllm:
        - {index: 0, arguments: ', "first_class": "true"'}
        sglang:
        - {index: 0, arguments: ', "first_class": true'}
    - delta_text: '
</function>
</tool_call>'
      expected:
        vllm:
        - {index: 0, arguments: '}'}
        sglang:
        - {index: 0, arguments: '}'}
    - delta_text: ''
      finish_reason: tool_calls
      expected:
        vllm: []
        sglang: []
  TOOLCALLING.streamv2.7.b:
    description: 'Unicode in parameter value'
    ref: 'derived from TOOLCALLING.batch.7.b'
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    unavailable:
      dynamo: 'Dynamo parser v2 TC streaming not yet implemented for this family; vLLM/SGLang per-chunk output is the target to match.'
    chunks:
    - delta_text: '<tool_call>
<function=get_weather>'
      expected:
        vllm: []
        sglang:
        - {index: 0, name: 'get_weather'}
    - delta_text: '
<parameter=location>'
      expected:
        vllm:
        - {index: 0, id: true, name: 'get_weather', arguments: ''}
        sglang: []
    - delta_text: '
Tōkyō central
</parameter>'
      expected:
        vllm:
        - {index: 0, arguments: '{'}
        sglang:
        - {index: 0, arguments: '{'}
        - {index: 0, arguments: '"location": "Tōkyō central"'}
    - delta_text: '
</function>
</tool_call>'
      expected:
        vllm:
        - {index: 0, arguments: '"location": "Tōkyō central"'}
        sglang:
        - {index: 0, arguments: '}'}
    - delta_text: ''
      finish_reason: tool_calls
      expected:
        vllm: []
        sglang: []
  TOOLCALLING.streamv2.7.f:
    description: 'Numeric precision edge preserves integer-like number literal'
    ref: 'derived from TOOLCALLING.batch.7.f'
    tools:
    - name: set_limit
      parameters:
        type: object
        properties:
          count:
            type: number
    unavailable:
      dynamo: 'Dynamo parser v2 TC streaming not yet implemented for this family; vLLM/SGLang per-chunk output is the target to match.'
    chunks:
    - delta_text: '<tool_call>
<function=set_limit>'
      expected:
        vllm: []
        sglang:
        - {index: 0, name: 'set_limit'}
    - delta_text: '
<parameter=count>'
      expected:
        vllm:
        - {index: 0, id: true, name: 'set_limit', arguments: ''}
        sglang: []
    - delta_text: '9007199254740993</parameter>
</function>
</tool_call>'
      expected:
        vllm:
        - {index: 0, arguments: '{'}
        sglang:
        - {index: 0, arguments: '{'}
        - {index: 0, arguments: '"count": 9007199254740992'}
        - {index: 0, arguments: '}'}
    - delta_text: ''
      finish_reason: tool_calls
      expected:
        vllm: []
        sglang: []
