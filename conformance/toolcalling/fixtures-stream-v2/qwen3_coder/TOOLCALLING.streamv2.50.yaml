# Streaming fixture (per-chunk, per-impl). Each chunk: input (delta_text +
# optional delta_token_ids) and `expected.<impl>` = tool-call deltas emitted at
# that chunk. `normal_text.<impl>` (when non-empty) = non-tool text (leaks show
# here). Assembled result is derived by concatenating per index. A delta:
# {index, id?, name?, arguments?}; id:true = an id was emitted.

family: qwen3_coder
model_label: 'Qwen 3 Coder'
mode: streamv2
captured_with:
  vllm: '0.22.0'
  sglang: '0.5.12.post1'
cases:
  TOOLCALLING.streamv2.50:
    description: 'Complete single tool call with a grammar token split across chunk boundaries'
    ref: 'derived from TOOLCALLING.batch.1'
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    unavailable:
      dynamo: 'Dynamo parser v2 TC streaming not yet implemented for this family; vLLM/SGLang per-chunk output is the target to match.'
    chunks:
    - delta_text: '<t'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: '<t'
    - delta_text: 'ool'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: 'ool'
    - delta_text: '_call'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: '_call'
    - delta_text: '>
<function'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: '>
<function'
    - delta_text: '=get_weather>
<para'
      expected:
        vllm: []
        sglang:
        - {index: 0, name: 'get_weather'}
      normal_text:
        vllm: '=get_weather>
<para'
    - delta_text: 'me'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: 'me'
    - delta_text: 'ter'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: 'ter'
    - delta_text: '=loca'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: '=loca'
    - delta_text: 'tion>
NYC
<'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: 'tion>
NYC
<'
    - delta_text: '/parameter>
</funct'
      expected:
        vllm: []
        sglang:
        - {index: 0, arguments: '{'}
        - {index: 0, arguments: '"location": "NYC"'}
      normal_text:
        vllm: '/parameter>
</funct'
    - delta_text: 'io'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: 'io'
    - delta_text: 'n>
'
      expected:
        vllm: []
        sglang:
        - {index: 0, arguments: '}'}
      normal_text:
        vllm: 'n>
'
    - delta_text: '</too'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: '</too'
    - delta_text: 'l_call>'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: 'l_call>'
    - delta_text: ''
      finish_reason: tool_calls
      expected:
        vllm: []
        sglang: []
