# Streaming fixture (per-chunk, per-impl). Each chunk: input (delta_text +
# optional delta_token_ids) and `expected.<impl>` = tool-call deltas emitted at
# that chunk. `normal_text.<impl>` (when non-empty) = non-tool text (leaks show
# here). Assembled result is derived by concatenating per index. A delta:
# {index, id?, name?, arguments?}; id:true = an id was emitted.

family: qwen3_coder
model_label: 'Qwen 3 Coder'
mode: streamv2
captured_with:
  dynamo_rust: 'Dynamo parser v2'
  vllm_rust: 'v0.23.0 78743ab5bffd381e88f97e1c8ba20473b0ae6d75'
  vllm_python: '0.23.0'
  sglang_python: '0.5.12.post1'
cases:
  TOOLCALLING.streamv2.50:
    description: 'Complete single tool call with a grammar token split across chunk boundaries'
    ref: 'derived from TOOLCALLING.batch.1'
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    chunks:
    - delta_text: '<t'
      expected:
        dynamo_rust: []
        vllm_rust: []
        vllm_python: []
        sglang_python: []
      normal_text:
        vllm_python: '<t'
    - delta_text: 'ool'
      expected:
        dynamo_rust: []
        vllm_rust: []
        vllm_python: []
        sglang_python: []
      normal_text:
        vllm_python: 'ool'
    - delta_text: '_call'
      expected:
        dynamo_rust: []
        vllm_rust: []
        vllm_python: []
        sglang_python: []
      normal_text:
        vllm_python: '_call'
    - delta_text: '> <function'
      expected:
        dynamo_rust: []
        vllm_rust: []
        vllm_python: []
        sglang_python: []
      normal_text:
        vllm_python: '> <function'
    - delta_text: '=get_weather> <para'
      expected:
        dynamo_rust: []
        vllm_rust: []
        vllm_python: []
        sglang_python:
        - {index: 0, name: 'get_weather'}
      normal_text:
        vllm_python: '=get_weather> <para'
    - delta_text: 'me'
      expected:
        dynamo_rust: []
        vllm_rust: []
        vllm_python: []
        sglang_python: []
      normal_text:
        vllm_python: 'me'
    - delta_text: 'ter'
      expected:
        dynamo_rust: []
        vllm_rust: []
        vllm_python: []
        sglang_python: []
      normal_text:
        vllm_python: 'ter'
    - delta_text: '=loca'
      expected:
        dynamo_rust: []
        vllm_rust: []
        vllm_python: []
        sglang_python: []
      normal_text:
        vllm_python: '=loca'
    - delta_text: 'tion> NYC <'
      expected:
        dynamo_rust: []
        vllm_rust: []
        vllm_python: []
        sglang_python: []
      normal_text:
        vllm_python: 'tion> NYC <'
    - delta_text: '/parameter> </funct'
      expected:
        dynamo_rust: []
        vllm_rust: []
        vllm_python: []
        sglang_python:
        - {index: 0, arguments: '{'}
        - {index: 0, arguments: '"location": " NYC "'}
      normal_text:
        vllm_python: '/parameter> </funct'
    - delta_text: 'io'
      expected:
        dynamo_rust: []
        vllm_rust: []
        vllm_python: []
        sglang_python: []
      normal_text:
        vllm_python: 'io'
    - delta_text: 'n> '
      expected:
        dynamo_rust:
        - {index: 0, name: 'get_weather', arguments: '{"location":"NYC"}'}
        vllm_rust: []
        vllm_python: []
        sglang_python:
        - {index: 0, arguments: '}'}
      normal_text:
        vllm_python: 'n> '
    - delta_text: '</too'
      expected:
        dynamo_rust: []
        vllm_rust: []
        vllm_python: []
        sglang_python: []
      normal_text:
        vllm_python: '</too'
    - delta_text: 'l_call>'
      expected:
        dynamo_rust: []
        vllm_rust:
        - {index: 0, name: 'get_weather', arguments: '{"location":" NYC "}'}
        vllm_python: []
        sglang_python: []
      normal_text:
        vllm_python: 'l_call>'
    - delta_text: ''
      finish_reason: tool_calls
      expected:
        dynamo_rust: []
        vllm_rust: []
        vllm_python: []
        sglang_python: []
