# Streaming fixture (per-chunk, per-impl). Each chunk: input (delta_text +
# optional delta_token_ids) and `expected.<impl>` = tool-call deltas emitted at
# that chunk. `normal_text.<impl>` (when non-empty) = non-tool text (leaks show
# here). Assembled result is derived by concatenating per index. A delta:
# {index, id?, name?, arguments?}; id:true = an id was emitted.

family: qwen3_coder
model_label: 'Qwen 3 Coder'
mode: streamv2
captured_with:
  vllm: '0.22.0'
  sglang: '0.5.12.post1'
cases:
  TOOLCALLING.streamv2.10:
    description: 'Duplicate calls (same name twice)'
    ref: 'derived from TOOLCALLING.batch.10'
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    unavailable:
      dynamo: 'Dynamo parser v2 TC streaming not yet implemented for this family; vLLM/SGLang per-chunk output is the target to match.'
    chunks:
    - delta_text: '<tool_call>
<function=get_weather>'
      expected:
        vllm: []
        sglang:
        - {index: 0, name: 'get_weather'}
    - delta_text: '
<parameter=location>'
      expected:
        vllm:
        - {index: 0, id: true, name: 'get_weather', arguments: ''}
        sglang: []
    - delta_text: '
NYC
</parameter>
</function>'
      expected:
        vllm:
        - {index: 0, arguments: '{'}
        sglang:
        - {index: 0, arguments: '{'}
        - {index: 0, arguments: '"location": "NYC"'}
        - {index: 0, arguments: '}'}
    - delta_text: '
</tool_call>
<tool_call>'
      expected:
        vllm:
        - {index: 0, arguments: '"location": "NYC"'}
        sglang: []
      normal_text:
        sglang: '
'
    - delta_text: '
<function=get_weather>'
      expected:
        vllm:
        - {index: 0, arguments: '}'}
        sglang:
        - {index: 1, name: 'get_weather'}
    - delta_text: '
<parameter=location>
LA'
      expected:
        vllm: []
        sglang: []
    - delta_text: '
</parameter>
</function>
</tool_call>'
      expected:
        vllm:
        - {index: 1, id: true, name: 'get_weather', arguments: ''}
        sglang:
        - {index: 1, arguments: '{'}
        - {index: 1, arguments: '"location": "LA"'}
        - {index: 1, arguments: '}'}
    - delta_text: ''
      finish_reason: tool_calls
      expected:
        vllm: []
        sglang: []
