# Streaming fixture (per-chunk, per-impl). Each chunk: input (delta_text +
# optional delta_token_ids) and `expected.<impl>` = tool-call deltas emitted at
# that chunk. `normal_text.<impl>` (when non-empty) = non-tool text (leaks show
# here). Assembled result is derived by concatenating per index. A delta:
# {index, id?, name?, arguments?}; id:true = an id was emitted.

family: qwen3_coder
model_label: 'Qwen 3 Coder'
mode: streamv2
captured_with:
  vllm: '0.22.0'
  sglang: '0.5.12.post1'
cases:
  TOOLCALLING.streamv2.4.a:
    description: 'Tool_call wrapper with no <function> body'
    ref: 'derived from TOOLCALLING.batch.4.a'
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    unavailable:
      dynamo: 'Dynamo parser v2 TC streaming not yet implemented for this family; vLLM/SGLang per-chunk output is the target to match.'
    chunks:
    - delta_text: '<tool_call>
random'
      expected:
        vllm: []
        sglang: []
    - delta_text: ' text'
      expected:
        vllm: []
        sglang: []
    - delta_text: ' without function tag'
      expected:
        vllm: []
        sglang: []
    - delta_text: '
</tool_call>'
      expected:
        vllm: []
        sglang: []
    - delta_text: ''
      finish_reason: stop
      expected:
        vllm: []
        sglang: []
  TOOLCALLING.streamv2.4.d:
    description: 'Missing </parameter> closing tag'
    ref: 'derived from TOOLCALLING.batch.4.d'
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    unavailable:
      dynamo: 'Dynamo parser v2 TC streaming not yet implemented for this family; vLLM/SGLang per-chunk output is the target to match.'
    chunks:
    - delta_text: '<tool_call>
<function=get_weather>'
      expected:
        vllm: []
        sglang:
        - {index: 0, name: 'get_weather'}
    - delta_text: '
<parameter=location>'
      expected:
        vllm:
        - {index: 0, id: true, name: 'get_weather', arguments: ''}
        sglang: []
    - delta_text: '
NYC
</function>
</tool_call>'
      expected:
        vllm:
        - {index: 0, arguments: '{'}
        sglang:
        - {index: 0, arguments: '{'}
        - {index: 0, arguments: '"location": "NYC"'}
        - {index: 0, arguments: '}'}
    - delta_text: ''
      finish_reason: tool_calls
      expected:
        vllm: []
        sglang: []
  TOOLCALLING.streamv2.4.f:
    description: 'Tool name emitted as an XML tag instead of <function=...>'
    ref: 'derived from TOOLCALLING.batch.4.f'
    tools:
    - name: Terminal
      parameters:
        type: object
        properties:
          command:
            type: string
    unavailable:
      dynamo: 'Dynamo parser v2 TC streaming not yet implemented for this family; vLLM/SGLang per-chunk output is the target to match.'
    chunks:
    - delta_text: '<tool_call>
<terminal>'
      expected:
        vllm: []
        sglang: []
    - delta_text: '
echo'
      expected:
        vllm: []
        sglang: []
    - delta_text: ' hello
</function>
</tool_call>'
      expected:
        vllm: []
        sglang:
        - {index: -1, arguments: '{'}
        - {index: -1, arguments: '}'}
    - delta_text: ''
      finish_reason: stop
      expected:
        vllm: []
        sglang: []
