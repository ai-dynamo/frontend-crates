  TOOLCALLING.streamv2.2.c:
    description: 'Parallel calls with surrounding narration'
    ref: 'derived from TOOLCALLING.batch.2.c'
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    - name: get_time
      parameters:
        type: object
        properties:
          timezone:
            type: string
    unavailable:
      dynamo: 'Dynamo parser v2 TC streaming not yet implemented for this family; vLLM/SGLang per-chunk output is the target to match.'
    chunks:
    - delta_text: 'I will'
      expected:
        vllm: []
        sglang: []
      normal_text:
        vllm: 'I will'
        sglang: 'I will'
    - delta_text: ' check'
      expected:
        vllm: []
