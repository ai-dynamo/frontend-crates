    - delta_text: 'ns.get_we'
    - delta_text: 'ather:0'
    - delta_text: '<|tool_call_a'
    - delta_text: 'rgume'
    - delta_text: 'nt_begin|>{"locat'
    - delta_text: 'ion'
    - delta_text: '":"NYC"}<'
    - delta_text: '|tool_c'
    - delta_text: 'all_end|><|to'
    - delta_text: 'ol_ca'
    - delta_text: 'll_begin|>functio'
    - delta_text: 'ns.'
    - delta_text: 'get_time:'
