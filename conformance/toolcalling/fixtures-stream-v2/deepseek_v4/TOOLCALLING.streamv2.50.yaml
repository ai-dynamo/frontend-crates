        - {index: 0, name: 'get_weather', arguments: ''}
        vllm_rust: []
        vllm_python:
        - {index: 0, id: true, name: 'get_weather', arguments: ''}
        sglang_python:
        - {index: 0, name: 'get_weather'}
    - delta_text: 'arameter name="loca'
      expected:
        dynamo_rust: []
        vllm_rust: []
