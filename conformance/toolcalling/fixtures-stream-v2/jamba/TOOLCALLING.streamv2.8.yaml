    chunks:
    - delta_text: '<tool_calls>[{"name":'
      expected:
        vllm: []
    - delta_text: ' "get_weather",'
      expected:
        vllm: []
    - delta_text: ' "arguments": {"location": "NYC"}}]'
      expected:
        vllm:
        - {index: 0, id: true, name: 'get_weather'}
    - delta_text: '</tool_calls> Let'
      expected:
        vllm:
        - {index: 0, arguments: ''}
    - delta_text: ' me'
      expected:
        vllm:
        - {index: 0, arguments: ''}
    - delta_text: ' know if'
      expected:
        vllm:
        - {index: 0, arguments: ''}
    - delta_text: ' you need more.'
      expected:
        vllm:
        - {index: 0, arguments: ''}
    - delta_text: ''
      finish_reason: tool_calls
      expected:
        vllm:
        - {index: 0, arguments: ''}
