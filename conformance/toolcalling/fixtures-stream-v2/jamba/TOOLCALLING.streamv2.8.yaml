# Streaming fixture (per-chunk, per-impl). Each chunk: input (delta_text +
# optional delta_token_ids) and `expected.<impl>` = tool-call deltas emitted at
# that chunk. `normal_text.<impl>` (when non-empty) = non-tool text (leaks show
# here). Assembled result is derived by concatenating per index. A delta:
# {index, id?, name?, arguments?}; id:true = an id was emitted.

family: jamba
model_label: 'AI21 Jamba'
mode: streamv2
captured_with:
  vllm_python: '0.23.0'
cases:
  TOOLCALLING.streamv2.8.a:
    description: 'Narration before tool call only'
    ref: 'derived from TOOLCALLING.batch.8.a'
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    unavailable:
      dynamo_rust: 'Dynamo parser v2 TC streaming not yet implemented for this family; vLLM Python/SGLang per-chunk output is the target to match.'
      vllm_rust: 'No vLLM Rust parser for family ''jamba''.'
      sglang_python: 'No SGLang Python parser for family ''jamba''.'
    chunks:
    - delta_text: 'I will'
      expected:
        vllm_python: []
      normal_text:
        vllm_python: 'I will'
    - delta_text: ' check'
      expected:
        vllm_python: []
      normal_text:
        vllm_python: ' check'
    - delta_text: ' the weather. <tool_calls>'
      expected:
        vllm_python: []
    - delta_text: '[{"name": "get_weather",'
      expected:
        vllm_python: []
    - delta_text: ' "arguments":'
      expected:
        vllm_python:
        - {index: 0, id: true, name: 'get_weather'}
    - delta_text: ' {"location": "NYC"}}]'
      expected:
        vllm_python: []
    - delta_text: '</tool_calls>'
      expected:
        vllm_python: []
    - delta_text: ''
      finish_reason: stop
      expected:
        vllm_python:
        - {index: 0, arguments: ''}
  TOOLCALLING.streamv2.8.b:
    description: 'Narration after tool call only'
    dynamo_note: 'AI21 Jamba publishes only an encoder chat_template; the card describes encoding with no decode or ordering rule but is silent on natural-language text that follows the tool-call block. The model can emit trailing or inter-call prose, and nothing in the spec dictates whether a parser keeps or drops it; both readings are defensible. Because dropping silently discards genuine user-facing assistant text, Dynamo keeps it — it strips only the tool-call markup and preserves the surrounding narration verbatim. No published rule is violated, because the spec does not address this case. Source: https://huggingface.co/ai21labs/AI21-Jamba-1.5-Mini'
    ref: 'derived from TOOLCALLING.batch.8.b'
    tools:
    - name: get_weather
