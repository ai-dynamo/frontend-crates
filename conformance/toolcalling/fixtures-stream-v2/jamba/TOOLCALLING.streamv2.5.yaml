      normal_text:
        vllm: 'I''ll start'
    - delta_text: ' by'
      expected:
        vllm: []
      normal_text:
        vllm: ' by'
    - delta_text: ' fetching the weather'
      expected:
        vllm: []
      normal_text:
        vllm: ' fetching the weather'
    - delta_text: ' for both'
