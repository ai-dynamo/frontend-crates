    chunks:
    - delta_text: '[{"name": "get_weather",'
      expected:
        vllm: []
      normal_text:
        vllm: '[{"name": "get_weather",'
    - delta_text: ' "arguments":'
      expected:
        vllm: []
      normal_text:
        vllm: ' "arguments":'
    - delta_text: ' {"location": "NYC"}}]</tool_calls>'
      expected:
        vllm: []
      normal_text:
        vllm: ' {"location": "NYC"}}]</tool_calls>'
    - delta_text: ''
      finish_reason: stop
      expected:
        vllm: []
