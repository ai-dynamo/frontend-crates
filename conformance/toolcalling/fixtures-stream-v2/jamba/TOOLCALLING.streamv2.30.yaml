# Streaming fixture (per-chunk, per-impl). Each chunk: input (delta_text +
# optional delta_token_ids) and `expected.<impl>` = tool-call deltas emitted at
# that chunk. `normal_text.<impl>` (when non-empty) = non-tool text (leaks show
# here). Assembled result is derived by concatenating per index. A delta:
# {index, id?, name?, arguments?}; id:true = an id was emitted.

family: jamba
model_label: 'AI21 Jamba'
mode: streamv2
captured_with:
  vllm: '0.22.0'
cases:
  TOOLCALLING.streamv2.30.a:
    description: 'JSON-array call separator `,` inside one argument string value'
    ref: 'derived from TOOLCALLING.batch.30.a'
    tools:
    - name: run_query
      parameters:
        type: object
        properties:
          sql:
            type: string
    unavailable:
      dynamo: 'Dynamo parser v2 TC streaming not yet implemented for this family; vLLM/SGLang per-chunk output is the target to match.'
      sglang: 'No SGLang parser for family ''jamba''.'
    chunks:
    - delta_text: '<tool_calls>[{"name":'
      expected:
        vllm: []
    - delta_text: ' "run_query",'
      expected:
        vllm: []
    - delta_text: ' "arguments": {"sql": "SELECT'
      expected:
        vllm:
        - {index: 0, id: true, name: 'run_query'}
    - delta_text: ' a, SELECT'
      expected:
        vllm:
        - {index: 0, arguments: '{"sql": "SELECT a, SELECT'}
    - delta_text: ' b"}}]'
      expected:
        vllm:
        - {index: 0, arguments: ' b'}
    - delta_text: '</tool_calls>'
      expected:
        vllm:
        - {index: 0, arguments: ''}
    - delta_text: ''
      finish_reason: tool_calls
      expected:
        vllm:
        - {index: 0, arguments: ''}
  TOOLCALLING.streamv2.30.b:
    description: 'JSON structural delimiters `}` and `]` inside one argument string value'
    ref: 'derived from TOOLCALLING.batch.30.b'
    tools:
    - name: run_query
      parameters:
        type: object
        properties:
          sql:
            type: string
    unavailable:
      dynamo: 'Dynamo parser v2 TC streaming not yet implemented for this family; vLLM/SGLang per-chunk output is the target to match.'
      sglang: 'No SGLang parser for family ''jamba''.'
    chunks:
    - delta_text: '<tool_calls>[{"name":'
      expected:
        vllm: []
    - delta_text: ' "run_query",'
      expected:
        vllm: []
    - delta_text: ' "arguments": {"sql": "SELECT'
      expected:
        vllm:
        - {index: 0, id: true, name: 'run_query'}
    - delta_text: ' value WHERE'
      expected:
        vllm:
        - {index: 0, arguments: '{"sql": "SELECT value WHERE'}
    - delta_text: ' note'
      expected:
        vllm:
        - {index: 0, arguments: ' note'}
    - delta_text: ' has brace'
      expected:
        vllm:
        - {index: 0, arguments: ' has brace'}
    - delta_text: ' } and bracket'
      expected:
        vllm:
        - {index: 0, arguments: ' } and bracket'}
    - delta_text: ' ]'
      expected:
        vllm:
        - {index: 0, arguments: ' ]'}
    - delta_text: '"}}]</tool_calls>'
      expected:
        vllm:
        - {index: 0, arguments: ''}
    - delta_text: ''
      finish_reason: tool_calls
      expected:
        vllm:
        - {index: 0, arguments: ''}
  TOOLCALLING.streamv2.30.c:
    description: 'XML wrapper marker `<tool_calls>...</tool_calls>` text inside one argument string value'
    ref: 'derived from TOOLCALLING.batch.30.c'
    tools:
    - name: run_query
      parameters:
        type: object
        properties:
          sql:
            type: string
    unavailable:
      dynamo: 'Dynamo parser v2 TC streaming not yet implemented for this family; vLLM/SGLang per-chunk output is the target to match.'
      sglang: 'No SGLang parser for family ''jamba''.'
    chunks:
    - delta_text: '<tool_calls>[{"name":'
      expected:
        vllm: []
    - delta_text: ' "run_query",'
      expected:
        vllm: []
    - delta_text: ' "arguments": {"sql": "literal'
      expected:
        vllm:
        - {index: 0, id: true, name: 'run_query'}
    - delta_text: ' <tool_calls marker>'
      expected:
        vllm:
        - {index: 0, arguments: '{"sql": "literal <tool_calls marker>'}
    - delta_text: '[]'
      expected:
        vllm:
        - {index: 0, arguments: '[]'}
    - delta_text: '</tool_calls marker>'
      expected:
        vllm:
        - {index: 0, arguments: '</tool_calls marker>'}
    - delta_text: ' stays text"}}]</tool_calls>'
      expected:
        vllm:
        - {index: 0, arguments: ' stays text'}
    - delta_text: ''
      finish_reason: tool_calls
      expected:
        vllm:
        - {index: 0, arguments: ''}
