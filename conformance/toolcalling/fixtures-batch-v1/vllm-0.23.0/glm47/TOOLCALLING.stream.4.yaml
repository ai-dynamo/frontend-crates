# Full anchor for vllm@0.23.0 (lowest version = baseline). expected.vllm only.
family: glm47
mode: stream
cases:
  TOOLCALLING.stream.4.a:
    expected:
      vllm:
        calls:
        - name: get_weather
          arguments: '{"location": "NYC"'
        normal_text: ''
        reason: 'Impl-defined recovery for TOOLCALLING.batch.5-class missing end-token (per `tests/parity/README.md` "permanent divergences"). vLLM''s `_build_args_json_so_far` (`glm4_moe_tool_parser.py:331-417`) builds the args JSON from completed `<arg_key>/<arg_value>` pairs and only appends the closing `}` when `is_complete=True`, which `_extract_tool_call_regions` (line 293) sets after observing `</tool_call>`. On EOF mid-`<tool_call>`, `is_complete=False`, so the streaming diff ships `{"location": "NYC"` with no closing brace. Dynamo drops the truncated call (`glm47_parser.rs:194-215`, `allow_eof_recovery=false` production default). Matches SGLang.'
  TOOLCALLING.stream.4.b:
    expected:
      vllm:
        calls:
        - name: get_weather
          arguments: '{"location": "N'
        normal_text: ''
        reason: 'Impl-defined recovery for TOOLCALLING.batch.5-class missing end-token (per `tests/parity/README.md` "permanent divergences"). vLLM''s `_build_args_json_so_far` (`glm4_moe_tool_parser.py:331-417`) detects a partial `<arg_value>` (`has_partial_value=True`, line 365) and takes the string-type partial branch at line 403 (`parts.append(f''{key_json}: "{escaped}'')`), opening a JSON quote without closing it; the wrapping `{`/`}` follow the same `is_complete=False` path (the `</tool_call>` end was never observed), so the streamed args end at `{"location": "N` with no closing `"` or `}`. Dynamo drops the truncated call (`glm47_parser.rs:194-215`). Matches SGLang.'
  TOOLCALLING.stream.4.c:
    expected:
      vllm:
        calls: []
        normal_text: get_weather<arg_key>location</arg_key><arg_value>NYC</arg_value></tool_call></tool_call></tool_call>
        reason: vLLM preserves the raw GLM call body as content when the opening <tool_call> marker is missing; Dynamo recovers the complete bare call body and drops close-marker spam.
