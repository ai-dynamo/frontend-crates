# Full anchor for vllm@0.23.0 (lowest version = baseline). expected.vllm only.
family: deepseek_v3_2
mode: batch
cases:
  TOOLCALLING.batch.8.a:
    expected:
      vllm:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        normal_text: 'I will check the weather. '
  TOOLCALLING.batch.8.b:
    expected:
      vllm:
        calls:
        - arguments:
            location: NYC
          name: get_weather
        normal_text: ''
  TOOLCALLING.batch.8.c:
    expected:
      vllm:
        calls:
        - arguments:
            location: NYC
          name: get_weather
        normal_text: 'I will check the weather. '
  TOOLCALLING.batch.8.d:
    expected:
      vllm:
        calls:
        - arguments:
            location: NYC
          name: get_weather
        - arguments:
            location: LA
          name: get_weather
        normal_text: 'I will check the weather. '
