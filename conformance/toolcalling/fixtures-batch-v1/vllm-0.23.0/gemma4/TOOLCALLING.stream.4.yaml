# Full anchor for vllm@0.23.0 (lowest version = baseline). expected.vllm only.
family: gemma4
mode: stream
cases:
  TOOLCALLING.stream.4.a:
    expected:
      vllm:
        calls:
        - name: get_weather
          arguments: '{"location": "NYC'
        normal_text: ''
        reason: vLLM emits partial arguments before the required `<tool_call|>` end marker; Dynamo and SGLang recover the complete call body.
  TOOLCALLING.stream.4.b:
    expected:
      vllm:
        calls:
        - name: get_weather
          arguments: '{"location": "N'
        normal_text: ''
        reason: vLLM emits partial arguments from a mid-body truncated call; Dynamo follows Gemma4 batch.5 and drops incomplete envelopes without leaking markup.
  TOOLCALLING.stream.4.c:
    expected:
      vllm:
        calls: []
        normal_text: call:get_weather{location:<|"|>NYC<|"|>}<tool_call|><tool_call|><tool_call|>
        reason: vLLM preserves the raw Gemma call body as content when the opening <|tool_call> marker is missing; Dynamo recovers the complete bare call body and drops close-marker spam.
