# Full anchor for vllm@0.23.0 (lowest version = baseline). expected.vllm only.
family: phi4
mode: batch
cases:
  TOOLCALLING.batch.1:
    expected:
      vllm:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        normal_text: ''
  TOOLCALLING.batch.3:
    expected:
      vllm:
        calls: []
        normal_text: Hello, how can I help you today?
  TOOLCALLING.batch.9.a:
    expected:
      vllm:
        calls: []
        normal_text: ''
  TOOLCALLING.batch.9.b:
    expected:
      vllm:
        calls: []
        normal_text: '   '
  TOOLCALLING.batch.10:
    expected:
      vllm:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        - name: get_weather
          arguments:
            location: LA
        normal_text: ''
  TOOLCALLING.batch.30.a:
    expected:
      vllm:
        calls:
        - name: run_query
          arguments:
            sql: SELECT a, SELECT b
        normal_text: ''
  TOOLCALLING.batch.30.b:
    expected:
      vllm:
        reason: vLLM Phi-4 splits on the closing bracket inside the argument string, then drops the call when JSON parsing fails.
        calls: []
  TOOLCALLING.batch.30.c:
    expected:
      vllm:
        reason: vLLM Phi-4 splits on the marker-like bracket inside the argument string, then drops the call when JSON parsing fails.
        calls: []
  TOOLCALLING.batch.31.a:
    expected:
      vllm:
        calls:
        - name: run_query
          arguments:
            sql: SELECT a, SELECT b
        - name: get_time
          arguments:
            timezone: EST
        normal_text: ''
  TOOLCALLING.batch.31.b:
    expected:
      vllm:
        reason: vLLM Phi-4 splits on the closing bracket inside the first argument string, then drops all calls when JSON parsing fails.
        calls: []
  TOOLCALLING.batch.13.a:
    expected:
      vllm:
        calls:
        - name: unknown_tool
          arguments:
            location: NYC
        normal_text: ''
  TOOLCALLING.batch.13.c:
    expected:
      vllm:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        - name: unknown_tool
          arguments:
            location: LA
        normal_text: ''
