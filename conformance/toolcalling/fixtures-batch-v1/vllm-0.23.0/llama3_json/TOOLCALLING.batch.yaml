# Full anchor for vllm@0.23.0 (lowest version = baseline). expected.vllm only.
family: llama3_json
mode: batch
cases:
  TOOLCALLING.batch.1:
    expected:
      vllm:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        normal_text: ''
  TOOLCALLING.batch.3:
    expected:
      vllm:
        calls: []
        normal_text: Hello, how can I help you today?
  TOOLCALLING.batch.9.a:
    expected:
      vllm:
        calls: []
        normal_text: ''
  TOOLCALLING.batch.9.b:
    expected:
      vllm:
        calls: []
        normal_text: '   '
  TOOLCALLING.batch.10:
    expected:
      vllm:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        - name: get_weather
          arguments:
            location: LA
        normal_text: ''
  TOOLCALLING.batch.30.a:
    expected:
      vllm:
        calls:
        - name: run_query
          arguments:
            sql: SELECT a; SELECT b
        normal_text: ''
  TOOLCALLING.batch.30.b:
    expected:
      vllm:
        calls:
        - name: run_query
          arguments:
            sql: SELECT value WHERE note has brace } and bracket ]
        normal_text: ''
  TOOLCALLING.batch.30.c:
    expected:
      vllm:
        calls:
        - name: run_query
          arguments:
            sql: literal <|python_tag marker|>{name:x} stays text
        normal_text: ''
  TOOLCALLING.batch.31.a:
    expected:
      vllm:
        calls:
        - name: run_query
          arguments:
            sql: SELECT a; SELECT b
        - name: get_time
          arguments:
            timezone: EST
        normal_text: ''
  TOOLCALLING.batch.31.b:
    expected:
      vllm:
        calls:
        - name: run_query
          arguments:
            sql: SELECT value WHERE note has brace } and bracket ]
        - name: get_time
          arguments:
            timezone: EST
        normal_text: ''
  TOOLCALLING.batch.13.a:
    expected:
      vllm:
        calls:
        - name: unknown_tool
          arguments:
            location: NYC
        normal_text: ''
  TOOLCALLING.batch.13.c:
    expected:
      vllm:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        - name: unknown_tool
          arguments:
            location: LA
        normal_text: ''
