# Full anchor for vllm@0.23.0 (lowest version = baseline). expected.vllm only.
family: mistral
mode: batch
cases:
  TOOLCALLING.batch.7.a:
    expected:
      vllm:
        calls:
        - name: book_flight
          arguments:
            destination: Paris
            first_class: true
            passengers: 2
        normal_text: ''
  TOOLCALLING.batch.7.b:
    expected:
      vllm:
        calls:
        - name: get_weather
          arguments:
            location: Tōkyō "central"
        normal_text: ''
  TOOLCALLING.batch.7.c:
    expected:
      vllm:
        calls:
        - name: set_temperature
          arguments:
            celsius: '20'
        normal_text: ''
  TOOLCALLING.batch.7.d:
    expected:
      vllm:
        calls:
        - name: process_data
          arguments:
            items:
            - 1
            - 2
            - 3
            config:
              nested: true
        normal_text: ''
  TOOLCALLING.batch.7.e:
    expected:
      vllm:
        calls:
        - name: process_data
          arguments:
            payload:
              regions:
              - name: west
                scores:
                - 1
                - 2
                - 3
              - name: east
                scores:
                - 4
                - 5
                - 6
              flags:
                enabled: true
                retry: null
              empty: {}
        normal_text: ''
  TOOLCALLING.batch.7.f:
    expected:
      vllm:
        calls:
        - name: set_limit
          arguments:
            count: 9007199254740993
        normal_text: ''
