# Full anchor for vllm@0.23.0 (lowest version = baseline). expected.vllm only.
family: mistral
mode: batch
cases:
  TOOLCALLING.batch.8.a:
    expected:
      vllm:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        normal_text: 'I will check the weather. '
  TOOLCALLING.batch.8.b:
    expected:
      vllm:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        normal_text: ''
  TOOLCALLING.batch.8.c:
    expected:
      vllm:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        normal_text: 'I will check the weather. '
  TOOLCALLING.batch.8.d:
    expected:
      vllm:
        error: 'ValueError: Only one BOT token should have been outputted'
        reason: vLLM mistral_tool_parser raises ValueError on two consecutive [TOOL_CALLS] envelopes
