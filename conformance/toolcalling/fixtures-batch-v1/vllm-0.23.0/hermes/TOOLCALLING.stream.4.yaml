# Full anchor for vllm@0.23.0 (lowest version = baseline). expected.vllm only.
family: hermes
mode: stream
cases:
  TOOLCALLING.stream.4.a:
    expected:
      vllm:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        normal_text: ''
  TOOLCALLING.stream.4.b:
    expected:
      vllm:
        reason: On a stream truncated mid-body, vLLM's finalizer emits get_weather with the partial '{"loc' argument fragment; Dynamo suppresses the unterminated call so no markup leaks. Non-parity by design.
        calls:
        - name: get_weather
          arguments: '{"loc'
        normal_text: ''
  TOOLCALLING.stream.4.c:
    expected:
      vllm:
        reason: vLLM leaves the orphan </tool_call> run in normal_text; Dynamo and SGLang strip the stray end markers and keep the inner JSON body as text. Non-parity by design.
        calls: []
        normal_text: '{"name": "get_weather", "arguments": {"location": "NYC"}}</tool_call></tool_call></tool_call>'
