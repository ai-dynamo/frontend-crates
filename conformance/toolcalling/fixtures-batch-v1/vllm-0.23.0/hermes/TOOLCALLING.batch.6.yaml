# Full anchor for vllm@0.23.0 (lowest version = baseline). expected.vllm only.
family: hermes
mode: batch
cases:
  TOOLCALLING.batch.6.a:
    expected:
      vllm:
        calls:
        - name: get_time
          arguments: {}
        normal_text: ''
  TOOLCALLING.batch.6.b:
    expected:
      vllm:
        calls:
        - name: get_time
          arguments: {}
        normal_text: ''
  TOOLCALLING.batch.6.c:
    expected:
      vllm:
        reason: vLLM leaks the raw wrapper when the arguments key is absent; Dynamo and SGLang recover it as a no-arg call get_time({}). Non-parity by design.
        calls: []
        normal_text: '<tool_call>{"name": "get_time"}</tool_call>'
