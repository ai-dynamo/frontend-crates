# Full anchor for vllm@0.23.0 (lowest version = baseline). expected.vllm only.
family: qwen3_coder
mode: batch
cases:
  TOOLCALLING.batch.5.a:
    expected:
      vllm:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        normal_text: ''
  TOOLCALLING.batch.5.b:
    expected:
      vllm:
        calls:
        - arguments:
            location: NYC
          name: get_weather
        normal_text: ''
        reason: impl-defined recovery contract (see TOOLCALLING_CASES.md)
  TOOLCALLING.batch.5.c:
    expected:
      vllm:
        calls:
        - name: get_weather
          arguments:
            location: NY
        normal_text: ''
  TOOLCALLING.batch.5.d:
    expected:
      vllm:
        calls:
        - name: get_weather
          arguments:
            location: Boston
        - name: get_weather
          arguments:
            location: New York
        normal_text: 'I''ll start by fetching the weather for both Boston and New York at the same time!

          '
  TOOLCALLING.batch.5.e:
    expected:
      vllm:
        calls:
        - name: get_weather
          arguments:
            location: Boston
        - name: get_weather
          arguments:
            location: New York
        normal_text: 'I''ll start by fetching the weather for both Boston and New York at the same time!

          '
        reason: 'vLLM recovers the partial value (location=''New York'') from the call

          truncated mid-arg-value before its closing sentinel. Dynamo (the

          truncation guard) and SGLang require the value to be terminated, so

          they drop the truncated call.'
  TOOLCALLING.batch.5.f:
    expected:
      vllm:
        calls:
        - name: get_weather
          arguments:
            location: Boston
        normal_text: '<function=get_weather>

          <parameter=location>

          NYC

          </parameter>

          </function>

          </tool_call>

          '
        reason: vLLM preserves the bare Qwen function before the first <tool_call> as content, including the trailing newline; Dynamo recovers it as the first structured call before parsing the wrapped call.
  TOOLCALLING.batch.5.g:
    expected:
      vllm:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        normal_text: 'I will check that. '
