# Full anchor for vllm@0.23.0 (lowest version = baseline). expected.vllm only.
family: qwen3_coder
mode: stream
cases:
  TOOLCALLING.stream.2:
    expected:
      vllm:
        calls: []
        normal_text: '<tool_call>

          <function=get_weather>

          <parameter=location>

          NYC

          </parameter>

          </function>

          </tool_call>

          <tool_call>

          <function=get_time>

          <parameter=timezone>

          EST

          </parameter>

          </function>

          </tool_call>'
        reason: 'vLLM streaming parser checks for `<tool_call>` only in `delta_text` (qwen3coder_tool_parser.py:402), not the accumulated `current_text`. When the start token is split across chunk boundaries (`<tool_cal` + `l>\n<fun`), the condition never fires and every chunk falls through to the no-tool-call branch at qwen3coder_tool_parser.py:422, which emits `delta_text` as content. Result: the entire wire payload leaks into `normal_text` and no tool calls are produced.'
