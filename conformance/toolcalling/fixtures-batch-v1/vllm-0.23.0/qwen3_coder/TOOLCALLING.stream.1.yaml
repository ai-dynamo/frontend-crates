# Full anchor for vllm@0.23.0 (lowest version = baseline). expected.vllm only.
family: qwen3_coder
mode: stream
cases:
  TOOLCALLING.stream.1.a:
    expected:
      vllm:
        calls: []
        normal_text: ''
        reason: vLLM streaming parser exits at qwen3coder_tool_parser.py:412 after detecting `<tool_call>` in delta_text and never re-processes the remainder of the same chunk; the trailing `finish_reason=tool_calls` chunk has no `delta_token_ids`, so the EOS-flush branch (qwen3coder_tool_parser.py:348-370) is skipped and no tool call is emitted. Dynamo handles the single-chunk burst correctly.
  TOOLCALLING.stream.1.b:
    expected:
      vllm:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        normal_text: ''
