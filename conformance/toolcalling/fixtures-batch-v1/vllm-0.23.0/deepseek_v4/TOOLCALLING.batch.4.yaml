# Full anchor for vllm@0.23.0 (lowest version = baseline). expected.vllm only.
family: deepseek_v4
mode: batch
cases:
  TOOLCALLING.batch.4.a:
    expected:
      vllm:
        calls: []
        normal_text: '<｜DSML｜tool_calls>

          not a valid invoke

          </｜DSML｜tool_calls>'
        reason: vLLM leaks the tool call tag into normal_text on the recovery path
  TOOLCALLING.batch.4.c:
    expected:
      vllm:
        calls: []
        normal_text: '<｜DSML｜tool_calls>

          <｜DSML｜invoke>

          <｜DSML｜parameter name="location" string="true">NYC</｜DSML｜parameter>

          </｜DSML｜invoke>

          </｜DSML｜tool_calls>'
        reason: vLLM leaks the tool call tag into normal_text on the recovery path
  TOOLCALLING.batch.4.d:
    expected:
      vllm:
        calls:
        - name: get_weather
          arguments: {}
        normal_text: ''
