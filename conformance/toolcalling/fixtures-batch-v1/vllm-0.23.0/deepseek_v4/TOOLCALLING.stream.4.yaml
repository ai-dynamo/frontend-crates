# Full anchor for vllm@0.23.0 (lowest version = baseline). expected.vllm only.
family: deepseek_v4
mode: stream
cases:
  TOOLCALLING.stream.4.a:
    expected:
      vllm:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        normal_text: ''
  TOOLCALLING.stream.4.b:
    expected:
      vllm:
        calls: []
        normal_text: ''
  TOOLCALLING.stream.4.c:
    expected:
      vllm:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        normal_text: '<｜DSML｜invoke name="get_weather">

          <｜DSML｜parameter name="location" string="true">NYC</｜DSML｜parameter>

          </｜DSML｜invoke>

          </｜DSML｜invoke>

          </｜DSML｜invoke>'
        reason: vLLM accepts a bare <｜DSML｜invoke> body without the outer <｜DSML｜tool_calls> wrapper and leaks the markup into normal_text on the recovery path
