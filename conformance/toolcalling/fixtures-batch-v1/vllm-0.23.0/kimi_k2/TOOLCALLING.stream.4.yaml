# Full anchor for vllm@0.23.0 (lowest version = baseline). expected.vllm only.
family: kimi_k2
mode: stream
cases:
  TOOLCALLING.stream.4.a:
    expected:
      vllm:
        calls:
        - name: Write
          arguments:
            file_path: /app/main.rs
            content: fn main() {}
        normal_text: ''
        reason: Model stops after complete JSON args but before `<|tool_call_end|>` / section end. vLLM still emits Write; Dynamo drops the unterminated call and hides the raw Kimi block.
  TOOLCALLING.stream.4.b:
    expected:
      vllm:
        calls:
        - name: get_weather
          arguments: '{"loc'
        normal_text: ''
        reason: Model stops mid-argument before `<|tool_call_end|>`. vLLM emits get_weather with raw partial args; Dynamo drops the incomplete call and hides the raw Kimi block.
  TOOLCALLING.stream.4.c:
    expected:
      vllm:
        calls: []
        normal_text: <|tool_call_begin|>functions.get_weather:0<|tool_call_argument_begin|>{"location":"NYC"}<|tool_call_end|><|tool_call_end|><|tool_call_end|>
        reason: vLLM preserves the raw Kimi call body as content when the opening <|tool_calls_section_begin|> marker is missing; Dynamo recovers the complete bare call body and drops close-marker spam.
