# Full anchor for sglang@0.5.12.post1 (lowest version = baseline). expected.sglang only.
family: kimi_k2
mode: stream
cases:
  TOOLCALLING.stream.4.a:
    expected:
      sglang:
        calls:
        - name: Write
          arguments:
            file_path: /app/main.rs
            content: fn main() {}
        normal_text: ''
        reason: Model stops after complete JSON args but before `<|tool_call_end|>` / section end. SGLang still emits Write; Dynamo drops the unterminated call and hides the raw Kimi block.
  TOOLCALLING.stream.4.b:
    expected:
      sglang:
        calls:
        - name: get_weather
          arguments: '{"loc'
        normal_text: ''
        reason: Model stops mid-argument before `<|tool_call_end|>`. SGLang emits get_weather with raw partial args; Dynamo drops the incomplete call and hides the raw Kimi block.
  TOOLCALLING.stream.4.c:
    expected:
      sglang:
        calls:
        - arguments:
            location: NYC
          name: get_weather
        normal_text: ''
