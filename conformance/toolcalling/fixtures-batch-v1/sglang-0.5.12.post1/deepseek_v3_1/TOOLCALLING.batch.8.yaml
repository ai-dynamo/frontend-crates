# Full anchor for sglang@0.5.12.post1 (lowest version = baseline). expected.sglang only.
family: deepseek_v3_1
mode: batch
cases:
  TOOLCALLING.batch.8.a:
    expected:
      sglang:
        reason: SGLang trims trailing whitespace from normal_text that precedes DeepSeek V3.1 tool-call blocks.
        calls:
        - name: get_weather
          arguments:
            location: NYC
        normal_text: I will check the weather.
  TOOLCALLING.batch.8.b:
    expected:
      sglang:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        normal_text: ''
  TOOLCALLING.batch.8.c:
    expected:
      sglang:
        reason: SGLang trims trailing whitespace from normal_text that precedes DeepSeek V3.1 tool-call blocks.
        calls:
        - name: get_weather
          arguments:
            location: NYC
        normal_text: I will check the weather.
  TOOLCALLING.batch.8.d:
    expected:
      sglang:
        reason: SGLang trims trailing whitespace from normal_text that precedes DeepSeek V3.1 tool-call blocks.
        calls:
        - name: get_weather
          arguments:
            location: NYC
        - name: get_weather
          arguments:
            location: LA
        normal_text: I will check the weather.
