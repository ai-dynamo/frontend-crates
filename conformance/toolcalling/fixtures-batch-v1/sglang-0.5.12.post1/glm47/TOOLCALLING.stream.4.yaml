# Full anchor for sglang@0.5.12.post1 (lowest version = baseline). expected.sglang only.
family: glm47
mode: stream
cases:
  TOOLCALLING.stream.4.a:
    expected:
      sglang:
        calls:
        - name: get_weather
          arguments: '{"location": "NYC"'
        normal_text: ''
        reason: 'Impl-defined recovery for TOOLCALLING.batch.5-class missing end-token (per `tests/parity/README.md` "permanent divergences"). SGLang''s XML-to-JSON state machine (`glm47_moe_detector.py:377-407`) closes the incremental JSON string with `"` when `</arg_value>` is matched but emits the closing `}` only from `_finalize_tool_call` on `</tool_call>` (line 729); on EOF neither flush path runs so the streamed args buffer is shipped as `{"location": "NYC"` (open object). Dynamo drops the truncated call instead of emitting a malformed-JSON args payload (`glm47_parser.rs:194-215`, `allow_eof_recovery=false` production default).'
  TOOLCALLING.stream.4.b:
    expected:
      sglang:
        calls:
        - name: get_weather
          arguments: '{"location": "N'
        normal_text: ''
        reason: Impl-defined recovery for TOOLCALLING.batch.5-class missing end-token (per `tests/parity/README.md` "permanent divergences"). The stream ends mid-`<arg_value>` with `N` and never delivers `</arg_value>` or `</tool_call>`; SGLang's state machine (`glm47_moe_detector.py:419-428`) has already opened the JSON string and emitted `N` incrementally, but neither the closing `"` (gated on `</arg_value>`, line 396) nor `}` (gated on `</tool_call>`, line 729) is ever flushed. Dynamo drops the truncated call (`glm47_parser.rs:194-215`, `allow_eof_recovery=false` production default).
  TOOLCALLING.stream.4.c:
    expected:
      sglang:
        calls: []
        normal_text: get_weather<arg_key>location</arg_key><arg_value>NYC</arg_value>
        reason: SGLang strips orphan GLM close markers but does not recover the complete bare call body; Dynamo emits the recovered call.
