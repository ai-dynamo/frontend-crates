# Full anchor for sglang@0.5.12.post1 (lowest version = baseline). expected.sglang only.
family: glm47
mode: batch
cases:
  TOOLCALLING.batch.2.a:
    expected:
      sglang:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        - name: get_time
          arguments:
            timezone: EST
        normal_text: ''
  TOOLCALLING.batch.2.c:
    expected:
      sglang:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        - name: get_time
          arguments:
            timezone: EST
        normal_text: 'Checking:  Done.'
        reason: SGLang glm47 preserves trailing prose after the last </tool_call>; Dynamo and vLLM drop it
  TOOLCALLING.batch.2.d:
    expected:
      sglang:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        - name: get_weather
          arguments:
            location: LA
        normal_text: ''
