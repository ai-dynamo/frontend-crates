# Full anchor for sglang@0.5.12.post1 (lowest version = baseline). expected.sglang only.
family: minimax_m2
mode: stream
cases:
  TOOLCALLING.stream.4.a:
    expected:
      sglang:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        normal_text: ''
  TOOLCALLING.stream.4.b:
    expected:
      sglang:
        calls:
        - name: get_weather
          arguments: {}
        normal_text: ''
        reason: 'SGLang''s streaming parser emits an empty-argument MiniMax call from

          a stream that ends before </parameter>, </invoke>, and

          </minimax:tool_call>; that contradicts the strict MiniMax-M2.7

          reference parser.'
  TOOLCALLING.stream.4.c:
    expected:
      sglang:
        calls: []
        normal_text: '<invoke name="get_weather">

          <parameter name="location">NYC</parameter>

          </invoke>

          </invoke>

          </invoke>'
        reason: SGLang preserves the bare MiniMax invoke and orphan close-marker spam as content; Dynamo recovers the complete inner <invoke> call and drops the orphan marker tail.
