# Full anchor for sglang@0.5.12.post1 (lowest version = baseline). expected.sglang only.
family: minimax_m2
mode: batch
cases:
  TOOLCALLING.batch.2.a:
    expected:
      sglang:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        - name: get_time
          arguments:
            timezone: EST
        normal_text: ''
  TOOLCALLING.batch.2.b:
    expected:
      sglang:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        - name: get_time
          arguments:
            timezone: EST
        normal_text: '

          '
        reason: SGLang parser preserves the newline separator between adjacent MiniMax tool-call wrappers (`</minimax:tool_call>\n<minimax:tool_call>`).
  TOOLCALLING.batch.2.c:
    expected:
      sglang:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        - name: get_time
          arguments:
            timezone: EST
        normal_text: 'Both:  Done.'
        reason: SGLang preserves normal text after parsed MiniMax tool-call wrappers; Dynamo aligns with vLLM by keeping only text before the first parsed tool call.
  TOOLCALLING.batch.2.d:
    expected:
      sglang:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        - name: get_weather
          arguments:
            location: LA
        normal_text: ''
