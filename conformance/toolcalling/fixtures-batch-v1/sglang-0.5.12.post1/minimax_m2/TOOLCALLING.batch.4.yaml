# Full anchor for sglang@0.5.12.post1 (lowest version = baseline). expected.sglang only.
family: minimax_m2
mode: batch
cases:
  TOOLCALLING.batch.4.a:
    expected:
      sglang:
        calls: []
        normal_text: ''
  TOOLCALLING.batch.4.c:
    expected:
      sglang:
        calls: []
        normal_text: ''
  TOOLCALLING.batch.4.d:
    expected:
      sglang:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        normal_text: ''
        reason: 'SGLang''s MinimaxM2Detector regex

          (`r"<invoke name=\"(.*?)</invoke>|<invoke name=\"(.*)$"`) has an

          `|$` end-of-input alternation that lets a missing `</invoke>`

          still produce a call — contradicts MiniMax-M2 reference parser.

          Should be filed against sgl-project/sglang.'
