# Full anchor for sglang@0.5.12.post1 (lowest version = baseline). expected.sglang only.
family: minimax_m2
mode: batch
cases:
  TOOLCALLING.batch.7.a:
    expected:
      sglang:
        calls:
        - name: book_flight
          arguments:
            destination: Paris
            first_class: true
            passengers: 2
        normal_text: ''
  TOOLCALLING.batch.7.b:
    expected:
      sglang:
        calls:
        - name: get_weather
          arguments:
            location: Tōkyō central
        normal_text: ''
  TOOLCALLING.batch.7.f:
    expected:
      sglang:
        reason: Dynamo preserves integer-like number literals before the f64 path; vLLM/SGLang round through f64 and lose precision above 2^53.
        calls:
        - name: set_limit
          arguments:
            count: 9007199254740992
        normal_text: ''
