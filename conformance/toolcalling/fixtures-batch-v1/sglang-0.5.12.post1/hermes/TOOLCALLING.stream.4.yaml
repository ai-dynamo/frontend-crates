# Full anchor for sglang@0.5.12.post1 (lowest version = baseline). expected.sglang only.
family: hermes
mode: stream
cases:
  TOOLCALLING.stream.4.a:
    expected:
      sglang:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        normal_text: ''
  TOOLCALLING.stream.4.b:
    expected:
      sglang:
        reason: On a stream truncated mid-body, SGLang's finalizer recovers a no-arg get_weather({}); Dynamo suppresses the unterminated call (open <tool_call>, no close, nothing salvaged) so no markup leaks. Non-parity by design.
        calls:
        - name: get_weather
          arguments: {}
        normal_text: ''
  TOOLCALLING.stream.4.c:
    expected:
      sglang:
        calls: []
        normal_text: '{"name": "get_weather", "arguments": {"location": "NYC"}}'
