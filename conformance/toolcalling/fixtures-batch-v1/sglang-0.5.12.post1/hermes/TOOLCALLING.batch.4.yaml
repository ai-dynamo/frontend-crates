# Full anchor for sglang@0.5.12.post1 (lowest version = baseline). expected.sglang only.
family: hermes
mode: batch
cases:
  TOOLCALLING.batch.4.a:
    expected:
      sglang:
        reason: vLLM and SGLang leave the raw <tool_call> wrapper in normal_text on non-JSON garbage; Dynamo discards the unparseable wrapper (no leak). Non-parity by design.
        calls: []
        normal_text: <tool_call>not even json</tool_call>
  TOOLCALLING.batch.4.b:
    expected:
      sglang:
        reason: vLLM and SGLang drop the call and leak the raw wrapper when the JSON body is missing its closing brace; Dynamo's JSON-repair recovers the call. Non-parity by design.
        calls: []
        normal_text: '<tool_call>{"name": "get_weather", "arguments": {"location": "NYC"</tool_call>'
  TOOLCALLING.batch.4.c:
    expected:
      sglang:
        calls: []
        normal_text: ''
  TOOLCALLING.batch.4.d:
    expected:
      sglang:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        normal_text: ''
