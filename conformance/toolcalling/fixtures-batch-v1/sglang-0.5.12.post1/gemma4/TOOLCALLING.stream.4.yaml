# Full anchor for sglang@0.5.12.post1 (lowest version = baseline). expected.sglang only.
family: gemma4
mode: stream
cases:
  TOOLCALLING.stream.4.a:
    expected:
      sglang:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        normal_text: ''
  TOOLCALLING.stream.4.b:
    expected:
      sglang:
        calls:
        - name: get_weather
          arguments: {}
        normal_text: ''
        reason: SGLang emits the function name from a mid-body truncated call; Dynamo follows Gemma4 batch.5 and drops incomplete envelopes without leaking markup.
  TOOLCALLING.stream.4.c:
    expected:
      sglang:
        calls: []
        normal_text: call:get_weather{location:<|"|>NYC<|"|>}<tool_call|><tool_call|><tool_call|>
        reason: vLLM preserves the raw Gemma call body as content when the opening <|tool_call> marker is missing; Dynamo recovers the complete bare call body and drops close-marker spam.
