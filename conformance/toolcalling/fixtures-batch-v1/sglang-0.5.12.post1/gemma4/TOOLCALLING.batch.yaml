# Full anchor for sglang@0.5.12.post1 (lowest version = baseline). expected.sglang only.
family: gemma4
mode: batch
cases:
  TOOLCALLING.batch.1:
    expected:
      sglang:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        normal_text: ''
  TOOLCALLING.batch.3:
    expected:
      sglang:
        calls: []
        normal_text: Hello, how can I help you today?
  TOOLCALLING.batch.9.a:
    expected:
      sglang:
        calls: []
        normal_text: ''
  TOOLCALLING.batch.9.b:
    expected:
      sglang:
        calls: []
        normal_text: '   '
  TOOLCALLING.batch.10:
    expected:
      sglang:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        - name: get_weather
          arguments:
            location: LA
        normal_text: ''
  TOOLCALLING.batch.30.a:
    expected:
      sglang:
        calls:
        - name: run_query
          arguments:
            sql: SELECT a,b:and{brace}
        normal_text: ''
  TOOLCALLING.batch.30.b:
    expected:
      sglang:
        calls:
        - name: run_query
          arguments:
            sql: SELECT value WHERE note has brace } and bracket ]
        normal_text: ''
  TOOLCALLING.batch.30.c:
    expected:
      sglang:
        calls:
        - name: run_query
          arguments:
            sql: literal <|tool_call marker> call:get_time{} stays text
        normal_text: ''
  TOOLCALLING.batch.31.a:
    expected:
      sglang:
        calls:
        - name: run_query
          arguments:
            sql: SELECT a,b:and{brace}
        - name: get_time
          arguments:
            timezone: EST
        normal_text: ''
  TOOLCALLING.batch.31.b:
    expected:
      sglang:
        calls:
        - name: run_query
          arguments:
            sql: SELECT value WHERE note has brace } and bracket ]
        - name: get_time
          arguments:
            timezone: EST
        normal_text: ''
  TOOLCALLING.batch.13.a:
    expected:
      sglang:
        calls:
        - name: unknown_tool
          arguments:
            location: NYC
        normal_text: ''
  TOOLCALLING.batch.13.c:
    expected:
      sglang:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        - name: unknown_tool
          arguments:
            location: LA
        normal_text: ''
