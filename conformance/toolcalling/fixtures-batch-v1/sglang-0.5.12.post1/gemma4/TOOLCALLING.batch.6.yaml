# Full anchor for sglang@0.5.12.post1 (lowest version = baseline). expected.sglang only.
family: gemma4
mode: batch
cases:
  TOOLCALLING.batch.6.a:
    expected:
      sglang:
        calls:
        - name: get_time
          arguments: {}
        normal_text: ''
  TOOLCALLING.batch.6.b:
    expected:
      sglang:
        calls:
        - name: get_time
          arguments: {}
        normal_text: ''
  TOOLCALLING.batch.6.c:
    expected:
      sglang:
        calls: []
        normal_text: <|tool_call>call:get_time<tool_call|>
        reason: SGLang leaks the tool call tag into normal_text on the recovery path
