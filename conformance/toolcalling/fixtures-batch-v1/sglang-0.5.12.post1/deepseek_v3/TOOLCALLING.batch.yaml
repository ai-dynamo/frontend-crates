# Full anchor for sglang@0.5.12.post1 (lowest version = baseline). expected.sglang only.
family: deepseek_v3
mode: batch
cases:
  TOOLCALLING.batch.1:
    expected:
      sglang:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        normal_text: ''
  TOOLCALLING.batch.3:
    expected:
      sglang:
        calls: []
        normal_text: Hello, how can I help you today?
  TOOLCALLING.batch.9.a:
    expected:
      sglang:
        calls: []
        normal_text: ''
  TOOLCALLING.batch.9.b:
    expected:
      sglang:
        calls: []
        normal_text: '   '
  TOOLCALLING.batch.10:
    expected:
      sglang:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        - name: get_weather
          arguments:
            location: LA
        normal_text: ''
  TOOLCALLING.batch.13:
    expected:
      sglang:
        calls: []
        normal_text: ''
        reason: SGLang drops unknown tool names by default unless SGLANG_FORWARD_UNKNOWN_TOOLS is enabled.
