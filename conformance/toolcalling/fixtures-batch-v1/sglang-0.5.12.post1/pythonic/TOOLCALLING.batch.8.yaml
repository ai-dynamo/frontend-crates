# Full anchor for sglang@0.5.12.post1 (lowest version = baseline). expected.sglang only.
family: pythonic
mode: batch
cases:
  TOOLCALLING.batch.8.a:
    expected:
      sglang:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        normal_text: 'I will check the weather. '
  TOOLCALLING.batch.8.b:
    expected:
      sglang:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        normal_text: ' Let me know if you need more.'
  TOOLCALLING.batch.8.c:
    expected:
      sglang:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        normal_text: I will check the weather.  Let me know if you need more.
  TOOLCALLING.batch.8.d:
    expected:
      sglang:
        calls: []
        normal_text: 'I will check the weather. '
