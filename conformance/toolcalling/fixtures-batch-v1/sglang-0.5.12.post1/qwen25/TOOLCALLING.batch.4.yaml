# Full anchor for sglang@0.5.12.post1 (lowest version = baseline). expected.sglang only.
family: qwen25
mode: batch
cases:
  TOOLCALLING.batch.4.a:
    expected:
      sglang:
        reason: 'Malformed body in a complete <tool_call> wrapper: Dynamo discards the unparseable jail region (no leak); SGLang''s Qwen25Detector keys on a "<tool_call>\n" prefix, so on this compact wrapper it detects nothing and returns the raw text. Non-parity by design.'
        calls: []
        normal_text: <tool_call>not even json</tool_call>
  TOOLCALLING.batch.4.b:
    expected:
      sglang:
        reason: 'Malformed JSON in a complete <tool_call> wrapper: Dynamo discards the unparseable jail region (no leak); SGLang''s Qwen25Detector keys on a "<tool_call>\n" prefix, so on this compact wrapper it detects nothing and returns the raw text. Non-parity by design.'
        calls: []
        normal_text: '<tool_call>{"name": "get_weather", "arguments": {"location": "NYC"</tool_call>'
  TOOLCALLING.batch.4.c:
    expected:
      sglang:
        reason: 'Missing name key in a complete <tool_call> wrapper: Dynamo discards the unparseable jail region (no leak); SGLang''s Qwen25Detector keys on a "<tool_call>\n" prefix, so on this compact wrapper it detects nothing and returns the raw text. Non-parity by design.'
        calls: []
        normal_text: '<tool_call>{"arguments": {"location": "NYC"}}</tool_call>'
  TOOLCALLING.batch.4.d:
    expected:
      sglang:
        reason: 'Incomplete call (open <tool_call>, no close): Dynamo suppresses to empty, SGLang keeps raw. Non-parity by design.'
        calls: []
        normal_text: '<tool_call>{"name": "get_weather", "arguments": {"location": "NYC"}}'
