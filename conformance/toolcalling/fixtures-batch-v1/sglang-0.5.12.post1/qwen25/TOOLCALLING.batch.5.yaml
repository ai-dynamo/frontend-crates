    expected:
      sglang:
        reason: 'Incomplete call (open <tool_call>, no close): Dynamo suppresses to empty, SGLang keeps raw. Non-parity by design.'
        calls: []
        normal_text: '<tool_call>{"name": "get_weather", "arguments": {"loc'
  TOOLCALLING.batch.5.d:
    expected:
      sglang:
        calls:
        - name: get_weather
          arguments:
            location: Boston
        normal_text: I'll start by fetching the weather for both Boston and New York at the same time!
  TOOLCALLING.batch.5.e:
    expected:
      sglang:
        calls:
