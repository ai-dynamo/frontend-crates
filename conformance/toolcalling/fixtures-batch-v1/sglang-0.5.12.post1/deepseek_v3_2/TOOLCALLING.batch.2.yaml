# Full anchor for sglang@0.5.12.post1 (lowest version = baseline). expected.sglang only.
family: deepseek_v3_2
mode: batch
cases:
  TOOLCALLING.batch.2.a:
    expected:
      sglang:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        - name: get_time
          arguments:
            timezone: EST
        normal_text: ''
  TOOLCALLING.batch.2.b:
    expected:
      sglang:
        reason: SGLang stops after the first DeepSeek V3.2 DSML function_calls wrapper when wrappers are back-to-back.
        calls:
        - arguments:
            location: NYC
          name: get_weather
        normal_text: ''
  TOOLCALLING.batch.2.c:
    expected:
      sglang:
        calls:
        - arguments:
            location: NYC
          name: get_weather
        - arguments:
            timezone: EST
          name: get_time
        normal_text: 'Both:'
        reason: trims trailing space from preceding normal_text
  TOOLCALLING.batch.2.d:
    expected:
      sglang:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        - name: get_weather
          arguments:
            location: LA
        normal_text: ''
