# Full anchor for sglang@0.5.12.post1 (lowest version = baseline). expected.sglang only.
family: deepseek_v3_2
mode: batch
cases:
  TOOLCALLING.batch.5.a:
    expected:
      sglang:
        calls: []
        normal_text: ''
        reason: SGLang drops the call and emits empty content when </｜DSML｜function_calls> is missing; Dynamo recovers the complete <｜DSML｜invoke> call.
  TOOLCALLING.batch.5.b:
    expected:
      sglang:
        reason: vLLM and SGLang preserve orphan DSML markers as content when the opening <｜DSML｜function_calls> wrapper is missing; Dynamo recovers the complete bare <｜DSML｜invoke> call and strips the orphan marker tail.
        calls: []
        normal_text: '<｜DSML｜invoke name="get_weather">

          <｜DSML｜parameter name="location" string="true">NYC</｜DSML｜parameter>

          </｜DSML｜invoke>

          </｜DSML｜function_calls>'
  TOOLCALLING.batch.5.c:
    expected:
      sglang:
        calls: []
        normal_text: ''
  TOOLCALLING.batch.5.d:
    expected:
      sglang:
        reason: SGLang drops the unterminated DeepSeek V3.2 DSML block and trims the trailing newline from preserved narration.
        calls: []
        normal_text: I'll start by fetching the weather for both Boston and New York at the same time!
  TOOLCALLING.batch.5.e:
    expected:
      sglang:
        reason: SGLang drops the truncated DeepSeek V3.2 DSML block and trims the trailing newline from preserved narration.
        calls: []
        normal_text: I'll start by fetching the weather for both Boston and New York at the same time!
