# Shared inputs (version-independent): no expected blocks.
family: deepseek_v3
mode: batch
cases:
  TOOLCALLING.batch.5.a:
    description: Missing calls_end / call_end markers
    ref: dynamo
    model_text: '<｜tool▁calls▁begin｜><｜tool▁call▁begin｜>function<｜tool▁sep｜>get_weather

      ```json

      {"location": "NYC"}

      ```'
    tools:
    - &id001
      name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
  TOOLCALLING.batch.5.b:
    description: Closing tool_calls_end without matching tool_calls_begin
    ref: dynamo
    model_text: '<｜tool▁call▁begin｜>function<｜tool▁sep｜>get_weather

      ```json

      {"location": "NYC"}

      ```<｜tool▁call▁end｜><｜tool▁calls▁end｜>'
    tools:
    - *id001
  TOOLCALLING.batch.5.c:
    description: Truncation mid-arguments JSON inside fenced block
    ref: dynamo
    model_text: '<｜tool▁calls▁begin｜><｜tool▁call▁begin｜>function<｜tool▁sep｜>get_weather

      ```json

      {"loc'
    tools:
    - *id001
  TOOLCALLING.batch.5.d:
    description: Multi-call, last call missing only end marker (body complete)
    ref: dynamo
    model_text: 'I''ll start by fetching the weather for both Boston and New York at the same time!

      <｜tool▁calls▁begin｜><｜tool▁call▁begin｜>function<｜tool▁sep｜>get_weather

      ```json

      {"location": "Boston"}

      ```<｜tool▁call▁end｜><｜tool▁call▁begin｜>function<｜tool▁sep｜>get_weather

      ```json

      {"location": "New York"}

      ```'
    tools:
    - *id001
  TOOLCALLING.batch.5.e:
    description: Multi-call, last call truncated mid-arg-value
    ref: dynamo
    model_text: 'I''ll start by fetching the weather for both Boston and New York at the same time!

      <｜tool▁calls▁begin｜><｜tool▁call▁begin｜>function<｜tool▁sep｜>get_weather

      ```json

      {"location": "Boston"}

      ```<｜tool▁call▁end｜><｜tool▁call▁begin｜>function<｜tool▁sep｜>get_weather

      ```json

      {"location": "New York'
    tools:
    - *id001
