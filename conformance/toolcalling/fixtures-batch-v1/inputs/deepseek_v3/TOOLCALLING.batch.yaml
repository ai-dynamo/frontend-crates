# Shared inputs (version-independent): no expected blocks.
family: deepseek_v3
model_label: DeepSeek V3
mode: batch
cases:
  TOOLCALLING.batch.1:
    description: Single tool call (happy path)
    model_text: '<｜tool▁calls▁begin｜><｜tool▁call▁begin｜>function<｜tool▁sep｜>get_weather

      ```json

      {"location": "NYC"}

      ```<｜tool▁call▁end｜><｜tool▁calls▁end｜>'
    tools:
    - &id001
      name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
  TOOLCALLING.batch.3:
    description: No tool call (plain text)
    model_text: Hello, how can I help you today?
    tools:
    - *id001
  TOOLCALLING.batch.9.a:
    description: Empty model text
    model_text: ''
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
  TOOLCALLING.batch.9.b:
    description: Blank / whitespace-only model text
    ref: dynamo
    model_text: '   '
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
  TOOLCALLING.batch.10:
    description: Duplicate calls (same name twice)
    model_text: '<｜tool▁calls▁begin｜><｜tool▁call▁begin｜>function<｜tool▁sep｜>get_weather

      ```json

      {"location": "NYC"}

      ```<｜tool▁call▁end｜><｜tool▁call▁begin｜>function<｜tool▁sep｜>get_weather

      ```json

      {"location": "LA"}

      ```<｜tool▁call▁end｜><｜tool▁calls▁end｜>'
    tools:
    - *id001
  TOOLCALLING.batch.30:
    description: Separator-character case not applicable
    reason: This case is not applicable to deepseek_v3 because <｜tool▁sep｜> separates the function name from JSON arguments, not calls from each other.
  TOOLCALLING.batch.31:
    description: Multi-call separator-character case not applicable
    reason: This case is not applicable to deepseek_v3 because <｜tool▁sep｜> separates the function name from JSON arguments, not calls from each other.
  TOOLCALLING.batch.13:
    description: Unknown tool name absent from supplied tools
    ref: dynamo
    model_text: '<｜tool▁calls▁begin｜><｜tool▁call▁begin｜>function<｜tool▁sep｜>unknown_tool

      ```json

      {"location": "NYC"}

      ```<｜tool▁call▁end｜><｜tool▁calls▁end｜>'
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
  TOOLCALLING.batch.13.c:
    description: Mixed known and unknown calls not applicable
    reason: This case is not applicable to deepseek_v3 because there is no peer mixed known/unknown DeepSeek V3 parser case to align against.
