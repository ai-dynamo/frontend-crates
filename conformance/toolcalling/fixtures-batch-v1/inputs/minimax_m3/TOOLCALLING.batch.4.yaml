# Shared inputs (version-independent): no expected blocks.
family: minimax_m3
model_label: MiniMax M3
mode: batch
cases:
  TOOLCALLING.batch.4.a:
    description: Tool_call wrapper with garbage body
    ref: MiniMax M3 parser malformed-input recovery contract
    model_text: ']<]minimax[>[<tool_call>

      not a valid invoke

      ]<]minimax[>[</tool_call>'
    tools:
    - &id001
      name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
  TOOLCALLING.batch.4.b:
    description: Invalid JSON object in schema-declared object parameter falls back to string
    ref: MiniMax M3 schema-aware scalar coercion
    model_text: ']<]minimax[>[<tool_call>

      ]<]minimax[>[<invoke name="configure">

      ]<]minimax[>[<settings>{"mode": "fast"]<]minimax[>[</settings>

      ]<]minimax[>[</invoke>

      ]<]minimax[>[</tool_call>'
    tools:
    - name: configure
      parameters:
        type: object
        properties:
          settings:
            type: object
  TOOLCALLING.batch.4.c:
    description: Invoke without name attribute
    ref: MiniMax M3 parser malformed-input recovery contract
    model_text: ']<]minimax[>[<tool_call>

      ]<]minimax[>[<invoke>

      ]<]minimax[>[<location>NYC]<]minimax[>[</location>

      ]<]minimax[>[</invoke>

      ]<]minimax[>[</tool_call>'
    tools:
    - *id001
  TOOLCALLING.batch.4.d:
    description: Missing closing invoke tag
    ref: MiniMax M3 parser malformed-input recovery contract
    model_text: ']<]minimax[>[<tool_call>

      ]<]minimax[>[<invoke name="get_weather">

      ]<]minimax[>[<location>NYC]<]minimax[>[</location>

      ]<]minimax[>[</tool_call>'
    tools:
    - *id001
  TOOLCALLING.batch.4.e:
    description: Malformed-prefix recovery is not applicable to this family's syntax
    reason: TOOLCALLING.batch.4.e is specific to raw JSON-object scanners where a malformed JSON-looking prefix may be followed by a complete object. MiniMax M3 uses namespace-prefixed XML tags, so malformed wrapper coverage lives in TOOLCALLING.batch.4.a through 4.d.
  TOOLCALLING.batch.4.f:
    description: Tool-name XML tag case is not applicable to this family's syntax
    reason: TOOLCALLING.batch.4.f is specific to Qwen3-Coder XML syntax, where the model may emit a tool-name tag such as <terminal> instead of the required <function=Terminal> opener. MiniMax M3 uses <invoke name="...">.
