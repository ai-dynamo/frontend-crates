# Shared inputs (version-independent): no expected blocks.
family: deepseek_v4
model_label: DeepSeek V4
mode: batch
cases:
  TOOLCALLING.batch.1:
    description: Single tool call (happy path)
    model_text: '<｜DSML｜tool_calls>

      <｜DSML｜invoke name="get_weather">

      <｜DSML｜parameter name="location" string="true">NYC</｜DSML｜parameter>

      </｜DSML｜invoke>

      </｜DSML｜tool_calls>'
    tools:
    - &id001
      name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
  TOOLCALLING.batch.13.c:
    description: Mixed known and unknown calls not applicable
    reason: This case is not applicable to deepseek_v4 because SGLang has no peer detector for this parser family.
  TOOLCALLING.batch.3:
    description: No tool call (plain text)
    model_text: Hello, how can I help you today?
    tools:
    - *id001
  TOOLCALLING.batch.9.a:
    description: Empty model text
    model_text: ''
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
  TOOLCALLING.batch.9.b:
    description: Blank / whitespace-only model text
    ref: dynamo
    model_text: '   '
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
  TOOLCALLING.batch.10:
    description: Duplicate calls (same name twice)
    model_text: '<｜DSML｜tool_calls>

      <｜DSML｜invoke name="get_weather">

      <｜DSML｜parameter name="location" string="true">NYC</｜DSML｜parameter>

      </｜DSML｜invoke>

      <｜DSML｜invoke name="get_weather">

      <｜DSML｜parameter name="location" string="true">LA</｜DSML｜parameter>

      </｜DSML｜invoke>

      </｜DSML｜tool_calls>'
    tools:
    - *id001
  TOOLCALLING.batch.30:
    description: Separator-character case not applicable
    reason: This case is not applicable to deepseek_v4 because it uses DSML invoke/parameter tags, not delimiter-separated call bodies.
  TOOLCALLING.batch.31:
    description: Multi-call separator-character case not applicable
    reason: This case is not applicable to deepseek_v4 because it uses DSML invoke/parameter tags, not delimiter-separated call bodies.
  TOOLCALLING.batch.13:
    description: Unknown tool name absent from supplied tools
    ref: dynamo
    model_text: '<｜DSML｜tool_calls>

      <｜DSML｜invoke name="unknown_tool">

      <｜DSML｜parameter name="location" string="true">NYC</｜DSML｜parameter>

      </｜DSML｜invoke>

      </｜DSML｜tool_calls>'
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
