# Shared inputs (version-independent): no expected blocks.
family: glm47
model_label: GLM 5.1
mode: batch
cases:
  TOOLCALLING.batch.1:
    description: Single tool call (happy path)
    model_text: <tool_call>get_weather<arg_key>location</arg_key><arg_value>NYC</arg_value></tool_call>
    tools:
    - &id001
      name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
  TOOLCALLING.batch.3:
    description: No tool call (plain text)
    model_text: Hello, how can I help you today?
    tools:
    - *id001
  TOOLCALLING.batch.9.a:
    description: Empty model text
    model_text: ''
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
  TOOLCALLING.batch.13.c:
    description: Mixed known and unknown calls not applicable
    reason: This case is not applicable to glm47 because there is no peer mixed known/unknown GLM parser case to align against.
  TOOLCALLING.batch.9.b:
    description: Blank / whitespace-only model text
    ref: dynamo
    model_text: '   '
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
  TOOLCALLING.batch.10:
    description: Duplicate calls (same name twice)
    model_text: <tool_call>get_weather<arg_key>location</arg_key><arg_value>NYC</arg_value></tool_call><tool_call>get_weather<arg_key>location</arg_key><arg_value>LA</arg_value></tool_call>
    tools:
    - *id001
  TOOLCALLING.batch.30:
    description: Separator-character case not applicable
    reason: This case is not applicable to glm47 because it uses <arg_key>/<arg_value> tags, not delimiter-separated call bodies.
  TOOLCALLING.batch.31:
    description: Multi-call separator-character case not applicable
    reason: This case is not applicable to glm47 because it uses <arg_key>/<arg_value> tags, not delimiter-separated call bodies.
  TOOLCALLING.batch.13:
    description: Unknown tool name absent from supplied tools
    ref: dynamo
    model_text: <tool_call>unknown_tool<arg_key>location</arg_key><arg_value>NYC</arg_value></tool_call>
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
