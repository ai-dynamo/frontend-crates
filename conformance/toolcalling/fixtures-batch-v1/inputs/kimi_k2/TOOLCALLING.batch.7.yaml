# Shared inputs (version-independent): no expected blocks.
family: kimi_k2
mode: batch
cases:
  TOOLCALLING.batch.7.a:
    description: Standard scalar types (string + int + bool)
    ref: dynamo
    model_text: <|tool_calls_section_begin|><|tool_call_begin|>functions.book_flight:0<|tool_call_argument_begin|>{"destination":"Paris","passengers":2,"first_class":true}<|tool_call_end|><|tool_calls_section_end|>
    tools:
    - name: book_flight
      parameters:
        type: object
        properties:
          destination:
            type: string
          passengers:
            type: integer
          first_class:
            type: boolean
  TOOLCALLING.batch.7.b:
    description: Unicode + escaped chars in string value
    ref: dynamo
    model_text: <|tool_calls_section_begin|><|tool_call_begin|>functions.get_weather:0<|tool_call_argument_begin|>{"location":"Tōkyō \"central\""}<|tool_call_end|><|tool_calls_section_end|>
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
  TOOLCALLING.batch.7.c:
    description: Schema mismatch — string value where schema declares integer
    ref: dynamo
    model_text: <|tool_calls_section_begin|><|tool_call_begin|>functions.set_temperature:0<|tool_call_argument_begin|>{"celsius":"20"}<|tool_call_end|><|tool_calls_section_end|>
    tools:
    - name: set_temperature
      parameters:
        type: object
        properties:
          celsius:
            type: integer
  TOOLCALLING.batch.7.d:
    description: Nested object + array (existing shape)
    ref: dynamo
    model_text: <|tool_calls_section_begin|><|tool_call_begin|>functions.process_data:0<|tool_call_argument_begin|>{"items":[1,2,3],"config":{"nested":true}}<|tool_call_end|><|tool_calls_section_end|>
    tools:
    - name: process_data
      parameters:
        type: object
        properties:
          items:
            type: array
          config:
            type: object
  TOOLCALLING.batch.7.e:
    description: Large / deep JSON-edge argument payload
    ref: dynamo
    model_text: <|tool_calls_section_begin|><|tool_call_begin|>functions.process_data:0<|tool_call_argument_begin|>{"payload":{"regions":[{"name":"west","scores":[1,2,3]},{"name":"east","scores":[4,5,6]}],"flags":{"enabled":true,"retry":null},"empty":{}}}<|tool_call_end|><|tool_calls_section_end|>
    tools:
    - name: process_data
      parameters:
        type: object
        properties:
          payload:
            type: object
  TOOLCALLING.batch.7.f:
    description: Numeric precision edge preserves integer-like number literal
    ref: inferhub live capture on nvidia/moonshotai/kimi-k2.6; format follows https://huggingface.co/moonshotai/Kimi-K2-Instruct/blob/main/docs/tool_call_guidance.md
    model_text: <|tool_calls_section_begin|><|tool_call_begin|>functions.set_limit:0<|tool_call_argument_begin|>{"count":9007199254740993}<|tool_call_end|><|tool_calls_section_end|>
    tools:
    - name: set_limit
      parameters:
        type: object
        properties:
          count:
            type: number
