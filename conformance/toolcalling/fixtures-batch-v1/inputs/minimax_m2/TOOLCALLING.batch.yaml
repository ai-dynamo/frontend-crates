# Shared inputs (version-independent): no expected blocks.
family: minimax_m2
model_label: MiniMax 2.7
mode: batch
cases:
  TOOLCALLING.batch.1:
    description: Single tool call (happy path)
    model_text: '<minimax:tool_call>

      <invoke name="get_weather">

      <parameter name="location">NYC</parameter>

      </invoke>

      </minimax:tool_call>'
    tools:
    - &id001
      name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
  TOOLCALLING.batch.3:
    description: No tool call (plain text)
    model_text: Hello, how can I help you today?
    tools:
    - *id001
  TOOLCALLING.batch.9.a:
    description: Empty model text
    model_text: ''
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
  TOOLCALLING.batch.13.c:
    description: Mixed known and unknown calls not applicable
    reason: This case is not applicable to minimax_m2 because there is no peer mixed known/unknown MiniMax parser case to align against.
  TOOLCALLING.batch.9.b:
    description: Blank / whitespace-only model text
    ref: dynamo
    model_text: '   '
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
  TOOLCALLING.batch.10:
    description: Duplicate calls (same name twice)
    model_text: '<minimax:tool_call>

      <invoke name="get_weather">

      <parameter name="location">NYC</parameter>

      </invoke>

      <invoke name="get_weather">

      <parameter name="location">LA</parameter>

      </invoke>

      </minimax:tool_call>'
    tools:
    - *id001
  TOOLCALLING.batch.30:
    description: Separator-character case not applicable
    reason: This case is not applicable to minimax_m2 because it uses XML-style tool_name/tool_args tags, not delimiter-separated call bodies.
  TOOLCALLING.batch.31:
    description: Multi-call separator-character case not applicable
    reason: This case is not applicable to minimax_m2 because it uses XML-style tool_name/tool_args tags, not delimiter-separated call bodies.
  TOOLCALLING.batch.13:
    description: Unknown tool name absent from supplied tools
    ref: dynamo
    model_text: '<minimax:tool_call>

      <minimax:tool_name>unknown_tool</minimax:tool_name>

      <minimax:tool_args>{"location":"NYC"}</minimax:tool_args>

      </minimax:tool_call>'
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
