# Full anchor for dynamo@3.0.0 (lowest version = baseline). expected.dynamo only.
family: minimax_m2
mode: stream
cases:
  TOOLCALLING.stream.4.a:
    expected:
      dynamo:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        normal_text: ''
  TOOLCALLING.stream.4.b:
    expected:
      dynamo:
        reason: 'Strict per MiniMax-M2.7''s published parser regexes: the outer

          <minimax:tool_call>, inner <invoke>, and <parameter> blocks must all

          be paired. This stream ends mid-parameter, so Dynamo recovers no call

          and drops the buffered protocol block from normal_text.'
        calls: []
        normal_text: ''
  TOOLCALLING.stream.4.c:
    expected:
      dynamo:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        normal_text: ''
