# Full anchor for dynamo@3.0.0 (lowest version = baseline). expected.dynamo only.
family: minimax_m2
mode: batch
cases:
  TOOLCALLING.batch.5.a:
    expected:
      dynamo:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        normal_text: ''
  TOOLCALLING.batch.5.b:
    expected:
      dynamo:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        normal_text: ''
  TOOLCALLING.batch.5.c:
    expected:
      dynamo:
        calls: []
        normal_text: ''
  TOOLCALLING.batch.5.d:
    expected:
      dynamo:
        calls:
        - name: get_weather
          arguments:
            location: Boston
        - name: get_weather
          arguments:
            location: New York
        normal_text: 'I''ll start by fetching the weather for both Boston and New York at the same time!

          '
  TOOLCALLING.batch.5.e:
    expected:
      dynamo:
        calls:
        - name: get_weather
          arguments:
            location: Boston
        normal_text: 'I''ll start by fetching the weather for both Boston and New York at the same time!

          '
  TOOLCALLING.batch.5.f:
    expected:
      dynamo:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        - name: get_weather
          arguments:
            location: Boston
        normal_text: ''
  TOOLCALLING.batch.5.g:
    expected:
      dynamo:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        normal_text: 'I will check that. '
