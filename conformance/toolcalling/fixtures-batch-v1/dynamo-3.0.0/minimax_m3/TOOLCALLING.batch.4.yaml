# Full anchor for dynamo@3.0.0 (lowest version = baseline). expected.dynamo only.
family: minimax_m3
mode: batch
cases:
  TOOLCALLING.batch.4.a:
    expected:
      dynamo: &id001
        calls: []
        normal_text: ''
  TOOLCALLING.batch.4.b:
    expected:
      dynamo:
        calls:
        - name: configure
          arguments:
            settings: '{"mode": "fast"'
        normal_text: ''
  TOOLCALLING.batch.4.c:
    expected:
      dynamo: *id001
  TOOLCALLING.batch.4.d:
    expected:
      dynamo: *id001
