# Full anchor for dynamo@3.0.0 (lowest version = baseline). expected.dynamo only.
family: harmony
mode: batch
cases:
  TOOLCALLING.batch.8.a:
    expected:
      dynamo:
        calls:
        - arguments:
            location: NYC
          name: get_weather
        normal_text: I will check the weather.
  TOOLCALLING.batch.8.b:
    expected:
      dynamo:
        calls:
        - arguments:
            location: NYC
          name: get_weather
        normal_text: Let me know if you need more.
  TOOLCALLING.batch.8.c:
    expected:
      dynamo:
        calls:
        - arguments:
            location: NYC
          name: get_weather
        normal_text: I will check the weather.  Let me know if you need more.
  TOOLCALLING.batch.8.d:
    expected:
      dynamo:
        calls:
        - arguments:
            location: NYC
          name: get_weather
        - arguments:
            location: LA
          name: get_weather
        normal_text: I will check the weather.  Then check LA weather.
