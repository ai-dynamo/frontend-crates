# Full anchor for dynamo@3.0.0 (lowest version = baseline). expected.dynamo only.
family: nemotron_deci
mode: batch
cases:
  TOOLCALLING.batch.4.a:
    expected:
      dynamo:
        reason: Unparseable TOOLCALL content (not a JSON tool-call array); Dynamo strips the wrapper markers and drops the content instead of leaking them into normal_text, and records the drop via tracing::warn
        calls: []
        normal_text: ''
  TOOLCALLING.batch.4.b:
    expected:
      dynamo:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        normal_text: ''
  TOOLCALLING.batch.4.c:
    expected:
      dynamo:
        reason: The array element has no name key, so it is not a valid tool call; Dynamo drops it and emits empty normal_text without leaking the wrapper markers
        calls: []
        normal_text: ''
  TOOLCALLING.batch.4.d:
    expected:
      dynamo:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        normal_text: ''
