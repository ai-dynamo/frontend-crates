# v1 jail golden/after fixture (generated by build_jail_fixtures.py).
# chunks = stream input; golden = jail output before #10570; now = after #10570.
# The tab is green when now == golden, red otherwise. Do not edit by hand.

family: minimax_m2
model_label: MiniMax 2.7
mode: jail
cases:
  TOOLCALLING.jail.2.a:
    description: Two invokes inside one tool_call wrapper
    ref: derived from TOOLCALLING.batch.2.a
    chunks:
    - delta_text: <minimax:tool_call> <invoke
    - delta_text: ' name="get_weather">'
    - delta_text: ' <parameter name="location">NYC</parameter>'
    - delta_text: ' </invoke> <invoke'
    - delta_text: ' name="get_time">'
    - delta_text: ' <parameter name="timezone">'
    - delta_text: EST</parameter> </invoke> </minimax:tool_call>
    - delta_text: ''
      finish_reason: tool_calls
    golden:
      calls:
      - name: get_weather
        arguments:
          location: NYC
      - name: get_time
        arguments:
          timezone: EST
      normal_text: ''
    now:
      calls:
      - name: get_weather
        arguments:
          location: NYC
      - name: get_time
        arguments:
          timezone: EST
      normal_text: ''
