# v1 jail golden/after fixture (generated by build_jail_fixtures.py).
# chunks = stream input; golden = jail output before #10570; now = after #10570.
# The tab is green when now == golden, red otherwise. Do not edit by hand.

family: phi4
model_label: Phi-4
mode: jail
cases:
  TOOLCALLING.jail.2.a:
    description: Parallel calls in JSON array
    ref: derived from TOOLCALLING.batch.2.a
    chunks:
    - delta_text: 'functools[{"name": "get_weather",'
    - delta_text: ' "arguments":'
    - delta_text: ' {"location": "NYC"}}, {"name":'
    - delta_text: ' "get_time", "arguments":'
    - delta_text: ' {"timezone":'
    - delta_text: ' "EST"}}]'
    - delta_text: ''
      finish_reason: stop
    golden:
      calls:
      - name: get_weather
        arguments:
          location: NYC
      - name: get_time
        arguments:
          timezone: EST
      normal_text: ''
    now:
      calls:
      - name: get_weather
        arguments:
          location: NYC
      - name: get_time
        arguments:
          timezone: EST
      normal_text: ''
  TOOLCALLING.jail.2.c:
    description: With surrounding narration
    ref: derived from TOOLCALLING.batch.2.c
    chunks:
    - delta_text: 'Both: functools[{"name":'
    - delta_text: ' "get_weather",'
    - delta_text: ' "arguments": {"location": "NYC"}},'
    - delta_text: ' {"name": "get_time",'
    - delta_text: ' "arguments":'
    - delta_text: ' {"timezone": "EST"}}]'
    - delta_text: ' Done.'
    - delta_text: ''
      finish_reason: stop
    golden:
      calls:
      - name: get_weather
        arguments:
          location: NYC
      - name: get_time
        arguments:
          timezone: EST
      normal_text: 'Both:  Done.'
    now:
      calls:
      - name: get_weather
        arguments:
          location: NYC
      - name: get_time
        arguments:
          timezone: EST
      normal_text: 'Both:  Done.'
  TOOLCALLING.jail.2.d:
    description: Same-name twice
    ref: derived from TOOLCALLING.batch.2.d
    chunks:
    - delta_text: 'functools[{"name": "get_weather",'
    - delta_text: ' "arguments":'
    - delta_text: ' {"location": "NYC"}}, {"name":'
    - delta_text: ' "get_weather", "arguments":'
    - delta_text: ' {"location":'
    - delta_text: ' "LA"}}]'
    - delta_text: ''
      finish_reason: stop
    golden:
      calls:
      - name: get_weather
        arguments:
          location: NYC
      - name: get_weather
        arguments:
          location: LA
      normal_text: ''
    now:
      calls:
      - name: get_weather
        arguments:
          location: NYC
      - name: get_weather
        arguments:
          location: LA
      normal_text: ''
