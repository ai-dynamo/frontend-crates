# v1 jail golden/after fixture (generated by build_jail_fixtures.py).
# chunks = stream input; golden = jail output before #10570; now = after #10570.
# The tab is green when now == golden, red otherwise. Do not edit by hand.

family: nemotron_nano
model_label: Nemotron Nano v3
mode: jail
cases:
  TOOLCALLING.jail.13:
    description: Unknown tool name absent from supplied tools
    ref: derived from TOOLCALLING.batch.13
    chunks:
    - delta_text: <tool_call> <function=unknown_tool>
    - delta_text: ' <parameter=location>'
    - delta_text: NYC</parameter> </function> </tool_call>
    - delta_text: ''
      finish_reason: stop
    golden:
      calls:
      - name: unknown_tool
        arguments:
          location: NYC
      normal_text: ''
    now:
      calls:
      - name: unknown_tool
        arguments:
          location: NYC
      normal_text: ''
