# v1 jail golden/after fixture (generated by build_jail_fixtures.py).
# chunks = stream input; golden = jail output before #10570; now = after #10570.
# The tab is green when now == golden, red otherwise. Do not edit by hand.

family: nemotron_nano
model_label: Nemotron Nano v3
mode: jail
cases:
  TOOLCALLING.jail.2.a:
    description: Parallel calls (back-to-back tool_call wrappers)
    ref: derived from TOOLCALLING.batch.2.a
    chunks:
    - delta_text: <tool_call> <function=get_weather>
    - delta_text: ' <parameter=location>'
    - delta_text: ' NYC </parameter> </function>'
    - delta_text: ' </tool_call> <tool_call>'
    - delta_text: ' <function=get_time>'
    - delta_text: ' <parameter=timezone> EST'
    - delta_text: ' </parameter> </function> </tool_call>'
    - delta_text: ''
      finish_reason: stop
    golden:
      calls:
      - name: get_weather
        arguments:
          location: NYC
      - name: get_time
        arguments:
          timezone: EST
      normal_text: ' '
    now:
      calls:
      - name: get_weather
        arguments:
          location: NYC
      - name: get_time
        arguments:
          timezone: EST
      normal_text: ' '
  TOOLCALLING.jail.2.c:
    description: With surrounding narration
    ref: derived from TOOLCALLING.batch.2.c
    chunks:
    - delta_text: 'Both: <tool_call>'
    - delta_text: ' <function=get_weather>'
    - delta_text: ' <parameter=location> NYC </parameter>'
    - delta_text: ' </function> </tool_call>'
    - delta_text: ' <tool_call>'
    - delta_text: ' <function=get_time> <parameter=timezone>'
    - delta_text: ' EST </parameter> </function>'
    - delta_text: ' </tool_call>'
    - delta_text: ' Done.'
    - delta_text: ''
      finish_reason: stop
    golden:
      calls:
      - name: get_weather
        arguments:
          location: NYC
      - name: get_time
        arguments:
          timezone: EST
      normal_text: 'Both:   Done.'
    now:
      calls:
      - name: get_weather
        arguments:
          location: NYC
      - name: get_time
        arguments:
          timezone: EST
      normal_text: 'Both:   Done.'
  TOOLCALLING.jail.2.d:
    description: Same-name twice
    ref: derived from TOOLCALLING.batch.2.d
    chunks:
    - delta_text: <tool_call> <function=get_weather>
    - delta_text: ' <parameter=location>'
    - delta_text: ' NYC </parameter> </function>'
    - delta_text: ' </tool_call> <tool_call>'
    - delta_text: ' <function=get_weather>'
    - delta_text: ' <parameter=location> LA'
    - delta_text: ' </parameter> </function> </tool_call>'
    - delta_text: ''
      finish_reason: stop
    golden:
      calls:
      - name: get_weather
        arguments:
          location: NYC
      - name: get_weather
        arguments:
          location: LA
      normal_text: ' '
    now:
      calls:
      - name: get_weather
        arguments:
          location: NYC
      - name: get_weather
        arguments:
          location: LA
      normal_text: ' '
