# v1 jail golden/after fixture (generated by build_jail_fixtures.py).
# chunks = stream input; golden = jail output before #10570; now = after #10570.
# The tab is green when now == golden, red otherwise. Do not edit by hand.

family: nemotron_nano
model_label: Nemotron Nano v3
mode: jail
cases:
  TOOLCALLING.jail.4.a:
    description: Tool_call wrapper with no <function> body
    ref: derived from TOOLCALLING.batch.4.a
    chunks:
    - delta_text: <tool_call> random
    - delta_text: ' text'
    - delta_text: ' </tool_call>'
    - delta_text: ''
      finish_reason: stop
    golden:
      calls: []
      normal_text: ''
    now:
      calls: []
      normal_text: ''
  TOOLCALLING.jail.4.d:
    description: Missing </parameter> closing tag
    ref: derived from TOOLCALLING.batch.4.d
    chunks:
    - delta_text: <tool_call> <function=get_weather>
    - delta_text: ' <parameter=location>'
    - delta_text: ' NYC </function> </tool_call>'
    - delta_text: ''
      finish_reason: stop
    golden:
      calls:
      - name: get_weather
        arguments:
          location: NYC
      normal_text: ''
    now:
      calls:
      - name: get_weather
        arguments:
          location: NYC
      normal_text: ''
