    - delta_text: ' "run_query",'
    - delta_text: ' "arguments": {"sql": "SELECT'
    - delta_text: ' a; SELECT'
    - delta_text: ' b"}};{"name":'
    - delta_text: ' "get_time", "arguments":'
    - delta_text: ' {"timezone": "EST"}}'
    - delta_text: ''
      finish_reason: tool_calls
    golden:
      calls:
      - name: run_query
        arguments:
          sql: SELECT a; SELECT b
      normal_text: ' "get_time", "arguments": {"timezone": "EST"}}'
    now:
      calls:
      - name: run_query
        arguments:
          sql: SELECT a; SELECT b
      normal_text: ' "get_time", "arguments": {"timezone": "EST"}}'
