        arguments:
          sql: SELECT value WHERE note has brace } and bracket ]
      normal_text: ' "arguments": {"timezone": "EST"}}'
    now:
      calls:
      - name: run_query
        arguments:
          sql: SELECT value WHERE note has brace } and bracket ]
      normal_text: ' "arguments": {"timezone": "EST"}}'
