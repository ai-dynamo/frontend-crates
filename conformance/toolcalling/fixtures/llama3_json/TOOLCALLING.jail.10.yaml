# v1 jail golden/after fixture (generated by build_jail_fixtures.py).
# chunks = stream input; golden = jail output before #10570; now = after #10570.
# The tab is green when now == golden, red otherwise. Do not edit by hand.

family: llama3_json
model_label: Llama 3 (JSON fmt)
mode: jail
cases:
  TOOLCALLING.jail.10:
    description: Duplicate calls (same name twice, semicolon-separated)
    ref: derived from TOOLCALLING.batch.10
    chunks:
    - delta_text: '<|python_tag|>{"name":'
    - delta_text: ' "get_weather",'
    - delta_text: ' "arguments": {"location": "NYC"}};{"name":'
    - delta_text: ' "get_weather", "arguments":'
    - delta_text: ' {"location":'
    - delta_text: ' "LA"}}'
    - delta_text: ''
      finish_reason: tool_calls
    golden:
      calls:
      - name: get_weather
        arguments:
          location: NYC
      normal_text: ' "get_weather", "arguments": {"location": "LA"}}'
    now:
      calls:
      - name: get_weather
        arguments:
          location: NYC
      normal_text: ' "get_weather", "arguments": {"location": "LA"}}'
