# v1 jail golden/after fixture (generated by build_jail_fixtures.py).
# chunks = stream input; golden = jail output before #10570; now = after #10570.
# The tab is green when now == golden, red otherwise. Do not edit by hand.

family: llama3_json
model_label: Llama 3 (JSON fmt)
mode: jail
cases:
  TOOLCALLING.jail.30.a:
    description: Llama JSON call separator `;` inside one argument string value
    ref: derived from TOOLCALLING.batch.30.a
    chunks:
    - delta_text: '<|python_tag|>{"name":'
    - delta_text: ' "run_query",'
    - delta_text: ' "arguments": {"sql": "SELECT'
    - delta_text: ' a; SELECT'
    - delta_text: ' b"}}'
    - delta_text: ''
      finish_reason: tool_calls
    golden:
      calls:
      - name: run_query
        arguments:
          sql: SELECT a; SELECT b
      normal_text: ''
    now:
      calls:
      - name: run_query
        arguments:
          sql: SELECT a; SELECT b
      normal_text: ''
  TOOLCALLING.jail.30.b:
    description: JSON structural delimiters `}` and `]` inside one argument string
      value
    ref: derived from TOOLCALLING.batch.30.b
    chunks:
    - delta_text: '<|python_tag|>{"name":'
    - delta_text: ' "run_query",'
    - delta_text: ' "arguments": {"sql": "SELECT'
    - delta_text: ' value WHERE'
    - delta_text: ' note'
    - delta_text: ' has brace'
    - delta_text: ' } and bracket'
    - delta_text: ' ]'
    - delta_text: '"}}'
    - delta_text: ''
      finish_reason: tool_calls
    golden:
      calls:
      - name: run_query
        arguments:
          sql: SELECT value WHERE note has brace } and bracket ]
      normal_text: ''
    now:
      calls:
      - name: run_query
        arguments:
          sql: SELECT value WHERE note has brace } and bracket ]
      normal_text: ''
  TOOLCALLING.jail.30.c:
    description: Start marker `<|python_tag|>` text inside one argument string value
    ref: derived from TOOLCALLING.batch.30.c
    chunks:
    - delta_text: '<|python_tag|>{"name":'
    - delta_text: ' "run_query",'
    - delta_text: ' "arguments": {"sql": "literal'
    - delta_text: ' <|python_tag marker|>'
    - delta_text: '{name:x}'
    - delta_text: ' stays text"}}'
    - delta_text: ''
      finish_reason: tool_calls
    golden:
      calls:
      - name: run_query
        arguments:
          sql: literal <|python_tag marker|>{name:x} stays text
      normal_text: ''
    now:
      calls:
      - name: run_query
        arguments:
          sql: literal <|python_tag marker|>{name:x} stays text
      normal_text: ''
