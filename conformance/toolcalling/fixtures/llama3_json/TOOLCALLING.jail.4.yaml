# v1 jail golden/after fixture (generated by build_jail_fixtures.py).
# chunks = stream input; golden = jail output before #10570; now = after #10570.
# The tab is green when now == golden, red otherwise. Do not edit by hand.

family: llama3_json
model_label: Llama 3 (JSON fmt)
mode: jail
cases:
  TOOLCALLING.jail.4.a:
    description: Python_tag prefix with non-JSON garbage
    ref: derived from TOOLCALLING.batch.4.a
    chunks:
    - delta_text: <|python_tag|>not
    - delta_text: ' even'
    - delta_text: ' json'
    - delta_text: ''
      finish_reason: stop
    golden:
      calls: []
      normal_text: ''
    now:
      calls: []
      normal_text: ''
  TOOLCALLING.jail.4.b:
    description: Missing close brace
    ref: derived from TOOLCALLING.batch.4.b
    chunks:
    - delta_text: '<|python_tag|>{"name":'
    - delta_text: ' "get_weather",'
    - delta_text: ' "arguments": {"location": "NYC"'
    - delta_text: ''
      finish_reason: stop
    golden:
      calls: []
      normal_text: ''
    now:
      calls: []
      normal_text: ''
  TOOLCALLING.jail.4.c:
    description: Missing name key
    ref: derived from TOOLCALLING.batch.4.c
    chunks:
    - delta_text: '<|python_tag|>{"arguments":'
    - delta_text: ' {"location":'
    - delta_text: ' "NYC"}}'
    - delta_text: ''
      finish_reason: stop
    golden:
      calls: []
      normal_text: ''
    now:
      calls: []
      normal_text: ''
  TOOLCALLING.jail.4.e:
    description: Malformed JSON prefix followed by a valid complete call
    ref: derived from TOOLCALLING.batch.4.e
    chunks:
    - delta_text: '{"name": "get_weather",'
    - delta_text: ' "arguments":'
    - delta_text: ' {{"name": "get_weather", "arguments":'
    - delta_text: ' {}}'
    - delta_text: ''
      finish_reason: tool_calls
    golden:
      calls: []
      normal_text: '{"name": "get_weather", "arguments": {{"name": "get_weather",
        "arguments": {}}'
    now:
      calls: []
      normal_text: '{"name": "get_weather", "arguments": {{"name": "get_weather",
        "arguments": {}}'
