family: mistral
mode: batch
cases:
  TOOLCALLING.batch.2.a:
    description: Parallel calls in JSON array
    ref: dynamo
    model_text: '[TOOL_CALLS][{"name": "get_weather", "arguments": {"location": "NYC"}}, {"name": "get_time", "arguments":
      {"timezone": "EST"}}][/TOOL_CALLS]'
    tools:
    - &id002
      name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    - &id003
      name: get_time
      parameters:
        type: object
        properties:
          timezone:
            type: string
    expected:
      dynamo: &id001
        calls:
        - name: get_weather
          arguments:
            location: NYC
        - name: get_time
          arguments:
            timezone: EST
        normal_text: ''
      vllm: *id001
      sglang:
        calls: []
        normal_text: ''
        reason: SGLang MistralDetector returns calls=[] on the bare [TOOL_CALLS]...[/TOOL_CALLS] format Dynamo emits
  TOOLCALLING.batch.2.c:
    description: With surrounding narration
    dynamo_note: 'Mistral ships a reference decoder in mistral-common: content is only the tokens before the [TOOL_CALLS] control token and the remainder is parsed as the tool-call JSON array, so trailing prose is unrepresentable. Dynamo follows that decoder: text from [TOOL_CALLS] onward is dropped. Source: https://github.com/mistralai/mistral-common/blob/main/src/mistral_common/experimental/tools.py'
    ref: dynamo
    model_text: 'Both: [TOOL_CALLS][{"name": "get_weather", "arguments": {"location": "NYC"}}, {"name": "get_time", "arguments":
      {"timezone": "EST"}}][/TOOL_CALLS] Done.'
    tools:
    - *id002
    - *id003
    expected:
      dynamo:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        - name: get_time
          arguments:
            timezone: EST
        normal_text: 'Both:'
      vllm:
        reason: 'Dynamo preserves both the leading prefix and the trailing text
          ("Done.") around the parallel calls (only the [TOOL_CALLS] envelope is
          stripped); vLLM keeps the prefix (with its trailing space) and drops the
          trailing text. Non-parity by design.'
        calls:
        - name: get_weather
          arguments:
            location: NYC
        - name: get_time
          arguments:
            timezone: EST
        normal_text: 'Both: '
      sglang:
        calls: []
        normal_text: 'Both:'
        reason: 'Two divergences. (1) Calls: SGLang MistralDetector returns calls=[]
          on the bare [TOOL_CALLS]...[/TOOL_CALLS] format Dynamo emits. (2) normal_text:
          Dynamo preserves both the leading prefix and the trailing text ("Done.")
          around the calls; SGLang keeps only the prefix. Non-parity by design.'
  TOOLCALLING.batch.2.d:
    description: Same-name twice
    ref: dynamo
    model_text: '[TOOL_CALLS][{"name": "get_weather", "arguments": {"location": "NYC"}}, {"name": "get_weather", "arguments":
      {"location": "LA"}}][/TOOL_CALLS]'
    tools:
    - *id002
    - *id002
    expected:
      dynamo: &id004
        calls:
        - name: get_weather
          arguments:
            location: NYC
        - name: get_weather
          arguments:
            location: LA
        normal_text: ''
      vllm: *id004
      sglang:
        calls: []
        normal_text: ''
        reason: SGLang MistralDetector returns calls=[] on the bare [TOOL_CALLS]...[/TOOL_CALLS] format Dynamo emits
  TOOLCALLING.batch.2.b:
    description: Two back-to-back fence pairs — not applicable to this family
    reason: |-
      mistral's multi-call form is exercised by TOOLCALLING.batch.2.a / 2.c / 2.d; no back-to-back fence/wrapper pattern applies to this family's parser syntax.
