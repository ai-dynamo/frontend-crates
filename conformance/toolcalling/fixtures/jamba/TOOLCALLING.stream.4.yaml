family: jamba
model_label: AI21 Jamba
mode: stream
cases:
  TOOLCALLING.stream.4.a:
    description: Truncated stream terminates after a complete in-flight tool-call body
    ref: derived from TOOLCALLING.batch.5.a
    chunks:
    - delta_text: '<tool_calls>[{"name": "get_weather", "arguments": {"location": "NYC"}}]'
    - delta_text: ''
      finish_reason: stop
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    expected:
      dynamo:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        normal_text: ''
      sglang:
        unavailable: SGLang has no detector for family='jamba'
      vllm:
        reason: "vLLM's streaming jamba detector drops the arguments to an empty object on a truncated (finish_reason=stop) stream. Dynamo's streaming jail recovers the complete in-flight call body with full arguments."
        calls:
        - name: get_weather
          arguments: {}
        normal_text: ''
  TOOLCALLING.stream.4.b:
    description: Stream terminates mid-call body before the in-flight argument payload is complete
    ref: derived from TOOLCALLING.batch.5.c
    chunks:
    - delta_text: '<tool_calls>[{"name": "get_'
    - delta_text: 'weather", "arguments": {"loc'
    - delta_text: ''
      finish_reason: stop
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    expected:
      dynamo:
        calls: []
        normal_text: ''
      sglang:
        unavailable: SGLang has no detector for family='jamba'
      vllm:
        reason: "vLLM emits the call with empty arguments on mid-body truncation; Dynamo's streaming jail suppresses the truncated <tool_calls> wrapper, emitting no call and no markup (aligned by ai-dynamo/dynamo#10847)."
        calls:
        - name: get_weather
          arguments: {}
        normal_text: ''
  TOOLCALLING.stream.4.c:
    description: Stream reaches length after a valid inner tool-call body without the required outer wrapper, followed by
      repeated close markers
    ref: derived from nemotron-ultra-preview-tool-call-leak-repro/repro_tool_call_leak.py
    chunks:
    - delta_text: '[{"name": "get_weather", "arguments": {"location": "NYC"}}]</tool_calls></tool_calls></tool_calls>'
    - delta_text: ''
      finish_reason: length
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    expected:
      dynamo:
        calls: []
        normal_text: '[{"name": "get_weather", "arguments": {"location": "NYC"}}]'
      vllm:
        reason: "vLLM's streaming jamba detector leaves the orphan </tool_calls> close markers in normal_text. Dynamo's streaming jail strips every </tool_calls> occurrence and keeps the inner JSON body (aligned by ai-dynamo/dynamo#10847)."
        calls: []
        normal_text: '[{"name": "get_weather", "arguments": {"location": "NYC"}}]</tool_calls></tool_calls></tool_calls>'
      sglang:
        unavailable: SGLang has no detector for family='jamba'
