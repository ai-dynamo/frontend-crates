# v1 jail golden/after fixture (generated by build_jail_fixtures.py).
# chunks = stream input; golden = jail output before #10570; now = after #10570.
# The tab is green when now == golden, red otherwise. Do not edit by hand.

family: hermes
model_label: Hermes-3 / Llama variants
mode: jail
cases:
  TOOLCALLING.jail.4.a:
    description: Tool_call wrapper with non-JSON garbage
    ref: derived from TOOLCALLING.batch.4.a
    chunks:
    - delta_text: <tool_call>not
    - delta_text: ' even'
    - delta_text: ' json</tool_call>'
    - delta_text: ''
      finish_reason: stop
    golden:
      calls: []
      normal_text: ''
    now:
      calls: []
      normal_text: ''
  TOOLCALLING.jail.4.b:
    description: Missing close brace in JSON body
    ref: derived from TOOLCALLING.batch.4.b
    chunks:
    - delta_text: '<tool_call>{"name":'
    - delta_text: ' "get_weather",'
    - delta_text: ' "arguments": {"location": "NYC"</tool_call>'
    - delta_text: ''
      finish_reason: stop
    golden:
      calls: []
      normal_text: ''
    now:
      calls: []
      normal_text: ''
  TOOLCALLING.jail.4.c:
    description: Missing name key
    ref: derived from TOOLCALLING.batch.4.c
    chunks:
    - delta_text: '<tool_call>{"arguments":'
    - delta_text: ' {"location":'
    - delta_text: ' "NYC"}}</tool_call>'
    - delta_text: ''
      finish_reason: stop
    golden:
      calls: []
      normal_text: ''
    now:
      calls: []
      normal_text: ''
  TOOLCALLING.jail.4.d:
    description: Missing </tool_call> close
    ref: derived from TOOLCALLING.batch.4.d
    chunks:
    - delta_text: '<tool_call>{"name":'
    - delta_text: ' "get_weather",'
    - delta_text: ' "arguments": {"location": "NYC"}}'
    - delta_text: ''
      finish_reason: tool_calls
    golden:
      calls:
      - name: get_weather
        arguments:
          location: NYC
      normal_text: ''
    now:
      calls:
      - name: get_weather
        arguments:
          location: NYC
      normal_text: ''
