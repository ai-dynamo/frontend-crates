    ref: derived from TOOLCALLING.batch.8.c
    chunks:
    - delta_text: I will
    - delta_text: ' check'
    - delta_text: ' the weather. <tool_call>'
    - delta_text: '{"name": "get_weather",'
    - delta_text: ' "arguments":'
    - delta_text: ' {"location": "NYC"}}</tool_call>'
    - delta_text: ' Let me know'
    - delta_text: ' if'
    - delta_text: ' you need'
    - delta_text: ' more.'
