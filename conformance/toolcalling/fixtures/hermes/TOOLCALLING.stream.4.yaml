family: hermes
model_label: Hermes-3 / Llama variants
mode: stream
cases:
  TOOLCALLING.stream.4.a:
    description: Truncated stream terminates after a complete in-flight tool-call body
    ref: derived from TOOLCALLING.batch.5.a
    chunks:
    - delta_text: '<tool_call>{"name": "get_weather", "arguments": {"location": "NYC"}}'
    - delta_text: ''
      finish_reason: stop
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    expected:
      dynamo: &id001
        calls:
        - name: get_weather
          arguments:
            location: NYC
        normal_text: ''
      sglang: *id001
      vllm: *id001
  TOOLCALLING.stream.4.b:
    description: Stream terminates mid-call body before the in-flight argument payload is complete
    ref: derived from TOOLCALLING.batch.5.c
    chunks:
    - delta_text: '<tool_call>{"name": "get_w'
    - delta_text: 'eather", "arguments": {"loc'
    - delta_text: ''
      finish_reason: stop
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    expected:
      dynamo:
        calls: []
        normal_text: '<tool_call>{"name": "get_weather", "arguments": {"loc'
      sglang:
        reason: 'On a stream truncated mid-body, SGLang''s finalizer recovers a no-arg
          get_weather({}); Dynamo''s streaming jail surfaces the partial <tool_call>
          body as text. Streaming-finalize recovery is tracked separately from the
          batch path (the batch case 5.c suppresses to empty). Non-parity by design.'
        calls:
        - name: get_weather
          arguments: {}
        normal_text: ''
      vllm:
        reason: 'On a stream truncated mid-body, vLLM''s finalizer emits get_weather
          with the partial ''{"loc'' argument fragment; Dynamo''s streaming jail surfaces
          the partial <tool_call> body as text. Non-parity by design.'
        calls:
        - name: get_weather
          arguments: '{"loc'
        normal_text: ''
  TOOLCALLING.stream.4.c:
    description: Stream reaches length after a valid inner tool-call body without the required outer wrapper, followed by
      repeated close markers
    ref: derived from nemotron-ultra-preview-tool-call-leak-repro/repro_tool_call_leak.py
    chunks:
    - delta_text: '{"name": "get_weather", "arguments": {"location": "NYC"}}</tool_call></tool_call></tool_call>'
    - delta_text: ''
      finish_reason: length
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    expected:
      dynamo: &id002
        calls: []
        normal_text: '{"name": "get_weather", "arguments": {"location": "NYC"}}</tool_call></tool_call></tool_call>'
      vllm: *id002
      sglang:
        reason: 'SGLang strips the orphan </tool_call> run and keeps the inner JSON
          body as text; Dynamo''s streaming jail leaves the trailing close-marker run
          in normal_text. Non-parity by design.'
        calls: []
        normal_text: '{"name": "get_weather", "arguments": {"location": "NYC"}}'
