# v1 jail golden/after fixture (generated by build_jail_fixtures.py).
# chunks = stream input; golden = jail output before #10570; now = after #10570.
# The tab is green when now == golden, red otherwise. Do not edit by hand.

family: kimi_k2
model_label: Kimi K2.6
mode: jail
cases:
  TOOLCALLING.jail.8.a:
    description: Narration before tool call only
    ref: derived from TOOLCALLING.batch.8.a
    chunks:
    - delta_text: I'll check
    - delta_text: ' the'
    - delta_text: ' weather. <|tool_calls_section_begin|><|tool_call_begin|>'
    - delta_text: functions.get_weather:0<|tool_call_argument_begin|>{"location":"Dallas"}<|tool_call_end|>
    - delta_text: <|tool_calls_section_end|>
    - delta_text: ''
      finish_reason: tool_calls
    golden:
      calls:
      - name: get_weather
        arguments:
          location: Dallas
      normal_text: 'I''ll check the weather. '
    now:
      calls:
      - name: get_weather
        arguments:
          location: Dallas
      normal_text: 'I''ll check the weather. '
  TOOLCALLING.jail.8.b:
