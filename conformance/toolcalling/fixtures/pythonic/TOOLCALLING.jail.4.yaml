# v1 jail golden/after fixture (generated by build_jail_fixtures.py).
# chunks = stream input; golden = jail output before #10570; now = after #10570.
# The tab is green when now == golden, red otherwise. Do not edit by hand.

family: pythonic
model_label: Llama 4 (pythonic fmt)
mode: jail
cases:
  TOOLCALLING.jail.4.a:
    description: Bracket form with garbage call
    ref: derived from TOOLCALLING.batch.4.a
    chunks:
    - delta_text: '[not a'
    - delta_text: ' valid'
    - delta_text: ' python call]'
    - delta_text: ''
      finish_reason: stop
    golden:
      calls: []
      normal_text: '[not a valid python call]'
    now:
      calls: []
      normal_text: '[not a valid python call]'
  TOOLCALLING.jail.4.b:
    description: Missing closing bracket
    ref: derived from TOOLCALLING.batch.4.b
    chunks:
    - delta_text: '[get_weather(location="NYC"'
    - delta_text: ''
      finish_reason: stop
    golden:
      calls: []
      normal_text: '[get_weather(location="NYC"'
    now:
      calls: []
      normal_text: '[get_weather(location="NYC"'
  TOOLCALLING.jail.4.d:
    description: Mismatched paren / bracket
    ref: derived from TOOLCALLING.batch.4.d
    chunks:
    - delta_text: '[get_weather(location="NYC"]'
    - delta_text: ''
      finish_reason: stop
    golden:
      calls: []
      normal_text: '[get_weather(location="NYC"]'
    now:
      calls: []
      normal_text: '[get_weather(location="NYC"]'
