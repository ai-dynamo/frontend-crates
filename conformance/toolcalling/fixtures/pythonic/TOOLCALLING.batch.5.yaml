family: pythonic
mode: batch
cases:
  TOOLCALLING.batch.5.a:
    description: Missing closing `]` end marker
    ref: dynamo
    model_text: '[get_weather(location="NYC")'
    tools:
    - &id002
      name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    expected:
      dynamo:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        normal_text: ''
      vllm: &id001
        calls: []
        normal_text: '[get_weather(location="NYC")'
        reason: 'Dynamo recovers: the call get_weather(location="NYC") is complete (closing ")") and only the outer "]" was truncated, so Dynamo closes the list and emits the call (recover/drop rule, parsers_v2/README.md goal 5). vLLM and SGLang leak the raw text instead.'
      sglang: *id001
  TOOLCALLING.batch.5.b:
    description: Closing `]` without matching `[` open
    ref: dynamo
    model_text: get_weather(location="NYC")]
    tools:
    - *id002
    expected:
      dynamo: &id003
        calls: []
        normal_text: get_weather(location="NYC")]
      vllm: *id003
      sglang: *id003
  TOOLCALLING.batch.5.c:
    description: Truncation mid-argument value
    ref: dynamo
    model_text: '[get_weather(location="N'
    tools:
    - *id002
    expected:
      dynamo: &id004
        calls: []
        normal_text: '[get_weather(location="N'
      vllm: *id004
      sglang: *id004
  TOOLCALLING.batch.5.d:
    description: Multi-call, last call missing only end marker (body complete)
    ref: dynamo
    model_text: I'll start by fetching the weather for both Boston and New York at the same time![get_weather(location="Boston"),
      get_weather(location="New York")
    tools:
    - *id002
    expected:
      dynamo:
        calls:
        - name: get_weather
          arguments:
            location: Boston
        - name: get_weather
          arguments:
            location: New York
        normal_text: I'll start by fetching the weather for both Boston and New York at the same time!
      vllm: &id005
        calls: []
        normal_text: I'll start by fetching the weather for both Boston and New York at the same time![get_weather(location="Boston"),
          get_weather(location="New York")
        reason: 'Dynamo recovers both calls: each is complete (closing ")") and only the outer "]" was truncated, so Dynamo closes the list and emits them (recover/drop rule, parsers_v2/README.md goal 5); vLLM and SGLang leak the raw text instead.'
      sglang: *id005
  TOOLCALLING.batch.5.e:
    description: Multi-call, last call truncated mid-arg-value
    ref: dynamo
    model_text: I'll start by fetching the weather for both Boston and New York at the same time![get_weather(location="Boston"),
      get_weather(location="New York
    tools:
    - *id002
    expected:
      dynamo: &id006
        calls: []
        normal_text: I'll start by fetching the weather for both Boston and New York at the same time![get_weather(location="Boston"),
          get_weather(location="New York
      vllm: *id006
      sglang: *id006
