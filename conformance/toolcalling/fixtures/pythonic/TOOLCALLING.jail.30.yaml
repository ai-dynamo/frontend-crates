# v1 jail golden/after fixture (generated by build_jail_fixtures.py).
# chunks = stream input; golden = jail output before #10570; now = after #10570.
# The tab is green when now == golden, red otherwise. Do not edit by hand.

family: pythonic
model_label: Llama 4 (pythonic fmt)
mode: jail
cases:
  TOOLCALLING.jail.30.a:
    description: Pythonic call separator `,` inside one argument string value
    ref: derived from TOOLCALLING.batch.30.a
    chunks:
    - delta_text: '[run_query(sql="SELECT a,'
    - delta_text: ' SELECT'
    - delta_text: ' b")]'
    - delta_text: ''
      finish_reason: tool_calls
    golden:
      calls:
      - name: run_query
        arguments:
          sql: SELECT a, SELECT b
      normal_text: ''
    now:
      calls:
      - name: run_query
        arguments:
          sql: SELECT a, SELECT b
      normal_text: ''
  TOOLCALLING.jail.30.b:
    description: Pythonic/list structural delimiters `}` and `]` inside one argument
      string value
    ref: derived from TOOLCALLING.batch.30.b
    chunks:
    - delta_text: '[run_query(sql="SELECT value'
    - delta_text: ' WHERE'
    - delta_text: ' note has brace'
    - delta_text: ' } and'
    - delta_text: ' bracket'
    - delta_text: ' ]")]'
    - delta_text: ''
      finish_reason: tool_calls
    golden:
      calls:
      - name: run_query
        arguments:
          sql: SELECT value WHERE note has brace } and bracket ]
      normal_text: ''
    now:
      calls:
      - name: run_query
        arguments:
          sql: SELECT value WHERE note has brace } and bracket ]
      normal_text: ''
  TOOLCALLING.jail.30.c:
    description: Tool-call marker-looking `[get_time ...]` text inside one argument
      string value
    ref: derived from TOOLCALLING.batch.30.c
    chunks:
    - delta_text: '[run_query(sql="literal [get_time'
    - delta_text: ' marker]'
    - delta_text: ' stays text")]'
    - delta_text: ''
      finish_reason: tool_calls
    golden:
      calls:
      - name: run_query
        arguments:
          sql: literal [get_time marker] stays text
      normal_text: ''
    now:
      calls:
      - name: run_query
        arguments:
          sql: literal [get_time marker] stays text
      normal_text: ''
