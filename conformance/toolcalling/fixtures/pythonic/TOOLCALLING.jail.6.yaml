# v1 jail golden/after fixture (generated by build_jail_fixtures.py).
# chunks = stream input; golden = jail output before #10570; now = after #10570.
# The tab is green when now == golden, red otherwise. Do not edit by hand.

family: pythonic
model_label: Llama 4 (pythonic fmt)
mode: jail
cases:
  TOOLCALLING.jail.6.a:
    description: Empty parens (no args)
    ref: derived from TOOLCALLING.batch.6.a
    chunks:
    - delta_text: '[get_time()]'
    - delta_text: ''
      finish_reason: tool_calls
    golden:
      calls:
      - name: get_time
        arguments: {}
      normal_text: ''
    now:
      calls:
      - name: get_time
        arguments: {}
      normal_text: ''
  TOOLCALLING.jail.6.b:
    description: Whitespace inside parens
    ref: derived from TOOLCALLING.batch.6.b
    chunks:
    - delta_text: '[get_time( )]'
    - delta_text: ''
      finish_reason: stop
    golden:
      calls: []
      normal_text: '[get_time( )]'
    now:
      calls: []
      normal_text: '[get_time( )]'
