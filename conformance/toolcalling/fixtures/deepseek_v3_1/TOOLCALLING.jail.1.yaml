# v1 jail golden/after fixture (generated by build_jail_fixtures.py).
# chunks = stream input; golden = jail output before #10570; now = after #10570.
# The tab is green when now == golden, red otherwise. Do not edit by hand.

family: deepseek_v3_1
model_label: DeepSeek V3.1
mode: jail
cases:
  TOOLCALLING.jail.1:
    description: Single tool call (happy path)
    ref: derived from TOOLCALLING.batch.1
    chunks:
    - delta_text: <｜tool▁calls▁begin｜><｜tool▁call▁begin｜>
    - delta_text: get_weather<｜tool▁sep｜>
    - delta_text: '{"location":"NYC"}<｜tool▁call▁end｜><｜tool▁calls▁end｜>'
    - delta_text: ''
      finish_reason: tool_calls
    golden:
      calls:
      - name: get_weather
        arguments:
          location: NYC
      normal_text: ''
    now:
      calls:
      - name: get_weather
        arguments:
          location: NYC
      normal_text: ''
