# v1 jail golden/after fixture (generated by build_jail_fixtures.py).
# chunks = stream input; golden = jail output before #10570; now = after #10570.
# The tab is green when now == golden, red otherwise. Do not edit by hand.

family: gemma4
model_label: Gemma 4
mode: jail
cases:
  TOOLCALLING.jail.13.a:
    description: Unknown-only call under default behavior
    ref: derived from TOOLCALLING.batch.13.a
    chunks:
    - delta_text: <|tool_call>call:unknown_tool{location:<|"|>
    - delta_text: NYC<|"|>
    - delta_text: '}<tool_call|>'
    - delta_text: ''
      finish_reason: tool_calls
    golden:
      calls:
      - name: unknown_tool
        arguments:
          location: NYC
      normal_text: ''
    now:
      calls:
      - name: unknown_tool
        arguments:
          location: NYC
      normal_text: ''
  TOOLCALLING.jail.13.c:
    description: Mixed known and unknown calls in one response
    ref: derived from TOOLCALLING.batch.13.c
    chunks:
    - delta_text: <|tool_call>call:get_weather{location:<|"|>
    - delta_text: NYC<|"|>
    - delta_text: '}<tool_call|><|tool_call>call:unknown_tool{location:<|"|>'
    - delta_text: LA<|"|>}<tool_call|>
    - delta_text: ''
      finish_reason: tool_calls
    golden:
      calls:
      - name: get_weather
        arguments:
          location: NYC
      - name: unknown_tool
        arguments:
          location: LA
      normal_text: ''
    now:
      calls:
      - name: get_weather
        arguments:
          location: NYC
