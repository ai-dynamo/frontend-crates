# v1 jail golden/after fixture (generated by build_jail_fixtures.py).
# chunks = stream input; golden = jail output before #10570; now = after #10570.
# The tab is green when now == golden, red otherwise. Do not edit by hand.

family: gemma4
model_label: Gemma 4
mode: jail
cases:
  TOOLCALLING.jail.31.a:
    description: Multi-call response with Gemma delimiters `,`, `:`, and `{}` inside
      the first argument string
    ref: derived from TOOLCALLING.batch.31.a
    chunks:
    - delta_text: <|tool_call>call:run_query{sql:<|"|>
    - delta_text: SELECT
    - delta_text: ' a,b:and{brace}<|"|>}<tool_call|><|tool_call>'
    - delta_text: call:get_time{timezone:<|"|>EST<|"|>
    - delta_text: '}<tool_call|>'
    - delta_text: ''
      finish_reason: tool_calls
    golden:
      calls:
      - name: run_query
        arguments:
          sql: SELECT a,b:and{brace}
      - name: get_time
        arguments:
          timezone: EST
      normal_text: ''
    now:
      calls:
      - name: run_query
        arguments:
          sql: SELECT a,b:and{brace}
      - name: get_time
        arguments:
          timezone: EST
      normal_text: ''
  TOOLCALLING.jail.31.b:
    description: Multi-call response with structural delimiters inside one argument
      string value
    ref: derived from TOOLCALLING.batch.31.b
    chunks:
    - delta_text: <|tool_call>call:run_query{sql:<|"|>
    - delta_text: SELECT
    - delta_text: ' value WHERE note'
    - delta_text: ' has brace'
    - delta_text: ' }'
    - delta_text: ' and bracket'
    - delta_text: ' ]<|"|>}<tool_call|>'
    - delta_text: <|tool_call>
    - delta_text: call:get_time{timezone:<|"|>EST<|"|>
    - delta_text: '}<tool_call|>'
    - delta_text: ''
      finish_reason: tool_calls
    golden:
      calls:
      - name: run_query
        arguments:
          sql: SELECT value WHERE note has brace } and bracket ]
      - name: get_time
        arguments:
          timezone: EST
      normal_text: ''
    now:
      calls:
      - name: run_query
        arguments:
          sql: SELECT value WHERE note has brace } and bracket ]
      - name: get_time
        arguments:
          timezone: EST
      normal_text: ''
