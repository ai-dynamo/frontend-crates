# v1 jail golden/after fixture (generated by build_jail_fixtures.py).
# chunks = stream input; golden = jail output before #10570; now = after #10570.
# The tab is green when now == golden, red otherwise. Do not edit by hand.

family: gemma4
model_label: Gemma 4
mode: jail
cases:
  TOOLCALLING.jail.8.a:
    description: Narration before tool call only
    ref: derived from TOOLCALLING.batch.8.a
    chunks:
    - delta_text: I will
    - delta_text: ' check'
    - delta_text: ' the weather. <|tool_call>'
    - delta_text: call:get_weather{location:<|"|>NYC<|"|>
    - delta_text: '}<tool_call|>'
    - delta_text: ''
      finish_reason: tool_calls
    golden:
      calls:
      - name: get_weather
        arguments:
          location: NYC
      normal_text: 'I will check the weather. '
    now:
      calls:
      - name: get_weather
        arguments:
          location: NYC
      normal_text: 'I will check the weather. '
  TOOLCALLING.jail.8.b:
    description: Narration after tool call only
    ref: derived from TOOLCALLING.batch.8.b
    chunks:
    - delta_text: <|tool_call>call:get_weather{location:<|"|>
    - delta_text: NYC<|"|>
    - delta_text: '}<tool_call|> Let me'
    - delta_text: ' know if'
    - delta_text: ' you'
    - delta_text: ' need more.'
    - delta_text: ''
      finish_reason: tool_calls
    golden:
      calls:
      - name: get_weather
        arguments:
          location: NYC
      normal_text: ' Let me know if you need more.'
    now:
      calls:
      - name: get_weather
        arguments:
          location: NYC
      normal_text: ' Let me know if you need more.'
  TOOLCALLING.jail.8.c:
    description: Narration both before and after (sandwich)
    ref: derived from TOOLCALLING.batch.8.c
    chunks:
    - delta_text: I will
    - delta_text: ' check'
    - delta_text: ' the weather. <|tool_call>'
    - delta_text: call:get_weather{location:<|"|>NYC<|"|>
    - delta_text: '}<tool_call|>'
    - delta_text: ' Let me'
    - delta_text: ' know if you'
    - delta_text: ' need'
    - delta_text: ' more.'
    - delta_text: ''
      finish_reason: tool_calls
    golden:
      calls:
      - name: get_weather
        arguments:
          location: NYC
      normal_text: I will check the weather.  Let me know if you need more.
    now:
      calls:
      - name: get_weather
        arguments:
          location: NYC
      normal_text: I will check the weather.  Let me know if you need more.
  TOOLCALLING.jail.8.d:
    description: Narration between multiple tool calls
    ref: derived from TOOLCALLING.batch.8.d
    chunks:
    - delta_text: I will
    - delta_text: ' check'
    - delta_text: ' the weather. <|tool_call>'
    - delta_text: call:get_weather{location:<|"|>NYC<|"|>
    - delta_text: '}<tool_call|>'
    - delta_text: ' Then check'
    - delta_text: ' LA weather. <|tool_call>'
    - delta_text: call:get_weather{location:<|"|>
    - delta_text: LA<|"|>}<tool_call|>
    - delta_text: ''
      finish_reason: tool_calls
    golden:
      calls:
      - name: get_weather
        arguments:
          location: NYC
      - name: get_weather
        arguments:
          location: LA
      normal_text: 'I will check the weather.  Then check LA weather. '
    now:
      calls:
      - name: get_weather
        arguments:
          location: NYC
      - name: get_weather
        arguments:
          location: LA
      normal_text: 'I will check the weather.  Then check LA weather. '
