# v1 jail golden/after fixture (generated by build_jail_fixtures.py).
# chunks = stream input; golden = jail output before #10570; now = after #10570.
# The tab is green when now == golden, red otherwise. Do not edit by hand.

family: gemma4
model_label: Gemma 4
mode: jail
cases:
  TOOLCALLING.jail.4.a:
    description: Sentinel pair with garbage
    ref: derived from TOOLCALLING.batch.4.a
    chunks:
    - delta_text: <|tool_call>nonsense<tool_call|>
    - delta_text: ''
      finish_reason: stop
    golden:
      calls: []
      normal_text: ''
    now:
      calls: []
      normal_text: ''
  TOOLCALLING.jail.4.b:
    description: Missing close brace in body
    ref: derived from TOOLCALLING.batch.4.b
    chunks:
    - delta_text: <|tool_call>call:get_weather{location:<|"|>
    - delta_text: NYC<|"|>
    - delta_text: <tool_call|>
    - delta_text: ''
      finish_reason: tool_calls
    golden:
      calls: []
      normal_text: ''
    now:
      calls: []
      normal_text: ''
  TOOLCALLING.jail.4.c:
    description: No call:name prefix
    ref: derived from TOOLCALLING.batch.4.c
    chunks:
    - delta_text: <|tool_call>{location:<|"|>
    - delta_text: NYC<|"|>
    - delta_text: '}<tool_call|>'
    - delta_text: ''
      finish_reason: stop
    golden:
      calls: []
      normal_text: ''
    now:
      calls: []
      normal_text: ''
  TOOLCALLING.jail.4.d:
    description: Mismatched sentinels
    ref: derived from TOOLCALLING.batch.4.d
    chunks:
    - delta_text: <|tool_call>call:get_weather{location:<|"|>
    - delta_text: NYC<|"|>
    - delta_text: '}</tool_call>'
    - delta_text: ''
      finish_reason: stop
    golden:
      calls: []
      normal_text: ''
    now:
      calls: []
      normal_text: ''
