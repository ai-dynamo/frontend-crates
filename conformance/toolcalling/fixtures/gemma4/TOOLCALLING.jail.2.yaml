# v1 jail golden/after fixture (generated by build_jail_fixtures.py).
# chunks = stream input; golden = jail output before #10570; now = after #10570.
# The tab is green when now == golden, red otherwise. Do not edit by hand.

family: gemma4
model_label: Gemma 4
mode: jail
cases:
  TOOLCALLING.jail.2.a:
    description: Parallel calls (back-to-back sentinels)
    ref: derived from TOOLCALLING.batch.2.a
    chunks:
    - delta_text: <|tool_call>call:get_weather{location:<|"|>
    - delta_text: NYC<|"|>
    - delta_text: '}<tool_call|><|tool_call>call:get_time{timezone:<|"|>'
    - delta_text: EST<|"|>}<tool_call|>
    - delta_text: ''
      finish_reason: tool_calls
    golden:
      calls:
      - name: get_weather
        arguments:
          location: NYC
      - name: get_time
        arguments:
          timezone: EST
      normal_text: ''
    now:
      calls:
      - name: get_weather
        arguments:
          location: NYC
      - name: get_time
        arguments:
          timezone: EST
      normal_text: ''
  TOOLCALLING.jail.2.c:
    description: With surrounding narration
    ref: derived from TOOLCALLING.batch.2.c
    chunks:
    - delta_text: 'Both: <|tool_call>'
    - delta_text: call:get_weather{location:<|"|>
    - delta_text: NYC<|"|>}<tool_call|><|tool_call>
    - delta_text: call:get_time{timezone:<|"|>EST<|"|>
    - delta_text: '}<tool_call|>'
    - delta_text: ' Done.'
    - delta_text: ''
      finish_reason: tool_calls
    golden:
      calls:
      - name: get_weather
        arguments:
          location: NYC
      - name: get_time
        arguments:
          timezone: EST
      normal_text: 'Both:  Done.'
    now:
      calls:
      - name: get_weather
        arguments:
          location: NYC
      - name: get_time
        arguments:
          timezone: EST
      normal_text: 'Both:  Done.'
  TOOLCALLING.jail.2.d:
    description: Same-name twice
    ref: derived from TOOLCALLING.batch.2.d
    chunks:
    - delta_text: <|tool_call>call:get_weather{location:<|"|>
    - delta_text: NYC<|"|>
    - delta_text: '}<tool_call|><|tool_call>call:get_weather{location:<|"|>'
    - delta_text: LA<|"|>}<tool_call|>
    - delta_text: ''
      finish_reason: tool_calls
    golden:
      calls:
      - name: get_weather
        arguments:
          location: NYC
      - name: get_weather
        arguments:
          location: LA
      normal_text: ''
    now:
      calls:
      - name: get_weather
        arguments:
          location: NYC
      - name: get_weather
        arguments:
          location: LA
      normal_text: ''
