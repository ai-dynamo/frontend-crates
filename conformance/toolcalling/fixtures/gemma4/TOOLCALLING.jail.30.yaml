# v1 jail golden/after fixture (generated by build_jail_fixtures.py).
# chunks = stream input; golden = jail output before #10570; now = after #10570.
# The tab is green when now == golden, red otherwise. Do not edit by hand.

family: gemma4
model_label: Gemma 4
mode: jail
cases:
  TOOLCALLING.jail.30.a:
    description: Call/body delimiters `,`, `:`, and `{}` inside one argument string
      value
    ref: derived from TOOLCALLING.batch.30.a
    chunks:
    - delta_text: <|tool_call>call:run_query{sql:<|"|>
    - delta_text: SELECT
    - delta_text: ' a,b:and{brace}<|"|>}<tool_call|>'
    - delta_text: ''
      finish_reason: tool_calls
    golden:
      calls:
      - name: run_query
        arguments:
          sql: SELECT a,b:and{brace}
      normal_text: ''
    now:
      calls:
      - name: run_query
        arguments:
          sql: SELECT a,b:and{brace}
      normal_text: ''
  TOOLCALLING.jail.30.b:
    description: Structural delimiters `}` and `]` inside one argument string value
    ref: derived from TOOLCALLING.batch.30.b
    chunks:
    - delta_text: <|tool_call>call:run_query{sql:<|"|>
    - delta_text: SELECT
    - delta_text: ' value WHERE note'
    - delta_text: ' has brace'
    - delta_text: ' }'
    - delta_text: ' and bracket'
    - delta_text: ' ]<|"|>}<tool_call|>'
    - delta_text: ''
      finish_reason: tool_calls
    golden:
      calls:
      - name: run_query
        arguments:
          sql: SELECT value WHERE note has brace } and bracket ]
      normal_text: ''
    now:
      calls:
      - name: run_query
        arguments:
          sql: SELECT value WHERE note has brace } and bracket ]
      normal_text: ''
  TOOLCALLING.jail.30.c:
    description: Tool-call marker `<|tool_call>` text inside one argument string value
    ref: derived from TOOLCALLING.batch.30.c
    chunks:
    - delta_text: <|tool_call>call:run_query{sql:<|"|>
    - delta_text: literal
    - delta_text: ' <|tool_call marker> call:get_time{}'
    - delta_text: ' stays text<|"|>'
    - delta_text: '}<tool_call|>'
    - delta_text: ''
      finish_reason: tool_calls
    golden:
      calls:
      - name: run_query
        arguments:
          sql: literal <|tool_call marker> call:get_time{} stays text
      normal_text: ''
    now:
      calls:
      - name: run_query
        arguments:
          sql: literal <|tool_call marker> call:get_time{} stays text
      normal_text: ''
