# v1 jail golden/after fixture (generated by build_jail_fixtures.py).
# chunks = stream input; golden = jail output before #10570; now = after #10570.
# The tab is green when now == golden, red otherwise. Do not edit by hand.

family: gemma4
model_label: Gemma 4
mode: jail
cases:
  TOOLCALLING.jail.10:
    description: Duplicate calls (same name twice)
    ref: derived from TOOLCALLING.batch.10
    chunks:
    - delta_text: <|tool_call>call:get_weather{location:<|"|>
    - delta_text: NYC<|"|>
    - delta_text: '}<tool_call|><|tool_call>call:get_weather{location:<|"|>'
    - delta_text: LA<|"|>}<tool_call|>
    - delta_text: ''
      finish_reason: tool_calls
    golden:
      calls:
      - name: get_weather
        arguments:
          location: NYC
      - name: get_weather
        arguments:
          location: LA
      normal_text: ''
    now:
      calls:
      - name: get_weather
        arguments:
          location: NYC
      - name: get_weather
        arguments:
          location: LA
      normal_text: ''
