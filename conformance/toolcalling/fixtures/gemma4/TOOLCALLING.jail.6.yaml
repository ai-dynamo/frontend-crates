# v1 jail golden/after fixture (generated by build_jail_fixtures.py).
# chunks = stream input; golden = jail output before #10570; now = after #10570.
# The tab is green when now == golden, red otherwise. Do not edit by hand.

family: gemma4
model_label: Gemma 4
mode: jail
cases:
  TOOLCALLING.jail.6.a:
    description: Canonical empty {} body
    ref: derived from TOOLCALLING.batch.6.a
    chunks:
    - delta_text: <|tool_call>call:get_time{}<tool_call|>
    - delta_text: ''
      finish_reason: tool_calls
    golden:
      calls:
      - name: get_time
        arguments: {}
      normal_text: ''
    now:
      calls:
      - name: get_time
        arguments: {}
      normal_text: ''
  TOOLCALLING.jail.6.b:
    description: Whitespace inside empty {}
    ref: derived from TOOLCALLING.batch.6.b
    chunks:
    - delta_text: <|tool_call>call:get_time{
    - delta_text: ' }<tool_call|>'
    - delta_text: ''
      finish_reason: tool_calls
    golden:
      calls:
      - name: get_time
        arguments: {}
      normal_text: ''
    now:
      calls:
      - name: get_time
        arguments: {}
      normal_text: ''
  TOOLCALLING.jail.6.c:
    description: No body (just call:name)
    ref: derived from TOOLCALLING.batch.6.c
    chunks:
    - delta_text: <|tool_call>call:get_time<tool_call|>
    - delta_text: ''
      finish_reason: stop
    golden:
      calls: []
      normal_text: ''
    now:
      calls: []
      normal_text: ''
