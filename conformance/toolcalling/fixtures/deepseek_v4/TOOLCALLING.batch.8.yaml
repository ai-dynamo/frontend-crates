family: deepseek_v4
mode: batch
cases:
  TOOLCALLING.batch.8.a:
    description: Narration before tool call only
    ref: dynamo
    model_text: |-
      I will check the weather. <｜DSML｜tool_calls>
      <｜DSML｜invoke name="get_weather">
      <｜DSML｜parameter name="location" string="true">NYC</｜DSML｜parameter>
      </｜DSML｜invoke>
      </｜DSML｜tool_calls>
    tools:
    - &id002
      name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    expected:
      dynamo: &id001
        calls:
        - name: get_weather
          arguments:
            location: NYC
        normal_text: 'I will check the weather. '
      vllm: *id001
      sglang:
        unavailable: SGLang has no detector for family='deepseek_v4'
  TOOLCALLING.batch.8.b:
    description: Narration after tool call only
    dynamo_note: 'DeepSeek-V4 publishes a reference decoder (encoding/encoding_dsv4.py::parse_message_from_completion_text) that establishes the tool-call block is terminal: content is only the text before the block, and it executes `assert not tool_ends_text, "Unexpected content after tool calls"`. Dynamo takes that normative "should not" at face value and drops text from the first tool-call marker onward. (Contrast V3/V3.1/V3.2, whose specs are silent and where Dynamo preserves trailing text.) Source: https://huggingface.co/deepseek-ai/DeepSeek-V4-Pro/raw/main/encoding/encoding_dsv4.py'
    ref: dynamo
    model_text: |-
      <｜DSML｜tool_calls>
      <｜DSML｜invoke name="get_weather">
      <｜DSML｜parameter name="location" string="true">NYC</｜DSML｜parameter>
      </｜DSML｜invoke>
      </｜DSML｜tool_calls> Let me know if you need more.
    tools:
    - *id002
    expected:
      dynamo:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        normal_text: ''
      vllm:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        normal_text: ''
        reason: vLLM drops trailing normal_text after the tool-call wrapper end
      sglang:
        unavailable: SGLang has no detector for family='deepseek_v4'
  TOOLCALLING.batch.8.c:
    description: Narration both before and after (sandwich)
    dynamo_note: 'DeepSeek-V4 publishes a reference decoder (encoding/encoding_dsv4.py::parse_message_from_completion_text) that establishes the tool-call block is terminal: content is only the text before the block, and it executes `assert not tool_ends_text, "Unexpected content after tool calls"`. Dynamo takes that normative "should not" at face value and drops text from the first tool-call marker onward. (Contrast V3/V3.1/V3.2, whose specs are silent and where Dynamo preserves trailing text.) Source: https://huggingface.co/deepseek-ai/DeepSeek-V4-Pro/raw/main/encoding/encoding_dsv4.py'
    ref: dynamo
    model_text: |-
      I will check the weather. <｜DSML｜tool_calls>
      <｜DSML｜invoke name="get_weather">
      <｜DSML｜parameter name="location" string="true">NYC</｜DSML｜parameter>
      </｜DSML｜invoke>
      </｜DSML｜tool_calls> Let me know if you need more.
    tools:
    - *id002
    expected:
      dynamo:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        normal_text: 'I will check the weather. '
      vllm:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        normal_text: 'I will check the weather. '
        reason: vLLM drops trailing normal_text after the tool-call wrapper end
      sglang:
        unavailable: SGLang has no detector for family='deepseek_v4'
  TOOLCALLING.batch.8.d:
    description: Narration between multiple tool calls
    dynamo_note: 'DeepSeek-V4 publishes a reference decoder (encoding/encoding_dsv4.py::parse_message_from_completion_text) that establishes the tool-call block is terminal: content is only the text before the block, and it executes `assert not tool_ends_text, "Unexpected content after tool calls"`. Dynamo takes that normative "should not" at face value and drops text from the first tool-call marker onward. (Contrast V3/V3.1/V3.2, whose specs are silent and where Dynamo preserves trailing text.) Source: https://huggingface.co/deepseek-ai/DeepSeek-V4-Pro/raw/main/encoding/encoding_dsv4.py'
    ref: dynamo
    model_text: |-
      I will check the weather. <｜DSML｜tool_calls>
      <｜DSML｜invoke name="get_weather">
      <｜DSML｜parameter name="location" string="true">NYC</｜DSML｜parameter>
      </｜DSML｜invoke>
      </｜DSML｜tool_calls> Then check LA weather. <｜DSML｜tool_calls>
      <｜DSML｜invoke name="get_weather">
      <｜DSML｜parameter name="location" string="true">LA</｜DSML｜parameter>
      </｜DSML｜invoke>
      </｜DSML｜tool_calls>
    tools:
    - *id002
    expected:
      dynamo:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        - name: get_weather
          arguments:
            location: LA
        normal_text: 'I will check the weather. '
      vllm:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        - name: get_weather
          arguments:
            location: LA
        normal_text: 'I will check the weather. '
        reason: vLLM keeps only the prefix and drops the inter-call narration between the two wrappers
      sglang:
        unavailable: SGLang has no detector for family='deepseek_v4'
