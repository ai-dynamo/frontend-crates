#
# Hand-maintained explanations for KNOWN divergences between the two Dynamo
# stream-tab candidates (v2 stream parser vs the v1 jail+batch reference).
#
# Applied at RENDER time (generate_conformance_table reads this via
# FRONTEND_CRATES_ROOT), never written into the recorded capture YAMLs — so the
# notes survive every `refresh_dynamo_captures.py` / `capture_dynamo_jail_stream.py`
# re-record. The popup shows the note as a muted `explanation:` annotation on
# that candidate's column, and the cell loses its `?` research-needed suffix.
#
# Do NOT add entries for UN-TRIAGED defects: a divergence without an
# explanation renders `?` (research needed), which is the correct signal.
# Example of a deliberate omission: gemma4 TOOLCALLING.streamv2.5.g, where the
# v1 jail corrupts the recovered prose ("I will checkthat.") — that is a jail
# bug still under investigation, not a behavior to document away.
#
# A TRIAGED v1 defect is different: v1 is frozen and slated for deletion (v2 is
# the independent replacement, see the "v1-v2-independent-no-shared-code" rule),
# so a known-wrong v1 output that will NOT be fixed gets a `jail:` note that
# STARTS with "FIXME (v1 defect, wontfix — v1 is being removed):". It documents
# WHY the reference is wrong and that v2 is the correct side, instead of leaving
# a bare `?` that reads as "nobody looked yet". Keep the FIXME prefix so the note
# reads as a known bug, not sanctioned behavior.
#
# The same defect across families = ONE note: anchor the first occurrence
# (&name) and alias (*name) the rest, so the wording has a single source.
#
# Schema: family -> case id -> candidate generation -> note.
#   v2   = the Dynamo v2 stream parser (dynamo_v2-* dirs)
#   jail = the Dynamo v1 jail+batch reference (dynamo_v1-* dirs)

# case 7 is the typed-argument test: the v1 XML path emits every parameter
# value as a raw string and never applies the tool's JSON-Schema types; v2
# reads the declared type and coerces correctly.

glm47:
  TOOLCALLING.streamv2.7.a:
    jail: &jail-stringifies-scalars >-
      FIXME (v1 defect, wontfix — v1 is being removed): the jail emits
      passengers="2" and first_class="true" as STRINGS. The book_flight schema
      declares passengers:integer and first_class:boolean, so the correct
      arguments are the number 2 and boolean true (what v2 emits). The v1 XML
      path never applies the schema types; a strict tool endpoint rejects the
      quoted values.
  TOOLCALLING.streamv2.7.f:
    jail: &jail-stringifies-bigint >-
      FIXME (v1 defect, wontfix — v1 is being removed): the jail emits count as
      the STRING "9007199254740993" instead of the integer 9007199254740993 the
      schema declares — number -> string is plain wrong. It is a large integer
      (> 2^53), and v2 preserves it EXACTLY as a JSON number (lossless raw-number
      handling); a number-typed param must be a JSON number, never a quoted
      string.

minimax_m2:
  TOOLCALLING.streamv2.7.a:
    jail: *jail-stringifies-scalars
  TOOLCALLING.streamv2.7.f:
    jail: *jail-stringifies-bigint

minimax_m3:
  TOOLCALLING.streamv2.7.a:
    jail: *jail-stringifies-scalars
  TOOLCALLING.streamv2.7.d:
    jail: >-
      FIXME (v1 defect, wontfix — v1 is being removed): same type-fidelity bug
      on NESTED values — the jail emits items as ["1","2","3"] and
      config.nested as "true" (strings), where the schema types are an integer
      array and a boolean. v2 emits [1,2,3] and true. The v1 XML path stringifies
      every leaf value instead of applying the declared types.
  TOOLCALLING.streamv2.7.e:
    jail: >-
      FIXME (v1 defect, wontfix — v1 is being removed): same type-fidelity bug on
      deeply-nested values (scores arrays, enabled/retry flags): the jail
      stringifies every leaf ("true", "1"...) instead of applying the schema
      types v2 emits as numbers/booleans/null.
  TOOLCALLING.streamv2.7.f:
    jail: *jail-stringifies-bigint

qwen3_coder:
  TOOLCALLING.streamv2.5.e:
    v2: >-
      Both trailing spaces are model text: one ends the prose before the first
      block, one separates "</tool_call>" from the truncated second
      "<tool_call>". The stream parser emitted the inter-block space the moment
      the first block closed and cannot retroactively unsend it when the next
      block turns out truncated; the jail sees the whole tail before emitting
      and swallows that space with the dropped block.
  TOOLCALLING.streamv2.7.a:
    jail: *jail-stringifies-scalars
  TOOLCALLING.streamv2.7.f:
    jail: *jail-stringifies-bigint
