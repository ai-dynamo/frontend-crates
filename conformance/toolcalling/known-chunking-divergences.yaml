#
# KNOWN chunking divergences: cases where the v2 streaming parser's assembled
# output depends on where the input stream is split. Consumed ONLY by
# conformance/tests/sweep_toolcalling_stream.rs, which requires the parser to
# produce the single-shot result at EVERY chunking.
#
# Policy (same as known-divergences.yaml):
# - An entry needs a note explaining WHICH side is wrong and why; empty notes
#   fail the suite.
# - The list is strict both ways: an undocumented diverging case fails, and a
#   documented case that stops diverging fails as STALE (delete the entry with
#   the fix that earns it).
# - These are all FIXME entries by definition — chunking-dependent output is a
#   bug, never sanctioned behavior. Notes name the defective side and the
#   planned fix.
#
# Schema: family -> case id -> note.

# Empty on purpose — an explicit `{}` because the loader deserializes this file into a
# map and a comments-only document reads as null.
#
# The last entry (glm47 TOOLCALLING.streamv2.5.h) was deleted when the streamv2 inputs
# were normalized across families. It documented a real single-shot bug: on
# `I will check that. </tool_call> ok` the single-shot parse read the prose word `that.`
# as a bare function name attached to the orphan `</tool_call>`. The normalized input no
# longer ends in trailing prose after an orphan close, so nothing exercises that path and
# the sweep now (correctly) reports the entry as STALE. The parser was not fixed — if
# that recovery path is tightened later, add a case that reproduces it rather than
# relying on this one.
{}
