  TOOLCALLING.batch.7.s.ref_union_anyOf_integer:
    stream_vs_batch: &svb-constrained-integer >-
      FIXME (v1 defect): v1 misses the integer constraint through references, intersections, or a nullable type array and returns a string. v2 returns the integer required by the original schema.
  TOOLCALLING.batch.7.s.ref_union_oneOf_integer:
    stream_vs_batch: *svb-constrained-integer
  TOOLCALLING.batch.7.t.intersection_anyOf:
    stream_vs_batch: *svb-constrained-integer
  TOOLCALLING.batch.7.t.intersection_oneOf:
