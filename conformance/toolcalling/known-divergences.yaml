    v2: >-
      Both trailing spaces are model text: one ends the prose before the first
      block, one separates "</tool_call>" from the truncated second
      "<tool_call>". The stream parser emitted the inter-block space the moment
      the first block closed and cannot retroactively unsend it when the next
      block turns out truncated; the jail sees the whole tail before emitting
      and swallows that space with the dropped block.
  TOOLCALLING.streamv2.7.a:
    jail: *jail-stringifies-scalars
  TOOLCALLING.streamv2.7.f:
    jail: *jail-stringifies-bigint
