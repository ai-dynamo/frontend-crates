  TOOLCALLING.batch.7.v.type_array_string_integer:
    stream_vs_batch: &svb-string-integer-ambiguity >-
      The type array permits either string "42" or integer 42. v1 prefers the string and v2 prefers the integer; both satisfy the original schema. The independent family golden retains its explicitly authored interpretation.

