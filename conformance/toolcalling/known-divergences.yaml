  TOOLCALLING.batch.8.c:
    stream_vs_batch: *svb-surrounding-text
  TOOLCALLING.batch.8.d:
    stream_vs_batch: *svb-surrounding-text
  TOOLCALLING.batch.13:
    stream_vs_batch: *svb-surrounding-text
  TOOLCALLING.streamv2.7.a:
    jail: &jail-stringifies-scalars >-
      FIXME (v1 defect, wontfix — v1 is being removed): the jail emits
      passengers="2" and first_class="true" as STRINGS. The book_flight schema
      declares passengers:integer and first_class:boolean, so the correct
      arguments are the number 2 and boolean true (what v2 emits). The v1 XML
      path never applies the schema types; a strict tool endpoint rejects the
      quoted values.
  TOOLCALLING.streamv2.7.f:
    jail: &jail-stringifies-bigint >-
      FIXME (v1 defect, wontfix — v1 is being removed): the jail emits count as
      the STRING "9007199254740993" instead of the integer 9007199254740993 the
      schema declares — number -> string is plain wrong. It is a large integer
      (> 2^53), and v2 preserves it EXACTLY as a JSON number (lossless raw-number
      handling); a number-typed param must be a JSON number, never a quoted
      string.

harmony:
  TOOLCALLING.batch.3:
    stream_vs_batch: >-
      Bare-prose answer with no Harmony framing: v2 passes the user's whole
      answer through (dropping it was the whole-answer text-loss class); v1 batch
      returns "". Intended — text loss is the worse failure.
  TOOLCALLING.batch.8.a:
    stream_vs_batch: *svb-surrounding-text
  TOOLCALLING.batch.8.b:
    stream_vs_batch: *svb-surrounding-text
  TOOLCALLING.batch.8.d:
    stream_vs_batch: *svb-surrounding-text
  TOOLCALLING.batch.9.b:
    stream_vs_batch: >-
      Whitespace-only input: v2 passes the bare whitespace through as
      normal_text; v1 batch returns "". Intended.

