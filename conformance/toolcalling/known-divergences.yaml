#
# Hand-maintained notes for KNOWN divergences between Dynamo parser generations
# (v1 = dynamo-parsers batch+jail, frozen and slated for removal; v2 =
# dynamo-parsers-v2 streaming, the ultimate implementation).
#
# Applied at RENDER time (generate_conformance_table reads this via
# FRONTEND_CRATES_ROOT), never written into the recorded capture YAMLs — so the
# notes survive every capture re-record. The popup shows each note as a muted
# `explanation:` annotation on that candidate's column, and the cell loses its
# `?` research-needed suffix.
#
# Do NOT add entries for UN-TRIAGED defects: a divergence without an
# explanation renders `?` (research needed), which is the correct signal.
# Example of a deliberate omission: gemma4 TOOLCALLING.streamv1.5.g, where the
# v1 jail corrupts the recovered prose ("I will checkthat.") — that is a jail
# bug still under investigation, not a behavior to document away.
#
# A TRIAGED v1 defect is different: v1 is frozen and slated for deletion (v2 is
# the independent replacement, see the "v1-v2-independent-no-shared-code" rule),
# so a known-wrong v1 output that will NOT be fixed gets a `jail:` note that
# STARTS with "FIXME (v1 defect, wontfix — v1 is being removed):". It documents
# WHY the reference is wrong and that v2 is the correct side, instead of leaving
# a bare `?` that reads as "nobody looked yet". Keep the FIXME prefix so the note
# reads as a known bug, not sanctioned behavior.
#
# The same defect across families = ONE note: anchor the first occurrence
# (&name) and alias (*name) the rest, so the wording has a single source.
#
# Schema: family -> case id -> key -> note. Keys:
#   v2   = stream-tab note on the Dynamo v2 stream candidate (dynamo_v2-* dirs)
#   jail = stream-tab note on the Dynamo v1 jail+batch reference (dynamo_v1-* dirs)
#   stream_vs_batch = KNOWN v1-batch vs v2-stream divergence on a TOOLCALLING.batch.*
#        case. Consumed by BOTH:
#          - conformance/tests/conformance_toolcalling_batch_via_stream.rs — the entries
#            document legitimate parity differences. Live v2 must also match its
#            pinned capture exactly; missing, changed, stale or unvisited entries fail.
#          - the batch-on-stream tab — the cell gets a muted `≠` known-divergence
#            suffix and the v2 candidate's popup block carries the note.
#   baseline_defect = FIXME-labeled pre-existing v2 defect, shown as a diagnostic
#        without the intended-difference badge. baseline_defect_actual pins its
#        exact JSON result independently of recaptured expectations. This follows
#        unified-known-divergences.yaml: defects stay visible while changed output
#        or stale entries fail CI. Authored GOLDEN values are never rewritten.

# case 7 is the typed-argument test: the v1 XML path emits every parameter
# value as a raw string and never applies the tool's JSON-Schema types; v2
# reads the declared type and coerces correctly.

deepseek_v4:
  TOOLCALLING.batch.2.b:
    stream_vs_batch: &svb-surrounding-text >-
      v2 (stream) preserves the model's prose AROUND tool calls verbatim —
      before the first call, between calls, and after the last — where the v1
      batch parser drops or truncates it. Calls identical; normal_text-only
      divergence, intended.
  TOOLCALLING.batch.2.c:
    stream_vs_batch: *svb-surrounding-text
  TOOLCALLING.batch.5.f:
    stream_vs_batch: &svb-recovery >-
      Bare-call recovery: v2 recovers the un-wrapped invoke and keeps the
      separator/prefix text; the strict v1 batch path drops the call or trims
      the text. Intended.
  TOOLCALLING.batch.5.g:
    stream_vs_batch: *svb-recovery
  TOOLCALLING.batch.8.b:
    stream_vs_batch: *svb-surrounding-text
  TOOLCALLING.batch.8.c:
    stream_vs_batch: *svb-surrounding-text
  TOOLCALLING.batch.8.d:
    stream_vs_batch: *svb-surrounding-text
  TOOLCALLING.batch.9.b:
    stream_vs_batch: &svb-whitespace-only >-
      Whitespace-only input: v2 passes the bare whitespace through as
      normal_text; v1 batch returns "". Intended.

  TOOLCALLING.batch.11.b:
    baseline_defect: >-
      FIXME (v2 defect): the DS4 native header parser accepts an empty tool
      name and emits {name: "", arguments: {value: 1}}; v1 correctly drops
      this invocation. This exact PR-head observation is preserved to assess
      the scoped GLM change; it remains a parser defect, not intended behavior.
    baseline_defect_actual: >-
      {"calls":[{"name":"","arguments":{"value":1}}],"normal_text":""}
  TOOLCALLING.batch.30.c:
    stream_vs_batch: &svb-literal-markers >-
      FIXME (v1 defect): v1 mistakes native call/channel markers inside a string argument for structural delimiters and loses argument data or the call. v2 keeps those bytes inside the value and also preserves subsequent calls.
  TOOLCALLING.batch.31.a:
    stream_vs_batch: *svb-literal-markers
  TOOLCALLING.batch.7.p.const_space_allof:
    stream_vs_batch: &svb-literal-whitespace >-
      FIXME (v1 defect): v1 trims the string constant from "  spaced  " to "spaced". v2 preserves its whitespace and satisfies the original const schema.
  TOOLCALLING.batch.7.p.const_space_bare:
    stream_vs_batch: *svb-literal-whitespace
  TOOLCALLING.batch.7.p.const_space_ref:
    stream_vs_batch: *svb-literal-whitespace
  TOOLCALLING.batch.7.p.const_space_typed:
    stream_vs_batch: *svb-literal-whitespace

