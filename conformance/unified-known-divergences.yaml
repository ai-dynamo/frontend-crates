#
# Expected Unified parser mismatches captured by the conformance corpus. Each
# entry pins the exact output pair so another failure in the same case still
# fails CI. Entries that stop diverging fail as stale and must be removed.
# Schema: family -> case ID -> check -> note and exact observed output.

beam:
  # TODO: Beam's typing resolves `$ref`/`allOf`/type arrays but not `not` or
  # `if`/`then`/`else` (ai-dynamo/dynamo#17662 fixed these for the XML parsers only).
  UNIFIED.not_keyword_type_complement.beam:
    golden:
      note: 'FIXME (v2 defect): Beam typing ignores `not`; the negated-string integer stays the string "-2500".'
      actual: 'tool_call capture_payload {"count": "-2500", "text": "42"}'
  UNIFIED.conditional_schema_number_types.beam:
    golden:
      note: 'FIXME (v2 defect): Beam typing ignores `if`/`then`/`else`; both numbers stay strings.'
      actual: 'tool_call capture_payload {"amount": "21.5", "retries": "37"}'
gpt_oss: {}
kimi_k3: {}
muse_glimmer: {}
gemma4: {}
deepseek_v41:
  UNIFIED.5-dsml_unterminated_parameter_then_call:
    golden:
      note: 'FIXME (v2 defect): an unterminated parameter consumes the later invoke instead of preserving the complete trailing call.'
      actual: tool_call f {"x":"bad</｜DSML｜ invoke><｜DSML｜ invoke name=\"get_weather\"><｜DSML｜ parameter name=\"city\" string=\"true\">Paris"}

