#
# Expected Unified parser mismatches captured by the conformance corpus. Each
# entry pins the exact output pair so another failure in the same case still
# fails CI. Entries that stop diverging fail as stale and must be removed.
# Schema: family -> case ID -> check -> note and exact observed output.

kimi_k3:
  UNIFIED.gpt_oss_quoted_truncated_tool_then_final.kimi_k3:
    golden:
      note: 'Preexisting Kimi K3 recovery gap: an unterminated raw JSON string causes EOF recovery to discard the later complete response message.'
      actual: ''

muse_glimmer:
  UNIFIED.muse_unterminated_parameter_then_empty_call.muse_glimmer:
    golden:
      note: 'PR #316 follow-up: EOF drops the entire tool channel when the first invoke has an unclosed parameter, losing the later complete parameterless call.'
      actual: ''
  UNIFIED.muse_unterminated_parameter_then_call.muse_glimmer:
    golden:
      note: 'PR #316 follow-up: the later parameter closer completes the earlier malformed parameter, dispatching f with embedded invoke markup instead of get_weather.'
      actual: tool_call(f, {"x":"bad</atem:invoke><atem:invoke name=\"get_weather\"><atem:parameter name=\"city\">Paris"})

deepseek_v4:
  UNIFIED.5-dsml_unterminated_parameter_then_call:
    golden:
      note: The later parameter closer completes the malformed first invoke, emitting f with embedded DSML instead of get_weather.
      actual: tool_call(f, {"x":"bad</｜DSML｜invoke><｜DSML｜invoke name=\"get_weather\"><｜DSML｜parameter name=\"city\" string=\"true\">Paris"})
    tool_adapter:
      note: The shared V4/V4.1 tool adapter dispatches the malformed first invoke instead of the valid later call.
      actual: tool_call(f, {"x":"bad</｜DSML｜invoke><｜DSML｜invoke name=\"get_weather\"><｜DSML｜parameter name=\"city\" string=\"true\">Paris"})
  UNIFIED.5-dsml_unterminated_parameter_then_empty_call:
    golden:
      note: The unterminated parameter loses the later parameterless call; V4 emits the malformed get_weather invoke.
      actual: tool_call(get_weather, {})
    tool_adapter:
      note: The shared V4/V4.1 tool adapter dispatches the malformed first invoke instead of the valid later call.
      actual: tool_call(get_weather, {})
deepseek_v41:
  UNIFIED.5-dsml_unterminated_parameter_then_call:
    golden:
      note: The later parameter closer completes the malformed first invoke, emitting f with embedded DSML instead of get_weather.
      actual: tool_call(f, {"x":"bad</｜DSML｜ invoke><｜DSML｜ invoke name=\"get_weather\"><｜DSML｜ parameter name=\"city\" string=\"true\">Paris"})
    tool_adapter:
      note: The shared V4/V4.1 tool adapter dispatches the malformed first invoke instead of the valid later call.
      actual: tool_call(f, {"x":"bad</｜DSML｜ invoke><｜DSML｜ invoke name=\"get_weather\"><｜DSML｜ parameter name=\"city\" string=\"true\">Paris"})
  UNIFIED.5-dsml_unterminated_parameter_then_empty_call:
    golden:
      note: The unterminated parameter loses the later parameterless call; V4.1 errors at finish.
      actual: 'ERROR: native finish: incomplete DeepSeek V4.1 parameter'
    stream_batch:
      note: parse_complete reports the incomplete parameter through native push; streaming reports it at finish.
      batch: 'ERROR: native push: incomplete DeepSeek V4.1 parameter'
      stream: 'ERROR: native finish: incomplete DeepSeek V4.1 parameter'
    tool_adapter:
      note: The shared V4/V4.1 tool adapter returns an incomplete-parameter error at finish and loses the later parameterless call.
      actual: 'ERROR: native finish: incomplete DeepSeek V4.1 parameter'
