#
# Expected Unified parser mismatches captured by the conformance corpus. Each
# entry pins the exact output pair so another failure in the same case still
# fails CI. Entries that stop diverging fail as stale and must be removed.
# Schema: family -> case ID -> check -> note and exact observed output.

deepseek_v41:
  UNIFIED.gpt_oss-invalid_tool_body_then_empty_call:
    golden:
      note: 'An invalid raw invocation body aborts parsing before the following complete empty call.'
      actual: 'ERROR: native push: invalid DeepSeek V4.1 parameter header'

kimi_k3:
  UNIFIED.gpt_oss-truncated_tool_resynchronizes_at_next_message:
    golden:
      note: 'An unclosed tool call swallows the following response instead of resynchronizing at its header.'
      actual: ''
  UNIFIED.gpt_oss_quoted_truncated_tool_then_final.kimi_k3:
    golden:
      note: 'Preexisting Kimi K3 recovery gap: an unterminated raw JSON string causes EOF recovery to discard the later complete response message.'
      actual: ''

muse_glimmer:
  UNIFIED.muse_unterminated_parameter_then_empty_call.muse_glimmer:
    golden:
      note: 'PR #316 follow-up: EOF drops the entire tool channel when the first invoke has an unclosed parameter, losing the later complete parameterless call.'
      actual: ''
  UNIFIED.muse_unterminated_parameter_then_call.muse_glimmer:
    golden:
      note: 'PR #316 follow-up: the later parameter closer completes the earlier malformed parameter, dispatching f with embedded invoke markup instead of get_weather.'
      actual: tool_call(f, {"x":"bad</atem:invoke><atem:invoke name=\"get_weather\"><atem:parameter name=\"city\">Paris"})
