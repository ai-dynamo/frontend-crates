hy_v4:
  # TODO: Hy4 delimits each invoke at the first `</tool_call:opensource>`; GLM's
  # value-aware invoke boundary is not wired into the Hy4 scanner.
  UNIFIED.arg_marker_in_string.hy_v4:
    golden:
      note: 'FIXME (v2 defect): a literal `</tool_call:opensource>` inside the argument value ends the Hy4 invoke, truncating the value.'
      actual: 'tool_call run {"cmd":"git log "}'
  UNIFIED.deepseek_v41_mixed_control_text_in_string.hy_v4:
    golden:
      note: 'FIXME (v2 defect): a literal `</tool_call:opensource>` inside the argument value ends the Hy4 invoke, truncating the value.'
      actual: 'tool_call f {"x":" <think:opensource>quoted</think:opensource> <tool_calls:opensource> </tool_calls:opensource> "}'
  UNIFIED.glm47_parameterless_call_shape_inside_argument.hy_v4:
    golden:
      note: 'FIXME (v2 defect): the embedded `</tool_call:opensource><tool_call:opensource>get_weather` ends the Hy4 invoke and dispatches a second call.'
      actual: 'tool_call run {"cmd":"before "} | tool_call get_weather {}'
  UNIFIED.missing_inner_closers_then_valid_call.hy_v4:
    golden:
      note: 'FIXME (v2 defect): the unterminated value runs through the block close into the next block instead of rejecting the incomplete invoke.'
      actual: 'tool_call get_weather {"location":"unfinished</tool_calls:opensource><tool_calls:opensource><tool_call:opensource>get_weather<arg_key:opensource>location</arg_key:opensource><arg_value:opensource>Paris"}'
  # TODO: Hy4 shares the GLM typer, which resolves `$ref`/`allOf`/unions but not
  # `not` or `if`/`then`/`else` (see the glm47 entries).
  UNIFIED.not_keyword_type_complement.hy_v4:
    golden:
      note: 'FIXME (v2 defect): GLM typing ignores `not`; the negated-string integer stays the string "-2500".'
      actual: 'tool_call capture_payload {"count":"-2500","text":"42"}'
  UNIFIED.conditional_schema_number_types.hy_v4:
    golden:
      note: 'FIXME (v2 defect): GLM typing ignores `if`/`then`/`else`; both numbers stay strings.'
      actual: 'tool_call capture_payload {"amount":"21.5","retries":"37"}'
  # TODO: the Hy4 guided reader strips only the block and invoke openers of a native
  # invoke; its name and argument tags are not suppressed as one control span.
  UNIFIED.guided_json_native_markup_only.hy_v4:
    golden:
      note: 'FIXME (v2 defect): under JSON guidance the native invoke body leaks as visible text.'
      actual: 'text "get_weather<arg_key:opensource>city</arg_key:opensource><arg_value:opensource>Paris</arg_value:opensource></tool_call:opensource>"'
  UNIFIED.guided_json_gt_in_argument_named_bare_opener.hy_v4:
    golden:
      note: 'FIXME (v2 defect): a bare `<tool_call:opensource>NAME` opener before the guided payload is not consumed as the named-call prefix, so the payload stays text.'
      actual: 'text "get_weather[{\"name\": \"get_weather\", \"arguments\": {\"city\": \"a > b\"}}]"'
  UNIFIED.guided_json_native_parameter_array_before_payload.hy_v4:
    golden:
      note: 'FIXME (v2 defect): a native invoke before the guided payload leaks its tags as text and its JSON-looking value dispatches a call.'
      actual: 'text "I mean <think:opensource>self literal</think:opensource>f<arg_key:opensource>x</arg_key:opensource><arg_value:opensource>" | tool_call get_weather {"city":"Rome"} | text "</arg_value:opensource>[{\"name\": \"get_weather\", \"arguments\": {\"city\": \"Paris\"}}]"'
  UNIFIED.guided_json_native_parameter_object_before_payload.hy_v4:
    golden:
      note: 'FIXME (v2 defect): a native invoke before the guided payload leaks its tags and value as text.'
      actual: 'text "I mean <think:opensource>self literal</think:opensource>f<arg_key:opensource>x</arg_key:opensource><arg_value:opensource>{\"city\":\"Rome\"}</arg_value:opensource></tool_call:opensource>" | tool_call get_weather {"city":"Paris"}'
  UNIFIED.guided_json_native_parameter_string_before_payload.hy_v4:
    golden:
      note: 'FIXME (v2 defect): a native invoke before the guided payload leaks its tags as text and its JSON-looking value dispatches a call.'
      actual: 'text "I mean <think:opensource>self literal</think:opensource>f<arg_key:opensource>x</arg_key:opensource><arg_value:opensource>" | tool_call get_weather {"city":"Rome"} | text "</arg_value:opensource>[{\"name\": \"get_weather\", \"arguments\": {\"city\": \"Paris\"}}]"'
  UNIFIED.guided_json_noncall_before_native_array_before_payload.hy_v4:
    golden:
      note: 'FIXME (v2 defect): a native invoke before the guided payload leaks its tags as text and its JSON-looking value dispatches a call.'
      actual: 'text "{}I mean <think:opensource>self literal</think:opensource>f<arg_key:opensource>x</arg_key:opensource><arg_value:opensource>" | tool_call get_weather {"city":"Rome"} | text "</arg_value:opensource>[{\"name\": \"get_weather\", \"arguments\": {\"city\": \"Paris\"}}]"'
  UNIFIED.guided_json_native_parameter_body_inside_reasoning.hy_v4:
    golden:
      note: 'FIXME (v2 defect): a native invoke inside guided reasoning keeps its name and argument tags in the reasoning text.'
      actual: 'reasoning "before f<arg_key:opensource>x</arg_key:opensource><arg_value:opensource>é🙂<par{value}</arg_value:opensource></tool_call:opensource> after" | tool_call get_weather {"city":"Paris"}'
  UNIFIED.guided_json_reasoning_markers_inside_native_parameter.hy_v4:
    golden:
      note: 'FIXME (v2 defect): a reasoning closer quoted in a native argument inside guided reasoning ends the thought and leaks the invoke tags.'
      actual: 'reasoning "before f<arg_key:opensource>x</arg_key:opensource><arg_value:opensource>quoted" | text "</arg_value:opensource></tool_call:opensource> after" | tool_call get_weather {"city":"Paris"}'
  UNIFIED.guided_response_native_wrapper_whitespace_before_prose.hy_v4:
    golden:
      note: 'FIXME (v2 defect): a native invoke before guided prose leaks its name, tags and value as text.'
      actual: 'text "f<arg_key:opensource>x</arg_key:opensource><arg_value:opensource>{\"city\":\"Rome\"}</arg_value:opensource></tool_call:opensource>ok then " | tool_call get_weather {"city":"Paris"}'
