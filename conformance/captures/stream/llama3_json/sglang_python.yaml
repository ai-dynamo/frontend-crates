        - delta_text: ' "run_query",'
          expected:
            sglang_python:
            - index: 0
              name: run_query
        - delta_text: ' "arguments": {"sql": "SELECT'
          expected:
            sglang_python: []
        - delta_text: ' a; SELECT'
          expected:
            sglang_python:
            - index: 0
              arguments: '{"sql": "SELECT'
        - delta_text: ' b"}};{"name":'
          expected:
            sglang_python:
            - index: 0
              arguments: ' a; SELECT b"}'
        - delta_text: ' "get_time", "arguments":'
          expected:
            sglang_python:
            - index: 1
              name: get_time
        - delta_text: ' {"timezone": "EST"}}'
          expected:
            sglang_python:
            - index: 1
              arguments: '{"timezone": "EST"}'
        - delta_text: ''
          finish_reason: tool_calls
          expected:
            sglang_python: []
