  TOOLCALLING.streamv1.31.yaml:
    family: gemma4
    mode: streamv1
    model_label: Gemma 4
    cases:
      TOOLCALLING.streamv1.31.a:
        description: Multi-call response with Gemma delimiters `,`, `:`, and `{}` inside the first argument string
        ref: derived from TOOLCALLING.batch.31.a
        tools:
        - name: run_query
          parameters:
            type: object
            properties:
              sql:
                type: string
        - name: get_time
          parameters:
            type: object
            properties:
              timezone:
                type: string
        chunks:
        - delta_text: <|tool_call>call:run_query{sql:<|"|>
          expected:
            dynamo_v2: []
        - delta_text: SELECT
          expected:
            dynamo_v2: []
        - delta_text: ' a,b:and{brace}<|"|>}<tool_call|><|tool_call>'
          expected:
            dynamo_v2:
            - index: 0
              name: run_query
              arguments: '{"sql":"SELECT a,b:and{brace}"}'
              complete: true
        - delta_text: call:get_time{timezone:<|"|>EST<|"|>
          expected:
            dynamo_v2: []
        - delta_text: '}<tool_call|>'
          expected:
            dynamo_v2:
            - index: 1
              name: get_time
              arguments: '{"timezone":"EST"}'
              complete: true
        - delta_text: ''
          finish_reason: tool_calls
          expected:
            dynamo_v2: []
      TOOLCALLING.streamv1.31.b:
        description: Multi-call response with structural delimiters inside one argument string value
        ref: derived from TOOLCALLING.batch.31.b
        tools:
        - name: run_query
          parameters:
            type: object
            properties:
              sql:
                type: string
        - name: get_time
          parameters:
            type: object
            properties:
              timezone:
                type: string
        chunks:
        - delta_text: <|tool_call>call:run_query{sql:<|"|>
          expected:
            dynamo_v2: []
        - delta_text: SELECT
          expected:
            dynamo_v2: []
        - delta_text: ' value WHERE note'
          expected:
            dynamo_v2: []
        - delta_text: ' has brace'
          expected:
            dynamo_v2: []
        - delta_text: ' }'
          expected:
            dynamo_v2: []
        - delta_text: ' and bracket'
          expected:
            dynamo_v2: []
        - delta_text: ' ]<|"|>}<tool_call|>'
          expected:
            dynamo_v2:
            - index: 0
              name: run_query
              arguments: '{"sql":"SELECT value WHERE note has brace } and bracket ]"}'
              complete: true
        - delta_text: <|tool_call>
