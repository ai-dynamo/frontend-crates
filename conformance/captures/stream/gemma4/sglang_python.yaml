  TOOLCALLING.streamv1.31.yaml:
    family: gemma4
    mode: streamv1
    model_label: Gemma 4
    cases:
      TOOLCALLING.streamv1.31.a:
        description: Multi-call response with Gemma delimiters `,`, `:`, and `{}` inside the first argument string
        ref: derived from TOOLCALLING.batch.31.a
        tools:
        - name: run_query
          parameters:
            type: object
            properties:
              sql:
                type: string
        - name: get_time
          parameters:
            type: object
            properties:
              timezone:
                type: string
        chunks:
        - delta_text: <|tool_call>call:run_query{sql:<|"|>
          expected:
            sglang_python:
            - index: 0
              name: run_query
        - delta_text: SELECT
          expected:
            sglang_python: []
        - delta_text: ' a,b:and{brace}<|"|>}<tool_call|><|tool_call>'
          expected:
            sglang_python:
            - index: 0
              arguments: '{"sql": "SELECT a,b:and{brace}"}'
        - delta_text: call:get_time{timezone:<|"|>EST<|"|>
          expected:
            sglang_python:
            - index: 1
              name: get_time
        - delta_text: '}<tool_call|>'
          expected:
            sglang_python:
            - index: 1
              arguments: '{"timezone": "EST"}'
        - delta_text: ''
          finish_reason: tool_calls
          expected:
            sglang_python: []
      TOOLCALLING.streamv1.31.b:
