    cases:
      TOOLCALLING.streamv1.31.a:
        description: DSML invoke-close marker inside the first string parameter before a later invoke
        ref: derived from TOOLCALLING.batch.31.a
        tools:
        - name: echo
          parameters:
            type: object
            properties:
              value:
                type: string
        - &id001
          name: get_time
          parameters:
            type: object
            properties: {}
        chunks:
        - delta_text: <｜DSML｜tool_calls><｜DSML｜invoke
          expected:
            dynamo_v2: []
        - delta_text: ' name="echo">'
          expected:
            dynamo_v2: []
        - delta_text: <｜DSML｜parameter name="value" string="true">
          expected:
            dynamo_v2: []
        - delta_text: literal </｜DSML｜invoke>
          expected:
            dynamo_v2: []
        - delta_text: ' stays'
          expected:
            dynamo_v2: []
        - delta_text: ' data</｜DSML｜parameter></｜DSML｜invoke>'
          expected:
            dynamo_v2:
            - index: 0
              name: echo
              arguments: ''
              complete: false
            - index: 0
              arguments: '{"value":"literal </｜DSML｜invoke> stays data"}'
              complete: true
        - delta_text: <｜DSML｜invoke name="get_time"></｜DSML｜invoke>
          expected:
