  TOOLCALLING.streamv1.31.yaml:
    family: pythonic
    mode: streamv1
    model_label: Llama 4 (pythonic fmt)
    cases:
      TOOLCALLING.streamv1.31.a:
        description: Multi-call Pythonic list with call separator `,` inside the first argument string
        ref: derived from TOOLCALLING.batch.31.a
        tools:
        - name: run_query
          parameters:
            type: object
            properties:
              sql:
                type: string
        - name: get_time
          parameters:
            type: object
            properties:
              timezone:
                type: string
        chunks:
        - delta_text: '[run_query(sql="SELECT a,'
          expected:
            dynamo_v1:
            - index: 0
              id: true
              name: run_query
              arguments: '{"sql":"SELECT a, SELECT b"}'
            - index: 1
              id: true
              name: get_time
              arguments: '{"timezone":"EST"}'
        - delta_text: ' SELECT'
          expected:
            dynamo_v1: []
        - delta_text: ' b"), get_time(timezone="EST")]'
        - delta_text: ''
          finish_reason: tool_calls
      TOOLCALLING.streamv1.31.b:
        description: Multi-call response with structural delimiters inside one argument string value
        ref: derived from TOOLCALLING.batch.31.b
        tools:
        - name: run_query
          parameters:
            type: object
            properties:
              sql:
                type: string
        - name: get_time
          parameters:
            type: object
            properties:
              timezone:
                type: string
        chunks:
        - delta_text: '[run_query(sql="SELECT value'
          expected:
            dynamo_v1:
            - index: 0
              id: true
              name: run_query
              arguments: '{"sql":"SELECT value WHERE note has brace } and bracket ]"}'
            - index: 1
              id: true
              name: get_time
              arguments: '{"timezone":"EST"}'
        - delta_text: ' WHERE'
          expected:
            dynamo_v1: []
        - delta_text: ' note has brace'
        - delta_text: ' } and'
        - delta_text: ' bracket'
        - delta_text: ' ]"),'
        - delta_text: ' get_time(timezone="EST")]'
        - delta_text: ''
          finish_reason: tool_calls
    captured_with:
      dynamo_v1: 3.0.0
