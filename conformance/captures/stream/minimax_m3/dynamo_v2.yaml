documents:
  TOOLCALLING.streamv1.5.yaml:
    family: minimax_m3
    mode: streamv1
    model_label: MiniMax M3
    cases:
      TOOLCALLING.streamv1.5.a:
        description: Missing outer tool_call close, complete invoke is recovered at EOF
        ref: derived from TOOLCALLING.batch.5.a
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        chunks:
        - delta_text: ']<]minimax[>[<tool_call>

            ]<]minimax[>[<invoke name="get_weather">

            ]<]minimax[>[<location>NYC]<]minimax[>[</location>

            ]<]minimax[>[</invoke>'
          expected:
            dynamo_v2:
            - index: 0
              name: get_weather
              arguments: '{"location":"NYC"}'
              complete: true
        - delta_text: ''
          finish_reason: tool_calls
          expected:
            dynamo_v2: []
      TOOLCALLING.streamv1.5.h:
        description: Orphan close marker SPLIT across two chunks after prefix prose (no matching open); the fixed parser holds the partial close, drops it whole, and keeps surrounding prose
        ref: derived from TOOLCALLING.batch.5.g
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        chunks:
        - delta_text: I will
          expected:
            dynamo_v2: []
          normal_text:
            dynamo_v2: I will
        - delta_text: ' check that. '
          expected:
            dynamo_v2: []
          normal_text:
            dynamo_v2: ' check that. '
        - delta_text: ']<]minimax[>[<invoke name="get_weather">

            '
          expected:
            dynamo_v2: []
        - delta_text: ']<]minimax[>[<location>NYC]<]minimax[>[</location>

            ]<]minimax[>[</invoke>

            ]<]minimax[>[</tool_call>'
          expected:
            dynamo_v2:
            - index: 0
              name: get_weather
              arguments: '{"location":"NYC"}'
              complete: true
          normal_text: {}
        - delta_text: ''
          finish_reason: stop
          expected:
            dynamo_v2: []
    captured_with:
      dynamo_v2: 0.7.33
