documents:
  TOOLCALLING.streamv1.7-8.yaml:
    family: muse_glimmer
    mode: streamv1
    cases:
      TOOLCALLING.streamv1.7-8:
        description: 'Ambiguous object union branches: multiple object-capable alternatives must retain the string-preserving fallback rather than choose one branch arbitrarily. Constructed native MiniMax M3 regression probe for PR #270.'
        ref: https://github.com/ai-dynamo/frontend-crates/pull/270
        explanation: This probe exercises MiniMax M3 native XML and nested schema coercion; it does not apply to this parser family.
    captured_with:
      dynamo_v2: 0.7.33
  TOOLCALLING.streamv1.7-null.yaml:
    family: muse_glimmer
    mode: streamv1
    cases:
      TOOLCALLING.streamv1.7-4:
        description: 'The request tool schema permits JSON null. Bare parameter text `null` must produce JSON `null`; grammars with explicit types use native null syntax. Variants cover nullable type arrays, anyOf, oneOf, nullable, and const. Mixed-field probes also assert that non-nullable fields remain strings. Refs #251, #268, #269. The request tool schema declares `city` as `string | null` using a type array.'
        ref: https://github.com/ai-dynamo/frontend-crates/pull/287
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              city:
                type:
                - string
                - 'null'
        golden:
          calls:
          - name: get_weather
            arguments:
              city: null
          normal_text: ''
        chunks:
        - delta_text: <
          expected:
            dynamo_v2: []
        - delta_text: '|'
          expected:
            dynamo_v2: []
        - delta_text: s
          expected:
            dynamo_v2: []
