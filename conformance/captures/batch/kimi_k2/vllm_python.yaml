  TOOLCALLING.batch.6.yaml:
    family: kimi_k2
    mode: batch
    cases:
      TOOLCALLING.batch.6.a:
        description: Canonical empty {} arguments
        ref: dynamo
        model_text: <|tool_calls_section_begin|><|tool_call_begin|>functions.get_time:0<|tool_call_argument_begin|>{}<|tool_call_end|><|tool_calls_section_end|>
        tools:
        - &id001
          name: get_time
          parameters:
            type: object
            properties: {}
        expected:
          vllm_python:
            calls:
            - name: get_time
              arguments: {}
            normal_text: ''
      TOOLCALLING.batch.6.b:
        description: Whitespace inside empty {}
        ref: dynamo
        model_text: <|tool_calls_section_begin|><|tool_call_begin|>functions.get_time:0<|tool_call_argument_begin|>{ }<|tool_call_end|><|tool_calls_section_end|>
        tools:
        - *id001
        expected:
          vllm_python:
            calls:
            - name: get_time
              arguments: {}
            normal_text: ''
      TOOLCALLING.batch.6.c:
        description: No argument body (skip argument_begin → end)
        ref: dynamo
        model_text: <|tool_calls_section_begin|><|tool_call_begin|>functions.get_time:0<|tool_call_end|><|tool_calls_section_end|>
        tools:
        - *id001
        expected:
          vllm_python:
            calls:
            - name: get_time
              arguments: {}
            normal_text: ''
  TOOLCALLING.batch.8.yaml:
    family: kimi_k2
    mode: batch
    cases:
      TOOLCALLING.batch.8.a:
        description: Narration before tool call only
        ref: originated from https://github.com/vllm-project/vllm/blob/b53c507bc91f87e28b03e9b54bbff7c76e97d58b/tests/tool_parsers/test_kimi_k2_tool_parser.py#L272
        model_text: I will check the weather. <|tool_calls_section_begin|><|tool_call_begin|>functions.get_weather:0<|tool_call_argument_begin|>{"location":"Dallas"}<|tool_call_end|><|tool_calls_section_end|>
        tools:
        - &id002
          name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: Dallas
            normal_text: 'I will check the weather. '
      TOOLCALLING.batch.8.b:
        description: Narration after tool call only
        ref: originated from https://github.com/vllm-project/vllm/blob/b53c507bc91f87e28b03e9b54bbff7c76e97d58b/tests/tool_parsers/test_kimi_k2_tool_parser.py#L435
        model_text: <|tool_calls_section_begin|><|tool_call_begin|>functions.get_weather:0<|tool_call_argument_begin|>{"location":"Dallas"}<|tool_call_end|><|tool_calls_section_end|> Let me know if you need more.
        tools:
        - *id002
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: Dallas
            normal_text: ''
      TOOLCALLING.batch.8.c:
        description: Narration both before and after (sandwich)
        ref: dynamo
        model_text: I will check the weather. <|tool_calls_section_begin|><|tool_call_begin|>functions.get_weather:0<|tool_call_argument_begin|>{"location":"Dallas"}<|tool_call_end|><|tool_calls_section_end|> Let me know if you need more.
        tools:
        - *id002
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: Dallas
            normal_text: 'I will check the weather. '
      TOOLCALLING.batch.8.d:
        description: Narration between multiple tool calls
        ref: dynamo
        model_text: First check Dallas. <|tool_calls_section_begin|><|tool_call_begin|>functions.get_weather:0<|tool_call_argument_begin|>{"location":"Dallas"}<|tool_call_end|><|tool_calls_section_end|> Then check NYC. <|tool_calls_section_begin|><|tool_call_begin|>functions.get_weather:1<|tool_call_argument_begin|>{"location":"NYC"}<|tool_call_end|><|tool_calls_section_end|>
        tools:
        - *id002
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: Dallas
            - name: get_weather
              arguments:
                location: NYC
            normal_text: 'First check Dallas. '
  TOOLCALLING.stream.1.yaml:
    family: kimi_k2
    model_label: Kimi K2.6
    mode: stream
    cases:
      TOOLCALLING.stream.1.a:
        description: Complete tool-call payload delivered in one content chunk
        ref: derived from TOOLCALLING.batch.1
        chunks:
