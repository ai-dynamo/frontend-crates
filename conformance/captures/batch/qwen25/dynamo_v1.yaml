        tools: &id003
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: ''
      TOOLCALLING.stream.1.b:
        description: Complete tool call split across parser-significant boundaries
        ref: derived from TOOLCALLING.batch.1
        chunks:
        - delta_text: '<tool_call>

            '
        - delta_text: '{"name": "get_weather", '
        - delta_text: '"arguments": {"location": "NYC"}}'
        - delta_text: '

            </tool_call>'
        - delta_text: ''
          finish_reason: tool_calls
        tools: *id003
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: ''
  TOOLCALLING.batch.7.yaml:
    family: qwen25
    mode: batch
    cases:
      TOOLCALLING.batch.7.a:
        description: Standard scalar types
        ref: dynamo
        model_text: '<tool_call>

          {"name": "book_flight", "arguments": {"destination": "Paris", "passengers": 2, "first_class": true}}

          </tool_call>'
        tools:
        - name: book_flight
          parameters:
            type: object
            properties:
              destination:
                type: string
              passengers:
                type: integer
              first_class:
                type: boolean
        expected:
          dynamo_v1:
            calls:
            - name: book_flight
              arguments:
                destination: Paris
                passengers: 2
                first_class: true
            normal_text: ''
      TOOLCALLING.batch.7.b:
        description: Unicode + escaped chars
        ref: dynamo
        model_text: '<tool_call>

          {"name": "get_weather", "arguments": {"location": "Tōkyō \"central\""}}

          </tool_call>'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: Tōkyō "central"
            normal_text: ''
      TOOLCALLING.batch.7.c:
        description: Schema mismatch - string value where schema declares integer
        ref: dynamo
        model_text: '<tool_call>

          {"name": "set_temperature", "arguments": {"celsius": "20"}}

          </tool_call>'
        tools:
        - name: set_temperature
          parameters:
            type: object
            properties:
              celsius:
                type: integer
        expected:
          dynamo_v1:
            calls:
            - name: set_temperature
              arguments:
                celsius: '20'
            normal_text: ''
      TOOLCALLING.batch.7.d:
        description: Nested object + array
        ref: dynamo
        model_text: '<tool_call>

          {"name": "process_data", "arguments": {"items": [1,2,3], "config": {"nested": true}}}

          </tool_call>'
        tools:
        - name: process_data
          parameters:
            type: object
            properties:
              items:
                type: array
              config:
                type: object
        expected:
          dynamo_v1:
            calls:
            - name: process_data
              arguments:
                items:
                - 1
                - 2
                - 3
                config:
                  nested: true
            normal_text: ''
      TOOLCALLING.batch.7.e:
        description: Large / deep JSON-edge argument payload
        ref: dynamo
        model_text: '<tool_call>

          {"name": "process_data", "arguments": {"payload": {"regions": [{"name": "west", "scores": [1, 2, 3]}, {"name": "east", "scores": [4, 5, 6]}], "flags": {"enabled": true, "retry": null}, "empty": {}}}}

          </tool_call>'
        tools:
        - name: process_data
          parameters:
            type: object
            properties:
              payload:
                type: object
        expected:
          dynamo_v1:
            calls:
            - name: process_data
              arguments:
                payload:
                  regions:
                  - name: west
                    scores:
                    - 1
                    - 2
                    - 3
                  - name: east
                    scores:
                    - 4
                    - 5
                    - 6
                  flags:
                    enabled: true
                    retry: null
                  empty: {}
            normal_text: ''
      TOOLCALLING.batch.7.f:
        description: Numeric precision edge preserves integer-like number literal
        ref: https://qwen.readthedocs.io/en/v2.5/framework/function_call.html
        model_text: '<tool_call>

          {"name": "set_limit", "arguments": {"count": 9007199254740993}}

          </tool_call>'
        tools:
        - name: set_limit
          parameters:
            type: object
            properties:
              count:
                type: number
        expected:
          dynamo_v1:
            calls:
            - name: set_limit
              arguments:
                count: 9007199254740993
            normal_text: ''
  TOOLCALLING.batch.5.yaml:
    family: qwen25
