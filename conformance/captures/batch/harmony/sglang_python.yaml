  TOOLCALLING.batch.6.yaml:
    family: harmony
    mode: batch
    cases:
      TOOLCALLING.batch.6.a:
        description: Canonical empty {} message body
        ref: 'OpenAI Harmony tool calls terminate with ''<|call|>'': https://developers.openai.com/cookbook/articles/openai-harmony#receiving-tool-calls'
        model_text: <|channel|>commentary to=functions.get_time <|constrain|>json<|message|>{}<|call|>
        tools:
        - &id001
          name: get_time
          parameters:
            type: object
            properties: {}
        expected:
          sglang_python:
            calls: []
            normal_text: <|channel|>commentary to=functions.get_time <|constrain|>json<|message|>{}<|call|>
            explanation: 'Less spec-correct parsing: SGLang leaks raw Harmony markup instead of extracting a valid ''<|call|>''-terminated commentary tool call.'
      TOOLCALLING.batch.6.b:
        description: Whitespace inside empty {}
        ref: 'OpenAI Harmony tool calls terminate with ''<|call|>'': https://developers.openai.com/cookbook/articles/openai-harmony#receiving-tool-calls'
        model_text: <|channel|>commentary to=functions.get_time <|constrain|>json<|message|>{ }<|call|>
        tools:
        - *id001
        expected:
          sglang_python:
            calls: []
            normal_text: <|channel|>commentary to=functions.get_time <|constrain|>json<|message|>{ }<|call|>
            explanation: 'Less spec-correct parsing: SGLang leaks raw Harmony markup instead of extracting a valid ''<|call|>''-terminated commentary tool call.'
      TOOLCALLING.batch.6.c:
        description: No <|message|> body
        ref: 'OpenAI Harmony tool-call message header/body format: https://developers.openai.com/cookbook/articles/openai-harmony#receiving-tool-calls'
        model_text: <|channel|>commentary to=functions.get_time <|constrain|>json
        tools:
        - *id001
        expected:
          sglang_python:
            calls: []
            normal_text: <|channel|>commentary to=functions.get_time <|constrain|>json
            explanation: 'Dynamo/vLLM are more spec-correct: a commentary header without ''<|message|>'' is malformed protocol, not user-visible text; SGLang preserves raw markup'
  TOOLCALLING.batch.8.yaml:
    family: harmony
    mode: batch
    cases:
      TOOLCALLING.batch.8.a:
        description: Narration before tool call only
        ref: dynamo
        model_text: I will check the weather. <|channel|>analysis<|message|>Need to use function get_weather.<|end|><|start|>assistant<|channel|>commentary to=functions.get_weather <|constrain|>json<|message|>{"location":"NYC"}<|call|>
        tools:
        - &id002
          name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: I will check the weather.
      TOOLCALLING.batch.8.b:
        description: Narration after tool call only
        ref: dynamo
        model_text: <|channel|>analysis<|message|>Need to use function get_weather.<|end|><|start|>assistant<|channel|>commentary to=functions.get_weather <|constrain|>json<|message|>{"location":"NYC"}<|call|> Let me know if you need more.
        tools:
        - *id002
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: Let me know if you need more.
      TOOLCALLING.batch.8.c:
        description: Narration both before and after (sandwich)
        ref: inspired-by https://github.com/vllm-project/vllm/blob/b53c507bc91f87e28b03e9b54bbff7c76e97d58b/tests/tool_parsers/test_openai_tool_parser.py#L220
        model_text: I will check the weather. <|channel|>analysis<|message|>Need to use function get_weather.<|end|><|start|>assistant<|channel|>commentary to=functions.get_weather <|constrain|>json<|message|>{"location":"NYC"}<|call|> Let me know if you need more.
        tools:
        - *id002
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: I will check the weather.   Let me know if you need more.
            explanation: 'No spec-correct winner on whitespace: analysis is correctly hidden and the same call is extracted; surrounding prose is outside Harmony messages, so whitespace is recovery-only'
      TOOLCALLING.batch.8.d:
        description: Narration between multiple tool calls
        ref: dynamo
        model_text: I will check the weather. <|channel|>analysis<|message|>Need to use function get_weather.<|end|><|start|>assistant<|channel|>commentary to=functions.get_weather <|constrain|>json<|message|>{"location":"NYC"}<|call|> Then check LA weather. <|channel|>commentary to=functions.get_weather <|constrain|>json<|message|>{"location":"LA"}<|call|>
        tools:
        - *id002
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_weather
              arguments:
                location: LA
            normal_text: I will check the weather.   Then check LA weather.
            explanation: 'No spec-correct winner on whitespace: analysis is correctly hidden and the same calls are extracted; surrounding prose is outside Harmony messages, so whitespace is recovery-only'
  TOOLCALLING.stream.1.yaml:
    family: harmony
    model_label: gpt-oss
    mode: stream
    cases:
      TOOLCALLING.stream.1.a:
        description: Complete tool-call payload delivered in one content chunk
        ref: derived from TOOLCALLING.batch.1
        chunks:
        - delta_text: <|channel|>commentary to=functions.get_weather <|constrain|>json<|message|>{"location":"NYC"}
        - delta_text: ''
          finish_reason: tool_calls
        tools: &id003
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        expected:
          sglang_python:
            calls: []
            normal_text: ''
      TOOLCALLING.stream.1.b:
        description: Complete tool call split across parser-significant boundaries
        ref: derived from TOOLCALLING.batch.1
        chunks:
        - delta_text: <|channel|>commentary to=functions.
        - delta_text: get_weather
        - delta_text: ' <|constrain|>json'
        - delta_text: <|message|>
        - delta_text: '{"location":"NYC"}'
        - delta_text: ''
          finish_reason: tool_calls
        tools: *id003
        expected:
          sglang_python:
            calls: []
            normal_text: ''
  TOOLCALLING.batch.7.yaml:
    family: harmony
    mode: batch
    cases:
      TOOLCALLING.batch.7.a:
        description: Standard scalar types
        ref: 'OpenAI Harmony receiving tool calls example starts completion at ''<|channel|>'': https://developers.openai.com/cookbook/articles/openai-harmony#receiving-tool-calls'
        model_text: <|channel|>commentary to=functions.book_flight <|constrain|>json<|message|>{"destination":"Paris","passengers":2,"first_class":true}<|call|>
        tools:
        - name: book_flight
          parameters:
            type: object
            properties:
              destination:
                type: string
              passengers:
                type: integer
              first_class:
                type: boolean
        expected:
          sglang_python:
            calls: []
            normal_text: <|channel|>commentary to=functions.book_flight <|constrain|>json<|message|>{"destination":"Paris","passengers":2,"first_class":true}<|call|>
            explanation: 'Dynamo/vLLM are more spec-correct for completion-body parsing: the first assistant message may start at ''<|channel|>''; SGLang requires a redundant ''<|start|>assistant'' prefix and leaks raw markup'
      TOOLCALLING.batch.7.b:
        description: Unicode + escaped chars
        ref: 'OpenAI Harmony receiving tool calls example starts completion at ''<|channel|>'': https://developers.openai.com/cookbook/articles/openai-harmony#receiving-tool-calls'
        model_text: <|channel|>commentary to=functions.get_weather <|constrain|>json<|message|>{"location":"Tōkyō \"central\""}<|call|>
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        expected:
          sglang_python:
            calls: []
            normal_text: <|channel|>commentary to=functions.get_weather <|constrain|>json<|message|>{"location":"Tōkyō \"central\""}<|call|>
            explanation: 'Dynamo/vLLM are more spec-correct for completion-body parsing: the first assistant message may start at ''<|channel|>''; SGLang requires a redundant ''<|start|>assistant'' prefix and leaks raw markup'
      TOOLCALLING.batch.7.c:
        description: Schema mismatch — string value where schema declares integer
        ref: 'OpenAI Harmony receiving tool calls example starts completion at ''<|channel|>'': https://developers.openai.com/cookbook/articles/openai-harmony#receiving-tool-calls'
        model_text: <|channel|>commentary to=functions.set_temperature <|constrain|>json<|message|>{"celsius":"20"}<|call|>
        tools:
        - name: set_temperature
          parameters:
            type: object
            properties:
              celsius:
                type: integer
        expected:
          sglang_python:
            calls: []
            normal_text: <|channel|>commentary to=functions.set_temperature <|constrain|>json<|message|>{"celsius":"20"}<|call|>
            explanation: 'Dynamo/vLLM are more spec-correct for completion-body parsing: the first assistant message may start at ''<|channel|>''; SGLang requires a redundant ''<|start|>assistant'' prefix and leaks raw markup'
      TOOLCALLING.batch.7.d:
        description: Nested object + array
        ref: 'OpenAI Harmony receiving tool calls example starts completion at ''<|channel|>'': https://developers.openai.com/cookbook/articles/openai-harmony#receiving-tool-calls'
        model_text: <|channel|>commentary to=functions.process_data <|constrain|>json<|message|>{"items":[1,2,3],"config":{"nested":true}}<|call|>
        tools:
        - name: process_data
          parameters:
            type: object
            properties:
              items:
                type: array
              config:
                type: object
        expected:
          sglang_python:
            calls: []
            normal_text: <|channel|>commentary to=functions.process_data <|constrain|>json<|message|>{"items":[1,2,3],"config":{"nested":true}}<|call|>
            explanation: 'Dynamo/vLLM are more spec-correct for completion-body parsing: the first assistant message may start at ''<|channel|>''; SGLang requires a redundant ''<|start|>assistant'' prefix and leaks raw markup'
      TOOLCALLING.batch.7.e:
