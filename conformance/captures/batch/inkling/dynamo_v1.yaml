  TOOLCALLING.batch.yaml:
    family: inkling
    model_label: Inkling
    mode: batch
    spec: https://huggingface.co/thinkingmachines/Inkling-NVFP4
    refs:
      local: Inkling chat-template tool-call framing
      e2e: Real model traces established the headerless generation-primer and typed-argument shapes; synthetic cases cover parser boundaries.
    cases:
      TOOLCALLING.batch.1:
        description: Single tool call (happy path)
        ref: Inkling native tool-call framing
        model_text: <|message_model|>get_weather<|content_invoke_tool_json|>{"name":"get_weather","args":{"location":"NYC"}}<|end_message|>
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: ''
      TOOLCALLING.batch.2.a:
        description: Parallel calls in one sampled assistant turn
        ref: Inkling native multi-block turn framing
        model_text: <|message_model|>get_weather<|content_invoke_tool_json|>{"name":"get_weather","args":{"location":"NYC"}}<|end_message|><|message_model|>get_time<|content_invoke_tool_json|>{"name":"get_time","args":{"timezone":"EST"}}<|end_message|><|content_model_end_sampling|>
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        - name: get_time
          parameters:
            type: object
            properties:
              timezone:
                type: string
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_time
              arguments:
                timezone: EST
            normal_text: ''
      TOOLCALLING.batch.2.b:
        description: Two different tools in back-to-back fenced blocks
        ref: Inkling native tool-call framing
        model_text: <|message_model|>get_weather<|content_invoke_tool_json|>{"name":"get_weather","args":{"location":"NYC"}}<|end_message|><|message_model|>get_time<|content_invoke_tool_json|>{"name":"get_time","args":{"timezone":"EST"}}<|end_message|>
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        - name: get_time
          parameters:
            type: object
            properties:
              timezone:
                type: string
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_time
              arguments:
                timezone: EST
            normal_text: ''
      TOOLCALLING.batch.2.c:
        description: Two calls with narration before and after
        ref: Inkling native tool-call framing
        model_text: 'Both: <|message_model|>get_weather<|content_invoke_tool_json|>{"name":"get_weather","args":{"location":"NYC"}}<|end_message|><|message_model|>get_time<|content_invoke_tool_json|>{"name":"get_time","args":{"timezone":"EST"}}<|end_message|> Done.'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        - name: get_time
          parameters:
            type: object
            properties:
              timezone:
                type: string
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_time
              arguments:
                timezone: EST
            normal_text: 'Both:'
      TOOLCALLING.batch.2.d:
        description: Same tool name twice; calls remain distinct
        ref: Inkling native tool-call framing
        model_text: <|message_model|>get_weather<|content_invoke_tool_json|>{"name":"get_weather","args":{"location":"NYC"}}<|end_message|><|message_model|>get_weather<|content_invoke_tool_json|>{"name":"get_weather","args":{"location":"LA"}}<|end_message|>
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
              unit:
                type: string
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_weather
              arguments:
                location: LA
            normal_text: ''
      TOOLCALLING.batch.3:
        description: No tool call (plain text passthrough)
        ref: Inkling native tool-call framing
        model_text: Hello, how can I help you today?
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
              unit:
                type: string
        expected:
          dynamo_v1:
            calls: []
            normal_text: Hello, how can I help you today?
      TOOLCALLING.batch.4.a:
        description: Fenced wrapper with garbage body
        ref: Inkling native tool-call framing
        model_text: <|message_model|>f<|content_invoke_tool_json|>not-json<|end_message|>
        tools:
        - name: f
          parameters:
            type: object
            properties:
              s:
                type: string
              n:
                type: integer
              b:
                type: boolean
              payload:
                type: object
              value:
                type: integer
        expected:
          dynamo_v1:
            calls: []
            normal_text: ''
      TOOLCALLING.batch.4.b:
        description: Unterminated / invalid JSON body
        ref: Inkling native tool-call framing
        model_text: <|message_model|>f<|content_invoke_tool_json|>{"name":"f","args":{"x":}}<|end_message|>
        tools:
        - name: f
          parameters:
            type: object
            properties:
              s:
                type: string
              n:
                type: integer
