  TOOLCALLING.stream.1.yaml:
    family: inkling
    model_label: Inkling
    mode: stream
    spec: https://huggingface.co/thinkingmachines/Inkling-NVFP4
    cases:
      TOOLCALLING.stream.1.a:
        description: Complete Inkling tool-call payload delivered in one content chunk
        ref: derived from TOOLCALLING.batch.1
        chunks:
        - delta_text: <|message_model|>get_weather<|content_invoke_tool_json|>{"name":"get_weather","args":{"location":"NYC"}}<|end_message|>
        - delta_text: ''
          finish_reason: tool_calls
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
              unit:
                type: string
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: ''
      TOOLCALLING.stream.1.b:
        description: Complete Inkling tool call split across parser-significant boundaries
        ref: derived from TOOLCALLING.batch.1
        chunks:
