            calls: []
            normal_text: ''
      TOOLCALLING.batch.4.c:
        description: Structured body omits the function name
        ref: Inkling native tool-call framing
        model_text: <|message_model|>f<|content_invoke_tool_json|>{"args":{"x":1}}<|end_message|>
        tools:
        - name: f
          parameters:
            type: object
            properties:
              s:
                type: string
              n:
                type: integer
              b:
                type: boolean
              payload:
                type: object
              value:
                type: integer
        expected:
          dynamo_v1:
            calls: []
            normal_text: ''
      TOOLCALLING.batch.4.d:
        description: Complete JSON body omits the outer end fence
        ref: Inkling native tool-call framing
        model_text: <|message_model|>f<|content_invoke_tool_json|>{"name":"f","args":{"s":"ok"}}
        tools:
        - name: f
          parameters:
            type: object
            properties:
              s:
                type: string
              n:
                type: integer
              b:
                type: boolean
              payload:
                type: object
              value:
                type: integer
        expected:
          dynamo_v1:
            calls:
            - name: f
