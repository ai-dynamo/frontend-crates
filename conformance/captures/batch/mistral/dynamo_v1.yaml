    mode: batch
    cases:
      TOOLCALLING.batch.7-4:
        description: 'MiniMax M3 v1 null-schema regression (PR #269).'
        explanation: This constructed probe uses MiniMax M3 native XML and exercises its v1 scalar coercion; it does not apply to this parser family.
      TOOLCALLING.batch.7-4.anyof:
