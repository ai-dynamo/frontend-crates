  TOOLCALLING.batch.4.yaml:
    family: minimax_m3
    model_label: MiniMax M3
    mode: batch
    cases:
      TOOLCALLING.batch.4.a:
        description: Tool_call wrapper with garbage body
        ref: MiniMax M3 parser malformed-input recovery contract
        model_text: ']<]minimax[>[<tool_call>

          nonsense

          ]<]minimax[>[</tool_call>'
        tools:
        - &id015
          name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        expected:
          sglang_python: &id014
            unavailable: SGLang 0.5.12.post1 in this conformance harness does not include the MiniMax M3 detector yet.
      TOOLCALLING.batch.4.b:
        description: Invalid JSON object in schema-declared object parameter falls back to string
        ref: MiniMax M3 schema-aware scalar coercion
        model_text: ']<]minimax[>[<tool_call>

          ]<]minimax[>[<invoke name="configure">

          ]<]minimax[>[<settings>{"mode": "fast"]<]minimax[>[</settings>

          ]<]minimax[>[</invoke>

          ]<]minimax[>[</tool_call>'
        tools:
        - name: configure
          parameters:
            type: object
            properties:
              settings:
                type: object
        expected:
          sglang_python: *id014
      TOOLCALLING.batch.4.c:
        description: Invoke without name attribute
        ref: MiniMax M3 parser malformed-input recovery contract
        model_text: ']<]minimax[>[<tool_call>

          ]<]minimax[>[<invoke>

          ]<]minimax[>[<location>NYC]<]minimax[>[</location>

          ]<]minimax[>[</invoke>

          ]<]minimax[>[</tool_call>'
        tools:
        - *id015
        expected:
          sglang_python: *id014
      TOOLCALLING.batch.4.d:
        description: Missing closing invoke tag
        ref: MiniMax M3 parser malformed-input recovery contract
        model_text: ']<]minimax[>[<tool_call>

          ]<]minimax[>[<invoke name="get_weather">

          ]<]minimax[>[<location>NYC]<]minimax[>[</location>

          ]<]minimax[>[</tool_call>'
        tools:
        - *id015
        expected:
          sglang_python: *id014
      TOOLCALLING.batch.4.e:
        description: Malformed-prefix recovery is not applicable to this family's syntax
        explanation: TOOLCALLING.batch.4.e is specific to raw JSON-object scanners where a malformed JSON-looking prefix may be followed by a complete object. MiniMax M3 uses namespace-prefixed XML tags, so malformed wrapper coverage lives in TOOLCALLING.batch.4.a through 4.d.
      TOOLCALLING.batch.4.f:
        description: Tool-name XML tag case is not applicable to this family's syntax
        explanation: TOOLCALLING.batch.4.f is specific to Qwen3-Coder XML syntax, where the model may emit a tool-name tag such as <terminal> instead of the required <function=Terminal> opener. MiniMax M3 uses <invoke name="...">.
