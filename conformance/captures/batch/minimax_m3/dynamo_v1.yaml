      TOOLCALLING.batch.30:
        description: Separator-character case not applicable
        explanation: This case is not applicable to minimax_m3 because it uses namespace-prefixed XML tags, not delimiter-separated call bodies.
      TOOLCALLING.batch.30.a:
        description: Call separator inside argument string is not applicable
        explanation: MiniMax M3 does not use delimiter-separated call bodies; argument values are bounded by namespace-prefixed XML tags.
      TOOLCALLING.batch.30.b:
        description: Structural delimiter inside argument string is not applicable
        explanation: MiniMax M3 does not use delimiter depth tracking over delimiter-separated JSON call bodies; nested values are represented as nested namespace-prefixed XML tags.
      TOOLCALLING.batch.30.c:
        description: Tool-call marker text inside argument string is not applicable
        explanation: MiniMax M3 argument boundaries are explicit namespace-prefixed XML tags. Literal marker-like text must be escaped by the model/template rather than parsed as a delimiter-separated string hazard.
      TOOLCALLING.batch.31:
        description: Multi-call separator-character case not applicable
        explanation: This case is not applicable to minimax_m3 because it uses namespace-prefixed XML tags, not delimiter-separated call bodies.
      TOOLCALLING.batch.31.a:
        description: Separator character before real inter-call separator is not applicable
        explanation: MiniMax M3 represents multiple calls as multiple <invoke name="..."> blocks inside one outer tool_call wrapper, not with separator characters between calls.
      TOOLCALLING.batch.31.b:
        description: Nested delimiter before later calls is not applicable
        explanation: MiniMax M3 nested structures are encoded as nested namespace-prefixed XML tags, so delimiter-state regressions for JSON/string separators do not apply.
