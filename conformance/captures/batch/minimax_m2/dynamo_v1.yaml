  TOOLCALLING.batch.6.yaml:
    family: minimax_m2
    mode: batch
    cases:
      TOOLCALLING.batch.6.a:
        description: Invoke with no <parameter>
        ref: dynamo
        model_text: '<minimax:tool_call>

          <invoke name="get_time">

          </invoke>

          </minimax:tool_call>'
        tools:
        - &id001
          name: get_time
          parameters:
            type: object
            properties: {}
        expected:
          dynamo_v1:
            calls:
            - name: get_time
              arguments: {}
            normal_text: ''
      TOOLCALLING.batch.6.b:
        description: Invoke with extra newline
        ref: dynamo
        model_text: '<minimax:tool_call>

          <invoke name="get_time">


          </invoke>

          </minimax:tool_call>'
        tools:
        - *id001
        expected:
          dynamo_v1:
            calls:
            - name: get_time
              arguments: {}
            normal_text: ''
      TOOLCALLING.batch.6.c:
        description: Empty-body variant 6.c — not yet authored for this family
        explanation: Empty-body variant 6.c not yet authored for minimax_m2; see 6.a / 6.b for this family's empty / whitespace scenarios.
  TOOLCALLING.batch.8.yaml:
    family: minimax_m2
    mode: batch
    cases:
      TOOLCALLING.batch.8.a:
        description: Narration before tool call only
        ref: originated from https://github.com/vllm-project/vllm/blob/b53c507bc91f87e28b03e9b54bbff7c76e97d58b/tests/tool_parsers/test_minimax_m2_tool_parser.py#L126
        model_text: 'I will check the weather. <minimax:tool_call>

          <invoke name="get_weather">

          <parameter name="location">NYC</parameter>

          </invoke>

          </minimax:tool_call>'
        tools:
        - &id002
          name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: 'I will check the weather. '
      TOOLCALLING.batch.8.b:
        description: Narration after tool call only
        ref: dynamo
        model_text: '<minimax:tool_call>

          <invoke name="get_weather">

          <parameter name="location">NYC</parameter>

          </invoke>

          </minimax:tool_call> Let me know if you need more.'
        tools:
        - *id002
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: ''
      TOOLCALLING.batch.8.c:
        description: Narration both before and after (sandwich)
        ref: dynamo
        model_text: 'I will check the weather. <minimax:tool_call>

          <invoke name="get_weather">

          <parameter name="location">NYC</parameter>

          </invoke>

          </minimax:tool_call> Let me know if you need more.'
        tools:
        - *id002
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: 'I will check the weather. '
      TOOLCALLING.batch.8.d:
        description: Narration between multiple tool calls
        ref: dynamo
        model_text: 'I will check the weather. <minimax:tool_call>

          <invoke name="get_weather">

          <parameter name="location">NYC</parameter>

          </invoke>

          </minimax:tool_call> Then check LA weather. <minimax:tool_call>

          <invoke name="get_weather">

          <parameter name="location">LA</parameter>

          </invoke>

          </minimax:tool_call>'
        tools:
        - *id002
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_weather
              arguments:
                location: LA
            normal_text: 'I will check the weather. '
  TOOLCALLING.stream.1.yaml:
    family: minimax_m2
    model_label: MiniMax 2.7
    mode: stream
    cases:
      TOOLCALLING.stream.1.a:
        description: Complete tool-call payload delivered in one content chunk
        ref: derived from TOOLCALLING.batch.1
        chunks:
        - delta_text: '<minimax:tool_call>

            <invoke name="get_weather">

            <parameter name="location">NYC</parameter>

            </invoke>

            </minimax:tool_call>'
        - delta_text: ''
          finish_reason: tool_calls
        tools: &id003
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: ''
      TOOLCALLING.stream.1.b:
        description: Complete tool call split across parser-significant boundaries
        ref: derived from TOOLCALLING.batch.1
        chunks:
        - delta_text: '<minimax:tool_call>

            '
        - delta_text: '<invoke name="get_weather">

            '
        - delta_text: <parameter name="location">
        - delta_text: NYC
        - delta_text: '</parameter>

            '
        - delta_text: '</invoke>

            '
        - delta_text: </minimax:tool_call>
        - delta_text: ''
          finish_reason: tool_calls
        tools: *id003
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: ''
  TOOLCALLING.batch.7.yaml:
    family: minimax_m2
    mode: batch
    cases:
      TOOLCALLING.batch.7.a:
        description: Multiple parameters
        ref: dynamo
        model_text: '<minimax:tool_call>

          <invoke name="book_flight">

          <parameter name="destination">Paris</parameter>

          <parameter name="passengers">2</parameter>

          <parameter name="first_class">true</parameter>

          </invoke>

          </minimax:tool_call>'
        tools:
        - name: book_flight
          parameters:
            type: object
            properties:
              destination:
                type: string
              passengers:
                type: integer
              first_class:
                type: boolean
        expected:
          dynamo_v1:
            calls:
            - name: book_flight
              arguments:
                destination: Paris
                passengers: 2
                first_class: true
            normal_text: ''
      TOOLCALLING.batch.7.b:
        description: Unicode in parameter
        ref: dynamo
        model_text: '<minimax:tool_call>

