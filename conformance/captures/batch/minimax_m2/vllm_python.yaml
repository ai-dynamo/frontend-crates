  TOOLCALLING.batch.6.yaml:
    family: minimax_m2
    mode: batch
    cases:
      TOOLCALLING.batch.6.a:
        description: Invoke with no <parameter>
        ref: dynamo
        model_text: '<minimax:tool_call>

          <invoke name="get_time">

          </invoke>

          </minimax:tool_call>'
        tools:
        - &id001
          name: get_time
          parameters:
            type: object
            properties: {}
        expected:
          vllm_python:
            calls:
            - name: get_time
              arguments: {}
            normal_text: ''
      TOOLCALLING.batch.6.b:
        description: Invoke with extra newline
        ref: dynamo
        model_text: '<minimax:tool_call>

          <invoke name="get_time">


          </invoke>

          </minimax:tool_call>'
        tools:
        - *id001
        expected:
          vllm_python:
            calls:
            - name: get_time
              arguments: {}
            normal_text: ''
      TOOLCALLING.batch.6.c:
        description: Empty-body variant 6.c — not yet authored for this family
        explanation: Empty-body variant 6.c not yet authored for minimax_m2; see 6.a / 6.b for this family's empty / whitespace scenarios.
  TOOLCALLING.batch.8.yaml:
    family: minimax_m2
    mode: batch
    cases:
      TOOLCALLING.batch.8.a:
        description: Narration before tool call only
        ref: originated from https://github.com/vllm-project/vllm/blob/b53c507bc91f87e28b03e9b54bbff7c76e97d58b/tests/tool_parsers/test_minimax_m2_tool_parser.py#L126
        model_text: 'I will check the weather. <minimax:tool_call>

          <invoke name="get_weather">

          <parameter name="location">NYC</parameter>

          </invoke>

          </minimax:tool_call>'
        tools:
        - &id002
          name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: I will check the weather.
      TOOLCALLING.batch.8.b:
        description: Narration after tool call only
        ref: dynamo
        model_text: '<minimax:tool_call>

          <invoke name="get_weather">

          <parameter name="location">NYC</parameter>

          </invoke>

          </minimax:tool_call> Let me know if you need more.'
        tools:
        - *id002
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
