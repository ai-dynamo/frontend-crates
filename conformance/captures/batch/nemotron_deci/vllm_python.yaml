        tools: *id003
        expected:
          vllm_python:
            unavailable: vLLM has no parser for family='nemotron_deci'
  TOOLCALLING.batch.7.yaml:
    family: nemotron_deci
    mode: batch
    cases:
      TOOLCALLING.batch.7.a:
        description: Standard scalar types
        ref: dynamo
        model_text: '<TOOLCALL>[{"name": "book_flight", "arguments": {"destination": "Paris", "passengers": 2, "first_class": true}}]</TOOLCALL>'
        tools:
        - name: book_flight
          parameters:
            type: object
            properties:
              destination:
                type: string
              passengers:
                type: integer
              first_class:
                type: boolean
        expected:
          vllm_python:
            unavailable: vLLM has no parser for family='nemotron_deci'
      TOOLCALLING.batch.7.b:
        description: Unicode + escaped chars
        ref: dynamo
        model_text: '<TOOLCALL>[{"name": "get_weather", "arguments": {"location": "Tōkyō \"central\""}}]</TOOLCALL>'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        expected:
          vllm_python:
            unavailable: vLLM has no parser for family='nemotron_deci'
      TOOLCALLING.batch.7.c:
        description: Schema mismatch — string value where schema declares integer
        ref: dynamo
        model_text: '<TOOLCALL>[{"name": "set_temperature", "arguments": {"celsius": "20"}}]</TOOLCALL>'
        tools:
        - name: set_temperature
          parameters:
            type: object
            properties:
              celsius:
                type: integer
        expected:
          vllm_python:
            unavailable: vLLM has no parser for family='nemotron_deci'
      TOOLCALLING.batch.7.d:
        description: Nested object + array (existing)
        ref: dynamo
        model_text: '<TOOLCALL>[{"name": "process_data", "arguments": {"items": [1,2,3], "config": {"nested": true}}}]</TOOLCALL>'
