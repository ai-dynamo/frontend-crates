  TOOLCALLING.batch.6.yaml:
    family: llama3_json
    mode: batch
    cases:
      TOOLCALLING.batch.6.a:
        description: 'Canonical "arguments": {}'
        ref: dynamo
        model_text: '<|python_tag|>{"name": "get_time", "arguments": {}}'
        tools:
        - &id001
          name: get_time
          parameters:
            type: object
            properties: {}
        expected:
          dynamo_v1:
            calls:
            - name: get_time
              arguments: {}
            normal_text: ''
      TOOLCALLING.batch.6.b:
        description: Whitespace inside arguments {}
        ref: dynamo
        model_text: '<|python_tag|>{"name": "get_time", "arguments": { }}'
        tools:
        - *id001
        expected:
          dynamo_v1:
            calls:
            - name: get_time
              arguments: {}
            normal_text: ''
      TOOLCALLING.batch.6.c:
        description: No arguments key
        ref: dynamo
        model_text: '<|python_tag|>{"name": "get_time"}'
        tools:
        - *id001
        expected:
          dynamo_v1:
            calls: []
            normal_text: ''
  TOOLCALLING.batch.8.yaml:
    family: llama3_json
    mode: batch
    cases:
      TOOLCALLING.batch.8.a:
        description: Narration before tool call only
        ref: dynamo
        model_text: 'I will check the weather. <|python_tag|>{"name": "get_weather", "arguments": {"location": "NYC"}}'
        tools:
        - &id002
          name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: I will check the weather.
      TOOLCALLING.batch.8.b:
        description: Narration after tool call only
        ref: dynamo
        model_text: '<|python_tag|>{"name": "get_weather", "arguments": {"location": "NYC"}} Let me know if you need more.'
        tools:
        - *id002
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: ''
      TOOLCALLING.batch.8.c:
        description: Narration both before and after (sandwich)
        ref: originated from https://github.com/vllm-project/vllm/blob/b53c507bc91f87e28b03e9b54bbff7c76e97d58b/tests/tool_parsers/test_llama3_json_tool_parser.py#L128
        model_text: 'I will check the weather. <|python_tag|>{"name": "get_weather", "arguments": {"location": "NYC"}} Let me know if you need more.'
        tools:
        - *id002
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: I will check the weather.
      TOOLCALLING.batch.8.d:
        description: Narration between multiple tool calls
        ref: dynamo
        model_text: 'I will check the weather. <|python_tag|>{"name": "get_weather", "arguments": {"location": "NYC"}} Then check LA weather. <|python_tag|>{"name": "get_weather", "arguments": {"location": "LA"}}'
        tools:
        - *id002
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_weather
              arguments:
                location: LA
            normal_text: I will check the weather.
  TOOLCALLING.stream.1.yaml:
    family: llama3_json
    model_label: Llama 3 (JSON fmt)
    mode: stream
    cases:
      TOOLCALLING.stream.1.a:
        description: Complete tool-call payload delivered in one content chunk
        ref: derived from TOOLCALLING.batch.1
        chunks:
        - delta_text: '<|python_tag|>{"name": "get_weather", "arguments": {"location": "NYC"}}'
        - delta_text: ''
          finish_reason: tool_calls
        tools: &id003
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: ''
      TOOLCALLING.stream.1.b:
        description: Complete tool call split across parser-significant boundaries
        ref: derived from TOOLCALLING.batch.1
        chunks:
        - delta_text: <|python_tag|>
        - delta_text: '{"name": "get_weather", '
        - delta_text: '"arguments": {"location": "NYC"}}'
        - delta_text: ''
          finish_reason: tool_calls
        tools: *id003
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: ''
  TOOLCALLING.batch.7.yaml:
    family: llama3_json
    mode: batch
    cases:
      TOOLCALLING.batch.7.a:
        description: Standard scalar types
        ref: dynamo
        model_text: '<|python_tag|>{"name": "book_flight", "arguments": {"destination": "Paris", "passengers": 2, "first_class": true}}'
        tools:
        - name: book_flight
          parameters:
            type: object
            properties:
              destination:
                type: string
              passengers:
                type: integer
              first_class:
                type: boolean
        expected:
          dynamo_v1:
            calls:
            - name: book_flight
              arguments:
                destination: Paris
                passengers: 2
                first_class: true
            normal_text: ''
      TOOLCALLING.batch.7.b:
        description: Unicode + escaped chars
        ref: originated from https://github.com/vllm-project/vllm/blob/b53c507bc91f87e28b03e9b54bbff7c76e97d58b/tests/tool_parsers/test_llama3_json_tool_parser.py#L217
        model_text: '<|python_tag|>{"name": "get_weather", "arguments": {"location": "Tōkyō \"central\""}}'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: Tōkyō "central"
            normal_text: ''
      TOOLCALLING.batch.7.c:
        description: Schema mismatch — string value where schema declares integer
        ref: dynamo
        model_text: '<|python_tag|>{"name": "set_temperature", "arguments": {"celsius": "20"}}'
        tools:
        - name: set_temperature
          parameters:
            type: object
            properties:
              celsius:
                type: integer
        expected:
          dynamo_v1:
            calls:
            - name: set_temperature
              arguments:
                celsius: '20'
            normal_text: ''
      TOOLCALLING.batch.7.d:
        description: Nested object + array
        ref: originated from https://github.com/vllm-project/vllm/blob/b53c507bc91f87e28b03e9b54bbff7c76e97d58b/tests/tool_parsers/test_llama3_json_tool_parser.py#L146
        model_text: '<|python_tag|>{"name": "process_data", "arguments": {"items": [1,2,3], "config": {"nested": true}}}'
        tools:
        - name: process_data
          parameters:
            type: object
            properties:
              items:
                type: array
              config:
                type: object
        expected:
          dynamo_v1:
            calls:
            - name: process_data
              arguments:
                items:
                - 1
                - 2
                - 3
                config:
                  nested: true
            normal_text: ''
      TOOLCALLING.batch.7.e:
        description: Large / deep JSON-edge argument payload
        ref: dynamo
        model_text: '<|python_tag|>{"name": "process_data", "arguments": {"payload": {"regions": [{"name": "west", "scores": [1, 2, 3]}, {"name": "east", "scores": [4, 5, 6]}], "flags": {"enabled": true, "retry": null}, "empty": {}}}}'
        tools:
        - name: process_data
          parameters:
            type: object
            properties:
              payload:
                type: object
        expected:
          dynamo_v1:
            calls:
            - name: process_data
              arguments:
                payload:
                  regions:
                  - name: west
                    scores:
                    - 1
                    - 2
                    - 3
                  - name: east
                    scores:
                    - 4
                    - 5
                    - 6
                  flags:
                    enabled: true
                    retry: null
                  empty: {}
            normal_text: ''
      TOOLCALLING.batch.7.f:
        description: Numeric precision edge preserves integer-like number literal
        ref: https://www.llama.com/docs/model-cards-and-prompt-formats/llama3_1/
        model_text: '<|python_tag|>{"name": "set_limit", "arguments": {"count": 9007199254740993}}'
        tools:
        - name: set_limit
          parameters:
            type: object
            properties:
              count:
                type: number
        expected:
          dynamo_v1:
            calls:
            - name: set_limit
              arguments:
                count: 9007199254740993
            normal_text: ''
  TOOLCALLING.batch.5.yaml:
    family: llama3_json
    mode: batch
    cases:
      TOOLCALLING.batch.5.a:
        description: No explicit end (truncation)
        ref: dynamo
        model_text: '<|python_tag|>{"name": "get_weather", "arguments": {"location": "NYC"}'
        tools:
        - &id004
          name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        expected:
          dynamo_v1:
            calls: []
            normal_text: ''
      TOOLCALLING.batch.5.c:
        description: Truncation deeper inside arguments JSON (vs .a which truncates at the closing brace)
        ref: dynamo
        model_text: '<|python_tag|>{"name": "get_weather", "arguments": {"loc'
        tools:
        - *id004
        expected:
          dynamo_v1:
            calls: []
            normal_text: ''
      TOOLCALLING.batch.5.d:
        description: Multi-call, last call missing only end marker (body complete)
        ref: dynamo
        model_text: 'I''ll start by fetching the weather for both Boston and New York at the same time!<|python_tag|>{"name": "get_weather", "arguments": {"location": "Boston"}};{"name": "get_weather", "arguments": {"location": "New York"}'
        tools:
        - *id004
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: Boston
            normal_text: I'll start by fetching the weather for both Boston and New York at the same time!
      TOOLCALLING.batch.5.e:
        description: Multi-call, last call truncated mid-arg-value
        ref: dynamo
        model_text: 'I''ll start by fetching the weather for both Boston and New York at the same time!<|python_tag|>{"name": "get_weather", "arguments": {"location": "Boston"}};{"name": "get_weather", "arguments": {"location": "New York'
        tools:
        - *id004
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: Boston
            normal_text: I'll start by fetching the weather for both Boston and New York at the same time!
      TOOLCALLING.batch.5.b:
        description: Orphan closing-marker — n/a for this family's syntax
        explanation: Orphan closing-marker test is n/a — llama3_json's output has no matching delimiter pair to leave unclosed.
  TOOLCALLING.batch.7-8.yaml:
    family: llama3_json
    mode: batch
    cases:
      TOOLCALLING.batch.7-8:
        description: 'Ambiguous object union branches: multiple object-capable alternatives must retain the string-preserving fallback rather than choose one branch arbitrarily. Constructed native MiniMax M3 regression probe for PR #270.'
        ref: https://github.com/ai-dynamo/frontend-crates/pull/270
        explanation: This probe exercises MiniMax M3 native XML and nested schema coercion; it does not apply to this parser family.
  TOOLCALLING.batch.7-null-ref.yaml:
    family: llama3_json
    mode: batch
    cases:
      TOOLCALLING.batch.7-4.inline:
        description: 'PR #268 inline control: a nullable string parameter converts bare null to JSON null.'
        explanation: This probe uses GLM XML argument markers and tests its schema-dependent null coercion; it does not apply to this parser family.
      TOOLCALLING.batch.7-5.inline:
        description: 'PR #268 inline control: a string-only parameter preserves bare null as string "null".'
        explanation: This probe uses GLM XML argument markers and tests its schema-dependent null coercion; it does not apply to this parser family.
      TOOLCALLING.batch.7-4.ref:
        description: 'PR #268 local reference: a nullable string definition on the tool parameters root permits JSON null.'
        explanation: This probe uses GLM XML argument markers and tests its schema-dependent null coercion; it does not apply to this parser family.
      TOOLCALLING.batch.7-5.ref:
        description: 'PR #268 local reference: a string-only definition on the tool parameters root excludes JSON null.'
        explanation: This probe uses GLM XML argument markers and tests its schema-dependent null coercion; it does not apply to this parser family.
  TOOLCALLING.batch.yaml:
    family: llama3_json
    model_label: Llama 3 (JSON fmt)
    mode: batch
    cases:
      TOOLCALLING.batch.1:
        description: Single tool call (happy path)
        model_text: '<|python_tag|>{"name": "get_weather", "arguments": {"location": "NYC"}}'
        tools:
        - &id005
          name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: ''
      TOOLCALLING.batch.3:
        description: No tool call (plain text)
        model_text: Hello, how can I help you today?
        tools:
        - *id005
        expected:
          dynamo_v1:
            calls: []
            normal_text: Hello, how can I help you today?
      TOOLCALLING.batch.9.a:
        description: Empty model text
        model_text: ''
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        expected:
          dynamo_v1:
            calls: []
            normal_text: ''
      TOOLCALLING.batch.9.b:
        description: Blank / whitespace-only model text
        ref: dynamo
        model_text: '   '
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        expected:
          dynamo_v1:
            calls: []
            normal_text: ''
      TOOLCALLING.batch.10:
        description: Duplicate calls (same name twice, semicolon-separated)
        model_text: '<|python_tag|>{"name": "get_weather", "arguments": {"location": "NYC"}};{"name": "get_weather", "arguments": {"location": "LA"}}'
        tools:
        - *id005
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_weather
              arguments:
                location: LA
            normal_text: ''
      TOOLCALLING.batch.30.a:
        description: Llama JSON call separator `;` inside one argument string value
        ref: dynamo
        model_text: '<|python_tag|>{"name": "run_query", "arguments": {"sql": "SELECT a; SELECT b"}}'
        tools:
        - name: run_query
          parameters:
            type: object
            properties:
              sql:
                type: string
        expected:
          dynamo_v1:
            calls:
            - name: run_query
              arguments:
                sql: SELECT a; SELECT b
            normal_text: ''
      TOOLCALLING.batch.30.b:
        description: JSON structural delimiters `}` and `]` inside one argument string value
        ref: dynamo
        model_text: '<|python_tag|>{"name": "run_query", "arguments": {"sql": "SELECT value WHERE note has brace } and bracket ]"}}'
        tools:
        - name: run_query
          parameters:
            type: object
            properties:
              sql:
                type: string
        expected:
          dynamo_v1:
            calls:
            - name: run_query
              arguments:
                sql: SELECT value WHERE note has brace } and bracket ]
            normal_text: ''
      TOOLCALLING.batch.30.c:
