        ref: originated from https://github.com/vllm-project/vllm/blob/b53c507bc91f87e28b03e9b54bbff7c76e97d58b/tests/tool_parsers/common_tests.py#L302
        model_text: '<tool_call>

          <function=get_weather>

          <parameter=location>

          Tōkyō central

          </parameter>

          </function>

          </tool_call>'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: Tōkyō central
            normal_text: ''
      TOOLCALLING.batch.7.c:
        description: Schema-type-mismatch test 7.c — not yet authored for this family
        explanation: Schema-type-mismatch test 7.c not yet authored for qwen3_coder; argument-shape coverage is provided by 7.a / 7.b for this family.
      TOOLCALLING.batch.7.d:
        description: Nested-arguments test 7.d — not yet authored for this family
        explanation: Nested-arguments test 7.d not yet authored for qwen3_coder; see 7.a / 7.b for simpler argument shapes.
      TOOLCALLING.batch.7.e:
        description: Large / deep JSON-edge payload test 7.e — not yet authored for this family
        explanation: Large/deep JSON-edge payload test 7.e not yet authored for qwen3_coder; existing batch.7 coverage remains in 7.a-d.
      TOOLCALLING.batch.7.f:
        description: Numeric precision edge preserves integer-like number literal
        ref: dynamo
        model_text: '<tool_call>

          <function=set_limit>

          <parameter=count>9007199254740993</parameter>

          </function>

          </tool_call>'
        tools:
        - name: set_limit
          parameters:
            type: object
            properties:
              count:
                type: number
        expected:
          sglang_python:
            explanation: Dynamo preserves integer-like number literals before the f64 path; vLLM/SGLang round through f64 and lose precision above 2^53.
            calls:
            - name: set_limit
              arguments:
                count: 9007199254740992
            normal_text: null
