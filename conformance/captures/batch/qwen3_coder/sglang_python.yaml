  TOOLCALLING.batch.6.yaml:
    family: qwen3_coder
    mode: batch
    cases:
      TOOLCALLING.batch.6.a:
        description: Function block with no <parameter>
        ref: originated from https://github.com/vllm-project/vllm/blob/b53c507bc91f87e28b03e9b54bbff7c76e97d58b/tests/tool_parsers/common_tests.py#L260
        model_text: '<tool_call>

          <function=get_time>

          </function>

          </tool_call>'
        tools:
        - &id001
          name: get_time
          parameters:
            type: object
            properties: {}
        expected:
          sglang_python:
            calls:
            - name: get_time
              arguments: {}
            normal_text: ''
      TOOLCALLING.batch.6.b:
        description: Function block with extra whitespace inside
        ref: dynamo
        model_text: '<tool_call>

          <function=get_time>


          </function>

          </tool_call>'
        tools:
        - *id001
        expected:
          sglang_python:
            calls:
            - name: get_time
              arguments: {}
            normal_text: ''
      TOOLCALLING.batch.6.c:
        description: Empty-body variant 6.c — not yet authored for this family
        explanation: Empty-body variant 6.c not yet authored for qwen3_coder; see 6.a / 6.b for this family's empty / whitespace scenarios.
  TOOLCALLING.batch.8.yaml:
    family: qwen3_coder
    mode: batch
    cases:
      TOOLCALLING.batch.8.a:
        description: Narration before tool call only
        ref: dynamo
        model_text: 'I will check the weather. <tool_call>

          <function=get_weather>

          <parameter=location>

          NYC

          </parameter>

          </function>

          </tool_call>'
        tools:
        - &id002
          name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: 'I will check the weather. '
      TOOLCALLING.batch.8.b:
        description: Narration after tool call only
        ref: dynamo
        model_text: '<tool_call>

          <function=get_weather>

          <parameter=location>

          NYC

          </parameter>

          </function>

          </tool_call> Let me know if you need more.'
        tools:
        - *id002
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: ''
      TOOLCALLING.batch.8.c:
        description: Narration both before and after (sandwich)
        ref: originated from https://github.com/vllm-project/vllm/blob/b53c507bc91f87e28b03e9b54bbff7c76e97d58b/tests/tool_parsers/common_tests.py#L282
        model_text: 'I will check the weather. <tool_call>

          <function=get_weather>

          <parameter=location>

          NYC

          </parameter>

          </function>

          </tool_call> Let me know if you need more.'
        tools:
        - *id002
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: 'I will check the weather. '
      TOOLCALLING.batch.8.d:
        description: Narration between multiple tool calls
        ref: dynamo
        model_text: 'I will check the weather. <tool_call>

          <function=get_weather>

          <parameter=location>

          NYC

          </parameter>

          </function>

          </tool_call> Then check LA weather. <tool_call>

          <function=get_weather>

          <parameter=location>

          LA

          </parameter>

          </function>

          </tool_call>'
        tools:
        - *id002
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_weather
              arguments:
                location: LA
            normal_text: 'I will check the weather. '
  TOOLCALLING.stream.1.yaml:
    family: qwen3_coder
    model_label: Qwen 3 Coder
    mode: stream
    cases:
      TOOLCALLING.stream.1.a:
        description: Complete tool-call payload delivered in one content chunk
        ref: derived from TOOLCALLING.batch.1
        chunks:
        - delta_text: '<tool_call>

            <function=get_weather>

            <parameter=location>

            NYC

            </parameter>

            </function>

            </tool_call>'
        - delta_text: ''
          finish_reason: tool_calls
        tools: &id003
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: ''
      TOOLCALLING.stream.1.b:
        description: Complete tool call split across parser-significant boundaries
        ref: derived from TOOLCALLING.batch.1
        chunks:
        - delta_text: '<tool_call>

            '
        - delta_text: '<function=get_weather>

            '
        - delta_text: '<parameter=location>

            '
        - delta_text: 'NYC

            '
        - delta_text: '</parameter>

            '
        - delta_text: '</function>

            '
        - delta_text: </tool_call>
        - delta_text: ''
          finish_reason: tool_calls
        tools: *id003
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: ''
  TOOLCALLING.batch.7.yaml:
    family: qwen3_coder
    mode: batch
    cases:
      TOOLCALLING.batch.7.a:
        description: Multiple parameters (existing multi-arg shape)
        ref: originated from https://github.com/vllm-project/vllm/blob/b53c507bc91f87e28b03e9b54bbff7c76e97d58b/tests/tool_parsers/common_tests.py#L220
        model_text: '<tool_call>

          <function=book_flight>

          <parameter=destination>

          Paris

          </parameter>

          <parameter=passengers>

          2

          </parameter>

          <parameter=first_class>

          true

          </parameter>

          </function>

          </tool_call>'
        tools:
        - name: book_flight
          parameters:
            type: object
            properties:
              destination:
                type: string
              passengers:
                type: integer
              first_class:
                type: boolean
        expected:
          sglang_python:
            calls:
            - name: book_flight
              arguments:
                destination: Paris
                first_class: true
                passengers: 2
            normal_text: ''
      TOOLCALLING.batch.7.b:
