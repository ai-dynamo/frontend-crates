        description: Empty XTML tool name is not a required general fixture
        explanation: The required malformed-name contract is covered by TOOLCALLING.batch.4.c; an empty tool attribute is an optional grammar edge.
      TOOLCALLING.batch.11.c:
        description: Generation-primer header omission is unavailable
        explanation: Kimi K3 tool calls do not use a separate generation-primer message header in this corpus.
      TOOLCALLING.batch.30.a:
        description: Delimiter-character case is covered by the raw JSON marker case
        explanation: Kimi K3 raw JSON uses JSON's own string parser rather than a grammar-level call separator; the stronger marker-in-string case is TOOLCALLING.batch.30.c.
