  TOOLCALLING.batch.yaml:
    family: kimi_k3
    model_label: Kimi K3
    mode: batch
    cases:
      TOOLCALLING.batch.1:
        description: Canonical XTML single tool call with typed arguments
        ref: dynamo Kimi K3 XTML grammar
        model_text: <|open|>tools<|sep|><|open|>call tool="get_weather" index="1"<|sep|><|open|>argument key="location" type="string"<|sep|>NYC<|close|>argument<|sep|><|close|>call<|sep|><|close|>tools<|sep|>
        tools: &id003
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        unavailable: &id001
          dynamo_v1: Kimi K3 has no Dynamo v1 batch parser; use the Dynamo v2 stream-on-batch capture.
          vllm_python: No released vLLM Python Kimi K3 tool parser is registered.
          vllm_rust: No released vLLM Rust Kimi K3 tool parser is registered.
          sglang_python: No released SGLang Kimi K3 tool parser is registered.
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: ''
      TOOLCALLING.batch.2.a:
        description: Two calls in one XTML tools channel
        ref: derived from TOOLCALLING.batch.1
        model_text: <|open|>tools<|sep|><|open|>call tool="get_weather" index="1"<|sep|><|open|>argument key="location" type="string"<|sep|>NYC<|close|>argument<|sep|><|close|>call<|sep|><|open|>call tool="get_time" index="2"<|sep|><|open|>argument key="timezone" type="string"<|sep|>EST<|close|>argument<|sep|><|close|>call<|sep|><|close|>tools<|sep|>
        tools: &id002
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        - name: get_time
          parameters:
            type: object
            properties:
              timezone:
                type: string
        unavailable: *id001
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_time
              arguments:
                timezone: EST
            normal_text: ''
      TOOLCALLING.batch.2.b:
        description: Two back-to-back XTML tools channels
        ref: derived from TOOLCALLING.batch.2.a
        model_text: <|open|>tools<|sep|><|open|>call tool="get_weather" index="1"<|sep|><|open|>argument key="location" type="string"<|sep|>NYC<|close|>argument<|sep|><|close|>call<|sep|><|close|>tools<|sep|><|open|>tools<|sep|><|open|>call tool="get_time" index="2"<|sep|><|open|>argument key="timezone" type="string"<|sep|>EST<|close|>argument<|sep|><|close|>call<|sep|><|close|>tools<|sep|>
        tools: *id002
        unavailable: *id001
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: ''
      TOOLCALLING.batch.2.c:
        description: Multiple calls with visible XTML response text around them
        ref: derived from TOOLCALLING.batch.2.a
        model_text: <|open|>response<|sep|>Checking both. <|close|>response<|sep|><|open|>tools<|sep|><|open|>call tool="get_weather" index="1"<|sep|><|open|>argument key="location" type="string"<|sep|>NYC<|close|>argument<|sep|><|close|>call<|sep|><|open|>call tool="get_time" index="2"<|sep|><|open|>argument key="timezone" type="string"<|sep|>EST<|close|>argument<|sep|><|close|>call<|sep|><|close|>tools<|sep|><|open|>response<|sep|> Done.<|close|>response<|sep|>
        tools: *id002
        unavailable: *id001
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_time
              arguments:
                timezone: EST
            normal_text: 'Checking both. '
      TOOLCALLING.batch.2.d:
        description: Same tool name twice with distinct native indices
        ref: derived from TOOLCALLING.batch.2.a
        model_text: <|open|>tools<|sep|><|open|>call tool="get_weather" index="1"<|sep|><|open|>argument key="location" type="string"<|sep|>NYC<|close|>argument<|sep|><|close|>call<|sep|><|open|>call tool="get_weather" index="2"<|sep|><|open|>argument key="location" type="string"<|sep|>LA<|close|>argument<|sep|><|close|>call<|sep|><|close|>tools<|sep|>
        tools: *id003
        unavailable: *id001
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_weather
              arguments:
                location: LA
            normal_text: ''
      TOOLCALLING.batch.3:
        description: Plain text without XTML tool syntax
        model_text: Hello, how can I help you today?
        tools: *id003
        unavailable: *id001
        expected:
          dynamo_v1:
            calls: []
            normal_text: Hello, how can I help you today?
      TOOLCALLING.batch.4.a:
        description: Garbage inside an XTML tools channel
        ref: dynamo
        model_text: <|open|>tools<|sep|>nonsense<|close|>tools<|sep|>
        tools: *id003
        unavailable: *id001
        expected:
          dynamo_v1:
            calls: []
            normal_text: ''
      TOOLCALLING.batch.4.b:
        description: Invalid raw JSON arguments
        ref: dynamo
        model_text: <|open|>tools<|sep|><|open|>call tool="get_weather" index="1"<|sep|><|open|>json type="object"<|sep|>{"location":"NYC"<|close|>json<|sep|><|close|>call<|sep|><|close|>tools<|sep|>
        tools: *id003
        unavailable: *id001
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments: '{"location":"NYC"'
            normal_text: ''
      TOOLCALLING.batch.4.c:
        description: XTML call missing its tool attribute
        ref: dynamo
        model_text: <|open|>tools<|sep|><|open|>call index="1"<|sep|><|open|>argument key="location" type="string"<|sep|>NYC<|close|>argument<|sep|><|close|>call<|sep|><|close|>tools<|sep|>
        tools: *id003
        unavailable: *id001
        expected:
          dynamo_v1:
            calls: []
            normal_text: ''
      TOOLCALLING.batch.4.d:
        description: Typed argument missing its structural close
        ref: dynamo
        model_text: <|open|>tools<|sep|><|open|>call tool="get_weather" index="1"<|sep|><|open|>argument key="location" type="string"<|sep|>NYC<|close|>call<|sep|><|close|>tools<|sep|>
        tools: *id003
        unavailable: *id001
        expected:
          dynamo_v1:
            calls: []
            normal_text: ''
      TOOLCALLING.batch.4.e:
        description: Malformed XTML call followed by a valid complete call
        ref: dynamo
        model_text: <|open|>tools<|sep|><|open|>call tool="bad" index="1"<|sep|>not-an-argument<|open|>call tool="get_weather" index="2"<|sep|><|open|>argument key="location" type="string"<|sep|>Paris<|close|>argument<|sep|><|close|>call<|sep|><|close|>tools<|sep|>
        tools: *id003
        unavailable: *id001
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: Paris
            normal_text: ''
      TOOLCALLING.batch.4.f:
        description: XML tool-name tag form is not part of Kimi K3 XTML
        explanation: Kimi K3 identifies the tool in the call tag's tool attribute; it has no adjacent XML function-tag spelling.
      TOOLCALLING.batch.5.a:
        description: Complete call at EOF without the outer tools close
        ref: dynamo
        model_text: <|open|>tools<|sep|><|open|>call tool="get_weather" index="1"<|sep|><|open|>argument key="location" type="string"<|sep|>NYC<|close|>argument<|sep|><|close|>call<|sep|>
        tools: *id003
        unavailable: *id001
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: ''
      TOOLCALLING.batch.5.b:
        description: Orphan tools close marker without a matching open
        ref: dynamo
        model_text: I will check that. <|close|>tools<|sep|>
        tools: *id003
        unavailable: *id001
        expected:
          dynamo_v1:
            calls: []
            normal_text: ''
      TOOLCALLING.batch.5.c:
        description: EOF inside a typed string argument
        ref: dynamo
        model_text: <|open|>tools<|sep|><|open|>call tool="get_weather" index="1"<|sep|><|open|>argument key="location" type="string"<|sep|>Par
        tools: *id003
        unavailable: *id001
        expected:
          dynamo_v1:
            calls: []
            normal_text: ''
      TOOLCALLING.batch.5.d:
        description: First call complete and second call delimiter-terminated at EOF
        ref: dynamo
        model_text: <|open|>tools<|sep|><|open|>call tool="get_weather" index="1"<|sep|><|open|>argument key="location" type="string"<|sep|>Boston<|close|>argument<|sep|><|close|>call<|sep|><|open|>call tool="get_weather" index="2"<|sep|><|open|>argument key="location" type="string"<|sep|>New York<|close|>argument<|sep|>
        tools: *id003
        unavailable: *id001
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: Boston
            - name: get_weather
              arguments:
                location: New York
            normal_text: ''
      TOOLCALLING.batch.5.e:
        description: First call complete and second call truncated inside an argument
        ref: dynamo
        model_text: <|open|>tools<|sep|><|open|>call tool="get_weather" index="1"<|sep|><|open|>argument key="location" type="string"<|sep|>Boston<|close|>argument<|sep|><|close|>call<|sep|><|open|>call tool="get_weather" index="2"<|sep|><|open|>argument key="location" type="string"<|sep|>New York
        tools: *id003
        unavailable: *id001
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: Boston
            normal_text: ''
      TOOLCALLING.batch.5.f:
        description: Bare call before a wrapped call is not a Kimi K3 XTML form
        explanation: Kimi K3 calls are carried in an XTML tools channel; a bare call outside that channel is not a supported wire form.
      TOOLCALLING.batch.5.g:
        description: Orphan call-close recovery is not a Kimi K3 XTML form
        explanation: Kimi K3 has no bare call body terminated by an orphan outer close; orphan tools-close behavior is covered by TOOLCALLING.batch.5.b.
      TOOLCALLING.batch.6.a:
        description: Canonical empty raw JSON argument object
        ref: dynamo
        model_text: <|open|>tools<|sep|><|open|>call tool="get_time" index="1"<|sep|><|open|>json type="object"<|sep|>{}<|close|>json<|sep|><|close|>call<|sep|><|close|>tools<|sep|>
        tools: &id004
        - name: get_time
          parameters:
            type: object
            properties: {}
        unavailable: *id001
        expected:
          dynamo_v1:
            calls:
            - name: get_time
              arguments: {}
            normal_text: ''
      TOOLCALLING.batch.6.b:
        description: Spaced XTML spelling with whitespace inside an empty raw JSON object
        ref: dynamo Kimi K3 checkpoint spelling
        model_text: <|open|> tools <|sep|><|open|> call tool="get_time" index="1" <|sep|><|open|> json type="object" <|sep|>{ }<|close|> json <|sep|><|close|> call <|sep|><|close|> tools <|sep|>
        tools: *id004
        unavailable: *id001
        expected:
          dynamo_v1:
            calls:
            - name: get_time
              arguments: {}
            normal_text: ''
      TOOLCALLING.batch.6.c:
        description: Parameterless XTML call with no argument channel
        ref: dynamo
        model_text: <|open|>tools<|sep|><|open|>call tool="get_time" index="1"<|sep|><|close|>call<|sep|><|close|>tools<|sep|>
        tools: *id004
        unavailable: *id001
        expected:
          dynamo_v1:
            calls:
            - name: get_time
              arguments: {}
            normal_text: ''
      TOOLCALLING.batch.7.a:
        description: Typed XTML string, number, and boolean arguments
        ref: dynamo Kimi K3 XTML grammar
        model_text: <|open|>tools<|sep|><|open|>call tool="book_flight" index="1"<|sep|><|open|>argument key="destination" type="string"<|sep|>Paris<|close|>argument<|sep|><|open|>argument key="passengers" type="number"<|sep|>2<|close|>argument<|sep|><|open|>argument key="first_class" type="boolean"<|sep|>true<|close|>argument<|sep|><|close|>call<|sep|><|close|>tools<|sep|>
        tools:
        - name: book_flight
          parameters:
            type: object
            properties:
              destination:
                type: string
              passengers:
                type: integer
              first_class:
                type: boolean
        unavailable: *id001
        expected:
          dynamo_v1:
            calls:
            - name: book_flight
              arguments:
                destination: Paris
                passengers: 2
                first_class: true
            normal_text: ''
      TOOLCALLING.batch.7.b:
        description: Typed string preserves Unicode, quotes, and a newline
        ref: dynamo
        model_text: '<|open|>tools<|sep|><|open|>call tool="echo" index="1"<|sep|><|open|>argument key="value" type="string"<|sep|>Tokyo "central"

          next line<|close|>argument<|sep|><|close|>call<|sep|><|close|>tools<|sep|>'
        tools: &id006
        - name: echo
          parameters:
            type: object
            properties:
              value:
                type: string
        unavailable: *id001
        expected:
          dynamo_v1:
            calls:
            - name: echo
              arguments:
                value: 'Tokyo "central"

                  next line'
            normal_text: ''
      TOOLCALLING.batch.7.c:
        description: Typed string value where the tool schema declares an integer
        ref: dynamo
        model_text: <|open|>tools<|sep|><|open|>call tool="set_temperature" index="1"<|sep|><|open|>argument key="celsius" type="string"<|sep|>20<|close|>argument<|sep|><|close|>call<|sep|><|close|>tools<|sep|>
        tools:
        - name: set_temperature
          parameters:
            type: object
            properties:
              celsius:
                type: integer
        unavailable: *id001
        expected:
          dynamo_v1:
            calls:
            - name: set_temperature
              arguments:
                celsius: '20'
            normal_text: ''
      TOOLCALLING.batch.7.d:
        description: Raw JSON arguments preserve nested object and array values
        ref: dynamo Kimi K3 XTML grammar
        model_text: <|open|>tools<|sep|><|open|>call tool="process_data" index="1"<|sep|><|open|>json type="object"<|sep|>{"items":[1,2,3],"config":{"nested":true}}<|close|>json<|sep|><|close|>call<|sep|><|close|>tools<|sep|>
        tools: &id005
