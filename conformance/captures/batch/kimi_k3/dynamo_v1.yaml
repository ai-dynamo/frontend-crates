        description: Forward-unknown-tools mode is unavailable
        explanation: The Kimi K3 parser does not expose a request mode that changes unknown-tool forwarding.
      TOOLCALLING.batch.13.d:
        description: Unknown native tool index is unavailable
        explanation: Kimi K3 identifies tools by name; its index is a call identifier, not an offered-tool registry index.
      TOOLCALLING.batch.11.a:
        description: Redundant outer tool name is unavailable
        explanation: Kimi K3 has one tool name owner in the XTML call tag and no inner envelope name to disagree with it.
