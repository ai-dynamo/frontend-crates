  TOOLCALLING.batch.6.yaml:
    family: hermes
    mode: batch
    cases:
      TOOLCALLING.batch.6.a:
        description: 'Canonical "arguments": {}'
        ref: dynamo
        model_text: '<tool_call>{"name": "get_time", "arguments": {}}</tool_call>'
        tools:
        - &id001
          name: get_time
          parameters:
            type: object
            properties: {}
        expected:
          dynamo_v1:
            calls:
            - name: get_time
              arguments: {}
            normal_text: ''
      TOOLCALLING.batch.6.b:
        description: Whitespace inside arguments {}
        ref: dynamo
        model_text: '<tool_call>{"name": "get_time", "arguments": { }}</tool_call>'
        tools:
        - *id001
        expected:
          dynamo_v1:
            calls:
            - name: get_time
              arguments: {}
            normal_text: ''
      TOOLCALLING.batch.6.c:
        description: No arguments key
        ref: dynamo
        model_text: '<tool_call>{"name": "get_time"}</tool_call>'
        tools:
        - *id001
        expected:
          dynamo_v1:
            calls:
            - name: get_time
              arguments: {}
            normal_text: ''
  TOOLCALLING.batch.8.yaml:
    family: hermes
    mode: batch
    cases:
      TOOLCALLING.batch.8.a:
        description: Narration before tool call only
        ref: originated from https://github.com/vllm-project/vllm/blob/b53c507bc91f87e28b03e9b54bbff7c76e97d58b/tests/tool_parsers/test_hermes_tool_parser.py#L221
        model_text: 'I will check the weather. <tool_call>{"name": "get_weather", "arguments": {"location": "NYC"}}</tool_call>'
        tools:
        - &id002
          name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: I will check the weather.
      TOOLCALLING.batch.8.b:
        description: Narration after tool call only
        ref: dynamo
        model_text: '<tool_call>{"name": "get_weather", "arguments": {"location": "NYC"}}</tool_call> Let me know if you need more.'
        tools:
        - *id002
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: ''
      TOOLCALLING.batch.8.c:
        description: Narration both before and after (sandwich)
        ref: dynamo
        model_text: 'I will check the weather. <tool_call>{"name": "get_weather", "arguments": {"location": "NYC"}}</tool_call> Let me know if you need more.'
        tools:
        - *id002
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: I will check the weather.
      TOOLCALLING.batch.8.d:
        description: Narration between multiple tool calls
        ref: dynamo
        model_text: 'I will check the weather. <tool_call>{"name": "get_weather", "arguments": {"location": "NYC"}}</tool_call> Then check LA weather. <tool_call>{"name": "get_weather", "arguments": {"location": "LA"}}</tool_call>'
        tools:
        - *id002
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_weather
              arguments:
                location: LA
            normal_text: I will check the weather.
  TOOLCALLING.stream.1.yaml:
    family: hermes
    model_label: Hermes-3 / Llama variants
    mode: stream
    cases:
      TOOLCALLING.stream.1.a:
        description: Complete tool-call payload delivered in one content chunk
        ref: derived from TOOLCALLING.batch.1
        chunks:
        - delta_text: '<tool_call>{"name": "get_weather", "arguments": {"location": "NYC"}}</tool_call>'
        - delta_text: ''
          finish_reason: tool_calls
        tools: &id003
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: ''
      TOOLCALLING.stream.1.b:
        description: Complete tool call split across parser-significant boundaries
        ref: derived from TOOLCALLING.batch.1
        chunks:
        - delta_text: <tool_call>
        - delta_text: '{"name": "get_weather", '
        - delta_text: '"arguments": {"location": "NYC"}}'
        - delta_text: </tool_call>
        - delta_text: ''
          finish_reason: tool_calls
        tools: *id003
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: ''
  TOOLCALLING.batch.7.yaml:
    family: hermes
    mode: batch
    cases:
      TOOLCALLING.batch.7.a:
        description: Standard scalar types
        ref: dynamo
        model_text: '<tool_call>{"name": "book_flight", "arguments": {"destination": "Paris", "passengers": 2, "first_class": true}}</tool_call>'
        tools:
        - name: book_flight
          parameters:
            type: object
            properties:
              destination:
                type: string
              passengers:
                type: integer
              first_class:
                type: boolean
        expected:
          dynamo_v1:
            calls:
            - name: book_flight
              arguments:
                destination: Paris
                passengers: 2
                first_class: true
            normal_text: ''
      TOOLCALLING.batch.7.b:
        description: Unicode + escaped chars
        ref: dynamo
        model_text: '<tool_call>{"name": "get_weather", "arguments": {"location": "Tōkyō \"central\""}}</tool_call>'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: Tōkyō "central"
            normal_text: ''
      TOOLCALLING.batch.7.c:
        description: Schema mismatch — string value where schema declares integer
        ref: dynamo
        model_text: '<tool_call>{"name": "set_temperature", "arguments": {"celsius": "20"}}</tool_call>'
        tools:
        - name: set_temperature
          parameters:
            type: object
            properties:
              celsius:
                type: integer
        expected:
          dynamo_v1:
            calls:
            - name: set_temperature
              arguments:
                celsius: '20'
            normal_text: ''
      TOOLCALLING.batch.7.d:
        description: Nested object + array
        ref: originated from https://github.com/vllm-project/vllm/blob/b53c507bc91f87e28b03e9b54bbff7c76e97d58b/tests/tool_parsers/test_hermes_tool_parser.py#L284
        model_text: '<tool_call>{"name": "process_data", "arguments": {"items": [1,2,3], "config": {"nested": true}}}</tool_call>'
        tools:
        - name: process_data
          parameters:
            type: object
            properties:
              items:
                type: array
              config:
                type: object
        expected:
          dynamo_v1:
            calls:
            - name: process_data
              arguments:
                items:
                - 1
                - 2
                - 3
                config:
                  nested: true
            normal_text: ''
      TOOLCALLING.batch.7.e:
        description: Large / deep JSON-edge argument payload
        ref: dynamo
        model_text: '<tool_call>{"name": "process_data", "arguments": {"payload": {"regions": [{"name": "west", "scores": [1, 2, 3]}, {"name": "east", "scores": [4, 5, 6]}], "flags": {"enabled": true, "retry": null}, "empty": {}}}}</tool_call>'
        tools:
        - name: process_data
          parameters:
            type: object
            properties:
              payload:
                type: object
        expected:
          dynamo_v1:
            calls:
            - name: process_data
              arguments:
                payload:
                  regions:
                  - name: west
                    scores:
                    - 1
                    - 2
                    - 3
                  - name: east
                    scores:
                    - 4
                    - 5
                    - 6
                  flags:
                    enabled: true
                    retry: null
                  empty: {}
            normal_text: ''
      TOOLCALLING.batch.7.f:
        description: Numeric precision edge preserves integer-like number literal
        ref: https://huggingface.co/NousResearch/Hermes-3-Llama-3.1-8B/blob/9949f486fbfa5834405a9aabf4adb26fe5b29274/tokenizer_config.json
        model_text: '<tool_call>{"name": "set_limit", "arguments": {"count": 9007199254740993}}</tool_call>'
        tools:
        - name: set_limit
          parameters:
            type: object
            properties:
              count:
                type: number
        expected:
          dynamo_v1:
            calls:
            - name: set_limit
              arguments:
                count: 9007199254740993
            normal_text: ''
  TOOLCALLING.batch.5.yaml:
    family: hermes
    mode: batch
    cases:
      TOOLCALLING.batch.5.a:
        description: Missing </tool_call> end marker
        ref: dynamo
        model_text: '<tool_call>{"name": "get_weather", "arguments": {"location": "NYC"}}'
        tools:
        - &id004
          name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: ''
      TOOLCALLING.batch.5.b:
        description: Closing </tool_call> without matching <tool_call> open
        ref: dynamo
        model_text: '{"name": "get_weather", "arguments": {"location": "NYC"}}</tool_call>'
        tools:
        - *id004
        expected:
          dynamo_v1:
            calls: []
            normal_text: '{"name": "get_weather", "arguments": {"location": "NYC"}}'
      TOOLCALLING.batch.5.c:
        description: Truncation mid-arguments JSON
        ref: originated from https://github.com/vllm-project/vllm/blob/b53c507bc91f87e28b03e9b54bbff7c76e97d58b/tests/tool_parsers/test_hermes_tool_parser.py#L356
        model_text: '<tool_call>{"name": "get_weather", "arguments": {"loc'
        tools:
        - *id004
        expected:
          dynamo_v1:
            calls: []
            normal_text: ''
      TOOLCALLING.batch.5.d:
        description: Multi-call, last call missing only end marker (body complete)
        ref: dynamo
        model_text: 'I''ll start by fetching the weather for both Boston and New York at the same time!<tool_call>{"name": "get_weather", "arguments": {"location": "Boston"}}</tool_call><tool_call>{"name": "get_weather", "arguments": {"location": "New York"}}'
        tools:
        - *id004
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: Boston
            normal_text: I'll start by fetching the weather for both Boston and New York at the same time!
      TOOLCALLING.batch.5.e:
        description: Multi-call, last call truncated mid-arg-value
        ref: dynamo
        model_text: 'I''ll start by fetching the weather for both Boston and New York at the same time!<tool_call>{"name": "get_weather", "arguments": {"location": "Boston"}}</tool_call><tool_call>{"name": "get_weather", "arguments": {"location": "New York'
        tools:
        - *id004
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: Boston
            normal_text: I'll start by fetching the weather for both Boston and New York at the same time!
      TOOLCALLING.batch.5.f:
        description: Bare valid call before a complete wrapped call — n/a for this family's syntax
        explanation: TOOLCALLING.batch.5.f tests recovery of a leading bare (unwrapped) call body that precedes a properly-wrapped call. It applies only to families that admit a bare-body call form (deepseek_v4, gemma4, glm47, kimi_k2, minimax_m2, qwen3_coder). Hermes uses paired <tool_call>...</tool_call> fences with no bare-body form, so this case is not applicable; truncation/orphan coverage for this family lives in 5.a-5.e.
      TOOLCALLING.batch.5.g:
        description: Orphan close marker after prefix prose — n/a for this family's syntax
        explanation: TOOLCALLING.batch.5.g tests prefix prose followed by a bare (unwrapped) call body terminated by an orphan close marker. It applies only to families that admit a bare-body call form (deepseek_v4, gemma4, glm47, kimi_k2, minimax_m2, qwen3_coder). Hermes uses paired <tool_call>...</tool_call> fences with no bare-body form, so this case is not applicable; orphan-close coverage for this family lives in 5.b.
  TOOLCALLING.batch.7-8.yaml:
    family: hermes
    mode: batch
    cases:
      TOOLCALLING.batch.7-8:
        description: 'Ambiguous object union branches: multiple object-capable alternatives must retain the string-preserving fallback rather than choose one branch arbitrarily. Constructed native MiniMax M3 regression probe for PR #270.'
        ref: https://github.com/ai-dynamo/frontend-crates/pull/270
        explanation: This probe exercises MiniMax M3 native XML and nested schema coercion; it does not apply to this parser family.
  TOOLCALLING.batch.7-null-ref.yaml:
    family: hermes
    mode: batch
    cases:
      TOOLCALLING.batch.7-4.inline:
        description: 'PR #268 inline control: a nullable string parameter converts bare null to JSON null.'
        explanation: This probe uses GLM XML argument markers and tests its schema-dependent null coercion; it does not apply to this parser family.
      TOOLCALLING.batch.7-5.inline:
        description: 'PR #268 inline control: a string-only parameter preserves bare null as string "null".'
        explanation: This probe uses GLM XML argument markers and tests its schema-dependent null coercion; it does not apply to this parser family.
      TOOLCALLING.batch.7-4.ref:
        description: 'PR #268 local reference: a nullable string definition on the tool parameters root permits JSON null.'
        explanation: This probe uses GLM XML argument markers and tests its schema-dependent null coercion; it does not apply to this parser family.
      TOOLCALLING.batch.7-5.ref:
        description: 'PR #268 local reference: a string-only definition on the tool parameters root excludes JSON null.'
        explanation: This probe uses GLM XML argument markers and tests its schema-dependent null coercion; it does not apply to this parser family.
  TOOLCALLING.batch.yaml:
    family: hermes
    model_label: Hermes-3 / Llama variants
    mode: batch
    cases:
      TOOLCALLING.batch.1:
        description: Single tool call (happy path)
        model_text: '<tool_call>{"name": "get_weather", "arguments": {"location": "NYC"}}</tool_call>'
        tools:
        - &id005
          name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: ''
      TOOLCALLING.batch.3:
        description: No tool call (plain text)
        model_text: Hello, how can I help you today?
        tools:
        - *id005
        expected:
          dynamo_v1:
            calls: []
            normal_text: Hello, how can I help you today?
      TOOLCALLING.batch.9.a:
        description: Empty model text
        model_text: ''
        tools:
        - *id005
        expected:
          dynamo_v1:
            calls: []
            normal_text: ''
      TOOLCALLING.batch.9.b:
        description: Blank / whitespace-only model text
        ref: dynamo
        model_text: '   '
        tools:
        - *id005
        expected:
          dynamo_v1:
            calls: []
            normal_text: ''
      TOOLCALLING.batch.10:
        description: Duplicate calls (same name twice)
        model_text: '<tool_call>{"name": "get_weather", "arguments": {"location": "NYC"}}</tool_call><tool_call>{"name": "get_weather", "arguments": {"location": "LA"}}</tool_call>'
        tools:
        - *id005
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_weather
              arguments:
                location: LA
            normal_text: ''
      TOOLCALLING.batch.13.a:
        description: Unknown-only call under default behavior
        ref: originated from https://github.com/sgl-project/sglang/blob/612785ffdcaf35552f1ed433a981d596ca9fe900/test/registered/unit/function_call/test_unknown_tool_name.py#L29
        model_text: '<tool_call>{"name": "unknown_tool", "arguments": {"location": "NYC"}}</tool_call>'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        expected:
          dynamo_v1:
            calls:
            - name: unknown_tool
              arguments:
                location: NYC
            normal_text: ''
      TOOLCALLING.batch.13.c:
        description: Mixed known and unknown calls in one response
        ref: dynamo
