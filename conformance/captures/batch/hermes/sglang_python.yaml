  TOOLCALLING.batch.6.yaml:
    family: hermes
    mode: batch
    cases:
      TOOLCALLING.batch.6.a:
        description: 'Canonical "arguments": {}'
        ref: dynamo
        model_text: '<tool_call>{"name": "get_time", "arguments": {}}</tool_call>'
        tools:
        - &id001
          name: get_time
          parameters:
            type: object
            properties: {}
        expected:
          sglang_python:
            calls:
            - name: get_time
              arguments: {}
            normal_text: ''
      TOOLCALLING.batch.6.b:
        description: Whitespace inside arguments {}
        ref: dynamo
        model_text: '<tool_call>{"name": "get_time", "arguments": { }}</tool_call>'
        tools:
        - *id001
        expected:
          sglang_python:
            calls:
            - name: get_time
              arguments: {}
            normal_text: ''
      TOOLCALLING.batch.6.c:
        description: No arguments key
        ref: dynamo
        model_text: '<tool_call>{"name": "get_time"}</tool_call>'
        tools:
        - *id001
        expected:
          sglang_python:
            calls:
            - name: get_time
              arguments: {}
            normal_text: ''
  TOOLCALLING.batch.8.yaml:
    family: hermes
    mode: batch
    cases:
      TOOLCALLING.batch.8.a:
        description: Narration before tool call only
        ref: originated from https://github.com/vllm-project/vllm/blob/b53c507bc91f87e28b03e9b54bbff7c76e97d58b/tests/tool_parsers/test_hermes_tool_parser.py#L221
        model_text: 'I will check the weather. <tool_call>{"name": "get_weather", "arguments": {"location": "NYC"}}</tool_call>'
        tools:
        - &id002
          name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: I will check the weather.
      TOOLCALLING.batch.8.b:
        description: Narration after tool call only
        ref: dynamo
        model_text: '<tool_call>{"name": "get_weather", "arguments": {"location": "NYC"}}</tool_call> Let me know if you need more.'
        tools:
        - *id002
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: ''
      TOOLCALLING.batch.8.c:
        description: Narration both before and after (sandwich)
        ref: dynamo
        model_text: 'I will check the weather. <tool_call>{"name": "get_weather", "arguments": {"location": "NYC"}}</tool_call> Let me know if you need more.'
        tools:
        - *id002
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: I will check the weather.
      TOOLCALLING.batch.8.d:
        description: Narration between multiple tool calls
        ref: dynamo
        model_text: 'I will check the weather. <tool_call>{"name": "get_weather", "arguments": {"location": "NYC"}}</tool_call> Then check LA weather. <tool_call>{"name": "get_weather", "arguments": {"location": "LA"}}</tool_call>'
        tools:
        - *id002
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_weather
              arguments:
                location: LA
            normal_text: I will check the weather.
  TOOLCALLING.stream.1.yaml:
    family: hermes
    model_label: Hermes-3 / Llama variants
    mode: stream
    cases:
      TOOLCALLING.stream.1.a:
        description: Complete tool-call payload delivered in one content chunk
        ref: derived from TOOLCALLING.batch.1
        chunks:
        - delta_text: '<tool_call>{"name": "get_weather", "arguments": {"location": "NYC"}}</tool_call>'
        - delta_text: ''
          finish_reason: tool_calls
        tools: &id003
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: ''
      TOOLCALLING.stream.1.b:
        description: Complete tool call split across parser-significant boundaries
        ref: derived from TOOLCALLING.batch.1
        chunks:
        - delta_text: <tool_call>
        - delta_text: '{"name": "get_weather", '
        - delta_text: '"arguments": {"location": "NYC"}}'
        - delta_text: </tool_call>
        - delta_text: ''
          finish_reason: tool_calls
        tools: *id003
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: ''
  TOOLCALLING.batch.7.yaml:
    family: hermes
    mode: batch
    cases:
      TOOLCALLING.batch.7.a:
        description: Standard scalar types
        ref: dynamo
        model_text: '<tool_call>{"name": "book_flight", "arguments": {"destination": "Paris", "passengers": 2, "first_class": true}}</tool_call>'
        tools:
        - name: book_flight
          parameters:
            type: object
            properties:
              destination:
                type: string
              passengers:
                type: integer
              first_class:
                type: boolean
        expected:
          sglang_python:
            calls:
            - name: book_flight
              arguments:
                first_class: true
                passengers: 2
                destination: Paris
            normal_text: ''
      TOOLCALLING.batch.7.b:
        description: Unicode + escaped chars
        ref: dynamo
        model_text: '<tool_call>{"name": "get_weather", "arguments": {"location": "Tōkyō \"central\""}}</tool_call>'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: Tōkyō "central"
            normal_text: ''
      TOOLCALLING.batch.7.c:
        description: Schema mismatch — string value where schema declares integer
        ref: dynamo
        model_text: '<tool_call>{"name": "set_temperature", "arguments": {"celsius": "20"}}</tool_call>'
        tools:
        - name: set_temperature
          parameters:
            type: object
            properties:
              celsius:
                type: integer
        expected:
          sglang_python:
            calls:
            - name: set_temperature
              arguments:
                celsius: '20'
            normal_text: ''
      TOOLCALLING.batch.7.d:
        description: Nested object + array
        ref: originated from https://github.com/vllm-project/vllm/blob/b53c507bc91f87e28b03e9b54bbff7c76e97d58b/tests/tool_parsers/test_hermes_tool_parser.py#L284
        model_text: '<tool_call>{"name": "process_data", "arguments": {"items": [1,2,3], "config": {"nested": true}}}</tool_call>'
        tools:
        - name: process_data
          parameters:
            type: object
            properties:
              items:
                type: array
              config:
                type: object
        expected:
          sglang_python:
            calls:
            - name: process_data
              arguments:
                items:
                - 1
                - 2
                - 3
                config:
                  nested: true
            normal_text: ''
      TOOLCALLING.batch.7.e:
        description: Large / deep JSON-edge argument payload
        ref: dynamo
        model_text: '<tool_call>{"name": "process_data", "arguments": {"payload": {"regions": [{"name": "west", "scores": [1, 2, 3]}, {"name": "east", "scores": [4, 5, 6]}], "flags": {"enabled": true, "retry": null}, "empty": {}}}}</tool_call>'
        tools:
        - name: process_data
          parameters:
            type: object
            properties:
              payload:
                type: object
        expected:
          sglang_python:
            calls:
            - name: process_data
              arguments:
                payload:
                  regions:
                  - name: west
                    scores:
                    - 1
                    - 2
                    - 3
                  - name: east
                    scores:
                    - 4
                    - 5
                    - 6
                  flags:
                    enabled: true
                    retry: null
                  empty: {}
            normal_text: ''
      TOOLCALLING.batch.7.f:
        description: Numeric precision edge preserves integer-like number literal
        ref: https://huggingface.co/NousResearch/Hermes-3-Llama-3.1-8B/blob/9949f486fbfa5834405a9aabf4adb26fe5b29274/tokenizer_config.json
        model_text: '<tool_call>{"name": "set_limit", "arguments": {"count": 9007199254740993}}</tool_call>'
        tools:
        - name: set_limit
          parameters:
            type: object
            properties:
              count:
                type: number
        expected:
          sglang_python:
            calls:
            - name: set_limit
              arguments:
                count: 9007199254740993
            normal_text: ''
  TOOLCALLING.batch.5.yaml:
    family: hermes
    mode: batch
    cases:
      TOOLCALLING.batch.5.a:
        description: Missing </tool_call> end marker
        ref: dynamo
        model_text: '<tool_call>{"name": "get_weather", "arguments": {"location": "NYC"}}'
        tools:
        - &id004
          name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: ''
      TOOLCALLING.batch.5.b:
        description: Closing </tool_call> without matching <tool_call> open
        ref: dynamo
        model_text: '{"name": "get_weather", "arguments": {"location": "NYC"}}</tool_call>'
        tools:
        - *id004
        expected:
          sglang_python:
            explanation: vLLM and SGLang leave the orphan </tool_call> in normal_text when the opening <tool_call> marker is missing; Dynamo strips the stray end marker (no leak). Non-parity by design.
            calls: []
            normal_text: '{"name": "get_weather", "arguments": {"location": "NYC"}}</tool_call>'
      TOOLCALLING.batch.5.c:
        description: Truncation mid-arguments JSON
