        expected:
          sglang_python:
            explanation: vLLM and SGLang surface the truncated <tool_call> body as raw text; Dynamo suppresses the unterminated call (open <tool_call>, no close, nothing salvaged) so no markup leaks. Non-parity by design.
            calls: []
            normal_text: '<tool_call>{"name": "get_weather", "arguments": {"loc'
      TOOLCALLING.batch.5.d:
        description: Multi-call, last call missing only end marker (body complete)
        ref: dynamo
