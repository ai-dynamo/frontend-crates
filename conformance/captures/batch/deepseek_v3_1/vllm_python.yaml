  TOOLCALLING.batch.6.yaml:
    family: deepseek_v3_1
    mode: batch
    cases:
      TOOLCALLING.batch.6.a:
        description: Canonical empty {} after tool_sep
        ref: dynamo
        model_text: <｜tool▁calls▁begin｜><｜tool▁call▁begin｜>get_time<｜tool▁sep｜>{}<｜tool▁call▁end｜><｜tool▁calls▁end｜>
        tools:
        - &id001
          name: get_time
          parameters:
            type: object
            properties: {}
        expected:
          vllm_python:
            calls:
            - name: get_time
              arguments: {}
            normal_text: ''
      TOOLCALLING.batch.6.b:
        description: Whitespace inside empty { }
        ref: dynamo
        model_text: <｜tool▁calls▁begin｜><｜tool▁call▁begin｜>get_time<｜tool▁sep｜>{ }<｜tool▁call▁end｜><｜tool▁calls▁end｜>
