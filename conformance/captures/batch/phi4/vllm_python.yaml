  TOOLCALLING.batch.4.yaml:
    family: phi4
    mode: batch
    cases:
      TOOLCALLING.batch.4.a:
        description: functools[ wrapper with garbage
        ref: originated from https://github.com/vllm-project/vllm/blob/b53c507bc91f87e28b03e9b54bbff7c76e97d58b/tests/tool_parsers/common_tests.py#L322
        model_text: functools[nonsense]
        tools:
        - &id008
          name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        expected:
          vllm_python:
            calls: []
            normal_text: ''
      TOOLCALLING.batch.4.b:
        description: Missing close brace
        ref: dynamo
        model_text: 'functools[{"name": "get_weather", "arguments": {"location": "NYC"]'
        tools:
        - *id008
        expected:
          vllm_python:
            calls: []
            normal_text: ''
      TOOLCALLING.batch.4.c:
        description: Missing name key
        ref: dynamo
        model_text: 'functools[{"arguments": {"location": "NYC"}}]'
        tools:
        - *id008
        expected:
          vllm_python:
            calls: []
            normal_text: 'functools[{"arguments": {"location": "NYC"}}]'
      TOOLCALLING.batch.4.d:
        description: Missing closing ]
        ref: dynamo
        model_text: 'functools[{"name": "get_weather", "arguments": {"location": "NYC"}}'
        tools:
        - *id008
        expected:
          vllm_python:
            calls: []
            normal_text: 'functools[{"name": "get_weather", "arguments": {"location": "NYC"}}'
      TOOLCALLING.batch.4.e:
        description: Malformed-prefix recovery — n/a for this family's syntax
        explanation: 'TOOLCALLING.batch.4.e is specific to llama3_json''s raw JSON-object scanner: a malformed JSON-looking prefix is followed by a complete JSON object, and the detector may resynchronize on the later object. This family uses a framed parser grammar instead of that raw JSON-prefix scanner; malformed-input coverage for this family lives in TOOLCALLING.batch.4.a through 4.d.'
      TOOLCALLING.batch.4.f:
        description: Tool-name XML tag case - n/a for this family's syntax
        explanation: TOOLCALLING.batch.4.f is specific to Qwen3-Coder XML syntax, where the model may emit a tool-name tag such as <terminal> inside <tool_call> instead of the required <function=Terminal> opener. This family does not use Qwen3-Coder's <function=...> opener.
