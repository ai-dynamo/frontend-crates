          {"count":9007199254740993}

          ```<｜tool▁call▁end｜><｜tool▁calls▁end｜>'
        tools:
        - name: set_limit
          parameters:
            type: object
            properties:
              count:
                type: number
        expected:
          dynamo_v1:
            calls:
            - name: set_limit
              arguments:
                count: 9007199254740993
            normal_text: ''
