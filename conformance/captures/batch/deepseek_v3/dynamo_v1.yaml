  TOOLCALLING.batch.6.yaml:
    family: deepseek_v3
    mode: batch
    cases:
      TOOLCALLING.batch.6.a:
        description: Canonical empty {} in fenced code block
        ref: originated from https://github.com/vllm-project/vllm/blob/b53c507bc91f87e28b03e9b54bbff7c76e97d58b/tests/tool_parsers/common_tests.py#L260
        model_text: '<｜tool▁calls▁begin｜><｜tool▁call▁begin｜>function<｜tool▁sep｜>get_time

          ```json

          {}

          ```<｜tool▁call▁end｜><｜tool▁calls▁end｜>'
        tools:
        - &id001
          name: get_time
          parameters:
            type: object
            properties: {}
        expected:
          dynamo_v1:
            calls:
            - name: get_time
              arguments: {}
            normal_text: ''
      TOOLCALLING.batch.6.b:
        description: Whitespace inside empty { } (newlines)
        ref: dynamo
        model_text: '<｜tool▁calls▁begin｜><｜tool▁call▁begin｜>function<｜tool▁sep｜>get_time

          ```json

          {

          }

          ```<｜tool▁call▁end｜><｜tool▁calls▁end｜>'
        tools:
        - *id001
        expected:
          dynamo_v1:
            calls:
            - name: get_time
              arguments: {}
            normal_text: ''
      TOOLCALLING.batch.6.c:
        description: No fenced JSON block (function name only)
        ref: dynamo
        model_text: <｜tool▁calls▁begin｜><｜tool▁call▁begin｜>function<｜tool▁sep｜>get_time<｜tool▁call▁end｜><｜tool▁calls▁end｜>
        tools:
        - *id001
        expected:
          dynamo_v1:
            calls: []
            normal_text: ''
  TOOLCALLING.batch.8.yaml:
    family: deepseek_v3
    mode: batch
    cases:
      TOOLCALLING.batch.8.a:
        description: Narration before tool call only
        ref: dynamo
        model_text: 'I will check the weather. <｜tool▁calls▁begin｜><｜tool▁call▁begin｜>function<｜tool▁sep｜>get_weather

          ```json

          {"location": "NYC"}

          ```<｜tool▁call▁end｜><｜tool▁calls▁end｜>'
        tools:
        - &id002
          name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: 'I will check the weather. '
      TOOLCALLING.batch.8.b:
        description: Narration after tool call only
        ref: dynamo
        model_text: '<｜tool▁calls▁begin｜><｜tool▁call▁begin｜>function<｜tool▁sep｜>get_weather

          ```json

          {"location": "NYC"}

          ```<｜tool▁call▁end｜><｜tool▁calls▁end｜> Let me know if you need more.'
        tools:
        - *id002
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: ''
      TOOLCALLING.batch.8.c:
        description: Narration both before and after (sandwich)
        ref: originated from https://github.com/vllm-project/vllm/blob/b53c507bc91f87e28b03e9b54bbff7c76e97d58b/tests/tool_parsers/common_tests.py#L282
        model_text: 'I will check the weather. <｜tool▁calls▁begin｜><｜tool▁call▁begin｜>function<｜tool▁sep｜>get_weather

          ```json

          {"location": "NYC"}

          ```<｜tool▁call▁end｜><｜tool▁calls▁end｜> Let me know if you need more.'
        tools:
        - *id002
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: 'I will check the weather. '
      TOOLCALLING.batch.8.d:
        description: Narration between multiple tool calls
        ref: dynamo
        model_text: 'I will check the weather. <｜tool▁calls▁begin｜><｜tool▁call▁begin｜>function<｜tool▁sep｜>get_weather

          ```json

          {"location": "NYC"}

          ```<｜tool▁call▁end｜><｜tool▁calls▁end｜> Then check LA weather. <｜tool▁calls▁begin｜><｜tool▁call▁begin｜>function<｜tool▁sep｜>get_weather

          ```json

          {"location": "LA"}

          ```<｜tool▁call▁end｜><｜tool▁calls▁end｜>'
        tools:
        - *id002
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_weather
              arguments:
                location: LA
            normal_text: 'I will check the weather. '
  TOOLCALLING.stream.1.yaml:
    family: deepseek_v3
    model_label: DeepSeek V3
    mode: stream
    cases:
      TOOLCALLING.stream.1.a:
