documents:
  TOOLCALLING.batch.7-6.yaml:
    family: jamba
    mode: batch
    cases:
      TOOLCALLING.batch.7-6:
        description: 'Nested object unions: select the unique object branch of anyOf and oneOf to type integer and boolean members. Preserve scalar string/object children, nullable object null, and real nested objects. Constructed native MiniMax M3 regression probe for PR #270.'
        ref: https://github.com/ai-dynamo/frontend-crates/pull/270
        explanation: This probe exercises MiniMax M3 native XML and nested schema coercion; it does not apply to this parser family.
  TOOLCALLING.batch.7-null.yaml:
    family: jamba
    mode: batch
    cases:
      TOOLCALLING.batch.7-4:
        description: 'MiniMax M3 v1 null-schema regression (PR #269).'
        explanation: This constructed probe uses MiniMax M3 native XML and exercises its v1 scalar coercion; it does not apply to this parser family.
      TOOLCALLING.batch.7-4.anyof:
        description: 'MiniMax M3 v1 null-schema regression (PR #269).'
        explanation: This constructed probe uses MiniMax M3 native XML and exercises its v1 scalar coercion; it does not apply to this parser family.
