  TOOLCALLING.batch.6.yaml:
    family: jamba
    mode: batch
    cases:
      TOOLCALLING.batch.6.a:
        description: 'Canonical "arguments": {}'
        ref: dynamo
        model_text: '<tool_calls>[{"name": "get_time", "arguments": {}}]</tool_calls>'
        tools:
        - &id001
          name: get_time
          parameters:
            type: object
            properties: {}
        expected:
          vllm_python:
            calls:
            - name: get_time
              arguments: {}
            normal_text: ''
      TOOLCALLING.batch.6.b:
        description: Whitespace inside arguments {}
        ref: dynamo
        model_text: '<tool_calls>[{"name": "get_time", "arguments": { }}]</tool_calls>'
        tools:
        - *id001
        expected:
          vllm_python:
            calls:
            - name: get_time
              arguments: {}
            normal_text: ''
      TOOLCALLING.batch.6.c:
        description: No arguments key
        ref: dynamo
        model_text: '<tool_calls>[{"name": "get_time"}]</tool_calls>'
        tools:
        - *id001
        expected:
          vllm_python:
            explanation: vLLM's jamba detector leaves the raw <tool_calls> envelope in normal_text when a call object has no arguments key. Dynamo discards it so no tool-call markup reaches the user.
            calls: []
            normal_text: '<tool_calls>[{"name": "get_time"}]</tool_calls>'
  TOOLCALLING.batch.8.yaml:
    family: jamba
    mode: batch
    cases:
      TOOLCALLING.batch.8.a:
        description: Narration before tool call only
        ref: dynamo
        model_text: 'I will check the weather. <tool_calls>[{"name": "get_weather", "arguments": {"location": "NYC"}}]</tool_calls>'
        tools:
        - &id002
          name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        expected:
          vllm_python:
            explanation: 'Cosmetic whitespace only: Dynamo trims the trailing space between the narration and the <tool_calls> fence; vLLM preserves it. Calls are identical.'
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: 'I will check the weather. '
      TOOLCALLING.batch.8.b:
        description: Narration after tool call only
        ref: dynamo
        model_text: '<tool_calls>[{"name": "get_weather", "arguments": {"location": "NYC"}}]</tool_calls> Let me know if you need more.'
        tools:
        - *id002
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: ''
      TOOLCALLING.batch.8.c:
        description: Narration both before and after (sandwich)
        ref: dynamo
        model_text: 'I will check the weather. <tool_calls>[{"name": "get_weather", "arguments": {"location": "NYC"}}]</tool_calls> Let me know if you need more.'
        tools:
        - *id002
        expected:
          vllm_python:
            explanation: 'Cosmetic whitespace only: Dynamo trims the trailing space between the narration and the <tool_calls> fence; vLLM preserves it. Calls are identical.'
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: 'I will check the weather. '
      TOOLCALLING.batch.8.d:
        description: Narration between multiple tool calls
        ref: dynamo
        model_text: 'I will check the weather. <tool_calls>[{"name": "get_weather", "arguments": {"location": "NYC"}}]</tool_calls> Then check LA weather. <tool_calls>[{"name": "get_weather", "arguments": {"location": "LA"}}]</tool_calls>'
        tools:
        - *id002
        expected:
          vllm_python:
            explanation: 'Known Dynamo limitation: the jamba framed parser spans from the first <tool_calls> opener to the last </tool_calls> closer, so narration between two separate fences lands inside the captured region and breaks the JSON parse, dropping both calls and keeping only the leading narration. vLLM extracts the first call. Multiple-disjoint-fence support is a base JSON-parser change tracked as a follow-up, out of scope for the never-leak fix.'
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: 'I will check the weather. '
  TOOLCALLING.stream.1.yaml:
    family: jamba
    model_label: AI21 Jamba
    mode: stream
    cases:
      TOOLCALLING.stream.1.a:
        description: Complete tool-call payload delivered in one content chunk
        ref: derived from TOOLCALLING.batch.1
        chunks:
        - delta_text: '<tool_calls>[{"name": "get_weather", "arguments": {"location": "NYC"}}]</tool_calls>'
        - delta_text: ''
          finish_reason: tool_calls
        tools: &id003
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        expected:
          vllm_python:
            explanation: vLLM's streaming jamba detector emits the call name but drops the arguments to an empty object. Dynamo's streaming jail surfaces the full arguments.
            calls:
            - name: get_weather
              arguments: {}
            normal_text: ''
      TOOLCALLING.stream.1.b:
        description: Complete tool call split across parser-significant boundaries
        ref: derived from TOOLCALLING.batch.1
        chunks:
        - delta_text: <tool_calls>
        - delta_text: '[{"name": "get_weather", '
        - delta_text: '"arguments": {"location": "NYC"}}]'
        - delta_text: </tool_calls>
        - delta_text: ''
          finish_reason: tool_calls
        tools: *id003
        expected:
          vllm_python:
            explanation: vLLM's streaming jamba detector emits the call name but drops the arguments to an empty object. Dynamo's streaming jail surfaces the full arguments.
            calls:
            - name: get_weather
              arguments: {}
            normal_text: ''
  TOOLCALLING.batch.7.yaml:
    family: jamba
    mode: batch
    cases:
      TOOLCALLING.batch.7.a:
        description: Standard scalar types
        ref: dynamo
        model_text: '<tool_calls>[{"name": "book_flight", "arguments": {"destination": "Paris", "passengers": 2, "first_class": true}}]</tool_calls>'
        tools:
        - name: book_flight
          parameters:
            type: object
            properties:
              destination:
                type: string
              passengers:
                type: integer
              first_class:
                type: boolean
        expected:
          vllm_python:
            calls:
            - name: book_flight
              arguments:
                first_class: true
                destination: Paris
                passengers: 2
            normal_text: ''
      TOOLCALLING.batch.7.b:
        description: Unicode + escaped chars
        ref: dynamo
        model_text: '<tool_calls>[{"name": "get_weather", "arguments": {"location": "Tōkyō \"central\""}}]</tool_calls>'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: Tōkyō "central"
            normal_text: ''
      TOOLCALLING.batch.7.c:
        description: Schema mismatch — string value where schema declares integer
        ref: dynamo
        model_text: '<tool_calls>[{"name": "set_temperature", "arguments": {"celsius": "20"}}]</tool_calls>'
        tools:
        - name: set_temperature
          parameters:
            type: object
            properties:
              celsius:
                type: integer
        expected:
          vllm_python:
            calls:
            - name: set_temperature
              arguments:
                celsius: '20'
            normal_text: ''
      TOOLCALLING.batch.7.d:
        description: Nested object + array
        ref: dynamo
        model_text: '<tool_calls>[{"name": "process_data", "arguments": {"items": [1,2,3], "config": {"nested": true}}}]</tool_calls>'
        tools:
        - name: process_data
          parameters:
            type: object
            properties:
              items:
                type: array
              config:
                type: object
        expected:
          vllm_python:
            calls:
            - name: process_data
              arguments:
                items:
                - 1
                - 2
                - 3
                config:
                  nested: true
            normal_text: ''
      TOOLCALLING.batch.7.e:
        description: Large / deep JSON-edge argument payload
        ref: dynamo
        model_text: '<tool_calls>[{"name": "process_data", "arguments": {"payload": {"regions": [{"name": "west", "scores": [1, 2, 3]}, {"name": "east", "scores": [4, 5, 6]}], "flags": {"enabled": true, "retry": null}, "empty": {}}}}]</tool_calls>'
        tools:
        - name: process_data
          parameters:
            type: object
            properties:
              payload:
                type: object
        expected:
          vllm_python:
            calls:
            - name: process_data
              arguments:
                payload:
                  regions:
                  - name: west
                    scores:
                    - 1
                    - 2
                    - 3
                  - name: east
                    scores:
                    - 4
                    - 5
                    - 6
                  flags:
                    enabled: true
                    retry: null
                  empty: {}
            normal_text: ''
      TOOLCALLING.batch.7.f:
        description: Numeric precision edge preserves integer-like number literal
        ref: https://huggingface.co/ai21labs/Jamba-tiny-dev/blob/main/tokenizer_config.json
        model_text: '<tool_calls>[{"name": "set_limit", "arguments": {"count": 9007199254740993}}]</tool_calls>'
        tools:
        - name: set_limit
          parameters:
            type: object
            properties:
              count:
                type: number
        expected:
          vllm_python:
            calls:
            - name: set_limit
              arguments:
                count: 9007199254740993
            normal_text: ''
  TOOLCALLING.batch.5.yaml:
    family: jamba
    mode: batch
    cases:
      TOOLCALLING.batch.5.a:
        description: Missing </tool_calls> end marker
        ref: dynamo
        model_text: '<tool_calls>[{"name": "get_weather", "arguments": {"location": "NYC"}}]'
        tools:
        - &id004
          name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        expected:
          vllm_python:
            explanation: vLLM's jamba detector requires the closing </tool_calls> marker and leaves the unterminated wrapper in normal_text. Dynamo recovers the complete call body (strip_markup_on_recovery) and emits no markup.
            calls: []
            normal_text: '<tool_calls>[{"name": "get_weather", "arguments": {"location": "NYC"}}]'
      TOOLCALLING.batch.5.b:
        description: Closing </tool_calls> without matching <tool_calls> open
