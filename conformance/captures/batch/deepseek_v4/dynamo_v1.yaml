  TOOLCALLING.batch.30.yaml:
    family: deepseek_v4
    mode: batch
    cases:
      TOOLCALLING.batch.30.a:
        description: Character-level call separator is unavailable in DSML
        explanation: DSML separates invokes with complete tags rather than a comma, semicolon, or other separator character.
        unavailable:
          dynamo_v2: DSML has no character-level call separator to place inside an argument string.
      TOOLCALLING.batch.30.b:
        description: Character-level structural delimiter is unavailable in DSML
        explanation: Braces and brackets are ordinary JSON data in non-string parameters, covered by TOOLCALLING.batch.7.d; DSML structure is tag-delimited.
        unavailable:
          dynamo_v2: DSML has no character-level structural delimiter distinct from its tag markers.
      TOOLCALLING.batch.30.c:
        description: DSML control markers inside a string parameter remain data
        ref: DeepSeek DSML parameter grammar
        model_text: <｜DSML｜tool_calls><｜DSML｜invoke name="echo"><｜DSML｜parameter name="value" string="true">literal </｜DSML｜invoke> and <｜DSML｜tool_calls> stay data</｜DSML｜parameter></｜DSML｜invoke></｜DSML｜tool_calls>
        tools:
        - name: echo
          parameters:
            type: object
            properties:
              value:
                type: string
        expected:
          dynamo_v1:
            calls:
            - name: echo
              arguments: {}
            normal_text: ''
  TOOLCALLING.batch.6.yaml:
    family: deepseek_v4
    mode: batch
    cases:
      TOOLCALLING.batch.6.a:
        description: Invoke with no <parameter>
        ref: dynamo
        model_text: '<｜DSML｜tool_calls>

          <｜DSML｜invoke name="get_time">

          </｜DSML｜invoke>

          </｜DSML｜tool_calls>'
        tools:
        - &id001
          name: get_time
          parameters:
            type: object
            properties: {}
        expected:
          dynamo_v1:
            calls:
            - name: get_time
              arguments: {}
            normal_text: ''
      TOOLCALLING.batch.6.b:
        description: Invoke with extra newline
        ref: dynamo
        model_text: '<｜DSML｜tool_calls>

          <｜DSML｜invoke name="get_time">


          </｜DSML｜invoke>

          </｜DSML｜tool_calls>'
        tools:
        - *id001
        expected:
          dynamo_v1:
            calls:
            - name: get_time
              arguments: {}
            normal_text: ''
      TOOLCALLING.batch.6.c:
        description: Missing arguments key is unavailable in DSML
        explanation: DSML has no arguments key; a parameterless invoke is already represented by TOOLCALLING.batch.6.a, so there is no distinct absent-key spelling.
        unavailable:
          dynamo_v2: DSML has no arguments key whose absence can be distinguished from an empty object; TOOLCALLING.batch.6.a is its parameterless form.
  TOOLCALLING.batch.11.yaml:
    family: deepseek_v4
    mode: batch
    cases:
      TOOLCALLING.batch.11.a:
        description: Conflicting outer and inner tool names are unavailable in DSML
        explanation: DSML has one tool-name owner in the invoke name attribute and no inner envelope name that can disagree with it.
        unavailable:
          dynamo_v2: DSML carries only one tool name, so TOOLCALLING.batch.11.a cannot be expressed by this grammar.
      TOOLCALLING.batch.11.b:
        description: Empty DSML invoke name
        ref: DeepSeek DSML invoke grammar
        model_text: <｜DSML｜tool_calls><｜DSML｜invoke name=""><｜DSML｜parameter name="value" string="false">1</｜DSML｜parameter></｜DSML｜invoke></｜DSML｜tool_calls>
        tools:
        - name: f
          parameters:
            type: object
            properties:
              value:
                type: integer
        expected:
          dynamo_v1:
            calls: []
            normal_text: ''
      TOOLCALLING.batch.11.c:
        description: Generation-primer header omission is unavailable in DSML
        explanation: DSML tool calls do not use a separate generation-primer message header.
        unavailable:
          dynamo_v2: DSML has no generation-primer header, so TOOLCALLING.batch.11.c cannot be expressed by this grammar.
  TOOLCALLING.batch.8.yaml:
    family: deepseek_v4
    mode: batch
    cases:
      TOOLCALLING.batch.8.a:
        description: Narration before tool call only
        ref: dynamo
        model_text: 'I will check the weather. <｜DSML｜tool_calls>

          <｜DSML｜invoke name="get_weather">

          <｜DSML｜parameter name="location" string="true">NYC</｜DSML｜parameter>

          </｜DSML｜invoke>

          </｜DSML｜tool_calls>'
        tools:
        - &id002
          name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: 'I will check the weather. '
      TOOLCALLING.batch.8.b:
        description: Narration after tool call only
        ref: dynamo
        model_text: '<｜DSML｜tool_calls>

          <｜DSML｜invoke name="get_weather">

          <｜DSML｜parameter name="location" string="true">NYC</｜DSML｜parameter>

          </｜DSML｜invoke>

          </｜DSML｜tool_calls> Let me know if you need more.'
        tools:
        - *id002
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: ''
      TOOLCALLING.batch.8.c:
        description: Narration both before and after (sandwich)
        ref: dynamo
        model_text: 'I will check the weather. <｜DSML｜tool_calls>

          <｜DSML｜invoke name="get_weather">

          <｜DSML｜parameter name="location" string="true">NYC</｜DSML｜parameter>

          </｜DSML｜invoke>

          </｜DSML｜tool_calls> Let me know if you need more.'
        tools:
        - *id002
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: 'I will check the weather. '
      TOOLCALLING.batch.8.d:
        description: Narration between multiple tool calls
        ref: dynamo
        model_text: 'I will check the weather. <｜DSML｜tool_calls>

          <｜DSML｜invoke name="get_weather">

          <｜DSML｜parameter name="location" string="true">NYC</｜DSML｜parameter>

          </｜DSML｜invoke>

          </｜DSML｜tool_calls> Then check LA weather. <｜DSML｜tool_calls>

          <｜DSML｜invoke name="get_weather">

          <｜DSML｜parameter name="location" string="true">LA</｜DSML｜parameter>

          </｜DSML｜invoke>

          </｜DSML｜tool_calls>'
        tools:
        - *id002
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_weather
              arguments:
                location: LA
            normal_text: 'I will check the weather. '
  TOOLCALLING.stream.1.yaml:
    family: deepseek_v4
    model_label: DeepSeek V4
    mode: stream
    cases:
      TOOLCALLING.stream.1.a:
        description: Complete tool-call payload delivered in one content chunk
        ref: derived from TOOLCALLING.batch.1
        chunks:
        - delta_text: '<｜DSML｜tool_calls>

            <｜DSML｜invoke name="get_weather">

            <｜DSML｜parameter name="location" string="true">NYC</｜DSML｜parameter>

            </｜DSML｜invoke>

            </｜DSML｜tool_calls>'
        - delta_text: ''
          finish_reason: tool_calls
        tools: &id003
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: ''
      TOOLCALLING.stream.1.b:
        description: Complete tool call split across parser-significant boundaries
        ref: derived from TOOLCALLING.batch.1
        chunks:
        - delta_text: '<｜DSML｜tool_calls>

            '
        - delta_text: '<｜DSML｜invoke name="get_weather">

            '
        - delta_text: <｜DSML｜parameter name="location" string="true">
        - delta_text: NYC
        - delta_text: '</｜DSML｜parameter>

            '
        - delta_text: '</｜DSML｜invoke>

            '
        - delta_text: </｜DSML｜tool_calls>
        - delta_text: ''
          finish_reason: tool_calls
        tools: *id003
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: ''
  TOOLCALLING.batch.7.yaml:
    family: deepseek_v4
    mode: batch
    cases:
      TOOLCALLING.batch.7.a:
        description: Multiple parameters
        ref: dynamo
        model_text: '<｜DSML｜tool_calls>

          <｜DSML｜invoke name="book_flight">

          <｜DSML｜parameter name="destination" string="true">Paris</｜DSML｜parameter>

          <｜DSML｜parameter name="passengers" string="false">2</｜DSML｜parameter>

          <｜DSML｜parameter name="first_class" string="false">true</｜DSML｜parameter>

          </｜DSML｜invoke>

          </｜DSML｜tool_calls>'
        tools:
        - name: book_flight
          parameters:
            type: object
            properties:
              destination:
                type: string
              passengers:
                type: integer
              first_class:
                type: boolean
        expected:
          dynamo_v1:
            calls:
            - name: book_flight
              arguments:
                destination: Paris
                passengers: 2
                first_class: true
            normal_text: ''
      TOOLCALLING.batch.7.b:
        description: Unicode in parameter
        ref: dynamo
        model_text: '<｜DSML｜tool_calls>

          <｜DSML｜invoke name="get_weather">

          <｜DSML｜parameter name="location" string="true">Tōkyō central</｜DSML｜parameter>

          </｜DSML｜invoke>

          </｜DSML｜tool_calls>'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: Tōkyō central
            normal_text: ''
      TOOLCALLING.batch.7.c:
        description: DSML string value where the tool schema declares an integer
        ref: DeepSeek DSML string attribute
        model_text: '<｜DSML｜tool_calls>

          <｜DSML｜invoke name="set_temperature">

          <｜DSML｜parameter name="celsius" string="true">20</｜DSML｜parameter>

          </｜DSML｜invoke>

          </｜DSML｜tool_calls>'
        tools:
        - name: set_temperature
          parameters:
            type: object
            properties:
              celsius:
                type: integer
        expected:
          dynamo_v1:
            calls:
            - name: set_temperature
              arguments:
                celsius: '20'
            normal_text: ''
      TOOLCALLING.batch.7.d:
        description: Nested object and array in a non-string DSML parameter
        ref: DeepSeek DSML non-string parameter grammar
        model_text: '<｜DSML｜tool_calls>

          <｜DSML｜invoke name="process_data">

          <｜DSML｜parameter name="payload" string="false">{"items":[1,2,3],"config":{"nested":true}}</｜DSML｜parameter>

          </｜DSML｜invoke>

          </｜DSML｜tool_calls>'
        tools:
        - &id004
          name: process_data
          parameters:
            type: object
            properties:
              payload:
                type: object
        expected:
          dynamo_v1:
            calls:
            - name: process_data
              arguments:
                payload:
                  items:
                  - 1
                  - 2
                  - 3
                  config:
