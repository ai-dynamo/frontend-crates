  TOOLCALLING.batch.4.yaml:
    family: deepseek_v4
    mode: batch
    cases:
      TOOLCALLING.batch.4.a:
        description: Tool_calls wrapper with garbage
        ref: dynamo
        model_text: '<｜DSML｜tool_calls>

          nonsense

          </｜DSML｜tool_calls>'
        tools:
        - &id010
          name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        expected:
          dynamo_v1:
            calls: []
            normal_text: ''
      TOOLCALLING.batch.4.c:
        description: Invoke without name attribute
        ref: dynamo
        model_text: '<｜DSML｜tool_calls>

          <｜DSML｜invoke>

          <｜DSML｜parameter name="location" string="true">NYC</｜DSML｜parameter>

          </｜DSML｜invoke>

          </｜DSML｜tool_calls>'
        tools:
        - *id010
        expected:
          dynamo_v1:
            calls: []
            normal_text: ''
      TOOLCALLING.batch.4.d:
        description: Missing </｜DSML｜parameter> end tag
        ref: dynamo
        model_text: '<｜DSML｜tool_calls>

          <｜DSML｜invoke name="get_weather">

          <｜DSML｜parameter name="location" string="true">NYC

          </｜DSML｜invoke>

          </｜DSML｜tool_calls>'
        tools:
        - *id010
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments: {}
            normal_text: ''
      TOOLCALLING.batch.4.b:
        description: Invalid JSON syntax in a non-string DSML parameter
        ref: DeepSeek DSML parameter grammar
        model_text: '<｜DSML｜tool_calls>

          <｜DSML｜invoke name="get_weather">

          <｜DSML｜parameter name="location" string="false">{"city":"NYC"</｜DSML｜parameter>

          </｜DSML｜invoke>

          </｜DSML｜tool_calls>'
        tools:
        - *id010
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: '{"city":"NYC"'
            normal_text: ''
      TOOLCALLING.batch.4.e:
        description: Malformed DSML invoke prefix followed by a valid complete invoke
        ref: DeepSeek DSML invoke grammar
        model_text: '<｜DSML｜tool_calls>

          <｜DSML｜invoke name=get_weather>

          <｜DSML｜invoke name="get_weather">

          <｜DSML｜parameter name="location" string="true">Paris</｜DSML｜parameter>

          </｜DSML｜invoke>

          </｜DSML｜tool_calls>'
        tools:
        - *id010
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: Paris
            normal_text: ''
      TOOLCALLING.batch.4.f:
        description: Tool-name XML tag form is unavailable in DSML
        explanation: DSML identifies a tool only through the invoke name attribute; it has no XML function opener that can be replaced by a tool-name tag.
        unavailable:
          dynamo_v2: DSML has no XML function-opener form, so TOOLCALLING.batch.4.f cannot be expressed by this grammar.
