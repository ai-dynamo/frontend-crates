  TOOLCALLING.batch.6.yaml:
    family: deepseek_v3_2
    mode: batch
    cases:
      TOOLCALLING.batch.6.a:
        description: Invoke with no <parameter>
        ref: originated from https://github.com/vllm-project/vllm/blob/b53c507bc91f87e28b03e9b54bbff7c76e97d58b/tests/tool_parsers/test_deepseekv32_tool_parser.py#L363
        model_text: '<｜DSML｜function_calls>

          <｜DSML｜invoke name="get_time">

          </｜DSML｜invoke>

          </｜DSML｜function_calls>'
        tools:
        - &id001
          name: get_time
          parameters:
            type: object
            properties: {}
        expected:
          vllm_python:
            calls:
            - name: get_time
              arguments: {}
            normal_text: ''
      TOOLCALLING.batch.6.b:
        description: Invoke with extra newline
        ref: dynamo
        model_text: '<｜DSML｜function_calls>

          <｜DSML｜invoke name="get_time">


          </｜DSML｜invoke>

          </｜DSML｜function_calls>'
        tools:
        - *id001
        expected:
          vllm_python:
            calls:
            - name: get_time
              arguments: {}
            normal_text: ''
      TOOLCALLING.batch.6.c:
        description: Empty-body variant 6.c — not yet authored for this family
        explanation: Empty-body variant 6.c not yet authored for deepseek_v3_2; see 6.a / 6.b for this family's empty / whitespace scenarios.
  TOOLCALLING.batch.8.yaml:
    family: deepseek_v3_2
    mode: batch
    cases:
      TOOLCALLING.batch.8.a:
        description: Narration before tool call only
        ref: originated from https://github.com/vllm-project/vllm/blob/b53c507bc91f87e28b03e9b54bbff7c76e97d58b/tests/tool_parsers/test_deepseekv32_tool_parser.py#L158
        model_text: 'I will check the weather. <｜DSML｜function_calls>

          <｜DSML｜invoke name="get_weather">

          <｜DSML｜parameter name="location" string="true">NYC</｜DSML｜parameter>

          </｜DSML｜invoke>

          </｜DSML｜function_calls>'
        tools:
        - &id002
          name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: 'I will check the weather. '
      TOOLCALLING.batch.8.b:
        description: Narration after tool call only
        ref: dynamo
        model_text: '<｜DSML｜function_calls>

          <｜DSML｜invoke name="get_weather">

          <｜DSML｜parameter name="location" string="true">NYC</｜DSML｜parameter>

          </｜DSML｜invoke>

          </｜DSML｜function_calls> Let me know if you need more.'
        tools:
        - *id002
        expected:
          vllm_python:
            calls:
            - arguments:
                location: NYC
              name: get_weather
            normal_text: ''
      TOOLCALLING.batch.8.c:
        description: Narration both before and after (sandwich)
        ref: dynamo
        model_text: 'I will check the weather. <｜DSML｜function_calls>

          <｜DSML｜invoke name="get_weather">

          <｜DSML｜parameter name="location" string="true">NYC</｜DSML｜parameter>

          </｜DSML｜invoke>

          </｜DSML｜function_calls> Let me know if you need more.'
        tools:
        - *id002
        expected:
          vllm_python:
            calls:
            - arguments:
                location: NYC
              name: get_weather
            normal_text: 'I will check the weather. '
      TOOLCALLING.batch.8.d:
        description: Narration between multiple tool calls
        ref: dynamo
        model_text: 'I will check the weather. <｜DSML｜function_calls>

          <｜DSML｜invoke name="get_weather">

          <｜DSML｜parameter name="location" string="true">NYC</｜DSML｜parameter>

          </｜DSML｜invoke>

          </｜DSML｜function_calls> Then check LA weather. <｜DSML｜function_calls>

          <｜DSML｜invoke name="get_weather">

          <｜DSML｜parameter name="location" string="true">LA</｜DSML｜parameter>

          </｜DSML｜invoke>

          </｜DSML｜function_calls>'
        tools:
        - *id002
        expected:
          vllm_python:
            calls:
            - arguments:
                location: NYC
              name: get_weather
            - arguments:
                location: LA
              name: get_weather
            normal_text: 'I will check the weather. '
  TOOLCALLING.stream.1.yaml:
    family: deepseek_v3_2
    model_label: DeepSeek V3.2
    mode: stream
    cases:
      TOOLCALLING.stream.1.a:
        description: Complete tool-call payload delivered in one content chunk
        ref: derived from TOOLCALLING.batch.1
        chunks:
        - delta_text: '<｜DSML｜function_calls>

            <｜DSML｜invoke name="get_weather">

            <｜DSML｜parameter name="location" string="true">NYC</｜DSML｜parameter>

            </｜DSML｜invoke>

