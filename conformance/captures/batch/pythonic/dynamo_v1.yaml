  TOOLCALLING.batch.7.yaml:
    family: pythonic
    mode: batch
    cases:
      TOOLCALLING.batch.7.a:
        description: Standard scalar types
        ref: dynamo
        model_text: '[book_flight(destination="Paris", passengers=2, first_class=True)]'
        tools:
        - name: book_flight
          parameters:
            type: object
            properties:
              destination:
                type: string
              passengers:
                type: integer
              first_class:
                type: boolean
        expected:
          dynamo_v1:
            calls:
            - name: book_flight
              arguments:
                destination: Paris
                passengers: 2
                first_class: true
            normal_text: ''
      TOOLCALLING.batch.7.b:
        description: Unicode + escaped chars
        ref: dynamo
        model_text: '[get_weather(location="Tōkyō \"central\"")]'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: Tōkyō "central"
            normal_text: ''
      TOOLCALLING.batch.7.c:
        description: Schema mismatch — string value where schema declares integer
        ref: dynamo
        model_text: '[set_temperature(celsius="20")]'
        tools:
        - name: set_temperature
          parameters:
            type: object
            properties:
              celsius:
                type: integer
        expected:
          dynamo_v1:
            calls:
            - name: set_temperature
              arguments:
                celsius: '20'
            normal_text: ''
      TOOLCALLING.batch.7.d:
        description: Nested dict + array (existing)
        ref: dynamo
        model_text: '[process_data(items=[1, 2, 3], config={"nested": True})]'
        tools:
        - name: process_data
          parameters:
            type: object
            properties:
              items:
                type: array
              config:
                type: object
        expected:
          dynamo_v1:
            calls:
            - name: process_data
              arguments:
                items:
                - 1
                - 2
                - 3
                config:
                  nested: true
            normal_text: ''
      TOOLCALLING.batch.7.e:
        description: Large / deep JSON-edge argument payload
        ref: dynamo
        model_text: '[process_data(payload={"regions":[{"name":"west","scores":[1,2,3]},{"name":"east","scores":[4,5,6]}],"flags":{"enabled":True,"retry":None},"empty":{}})]'
        tools:
        - name: process_data
          parameters:
            type: object
            properties:
              payload:
                type: object
        expected:
          dynamo_v1:
            calls:
            - name: process_data
              arguments:
                payload:
                  empty: {}
                  regions:
                  - name: west
                    scores:
                    - 1
                    - 2
                    - 3
                  - name: east
                    scores:
                    - 4
                    - 5
                    - 6
                  flags:
                    retry: null
                    enabled: true
            normal_text: ''
