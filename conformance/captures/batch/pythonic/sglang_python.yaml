  TOOLCALLING.batch.6.yaml:
    family: pythonic
    mode: batch
    cases:
      TOOLCALLING.batch.6.a:
        description: Empty parens (no args)
        ref: dynamo
        model_text: '[get_time()]'
        tools:
        - &id001
          name: get_time
          parameters:
            type: object
            properties: {}
        expected:
          sglang_python:
            calls:
            - name: get_time
              arguments: {}
            normal_text: ''
      TOOLCALLING.batch.6.b:
        description: Whitespace inside parens
        ref: dynamo
        model_text: '[get_time( )]'
        tools:
        - *id001
        expected:
          sglang_python:
            calls: []
            normal_text: '[get_time( )]'
      TOOLCALLING.batch.6.c:
        description: Empty-body variant 6.c — not yet authored for this family
        explanation: Empty-body variant 6.c not yet authored for pythonic; see 6.a / 6.b for this family's empty / whitespace scenarios.
  TOOLCALLING.batch.8.yaml:
    family: pythonic
    mode: batch
    cases:
      TOOLCALLING.batch.8.a:
        description: Narration before tool call only
        ref: dynamo
        model_text: I will check the weather. [get_weather(location="NYC")]
        tools:
        - &id002
          name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: 'I will check the weather. '
      TOOLCALLING.batch.8.b:
        description: Narration after tool call only
        ref: dynamo
        model_text: '[get_weather(location="NYC")] Let me know if you need more.'
        tools:
        - *id002
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: ' Let me know if you need more.'
      TOOLCALLING.batch.8.c:
        description: Narration both before and after (sandwich)
        ref: dynamo
        model_text: I will check the weather. [get_weather(location="NYC")] Let me know if you need more.
        tools:
        - *id002
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: I will check the weather.  Let me know if you need more.
      TOOLCALLING.batch.8.d:
        description: Narration between multiple tool calls
        ref: dynamo
        model_text: I will check the weather. [get_weather(location="NYC")] Then check LA weather. [get_weather(location="LA")]
        tools:
        - *id002
        expected:
          sglang_python:
            calls: []
            normal_text: 'I will check the weather. '
  TOOLCALLING.stream.1.yaml:
    family: pythonic
    model_label: Llama 4 (pythonic fmt)
    mode: stream
    cases:
      TOOLCALLING.stream.1.a:
        description: Complete tool-call payload delivered in one content chunk
        ref: derived from TOOLCALLING.batch.1
        chunks:
        - delta_text: '[get_weather(location="NYC")]'
        - delta_text: ''
          finish_reason: tool_calls
        tools: &id003
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: ''
      TOOLCALLING.stream.1.b:
        description: Complete tool call split across parser-significant boundaries
        ref: derived from TOOLCALLING.batch.1
        chunks:
        - delta_text: '['
        - delta_text: get_weather
        - delta_text: (location="
        - delta_text: NYC
        - delta_text: '")'
        - delta_text: ']'
        - delta_text: ''
          finish_reason: tool_calls
        tools: *id003
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: ''
  TOOLCALLING.batch.7.yaml:
    family: pythonic
    mode: batch
    cases:
      TOOLCALLING.batch.7.a:
        description: Standard scalar types
        ref: dynamo
        model_text: '[book_flight(destination="Paris", passengers=2, first_class=True)]'
        tools:
        - name: book_flight
          parameters:
            type: object
            properties:
              destination:
                type: string
              passengers:
                type: integer
              first_class:
                type: boolean
        expected:
          sglang_python:
            calls:
            - name: book_flight
              arguments:
                destination: Paris
                passengers: 2
                first_class: true
            normal_text: ''
      TOOLCALLING.batch.7.b:
        description: Unicode + escaped chars
        ref: dynamo
        model_text: '[get_weather(location="Tōkyō \"central\"")]'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: Tōkyō "central"
            normal_text: ''
      TOOLCALLING.batch.7.c:
        description: Schema mismatch — string value where schema declares integer
        ref: dynamo
        model_text: '[set_temperature(celsius="20")]'
        tools:
        - name: set_temperature
          parameters:
            type: object
            properties:
              celsius:
                type: integer
        expected:
          sglang_python:
            calls:
            - name: set_temperature
              arguments:
                celsius: '20'
            normal_text: ''
      TOOLCALLING.batch.7.d:
        description: Nested dict + array (existing)
        ref: dynamo
        model_text: '[process_data(items=[1, 2, 3], config={"nested": True})]'
        tools:
        - name: process_data
          parameters:
            type: object
            properties:
              items:
                type: array
              config:
                type: object
        expected:
          sglang_python:
            calls:
            - name: process_data
              arguments:
                items:
                - 1
                - 2
                - 3
                config:
                  nested: true
            normal_text: ''
      TOOLCALLING.batch.7.e:
        description: Large / deep JSON-edge argument payload
        ref: dynamo
        model_text: '[process_data(payload={"regions":[{"name":"west","scores":[1,2,3]},{"name":"east","scores":[4,5,6]}],"flags":{"enabled":True,"retry":None},"empty":{}})]'
        tools:
        - name: process_data
          parameters:
            type: object
            properties:
              payload:
                type: object
        expected:
          sglang_python:
            calls:
            - name: process_data
              arguments:
                payload:
                  regions:
                  - name: west
                    scores:
                    - 1
                    - 2
                    - 3
                  - name: east
                    scores:
                    - 4
                    - 5
                    - 6
                  flags:
                    enabled: true
                    retry: null
                  empty: {}
            normal_text: ''
      TOOLCALLING.batch.7.f:
        description: Numeric precision edge test 7.f — not yet authored for this family
        explanation: Numeric precision edge test 7.f not yet authored for pythonic; Qwen3-Coder coverage is provided by qwen3_coder 7.f.
