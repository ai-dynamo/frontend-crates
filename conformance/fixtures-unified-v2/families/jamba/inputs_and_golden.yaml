cases:
  arg_optional_nullable_omitted:
    description: 'Optional nullable note is omitted beside required city:Paris. Every grammar preserves omission: nullability alone cannot fabricate an optional argument.'
    policy:
    - I7
    display_id: UNIFIED.7-tool-argument-nullability-arg_optional_nullable_omitted
    request: 4afb2ebd9f259c5ab096d7fc3c6e31cd7cad6201dcfffbaa36e538305d4c4e71
    golden:
    - kind: tool_call
      name: record
      arguments:
        city: Paris
  arg_required_nonnullable_omitted:
    description: Required non-nullable note is omitted beside city:Paris. Every grammar preserves omission; argument parsing does not validate the complete tool schema.
    policy:
    - I7
    display_id: UNIFIED.7-tool-argument-nullability-arg_required_nonnullable_omitted
    request: 1ebcf50d80758497ead7541b1c7083fae538c67fec8d35409a8e3cea7edaa94f
    golden:
    - kind: tool_call
      name: record
      arguments:
        city: Paris
  arg_required_nullable_ambiguous_oneof_omitted:
    description: An empty invocation has required note in two root oneOf branches admitting null. Null would satisfy both branches and violate oneOf, so every grammar preserves the empty object.
    policy:
    - I7
    display_id: UNIFIED.7-tool-argument-nullability-arg_required_nullable_ambiguous_oneof_omitted
    request: 1c5ec88be85e0aa85c0a0e476a3e0fff43a0fa24cd73ccb205829e15c9ec1645
    golden:
    - kind: tool_call
      name: record
      arguments: {}
  arg_required_nullable_empty_invoke:
    description: An empty completed native invocation omits its only required nullable note. MiniMax-M3 restores note:null even with no supplied fields; other grammars preserve the empty object.
    policy:
    - I7
    display_id: UNIFIED.7-tool-argument-nullability-arg_required_nullable_empty_invoke
    request: 711d06bcd3844dd922819e9e0f9ab6223af4b50f504ab26326281fe6d2481122
    golden:
    - kind: tool_call
      name: record
      arguments: {}
  arg_required_nullable_lookup_budget_omitted:
    description: An empty invocation has direct nullable note and a 65-definition allOf reference chain ending in note:string. An exhausted property lookup cannot prove null is valid; every grammar preserves the empty object.
    policy:
    - I7
    display_id: UNIFIED.7-tool-argument-nullability-arg_required_nullable_lookup_budget_omitted
    request: 9ab9c88fa57f7abc2b9244f85befe82a5aebc79a4db5317d4c024ce35f40350e
    golden:
    - kind: tool_call
      name: record
      arguments: {}
  arg_required_nullable_omitted:
    description: Required anyOf string-or-null note is omitted beside city:Paris. MiniMax-M3 encodes null by omission and restores note:null; other grammars preserve omission.
    policy:
    - I7
    display_id: UNIFIED.7-tool-argument-nullability-arg_required_nullable_omitted
    request: 7a3abe9c6f2438334fcfb3c888a66bd51cad98f111e2e1e11a7aa24bf261f667
    golden:
    - kind: tool_call
      name: record
      arguments:
        city: Paris
  arg_required_nullable_supplied:
    description: Required nullable note is supplied as kept beside city:Paris. Every grammar preserves the supplied string rather than overwriting it with null.
    policy:
    - I7
    display_id: UNIFIED.7-tool-argument-nullability-arg_required_nullable_supplied
