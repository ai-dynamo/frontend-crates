cases:
  tool_only:
    description: Single tool call, no reasoning. Must stay green everywhere (the existing tool suite's world).
    display_id: UNIFIED.1-tool_only
    request: 7829bbae7add9b6e5a29544f1fe452f1bd2421f8b62cfe12b40ff80b36df3abb
    golden:
    - kind: tool_call
      name: get_weather
      arguments:
        city: Paris
  trailing_text_after_tool:
    policy:
    - P1
    description: Arbitrary visible prose AFTER the tool call (the point is it could be ANY content, so it must survive). Policy P1 (best-effort recovery) — trailing model text is preserved, not suppressed.
    display_id: UNIFIED.8-trailing_text_after_tool
    request: dd0cff4f8b88a806fde444936aa5caa91e8110d4880f3dea51504125d889b8a3
    golden:
    - kind: tool_call
      name: get_weather
      arguments:
        city: Paris
    - kind: text
      text: The forecast shows clear skies for the rest of the week.
  two_calls:
    description: 'Two tool calls back-to-back, no reasoning. Both must surface as ordered events. This is also covered in: TOOLCALLING.streamv1.2.a.'
