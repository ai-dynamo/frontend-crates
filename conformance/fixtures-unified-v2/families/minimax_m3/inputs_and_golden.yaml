cases:
  tool_only:
    description: Single tool call, no reasoning. Must stay green everywhere (the existing tool suite's world).
    display_id: UNIFIED.1-tool_only
    request: 486e7227a2ba5a6bcbcc02f4805184f84d263f70eb2123193dd13780413d6803
    golden:
    - kind: tool_call
      name: get_weather
      arguments:
        city: Paris
  reason_only:
    description: 'A reasoning span with no visible answer and no tool call. This is also covered in: REASONING.batch.2.a.'
    display_id: UNIFIED.10-reason_only
    request: 26d644d7f617f9818561b3b6d854773d0583a1c8de63661dc7c02405e5b7d32a
    golden:
    - kind: reasoning
      text: just thinking, no answer
  reason_then_content:
    description: 'Reasoning then visible content, no tool call (baseline). This is also covered in: e2e case-0001-chinese_arithmetic__non-stream-budget_capped.json (+ 42 more: every `reasoning/core`, `reasoning/complex` and `reasoning/history` case, `tool_none_arithmetic__*`, and the SECOND step of both `lifecycle_*` — each with its `-budget_unlimited` pair).'
    display_id: UNIFIED.10-reason_then_content
    request: 348760a3ac526a04064cbcce596dba6e63c4f2f2859509887380716658e41285
    golden:
    - kind: reasoning
      text: let me think
    - kind: text
      text: The answer is 42.
  reason_unterminated:
    description: Stream ends while still inside reasoning (no close marker). Open reasoning is promoted at finish, not dropped and not leaked as text.
    display_id: UNIFIED.10-reason_unterminated
    request: 3389451bcf1e675b1b17a573fc60e5f98102745ebdad5d4531663214e4dc1f26
    golden:
    - kind: reasoning
      text: thinking but stream ends
  two_adjacent_reason_spans:
    description: 'Two reasoning spans with nothing between them, then the answer. The single `reasoning_text` field every batch parser exposes can only concatenate them, so the separator is part of the contract: adjacent spans join with a newline. The counterpart is already covered by `reason_after_tool` / `reason_interleaved`, where two spans separated by a call must NOT join — a parser that always joins invents a newline the model never emitted, and one that never joins loses the batch parity every engine has.'
    display_id: UNIFIED.10-two_adjacent_reason_spans
    request: de82e2a49aa0f4e8e0d5b7dc5e0c6fe8c4deb9885c0bd776d934795077e3e5d0
    golden:
    - kind: reasoning
      text: 'first

        second'
    - kind: text
      text: done
  two_reason_spans:
    description: 'Two reasoning spans separated by visible text, no tool call. Streaming keeps both spans in order; batch merges them. This is also covered in: REASONING.batch.6.a.'
    display_id: UNIFIED.10-two_reason_spans
    request: d03208d5f5e62dc85e998d1a7357218a5781ed6a85a99ac66fdc09aa9ef6e7d0
    golden:
    - kind: reasoning
      text: first thought
    - kind: text
      text: 'interlude '
    - kind: reasoning
      text: second thought
    - kind: text
      text: done
  content_then_reason:
    description: Visible content, then reasoning, then more content. The split hoists reasoning to the front and merges the two content spans.
    display_id: UNIFIED.11-content_then_reason
    request: db561736ba17f622a9e042839abfdab69c18660ad440fefe37364128bbb213a6
    golden:
    - kind: text
      text: 'Hello there. '
    - kind: reasoning
      text: let me recall
    - kind: text
      text: The capital is Paris.
  content_then_reason_then_tool:
    description: Visible content BEFORE reasoning, then a tool call. The split hoists all reasoning to the front, so content-before-reasoning loses order.
    display_id: UNIFIED.11-content_then_reason_then_tool
    request: 8d9bd33e33bfaebdb80bcb614f0546ba3aa167237c147862101602de3185a050
    golden:
    - kind: text
      text: 'Sure, one sec. '
    - kind: reasoning
      text: checking the forecast
    - kind: tool_call
      name: get_weather
      arguments:
        city: Paris
  interstitial_text:
    description: Reasoning, then visible text, THEN a tool call. Text between reasoning-end and the call must survive as its own event, in order.
    display_id: UNIFIED.11-interstitial_text
    request: e50913ba517c886ab3777a8e9830e2d2f8714d3c28ae546cf798299c8a7c6cfb
    golden:
    - kind: reasoning
      text: a
    - kind: text
      text: 'Here you go: '
    - kind: tool_call
      name: get_weather
      arguments:
        city: Paris
  reason_after_tool:
    description: Reasoning AFTER a tool call, then final text (Example A). The split cannot represent reasoning between the call and the answer.
    display_id: UNIFIED.11-reason_after_tool
    request: dd10083d6aa7734d3299f87e6f2cf56b743fad3edb7ede2dcf10c2e3d62f0260
    golden:
    - kind: reasoning
      text: Look it up.
    - kind: tool_call
      name: get_weather
      arguments:
        city: Paris
    - kind: reasoning
      text: Now answer.
    - kind: text
      text: It's 18C.
  reason_between_calls:
    description: Reasoning BETWEEN two tool calls with no surrounding text — the tightest interleave.
    display_id: UNIFIED.11-reason_between_calls
    request: 157d54840f78566d15795a442f70ea280182fc9dda581af7f1768410844542bb
    golden:
    - kind: tool_call
      name: f
      arguments:
        x: '1'
    - kind: reasoning
      text: mid
    - kind: tool_call
      name: g
      arguments:
        y: '2'
  reason_interleaved:
    description: reason -> tool -> reason -> tool. Two calls, each preceded by its own thought.
    display_id: UNIFIED.11-reason_interleaved
    request: 14670b26b577b8e558c1fab4245ab715af20f834457d64d4108112fbdbd244a9
    golden:
    - kind: reasoning
      text: A
    - kind: tool_call
      name: f
      arguments:
        x: '1'
    - kind: reasoning
      text: B
    - kind: tool_call
      name: g
      arguments:
        y: '2'
  reason_then_tool:
    description: Reasoning fully precedes one tool call (baseline).
    display_id: UNIFIED.11-reason_then_tool
    request: cbe6a2ffc7fc658a38192a8538f35a6c4fd77f04505aef6d8e6d61f578b86968
    golden:
    - kind: reasoning
      text: Check weather.
    - kind: tool_call
      name: get_weather
      arguments:
        city: Paris
  reason_tool_reason_tool_reason:
    description: reason -> tool -> reason -> tool -> reason. Three reasoning spans around two calls, including reasoning AFTER the last call — the split cannot place any of them.
    display_id: UNIFIED.11-reason_tool_reason_tool_reason
    request: 502c595073b9257f50530f11eea69ba82a8cf22bf136a4314f4bdc86bfe204c6
    golden:
    - kind: reasoning
      text: A
    - kind: tool_call
      name: f
      arguments:
        x: '1'
    - kind: reasoning
      text: B
    - kind: tool_call
      name: g
      arguments:
        y: '2'
    - kind: reasoning
      text: C
  reason_tool_text_reason_tool:
    description: reason -> tool -> text -> reason -> tool. Two reasoning spans separated by a call and text.
    display_id: UNIFIED.11-reason_tool_text_reason_tool
    request: b4a5b2d77ee5976c14fdff06422c0d1eccf37ca01edef71d7b0971c42683aaf8
    golden:
    - kind: reasoning
      text: A
    - kind: tool_call
      name: f
      arguments:
        x: '1'
    - kind: text
      text: working on it
    - kind: reasoning
      text: B
    - kind: tool_call
      name: g
      arguments:
        y: '2'
  text_reason_tool_text_reason_tool:
    description: Deep well-formed interleave — visible text, reasoning, and tool calls alternating (text -> reason -> tool -> text -> reason -> tool). Every segment must survive in emitted order; the point is that user text, reasoning, and calls all mix in one stream.
    display_id: UNIFIED.11-text_reason_tool_text_reason_tool
    request: 9f513ca980e13d4d8d532fba0302e6bc40f4c39ef6d9b1339968c37e3a33de1e
    golden:
    - kind: text
      text: 'Sure. '
    - kind: reasoning
      text: check A
    - kind: tool_call
      name: f
      arguments:
        x: '1'
    - kind: text
      text: ' and '
    - kind: reasoning
      text: check B
    - kind: tool_call
      name: g
      arguments:
        y: '2'
  reason_markup_in_arg:
    description: '''Tool call contains reasoning'' — a reasoning-channel marker sits inside a QUOTED tool-arg value. This is NOT a leak: a leak is control markup surfacing in visible content or reasoning, but here the markup is a tool ARGUMENT VALUE (data bound for the function, inside the grammar''s string delimiters), so by I7 the parser preserves it byte-exact. The gemma4 native UnifiedParser confirms this golden exactly. Failure mode: a reasoning-first pipeline extracts the `<think>`/`<|channel>` from inside the arg BEFORE tool parsing, hoisting it into a spurious reasoning event and corrupting the arg to empty.'
    display_id: UNIFIED.12-reason_markup_in_arg
    request: afc0233c34e044aafac1333d4fc5de4904f1a520e27260c637570153af591558
    golden:
    - kind: tool_call
      name: log
      arguments:
        note: <mm:think>reconsider</mm:think>
  reason_markup_in_arg_with_text:
    description: 'reason_markup_in_arg (tool arg value contains reasoning markup, I7 data) WITH visible narration before and after the call. All three channels at once: leading text -> tool call whose arg holds reasoning markup -> trailing text. Golden keeps the visible text as text, the call as a call, and the markup byte-exact in the arg. A reasoning-first pipeline both corrupts the arg (extracting the embedded reasoning) and can reorder/misroute the surrounding text.'
    display_id: UNIFIED.12-reason_markup_in_arg_with_text
    request: 226ddfc213396c17c799598b32631a633ce289d2a62ea7da10ae21da8ee228d3
    golden:
    - kind: text
      text: 'Logging now: '
    - kind: tool_call
      name: log
      arguments:
        note: <mm:think>reconsider</mm:think>
    - kind: text
      text: ' done.'
  tool_in_reason:
    description: '''Reasoning contains tool call'' — a well-formed tool-call envelope nested INSIDE a reasoning span. This is the OPPOSITE of reason_markup_in_arg: a reasoning span is opaque TEXT, not a quoted data region, so a real tool-call marker inside it IS structural. Best-effort recovery breaks out of reasoning, emits the call, and resumes reasoning after its close (golden: reason -> call -> reason). Leaking the raw `<|tool_call>...<tool_call|>` into reasoning_content, or dropping the call, is the regression — which is what every reasoning-first engine does here.'
    display_id: UNIFIED.12-tool_in_reason
    request: 9dfd1ebf0343af74d0ff2f7f659b2b82309166cc40021849f22525d98d1d8087
    golden:
    - kind: reasoning
      text: 'I should check. '
    - kind: tool_call
      name: get_weather
      arguments:
        city: Paris
    - kind: reasoning
      text: ' now answer'
  tool_in_reason_with_text:
    description: 'tool_in_reason (a tool call nested inside a reasoning span, break-out recovery) WITH visible narration before and after the reasoning span. All three channels at once: leading text -> reasoning that wraps a real call -> trailing text. Golden: text -> reason -> call -> reason -> text. Engines that treat reasoning as opaque-until-close leak the nested tool markup into reasoning_content and drop the call.'
    display_id: UNIFIED.12-tool_in_reason_with_text
    request: 19cfed0ccd84431e89bac1a7e95a95fb3e789ad1011ed4bc35f3260a32956977
    golden:
    - kind: text
      text: 'Sure. '
    - kind: reasoning
      text: 'I should check. '
    - kind: tool_call
      name: get_weather
      arguments:
        city: Paris
    - kind: reasoning
      text: ' now answer'
    - kind: text
      text: ' Here you go.'
  two_calls:
    description: 'Two tool calls back-to-back, no reasoning. Both must surface as ordered events. This is also covered in: TOOLCALLING.streamv1.2.a.'
    display_id: UNIFIED.2-two_calls
    request: cb92c12e844a1f3b5893a1789c3a5ceeeb6c4f2327cd875dd29eacbaed284005
    golden:
    - kind: tool_call
      name: f
      arguments:
        x: '1'
    - kind: tool_call
