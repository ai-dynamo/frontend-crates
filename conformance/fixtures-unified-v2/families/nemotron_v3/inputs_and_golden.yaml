    policy:
    - P5
    - I2
    - I7
    description: Default reasoning omits both think markers; native calls interrupt and resume reasoning, preserving literal markers in arguments.
    display_id: UNIFIED.12-default_reasoning_tool_without_closer
    request: ad37cc079a6822fa7d423589f3117cf36c47888bb22ac235283c6d300eed67c8
    golden:
    - kind: reasoning
