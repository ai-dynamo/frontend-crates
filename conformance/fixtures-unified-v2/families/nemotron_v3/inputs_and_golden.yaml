    - kind: tool_call
      name: get_weather
      arguments:
        city: Paris
  default_reasoning_without_opener:
    policy:
    - P5
    - I5
    description: The family starts in reasoning without an opener; the closer switches to visible Unicode content.
    display_id: UNIFIED.10-default_reasoning_without_opener
    request: 4ac2180e98e8f7dd681d498f0a48c909a929c1730b95a3db36904d73015d06a1
