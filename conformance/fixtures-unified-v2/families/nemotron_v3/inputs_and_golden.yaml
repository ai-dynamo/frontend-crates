  guided_json_invalid_call:
    policy:
    - P2
    description: 'Guided decoding emits JSON that is well-formed but is NOT a tool call — no `name`, so there is nothing to dispatch. Policy P2: surface the payload as visible content rather than dropping it or erroring. Dropping it would lose the model''s entire output; erroring would fail a request the user can still read.'
    display_id: UNIFIED.31-guided_json_invalid_call
    request: 6b396beab845a49abac7e4aa2d0ecef343f7940b0cb6e02c40c303a9dbb60dc5
