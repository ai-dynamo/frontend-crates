  reason_markup_in_arg:
    description: '''Tool call contains reasoning'' — a reasoning-channel marker sits inside a QUOTED tool-arg value. This is NOT a leak: a leak is control markup surfacing in visible content or reasoning, but here the markup is a tool ARGUMENT VALUE (data bound for the function, inside the grammar''s string delimiters), so by I7 the parser preserves it byte-exact. The gemma4 native UnifiedParser confirms this golden exactly. Failure mode: a reasoning-first pipeline extracts the `<think>`/`<|channel>` from inside the arg BEFORE tool parsing, hoisting it into a spurious reasoning event and corrupting the arg to empty.'
    display_id: UNIFIED.12-reason_markup_in_arg
    request: b44b2130d31ecbdef62992710acc962f34e76723ac165936f672dd2b335989ec
    golden:
    - kind: tool_call
      name: log
      arguments:
        note: <think>reconsider</think>
  reason_markup_in_arg_with_text:
    description: 'reason_markup_in_arg (tool arg value contains reasoning markup, I7 data) WITH visible narration before and after the call. All three channels at once: leading text -> tool call whose arg holds reasoning markup -> trailing text. Golden keeps the visible text as text, the call as a call, and the markup byte-exact in the arg. A reasoning-first pipeline both corrupts the arg (extracting the embedded reasoning) and can reorder/misroute the surrounding text.'
    display_id: UNIFIED.12-reason_markup_in_arg_with_text
    request: 8814dd8857e0609dbc466666a63f5178a3f0c4c3f960b7d9f5556dfe7afbc796
    golden:
    - kind: text
      text: 'Logging now: '
    - kind: tool_call
      name: log
      arguments:
        note: <think>reconsider</think>
    - kind: text
      text: ' done.'
  tool_in_reason:
    description: '''Reasoning contains tool call'' — a well-formed tool-call envelope nested INSIDE a reasoning span. This is the OPPOSITE of reason_markup_in_arg: a reasoning span is opaque TEXT, not a quoted data region, so a real tool-call marker inside it IS structural. Best-effort recovery breaks out of reasoning, emits the call, and resumes reasoning after its close (golden: reason -> call -> reason). Leaking the raw `<|tool_call>...<tool_call|>` into reasoning_content, or dropping the call, is the regression — which is what every reasoning-first engine does here.'
    display_id: UNIFIED.12-tool_in_reason
    request: b382c9d07a859bcf4573fc4ff1db252aaf6d3e15ae4da48a24c55b43d8c87d2f
    golden:
    - kind: reasoning
      text: 'I should check. '
    - kind: tool_call
      name: get_weather
      arguments:
        city: Paris
    - kind: reasoning
      text: ' now answer'
  tool_in_reason_with_text:
    description: 'tool_in_reason (a tool call nested inside a reasoning span, break-out recovery) WITH visible narration before and after the reasoning span. All three channels at once: leading text -> reasoning that wraps a real call -> trailing text. Golden: text -> reason -> call -> reason -> text. Engines that treat reasoning as opaque-until-close leak the nested tool markup into reasoning_content and drop the call.'
    display_id: UNIFIED.12-tool_in_reason_with_text
    request: 22358e69ffb202bfe3e76408f1f122f61077cdc624c2d355db061f7b0bf3bb0c
    golden:
    - kind: text
      text: 'Sure. '
    - kind: reasoning
