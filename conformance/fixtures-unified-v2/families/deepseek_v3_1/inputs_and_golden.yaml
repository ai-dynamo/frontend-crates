    - kind: tool_call
      name: get_weather
      arguments:
        city: Paris
    - kind: reasoning
      text: Now answer.
    - kind: text
      text: It's 18C.
  content_then_reason:
    description: Visible content, then reasoning, then more content. The split hoists reasoning to the front and merges the two content spans.
    display_id: UNIFIED.11-content_then_reason
    request: 2cd85bdb356eddb880cef6b229b38164dc8f603cd9a0b8be0f64e4af3575cd15
    golden:
    - kind: text
      text: 'Hello there. '
    - kind: reasoning
      text: let me recall
    - kind: text
      text: The capital is Paris.
  content_then_reason_then_tool:
    description: Visible content BEFORE reasoning, then a tool call. The split hoists all reasoning to the front, so content-before-reasoning loses order.
