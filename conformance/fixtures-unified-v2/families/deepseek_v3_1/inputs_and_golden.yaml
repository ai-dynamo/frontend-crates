      name: record
      arguments:
        city: Paris
  arg_required_nonnullable_omitted:
    description: Required non-nullable note is omitted beside city:Paris. Every grammar preserves omission; argument parsing does not validate the complete tool schema.
    policy:
    - I7
    display_id: UNIFIED.7-tool-argument-nullability-arg_required_nonnullable_omitted
    request: 5b5fb7d7f051dccdfd33333950d7282e27efe6d0785764d0061882ac810af1be
    golden:
    - kind: tool_call
      name: record
      arguments:
