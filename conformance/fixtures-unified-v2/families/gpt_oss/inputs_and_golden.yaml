input_document:
  family: gpt_oss
  mode: unified
  model_label: gpt_oss
golden_document:
  family: gpt_oss
  mode: unified
  captured_with:
    golden: v1
cases:
  tool_only:
    lifecycle: active
    scenario: tool_only
    description: Single tool call, no reasoning. Must stay green everywhere (the existing tool suite's world).
    policy: []
    display_id: UNIFIED.1-tool_only
    historical_ids: []
    request:
      input: '<|start|>assistant<|channel|>commentary to=functions.get_weather <|constrain|>json<|message|>{"city": "Paris"}<|call|>'
      init:
        starting_state: None
        tool_output_mode: Native
        named_tool: null
      finish_reason: stop
      tools: []
      chunks:
      - delta_text: '<|start|>assistant<|channel|>commentary to=functions.get_weather <|constrain|>json<|message|>{"city": "Paris"}<|call|>'
    golden:
      assembled:
      - kind: tool_call
        name: get_weather
        arguments:
          city: Paris
  reason_only:
    lifecycle: active
    scenario: reason_only
    description: 'A reasoning span with no visible answer and no tool call. This is also covered in: REASONING.batch.2.a.'
    policy: []
    display_id: UNIFIED.10-reason_only
    historical_ids: []
    request:
      input: <|channel|>analysis<|message|>just thinking, no answer<|end|>
      init:
        starting_state: None
        tool_output_mode: Native
        named_tool: null
      finish_reason: stop
      tools: []
      chunks:
      - delta_text: <|channel|>analysis<|message|>just thinking, no answer<|end|>
    golden:
      assembled:
      - kind: reasoning
        text: just thinking, no answer
  reason_then_content:
    lifecycle: active
    scenario: reason_then_content
    description: 'Reasoning then visible content, no tool call (baseline). This is also covered in: e2e case-0001-chinese_arithmetic__non-stream-budget_capped.json (+ 42 more: every `reasoning/core`, `reasoning/complex` and `reasoning/history` case, `tool_none_arithmetic__*`, and the SECOND step of both `lifecycle_*` — each with its `-budget_unlimited` pair).'
    policy: []
    display_id: UNIFIED.10-reason_then_content
    historical_ids: []
    request:
      input: <|channel|>analysis<|message|>let me think<|end|><|channel|>final<|message|>The answer is 42.<|return|>
      init:
        starting_state: None
        tool_output_mode: Native
        named_tool: null
      finish_reason: stop
      tools: []
      chunks:
      - delta_text: <|channel|>analysis<|message|>let me think<|end|><|channel|>final<|message|>The answer is 42.<|return|>
    golden:
      assembled:
      - kind: reasoning
        text: let me think
      - kind: text
        text: The answer is 42.
  two_reason_spans:
    lifecycle: active
    scenario: two_reason_spans
    description: 'Two reasoning spans separated by visible text, no tool call. Streaming keeps both spans in order; batch merges them. This is also covered in: REASONING.batch.6.a.'
    policy: []
    display_id: UNIFIED.10-two_reason_spans
    historical_ids: []
    request:
      input: <|channel|>analysis<|message|>first thought<|end|><|channel|>final<|message|>interlude <|return|><|channel|>analysis<|message|>second thought<|end|><|channel|>final<|message|>done<|return|>
      init:
        starting_state: None
        tool_output_mode: Native
        named_tool: null
      finish_reason: stop
      tools: []
      chunks:
      - delta_text: <|channel|>analysis<|message|>first thought<|end|><|channel|>final<|message|>interlude <|return|><|channel|>analysis<|message|>second thought<|end|><|channel|>final<|message|>done<|return|>
    golden:
      assembled:
      - kind: reasoning
        text: first thought
      - kind: text
        text: 'interlude '
      - kind: reasoning
        text: second thought
      - kind: text
        text: done
  content_then_reason:
    lifecycle: active
    scenario: content_then_reason
    description: Visible content, then reasoning, then more content. The split hoists reasoning to the front and merges the two content spans.
    policy: []
    display_id: UNIFIED.11-content_then_reason
    historical_ids: []
    request:
      input: <|channel|>final<|message|>Hello there. <|return|><|channel|>analysis<|message|>let me recall<|end|><|channel|>final<|message|>The capital is Paris.<|return|>
      init:
        starting_state: None
        tool_output_mode: Native
        named_tool: null
      finish_reason: stop
      tools: []
      chunks:
      - delta_text: <|channel|>final<|message|>Hello there. <|return|><|channel|>analysis<|message|>let me recall<|end|><|channel|>final<|message|>The capital is Paris.<|return|>
    golden:
      assembled:
      - kind: text
        text: 'Hello there. '
      - kind: reasoning
        text: let me recall
      - kind: text
        text: The capital is Paris.
  content_then_reason_then_tool:
    lifecycle: active
    scenario: content_then_reason_then_tool
    description: Visible content BEFORE reasoning, then a tool call. The split hoists all reasoning to the front, so content-before-reasoning loses order.
    policy: []
    display_id: UNIFIED.11-content_then_reason_then_tool
    historical_ids: []
    request:
      input: '<|channel|>final<|message|>Sure, one sec. <|return|><|channel|>analysis<|message|>checking the forecast<|end|><|start|>assistant<|channel|>commentary to=functions.get_weather <|constrain|>json<|message|>{"city": "Paris"}<|call|>'
      init:
        starting_state: None
        tool_output_mode: Native
        named_tool: null
      finish_reason: stop
      tools: []
      chunks:
      - delta_text: '<|channel|>final<|message|>Sure, one sec. <|return|><|channel|>analysis<|message|>checking the forecast<|end|><|start|>assistant<|channel|>commentary to=functions.get_weather <|constrain|>json<|message|>{"city": "Paris"}<|call|>'
    golden:
      assembled:
      - kind: text
        text: 'Sure, one sec. '
      - kind: reasoning
        text: checking the forecast
      - kind: tool_call
        name: get_weather
        arguments:
          city: Paris
  interstitial_text:
    lifecycle: active
    scenario: interstitial_text
    description: Reasoning, then visible text, THEN a tool call. Text between reasoning-end and the call must survive as its own event, in order.
    policy: []
    display_id: UNIFIED.11-interstitial_text
    historical_ids: []
    request:
      input: '<|channel|>analysis<|message|>a<|end|><|channel|>final<|message|>Here you go: <|return|><|start|>assistant<|channel|>commentary to=functions.get_weather <|constrain|>json<|message|>{"city": "Paris"}<|call|>'
      init:
        starting_state: None
        tool_output_mode: Native
        named_tool: null
      finish_reason: stop
      tools: []
      chunks:
      - delta_text: '<|channel|>analysis<|message|>a<|end|><|channel|>final<|message|>Here you go: <|return|><|start|>assistant<|channel|>commentary to=functions.get_weather <|constrain|>json<|message|>{"city": "Paris"}<|call|>'
    golden:
      assembled:
      - kind: reasoning
        text: a
      - kind: text
        text: 'Here you go: '
      - kind: tool_call
        name: get_weather
        arguments:
          city: Paris
  reason_after_tool:
    lifecycle: active
    scenario: reason_after_tool
    description: Reasoning AFTER a tool call, then final text (Example A). The split cannot represent reasoning between the call and the answer.
    policy: []
    display_id: UNIFIED.11-reason_after_tool
    historical_ids: []
    request:
      input: '<|channel|>analysis<|message|>Look it up.<|end|><|start|>assistant<|channel|>commentary to=functions.get_weather <|constrain|>json<|message|>{"city": "Paris"}<|call|><|channel|>analysis<|message|>Now answer.<|end|><|channel|>final<|message|>It''s 18C.<|return|>'
      init:
        starting_state: None
        tool_output_mode: Native
        named_tool: null
      finish_reason: stop
      tools: []
      chunks:
      - delta_text: '<|channel|>analysis<|message|>Look it up.<|end|><|start|>assistant<|channel|>commentary to=functions.get_weather <|constrain|>json<|message|>{"city": "Paris"}<|call|><|channel|>analysis<|message|>Now answer.<|end|><|channel|>final<|message|>It''s 18C.<|return|>'
    golden:
      assembled:
      - kind: reasoning
        text: Look it up.
      - kind: tool_call
        name: get_weather
        arguments:
          city: Paris
      - kind: reasoning
        text: Now answer.
      - kind: text
        text: It's 18C.
  reason_between_calls:
    lifecycle: active
    scenario: reason_between_calls
    description: Reasoning BETWEEN two tool calls with no surrounding text — the tightest interleave.
    policy: []
    display_id: UNIFIED.11-reason_between_calls
    historical_ids: []
    request:
      input: '<|start|>assistant<|channel|>commentary to=functions.f <|constrain|>json<|message|>{"x": "1"}<|call|><|channel|>analysis<|message|>mid<|end|><|start|>assistant<|channel|>commentary to=functions.g <|constrain|>json<|message|>{"y": "2"}<|call|>'
      init:
        starting_state: None
        tool_output_mode: Native
        named_tool: null
      finish_reason: stop
      tools: []
      chunks:
      - delta_text: '<|start|>assistant<|channel|>commentary to=functions.f <|constrain|>json<|message|>{"x": "1"}<|call|><|channel|>analysis<|message|>mid<|end|><|start|>assistant<|channel|>commentary to=functions.g <|constrain|>json<|message|>{"y": "2"}<|call|>'
    golden:
      assembled:
      - kind: tool_call
        name: f
        arguments:
          x: '1'
      - kind: reasoning
        text: mid
      - kind: tool_call
        name: g
        arguments:
          y: '2'
  reason_interleaved:
    lifecycle: active
    scenario: reason_interleaved
    description: reason -> tool -> reason -> tool. Two calls, each preceded by its own thought.
    policy: []
    display_id: UNIFIED.11-reason_interleaved
    historical_ids: []
    request:
      input: '<|channel|>analysis<|message|>A<|end|><|start|>assistant<|channel|>commentary to=functions.f <|constrain|>json<|message|>{"x": "1"}<|call|><|channel|>analysis<|message|>B<|end|><|start|>assistant<|channel|>commentary to=functions.g <|constrain|>json<|message|>{"y": "2"}<|call|>'
      init:
        starting_state: None
        tool_output_mode: Native
        named_tool: null
      finish_reason: stop
      tools: []
      chunks:
      - delta_text: '<|channel|>analysis<|message|>A<|end|><|start|>assistant<|channel|>commentary to=functions.f <|constrain|>json<|message|>{"x": "1"}<|call|><|channel|>analysis<|message|>B<|end|><|start|>assistant<|channel|>commentary to=functions.g <|constrain|>json<|message|>{"y": "2"}<|call|>'
    golden:
      assembled:
      - kind: reasoning
        text: A
      - kind: tool_call
        name: f
        arguments:
          x: '1'
      - kind: reasoning
        text: B
      - kind: tool_call
        name: g
        arguments:
          y: '2'
  reason_then_tool:
    lifecycle: active
    scenario: reason_then_tool
    description: Reasoning fully precedes one tool call (baseline).
    policy: []
    display_id: UNIFIED.11-reason_then_tool
    historical_ids: []
    request:
      input: '<|channel|>analysis<|message|>Check weather.<|end|><|start|>assistant<|channel|>commentary to=functions.get_weather <|constrain|>json<|message|>{"city": "Paris"}<|call|>'
      init:
        starting_state: None
        tool_output_mode: Native
        named_tool: null
      finish_reason: stop
      tools: []
      chunks:
      - delta_text: '<|channel|>analysis<|message|>Check weather.<|end|><|start|>assistant<|channel|>commentary to=functions.get_weather <|constrain|>json<|message|>{"city": "Paris"}<|call|>'
    golden:
      assembled:
      - kind: reasoning
        text: Check weather.
      - kind: tool_call
        name: get_weather
        arguments:
          city: Paris
  reason_tool_reason_tool_reason:
    lifecycle: active
    scenario: reason_tool_reason_tool_reason
    description: reason -> tool -> reason -> tool -> reason. Three reasoning spans around two calls, including reasoning AFTER the last call — the split cannot place any of them.
    policy: []
    display_id: UNIFIED.11-reason_tool_reason_tool_reason
    historical_ids: []
    request:
      input: '<|channel|>analysis<|message|>A<|end|><|start|>assistant<|channel|>commentary to=functions.f <|constrain|>json<|message|>{"x": "1"}<|call|><|channel|>analysis<|message|>B<|end|><|start|>assistant<|channel|>commentary to=functions.g <|constrain|>json<|message|>{"y": "2"}<|call|><|channel|>analysis<|message|>C<|end|>'
      init:
        starting_state: None
        tool_output_mode: Native
        named_tool: null
      finish_reason: stop
      tools: []
      chunks:
      - delta_text: '<|channel|>analysis<|message|>A<|end|><|start|>assistant<|channel|>commentary to=functions.f <|constrain|>json<|message|>{"x": "1"}<|call|><|channel|>analysis<|message|>B<|end|><|start|>assistant<|channel|>commentary to=functions.g <|constrain|>json<|message|>{"y": "2"}<|call|><|channel|>analysis<|message|>C<|end|>'
    golden:
      assembled:
      - kind: reasoning
        text: A
      - kind: tool_call
        name: f
        arguments:
          x: '1'
      - kind: reasoning
        text: B
      - kind: tool_call
        name: g
        arguments:
          y: '2'
      - kind: reasoning
        text: C
  reason_tool_text_reason_tool:
    lifecycle: active
    scenario: reason_tool_text_reason_tool
    description: reason -> tool -> text -> reason -> tool. Two reasoning spans separated by a call and text.
    policy: []
    display_id: UNIFIED.11-reason_tool_text_reason_tool
    historical_ids: []
    request:
      input: '<|channel|>analysis<|message|>A<|end|><|start|>assistant<|channel|>commentary to=functions.f <|constrain|>json<|message|>{"x": "1"}<|call|><|channel|>final<|message|>working on it<|return|><|channel|>analysis<|message|>B<|end|><|start|>assistant<|channel|>commentary to=functions.g <|constrain|>json<|message|>{"y": "2"}<|call|>'
      init:
        starting_state: None
        tool_output_mode: Native
        named_tool: null
      finish_reason: stop
      tools: []
      chunks:
      - delta_text: '<|channel|>analysis<|message|>A<|end|><|start|>assistant<|channel|>commentary to=functions.f <|constrain|>json<|message|>{"x": "1"}<|call|><|channel|>final<|message|>working on it<|return|><|channel|>analysis<|message|>B<|end|><|start|>assistant<|channel|>commentary to=functions.g <|constrain|>json<|message|>{"y": "2"}<|call|>'
    golden:
      assembled:
      - kind: reasoning
        text: A
      - kind: tool_call
        name: f
        arguments:
          x: '1'
      - kind: text
        text: working on it
      - kind: reasoning
        text: B
      - kind: tool_call
        name: g
        arguments:
          y: '2'
  text_reason_tool_text_reason_tool:
    lifecycle: active
    scenario: text_reason_tool_text_reason_tool
    description: Deep well-formed interleave — visible text, reasoning, and tool calls alternating (text -> reason -> tool -> text -> reason -> tool). Every segment must survive in emitted order; the point is that user text, reasoning, and calls all mix in one stream.
    policy: []
    display_id: UNIFIED.11-text_reason_tool_text_reason_tool
    historical_ids: []
    request:
      input: '<|channel|>final<|message|>Sure. <|return|><|channel|>analysis<|message|>check A<|end|><|start|>assistant<|channel|>commentary to=functions.f <|constrain|>json<|message|>{"x": "1"}<|call|><|channel|>final<|message|> and <|return|><|channel|>analysis<|message|>check B<|end|><|start|>assistant<|channel|>commentary to=functions.g <|constrain|>json<|message|>{"y": "2"}<|call|>'
      init:
        starting_state: None
        tool_output_mode: Native
        named_tool: null
      finish_reason: stop
      tools: []
      chunks:
      - delta_text: '<|channel|>final<|message|>Sure. <|return|><|channel|>analysis<|message|>check A<|end|><|start|>assistant<|channel|>commentary to=functions.f <|constrain|>json<|message|>{"x": "1"}<|call|><|channel|>final<|message|> and <|return|><|channel|>analysis<|message|>check B<|end|><|start|>assistant<|channel|>commentary to=functions.g <|constrain|>json<|message|>{"y": "2"}<|call|>'
    golden:
      assembled:
      - kind: text
        text: 'Sure. '
      - kind: reasoning
        text: check A
      - kind: tool_call
        name: f
        arguments:
          x: '1'
      - kind: text
        text: ' and '
      - kind: reasoning
        text: check B
      - kind: tool_call
        name: g
        arguments:
          y: '2'
  two_calls:
    lifecycle: active
    scenario: two_calls
    description: 'Two tool calls back-to-back, no reasoning. Both must surface as ordered events. This is also covered in: TOOLCALLING.streamv1.2.a.'
    policy: []
    display_id: UNIFIED.2-two_calls
    historical_ids: []
    request:
      input: '<|start|>assistant<|channel|>commentary to=functions.f <|constrain|>json<|message|>{"x": "1"}<|call|><|start|>assistant<|channel|>commentary to=functions.g <|constrain|>json<|message|>{"y": "2"}<|call|>'
      init:
        starting_state: None
        tool_output_mode: Native
        named_tool: null
      finish_reason: stop
      tools: []
      chunks:
      - delta_text: '<|start|>assistant<|channel|>commentary to=functions.f <|constrain|>json<|message|>{"x": "1"}<|call|><|start|>assistant<|channel|>commentary to=functions.g <|constrain|>json<|message|>{"y": "2"}<|call|>'
    golden:
      assembled:
      - kind: tool_call
        name: f
        arguments:
          x: '1'
      - kind: tool_call
        name: g
        arguments:
          y: '2'
  two_calls_same_name:
    lifecycle: active
    scenario: two_calls_same_name
    description: 'The same tool called twice with different args. Both calls are distinct events. This is also covered in: TOOLCALLING.streamv1.2.d.'
    policy: []
    display_id: UNIFIED.2-two_calls_same_name
    historical_ids: []
    request:
      input: '<|start|>assistant<|channel|>commentary to=functions.get_weather <|constrain|>json<|message|>{"city": "Paris"}<|call|><|start|>assistant<|channel|>commentary to=functions.get_weather <|constrain|>json<|message|>{"city": "Tokyo"}<|call|>'
      init:
        starting_state: None
        tool_output_mode: Native
        named_tool: null
      finish_reason: stop
      tools: []
      chunks:
      - delta_text: '<|start|>assistant<|channel|>commentary to=functions.get_weather <|constrain|>json<|message|>{"city": "Paris"}<|call|><|start|>assistant<|channel|>commentary to=functions.get_weather <|constrain|>json<|message|>{"city": "Tokyo"}<|call|>'
    golden:
      assembled:
      - kind: tool_call
        name: get_weather
        arguments:
          city: Paris
      - kind: tool_call
        name: get_weather
        arguments:
          city: Tokyo
  text_only:
    lifecycle: active
    scenario: text_only
    description: 'Plain answer, no reasoning and no tool call. Pure content passthrough. This is also covered in: TOOLCALLING.streamv1.3. No e2e case has this shape: Qwen3.6 always emits a reasoning span, so the plain-content case is corpus-only.'
    policy: []
    display_id: UNIFIED.3-text_only
    historical_ids: []
    request:
      input: <|channel|>final<|message|>The answer is 42, no tools needed.<|return|>
      init:
        starting_state: None
        tool_output_mode: Native
        named_tool: null
      finish_reason: stop
      tools: []
      chunks:
      - delta_text: <|channel|>final<|message|>The answer is 42, no tools needed.<|return|>
    golden:
      assembled:
      - kind: text
        text: The answer is 42, no tools needed.
  tool_block_never_closed_then_text:
    lifecycle: active
    scenario: tool_block_never_closed_then_text
    description: 'A tool block opens and the model never closes it, then keeps writing prose. Nothing is emitted: the prose is BLOCK CONTENT, not the user''s answer, so it drops with the unrecoverable call — the same contract `truncated_tool_eof` (5.a) pins, here with the block opening at position 0 so no reasoning survives to mask it. Worth pinning precisely because the bytes look like an answer; the envelope is what decides.'
    policy:
    - P2
    display_id: UNIFIED.4-tool_block_never_closed_then_text
    historical_ids: []
    request:
      input: <|call|>still thinking about it
      init:
        starting_state: None
        tool_output_mode: Native
        named_tool: null
      finish_reason: stop
      tools: []
      chunks:
      - delta_text: <|call|>still thinking about it
    golden:
      assembled: []
  tool_markup_only_emits_nothing:
    lifecycle: active
    scenario: tool_markup_only_emits_nothing
    description: 'The whole generated output is control markup and nothing else — an empty DSML calls envelope for DeepSeek V4.1, or a stray close for the other families. Everything is stripped, so the parser emits NO events at all. Until this case there was no row with an empty golden: every case asserted something was produced, so ''markup alone leaks nothing'' (`I3`) was never actually pinned.'
    policy:
    - P2
    display_id: UNIFIED.4-tool_markup_only_emits_nothing
    historical_ids: []
    request:
      input: <|call|>
      init:
        starting_state: None
        tool_output_mode: Native
        named_tool: null
      finish_reason: stop
      tools: []
      chunks:
      - delta_text: <|call|>
    golden:
      assembled: []
  malformed_json_then_two_valid_calls:
    lifecycle: active
    scenario: malformed_json_then_two_valid_calls
    description: 'An unfinished JSON string with explicit call closers precedes echo(value=é) and echo(value=Café). Deliver the entire native input in one push, then finish: marker-aligned delivery masks the Kimi K3 0.7.13 lost-call defect. Preserve family malformed-value fallbacks and both later calls.'
    policy:
    - I2
    - I7
    - P2
    display_id: UNIFIED.5-malformed_json_then_two_valid_calls
    historical_ids: []
    request:
      input: '<|start|>assistant<|channel|>commentary to=functions.bad <|constrain|>json<|message|>{"value": "{\"x\":\"unfinished"}<|call|><|start|>assistant<|channel|>commentary to=functions.echo <|constrain|>json<|message|>{"value": "é"}<|call|><|start|>assistant<|channel|>commentary to=functions.echo <|constrain|>json<|message|>{"value": "Café"}<|call|>'
      init:
        starting_state: None
        tool_output_mode: Native
        named_tool: null
      finish_reason: stop
      tools:
      - name: bad
        parameters:
          type: object
          properties:
            value:
              type: object
      - name: echo
        parameters:
          type: object
          properties:
            value:
              type: string
          required:
          - value
      chunks:
      - delta_text: '<|start|>assistant<|channel|>commentary to=functions.bad <|constrain|>json<|message|>{"value": "{\"x\":\"unfinished"}<|call|><|start|>assistant<|channel|>commentary to=functions.echo <|constrain|>json<|message|>{"value": "é"}<|call|><|start|>assistant<|channel|>commentary to=functions.echo <|constrain|>json<|message|>{"value": "Café"}<|call|>'
    golden:
      assembled:
      - kind: tool_call
        name: bad
        arguments:
          value: '{"x":"unfinished'
      - kind: tool_call
        name: echo
        arguments:
          value: é
      - kind: tool_call
        name: echo
        arguments:
          value: Café
  arg_json_null:
    lifecycle: active
    scenario: arg_json_null
    description: 'The request tool schema permits JSON null. Bare parameter text `null` must produce JSON `null`; grammars with explicit types use native null syntax. Variants cover nullable type arrays, anyOf, oneOf, nullable, and const. Mixed-field probes also assert that non-nullable fields remain strings. Refs #251, #268, #269. The request tool schema declares `city` as `string | null` using a type array.'
    policy:
    - I7
    display_id: UNIFIED.7-arg_json_null
    historical_ids: []
    request:
      input: '<|start|>assistant<|channel|>commentary to=functions.get_weather <|constrain|>json<|message|>{"city": null}<|call|>'
      init:
        starting_state: None
        tool_output_mode: Native
        named_tool: null
      finish_reason: stop
      tools:
      - name: get_weather
        parameters:
          type: object
          properties:
            city:
              type:
              - string
