cases:
  tool_only:
    description: Single tool call, no reasoning. Must stay green everywhere (the existing tool suite's world).
    display_id: UNIFIED.1-tool_only
    request: 789d5425eac3b2c8d81c5d053f6260a83acca4e49dd433c12a5a21a165256261
    golden:
    - kind: tool_call
      name: get_weather
      arguments:
        city: Paris
  reason_then_tool:
    description: Reasoning fully precedes one tool call (baseline).
    display_id: UNIFIED.11-reason_then_tool
    request: 06744da244162d145c0789e3c35a72610076e9f16bfe2eb8dea72c9deea45ff6
    golden:
    - kind: reasoning
      text: Check weather.
    - kind: tool_call
      name: get_weather
      arguments:
        city: Paris
  reason_then_content:
    description: 'Reasoning then visible content, no tool call (baseline). This is also covered in: e2e case-0001-chinese_arithmetic__non-stream-budget_capped.json (+ 42 more: every `reasoning/core`, `reasoning/complex` and `reasoning/history` case, `tool_none_arithmetic__*`, and the SECOND step of both `lifecycle_*` — each with its `-budget_unlimited` pair).'
    display_id: UNIFIED.10-reason_then_content
    request: 60f20bdda8c4f2c4520a888a0fc9dd08f5f68530ab98d5ebc1366cafa953ba62
    golden:
    - kind: reasoning
      text: let me think
    - kind: text
      text: The answer is 42.
  interstitial_text:
    description: Reasoning, then visible text, THEN a tool call. Text between reasoning-end and the call must survive as its own event, in order.
    display_id: UNIFIED.11-interstitial_text
    request: 3f8b72b8e1ca72afb1102e8915611c1a45a3a9ffe4517b45cc9c0b292f875456
    golden:
    - kind: reasoning
      text: a
    - kind: text
      text: 'Here you go: '
    - kind: tool_call
      name: get_weather
      arguments:
        city: Paris
  reason_after_tool:
    description: Reasoning AFTER a tool call, then final text (Example A). The split cannot represent reasoning between the call and the answer.
    display_id: UNIFIED.11-reason_after_tool
    request: 10db3b5f31ea3d81253f21237b2516f2fa13af42a9f605707ddfecee29c8c709
    golden:
    - kind: reasoning
      text: Look it up.
    - kind: tool_call
      name: get_weather
      arguments:
        city: Paris
    - kind: reasoning
      text: Now answer.
    - kind: text
      text: It's 18C.
  content_then_reason:
    description: Visible content, then reasoning, then more content. The split hoists reasoning to the front and merges the two content spans.
    display_id: UNIFIED.11-content_then_reason
    request: 2cd85bdb356eddb880cef6b229b38164dc8f603cd9a0b8be0f64e4af3575cd15
    golden:
    - kind: text
      text: 'Hello there. '
    - kind: reasoning
      text: let me recall
    - kind: text
      text: The capital is Paris.
  content_then_reason_then_tool:
    description: Visible content BEFORE reasoning, then a tool call. The split hoists all reasoning to the front, so content-before-reasoning loses order.
    display_id: UNIFIED.11-content_then_reason_then_tool
    request: 75c5d8f8b8d5d00a2a3d8fd6867bda5612947552b5e9047e69fd085cccc04a38
    golden:
    - kind: text
      text: 'Sure, one sec. '
    - kind: reasoning
      text: checking the forecast
    - kind: tool_call
      name: get_weather
      arguments:
        city: Paris
  reason_interleaved:
    description: reason -> tool -> reason -> tool. Two calls, each preceded by its own thought.
    display_id: UNIFIED.11-reason_interleaved
    request: 4a6fb4eb6e585521fc73150704e5dc4d9d434b022e64a46a4fae24f4e8ab471d
    golden:
    - kind: reasoning
      text: A
    - kind: tool_call
      name: f
      arguments:
        x: '1'
    - kind: reasoning
      text: B
    - kind: tool_call
      name: g
      arguments:
        y: '2'
  reason_tool_text_reason_tool:
    description: reason -> tool -> text -> reason -> tool. Two reasoning spans separated by a call and text.
    display_id: UNIFIED.11-reason_tool_text_reason_tool
    request: 5d1ee9253e1b481f9fdfd5d9ebe3c239cb3516cb76009208abfb1f0d9e82ef9e
    golden:
    - kind: reasoning
      text: A
    - kind: tool_call
      name: f
      arguments:
        x: '1'
    - kind: text
      text: working on it
    - kind: reasoning
      text: B
    - kind: tool_call
      name: g
      arguments:
        y: '2'
  trailing_text_after_tool:
    policy:
    - P1
    description: Arbitrary visible prose AFTER the tool call (the point is it could be ANY content, so it must survive). Policy P1 (best-effort recovery) — trailing model text is preserved, not suppressed.
    display_id: UNIFIED.8-trailing_text_after_tool
    request: c857fc3f053b1dd9309761adf7e5b5c03780ad25a2d4f8e0aaffe3123b266556
    golden:
    - kind: tool_call
      name: get_weather
      arguments:
        city: Paris
    - kind: text
      text: The forecast shows clear skies for the rest of the week.
