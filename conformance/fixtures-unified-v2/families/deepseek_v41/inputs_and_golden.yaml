    - kind: tool_call
      name: get_weather
      arguments:
        city: Paris
  reason_only:
    historical_ids:
    - UNIFIED.10-1
    - UNIFIED.10.a
    description: 'A reasoning span with no visible answer and no tool call. This is also covered in: REASONING.batch.2.a.'
    display_id: UNIFIED.10-reason_only
    request: 58e5f860f3a929bba9185606d59acfbc81540d912a2e452c556bd3e31799c856
    golden:
    - kind: reasoning
      text: just thinking, no answer
  reason_then_content:
    historical_ids:
    - UNIFIED.10-2
    - UNIFIED.10.b
    description: 'Reasoning then visible content, no tool call (baseline). This is also covered in: e2e case-0001-chinese_arithmetic__non-stream-budget_capped.json (+ 42 more: every `reasoning/core`, `reasoning/complex` and `reasoning/history` case, `tool_none_arithmetic__*`, and the SECOND step of both `lifecycle_*` — each with its `-budget_unlimited` pair).'
    display_id: UNIFIED.10-reason_then_content
    request: 122e37a1ea41746bce0503610f55c033c126481c2e0e381427d555d6d5d14042
    golden:
    - kind: reasoning
      text: let me think
    - kind: text
      text: The answer is 42.
  two_reason_spans:
    historical_ids:
    - UNIFIED.10-3
    - UNIFIED.10.c
    description: 'Two reasoning spans separated by visible text, no tool call. Streaming keeps both spans in order; batch merges them. This is also covered in: REASONING.batch.6.a.'
    display_id: UNIFIED.10-two_reason_spans
    request: 73fb7a9059ad1d3c2059f3e40440f78cc4395487c7cc31e009e745be8ecc0837
    golden:
    - kind: reasoning
      text: first thought
    - kind: text
      text: 'interlude '
    - kind: reasoning
      text: second thought
    - kind: text
      text: done
  reason_unterminated:
    historical_ids:
    - UNIFIED.10-4
    - UNIFIED.10.d
    description: Stream ends while still inside reasoning (no close marker). Open reasoning is promoted at finish, not dropped and not leaked as text.
    display_id: UNIFIED.10-reason_unterminated
    request: d1db72d392eef144ec21b10a3bf346745fe397c0d13f4de746d8398534a0bfdf
    golden:
    - kind: reasoning
      text: thinking but stream ends
  two_adjacent_reason_spans:
    historical_ids:
    - UNIFIED.10-5
    - UNIFIED.10.e
    description: 'Two reasoning spans with nothing between them, then the answer. The single `reasoning_text` field every batch parser exposes can only concatenate them, so the separator is part of the contract: adjacent spans join with a newline. The counterpart is already covered by `reason_after_tool` / `reason_interleaved`, where two spans separated by a call must NOT join — a parser that always joins invents a newline the model never emitted, and one that never joins loses the batch parity every engine has.'
    display_id: UNIFIED.10-two_adjacent_reason_spans
    request: e3ee307214ba9614e2905612a2d4d90cf08d1589d7dfa821915934f730bd48cf
    golden:
    - kind: reasoning
      text: 'first

        second'
    - kind: text
      text: done
