# Cases of `reference-goldens.jsonl` (plain `<|start|>assistant` prefix, and the prefilled
# prefixes the parsers can start from) where the beam
# parsers deliberately differ from the model builder's reference serving layer. The list
# is shared by the V2 unified parser and the V1 route (reasoning parser + tool parser):
# `beam_reference_goldens.rs` replays both and fails on any mismatch not listed here AND
# on any entry that no longer mismatches, so this list is exact for each route. Every
# input below is fuzz-generated malformed output; on template-conforming output all
# three implementations agree on all cases.
#
# Classes (the tag opens each reason):
#   F  — a `<|start|>` inside a body whose own terminator never came. V2 ends the body
#        there and parses what follows (a later call or reply is recovered, no markup
#        reaches the user); the reference keeps everything up to its closer as that
#        channel's text, control markers included.
#   C  — a control token (`<|end|>`, `<|call|>`) inside a parameter value. V2 reads the
#        value up to its `</rfl:parameter>` (XML semantics: the value is data); the
#        reference's first stage closes the call at the token and the template's tag
#        search then sees only the parameters before it. Both are defensible; `<|call|>`
#        and `<|return|>` are stop tokens, so a real stream never carries them mid-value.
#   E2 — a call the stream ends inside (no `<|call|>`/`<|end|>`). The reference emits it
#        with `arguments: ""` and marks the region unusable; V2 drops it (only a
#        delimiter-terminated call is a call), so no client ever receives `""` arguments.
#   P  — a reply the prompt prefilled (`Response` starting state). Once the stream
#        reaches the reply's own terminator the reference drops everything after it;
#        V1 and V2 treat the whole stream as the reply and keep those bytes visible
#        with control markers stripped (a framed thought in a prefilled reply is read as
#        reply text with its framing consumed).
#   R  — an artifact of the reference's two-stage pipeline: tool extraction runs over
#        the concatenation of all non-reasoning text with the first stage's delimiters
#        already removed, so a bare `to=NAME<|channel|>…` inside a `final` body opens a
#        call there and a call body can run across a removed `<|end|>` into the next
#        header. V2 is a single state machine: a `final` body is text until its closer,
#        and every call ends at its own terminator.
#   N  — a recipient the serving grammar admits (`[^\s<]+`, here the declared tool
#        `2fa_check`) but the reference's `[a-zA-Z_][a-zA-Z0-9_.-]*` recipient rule does
#        not: the reference reads no call, V2 serves the call the grammar held the model
#        to (the builder and parser share one name contract, `[A-Za-z0-9_.-]+`).
#   A  — `<|call|>` inside a `final` body. The serving grammar closes the final answer
#        with `<|return|>`, `<|end|>` or `<|call|>` (its stop tokens), so V2 ends the
#        answer there and what follows is debris between messages; the reference keeps
#        `<|call|>` as content. A stop token never reaches a parser mid-answer in a real
#        stream, so only fuzzed input shows the difference.
