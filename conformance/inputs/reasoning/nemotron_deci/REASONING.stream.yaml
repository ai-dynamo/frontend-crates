family: nemotron_deci
model_label: Nemotron Deci v1 / GLM 4.5
mode: stream
captured_with:
  vllm_python: '0.23.0'
  sglang_python: '0.5.12.post1'
refs:
  upstream: &upstream_ref 'inspired by vLLM GLM/Nemotron think-tag reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_glm4_moe_reasoning_parser.py and https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_nemotron_v3_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
cases:
  REASONING.stream.1.a:
    description: Empty stream chunk
    ref: *upstream_ref
    chunks:
    - ''
    expected:
      dynamo_v1: &d_s0
        reasoning_text: ''
        normal_text: ''
      vllm_python: *d_s0
      sglang_python: *d_s0
  REASONING.stream.2.a:
    description: Single reasoning block across chunks
    ref: *upstream_ref
    spec_ref: lib/parsers/REASONING_CASES.md; https://docs.nvidia.com/dynamo/latest/user-guides/parsing/reasoning-parsing-dynamo
    chunks:
    - <think>thin
    - king</think>
    - answer
    expected:
      dynamo_v1: &d_s1
        reasoning_text: thinking
        normal_text: answer
      vllm_python:
        reasoning_text: <think>thinking
        normal_text: answer
        explanation: Dynamo strips reasoning delimiters even when the block is streamed across chunks; vLLM leaks the start delimiter.
      sglang_python: *d_s1
  REASONING.stream.2.b:
    description: Multiple reasoning spans across chunks
    ref: *upstream_ref
    spec_ref: lib/parsers/REASONING_CASES.md; https://docs.nvidia.com/dynamo/latest/user-guides/parsing/reasoning-parsing-dynamo
    chunks:
    - <think>first</think>
    - ' middle '
    - <think>second</think> done
    expected:
      dynamo_v1:
        reasoning_text: firstsecond
        normal_text: ' middle  done'
      vllm_python:
        reasoning_text: first
        normal_text: ' middle <think>second</think> done'
        explanation: Dynamo extracts each complete reasoning span across chunks; vLLM leaves the later complete span in normal_text.
      sglang_python:
        reasoning_text: first
        normal_text: ' middle <think>second</think> done'
        explanation: Dynamo re-enters reasoning on each open marker across chunks and concatenates all spans; SGLang exits at the first end marker and does not re-enter, leaving the later span in normal_text.
  REASONING.stream.3.a:
    description: Start marker split across chunks
    ref: *upstream_ref
    spec_ref: lib/parsers/REASONING_CASES.md; https://docs.nvidia.com/dynamo/latest/user-guides/parsing/reasoning-parsing-dynamo
    chunks:
    - <th
    - ink>thinking</think>answer
    expected:
      dynamo_v1: &d_s2
        reasoning_text: thinking
        normal_text: answer
      vllm_python:
        reasoning_text: <think>thinking
        normal_text: answer
        explanation: Dynamo buffers a split start delimiter and strips it; vLLM leaks the reconstructed delimiter.
      sglang_python: *d_s2
  REASONING.stream.3.b:
    description: End marker split across chunks
    ref: *upstream_ref
    spec_ref: lib/parsers/REASONING_CASES.md; https://docs.nvidia.com/dynamo/latest/user-guides/parsing/reasoning-parsing-dynamo
    chunks:
    - <think>thinking</th
    - ink>answer
    expected:
      dynamo_v1:
        reasoning_text: thinking
        normal_text: answer
      vllm_python:
        reasoning_text: <think>thinking</think>answer
        normal_text: ''
        explanation: Dynamo buffers a split end delimiter and resumes normal_text after it; vLLM keeps the delimiter and answer in reasoning_text.
      sglang_python:
        reasoning_text: thinking</think>answer
        normal_text: ''
        explanation: Dynamo buffers an end marker split across chunk boundaries and resumes normal_text after it; SGLang streams the partial delimiter as reasoning (it only holds back a partial marker when the whole pending buffer is a marker prefix), so the split marker is never reassembled and the answer stays in reasoning_text.
  REASONING.stream.3.c:
    description: Partial start-marker prefix later becomes normal text
    ref: *upstream_ref
    spec_ref: lib/parsers/REASONING_CASES.md; https://docs.nvidia.com/dynamo/latest/user-guides/parsing/reasoning-parsing-dynamo
    chunks:
    - plain <th
    - esis answer
    expected:
      dynamo_v1: &d_s6
        reasoning_text: ''
        normal_text: plain <thesis answer
      vllm_python:
        reasoning_text: plain <thesis answer
        normal_text: ''
        explanation: vLLM GLM/Nemotron parser (`glm45`) defaults thinking on and routes marker-free deltas to reasoning.
      sglang_python: *d_s6
  REASONING.stream.1.b:
    description: Plain text without reasoning markers
    ref: *upstream_ref
    spec_ref: lib/parsers/REASONING_CASES.md; https://docs.nvidia.com/dynamo/latest/user-guides/parsing/reasoning-parsing-dynamo
    chunks:
    - plain
    - ' answer'
    expected:
      dynamo_v1: &id001
        reasoning_text: ''
        normal_text: plain answer
      vllm_python:
        reasoning_text: plain answer
        normal_text: ''
        explanation: vLLM GLM/Nemotron parser (`glm45`) defaults thinking on and routes marker-free deltas to reasoning.
      sglang_python: *id001
  REASONING.stream.2.c:
    description: Stray end marker after a complete reasoning span, across chunks(unbalanced-tag)
    ref: dynamo
    spec_ref: tests/parity/README.md
    chunks:
    - '<think>preamble</think>'
    - 'body</think>'
    - 'answer'
    expected:
      dynamo_v1:
        reasoning_text: preamble
        normal_text: 'bodyanswer'
        explanation: 'Lossless split: when a stray close marker appears outside any reasoning block, it is stripped (parser-owned syntax must not appear in normal_text). Reasoning is captured from the first <open>...<close> pair only; subsequent stray closes are discarded.'
      vllm_python:
        reasoning_text: 'preamble'
        normal_text: 'body</think>answer'
      sglang_python:
        reasoning_text: 'preamble'
        normal_text: 'body</think>answer'
  REASONING.stream.4.a:
    description: Downstream streaming boundary is not applicable to GLM/Nemotron
    explanation: GLM/Nemotron parsers have no configured Harmony commentary boundary; closed-span handoff is covered by REASONING.batch.3.a.
  REASONING.stream.4.b:
    description: Split downstream streaming boundary is not applicable to GLM/Nemotron
    explanation: GLM/Nemotron parsers have no Harmony `commentary to=functions.*` stream boundary to split across chunks.
  REASONING.stream.4.c:
    description: Partial downstream boundary recovery is not applicable to GLM/Nemotron
    explanation: GLM/Nemotron parsers have no Harmony commentary protocol, so partial commentary-boundary recovery is outside their grammar.
  REASONING.stream.4.d:
    description: Directed Harmony analysis tool calls are not applicable to GLM/Nemotron
    explanation: This parser family does not use Harmony `analysis to=functions.*` envelopes, so split analysis-channel tool-call handoff is outside its grammar.
