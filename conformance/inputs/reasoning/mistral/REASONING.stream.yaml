family: mistral
model_label: Mistral / Magistral
mode: stream
captured_with:
  vllm_python: '0.23.0'
  sglang_python: '0.5.12.post1'
refs:
  upstream: &upstream_ref 'inspired by vLLM Mistral reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_mistral_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
cases:
  REASONING.stream.1.a:
    description: Empty stream chunk
    ref: *upstream_ref
    chunks:
    - ''
    expected:
      dynamo_v1: &d_s0
        reasoning_text: ''
        normal_text: ''
      vllm_python: *d_s0
      sglang_python: *d_s0
  REASONING.stream.2.a:
    description: Mistral THINK block across chunks
    ref: *upstream_ref
    chunks:
    - '[THINK]thin'
    - king[/THINK]answer
    expected:
      dynamo_v1: &d_s1
        reasoning_text: thinking
        normal_text: answer
      vllm_python:
        reasoning_text: '[THINK]thinking'
        normal_text: answer
      sglang_python: *d_s1
  REASONING.stream.2.b:
    description: Multiple Mistral THINK spans across chunks
    ref: *upstream_ref
    chunks:
    - '[THINK]first[/THINK]'
    - ' middle '
    - '[THINK]second[/THINK] done'
    expected:
      dynamo_v1:
        reasoning_text: firstsecond
        normal_text: ' middle  done'
      vllm_python:
        reasoning_text: first
        normal_text: ' middle [THINK]second[/THINK] done'
      sglang_python:
        reasoning_text: first
        normal_text: ' middle [THINK]second[/THINK] done'
  REASONING.stream.3.a:
    description: Start marker split across chunks
    ref: *upstream_ref
    chunks:
    - '[TH'
    - INK]thinking[/THINK]answer
    expected:
      dynamo_v1: &d_s2
        reasoning_text: thinking
        normal_text: answer
      vllm_python:
        reasoning_text: ''
        normal_text: '[THINK]thinking[/THINK]answer'
      sglang_python: *d_s2
  REASONING.stream.3.b:
    description: End marker split across chunks
    ref: *upstream_ref
    chunks:
    - '[THINK]thinking[/TH'
    - INK]answer
    expected:
      dynamo_v1:
        reasoning_text: thinking
        normal_text: answer
      vllm_python:
        reasoning_text: '[THINK]thinking[/THINK]answer'
        normal_text: ''
      sglang_python:
        reasoning_text: thinking[/THINK]answer
        normal_text: ''
  REASONING.stream.3.c:
    description: Partial start-marker prefix later resolves as force-reasoning text
    ref: *upstream_ref
    chunks:
    - plain [TH
    - ESIS answer
    expected:
      dynamo_v1:
        reasoning_text: plain [THESIS answer
        normal_text: ''
      vllm_python:
        reasoning_text: ''
        normal_text: plain [THESIS answer
        explanation: vLLM Mistral streaming parser only enters reasoning after an explicit start marker.
      sglang_python:
        reasoning_text: ''
        normal_text: plain [THESIS answer
  REASONING.stream.1.b:
    description: Plain text stays in force-reasoning mode until an end marker
    ref: *upstream_ref
    chunks:
    - plain
    - ' answer'
    expected:
      dynamo_v1:
        reasoning_text: plain answer
        normal_text: ''
      vllm_python:
        reasoning_text: ''
        normal_text: plain answer
        explanation: vLLM Mistral streaming parser only enters reasoning after an explicit start marker.
      sglang_python:
        reasoning_text: ''
        normal_text: plain answer
  REASONING.stream.2.c:
    description: Stray end marker after a complete reasoning span, across chunks(unbalanced-tag)
    ref: dynamo
    spec_ref: tests/parity/README.md
    chunks:
    - '[THINK]preamble[/THINK]'
    - 'body[/THINK]'
    - 'answer'
    expected:
      dynamo_v1:
        reasoning_text: preamble
        normal_text: 'bodyanswer'
        explanation: 'Lossless split: when a stray close marker appears outside any reasoning block, it is stripped (parser-owned syntax must not appear in normal_text). Reasoning is captured from the first <open>...<close> pair only; subsequent stray closes are discarded.'
      vllm_python:
        reasoning_text: 'preamble'
        normal_text: 'body[/THINK]answer'
      sglang_python:
        reasoning_text: 'preamble'
        normal_text: 'body[/THINK]answer'
  REASONING.stream.4.a:
    description: Downstream streaming boundary is not applicable to Mistral
    explanation: Mistral has no configured Harmony commentary boundary; closed-span handoff is covered by REASONING.batch.3.a.
  REASONING.stream.4.b:
    description: Split downstream streaming boundary is not applicable to Mistral
    explanation: Mistral has no Harmony `commentary to=functions.*` stream boundary to split across chunks.
  REASONING.stream.4.c:
    description: Partial downstream boundary recovery is not applicable to Mistral
    explanation: Mistral has no Harmony commentary protocol, so partial commentary-boundary recovery is outside its grammar.
  REASONING.stream.4.d:
    description: Directed Harmony analysis tool calls are not applicable to Mistral
    explanation: This parser family does not use Harmony `analysis to=functions.*` envelopes, so split analysis-channel tool-call handoff is outside its grammar.
