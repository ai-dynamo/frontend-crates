family: minimax_m2
mode: streamv1
model_label: MiniMax 2.7
cases:
  TOOLCALLING.streamv1.2.a:
    description: Two invokes inside one tool_call wrapper
    ref: derived from TOOLCALLING.batch.2.a
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    - name: get_time
      parameters:
        type: object
        properties:
          timezone:
            type: string
    chunks:
    - delta_text: "<minimax:tool_call>\n<invoke"
    - delta_text: ' name="get_weather">'
    - delta_text: "\n<parameter name=\"location\">NYC</parameter>"
    - delta_text: "\n</invoke>\n<invoke"
    - delta_text: ' name="get_time">'
    - delta_text: "\n<parameter name=\"timezone\">"
    - delta_text: "EST</parameter>\n</invoke>\n</minimax:tool_call>"
    - delta_text: ''
      finish_reason: tool_calls
  TOOLCALLING.streamv1.2.b:
    description: Two back-to-back tool_call wrappers
    ref: derived from TOOLCALLING.batch.2.b
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    - name: get_time
      parameters:
        type: object
        properties:
          timezone:
            type: string
    chunks:
    - delta_text: "<minimax:tool_call>\n<invoke"
    - delta_text: ' name="get_weather">'
    - delta_text: "\n<parameter name=\"location\">NYC</parameter>"
    - delta_text: "\n</invoke>\n</minimax:tool_call>"
    - delta_text: "\n<minimax:tool_call>"
    - delta_text: "\n<invoke name=\"get_time\">"
    - delta_text: "\n<parameter name=\"timezone\">EST</parameter>"
    - delta_text: "\n</invoke>"
    - delta_text: "\n</minimax:tool_call>"
    - delta_text: ''
      finish_reason: tool_calls
  TOOLCALLING.streamv1.2.c:
    description: Parallel with surrounding narration
    ref: derived from TOOLCALLING.batch.2.c
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    - name: get_time
      parameters:
        type: object
        properties:
          timezone:
            type: string
    chunks:
    - delta_text: 'Both: <minimax:tool_call>'
    - delta_text: "\n<invoke"
    - delta_text: " name=\"get_weather\">\n<parameter name=\"location\">"
    - delta_text: "NYC</parameter>\n</invoke>"
    - delta_text: "\n<invoke"
    - delta_text: " name=\"get_time\">\n<parameter"
    - delta_text: " name=\"timezone\">EST</parameter>\n</invoke>"
    - delta_text: "\n</minimax:tool_call>"
    - delta_text: ' Done.'
    - delta_text: ''
      finish_reason: tool_calls
  TOOLCALLING.streamv1.2.d:
    description: Same-name twice
    ref: derived from TOOLCALLING.batch.2.d
    tools:
    - &id001
      name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    - *id001
    chunks:
    - delta_text: "<minimax:tool_call>\n<invoke"
    - delta_text: ' name="get_weather">'
    - delta_text: "\n<parameter name=\"location\">NYC</parameter>"
    - delta_text: "\n</invoke>\n<invoke"
    - delta_text: ' name="get_weather">'
    - delta_text: "\n<parameter name=\"location\">"
    - delta_text: "LA</parameter>\n</invoke>\n</minimax:tool_call>"
    - delta_text: ''
      finish_reason: tool_calls
