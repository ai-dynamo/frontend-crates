  TOOLCALLING.streamv1.7.n:
    description: 'Single Family Test (MiniMax M3): whitespace-only and padded string leaves inside nested containers are values, not formatting. The chat template emits them verbatim, so sep keeps two spaces, prefix keeps its padding, and the newline-only array item stays a newline. Constructed native regression probe for PR #360; not captured model output.'
