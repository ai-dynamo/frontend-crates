family: minimax_m3
mode: streamv1
model_label: MiniMax M3
cases:
  TOOLCALLING.streamv1.7.a:
    description: Standard scalar types (string + int + bool)
    ref: derived from TOOLCALLING.batch.7.a
    tools:
    - name: book_flight
      parameters:
        type: object
        properties:
          destination:
            type: string
          passengers:
            type: integer
          first_class:
            type: boolean
    chunks:
    - delta_text: ']<]minimax[>[<tool_call>

        ]<]minimax[>[<invoke name="book_flight">

        ]<]minimax[>[<destination>Paris]<]minimax[>[</destination>

        ]<]minimax[>[<passengers>2]<]minimax[>[</passengers>

        ]<]minimax[>[<first_class>true]<]minimax[>[</first_class>

        ]<]minimax[>[</invoke>

        ]<]minimax[>[</tool_call>'
    - delta_text: ''
      finish_reason: tool_calls
  TOOLCALLING.streamv1.7.b:
    description: Unicode + XML entity unescape in string value
    ref: derived from TOOLCALLING.batch.7.b
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    chunks:
    - delta_text: ']<]minimax[>[<tool_call>

        ]<]minimax[>[<invoke name="get_weather">

        ]<]minimax[>[<location>Tōkyō &quot;central&quot; &amp; west]<]minimax[>[</location>

        ]<]minimax[>[</invoke>

        ]<]minimax[>[</tool_call>'
    - delta_text: ''
      finish_reason: tool_calls
  TOOLCALLING.streamv1.7.c:
    description: Schema mismatch — string value where schema declares integer
    ref: derived from TOOLCALLING.batch.7.c
    tools:
    - name: set_temperature
      parameters:
        type: object
        properties:
          celsius:
            type: integer
    chunks:
    - delta_text: ']<]minimax[>[<tool_call>

        ]<]minimax[>[<invoke name="set_temperature">

        ]<]minimax[>[<celsius>twenty]<]minimax[>[</celsius>

        ]<]minimax[>[</invoke>

        ]<]minimax[>[</tool_call>'
    - delta_text: ''
      finish_reason: tool_calls
  TOOLCALLING.streamv1.7.d:
    description: Nested object + array represented as nested MiniMax XML tags
    ref: derived from TOOLCALLING.batch.7.d
    tools:
    - name: process_data
      parameters:
        type: object
        properties:
          items:
            type: array
            items:
              type: integer
          config:
            type: object
            properties:
              nested:
                type: boolean
    chunks:
    - delta_text: ']<]minimax[>[<tool_call>

        ]<]minimax[>[<invoke name="process_data">

        ]<]minimax[>[<items>]<]minimax[>[<item>1]<]minimax[>[</item>]<]minimax[>[<item>2]<]minimax[>[</item>]<]minimax[>[<item>3]<]minimax[>[</item>]<]minimax[>[</items>

        ]<]minimax[>[<config>]<]minimax[>[<nested>true]<]minimax[>[</nested>]<]minimax[>[</config>

        ]<]minimax[>[</invoke>

        ]<]minimax[>[</tool_call>'
    - delta_text: ''
      finish_reason: tool_calls
  TOOLCALLING.streamv1.7.e:
    description: Large / deep nested MiniMax XML argument payload
    ref: derived from TOOLCALLING.batch.7.e
    tools:
    - name: process_data
      parameters:
        type: object
        properties:
          payload:
            type: object
            properties:
              regions:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    scores:
                      type: array
                      items:
                        type: integer
              flags:
                type: object
                properties:
                  enabled:
                    type: boolean
                  retry:
                    type:
                    - 'null'
                    - string
              empty:
                type: object
    chunks:
    - delta_text: ']<]minimax[>[<tool_call>

        ]<]minimax[>[<invoke name="process_data">

        ]<]minimax[>[<payload>]<]minimax[>[<regions>]<]minimax[>[<item>]<]minimax[>[<name>west]<]minimax[>[</name>]<]minimax[>[<scores>]<]minimax[>[<item>1]<]minimax[>[</item>]<]minimax[>[<item>2]<]minimax[>[</item>]<]minimax[>[<item>3]<]minimax[>[</item>]<]minimax[>[</scores>]<]minimax[>[</item>]<]minimax[>[<item>]<]minimax[>[<name>east]<]minimax[>[</name>]<]minimax[>[<scores>]<]minimax[>[<item>4]<]minimax[>[</item>]<]minimax[>[<item>5]<]minimax[>[</item>]<]minimax[>[<item>6]<]minimax[>[</item>]<]minimax[>[</scores>]<]minimax[>[</item>]<]minimax[>[</regions>]<]minimax[>[<flags>]<]minimax[>[<enabled>true]<]minimax[>[</enabled>]<]minimax[>[<retry>null]<]minimax[>[</retry>]<]minimax[>[</flags>]<]minimax[>[<empty>]<]minimax[>[</empty>]<]minimax[>[</payload>

        ]<]minimax[>[</invoke>

        ]<]minimax[>[</tool_call>'
    - delta_text: ''
      finish_reason: tool_calls
  TOOLCALLING.streamv1.7.f:
    description: Numeric precision edge preserves integer-like number literal
    ref: derived from TOOLCALLING.batch.7.f
    tools:
    - name: set_limit
      parameters:
        type: object
        properties:
          count:
            type: number
    chunks:
    - delta_text: ']<]minimax[>[<tool_call>

        ]<]minimax[>[<invoke name="set_limit">

        ]<]minimax[>[<count>9007199254740993]<]minimax[>[</count>

        ]<]minimax[>[</invoke>

        ]<]minimax[>[</tool_call>'
    - delta_text: ''
      finish_reason: tool_calls
  TOOLCALLING.streamv1.7.g:
    description: Composed scalar schemas preserve integer, number, and boolean values
    ref: https://github.com/ai-dynamo/frontend-crates/pull/248
    tools:
    - name: inspect
      parameters:
        type: object
        properties:
          count:
            anyOf:
            - type: integer
          ratio:
            type:
            - number
          enabled:
            type:
            - boolean
    chunks:
    - delta_text: ']<]minimax[>[<tool_call>]<]minimax[>[<invoke name="inspect">]<]minimax[>[<count>42]<]minimax[>[</count>]<]minimax[>[<ratio>1.25]<]minimax[>[</ratio>'
    - delta_text: ']<]minimax[>[<enabled>false]<]minimax[>[</enabled>]<]minimax[>[</invoke>]<]minimax[>[</tool_call>'
    - delta_text: ''
      finish_reason: tool_calls
  TOOLCALLING.streamv1.7.h:
    description: Family-native string arguments preserve whitespace and empty strings
    ref: https://github.com/ai-dynamo/frontend-crates/pull/247
    tools:
    - name: inspect
      parameters:
        type: object
        properties:
          spaced:
            type: string
          blank:
            type: string
          empty:
            type: string
    chunks:
    - delta_text: ']<]minimax[>[<tool_call>]<]minimax[>[<invoke name="inspect">]<]minimax[>[<spaced>  café

        ]<]minimax[>[</spaced>'
    - delta_text: "]<]minimax[>[<blank>\t\r\n ]<]minimax[>[</blank>]<]minimax[>[<empty>]<]minimax[>[</empty>"
    - delta_text: ']<]minimax[>[</invoke>]<]minimax[>[</tool_call>'
    - delta_text: ''
      finish_reason: tool_calls
  TOOLCALLING.streamv1.7.j:
    description: MiniMax M3 keeps nested integer values when an object wins a nullable union
    ref: https://github.com/ai-dynamo/frontend-crates/pull/270
    tools:
    - name: list_notes
      parameters:
        type: object
        properties:
          pagination:
            anyOf:
            - type: object
              properties:
                page:
                  type: integer
                  minimum: 1
                per_page:
                  type: integer
                  minimum: 1
                  maximum: 100
            - type: 'null'
        required:
        - pagination
        additionalProperties: false
      strict: true
    chunks:
    - delta_text: ']<]minimax[>[<tool_call>]<]minimax[>[<invoke name="list_notes">'
    - delta_text: ']<]minimax[>[<pagination>]<]minimax[>[<page>2]<]minimax[>[</page>'
    - delta_text: ']<]minimax[>[<per_page>25]<]minimax[>[</per_page>]<]minimax[>[</pagination>]<]minimax[>[</invoke>]<]minimax[>[</tool_call>'
    - delta_text: ''
      finish_reason: tool_calls
  TOOLCALLING.streamv1.7.l:
    description: MiniMax M3 resolves a local parameter reference before parsing object arguments
    ref: https://github.com/ai-dynamo/frontend-crates/pull/273
    tools:
    - name: authenticate_first_name
      parameters:
        type: object
        $defs:
          Schema:
            type: object
            properties:
              input:
                type: string
              notes:
                type: string
            required:
            - input
            - notes
            additionalProperties: false
        properties:
          data:
            $ref: '#/$defs/Schema'
        required:
        - data
        additionalProperties: false
    chunks:
    - delta_text: ']<]minimax[>[<tool_call>]<]minimax[>[<invoke name="authenticate_first_name">'
    - delta_text: ']<]minimax[>[<data>{"input":"Alex","notes":"first name supplied"}]<]minimax[>[</data>'
    - delta_text: ']<]minimax[>[</invoke>]<]minimax[>[</tool_call>'
    - delta_text: ''
      finish_reason: tool_calls
  TOOLCALLING.streamv1.7.m:
    description: 'Single Family Test (MiniMax M3): pretty-printed nested containers. Newlines and indentation between nested tags are formatting, not data, so view_range parses to [1, 50] with no whitespace array items and filter has no $text member. Constructed native regression probe for PR #360; not captured model output.'
    ref: https://github.com/ai-dynamo/frontend-crates/pull/360
    tools:
    - name: view_file
      parameters:
        type: object
        properties:
          path:
            type: string
          view_range:
            type: array
            items:
              type: integer
          filter:
            type: object
            properties:
              name:
                type: string
              depth:
                type: integer
    golden:
      normal_text: ''
      calls:
      - name: view_file
        arguments:
          path: src/main.rs
          view_range:
          - 1
          - 50
          filter:
            name: src
            depth: 2
