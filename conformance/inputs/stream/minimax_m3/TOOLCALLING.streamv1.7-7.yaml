family: minimax_m3
mode: streamv1
cases:
  TOOLCALLING.streamv1.7-7:
    description: 'Null-only literal union branches: const: null and enum: [null] cannot accept objects, so anyOf and oneOf still have a unique object branch whose page member is an integer. Constructed native MiniMax M3 regression probe for PR #270.'
    ref: https://github.com/ai-dynamo/frontend-crates/pull/270
    tools:
    - name: list_notes
      parameters:
        type: object
        properties:
          anyof_const:
            anyOf:
            - type: object
              properties:
                page:
                  type: integer
            - const: null
          anyof_enum:
            anyOf:
            - type: object
              properties:
                page:
                  type: integer
            - enum:
              - null
          oneof_const:
            oneOf:
            - type: object
              properties:
                page:
                  type: integer
            - const: null
          oneof_enum:
            oneOf:
            - type: object
              properties:
                page:
                  type: integer
            - enum:
              - null
      strict: true
    golden:
      calls:
      - name: list_notes
        arguments:
          anyof_const:
            page: 2
          anyof_enum:
            page: 2
          oneof_const:
            page: 2
          oneof_enum:
            page: 2
      normal_text: ''
    chunks:
    - delta_text: ']<]minimax[>[<tool_call>]<]minimax[>['
    - delta_text: <invoke name="list_notes">]<]minimax[
    - delta_text: '>[<anyof_const>]<]minimax[>[<page>2]<'
    - delta_text: ']minimax[>[</page>]<]minimax[>[</anyo'
    - delta_text: f_const>]<]minimax[>[<anyof_enum>]<]m
    - delta_text: inimax[>[<page>2]<]minimax[>[</page>]
    - delta_text: <]minimax[>[</anyof_enum>]<]minimax[>
    - delta_text: '[<oneof_const>]<]minimax[>[<page>2]<]'
    - delta_text: minimax[>[</page>]<]minimax[>[</oneof
    - delta_text: _const>]<]minimax[>[<oneof_enum>]<]mi
    - delta_text: nimax[>[<page>2]<]minimax[>[</page>]<
    - delta_text: ']minimax[>[</oneof_enum>]<]minimax[>['
    - delta_text: </invoke>]<]minimax[>[</tool_call>
    - delta_text: ''
      finish_reason: tool_calls
