family: minimax_m3
mode: streamv1
cases:
  TOOLCALLING.streamv1.7-9:
    description: 'Local parameter reference: data references an object schema, so JSON text becomes an object rather than a string. Constructed native MiniMax M3 regression probe for PR #273; not captured model output.'
    ref: https://github.com/ai-dynamo/frontend-crates/pull/273
    tools:
    - name: capture
      parameters:
        type: object
        $defs:
          Payload:
            type: object
        properties:
          data:
            $ref: '#/$defs/Payload'
      strict: true
    golden:
      normal_text: ''
      calls:
      - name: capture
        arguments:
          data:
            input: Alex
    chunks:
    - delta_text: ']<]minimax[>[<tool_call>]<]minima'
    - delta_text: x[>[<invoke name="capture">]<]min
    - delta_text: imax[>[<data>{"input":"Alex"}]<]m
    - delta_text: inimax[>[</data>]<]minimax[>[</in
    - delta_text: voke>]<]minimax[>[</tool_call>
    - delta_text: ''
      finish_reason: tool_calls
