family: minimax_m3
mode: streamv1
model_label: MiniMax M3
cases:
  TOOLCALLING.streamv1.8.d:
    description: Narration between two native tool-call wrappers
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    - name: get_time
      parameters:
        type: object
        properties:
          location:
            type: string
    - name: ping
      parameters:
        type: object
        properties:
          location:
            type: string
    chunks:
    - delta_text: ']<]minimax[>[<tool_call>'
    - delta_text: ']<]minimax[>[<invoke name="get_weather">]<]minimax[>[<location>NYC]<]minimax[>[</location>]<]minimax[>[</invoke>'
    - delta_text: ']<]minimax[>[</tool_call>'
    - delta_text: 'Then check LA. '
    - delta_text: ']<]minimax[>[<tool_call>'
    - delta_text: ']<]minimax[>[<invoke name="get_time">]<]minimax[>[<location>LA]<]minimax[>[</location>]<]minimax[>[</invoke>'
    - delta_text: ']<]minimax[>[</tool_call>'
    - delta_text: ''
      finish_reason: tool_calls
