family: minimax_m3
mode: streamv1
cases:
  TOOLCALLING.streamv1.7-6:
    description: 'Nested object unions: select the unique object branch of anyOf and oneOf to type integer and boolean members. Preserve scalar string/object children, nullable object null, and real nested objects. Constructed native MiniMax M3 regression probe for PR #270.'
    ref: https://github.com/ai-dynamo/frontend-crates/pull/270
    tools:
    - name: list_notes
      parameters:
        type: object
        properties:
          pagination_anyof:
            anyOf:
            - type: object
              properties:
                page:
                  type: integer
                per_page:
                  type: integer
                after:
                  type:
                  - string
                  - 'null'
                mode:
                  anyOf:
                  - type: string
                  - type: object
                cursor:
                  type:
                  - object
                  - 'null'
                config:
                  type: object
                  properties:
                    enabled:
                      type: boolean
            - type: 'null'
          options_anyof:
            anyOf:
            - type: string
            - type: array
              items:
                type: string
            - type: object
              properties:
                enabled:
                  type: boolean
                mode:
                  type: string
                  enum:
                  - one
                  - two
          pagination_oneof:
            oneOf:
            - type: object
              properties:
                page:
                  type: integer
                per_page:
                  type: integer
                after:
                  type:
                  - string
                  - 'null'
                mode:
                  anyOf:
                  - type: string
                  - type: object
                cursor:
                  type:
                  - object
                  - 'null'
                config:
                  type: object
                  properties:
                    enabled:
                      type: boolean
            - type: 'null'
          options_oneof:
