family: minimax_m3
mode: streamv1
cases:
  TOOLCALLING.streamv1.7-8:
    description: 'Ambiguous object union branches: multiple object-capable alternatives must retain the string-preserving fallback rather than choose one branch arbitrarily. Constructed native MiniMax M3 regression probe for PR #270.'
    ref: https://github.com/ai-dynamo/frontend-crates/pull/270
    tools:
    - name: list_notes
      parameters:
        type: object
        properties:
          anyof_ambiguous:
            anyOf:
            - type: object
              properties:
                value:
                  type: integer
            - type: object
          oneof_ambiguous:
            oneOf:
            - type: object
              properties:
                value:
                  type: integer
            - type: object
      strict: true
    golden:
      calls:
      - name: list_notes
        arguments:
          anyof_ambiguous:
            value: '2'
          oneof_ambiguous:
            value: '2'
      normal_text: ''
    chunks:
    - delta_text: ']<]minimax[>[<tool_call>]<]minimax[>['
    - delta_text: <invoke name="list_notes">]<]minimax[
    - delta_text: '>[<anyof_ambiguous>]<]minimax[>[<valu'
    - delta_text: e>2]<]minimax[>[</value>]<]minimax[>[
    - delta_text: </anyof_ambiguous>]<]minimax[>[<oneof
    - delta_text: _ambiguous>]<]minimax[>[<value>2]<]mi
    - delta_text: nimax[>[</value>]<]minimax[>[</oneof_
    - delta_text: ambiguous>]<]minimax[>[</invoke>]<]mi
    - delta_text: nimax[>[</tool_call>
    - delta_text: ''
      finish_reason: tool_calls
