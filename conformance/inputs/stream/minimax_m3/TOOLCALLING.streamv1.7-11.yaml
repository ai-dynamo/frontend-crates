family: minimax_m3
mode: streamv1
cases:
  TOOLCALLING.streamv1.7-11:
    description: 'URI-encoded reference: #/$defs/postal%20code resolves the postal code definition, so postal_code becomes an integer. Constructed native MiniMax M3 regression probe for PR #273; not captured model output.'
    ref: https://github.com/ai-dynamo/frontend-crates/pull/273
    tools:
    - name: get_address
      parameters:
        type: object
        $defs:
          postal code:
            type: integer
        properties:
          postal_code:
            $ref: '#/$defs/postal%20code'
      strict: true
    golden:
      normal_text: ''
      calls:
      - name: get_address
        arguments:
          postal_code: 18956
    chunks:
    - delta_text: ']<]minimax[>[<tool_call>]<]minima'
    - delta_text: x[>[<invoke name="get_address">]<
    - delta_text: ']minimax[>[<postal_code>18956]<]m'
    - delta_text: inimax[>[</postal_code>]<]minimax
    - delta_text: '[>[</invoke>]<]minimax[>[</tool_c'
    - delta_text: all>
    - delta_text: ''
      finish_reason: tool_calls
