family: deepseek_v4
model_label: DeepSeek V4
mode: streamv1
cases:
  TOOLCALLING.streamv1.30.a:
    description: Character-level call separator is unavailable in DSML
    explanation: DSML separates invokes with complete tags rather than a comma, semicolon,
      or other separator character.
    unavailable:
      dynamo_v2: DSML has no character-level call separator to place inside an argument
        string.
  TOOLCALLING.streamv1.30.b:
    description: Character-level structural delimiter is unavailable in DSML
    explanation: Braces and brackets are ordinary JSON data in non-string parameters,
      covered by TOOLCALLING.batch.7.d; DSML structure is tag-delimited.
    unavailable:
      dynamo_v2: DSML has no character-level structural delimiter distinct from its
        tag markers.
  TOOLCALLING.streamv1.30.c:
    description: DSML control markers inside a string parameter remain data
    ref: derived from TOOLCALLING.batch.30.c
    tools:
    - name: echo
      parameters:
        type: object
        properties:
          value:
            type: string
    chunks:
    - delta_text: <｜DSML｜tool_calls><｜DSML｜invoke
    - delta_text: ' name="echo">'
    - delta_text: <｜DSML｜parameter name="value" string="true">
    - delta_text: literal </｜DSML｜invoke>
    - delta_text: ' and'
    - delta_text: ' <｜DSML｜tool_calls> stay'
    - delta_text: ' data</｜DSML｜parameter></｜DSML｜invoke></｜DSML｜tool_calls>'
    - delta_text: ''
      finish_reason: stop
