      finish_reason: stop
  TOOLCALLING.streamv1.31.b:
    description: Nested DSML parameter structures before a later invoke
    ref: derived from TOOLCALLING.batch.31.b
    tools:
    - name: process_data
      parameters:
        type: object
        properties:
          payload:
            type: object
    - *id001
    chunks:
    - delta_text: <｜DSML｜tool_calls><｜DSML｜invoke
    - delta_text: ' name="process_data">'
    - delta_text: <｜DSML｜parameter name="payload" string="false">
    - delta_text: '{"items":[{"nested":{"value":1}}]}</｜DSML｜parameter>'
    - delta_text: </｜DSML｜invoke>
    - delta_text: <｜DSML｜invoke name="get_time">
    - delta_text: </｜DSML｜invoke></｜DSML｜tool_calls>
