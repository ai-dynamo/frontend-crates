        </｜DSML｜invoke>'
      finish_reason: stop
  TOOLCALLING.streamv1.8.l:
    description: Whitespace-only content keeps its two LFs; only the separator is framing.
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    golden:
      calls:
      - name: get_weather
        arguments:
          location: NYC
