family: deepseek_v4
mode: streamv1
cases:
  TOOLCALLING.streamv1.50.b:
    description: The separator's LFs and the calls opener arrive in separate chunks.
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    golden:
      calls:
      - name: get_weather
        arguments:
          location: NYC
      normal_text: I will check the weather.
    chunks:
    - delta_text: I will check the weather.
    - delta_text: '

        '
    - delta_text: '

        '
    - delta_text: <｜DSML｜tool_cal
    - delta_text: 'ls>

        <｜DSML｜invoke name="get_weather">

        <｜DSML｜parameter name="location" string="true">NYC</｜DSML｜parameter>

        </｜DSML｜invoke>

        </｜DSML｜tool_calls>'
      finish_reason: stop
  TOOLCALLING.streamv1.50.c:
    description: Punctuation and the separator share one token-shaped chunk before a partial opener.
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    golden:
      calls:
      - name: get_weather
        arguments:
          location: NYC
      normal_text: I will check the weather.
    chunks:
    - delta_text: I will check the weather
    - delta_text: '.


        '
    - delta_text: <｜DSML｜tool_cal
    - delta_text: 'ls>

        <｜DSML｜invoke name="get_weather">

        <｜DSML｜parameter name="location" string="true">NYC</｜DSML｜parameter>

        </｜DSML｜invoke>

        </｜DSML｜tool_calls>'
      finish_reason: stop
