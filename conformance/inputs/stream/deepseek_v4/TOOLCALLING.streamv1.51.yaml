family: deepseek_v4
mode: streamv1
model_label: DeepSeek V4
cases:
  TOOLCALLING.streamv1.51.a:
    description: Tool-only projection preserves caller-usable reasoning information around a tool call
    ref: https://github.com/ai-dynamo/frontend-crates/pull/253
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    chunks:
    - delta_text: before<think>reason</think>
    - delta_text: <｜DSML｜tool_calls><｜DSML｜invoke name="get_weather">
    - delta_text: <｜DSML｜parameter name="location" string="true">Paris</｜DSML｜parameter>
    - delta_text: </｜DSML｜invoke></｜DSML｜tool_calls>after
    - delta_text: ''
      finish_reason: tool_calls
  TOOLCALLING.streamv1.51.b:
    description: DeepSeek tool-only selection accepts both DSML dialects in one stream
    ref: https://github.com/ai-dynamo/frontend-crates/pull/255
    tools:
    - name: inspect
      parameters:
        type: object
        properties:
          value:
            type: string
    chunks:
    - delta_text: <｜DSML｜tool_calls><｜DSML｜invoke name="inspect">
    - delta_text: <｜DSML｜parameter name="value" string="true">compact</｜DSML｜parameter></｜DSML｜invoke></｜DSML｜tool_calls><｜DSML｜ calls><｜DSML｜ invoke name="inspect">
    - delta_text: <｜DSML｜ parameter name="value" string="true">spaced</｜DSML｜ parameter></｜DSML｜ invoke></｜DSML｜ calls>
    - delta_text: ''
      finish_reason: tool_calls
