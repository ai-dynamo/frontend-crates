family: pythonic
mode: streamv1
cases:
  TOOLCALLING.streamv1.7.x.xml_string_type_single_quoted_object:
    description: 'Native XML compatibility: {''a'':1} under type string must produce "{''a'':1}". Custom types use legacy literal evaluation; an explicit string type preserves the original text.'
    tools:
    - name: schema_probe
      parameters:
        type: object
        properties:
          value:
            type: string
        required:
        - value
        additionalProperties: false
      strict: false
    golden:
      calls:
      - name: schema_probe
        arguments:
          value: '{''a'':1}'
      normal_text: ''
    chunks:
    - delta_text: '[sc'
    - delta_text: hem
    - delta_text: a_p
    - delta_text: rob
    - delta_text: e(v
    - delta_text: alu
    - delta_text: e="
    - delta_text: '{''a'
    - delta_text: ''':1'
    - delta_text: '}")'
    - delta_text: ']'
      finish_reason: stop
    unavailable:
      dynamo_v2: No registered Dynamo v2 parser for this family.
  TOOLCALLING.streamv1.7.x.xml_string_type_double_quoted_object:
    description: 'Native XML compatibility: {"a":1} under type string must produce "{\"a\":1}". Custom types use legacy literal evaluation; an explicit string type preserves the original text.'
    tools:
    - name: schema_probe
      parameters:
        type: object
        properties:
          value:
            type: string
        required:
        - value
        additionalProperties: false
      strict: false
    golden:
      calls:
      - name: schema_probe
        arguments:
          value: '{"a":1}'
      normal_text: ''
    chunks:
    - delta_text: '[sc'
    - delta_text: hem
    - delta_text: a_p
    - delta_text: rob
    - delta_text: e(v
    - delta_text: alu
    - delta_text: e='
    - delta_text: '{"a'
    - delta_text: '":1'
    - delta_text: '}'')'
    - delta_text: ']'
      finish_reason: stop
    unavailable:
      dynamo_v2: No registered Dynamo v2 parser for this family.
