family: qwen25
mode: streamv1
model_label: Qwen 2.5
cases:
  TOOLCALLING.streamv1.2.a:
    description: Parallel calls (back-to-back tool_call wrappers)
    ref: derived from TOOLCALLING.batch.2.a
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    - name: get_time
      parameters:
        type: object
        properties:
          timezone:
            type: string
    chunks:
    - delta_text: "<tool_call>\n{\"name\":"
    - delta_text: ' "get_weather",'
    - delta_text: ' "arguments": {"location": "NYC"}}'
    - delta_text: "\n</tool_call><tool_call>"
    - delta_text: "\n{\"name\":"
    - delta_text: ' "get_time", "arguments":'
    - delta_text: " {\"timezone\": \"EST\"}}\n</tool_call>"
    - delta_text: ''
      finish_reason: tool_calls
  TOOLCALLING.streamv1.2.c:
    description: With surrounding narration
    ref: derived from TOOLCALLING.batch.2.c
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    - name: get_time
      parameters:
        type: object
        properties:
          timezone:
            type: string
    chunks:
    - delta_text: 'Both: <tool_call>'
    - delta_text: "\n{\"name\":"
    - delta_text: ' "get_weather", "arguments": {"location":'
    - delta_text: " \"NYC\"}}\n</tool_call>"
    - delta_text: <tool_call>
    - delta_text: "\n{\"name\": \"get_time\","
    - delta_text: ' "arguments": {"timezone": "EST"}}'
    - delta_text: "\n</tool_call>"
    - delta_text: ' Done.'
    - delta_text: ''
      finish_reason: tool_calls
  TOOLCALLING.streamv1.2.d:
    description: Same-name twice
    ref: derived from TOOLCALLING.batch.2.d
    tools:
    - &id001
      name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    - *id001
    chunks:
    - delta_text: "<tool_call>\n{\"name\":"
    - delta_text: ' "get_weather",'
    - delta_text: ' "arguments": {"location": "NYC"}}'
    - delta_text: "\n</tool_call><tool_call>"
    - delta_text: "\n{\"name\":"
    - delta_text: ' "get_weather", "arguments":'
    - delta_text: " {\"location\": \"LA\"}}\n</tool_call>"
    - delta_text: ''
      finish_reason: tool_calls
