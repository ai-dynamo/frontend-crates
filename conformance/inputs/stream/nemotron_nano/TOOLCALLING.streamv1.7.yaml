    - delta_text: "\n<parameter=destination>"
    - delta_text: "\nParis\n</parameter>\n<parameter=passengers>"
    - delta_text: "\n2\n</parameter>"
    - delta_text: "\n<parameter=first_class>"
    - delta_text: "\ntrue\n</parameter>"
    - delta_text: "\n</function>\n</tool_call>"
