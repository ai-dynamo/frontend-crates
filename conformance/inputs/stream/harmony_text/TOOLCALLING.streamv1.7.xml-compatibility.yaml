family: harmony_text
mode: streamv1
cases:
  TOOLCALLING.streamv1.7.x.xml_string_type_single_quoted_object:
    description: 'Native XML compatibility: {''a'':1} under type string must produce "{''a'':1}". Custom types use legacy literal evaluation; an explicit string type preserves the original text.'
    tools:
    - name: schema_probe
      parameters:
        type: object
        properties:
          value:
            type: string
        required:
        - value
        additionalProperties: false
      strict: false
    golden:
      calls:
      - name: schema_probe
        arguments:
          value: '{''a'':1}'
      normal_text: ''
    chunks:
    - delta_text: <|c
    - delta_text: han
