family: minimax_m3
mode: batch
cases:
  TOOLCALLING.batch.7-4.mixed_grep:
    description: 'MiniMax M3 v1 regression for PR #269: with strict: true, the request schema requires string pattern and nullable path through anyOf. Both parameters contain bare null text; expect {"pattern": "null", "path": null}. This constructed native input is a regression probe, not a captured model output.'
    ref: https://github.com/ai-dynamo/frontend-crates/pull/269
    model_text: ']<]minimax[>[<tool_call>]<]minimax[>[<invoke name="grep">]<]minimax[>[<pattern>null]<]minimax[>[</pattern>]<]minimax[>[<path>null]<]minimax[>[</path>]<]minimax[>[</invoke>]<]minimax[>[</tool_call>'
    tools:
    - name: grep
      parameters:
        properties:
          pattern:
            type: string
          path:
            anyOf:
            - type: string
            - type: 'null'
      strict: true
    golden:
      calls:
      - name: grep
        arguments:
          pattern: 'null'
          path: null
      normal_text: ''
