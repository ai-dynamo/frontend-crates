family: minimax_m3
mode: batch
cases:
  TOOLCALLING.batch.7-8:
    description: 'Ambiguous object union branches: multiple object-capable alternatives must retain the string-preserving fallback rather than choose one branch arbitrarily. Constructed native MiniMax M3 regression probe for PR #270.'
    ref: https://github.com/ai-dynamo/frontend-crates/pull/270
    tools:
    - name: list_notes
      parameters:
        type: object
        properties:
          anyof_ambiguous:
            anyOf:
            - type: object
              properties:
                value:
                  type: integer
            - type: object
          oneof_ambiguous:
            oneOf:
            - type: object
              properties:
                value:
                  type: integer
            - type: object
      strict: true
    golden:
      calls:
      - name: list_notes
        arguments:
          anyof_ambiguous:
            value: '2'
          oneof_ambiguous:
            value: '2'
      normal_text: ''
    model_text: ']<]minimax[>[<tool_call>]<]minimax[>[<invoke name="list_notes">]<]minimax[>[<anyof_ambiguous>]<]minimax[>[<value>2]<]minimax[>[</value>]<]minimax[>[</anyof_ambiguous>]<]minimax[>[<oneof_ambiguous>]<]minimax[>[<value>2]<]minimax[>[</value>]<]minimax[>[</oneof_ambiguous>]<]minimax[>[</invoke>]<]minimax[>[</tool_call>'
