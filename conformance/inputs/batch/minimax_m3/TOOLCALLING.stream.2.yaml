# Shared inputs (version-independent): no expected blocks.
family: minimax_m3
model_label: MiniMax M3
mode: stream
cases:
  TOOLCALLING.stream.2:
    description: Multiple tool calls split across multiple content chunks
    ref: derived from TOOLCALLING.batch.2.a
    chunks:
    - delta_text: ']<]minimax[>[<tool_call>

        '
    - delta_text: ']<]minimax[>[<invoke name="get_weather">

        '
    - delta_text: ']<]minimax[>[<location>'
    - delta_text: NYC
    - delta_text: ']<]minimax[>[</location>

        ]<]minimax[>[</invoke>

        '
    - delta_text: ']<]minimax[>[<invoke name="get_time">

        '
    - delta_text: ']<]minimax[>[<timezone>'
    - delta_text: EST
    - delta_text: ']<]minimax[>[</timezone>

        ]<]minimax[>[</invoke>

        '
    - delta_text: ']<]minimax[>[</tool_call>'
    - delta_text: ''
      finish_reason: tool_calls
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    - name: get_time
      parameters:
        type: object
        properties:
          timezone:
            type: string
