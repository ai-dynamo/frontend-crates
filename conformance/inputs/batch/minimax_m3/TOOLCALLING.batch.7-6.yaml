family: minimax_m3
mode: batch
cases:
  TOOLCALLING.batch.7-6:
    description: 'Nested object unions: select the unique object branch of anyOf and oneOf to type integer and boolean members. Preserve scalar string/object children, nullable object null, and real nested objects. Constructed native MiniMax M3 regression probe for PR #270.'
    ref: https://github.com/ai-dynamo/frontend-crates/pull/270
    tools:
    - name: list_notes
      parameters:
        type: object
        properties:
          pagination_anyof:
            anyOf:
            - type: object
              properties:
                page:
                  type: integer
                per_page:
                  type: integer
                after:
                  type:
                  - string
                  - 'null'
                mode:
                  anyOf:
                  - type: string
                  - type: object
                cursor:
                  type:
                  - object
                  - 'null'
                config:
                  type: object
                  properties:
                    enabled:
                      type: boolean
            - type: 'null'
          options_anyof:
            anyOf:
            - type: string
            - type: array
              items:
                type: string
            - type: object
              properties:
                enabled:
                  type: boolean
                mode:
                  type: string
                  enum:
                  - one
                  - two
          pagination_oneof:
            oneOf:
            - type: object
              properties:
                page:
                  type: integer
                per_page:
                  type: integer
                after:
                  type:
                  - string
                  - 'null'
                mode:
                  anyOf:
                  - type: string
                  - type: object
                cursor:
                  type:
                  - object
                  - 'null'
                config:
                  type: object
                  properties:
                    enabled:
                      type: boolean
            - type: 'null'
          options_oneof:
            oneOf:
            - type: string
            - type: array
              items:
                type: string
            - type: object
              properties:
                enabled:
                  type: boolean
                mode:
                  type: string
                  enum:
                  - one
                  - two
      strict: true
    golden:
      calls:
      - name: list_notes
        arguments:
          pagination_anyof:
            page: 2
            per_page: 25
            after: null
            mode: one
            cursor: null
            config:
              enabled: true
          options_anyof:
            enabled: true
            mode: one
          pagination_oneof:
            page: 2
            per_page: 25
            after: null
            mode: one
            cursor: null
            config:
              enabled: true
          options_oneof:
            enabled: true
            mode: one
      normal_text: ''
    model_text: ']<]minimax[>[<tool_call>]<]minimax[>[<invoke name="list_notes">]<]minimax[>[<pagination_anyof>]<]minimax[>[<page>2]<]minimax[>[</page>]<]minimax[>[<per_page>25]<]minimax[>[</per_page>]<]minimax[>[<after>null]<]minimax[>[</after>]<]minimax[>[<mode>one]<]minimax[>[</mode>]<]minimax[>[<cursor>null]<]minimax[>[</cursor>]<]minimax[>[<config>]<]minimax[>[<enabled>true]<]minimax[>[</enabled>]<]minimax[>[</config>]<]minimax[>[</pagination_anyof>]<]minimax[>[<options_anyof>]<]minimax[>[<enabled>true]<]minimax[>[</enabled>]<]minimax[>[<mode>one]<]minimax[>[</mode>]<]minimax[>[</options_anyof>]<]minimax[>[<pagination_oneof>]<]minimax[>[<page>2]<]minimax[>[</page>]<]minimax[>[<per_page>25]<]minimax[>[</per_page>]<]minimax[>[<after>null]<]minimax[>[</after>]<]minimax[>[<mode>one]<]minimax[>[</mode>]<]minimax[>[<cursor>null]<]minimax[>[</cursor>]<]minimax[>[<config>]<]minimax[>[<enabled>true]<]minimax[>[</enabled>]<]minimax[>[</config>]<]minimax[>[</pagination_oneof>]<]minimax[>[<options_oneof>]<]minimax[>[<enabled>true]<]minimax[>[</enabled>]<]minimax[>[<mode>one]<]minimax[>[</mode>]<]minimax[>[</options_oneof>]<]minimax[>[</invoke>]<]minimax[>[</tool_call>'
