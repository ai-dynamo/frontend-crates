family: minimax_m3
mode: batch
cases:
  TOOLCALLING.batch.7-9:
    description: 'Local parameter reference: data references an object schema, so JSON text becomes an object rather than a string. Constructed native MiniMax M3 regression probe for PR #273; not captured model output.'
    ref: https://github.com/ai-dynamo/frontend-crates/pull/273
    tools:
    - name: capture
      parameters:
        type: object
        $defs:
          Payload:
            type: object
        properties:
          data:
            $ref: '#/$defs/Payload'
      strict: true
    golden:
      normal_text: ''
      calls:
      - name: capture
        arguments:
          data:
            input: Alex
    model_text: ']<]minimax[>[<tool_call>]<]minimax[>[<invoke name="capture">]<]minimax[>[<data>{"input":"Alex"}]<]minimax[>[</data>]<]minimax[>[</invoke>]<]minimax[>[</tool_call>'
