# Shared inputs (version-independent): no expected blocks.
family: minimax_m2
mode: batch
cases:
  TOOLCALLING.batch.5.a:
    description: Missing </minimax:tool_call> end marker
    ref: dynamo
    model_text: '<minimax:tool_call>

      <invoke name="get_weather">

      <parameter name="location">NYC</parameter>

      </invoke>'
    tools:
    - &id001
      name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
  TOOLCALLING.batch.5.b:
    description: Closing </minimax:tool_call> without matching open
    ref: dynamo
    model_text: '<invoke name="get_weather">

      <parameter name="location">NYC</parameter>

      </invoke>

      </minimax:tool_call>'
    tools:
    - *id001
  TOOLCALLING.batch.5.c:
    description: Truncation mid-parameter value
    ref: dynamo
    model_text: '<minimax:tool_call>

      <invoke name="get_weather">

      <parameter name="location">NY'
    tools:
    - *id001
  TOOLCALLING.batch.5.d:
    description: Multi-call, last call missing only end marker (body complete)
    ref: dynamo
    model_text: 'I''ll start by fetching the weather for both Boston and New York at the same time!

      <minimax:tool_call>

      <invoke name="get_weather">

      <parameter name="location">Boston</parameter>

      </invoke>

      <invoke name="get_weather">

      <parameter name="location">New York</parameter>

      </invoke>'
    tools:
    - *id001
  TOOLCALLING.batch.5.e:
    description: Multi-call, last call truncated mid-arg-value
    ref: dynamo
    model_text: 'I''ll start by fetching the weather for both Boston and New York at the same time!

      <minimax:tool_call>

      <invoke name="get_weather">

      <parameter name="location">Boston</parameter>

      </invoke>

      <invoke name="get_weather">

      <parameter name="location">New York'
    tools:
    - *id001
  TOOLCALLING.batch.5.f:
    description: Bare valid invoke before a complete wrapped call
    ref: dynamo
    model_text: '<invoke name="get_weather">

      <parameter name="location">NYC</parameter>

      </invoke>

      </minimax:tool_call>

      <minimax:tool_call>

      <invoke name="get_weather">

      <parameter name="location">Boston</parameter>

      </invoke>

      </minimax:tool_call>'
    tools:
    - *id001
  TOOLCALLING.batch.5.g:
    description: Closing </minimax:tool_call> without matching open after prefix prose
    ref: dynamo
    model_text: 'I will check that. <invoke name="get_weather">

      <parameter name="location">NYC</parameter>

      </invoke>

      </minimax:tool_call>'
    tools:
    - *id001
