family: deepseek_v3_2
mode: batch
cases:
  TOOLCALLING.batch.8.f:
    description: The encoder's two-LF separator before a calls block is framing, not content.
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    golden:
      calls:
      - name: get_weather
        arguments:
          location: NYC
      normal_text: I will check the weather.
    model_text: 'I will check the weather.


      <｜DSML｜function_calls>

      <｜DSML｜invoke name="get_weather">

      <｜DSML｜parameter name="location" string="true">NYC</｜DSML｜parameter>

      </｜DSML｜invoke>

      </｜DSML｜function_calls>'
  TOOLCALLING.batch.8.g:
    description: Four LFs before a calls block keep the two that belong to the content.
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    golden:
      calls:
      - name: get_weather
        arguments:
          location: NYC
      normal_text: 'I will check the weather.


        '
    model_text: 'I will check the weather.




