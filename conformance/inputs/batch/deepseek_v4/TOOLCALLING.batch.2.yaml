# Shared inputs (version-independent): no expected blocks.
family: deepseek_v4
mode: batch
cases:
  TOOLCALLING.batch.2.a:
    description: Two invokes inside one tool_calls wrapper
    ref: dynamo
    model_text: '<｜DSML｜tool_calls>

      <｜DSML｜invoke name="get_weather">

      <｜DSML｜parameter name="location" string="true">NYC</｜DSML｜parameter>

      </｜DSML｜invoke>

      <｜DSML｜invoke name="get_time">

      <｜DSML｜parameter name="timezone" string="true">EST</｜DSML｜parameter>

      </｜DSML｜invoke>

      </｜DSML｜tool_calls>'
    tools:
    - &id001
      name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    - &id002
      name: get_time
      parameters:
        type: object
        properties:
          timezone:
            type: string
  TOOLCALLING.batch.2.b:
    description: Two back-to-back tool_calls wrappers
    ref: dynamo
    model_text: '<｜DSML｜tool_calls>

      <｜DSML｜invoke name="get_weather">

      <｜DSML｜parameter name="location" string="true">NYC</｜DSML｜parameter>

      </｜DSML｜invoke>

      </｜DSML｜tool_calls>

      <｜DSML｜tool_calls>

      <｜DSML｜invoke name="get_time">

      <｜DSML｜parameter name="timezone" string="true">EST</｜DSML｜parameter>

      </｜DSML｜invoke>

      </｜DSML｜tool_calls>'
    tools:
    - *id001
    - *id002
  TOOLCALLING.batch.2.c:
    description: Parallel with surrounding narration
    ref: dynamo
    model_text: 'Both: <｜DSML｜tool_calls>

      <｜DSML｜invoke name="get_weather">

      <｜DSML｜parameter name="location" string="true">NYC</｜DSML｜parameter>

      </｜DSML｜invoke>

      <｜DSML｜invoke name="get_time">

      <｜DSML｜parameter name="timezone" string="true">EST</｜DSML｜parameter>

      </｜DSML｜invoke>

      </｜DSML｜tool_calls> Done.'
    tools:
    - *id001
    - *id002
  TOOLCALLING.batch.2.d:
    description: Same-name twice
    ref: dynamo
    model_text: '<｜DSML｜tool_calls>

      <｜DSML｜invoke name="get_weather">

      <｜DSML｜parameter name="location" string="true">NYC</｜DSML｜parameter>

      </｜DSML｜invoke>

      <｜DSML｜invoke name="get_weather">

      <｜DSML｜parameter name="location" string="true">LA</｜DSML｜parameter>

      </｜DSML｜invoke>

      </｜DSML｜tool_calls>'
    tools:
    - *id001
    - *id001
