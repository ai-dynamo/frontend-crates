# Shared inputs (version-independent): no expected blocks.
family: deepseek_v4
mode: batch
cases:
  TOOLCALLING.batch.30.a:
    description: Character-level call separator is unavailable in DSML
    explanation: DSML separates invokes with complete tags rather than a comma, semicolon, or other separator character.
    unavailable:
      dynamo_v2: DSML has no character-level call separator to place inside an argument string.
  TOOLCALLING.batch.30.b:
    description: Character-level structural delimiter is unavailable in DSML
    explanation: Braces and brackets are ordinary JSON data in non-string parameters, covered by TOOLCALLING.batch.7.d; DSML structure is tag-delimited.
    unavailable:
      dynamo_v2: DSML has no character-level structural delimiter distinct from its tag markers.
  TOOLCALLING.batch.30.c:
    description: DSML control markers inside a string parameter remain data
    ref: DeepSeek DSML parameter grammar
    model_text: '<｜DSML｜tool_calls><｜DSML｜invoke name="echo"><｜DSML｜parameter name="value" string="true">literal </｜DSML｜invoke> and <｜DSML｜tool_calls> stay data</｜DSML｜parameter></｜DSML｜invoke></｜DSML｜tool_calls>'
    tools:
    - name: echo
      parameters:
        type: object
        properties:
          value:
            type: string
