        explanation: Kimi K3 has one tool name owner in the XTML call tag and no inner envelope name to disagree with it.
      TOOLCALLING.streamv1.11.b:
        description: Empty XTML tool name is not a required general fixture
        explanation: The required malformed-name contract is covered by TOOLCALLING.streamv1.4.c; an empty tool attribute is an optional grammar edge.
      TOOLCALLING.streamv1.11.c:
        description: Generation-primer header omission is unavailable
        explanation: Kimi K3 tool calls do not use a separate generation-primer message header in this corpus.
      TOOLCALLING.streamv1.30.a:
        description: Delimiter-character case is covered by the raw JSON marker case
        explanation: Kimi K3 raw JSON uses JSON's own string parser rather than a grammar-level call separator; the stronger marker-in-string case is TOOLCALLING.streamv1.30.c.
      TOOLCALLING.streamv1.30.b:
        description: Structural delimiter case is covered by raw JSON typed arguments
        explanation: Nested braces and brackets are ordinary JSON syntax in TOOLCALLING.streamv1.7.d and 7.e; they are not Kimi K3 call delimiters.
