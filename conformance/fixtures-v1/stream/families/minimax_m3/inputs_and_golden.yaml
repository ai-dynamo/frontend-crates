documents:
  TOOLCALLING.streamv1.1.yaml:
    family: minimax_m3
    mode: streamv1
    model_label: MiniMax M3
    cases:
      TOOLCALLING.streamv1.1:
        description: Single tool call (happy path)
        ref: derived from TOOLCALLING.batch.1
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        chunks:
        - delta_text: ']<]minimax[>[<tool_call>

            ]<]minimax[>[<invoke name="get_weather">

            ]<]minimax[>[<location>NYC]<]minimax[>[</location>

            ]<]minimax[>[</invoke>

            ]<]minimax[>[</tool_call>'
        - delta_text: ''
          finish_reason: tool_calls
