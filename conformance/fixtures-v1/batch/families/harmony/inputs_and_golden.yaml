    family: harmony
    model_label: gpt-oss
    mode: stream
    cases:
      TOOLCALLING.stream.2:
        description: Multiple tool calls split across multiple content chunks
        ref: derived from TOOLCALLING.batch.2.a
        chunks:
        - delta_text: <|start|>
        - delta_text: assista
        - delta_text: nt<|channel|>
        - delta_text: comme
        - delta_text: ntary to=function
        - delta_text: s.g
        - delta_text: et_weathe
        - delta_text: r <|con
        - delta_text: strain|>json<
        - delta_text: '|mess'
        - delta_text: 'age|>{"location":'
        - delta_text: '"NY'
        - delta_text: C"}<|call
        - delta_text: '|><|sta'
        - delta_text: rt|>assistant
        - delta_text: <|cha
        - delta_text: 'nnel|>commentary '
        - delta_text: to=
        - delta_text: functions
        - delta_text: .get_ti
        - delta_text: me <|constrai
        - delta_text: n|>js
        - delta_text: on<|message|>{"ti
        - delta_text: mez
        - delta_text: one":"EST
        - delta_text: '"}<|cal'
        - delta_text: l|>
        - delta_text: ''
          finish_reason: tool_calls
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        - name: get_time
          parameters:
            type: object
            properties:
              timezone:
                type: string
  TOOLCALLING.stream.3.yaml:
    family: harmony
    model_label: gpt-oss
    mode: stream
    cases:
      TOOLCALLING.stream.3:
        description: Complete single tool call with a grammar token split across chunk boundaries
        ref: derived from TOOLCALLING.batch.1
        chunks:
        - delta_text: <|
        - delta_text: cha
        - delta_text: nnel|
        - delta_text: '>commentary'
        - delta_text: ' to=functions.get_w'
        - delta_text: ea
        - delta_text: the
        - delta_text: r <|c
        - delta_text: onstrain|>j
        - delta_text: son<|message|>{"loc
        - delta_text: at
        - delta_text: ion
        - delta_text: '":"NY'
        - delta_text: C"}<|call|>
        - delta_text: ''
          finish_reason: tool_calls
        tools:
        - name: get_weather
          parameters:
            type: object
