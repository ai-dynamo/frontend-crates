corpus: batch
family: harmony
capture: sglang_python-0.5.12.post1
documents:
  TOOLCALLING.batch.2.yaml:
    family: harmony
    mode: batch
    cases:
      TOOLCALLING.batch.2.a:
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_time
              arguments:
                timezone: EST
            normal_text: ''
      TOOLCALLING.batch.2.c:
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_time
              arguments:
                timezone: EST
            normal_text: 'Both:   Done.'
            explanation: 'No spec-correct winner on whitespace: surrounding prose is outside Harmony messages, so this is recovery-only; SGLang extracts the same calls but preserves one extra separator space'
      TOOLCALLING.batch.2.d:
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_weather
              arguments:
                location: LA
            normal_text: ''
  TOOLCALLING.batch.4.yaml:
    family: harmony
    mode: batch
    cases:
      TOOLCALLING.batch.4.a:
        expected:
          sglang_python:
            calls: []
            normal_text: ''
            explanation: 'Less parser-complete behavior: the Harmony envelope is a valid ''<|call|>''-terminated function call, so the parser should preserve the malformed raw payload for downstream validation rather than dropping the call.'
      TOOLCALLING.batch.4.b:
        expected:
          sglang_python:
            calls: []
            normal_text: ''
            explanation: 'Less parser-complete behavior: the Harmony envelope is a valid ''<|call|>''-terminated function call, so the parser should preserve the malformed raw payload for downstream validation rather than dropping the call.'
      TOOLCALLING.batch.4.c:
        expected:
          sglang_python:
            calls: []
            normal_text: ''
  TOOLCALLING.batch.5.yaml:
    family: harmony
    mode: batch
    cases:
      TOOLCALLING.batch.5.a:
        expected:
          sglang_python:
            calls: []
            normal_text: ''
            explanation: impl-defined recovery contract (see TOOLCALLING_CASES.md)
      TOOLCALLING.batch.5.b:
        expected:
          sglang_python:
            calls: []
            normal_text: <|channel|>commentary to=functions.get_weather <|constrain|>json<|message|>{"location":"NYC"}<|call|>
            explanation: SGLang requires the full Harmony <|start|>assistant prefix before it classifies a commentary function call; Dynamo recovers the complete call without that prefix.
      TOOLCALLING.batch.5.c:
        expected:
          sglang_python:
            calls: []
            normal_text: ''
            explanation: impl-defined recovery contract (see TOOLCALLING_CASES.md)
      TOOLCALLING.batch.5.d:
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: Boston
            normal_text: I'll start by fetching the weather for both Boston and New York at the same time!
      TOOLCALLING.batch.5.e:
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: Boston
            normal_text: I'll start by fetching the weather for both Boston and New York at the same time!
  TOOLCALLING.batch.6.yaml:
    family: harmony
    mode: batch
    cases:
      TOOLCALLING.batch.6.a:
        expected:
          sglang_python:
            calls: []
            normal_text: <|channel|>commentary to=functions.get_time <|constrain|>json<|message|>{}<|call|>
            explanation: 'Less spec-correct parsing: SGLang leaks raw Harmony markup instead of extracting a valid ''<|call|>''-terminated commentary tool call.'
      TOOLCALLING.batch.6.b:
        expected:
          sglang_python:
            calls: []
            normal_text: <|channel|>commentary to=functions.get_time <|constrain|>json<|message|>{ }<|call|>
            explanation: 'Less spec-correct parsing: SGLang leaks raw Harmony markup instead of extracting a valid ''<|call|>''-terminated commentary tool call.'
      TOOLCALLING.batch.6.c:
        expected:
          sglang_python:
            calls: []
            normal_text: <|channel|>commentary to=functions.get_time <|constrain|>json
            explanation: 'Dynamo/vLLM are more spec-correct: a commentary header without ''<|message|>'' is malformed protocol, not user-visible text; SGLang preserves raw markup'
  TOOLCALLING.batch.7.yaml:
    family: harmony
    mode: batch
    cases:
      TOOLCALLING.batch.7.a:
        expected:
          sglang_python:
            calls: []
            normal_text: <|channel|>commentary to=functions.book_flight <|constrain|>json<|message|>{"destination":"Paris","passengers":2,"first_class":true}<|call|>
            explanation: 'Dynamo/vLLM are more spec-correct for completion-body parsing: the first assistant message may start at ''<|channel|>''; SGLang requires a redundant ''<|start|>assistant'' prefix and leaks raw markup'
      TOOLCALLING.batch.7.b:
        expected:
          sglang_python:
            calls: []
            normal_text: <|channel|>commentary to=functions.get_weather <|constrain|>json<|message|>{"location":"Tōkyō \"central\""}<|call|>
            explanation: 'Dynamo/vLLM are more spec-correct for completion-body parsing: the first assistant message may start at ''<|channel|>''; SGLang requires a redundant ''<|start|>assistant'' prefix and leaks raw markup'
      TOOLCALLING.batch.7.c:
        expected:
          sglang_python:
            calls: []
            normal_text: <|channel|>commentary to=functions.set_temperature <|constrain|>json<|message|>{"celsius":"20"}<|call|>
            explanation: 'Dynamo/vLLM are more spec-correct for completion-body parsing: the first assistant message may start at ''<|channel|>''; SGLang requires a redundant ''<|start|>assistant'' prefix and leaks raw markup'
      TOOLCALLING.batch.7.d:
        expected:
          sglang_python:
            calls: []
            normal_text: <|channel|>commentary to=functions.process_data <|constrain|>json<|message|>{"items":[1,2,3],"config":{"nested":true}}<|call|>
            explanation: 'Dynamo/vLLM are more spec-correct for completion-body parsing: the first assistant message may start at ''<|channel|>''; SGLang requires a redundant ''<|start|>assistant'' prefix and leaks raw markup'
      TOOLCALLING.batch.7.e:
        expected:
          sglang_python:
            calls: []
            normal_text: <|channel|>commentary to=functions.process_data <|constrain|>json<|message|>{"payload":{"regions":[{"name":"west","scores":[1,2,3]},{"name":"east","scores":[4,5,6]}],"flags":{"enabled":true,"retry":null},"empty":{}}}<|call|>
            explanation: 'Dynamo/vLLM are more spec-correct for completion-body parsing: the first assistant message may start at ''<|channel|>''; SGLang requires a redundant ''<|start|>assistant'' prefix and leaks raw markup'
      TOOLCALLING.batch.7.f:
        expected:
          sglang_python:
            calls: []
            normal_text: <|channel|>commentary to=functions.set_limit <|constrain|>json<|message|>{"count":9007199254740993}<|call|>
            explanation: 'Dynamo/vLLM are more spec-correct for completion-body parsing: the first assistant message may start at ''<|channel|>''; SGLang requires a redundant ''<|start|>assistant'' prefix and leaks raw markup'
  TOOLCALLING.batch.8.yaml:
    family: harmony
    mode: batch
    cases:
      TOOLCALLING.batch.8.a:
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: I will check the weather.
      TOOLCALLING.batch.8.b:
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: Let me know if you need more.
      TOOLCALLING.batch.8.c:
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: I will check the weather.   Let me know if you need more.
            explanation: 'No spec-correct winner on whitespace: analysis is correctly hidden and the same call is extracted; surrounding prose is outside Harmony messages, so whitespace is recovery-only'
      TOOLCALLING.batch.8.d:
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_weather
              arguments:
                location: LA
            normal_text: I will check the weather.   Then check LA weather.
            explanation: 'No spec-correct winner on whitespace: analysis is correctly hidden and the same calls are extracted; surrounding prose is outside Harmony messages, so whitespace is recovery-only'
  TOOLCALLING.batch.yaml:
    family: harmony
    mode: batch
    cases:
      TOOLCALLING.batch.1:
        expected:
          sglang_python:
            calls: []
            normal_text: <|channel|>commentary to=functions.get_weather <|constrain|>json<|message|>{"location":"NYC"}<|call|>
            explanation: 'Less spec-correct parsing: SGLang leaks raw Harmony markup instead of extracting a valid ''<|call|>''-terminated commentary tool call.'
      TOOLCALLING.batch.3:
        expected:
          sglang_python:
            calls: []
            normal_text: Hello, how can I help you today?
            explanation: 'Less spec-correct fallback: bare text is not a valid Harmony assistant response because no final message was emitted. A valid response would be ''<|channel|>final<|message|>Hello, how can I help you today?<|return|>''.'
      TOOLCALLING.batch.9.a:
        expected:
          sglang_python:
            calls: []
            normal_text: ''
      TOOLCALLING.batch.9.b:
        expected:
          sglang_python:
            calls: []
            normal_text: '   '
            explanation: 'Less spec-correct fallback: blank text is not a valid Harmony assistant response because no final message was emitted.'
      TOOLCALLING.batch.10:
        expected:
          sglang_python:
            calls:
            - arguments:
                location: NYC
              name: get_weather
            - arguments:
                location: LA
              name: get_weather
            normal_text: ''
      TOOLCALLING.batch.13:
        expected:
          sglang_python:
            calls: []
            normal_text: <|channel|>commentary to=functions.unknown_tool <|constrain|>json<|message|>{"location":"NYC"}<|call|>
            explanation: SGLang treats an unknown harmony recipient as ordinary content rather than forwarding a tool call by default.
  TOOLCALLING.stream.1.yaml:
    family: harmony
    mode: stream
    cases:
      TOOLCALLING.stream.1.a:
        expected:
          sglang_python:
            calls: []
            normal_text: ''
      TOOLCALLING.stream.1.b:
        expected:
          sglang_python:
            calls: []
            normal_text: ''
  TOOLCALLING.stream.2.yaml:
    family: harmony
    mode: stream
    cases:
      TOOLCALLING.stream.2:
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: rt|>assistant<|channel|>commentary to=functions.get_time <|constrain|>js
            explanation: SGLang emits only the first split Harmony call and leaks the second call envelope into normal_text; Dynamo parses both complete `<|call|>`-terminated calls.
  TOOLCALLING.stream.3.yaml:
    family: harmony
    mode: stream
    cases:
      TOOLCALLING.stream.3:
        expected:
          sglang_python:
            calls: []
            normal_text: <|channel|>commentary to=functions.get_weather <|constrain|>j
            explanation: SGLang leaks a split Harmony commentary block into normal_text; Dynamo buffers the split marker and parses the complete `<|call|>`-terminated call.
  TOOLCALLING.stream.4.yaml:
    family: harmony
    mode: stream
    cases:
      TOOLCALLING.stream.4.a:
        expected:
          sglang_python:
            calls: []
            normal_text: ''
      TOOLCALLING.stream.4.b:
        expected:
          sglang_python:
            calls: []
            normal_text: ''
      TOOLCALLING.stream.4.c:
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: ''
