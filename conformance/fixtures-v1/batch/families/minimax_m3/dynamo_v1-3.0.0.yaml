corpus: batch
family: minimax_m3
capture: dynamo_v1-3.0.0
documents:
  TOOLCALLING.batch.2.yaml:
    family: minimax_m3
    mode: batch
    cases:
      TOOLCALLING.batch.2.a:
        expected:
          dynamo_v1: &id001
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_time
              arguments:
                timezone: EST
            normal_text: ''
      TOOLCALLING.batch.2.b:
        expected:
          dynamo_v1: *id001
      TOOLCALLING.batch.2.c:
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_time
              arguments:
                timezone: EST
            normal_text: 'Both: '
      TOOLCALLING.batch.2.d:
        expected:
          dynamo_v1:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_weather
              arguments:
                location: LA
            normal_text: ''
