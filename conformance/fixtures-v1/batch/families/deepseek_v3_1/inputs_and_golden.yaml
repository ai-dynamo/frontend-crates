        - delta_text: ool▁c
        - delta_text: all▁end｜><｜tool▁c
        - delta_text: all
        - delta_text: ▁begin｜>g
        - delta_text: et_time
        - delta_text: <｜tool▁sep｜>{
        - delta_text: '"time'
        - delta_text: zone":"EST"}<｜too
