                location: NYC
            - name: get_time
              arguments:
                timezone: EST
            normal_text: ''
      TOOLCALLING.batch.2.c:
        expected:
          sglang_python:
            explanation: SGLang trims trailing whitespace from normal_text that precedes DeepSeek V3.1 tool-call blocks.
            calls:
