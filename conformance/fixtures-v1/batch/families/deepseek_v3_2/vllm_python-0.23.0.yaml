documents:
  TOOLCALLING.batch.2.yaml:
    family: deepseek_v3_2
    mode: batch
    cases:
      TOOLCALLING.batch.2.a:
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_time
              arguments:
                timezone: EST
            normal_text: ''
      TOOLCALLING.batch.2.b:
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_time
              arguments:
                timezone: EST
            normal_text: '

              '
            explanation: preserves inter-fence newline between back-to-back function_calls wrappers
      TOOLCALLING.batch.2.c:
        expected:
          vllm_python:
            calls:
            - arguments:
                location: NYC
              name: get_weather
            - arguments:
                timezone: EST
              name: get_time
            normal_text: 'Both: '
            explanation: drops trailing normal_text after tool-call wrapper end
      TOOLCALLING.batch.2.d:
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_weather
              arguments:
                location: LA
            normal_text: ''
