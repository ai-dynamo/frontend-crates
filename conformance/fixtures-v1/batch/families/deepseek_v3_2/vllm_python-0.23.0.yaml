  TOOLCALLING.batch.5.yaml:
    family: deepseek_v3_2
    mode: batch
    cases:
      TOOLCALLING.batch.5.a:
        expected:
          vllm_python:
            calls: []
            normal_text: '<｜DSML｜function_calls>

              <｜DSML｜invoke name="get_weather">

              <｜DSML｜parameter name="location" string="true">NYC</｜DSML｜parameter>

              </｜DSML｜invoke>'
            explanation: vLLM leaks the DSML envelope into normal_text on missing end-marker recovery; Dynamo recovers the complete <｜DSML｜invoke> call and strips the unterminated outer tag.
      TOOLCALLING.batch.5.b:
        expected:
          vllm_python:
            explanation: vLLM and SGLang preserve orphan DSML markers as content when the opening <｜DSML｜function_calls> wrapper is missing; Dynamo recovers the complete bare <｜DSML｜invoke> call and strips the orphan marker tail.
            calls: []
            normal_text: '<｜DSML｜invoke name="get_weather">

              <｜DSML｜parameter name="location" string="true">NYC</｜DSML｜parameter>

              </｜DSML｜invoke>

              </｜DSML｜function_calls>'
      TOOLCALLING.batch.5.c:
        expected:
          vllm_python:
            calls: []
            normal_text: '<｜DSML｜function_calls>

              <｜DSML｜invoke name="get_weather">

              <｜DSML｜parameter name="location" string="true">NY'
            explanation: vLLM leaks the tool call tag into normal_text on the recovery path
      TOOLCALLING.batch.5.d:
        expected:
          vllm_python:
            explanation: vLLM preserves the unterminated DeepSeek V3.2 DSML function_calls block in normal_text on the recovery path.
            calls: []
            normal_text: 'I''ll start by fetching the weather for both Boston and New York at the same time!

              <｜DSML｜function_calls>

              <｜DSML｜invoke name="get_weather">

              <｜DSML｜parameter name="location" string="true">Boston</｜DSML｜parameter>

              </｜DSML｜invoke>

              <｜DSML｜invoke name="get_weather">

              <｜DSML｜parameter name="location" string="true">New York</｜DSML｜parameter>

              </｜DSML｜invoke>'
      TOOLCALLING.batch.5.e:
        expected:
          vllm_python:
            explanation: vLLM preserves the truncated DeepSeek V3.2 DSML function_calls block in normal_text on the recovery path.
            calls: []
            normal_text: 'I''ll start by fetching the weather for both Boston and New York at the same time!

              <｜DSML｜function_calls>

              <｜DSML｜invoke name="get_weather">

              <｜DSML｜parameter name="location" string="true">Boston</｜DSML｜parameter>

              </｜DSML｜invoke>

              <｜DSML｜invoke name="get_weather">

              <｜DSML｜parameter name="location" string="true">New York'
