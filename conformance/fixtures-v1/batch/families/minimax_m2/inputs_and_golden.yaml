corpus: batch
family: minimax_m2
capture: inputs
documents:
  TOOLCALLING.batch.2.yaml:
    family: minimax_m2
    mode: batch
    cases:
      TOOLCALLING.batch.2.a:
        description: Two invokes inside one tool_call wrapper
        ref: dynamo
        model_text: '<minimax:tool_call>

          <invoke name="get_weather">

          <parameter name="location">NYC</parameter>

          </invoke>

          <invoke name="get_time">

          <parameter name="timezone">EST</parameter>

          </invoke>

          </minimax:tool_call>'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        - name: get_time
          parameters:
            type: object
            properties:
              timezone:
                type: string
      TOOLCALLING.batch.2.b:
        description: Two back-to-back tool_call wrappers
        ref: originated from https://github.com/vllm-project/vllm/blob/b53c507bc91f87e28b03e9b54bbff7c76e97d58b/tests/tool_parsers/test_minimax_m2_tool_parser.py#L207
        model_text: '<minimax:tool_call>

          <invoke name="get_weather">

          <parameter name="location">NYC</parameter>

          </invoke>

          </minimax:tool_call>

          <minimax:tool_call>

          <invoke name="get_time">

          <parameter name="timezone">EST</parameter>

          </invoke>

          </minimax:tool_call>'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        - name: get_time
          parameters:
            type: object
            properties:
              timezone:
                type: string
      TOOLCALLING.batch.2.c:
        description: Parallel with surrounding narration
        ref: dynamo
        model_text: 'Both: <minimax:tool_call>

          <invoke name="get_weather">

          <parameter name="location">NYC</parameter>

          </invoke>

          <invoke name="get_time">

          <parameter name="timezone">EST</parameter>

          </invoke>

          </minimax:tool_call> Done.'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        - name: get_time
          parameters:
            type: object
            properties:
              timezone:
                type: string
      TOOLCALLING.batch.2.d:
        description: Same-name twice
        ref: originated from https://github.com/vllm-project/vllm/blob/b53c507bc91f87e28b03e9b54bbff7c76e97d58b/tests/tool_parsers/test_minimax_m2_tool_parser.py#L331
        model_text: '<minimax:tool_call>

          <invoke name="get_weather">

          <parameter name="location">NYC</parameter>

          </invoke>

          <invoke name="get_weather">

          <parameter name="location">LA</parameter>

          </invoke>

          </minimax:tool_call>'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
  TOOLCALLING.batch.4.yaml:
    family: minimax_m2
    mode: batch
    cases:
      TOOLCALLING.batch.4.a:
        description: Tool_call wrapper with garbage body
        ref: dynamo
        model_text: '<minimax:tool_call>

          nonsense

          </minimax:tool_call>'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.4.c:
        description: Invoke without name attribute
        ref: dynamo
        model_text: '<minimax:tool_call>

          <invoke>

          <parameter name="location">NYC</parameter>

          </invoke>

          </minimax:tool_call>'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.4.d:
        description: Missing closing </invoke>
        ref: dynamo
        model_text: '<minimax:tool_call>

          <invoke name="get_weather">

          <parameter name="location">NYC</parameter>

          </minimax:tool_call>'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.4.b:
        description: Malformed variant 4.b — not yet authored for this family
        explanation: Malformed-input variant 4.b not yet authored for minimax_m2; see 4.a / 4.c / 4.d for this family's malformed-input scenarios.
      TOOLCALLING.batch.4.e:
        description: Malformed-prefix recovery — n/a for this family's syntax
        explanation: 'TOOLCALLING.batch.4.e is specific to llama3_json''s raw JSON-object scanner: a malformed JSON-looking prefix is followed by a complete JSON object, and the detector may resynchronize on the later object. This family uses a framed parser grammar instead of that raw JSON-prefix scanner; malformed-input coverage for this family lives in TOOLCALLING.batch.4.a through 4.d.'
      TOOLCALLING.batch.4.f:
        description: Tool-name XML tag case - n/a for this family's syntax
        explanation: TOOLCALLING.batch.4.f is specific to Qwen3-Coder XML syntax, where the model may emit a tool-name tag such as <terminal> inside <tool_call> instead of the required <function=Terminal> opener. This family does not use Qwen3-Coder's <function=...> opener.
  TOOLCALLING.batch.5.yaml:
    family: minimax_m2
    mode: batch
    cases:
      TOOLCALLING.batch.5.a:
        description: Missing </minimax:tool_call> end marker
        ref: dynamo
        model_text: '<minimax:tool_call>

          <invoke name="get_weather">

          <parameter name="location">NYC</parameter>

          </invoke>'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.5.b:
        description: Closing </minimax:tool_call> without matching open
        ref: dynamo
        model_text: '<invoke name="get_weather">

          <parameter name="location">NYC</parameter>

          </invoke>

          </minimax:tool_call>'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.5.c:
        description: Truncation mid-parameter value
        ref: dynamo
        model_text: '<minimax:tool_call>

          <invoke name="get_weather">

          <parameter name="location">NY'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.5.d:
        description: Multi-call, last call missing only end marker (body complete)
        ref: dynamo
        model_text: 'I''ll start by fetching the weather for both Boston and New York at the same time!

          <minimax:tool_call>

          <invoke name="get_weather">

          <parameter name="location">Boston</parameter>

          </invoke>

          <invoke name="get_weather">

          <parameter name="location">New York</parameter>

          </invoke>'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.5.e:
        description: Multi-call, last call truncated mid-arg-value
        ref: dynamo
        model_text: 'I''ll start by fetching the weather for both Boston and New York at the same time!

          <minimax:tool_call>

          <invoke name="get_weather">

          <parameter name="location">Boston</parameter>

          </invoke>

          <invoke name="get_weather">

          <parameter name="location">New York'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.5.f:
        description: Bare valid invoke before a complete wrapped call
        ref: dynamo
        model_text: '<invoke name="get_weather">

          <parameter name="location">NYC</parameter>

          </invoke>

          </minimax:tool_call>

          <minimax:tool_call>

          <invoke name="get_weather">

          <parameter name="location">Boston</parameter>

          </invoke>

          </minimax:tool_call>'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.5.g:
        description: Closing </minimax:tool_call> without matching open after prefix prose
        ref: dynamo
        model_text: 'I will check that. <invoke name="get_weather">

          <parameter name="location">NYC</parameter>

          </invoke>

          </minimax:tool_call>'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
  TOOLCALLING.batch.6.yaml:
    family: minimax_m2
    mode: batch
    cases:
      TOOLCALLING.batch.6.a:
        description: Invoke with no <parameter>
        ref: dynamo
        model_text: '<minimax:tool_call>

          <invoke name="get_time">

          </invoke>

          </minimax:tool_call>'
        tools:
