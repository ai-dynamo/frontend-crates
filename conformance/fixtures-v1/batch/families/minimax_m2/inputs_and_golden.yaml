      TOOLCALLING.batch.10:
        description: Duplicate calls (same name twice)
        model_text: '<minimax:tool_call>

          <invoke name="get_weather">

          <parameter name="location">NYC</parameter>

          </invoke>

          <invoke name="get_weather">

          <parameter name="location">LA</parameter>

          </invoke>

          </minimax:tool_call>'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.30:
        description: Separator-character case not applicable
        explanation: This case is not applicable to minimax_m2 because it uses XML-style tool_name/tool_args tags, not delimiter-separated call bodies.
      TOOLCALLING.batch.31:
        description: Multi-call separator-character case not applicable
        explanation: This case is not applicable to minimax_m2 because it uses XML-style tool_name/tool_args tags, not delimiter-separated call bodies.
      TOOLCALLING.batch.13:
        description: Unknown tool name absent from supplied tools
        ref: dynamo
        model_text: '<minimax:tool_call>

          <minimax:tool_name>unknown_tool</minimax:tool_name>

          <minimax:tool_args>{"location":"NYC"}</minimax:tool_args>

          </minimax:tool_call>'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
