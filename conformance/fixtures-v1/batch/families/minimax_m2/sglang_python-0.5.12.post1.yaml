            normal_text: ''
      TOOLCALLING.batch.3:
        expected:
          sglang_python:
            calls: []
            normal_text: Hello, how can I help you today?
      TOOLCALLING.batch.9.a:
        expected:
          sglang_python:
            calls: []
            normal_text: ''
      TOOLCALLING.batch.9.b:
        expected:
          sglang_python:
            calls: []
            normal_text: '   '
      TOOLCALLING.batch.10:
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_weather
              arguments:
                location: LA
            normal_text: ''
      TOOLCALLING.batch.13:
        expected:
          sglang_python:
            calls: []
            normal_text: ''
  TOOLCALLING.stream.1.yaml:
    family: minimax_m2
    mode: stream
    cases:
      TOOLCALLING.stream.1.a:
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: ''
      TOOLCALLING.stream.1.b:
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: ''
  TOOLCALLING.stream.2.yaml:
    family: minimax_m2
    mode: stream
    cases:
      TOOLCALLING.stream.2:
        expected:
          sglang_python:
            calls: []
            normal_text: '<minimax:tool_call>

              <invoke name="get_weather">

              <parameter name="location">NYC</parameter>

              </invoke>

              <invoke name="get_time">

              <parameter name="timezone">EST</parameter>

              </invoke>

              </minimax:tool_call>'
            explanation: 'SGLang leaks the complete MiniMax tool-call block into normal_text;

              Dynamo parses it as structured tool output per the M2.7 spec.'
  TOOLCALLING.stream.3.yaml:
    family: minimax_m2
    mode: stream
    cases:
      TOOLCALLING.stream.3:
        expected:
          sglang_python:
            calls: []
            normal_text: '<minimax:tool_call>

              <invoke name="get_weather">

              <parameter name="location">NYC</parameter>

              </invoke>

              </minimax:tool_call>'
            explanation: 'SGLang leaks the complete MiniMax tool-call block into normal_text;

              Dynamo parses it as structured tool output per the M2.7 spec.'
  TOOLCALLING.stream.4.yaml:
    family: minimax_m2
    mode: stream
    cases:
      TOOLCALLING.stream.4.a:
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: ''
      TOOLCALLING.stream.4.b:
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments: {}
            normal_text: ''
            explanation: 'SGLang''s streaming parser emits an empty-argument MiniMax call from

              a stream that ends before </parameter>, </invoke>, and

              </minimax:tool_call>; that contradicts the strict MiniMax-M2.7

              reference parser.'
      TOOLCALLING.stream.4.c:
        expected:
          sglang_python:
            calls: []
            normal_text: '<invoke name="get_weather">

              <parameter name="location">NYC</parameter>

              </invoke>

              </invoke>

              </invoke>'
            explanation: SGLang preserves the bare MiniMax invoke and orphan close-marker spam as content; Dynamo recovers the complete inner <invoke> call and drops the orphan marker tail.
