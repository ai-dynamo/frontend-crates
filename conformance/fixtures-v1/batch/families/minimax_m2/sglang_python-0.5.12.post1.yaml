corpus: batch
family: minimax_m2
capture: sglang_python-0.5.12.post1
documents:
  TOOLCALLING.batch.2.yaml:
    family: minimax_m2
    mode: batch
    cases:
      TOOLCALLING.batch.2.a:
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_time
              arguments:
                timezone: EST
            normal_text: ''
      TOOLCALLING.batch.2.b:
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_time
              arguments:
                timezone: EST
            normal_text: '

              '
            explanation: SGLang parser preserves the newline separator between adjacent MiniMax tool-call wrappers (`</minimax:tool_call>\n<minimax:tool_call>`).
      TOOLCALLING.batch.2.c:
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_time
              arguments:
                timezone: EST
            normal_text: 'Both:  Done.'
            explanation: SGLang preserves normal text after parsed MiniMax tool-call wrappers; Dynamo aligns with vLLM by keeping only text before the first parsed tool call.
      TOOLCALLING.batch.2.d:
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_weather
              arguments:
                location: LA
            normal_text: ''
  TOOLCALLING.batch.4.yaml:
    family: minimax_m2
    mode: batch
    cases:
      TOOLCALLING.batch.4.a:
        expected:
          sglang_python:
            calls: []
            normal_text: ''
      TOOLCALLING.batch.4.c:
        expected:
          sglang_python:
            calls: []
            normal_text: ''
      TOOLCALLING.batch.4.d:
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: ''
            explanation: 'SGLang''s MinimaxM2Detector regex

              (`r"<invoke name=\"(.*?)</invoke>|<invoke name=\"(.*)$"`) has an

              `|$` end-of-input alternation that lets a missing `</invoke>`

              still produce a call — contradicts MiniMax-M2 reference parser.

              Should be filed against sgl-project/sglang.'
  TOOLCALLING.batch.5.yaml:
    family: minimax_m2
    mode: batch
    cases:
      TOOLCALLING.batch.5.a:
        expected:
          sglang_python:
            calls: []
            normal_text: '<minimax:tool_call>

              <invoke name="get_weather">

              <parameter name="location">NYC</parameter>

              </invoke>'
            explanation: SGLang preserves a MiniMax block with a missing outer </minimax:tool_call> close as content; Dynamo recovers the complete inner <invoke> call.
      TOOLCALLING.batch.5.b:
        expected:
          sglang_python:
            explanation: vLLM and SGLang preserve orphan MiniMax invoke/parameter markers as content when opening <minimax:tool_call> is missing; Dynamo recovers the complete inner <invoke> call and drops the orphan close marker.
            calls: []
            normal_text: '<invoke name="get_weather">

              <parameter name="location">NYC</parameter>

              </invoke>

              </minimax:tool_call>'
      TOOLCALLING.batch.5.c:
        expected:
          sglang_python:
            calls: []
            normal_text: '<minimax:tool_call>

              <invoke name="get_weather">

              <parameter name="location">NY'
            explanation: sglang nullifies normal_text on malformed/recovery shapes where Dynamo preserves input
      TOOLCALLING.batch.5.d:
        expected:
          sglang_python:
            calls: []
            normal_text: 'I''ll start by fetching the weather for both Boston and New York at the same time!

              <minimax:tool_call>

              <invoke name="get_weather">

              <parameter name="location">Boston</parameter>

              </invoke>

              <invoke name="get_weather">

              <parameter name="location">New York</parameter>

              </invoke>'
            explanation: SGLang preserves the unterminated MiniMax tool-call block as content; Dynamo preserves prefix text and recovers the complete inner <invoke> calls.
      TOOLCALLING.batch.5.e:
        expected:
          sglang_python:
            calls: []
            normal_text: 'I''ll start by fetching the weather for both Boston and New York at the same time!

              <minimax:tool_call>

              <invoke name="get_weather">

              <parameter name="location">Boston</parameter>

              </invoke>

              <invoke name="get_weather">

              <parameter name="location">New York'
            explanation: SGLang preserves the truncated MiniMax tool-call block as content; Dynamo preserves prefix text, recovers the complete prior <invoke> call, and drops the incomplete trailing invoke.
      TOOLCALLING.batch.5.f:
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: Boston
            normal_text: '<invoke name="get_weather">

              <parameter name="location">NYC</parameter>

              </invoke>

              </minimax:tool_call>

              '
            explanation: SGLang preserves the bare MiniMax invoke before the first <minimax:tool_call> as content, including the trailing newline; Dynamo recovers it as the first structured call before parsing the wrapped call.
      TOOLCALLING.batch.5.g:
        expected:
          sglang_python:
            explanation: vLLM and SGLang preserve orphan MiniMax invoke/parameter markers as content when opening <minimax:tool_call> is missing; Dynamo preserves the prefix prose, recovers the complete inner <invoke> call, and drops the orphan close marker.
            calls: []
            normal_text: 'I will check that. <invoke name="get_weather">

              <parameter name="location">NYC</parameter>

              </invoke>

              </minimax:tool_call>'
  TOOLCALLING.batch.6.yaml:
    family: minimax_m2
    mode: batch
    cases:
      TOOLCALLING.batch.6.a:
        expected:
          sglang_python:
            calls:
            - name: get_time
              arguments: {}
            normal_text: ''
      TOOLCALLING.batch.6.b:
        expected:
          sglang_python:
            calls:
            - name: get_time
              arguments: {}
            normal_text: ''
  TOOLCALLING.batch.7.yaml:
    family: minimax_m2
    mode: batch
    cases:
      TOOLCALLING.batch.7.a:
        expected:
          sglang_python:
            calls:
            - name: book_flight
              arguments:
                destination: Paris
                first_class: true
                passengers: 2
            normal_text: ''
      TOOLCALLING.batch.7.b:
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: Tōkyō central
            normal_text: ''
      TOOLCALLING.batch.7.f:
        expected:
          sglang_python:
            explanation: Dynamo preserves integer-like number literals before the f64 path; vLLM/SGLang round through f64 and lose precision above 2^53.
            calls:
            - name: set_limit
              arguments:
                count: 9007199254740992
            normal_text: ''
  TOOLCALLING.batch.8.yaml:
    family: minimax_m2
    mode: batch
    cases:
      TOOLCALLING.batch.8.a:
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: 'I will check the weather. '
      TOOLCALLING.batch.8.b:
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: ' Let me know if you need more.'
            explanation: SGLang preserves normal text after parsed MiniMax tool-call wrappers; Dynamo aligns with vLLM by keeping only text before the first parsed tool call.
      TOOLCALLING.batch.8.c:
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: I will check the weather.  Let me know if you need more.
            explanation: SGLang preserves normal text after parsed MiniMax tool-call wrappers; Dynamo aligns with vLLM by keeping only text before the first parsed tool call.
      TOOLCALLING.batch.8.d:
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_weather
              arguments:
                location: LA
            normal_text: 'I will check the weather.  Then check LA weather. '
            explanation: SGLang preserves normal text after parsed MiniMax tool-call wrappers; Dynamo aligns with vLLM by keeping only text before the first parsed tool call.
  TOOLCALLING.batch.yaml:
    family: minimax_m2
    mode: batch
    cases:
      TOOLCALLING.batch.1:
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
