            explanation: vLLM and SGLang preserve orphan Kimi tool-call markers as content when opening <|tool_calls_section_begin|> is missing; Dynamo preserves the prefix prose, recovers the complete bare <|tool_call_begin|> body, and strips the orphan section close marker.
            calls: []
            normal_text: I will check that. <|tool_call_begin|>functions.get_weather:0<|tool_call_argument_begin|>{"location":"NYC"}<|tool_call_end|><|tool_calls_section_end|>
