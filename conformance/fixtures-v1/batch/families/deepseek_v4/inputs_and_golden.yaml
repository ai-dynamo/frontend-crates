corpus: batch
family: deepseek_v4
capture: inputs
documents:
  TOOLCALLING.batch.11.yaml:
    family: deepseek_v4
    mode: batch
    cases:
      TOOLCALLING.batch.11.a:
        description: Conflicting outer and inner tool names are unavailable in DSML
        explanation: DSML has one tool-name owner in the invoke name attribute and no inner envelope name that can disagree with it.
        unavailable:
          dynamo_v2: DSML carries only one tool name, so TOOLCALLING.batch.11.a cannot be expressed by this grammar.
      TOOLCALLING.batch.11.b:
        description: Empty DSML invoke name
        ref: DeepSeek DSML invoke grammar
        model_text: <｜DSML｜tool_calls><｜DSML｜invoke name=""><｜DSML｜parameter name="value" string="false">1</｜DSML｜parameter></｜DSML｜invoke></｜DSML｜tool_calls>
        tools:
        - name: f
          parameters:
            type: object
            properties:
              value:
                type: integer
      TOOLCALLING.batch.11.c:
        description: Generation-primer header omission is unavailable in DSML
        explanation: DSML tool calls do not use a separate generation-primer message header.
        unavailable:
          dynamo_v2: DSML has no generation-primer header, so TOOLCALLING.batch.11.c cannot be expressed by this grammar.
  TOOLCALLING.batch.2.yaml:
    family: deepseek_v4
    mode: batch
    cases:
      TOOLCALLING.batch.2.a:
        description: Two invokes inside one tool_calls wrapper
        ref: dynamo
        model_text: '<｜DSML｜tool_calls>

          <｜DSML｜invoke name="get_weather">

          <｜DSML｜parameter name="location" string="true">NYC</｜DSML｜parameter>

          </｜DSML｜invoke>

          <｜DSML｜invoke name="get_time">

          <｜DSML｜parameter name="timezone" string="true">EST</｜DSML｜parameter>

          </｜DSML｜invoke>

          </｜DSML｜tool_calls>'
        tools:
        - &id001
          name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        - &id002
          name: get_time
          parameters:
            type: object
            properties:
              timezone:
                type: string
      TOOLCALLING.batch.2.b:
        description: Two back-to-back tool_calls wrappers
        ref: dynamo
        model_text: '<｜DSML｜tool_calls>

          <｜DSML｜invoke name="get_weather">

          <｜DSML｜parameter name="location" string="true">NYC</｜DSML｜parameter>

          </｜DSML｜invoke>

          </｜DSML｜tool_calls>

          <｜DSML｜tool_calls>

          <｜DSML｜invoke name="get_time">

          <｜DSML｜parameter name="timezone" string="true">EST</｜DSML｜parameter>

          </｜DSML｜invoke>

          </｜DSML｜tool_calls>'
        tools:
        - *id001
        - *id002
      TOOLCALLING.batch.2.c:
        description: Parallel with surrounding narration
        ref: dynamo
        model_text: 'Both: <｜DSML｜tool_calls>

          <｜DSML｜invoke name="get_weather">

          <｜DSML｜parameter name="location" string="true">NYC</｜DSML｜parameter>

          </｜DSML｜invoke>

          <｜DSML｜invoke name="get_time">

          <｜DSML｜parameter name="timezone" string="true">EST</｜DSML｜parameter>

          </｜DSML｜invoke>

          </｜DSML｜tool_calls> Done.'
        tools:
        - *id001
        - *id002
      TOOLCALLING.batch.2.d:
        description: Same-name twice
        ref: dynamo
        model_text: '<｜DSML｜tool_calls>

          <｜DSML｜invoke name="get_weather">

          <｜DSML｜parameter name="location" string="true">NYC</｜DSML｜parameter>

          </｜DSML｜invoke>

          <｜DSML｜invoke name="get_weather">

          <｜DSML｜parameter name="location" string="true">LA</｜DSML｜parameter>

          </｜DSML｜invoke>

          </｜DSML｜tool_calls>'
        tools:
        - *id001
        - *id001
  TOOLCALLING.batch.30.yaml:
    family: deepseek_v4
    mode: batch
    cases:
      TOOLCALLING.batch.30.a:
        description: Character-level call separator is unavailable in DSML
        explanation: DSML separates invokes with complete tags rather than a comma, semicolon, or other separator character.
        unavailable:
          dynamo_v2: DSML has no character-level call separator to place inside an argument string.
      TOOLCALLING.batch.30.b:
        description: Character-level structural delimiter is unavailable in DSML
        explanation: Braces and brackets are ordinary JSON data in non-string parameters, covered by TOOLCALLING.batch.7.d; DSML structure is tag-delimited.
        unavailable:
          dynamo_v2: DSML has no character-level structural delimiter distinct from its tag markers.
      TOOLCALLING.batch.30.c:
        description: DSML control markers inside a string parameter remain data
        ref: DeepSeek DSML parameter grammar
        model_text: <｜DSML｜tool_calls><｜DSML｜invoke name="echo"><｜DSML｜parameter name="value" string="true">literal </｜DSML｜invoke> and <｜DSML｜tool_calls> stay data</｜DSML｜parameter></｜DSML｜invoke></｜DSML｜tool_calls>
        tools:
        - name: echo
          parameters:
            type: object
            properties:
              value:
                type: string
  TOOLCALLING.batch.31.yaml:
    family: deepseek_v4
    mode: batch
    cases:
      TOOLCALLING.batch.31.a:
        description: DSML invoke-close marker inside the first string parameter before a later invoke
        ref: DeepSeek DSML parameter grammar
        model_text: <｜DSML｜tool_calls><｜DSML｜invoke name="echo"><｜DSML｜parameter name="value" string="true">literal </｜DSML｜invoke> stays data</｜DSML｜parameter></｜DSML｜invoke><｜DSML｜invoke name="get_time"></｜DSML｜invoke></｜DSML｜tool_calls>
        tools:
        - name: echo
          parameters:
            type: object
            properties:
              value:
                type: string
        - &id003
          name: get_time
          parameters:
            type: object
            properties: {}
      TOOLCALLING.batch.31.b:
        description: Nested DSML parameter structures before a later invoke
        ref: DeepSeek DSML non-string parameter grammar
        model_text: <｜DSML｜tool_calls><｜DSML｜invoke name="process_data"><｜DSML｜parameter name="payload" string="false">{"items":[{"nested":{"value":1}}]}</｜DSML｜parameter></｜DSML｜invoke><｜DSML｜invoke name="get_time"></｜DSML｜invoke></｜DSML｜tool_calls>
        tools:
        - name: process_data
          parameters:
            type: object
            properties:
              payload:
                type: object
        - *id003
  TOOLCALLING.batch.4.yaml:
    family: deepseek_v4
    mode: batch
    cases:
      TOOLCALLING.batch.4.a:
        description: Tool_calls wrapper with garbage
        ref: dynamo
        model_text: '<｜DSML｜tool_calls>

          nonsense

          </｜DSML｜tool_calls>'
        tools:
        - &id004
          name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.4.c:
        description: Invoke without name attribute
        ref: dynamo
        model_text: '<｜DSML｜tool_calls>

          <｜DSML｜invoke>

          <｜DSML｜parameter name="location" string="true">NYC</｜DSML｜parameter>

          </｜DSML｜invoke>

          </｜DSML｜tool_calls>'
        tools:
        - *id004
      TOOLCALLING.batch.4.d:
        description: Missing </｜DSML｜parameter> end tag
        ref: dynamo
        model_text: '<｜DSML｜tool_calls>

          <｜DSML｜invoke name="get_weather">

          <｜DSML｜parameter name="location" string="true">NYC

          </｜DSML｜invoke>

          </｜DSML｜tool_calls>'
        tools:
        - *id004
      TOOLCALLING.batch.4.b:
        description: Invalid JSON syntax in a non-string DSML parameter
        ref: DeepSeek DSML parameter grammar
        model_text: '<｜DSML｜tool_calls>

          <｜DSML｜invoke name="get_weather">

          <｜DSML｜parameter name="location" string="false">{"city":"NYC"</｜DSML｜parameter>

          </｜DSML｜invoke>

          </｜DSML｜tool_calls>'
        tools:
        - *id004
      TOOLCALLING.batch.4.e:
        description: Malformed DSML invoke prefix followed by a valid complete invoke
        ref: DeepSeek DSML invoke grammar
        model_text: '<｜DSML｜tool_calls>

          <｜DSML｜invoke name=get_weather>

          <｜DSML｜invoke name="get_weather">

          <｜DSML｜parameter name="location" string="true">Paris</｜DSML｜parameter>

          </｜DSML｜invoke>

          </｜DSML｜tool_calls>'
        tools:
        - *id004
      TOOLCALLING.batch.4.f:
        description: Tool-name XML tag form is unavailable in DSML
        explanation: DSML identifies a tool only through the invoke name attribute; it has no XML function opener that can be replaced by a tool-name tag.
        unavailable:
          dynamo_v2: DSML has no XML function-opener form, so TOOLCALLING.batch.4.f cannot be expressed by this grammar.
  TOOLCALLING.batch.5.yaml:
    family: deepseek_v4
    mode: batch
    cases:
      TOOLCALLING.batch.5.a:
        description: Missing </｜DSML｜tool_calls> end marker
        ref: dynamo
        model_text: '<｜DSML｜tool_calls>

          <｜DSML｜invoke name="get_weather">

          <｜DSML｜parameter name="location" string="true">NYC</｜DSML｜parameter>

          </｜DSML｜invoke>'
        tools:
        - &id005
          name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.5.b:
        description: Closing </｜DSML｜tool_calls> without matching open
        ref: dynamo
        model_text: '<｜DSML｜invoke name="get_weather">

          <｜DSML｜parameter name="location" string="true">NYC</｜DSML｜parameter>

          </｜DSML｜invoke>

          </｜DSML｜tool_calls>'
        tools:
        - *id005
      TOOLCALLING.batch.5.c:
        description: Truncation mid-parameter value
        ref: dynamo
        model_text: '<｜DSML｜tool_calls>

          <｜DSML｜invoke name="get_weather">

          <｜DSML｜parameter name="location" string="true">NY'
        tools:
        - *id005
      TOOLCALLING.batch.5.d:
        description: Multi-call, last call missing only end marker (body complete)
        ref: dynamo
        model_text: 'I''ll start by fetching the weather for both Boston and New York at the same time!

          <｜DSML｜tool_calls>

          <｜DSML｜invoke name="get_weather">

          <｜DSML｜parameter name="location" string="true">Boston</｜DSML｜parameter>

          </｜DSML｜invoke>

          <｜DSML｜invoke name="get_weather">

          <｜DSML｜parameter name="location" string="true">New York</｜DSML｜parameter>

          </｜DSML｜invoke>'
        tools:
        - *id005
      TOOLCALLING.batch.5.e:
        description: Multi-call, last call truncated mid-arg-value
        ref: dynamo
        model_text: 'I''ll start by fetching the weather for both Boston and New York at the same time!

          <｜DSML｜tool_calls>

          <｜DSML｜invoke name="get_weather">

          <｜DSML｜parameter name="location" string="true">Boston</｜DSML｜parameter>

          </｜DSML｜invoke>

          <｜DSML｜invoke name="get_weather">

          <｜DSML｜parameter name="location" string="true">New York'
        tools:
        - *id005
      TOOLCALLING.batch.5.f:
        description: Bare valid invoke before a complete wrapped call
        ref: dynamo
        model_text: '<｜DSML｜invoke name="get_weather">

          <｜DSML｜parameter name="location" string="true">NYC</｜DSML｜parameter>

          </｜DSML｜invoke>

          </｜DSML｜tool_calls>

          <｜DSML｜tool_calls>

          <｜DSML｜invoke name="get_weather">

          <｜DSML｜parameter name="location" string="true">Boston</｜DSML｜parameter>

          </｜DSML｜invoke>

          </｜DSML｜tool_calls>'
        tools:
        - *id005
      TOOLCALLING.batch.5.g:
        description: Closing </｜DSML｜tool_calls> without matching open after prefix prose
        ref: dynamo
        model_text: 'I will check that. <｜DSML｜invoke name="get_weather">

          <｜DSML｜parameter name="location" string="true">NYC</｜DSML｜parameter>

          </｜DSML｜invoke>

          </｜DSML｜tool_calls>'
        tools:
        - *id005
  TOOLCALLING.batch.6.yaml:
    family: deepseek_v4
    mode: batch
    cases:
      TOOLCALLING.batch.6.a:
        description: Invoke with no <parameter>
        ref: dynamo
        model_text: '<｜DSML｜tool_calls>

          <｜DSML｜invoke name="get_time">

          </｜DSML｜invoke>

          </｜DSML｜tool_calls>'
        tools:
        - &id006
          name: get_time
          parameters:
            type: object
            properties: {}
      TOOLCALLING.batch.6.b:
        description: Invoke with extra newline
        ref: dynamo
        model_text: '<｜DSML｜tool_calls>

          <｜DSML｜invoke name="get_time">


          </｜DSML｜invoke>

          </｜DSML｜tool_calls>'
        tools:
        - *id006
      TOOLCALLING.batch.6.c:
        description: Missing arguments key is unavailable in DSML
        explanation: DSML has no arguments key; a parameterless invoke is already represented by TOOLCALLING.batch.6.a, so there is no distinct absent-key spelling.
        unavailable:
          dynamo_v2: DSML has no arguments key whose absence can be distinguished from an empty object; TOOLCALLING.batch.6.a is its parameterless form.
  TOOLCALLING.batch.7.yaml:
    family: deepseek_v4
    mode: batch
    cases:
      TOOLCALLING.batch.7.a:
        description: Multiple parameters
        ref: dynamo
        model_text: '<｜DSML｜tool_calls>

          <｜DSML｜invoke name="book_flight">

          <｜DSML｜parameter name="destination" string="true">Paris</｜DSML｜parameter>

          <｜DSML｜parameter name="passengers" string="false">2</｜DSML｜parameter>

          <｜DSML｜parameter name="first_class" string="false">true</｜DSML｜parameter>

          </｜DSML｜invoke>

          </｜DSML｜tool_calls>'
        tools:
        - name: book_flight
          parameters:
            type: object
            properties:
              destination:
                type: string
              passengers:
                type: integer
              first_class:
                type: boolean
      TOOLCALLING.batch.7.b:
        description: Unicode in parameter
        ref: dynamo
        model_text: '<｜DSML｜tool_calls>

          <｜DSML｜invoke name="get_weather">

          <｜DSML｜parameter name="location" string="true">Tōkyō central</｜DSML｜parameter>

          </｜DSML｜invoke>

          </｜DSML｜tool_calls>'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.7.c:
        description: DSML string value where the tool schema declares an integer
        ref: DeepSeek DSML string attribute
        model_text: '<｜DSML｜tool_calls>

          <｜DSML｜invoke name="set_temperature">

          <｜DSML｜parameter name="celsius" string="true">20</｜DSML｜parameter>

          </｜DSML｜invoke>

          </｜DSML｜tool_calls>'
        tools:
        - name: set_temperature
          parameters:
            type: object
            properties:
              celsius:
                type: integer
      TOOLCALLING.batch.7.d:
        description: Nested object and array in a non-string DSML parameter
        ref: DeepSeek DSML non-string parameter grammar
        model_text: '<｜DSML｜tool_calls>

          <｜DSML｜invoke name="process_data">

          <｜DSML｜parameter name="payload" string="false">{"items":[1,2,3],"config":{"nested":true}}</｜DSML｜parameter>

          </｜DSML｜invoke>

          </｜DSML｜tool_calls>'
        tools:
        - &id007
          name: process_data
          parameters:
            type: object
            properties:
              payload:
                type: object
      TOOLCALLING.batch.7.e:
        description: Large nested DSML parameter with null and empty values
        ref: DeepSeek DSML non-string parameter grammar
        model_text: '<｜DSML｜tool_calls>

          <｜DSML｜invoke name="process_data">

          <｜DSML｜parameter name="payload" string="false">{"regions":[{"name":"west","scores":[1,2,3]},{"name":"east","scores":[4,5,6]}],"flags":{"enabled":true,"retry":null},"empty":{}}</｜DSML｜parameter>

          </｜DSML｜invoke>

          </｜DSML｜tool_calls>'
        tools:
        - *id007
      TOOLCALLING.batch.7.f:
        description: Numeric precision edge preserves integer-like number literal
        ref: inferhub live capture on nvidia/deepseek-ai/deepseek-v4-pro; format follows https://huggingface.co/deepseek-ai/DeepSeek-V3.2/blob/main/encoding/encoding_dsv32.py
        model_text: '<｜DSML｜tool_calls>

          <｜DSML｜invoke name="set_limit">

          <｜DSML｜parameter name="count" string="false">9007199254740993</｜DSML｜parameter>

          </｜DSML｜invoke>

          </｜DSML｜tool_calls>'
        tools:
        - name: set_limit
          parameters:
            type: object
            properties:
              count:
                type: number
  TOOLCALLING.batch.8.yaml:
    family: deepseek_v4
    mode: batch
    cases:
      TOOLCALLING.batch.8.a:
        description: Narration before tool call only
        ref: dynamo
        model_text: 'I will check the weather. <｜DSML｜tool_calls>

          <｜DSML｜invoke name="get_weather">

          <｜DSML｜parameter name="location" string="true">NYC</｜DSML｜parameter>

          </｜DSML｜invoke>

          </｜DSML｜tool_calls>'
        tools:
        - &id008
          name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.8.b:
        description: Narration after tool call only
        ref: dynamo
        model_text: '<｜DSML｜tool_calls>

          <｜DSML｜invoke name="get_weather">

          <｜DSML｜parameter name="location" string="true">NYC</｜DSML｜parameter>

          </｜DSML｜invoke>

          </｜DSML｜tool_calls> Let me know if you need more.'
        tools:
        - *id008
      TOOLCALLING.batch.8.c:
        description: Narration both before and after (sandwich)
        ref: dynamo
        model_text: 'I will check the weather. <｜DSML｜tool_calls>

          <｜DSML｜invoke name="get_weather">

          <｜DSML｜parameter name="location" string="true">NYC</｜DSML｜parameter>

          </｜DSML｜invoke>

          </｜DSML｜tool_calls> Let me know if you need more.'
        tools:
        - *id008
      TOOLCALLING.batch.8.d:
        description: Narration between multiple tool calls
        ref: dynamo
        model_text: 'I will check the weather. <｜DSML｜tool_calls>

          <｜DSML｜invoke name="get_weather">

          <｜DSML｜parameter name="location" string="true">NYC</｜DSML｜parameter>

          </｜DSML｜invoke>

          </｜DSML｜tool_calls> Then check LA weather. <｜DSML｜tool_calls>

          <｜DSML｜invoke name="get_weather">

          <｜DSML｜parameter name="location" string="true">LA</｜DSML｜parameter>

          </｜DSML｜invoke>

          </｜DSML｜tool_calls>'
        tools:
        - *id008
  TOOLCALLING.batch.yaml:
    family: deepseek_v4
    model_label: DeepSeek V4
    mode: batch
    cases:
      TOOLCALLING.batch.1:
        description: Single tool call (happy path)
        model_text: '<｜DSML｜tool_calls>

          <｜DSML｜invoke name="get_weather">

          <｜DSML｜parameter name="location" string="true">NYC</｜DSML｜parameter>

          </｜DSML｜invoke>

          </｜DSML｜tool_calls>'
        tools:
        - &id009
          name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.13.c:
        description: Known and unknown invokes in one DSML tool_calls block
        ref: DeepSeek DSML invoke grammar
        model_text: '<｜DSML｜tool_calls>

          <｜DSML｜invoke name="get_weather">

          <｜DSML｜parameter name="location" string="true">NYC</｜DSML｜parameter>

          </｜DSML｜invoke>

          <｜DSML｜invoke name="unknown_tool">

          <｜DSML｜parameter name="location" string="true">LA</｜DSML｜parameter>

          </｜DSML｜invoke>

          </｜DSML｜tool_calls>'
        tools:
        - *id009
      TOOLCALLING.batch.13.b:
        description: Forward-unknown-tools mode is unavailable
        explanation: DeepSeek V4 DSML exposes no request mode that changes unknown-tool forwarding; the parser returns every well-formed invoke by name.
      TOOLCALLING.batch.13.d:
        description: Unknown native tool index is unavailable
        explanation: DeepSeek V4 DSML identifies tools by the invoke name attribute and has no ordinal or offered-tool registry index in its wire grammar.
      TOOLCALLING.batch.3:
        description: No tool call (plain text)
        model_text: Hello, how can I help you today?
        tools:
        - *id009
      TOOLCALLING.batch.9.a:
        description: Empty model text
        model_text: ''
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.9.b:
        description: Blank / whitespace-only model text
        ref: dynamo
        model_text: '   '
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.10:
        description: Duplicate calls (same name twice)
        model_text: '<｜DSML｜tool_calls>

          <｜DSML｜invoke name="get_weather">

          <｜DSML｜parameter name="location" string="true">NYC</｜DSML｜parameter>

          </｜DSML｜invoke>

          <｜DSML｜invoke name="get_weather">

          <｜DSML｜parameter name="location" string="true">LA</｜DSML｜parameter>

          </｜DSML｜invoke>

          </｜DSML｜tool_calls>'
        tools:
        - *id009
      TOOLCALLING.batch.13:
        description: Unknown tool name absent from supplied tools
        ref: dynamo
        model_text: '<｜DSML｜tool_calls>

          <｜DSML｜invoke name="unknown_tool">

          <｜DSML｜parameter name="location" string="true">NYC</｜DSML｜parameter>

          </｜DSML｜invoke>

          </｜DSML｜tool_calls>'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
  TOOLCALLING.stream.1.yaml:
    family: deepseek_v4
    model_label: DeepSeek V4
    mode: stream
    cases:
      TOOLCALLING.stream.1.a:
        description: Complete tool-call payload delivered in one content chunk
        ref: derived from TOOLCALLING.batch.1
        chunks:
        - delta_text: '<｜DSML｜tool_calls>

            <｜DSML｜invoke name="get_weather">

            <｜DSML｜parameter name="location" string="true">NYC</｜DSML｜parameter>

            </｜DSML｜invoke>

            </｜DSML｜tool_calls>'
        - delta_text: ''
          finish_reason: tool_calls
        tools: &id010
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.stream.1.b:
        description: Complete tool call split across parser-significant boundaries
        ref: derived from TOOLCALLING.batch.1
        chunks:
        - delta_text: '<｜DSML｜tool_calls>

            '
        - delta_text: '<｜DSML｜invoke name="get_weather">

            '
        - delta_text: <｜DSML｜parameter name="location" string="true">
        - delta_text: NYC
        - delta_text: '</｜DSML｜parameter>

            '
        - delta_text: '</｜DSML｜invoke>

            '
        - delta_text: </｜DSML｜tool_calls>
        - delta_text: ''
          finish_reason: tool_calls
