            normal_text: ''
  TOOLCALLING.batch.5.yaml:
    family: deepseek_v4
    mode: batch
    cases:
      TOOLCALLING.batch.5.a:
        expected:
          vllm_python:
            calls: []
            normal_text: '<｜DSML｜tool_calls>

              <｜DSML｜invoke name="get_weather">

              <｜DSML｜parameter name="location" string="true">NYC</｜DSML｜parameter>

              </｜DSML｜invoke>'
            explanation: vLLM leaks the DSML envelope into normal_text on missing end-marker recovery; Dynamo recovers the complete <｜DSML｜invoke> call and strips the unterminated outer tag.
      TOOLCALLING.batch.5.b:
        expected:
          vllm_python:
            explanation: vLLM leaks the DSML envelope into normal_text on missing/orphan end marker recovery; Dynamo recovers the complete bare <｜DSML｜invoke> call and strips the orphan DSML marker tail.
            calls: []
            normal_text: '<｜DSML｜invoke name="get_weather">

              <｜DSML｜parameter name="location" string="true">NYC</｜DSML｜parameter>

              </｜DSML｜invoke>

              </｜DSML｜tool_calls>'
      TOOLCALLING.batch.5.c:
        expected:
          vllm_python:
            calls: []
            normal_text: '<｜DSML｜tool_calls>

              <｜DSML｜invoke name="get_weather">

              <｜DSML｜parameter name="location" string="true">NY'
            explanation: vLLM leaks the tool call tag into normal_text on the recovery path
      TOOLCALLING.batch.5.d:
        expected:
          vllm_python:
            calls: []
            normal_text: 'I''ll start by fetching the weather for both Boston and New York at the same time!

              <｜DSML｜tool_calls>

              <｜DSML｜invoke name="get_weather">

              <｜DSML｜parameter name="location" string="true">Boston</｜DSML｜parameter>

              </｜DSML｜invoke>

              <｜DSML｜invoke name="get_weather">

              <｜DSML｜parameter name="location" string="true">New York</｜DSML｜parameter>

              </｜DSML｜invoke>'
            explanation: vLLM leaks the unterminated DSML block into normal_text on the recovery path; Dynamo recovers both complete <｜DSML｜invoke> calls (bodies fully closed) and keeps the prefix prose as normal_text.
      TOOLCALLING.batch.5.e:
        expected:
          vllm_python:
            calls: []
            normal_text: 'I''ll start by fetching the weather for both Boston and New York at the same time!

              <｜DSML｜tool_calls>

              <｜DSML｜invoke name="get_weather">

              <｜DSML｜parameter name="location" string="true">Boston</｜DSML｜parameter>

              </｜DSML｜invoke>

              <｜DSML｜invoke name="get_weather">

              <｜DSML｜parameter name="location" string="true">New York'
            explanation: vLLM leaks the unterminated DSML block into normal_text on the recovery path; Dynamo recovers only the complete Boston call and drops the New York call whose <｜DSML｜invoke> was never closed, keeping the prefix prose as normal_text.
      TOOLCALLING.batch.5.f:
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: Boston
            normal_text: '<｜DSML｜invoke name="get_weather">

              <｜DSML｜parameter name="location" string="true">NYC</｜DSML｜parameter>

              </｜DSML｜invoke>

              </｜DSML｜tool_calls>

              '
            explanation: vLLM preserves the bare DSML invoke before the first <｜DSML｜tool_calls> as content, including the trailing newline; Dynamo recovers it as the first structured call before parsing the wrapped call.
      TOOLCALLING.batch.5.g:
        expected:
          vllm_python:
            calls: []
            normal_text: 'I will check that. <｜DSML｜invoke name="get_weather">

              <｜DSML｜parameter name="location" string="true">NYC</｜DSML｜parameter>

              </｜DSML｜invoke>

              </｜DSML｜tool_calls>'
            explanation: vLLM leaks the DSML envelope into normal_text on orphan close-marker recovery; Dynamo preserves the prefix prose, recovers the complete bare <｜DSML｜invoke> call, and strips the orphan DSML marker tail.
