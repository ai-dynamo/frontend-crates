corpus: batch
family: deepseek_v4
capture: vllm_python-0.23.0
documents:
  TOOLCALLING.batch.2.yaml:
    family: deepseek_v4
    mode: batch
    cases:
      TOOLCALLING.batch.2.a:
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_time
              arguments:
                timezone: EST
            normal_text: ''
      TOOLCALLING.batch.2.b:
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_time
              arguments:
                timezone: EST
            normal_text: ''
            explanation: vLLM drops the inter-fence newline between back-to-back tool_calls wrappers
      TOOLCALLING.batch.2.c:
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_time
              arguments:
                timezone: EST
            normal_text: 'Both: '
      TOOLCALLING.batch.2.d:
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_weather
              arguments:
                location: LA
            normal_text: ''
  TOOLCALLING.batch.4.yaml:
