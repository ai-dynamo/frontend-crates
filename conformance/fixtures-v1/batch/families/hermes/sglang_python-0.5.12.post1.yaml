corpus: batch
family: hermes
capture: sglang_python-0.5.12.post1
documents:
  TOOLCALLING.batch.2.yaml:
    family: hermes
    mode: batch
    cases:
      TOOLCALLING.batch.2.a:
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_time
              arguments:
                timezone: EST
            normal_text: ''
      TOOLCALLING.batch.2.c:
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_time
              arguments:
                timezone: EST
            normal_text: 'Both:'
      TOOLCALLING.batch.2.d:
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_weather
              arguments:
                location: LA
            normal_text: ''
  TOOLCALLING.batch.4.yaml:
    family: hermes
    mode: batch
    cases:
      TOOLCALLING.batch.4.a:
        expected:
          sglang_python:
            explanation: vLLM and SGLang leave the raw <tool_call> wrapper in normal_text on non-JSON garbage; Dynamo discards the unparseable wrapper (no leak). Non-parity by design.
            calls: []
            normal_text: <tool_call>nonsense</tool_call>
      TOOLCALLING.batch.4.b:
        expected:
          sglang_python:
            explanation: vLLM and SGLang drop the call and leak the raw wrapper when the JSON body is missing its closing brace; Dynamo's JSON-repair recovers the call. Non-parity by design.
            calls: []
            normal_text: '<tool_call>{"name": "get_weather", "arguments": {"location": "NYC"</tool_call>'
      TOOLCALLING.batch.4.c:
        expected:
          sglang_python:
            calls: []
            normal_text: ''
      TOOLCALLING.batch.4.d:
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: ''
  TOOLCALLING.batch.5.yaml:
    family: hermes
    mode: batch
    cases:
      TOOLCALLING.batch.5.a:
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: ''
      TOOLCALLING.batch.5.b:
        expected:
          sglang_python:
            explanation: vLLM and SGLang leave the orphan </tool_call> in normal_text when the opening <tool_call> marker is missing; Dynamo strips the stray end marker (no leak). Non-parity by design.
            calls: []
            normal_text: '{"name": "get_weather", "arguments": {"location": "NYC"}}</tool_call>'
      TOOLCALLING.batch.5.c:
        expected:
          sglang_python:
            explanation: vLLM and SGLang surface the truncated <tool_call> body as raw text; Dynamo suppresses the unterminated call (open <tool_call>, no close, nothing salvaged) so no markup leaks. Non-parity by design.
            calls: []
            normal_text: '<tool_call>{"name": "get_weather", "arguments": {"loc'
      TOOLCALLING.batch.5.d:
        expected:
          sglang_python:
            explanation: vLLM and SGLang recover the trailing call whose body is complete but end marker is missing; Dynamo drops the unterminated trailing call and keeps the first complete call. Non-parity by design.
            calls:
            - name: get_weather
              arguments:
                location: Boston
            - name: get_weather
              arguments:
                location: New York
            normal_text: I'll start by fetching the weather for both Boston and New York at the same time!
      TOOLCALLING.batch.5.e:
        expected:
          sglang_python:
            explanation: vLLM and SGLang leak the whole text when the trailing call is truncated mid-arg-value; Dynamo recovers the first complete call and drops the truncated trailer (no leak). Non-parity by design.
            calls: []
            normal_text: 'I''ll start by fetching the weather for both Boston and New York at the same time!<tool_call>{"name": "get_weather", "arguments": {"location": "Boston"}}</tool_call><tool_call>{"name": "get_weather", "arguments": {"location": "New York'
