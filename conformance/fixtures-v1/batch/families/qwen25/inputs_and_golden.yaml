corpus: batch
family: qwen25
capture: inputs
documents:
  TOOLCALLING.batch.2.yaml:
    family: qwen25
    mode: batch
    cases:
      TOOLCALLING.batch.2.a:
        description: Parallel calls (back-to-back tool_call wrappers)
        ref: dynamo
        model_text: '<tool_call>

          {"name": "get_weather", "arguments": {"location": "NYC"}}

          </tool_call><tool_call>

          {"name": "get_time", "arguments": {"timezone": "EST"}}

          </tool_call>'
        tools:
        - &id001
          name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        - &id002
          name: get_time
          parameters:
            type: object
            properties:
              timezone:
                type: string
      TOOLCALLING.batch.2.b:
        description: Two back-to-back fence pairs - not applicable to this family
        explanation: Multi-call is covered by 2.a/2.c/2.d; no back-to-back fence pattern for this family.
      TOOLCALLING.batch.2.c:
        description: With surrounding narration
        ref: dynamo
        model_text: 'Both: <tool_call>

          {"name": "get_weather", "arguments": {"location": "NYC"}}

          </tool_call><tool_call>

          {"name": "get_time", "arguments": {"timezone": "EST"}}

          </tool_call> Done.'
        tools:
        - *id001
        - *id002
      TOOLCALLING.batch.2.d:
        description: Same-name twice
        ref: dynamo
        model_text: '<tool_call>

          {"name": "get_weather", "arguments": {"location": "NYC"}}

          </tool_call><tool_call>

          {"name": "get_weather", "arguments": {"location": "LA"}}

          </tool_call>'
        tools:
        - *id001
        - *id001
  TOOLCALLING.batch.4.yaml:
    family: qwen25
    mode: batch
    cases:
      TOOLCALLING.batch.4.a:
        description: Tool_call wrapper with non-JSON garbage
        ref: dynamo
        model_text: <tool_call>nonsense</tool_call>
        tools:
        - &id003
          name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.4.b:
        description: Missing close brace in JSON body
        ref: dynamo
        model_text: '<tool_call>{"name": "get_weather", "arguments": {"location": "NYC"</tool_call>'
        tools:
        - *id003
      TOOLCALLING.batch.4.c:
        description: Missing name key
        ref: dynamo
        model_text: '<tool_call>{"arguments": {"location": "NYC"}}</tool_call>'
        tools:
        - *id003
      TOOLCALLING.batch.4.d:
        description: Missing </tool_call> close
        ref: dynamo
        model_text: '<tool_call>{"name": "get_weather", "arguments": {"location": "NYC"}}'
        tools:
        - *id003
      TOOLCALLING.batch.4.e:
        description: Malformed-prefix recovery - n/a for this family's syntax
        explanation: 'n/a: llama3_json-specific raw-JSON-prefix resync; this family uses a framed grammar (see 4.a-4.d).'
      TOOLCALLING.batch.4.f:
        description: Tool-name XML tag case - n/a for this family's syntax
        explanation: 'n/a: Qwen3-Coder <function=...> XML syntax, not this family''s format.'
  TOOLCALLING.batch.5.yaml:
    family: qwen25
    mode: batch
    cases:
      TOOLCALLING.batch.5.a:
        description: Missing </tool_call> end marker
        ref: dynamo
        model_text: '<tool_call>{"name": "get_weather", "arguments": {"location": "NYC"}}'
        tools:
        - &id004
          name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.5.b:
        description: Closing </tool_call> without matching <tool_call> open
        ref: dynamo
        model_text: '{"name": "get_weather", "arguments": {"location": "NYC"}}</tool_call>'
        tools:
        - *id004
      TOOLCALLING.batch.5.c:
        description: Truncation mid-arguments JSON
        ref: dynamo
        model_text: '<tool_call>{"name": "get_weather", "arguments": {"loc'
        tools:
        - *id004
      TOOLCALLING.batch.5.d:
        description: Multi-call, last call missing only end marker (body complete)
        ref: dynamo
        model_text: 'I''ll start by fetching the weather for both Boston and New York at the same time!<tool_call>

          {"name": "get_weather", "arguments": {"location": "Boston"}}

          </tool_call><tool_call>

          {"name": "get_weather", "arguments": {"location": "New York"}}'
        tools:
        - *id004
      TOOLCALLING.batch.5.e:
        description: Multi-call, last call truncated mid-arg-value
        ref: dynamo
        model_text: 'I''ll start by fetching the weather for both Boston and New York at the same time!<tool_call>

          {"name": "get_weather", "arguments": {"location": "Boston"}}

          </tool_call><tool_call>

          {"name": "get_weather", "arguments": {"location": "New York'
        tools:
        - *id004
  TOOLCALLING.batch.6.yaml:
    family: qwen25
    mode: batch
    cases:
      TOOLCALLING.batch.6.a:
        description: 'Canonical "arguments": {}'
        ref: dynamo
        model_text: '<tool_call>

          {"name": "get_time", "arguments": {}}

          </tool_call>'
        tools:
        - &id005
          name: get_time
          parameters:
            type: object
            properties: {}
      TOOLCALLING.batch.6.b:
        description: Whitespace inside arguments {}
        ref: dynamo
        model_text: '<tool_call>

          {"name": "get_time", "arguments": { }}

          </tool_call>'
        tools:
        - *id005
      TOOLCALLING.batch.6.c:
        description: No arguments key
        ref: dynamo
        model_text: '<tool_call>{"name": "get_time"}</tool_call>'
        tools:
        - *id005
  TOOLCALLING.batch.7.yaml:
    family: qwen25
    mode: batch
    cases:
      TOOLCALLING.batch.7.a:
        description: Standard scalar types
        ref: dynamo
        model_text: '<tool_call>

          {"name": "book_flight", "arguments": {"destination": "Paris", "passengers": 2, "first_class": true}}

          </tool_call>'
        tools:
        - name: book_flight
          parameters:
            type: object
            properties:
              destination:
                type: string
              passengers:
                type: integer
              first_class:
                type: boolean
      TOOLCALLING.batch.7.b:
        description: Unicode + escaped chars
        ref: dynamo
        model_text: '<tool_call>

          {"name": "get_weather", "arguments": {"location": "Tōkyō \"central\""}}

          </tool_call>'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.7.c:
        description: Schema mismatch - string value where schema declares integer
        ref: dynamo
        model_text: '<tool_call>

          {"name": "set_temperature", "arguments": {"celsius": "20"}}

          </tool_call>'
        tools:
        - name: set_temperature
          parameters:
            type: object
            properties:
              celsius:
                type: integer
      TOOLCALLING.batch.7.d:
        description: Nested object + array
        ref: dynamo
        model_text: '<tool_call>

          {"name": "process_data", "arguments": {"items": [1,2,3], "config": {"nested": true}}}

          </tool_call>'
        tools:
        - name: process_data
          parameters:
            type: object
            properties:
              items:
                type: array
              config:
                type: object
      TOOLCALLING.batch.7.e:
        description: Large / deep JSON-edge argument payload
        ref: dynamo
        model_text: '<tool_call>

          {"name": "process_data", "arguments": {"payload": {"regions": [{"name": "west", "scores": [1, 2, 3]}, {"name": "east", "scores": [4, 5, 6]}], "flags": {"enabled": true, "retry": null}, "empty": {}}}}

          </tool_call>'
        tools:
        - name: process_data
          parameters:
            type: object
            properties:
              payload:
                type: object
      TOOLCALLING.batch.7.f:
        description: Numeric precision edge preserves integer-like number literal
        ref: https://qwen.readthedocs.io/en/v2.5/framework/function_call.html
        model_text: '<tool_call>

          {"name": "set_limit", "arguments": {"count": 9007199254740993}}

          </tool_call>'
        tools:
        - name: set_limit
          parameters:
            type: object
            properties:
              count:
                type: number
  TOOLCALLING.batch.8.yaml:
    family: qwen25
    mode: batch
    cases:
      TOOLCALLING.batch.8.a:
        description: Narration before tool call only
        ref: dynamo
        model_text: 'I will check the weather. <tool_call>

          {"name": "get_weather", "arguments": {"location": "NYC"}}

          </tool_call>'
        tools:
        - &id006
          name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.8.b:
        description: Narration after tool call only
        ref: dynamo
        model_text: '<tool_call>

          {"name": "get_weather", "arguments": {"location": "NYC"}}

          </tool_call> Let me know if you need more.'
        tools:
        - *id006
      TOOLCALLING.batch.8.c:
        description: Narration both before and after (sandwich)
        ref: dynamo
        model_text: 'I will check the weather. <tool_call>

          {"name": "get_weather", "arguments": {"location": "NYC"}}

          </tool_call> Let me know if you need more.'
        tools:
        - *id006
      TOOLCALLING.batch.8.d:
        description: Narration between multiple tool calls
        ref: dynamo
        model_text: 'I will check the weather. <tool_call>

          {"name": "get_weather", "arguments": {"location": "NYC"}}

          </tool_call> Then check LA weather. <tool_call>

          {"name": "get_weather", "arguments": {"location": "LA"}}

          </tool_call>'
        tools:
        - *id006
  TOOLCALLING.batch.yaml:
    family: qwen25
    model_label: Qwen 2.5
    mode: batch
    cases:
      TOOLCALLING.batch.1:
        description: Single tool call (happy path)
        model_text: '<tool_call>

          {"name": "get_weather", "arguments": {"location": "NYC"}}

          </tool_call>'
        tools:
        - &id007
          name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.3:
        description: No tool call (plain text)
        model_text: Hello, how can I help you today?
        tools:
        - *id007
      TOOLCALLING.batch.9.a:
        description: Empty model text
        model_text: ''
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.9.b:
        description: Blank / whitespace-only model text
        ref: dynamo
        model_text: '   '
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.10:
        description: Duplicate calls (same name twice)
        model_text: '<tool_call>

          {"name": "get_weather", "arguments": {"location": "NYC"}}

          </tool_call><tool_call>

          {"name": "get_weather", "arguments": {"location": "LA"}}

          </tool_call>'
        tools:
        - *id007
      TOOLCALLING.batch.13:
        description: Unknown tool name absent from supplied tools
        ref: dynamo
        model_text: '<tool_call>

          {"name": "unknown_tool", "arguments": {"location": "NYC"}}

          </tool_call>'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.13.c:
        description: Mixed known and unknown calls not applicable
        explanation: 'n/a: no vLLM peer; SGLang treats unknown calls as content.'
      TOOLCALLING.batch.30:
        description: Separator-character case not applicable
        explanation: 'n/a: this family wraps each call in <tool_call>, not a delimiter-separated body.'
      TOOLCALLING.batch.31:
        description: Multi-call separator-character case not applicable
        explanation: 'n/a: this family wraps each call in <tool_call>, not a delimiter-separated body.'
  TOOLCALLING.stream.1.yaml:
    family: qwen25
    model_label: Qwen 2.5
    mode: stream
    cases:
      TOOLCALLING.stream.1.a:
        description: Complete tool-call payload delivered in one content chunk
        ref: derived from TOOLCALLING.batch.1
        chunks:
        - delta_text: '<tool_call>

            {"name": "get_weather", "arguments": {"location": "NYC"}}

            </tool_call>'
        - delta_text: ''
          finish_reason: tool_calls
        tools: &id008
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.stream.1.b:
        description: Complete tool call split across parser-significant boundaries
        ref: derived from TOOLCALLING.batch.1
        chunks:
        - delta_text: '<tool_call>

            '
        - delta_text: '{"name": "get_weather", '
        - delta_text: '"arguments": {"location": "NYC"}}'
        - delta_text: '

            </tool_call>'
        - delta_text: ''
          finish_reason: tool_calls
        tools: *id008
  TOOLCALLING.stream.2.yaml:
    family: qwen25
    model_label: Qwen 2.5
    mode: stream
    cases:
      TOOLCALLING.stream.2:
        description: Multiple tool calls split across multiple content chunks
        ref: derived from TOOLCALLING.batch.2.a
        chunks:
        - delta_text: '<tool_call>

            {"nam'
        - delta_text: 'e": "get_weat'
        - delta_text: 'her", "arguments": {"location": "NYC"}}'
        - delta_text: '

            </tool_call><to'
        - delta_text: 'ol_call>

            {"name": "get_time"'
        - delta_text: ', "arguments": {"timezone": "EST"}}'
        - delta_text: '

            </tool_call>'
        - delta_text: ''
          finish_reason: tool_calls
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        - name: get_time
          parameters:
            type: object
            properties:
              timezone:
                type: string
  TOOLCALLING.stream.3.yaml:
    family: qwen25
    model_label: Qwen 2.5
    mode: stream
    cases:
      TOOLCALLING.stream.3:
        description: Complete single tool call with a grammar token split across chunk boundaries
        ref: derived from TOOLCALLING.batch.1
        chunks:
        - delta_text: <t
        - delta_text: ool
        - delta_text: '_call>

            {"name": "'
        - delta_text: get_weather", "argu
        - delta_text: me
        - delta_text: nts
        - delta_text: '": {"'
        - delta_text: 'location": '
        - delta_text: '"NYC"}}

            </tool_call>'
        - delta_text: ''
          finish_reason: tool_calls
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
  TOOLCALLING.stream.4.yaml:
    family: qwen25
    model_label: Qwen 2.5
    mode: stream
    cases:
      TOOLCALLING.stream.4.a:
        description: Truncated stream terminates after a complete in-flight tool-call body
        ref: derived from TOOLCALLING.batch.5.a
        chunks:
        - delta_text: '<tool_call>{"name": "get_weather", "arguments": {"location": "NYC"}}'
        - delta_text: ''
          finish_reason: stop
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.stream.4.b:
        description: Stream terminates mid-call body before the in-flight argument payload is complete
        ref: derived from TOOLCALLING.batch.5.c
        chunks:
        - delta_text: '<tool_call>{"name": "get_w'
        - delta_text: 'eather", "arguments": {"loc'
        - delta_text: ''
          finish_reason: stop
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.stream.4.c:
        description: Stream reaches length after a valid inner tool-call body without the required outer wrapper, followed by repeated close markers
        ref: derived from nemotron-ultra-preview-tool-call-leak-repro/repro_tool_call_leak.py
        chunks:
        - delta_text: '{"name": "get_weather", "arguments": {"location": "NYC"}}</tool_call></tool_call></tool_call>'
        - delta_text: ''
          finish_reason: length
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
