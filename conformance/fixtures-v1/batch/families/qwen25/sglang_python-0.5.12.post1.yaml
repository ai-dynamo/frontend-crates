  TOOLCALLING.batch.2.yaml:
    family: qwen25
    mode: batch
    cases:
      TOOLCALLING.batch.2.a:
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_time
              arguments:
                timezone: EST
            normal_text: ''
      TOOLCALLING.batch.2.c:
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_time
              arguments:
                timezone: EST
            normal_text: 'Both:'
      TOOLCALLING.batch.2.d:
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_weather
              arguments:
                location: LA
            normal_text: ''
  TOOLCALLING.batch.4.yaml:
    family: qwen25
    mode: batch
    cases:
      TOOLCALLING.batch.4.a:
        expected:
          sglang_python:
            explanation: 'Malformed body in a complete <tool_call> wrapper: Dynamo discards the unparseable jail region (no leak); SGLang''s Qwen25Detector keys on a "<tool_call>\n" prefix, so on this compact wrapper it detects nothing and returns the raw text. Non-parity by design.'
            calls: []
            normal_text: <tool_call>nonsense</tool_call>
      TOOLCALLING.batch.4.b:
        expected:
          sglang_python:
            explanation: 'Malformed JSON in a complete <tool_call> wrapper: Dynamo discards the unparseable jail region (no leak); SGLang''s Qwen25Detector keys on a "<tool_call>\n" prefix, so on this compact wrapper it detects nothing and returns the raw text. Non-parity by design.'
            calls: []
            normal_text: '<tool_call>{"name": "get_weather", "arguments": {"location": "NYC"</tool_call>'
      TOOLCALLING.batch.4.c:
        expected:
          sglang_python:
            explanation: 'Missing name key in a complete <tool_call> wrapper: Dynamo discards the unparseable jail region (no leak); SGLang''s Qwen25Detector keys on a "<tool_call>\n" prefix, so on this compact wrapper it detects nothing and returns the raw text. Non-parity by design.'
            calls: []
            normal_text: '<tool_call>{"arguments": {"location": "NYC"}}</tool_call>'
      TOOLCALLING.batch.4.d:
        expected:
          sglang_python:
            explanation: 'Incomplete call (open <tool_call>, no close): Dynamo suppresses to empty, SGLang keeps raw. Non-parity by design.'
            calls: []
            normal_text: '<tool_call>{"name": "get_weather", "arguments": {"location": "NYC"}}'
  TOOLCALLING.batch.5.yaml:
    family: qwen25
    mode: batch
    cases:
      TOOLCALLING.batch.5.a:
        expected:
