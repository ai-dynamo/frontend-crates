      TOOLCALLING.batch.5.b:
        expected:
          sglang_python:
            explanation: 'Orphan </tool_call> with no opener: Dynamo strips the stray end marker from normal_text (no leak); SGLang''s Qwen25Detector leaves it in the raw text. Non-parity by design.'
            calls: []
            normal_text: '{"name": "get_weather", "arguments": {"location": "NYC"}}</tool_call>'
      TOOLCALLING.batch.5.c:
        expected:
          sglang_python:
            explanation: 'Incomplete call (open <tool_call>, no close): Dynamo suppresses to empty, SGLang keeps raw. Non-parity by design.'
            calls: []
