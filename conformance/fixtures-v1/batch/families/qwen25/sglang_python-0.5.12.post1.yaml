            explanation: 'Name-only call (no arguments key): Dynamo recovers it as get_time({}) (matching vLLM/SGLang Hermes detectors); SGLang''s Qwen25Detector keys on a "<tool_call>\n" prefix, so on this compact wrapper it detects nothing and returns the raw text. Non-parity by design.'
