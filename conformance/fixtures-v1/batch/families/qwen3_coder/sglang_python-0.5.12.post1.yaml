      TOOLCALLING.stream.4.b:
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments: {}
            normal_text: ''
            explanation: 'Impl-defined recovery for TOOLCALLING.batch.5-class missing end-token (per `tests/parity/README.md` "permanent divergences"). The stream ends mid-argument with `NY` but no `</parameter>`; SGLang requires the parameter close-token before emitting the value, so it ships the header with empty `arguments` and drops the partial payload. Dynamo emits the partial value (`location: "NY"`).'
      TOOLCALLING.stream.4.c:
        expected:
          sglang_python:
            calls:
            - arguments: '{"location": "NYC"}}}'
              name: get_weather
            explanation: SGLang recovers the bare <function=...> body, but the repeated </function> close markers are folded into the emitted argument string as extra closing braces. Dynamo consumes the repeated close markers as parser syntax and emits arguments {"location":"NYC"} with empty normal_text.
            normal_text: '




              '
