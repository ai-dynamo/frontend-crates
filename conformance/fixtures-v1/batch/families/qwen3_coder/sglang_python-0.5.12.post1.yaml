  TOOLCALLING.batch.5.yaml:
    family: qwen3_coder
    mode: batch
    cases:
      TOOLCALLING.batch.5.a:
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: ''
      TOOLCALLING.batch.5.b:
        expected:
          sglang_python:
            calls: []
            normal_text: '<function=get_weather>

              <parameter=location>

              NYC

              </parameter>

              </function>

              </tool_call>'
            explanation: 'SGLang''s qwen3_coder detector gates parsing on the opening

              <tool_call> sentinel (`if tool_call_start_token not in text: return

              normal_text=text`); a bare </tool_call> close with a valid <function>

              body short-circuits to zero calls and the full text as normal_text.

              Dynamo/vLLM tolerate the missing open and extract the <function> body

              per impl-defined recovery contract (see TOOLCALLING_CASES.md).'
      TOOLCALLING.batch.5.c:
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NY
            normal_text: ''
      TOOLCALLING.batch.5.d:
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: Boston
            normal_text: 'I''ll start by fetching the weather for both Boston and New York at the same time!

              '
            explanation: 'SGLang''s non-streaming path uses `re.compile(r"<tool_call>(.*?)</tool_call>")`

              which requires a matching </tool_call> close; an unterminated trailing

              <tool_call> (even with a complete <function> body) is silently dropped.

              Dynamo/vLLM recover the trailing call and emit it.'
      TOOLCALLING.batch.5.e:
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: Boston
            normal_text: 'I''ll start by fetching the weather for both Boston and New York at the same time!

              '
      TOOLCALLING.batch.5.f:
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: Boston
            normal_text: '<function=get_weather>

              <parameter=location>

              NYC

              </parameter>

              </function>

              </tool_call>

              '
            explanation: SGLang preserves the bare Qwen function before the first <tool_call> as content, including the trailing newline; Dynamo recovers it as the first structured call before parsing the wrapped call.
      TOOLCALLING.batch.5.g:
        expected:
          sglang_python:
            calls: []
            normal_text: 'I will check that. <function=get_weather>

              <parameter=location>

              NYC

              </parameter>

              </function>

              </tool_call>'
            explanation: 'SGLang''s qwen3_coder detector gates parsing on the opening <tool_call>

              sentinel; a bare </tool_call> close after prefix prose short-circuits to

              zero calls and the full text as normal_text. Dynamo preserves the prose,

              recovers the <function> body, and strips the orphan close marker.'
