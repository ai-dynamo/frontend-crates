corpus: batch
family: qwen3_coder
capture: inputs
documents:
  TOOLCALLING.batch.2.yaml:
    family: qwen3_coder
    mode: batch
    cases:
      TOOLCALLING.batch.2.a:
        description: Parallel calls (different names)
        ref: originated from https://github.com/vllm-project/vllm/blob/b53c507bc91f87e28b03e9b54bbff7c76e97d58b/tests/tool_parsers/common_tests.py#L185
        model_text: '<tool_call>

          <function=get_weather>

          <parameter=location>

          NYC

          </parameter>

          </function>

          </tool_call>

          <tool_call>

          <function=get_time>

          <parameter=timezone>

          EST

          </parameter>

          </function>

          </tool_call>'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        - name: get_time
          parameters:
            type: object
            properties:
              timezone:
                type: string
      TOOLCALLING.batch.2.c:
        description: Parallel calls with surrounding narration
        ref: dynamo
        model_text: 'Both: <tool_call>

          <function=get_weather>

          <parameter=location>

          NYC

          </parameter>

          </function>

          </tool_call>

          <tool_call>

          <function=get_time>

          <parameter=timezone>

          EST

          </parameter>

          </function>

          </tool_call> Done.'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        - name: get_time
          parameters:
            type: object
            properties:
              timezone:
                type: string
      TOOLCALLING.batch.2.d:
        description: Same-name twice (id distinctness)
        ref: dynamo
        model_text: '<tool_call>

          <function=get_weather>

          <parameter=location>

          NYC

          </parameter>

          </function>

          </tool_call>

          <tool_call>

          <function=get_weather>

          <parameter=location>

          LA

          </parameter>

          </function>

          </tool_call>'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.2.b:
        description: Two back-to-back fence pairs — not applicable to this family
        explanation: qwen3_coder's multi-call form is exercised by TOOLCALLING.batch.2.a / 2.c / 2.d; no back-to-back fence/wrapper pattern applies to this family's parser syntax.
  TOOLCALLING.batch.4.yaml:
    family: qwen3_coder
    mode: batch
    cases:
      TOOLCALLING.batch.4.a:
        description: Tool_call wrapper with no <function> body
        ref: originated from https://github.com/vllm-project/vllm/blob/b53c507bc91f87e28b03e9b54bbff7c76e97d58b/tests/tool_parsers/common_tests.py#L322
        model_text: '<tool_call>

          nonsense

          </tool_call>'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.4.d:
        description: Missing </parameter> closing tag
        ref: originated from https://github.com/vllm-project/vllm/blob/b53c507bc91f87e28b03e9b54bbff7c76e97d58b/tests/tool_parsers/test_qwen3coder_tool_parser.py#L729
        model_text: '<tool_call>

          <function=get_weather>

          <parameter=location>

          NYC

          </function>

          </tool_call>'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.4.b:
        description: Malformed variant 4.b — not yet authored for this family
        explanation: Malformed-input variant 4.b not yet authored for qwen3_coder; see 4.a / 4.c / 4.d for this family's malformed-input scenarios.
      TOOLCALLING.batch.4.c:
        description: Malformed variant 4.c — not yet authored for this family
        explanation: Malformed-input variant 4.c not yet authored for qwen3_coder; see 4.a / 4.b / 4.d for this family's malformed-input scenarios.
      TOOLCALLING.batch.4.e:
        description: Malformed-prefix recovery — n/a for this family's syntax
        explanation: 'TOOLCALLING.batch.4.e is specific to llama3_json''s raw JSON-object scanner: a malformed JSON-looking prefix is followed by a complete JSON object, and the detector may resynchronize on the later object. This family uses a framed parser grammar instead of that raw JSON-prefix scanner; malformed-input coverage for this family lives in TOOLCALLING.batch.4.a through 4.d.'
      TOOLCALLING.batch.4.f:
        description: Tool name emitted as an XML tag instead of <function=...>
        ref: Ultra test case - tool name emitted as XML tag instead of <function=...>
        model_text: '<tool_call>

          <terminal>

          echo hello

          </function>

          </tool_call>'
        tools:
        - name: Terminal
          parameters:
            type: object
            properties:
              command:
                type: string
