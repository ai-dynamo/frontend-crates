corpus: batch
family: qwen3_coder
capture: vllm_python-0.23.0
documents:
  TOOLCALLING.batch.2.yaml:
    family: qwen3_coder
    mode: batch
    cases:
      TOOLCALLING.batch.2.a:
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_time
              arguments:
                timezone: EST
            normal_text: ''
      TOOLCALLING.batch.2.c:
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_time
              arguments:
                timezone: EST
            normal_text: 'Both: '
      TOOLCALLING.batch.2.d:
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_weather
              arguments:
                location: LA
            normal_text: ''
  TOOLCALLING.batch.4.yaml:
    family: qwen3_coder
    mode: batch
    cases:
      TOOLCALLING.batch.4.a:
        expected:
          vllm_python:
            calls: []
            normal_text: '<tool_call>

              nonsense

              </tool_call>'
            explanation: vLLM preserves a <tool_call> wrapper with no <function=...> body as content; Dynamo/SGLang strip the invalid wrapper.
      TOOLCALLING.batch.4.d:
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: ''
      TOOLCALLING.batch.4.f:
        expected:
          vllm_python:
            calls: []
            normal_text: '<tool_call>

              <terminal>

              echo hello

              </function>

              </tool_call>'
            explanation: <terminal> is not valid Qwen3-Coder grammar; vLLM preserves the invalid wrapper as content, while Dynamo/SGLang strip it.
  TOOLCALLING.batch.5.yaml:
    family: qwen3_coder
    mode: batch
    cases:
      TOOLCALLING.batch.5.a:
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: ''
      TOOLCALLING.batch.5.b:
        expected:
          vllm_python:
            calls:
            - arguments:
                location: NYC
              name: get_weather
            normal_text: ''
            explanation: impl-defined recovery contract (see TOOLCALLING_CASES.md)
      TOOLCALLING.batch.5.c:
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: NY
            normal_text: ''
      TOOLCALLING.batch.5.d:
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: Boston
            - name: get_weather
              arguments:
                location: New York
            normal_text: 'I''ll start by fetching the weather for both Boston and New York at the same time!

              '
      TOOLCALLING.batch.5.e:
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: Boston
            - name: get_weather
              arguments:
                location: New York
            normal_text: 'I''ll start by fetching the weather for both Boston and New York at the same time!

              '
            explanation: 'vLLM recovers the partial value (location=''New York'') from the call

              truncated mid-arg-value before its closing sentinel. Dynamo (the

              truncation guard) and SGLang require the value to be terminated, so

              they drop the truncated call.'
      TOOLCALLING.batch.5.f:
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: Boston
            normal_text: '<function=get_weather>

              <parameter=location>

              NYC

              </parameter>

              </function>

              </tool_call>

              '
            explanation: vLLM preserves the bare Qwen function before the first <tool_call> as content, including the trailing newline; Dynamo recovers it as the first structured call before parsing the wrapped call.
      TOOLCALLING.batch.5.g:
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: 'I will check that. '
  TOOLCALLING.batch.6.yaml:
    family: qwen3_coder
    mode: batch
    cases:
      TOOLCALLING.batch.6.a:
        expected:
          vllm_python:
            calls:
            - name: get_time
              arguments: {}
            normal_text: ''
      TOOLCALLING.batch.6.b:
        expected:
          vllm_python:
            calls:
            - name: get_time
              arguments: {}
            normal_text: ''
  TOOLCALLING.batch.7.yaml:
    family: qwen3_coder
    mode: batch
    cases:
      TOOLCALLING.batch.7.a:
        expected:
          vllm_python:
            calls:
            - name: book_flight
              arguments:
                destination: Paris
                first_class: true
                passengers: 2
            normal_text: ''
      TOOLCALLING.batch.7.b:
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: Tōkyō central
            normal_text: ''
      TOOLCALLING.batch.7.f:
        expected:
          vllm_python:
            explanation: Dynamo preserves integer-like number literals before the f64 path; vLLM/SGLang round through f64 and lose precision above 2^53.
            calls:
            - name: set_limit
              arguments:
                count: 9007199254740992
            normal_text: null
  TOOLCALLING.batch.8.yaml:
    family: qwen3_coder
    mode: batch
    cases:
      TOOLCALLING.batch.8.a:
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: 'I will check the weather. '
      TOOLCALLING.batch.8.b:
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: ''
      TOOLCALLING.batch.8.c:
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: 'I will check the weather. '
      TOOLCALLING.batch.8.d:
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_weather
              arguments:
                location: LA
            normal_text: 'I will check the weather. '
  TOOLCALLING.batch.yaml:
    family: qwen3_coder
    mode: batch
    cases:
      TOOLCALLING.batch.1:
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: ''
      TOOLCALLING.batch.3:
        expected:
          vllm_python:
            calls: []
            normal_text: Hello, how can I help you today?
      TOOLCALLING.batch.9.a:
        expected:
          vllm_python:
            calls: []
            normal_text: ''
      TOOLCALLING.batch.9.b:
        expected:
          vllm_python:
            calls: []
            normal_text: '   '
      TOOLCALLING.batch.10:
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_weather
              arguments:
                location: LA
            normal_text: ''
      TOOLCALLING.batch.13:
        expected:
          vllm_python:
            calls:
            - name: unknown_tool
              arguments:
