            normal_text: ''
  TOOLCALLING.stream.1.yaml:
    family: qwen3_coder
    mode: stream
    cases:
      TOOLCALLING.stream.1.a:
        expected:
          vllm_python:
            calls: []
            normal_text: ''
            explanation: vLLM streaming parser exits at qwen3coder_tool_parser.py:412 after detecting `<tool_call>` in delta_text and never re-processes the remainder of the same chunk; the trailing `finish_reason=tool_calls` chunk has no `delta_token_ids`, so the EOS-flush branch (qwen3coder_tool_parser.py:348-370) is skipped and no tool call is emitted. Dynamo handles the single-chunk burst correctly.
      TOOLCALLING.stream.1.b:
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: ''
  TOOLCALLING.stream.2.yaml:
    family: qwen3_coder
    mode: stream
    cases:
      TOOLCALLING.stream.2:
        expected:
          vllm_python:
            calls: []
            normal_text: '<tool_call>

              <function=get_weather>

              <parameter=location>

              NYC

              </parameter>

              </function>

              </tool_call>

              <tool_call>

              <function=get_time>

              <parameter=timezone>

              EST

              </parameter>

              </function>

              </tool_call>'
            explanation: 'vLLM streaming parser checks for `<tool_call>` only in `delta_text` (qwen3coder_tool_parser.py:402), not the accumulated `current_text`. When the start token is split across chunk boundaries (`<tool_cal` + `l>\n<fun`), the condition never fires and every chunk falls through to the no-tool-call branch at qwen3coder_tool_parser.py:422, which emits `delta_text` as content. Result: the entire wire payload leaks into `normal_text` and no tool calls are produced.'
  TOOLCALLING.stream.3.yaml:
    family: qwen3_coder
    mode: stream
    cases:
      TOOLCALLING.stream.3:
        expected:
          vllm_python:
            calls: []
            normal_text: '<tool_call>

              <function=get_weather>

              <parameter=location>

              NYC

              </parameter>

              </function>

              </tool_call>'
            explanation: 'Same root cause as TOOLCALLING.stream.2: vLLM checks for `<tool_call>` in `delta_text` only (qwen3coder_tool_parser.py:402). With the start token split across chunks (`<t` + `ool` + `_call` + `>\n…`), the guard never matches and every chunk is emitted as plain content via qwen3coder_tool_parser.py:422, leaking the entire payload into `normal_text`.'
  TOOLCALLING.stream.4.yaml:
    family: qwen3_coder
    mode: stream
    cases:
      TOOLCALLING.stream.4.a:
        expected:
          vllm_python:
            calls: []
            normal_text: ''
            explanation: 'Same root cause as TOOLCALLING.stream.1.a: the full body arrives in a single delta, vLLM detects `<tool_call>` and returns at qwen3coder_tool_parser.py:412 without reprocessing the rest of the chunk. The final `finish_reason=stop` chunk has no `delta_token_ids`, so the EOS-flush branch at qwen3coder_tool_parser.py:348-370 is skipped. No header or arguments are ever emitted.'
      TOOLCALLING.stream.4.b:
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments: {}
            normal_text: ''
            explanation: Impl-defined recovery for TOOLCALLING.batch.5-class missing end-token (per `tests/parity/README.md` "permanent divergences"). vLLM's per-parameter extraction loop (qwen3coder_tool_parser.py:540-579) requires either `</parameter>`, the next `<parameter=`, or `</function>` to delimit the value; when the stream ends mid-payload none of those are present, the loop breaks before emitting a json fragment, and the header ships with empty `arguments`. Matches SGLang.
      TOOLCALLING.stream.4.c:
        expected:
          vllm_python:
            calls: []
            normal_text: '<function=get_weather>

              <parameter=location>

              NYC

              </parameter>

              </function>

              </function>

              </function>'
            explanation: vLLM's streaming qwen3_coder parser does not enter tool-call mode for this bare <function=...> body because the outer <tool_call> marker is missing, so it preserves the raw function markup in normal_text. Dynamo intentionally uses Qwen3-Coder's no-wrapper backoff and emits the structured call without leaking parser tags.
