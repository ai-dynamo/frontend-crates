corpus: batch
family: llama3_json
capture: inputs
documents:
  TOOLCALLING.batch.2.yaml:
    family: llama3_json
    mode: batch
    cases:
      TOOLCALLING.batch.2.a:
        description: Parallel calls (semicolon-separated)
        ref: dynamo
        model_text: '<|python_tag|>{"name": "get_weather", "arguments": {"location": "NYC"}};{"name": "get_time", "arguments": {"timezone": "EST"}}'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        - name: get_time
          parameters:
            type: object
            properties:
              timezone:
                type: string
      TOOLCALLING.batch.2.c:
        description: With surrounding narration
        ref: dynamo
        model_text: 'Both: <|python_tag|>{"name": "get_weather", "arguments": {"location": "NYC"}};{"name": "get_time", "arguments": {"timezone": "EST"}} Done.'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        - name: get_time
          parameters:
            type: object
            properties:
              timezone:
                type: string
      TOOLCALLING.batch.2.d:
        description: Same-name twice (semicolon-separated)
        ref: dynamo
        model_text: '<|python_tag|>{"name": "get_weather", "arguments": {"location": "NYC"}};{"name": "get_weather", "arguments": {"location": "LA"}}'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.2.b:
        description: Two back-to-back fence pairs — not applicable to this family
        explanation: llama3_json's multi-call form is exercised by TOOLCALLING.batch.2.a / 2.c / 2.d; no back-to-back fence/wrapper pattern applies to this family's parser syntax.
  TOOLCALLING.batch.4.yaml:
    family: llama3_json
    mode: batch
    cases:
      TOOLCALLING.batch.4.a:
        description: Python_tag prefix with non-JSON garbage
        ref: dynamo
        model_text: <|python_tag|>nonsense
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.4.b:
        description: Missing close brace
        ref: originated from https://github.com/vllm-project/vllm/blob/b53c507bc91f87e28b03e9b54bbff7c76e97d58b/tests/tool_parsers/test_llama3_json_tool_parser.py#L66
        model_text: '<|python_tag|>{"name": "get_weather", "arguments": {"location": "NYC"'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.4.c:
        description: Missing name key
        ref: originated from https://github.com/vllm-project/vllm/blob/b53c507bc91f87e28b03e9b54bbff7c76e97d58b/tests/tool_parsers/test_llama3_json_tool_parser.py#L234
        model_text: '<|python_tag|>{"arguments": {"location": "NYC"}}'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.4.e:
        description: Malformed JSON prefix followed by a valid complete call
        ref: SGLang TestLlama32Detector.test_invalid_then_valid_json
        model_text: '{"name": "get_weather", "arguments": {{"name": "get_weather", "arguments": {}}'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties: {}
      TOOLCALLING.batch.4.d:
        description: Malformed variant 4.d — not applicable to this family
        explanation: Malformed-input variant 4.d does not apply to llama3_json's parser syntax (no equivalent end-marker recovery scenario).
      TOOLCALLING.batch.4.f:
        description: Tool-name XML tag case - n/a for this family's syntax
        explanation: TOOLCALLING.batch.4.f is specific to Qwen3-Coder XML syntax, where the model may emit a tool-name tag such as <terminal> inside <tool_call> instead of the required <function=Terminal> opener. This family does not use Qwen3-Coder's <function=...> opener.
  TOOLCALLING.batch.5.yaml:
    family: llama3_json
    mode: batch
    cases:
      TOOLCALLING.batch.5.a:
        description: No explicit end (truncation)
        ref: dynamo
        model_text: '<|python_tag|>{"name": "get_weather", "arguments": {"location": "NYC"}'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.5.c:
        description: Truncation deeper inside arguments JSON (vs .a which truncates at the closing brace)
        ref: dynamo
        model_text: '<|python_tag|>{"name": "get_weather", "arguments": {"loc'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.5.d:
        description: Multi-call, last call missing only end marker (body complete)
        ref: dynamo
        model_text: 'I''ll start by fetching the weather for both Boston and New York at the same time!<|python_tag|>{"name": "get_weather", "arguments": {"location": "Boston"}};{"name": "get_weather", "arguments": {"location": "New York"}'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.5.e:
        description: Multi-call, last call truncated mid-arg-value
        ref: dynamo
        model_text: 'I''ll start by fetching the weather for both Boston and New York at the same time!<|python_tag|>{"name": "get_weather", "arguments": {"location": "Boston"}};{"name": "get_weather", "arguments": {"location": "New York'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.5.b:
        description: Orphan closing-marker — n/a for this family's syntax
        explanation: Orphan closing-marker test is n/a — llama3_json's output has no matching delimiter pair to leave unclosed.
  TOOLCALLING.batch.6.yaml:
    family: llama3_json
    mode: batch
    cases:
      TOOLCALLING.batch.6.a:
        description: 'Canonical "arguments": {}'
        ref: dynamo
        model_text: '<|python_tag|>{"name": "get_time", "arguments": {}}'
        tools:
        - name: get_time
          parameters:
            type: object
            properties: {}
      TOOLCALLING.batch.6.b:
        description: Whitespace inside arguments {}
        ref: dynamo
        model_text: '<|python_tag|>{"name": "get_time", "arguments": { }}'
        tools:
        - name: get_time
          parameters:
            type: object
            properties: {}
      TOOLCALLING.batch.6.c:
        description: No arguments key
        ref: dynamo
        model_text: '<|python_tag|>{"name": "get_time"}'
        tools:
        - name: get_time
          parameters:
            type: object
            properties: {}
  TOOLCALLING.batch.7.yaml:
    family: llama3_json
    mode: batch
    cases:
      TOOLCALLING.batch.7.a:
        description: Standard scalar types
        ref: dynamo
        model_text: '<|python_tag|>{"name": "book_flight", "arguments": {"destination": "Paris", "passengers": 2, "first_class": true}}'
        tools:
        - name: book_flight
          parameters:
            type: object
            properties:
              destination:
                type: string
              passengers:
                type: integer
              first_class:
                type: boolean
      TOOLCALLING.batch.7.b:
        description: Unicode + escaped chars
        ref: originated from https://github.com/vllm-project/vllm/blob/b53c507bc91f87e28b03e9b54bbff7c76e97d58b/tests/tool_parsers/test_llama3_json_tool_parser.py#L217
        model_text: '<|python_tag|>{"name": "get_weather", "arguments": {"location": "Tōkyō \"central\""}}'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.7.c:
        description: Schema mismatch — string value where schema declares integer
        ref: dynamo
        model_text: '<|python_tag|>{"name": "set_temperature", "arguments": {"celsius": "20"}}'
        tools:
        - name: set_temperature
          parameters:
            type: object
            properties:
              celsius:
                type: integer
      TOOLCALLING.batch.7.d:
        description: Nested object + array
        ref: originated from https://github.com/vllm-project/vllm/blob/b53c507bc91f87e28b03e9b54bbff7c76e97d58b/tests/tool_parsers/test_llama3_json_tool_parser.py#L146
        model_text: '<|python_tag|>{"name": "process_data", "arguments": {"items": [1,2,3], "config": {"nested": true}}}'
        tools:
        - name: process_data
          parameters:
            type: object
            properties:
              items:
                type: array
              config:
                type: object
      TOOLCALLING.batch.7.e:
        description: Large / deep JSON-edge argument payload
        ref: dynamo
        model_text: '<|python_tag|>{"name": "process_data", "arguments": {"payload": {"regions": [{"name": "west", "scores": [1, 2, 3]}, {"name": "east", "scores": [4, 5, 6]}], "flags": {"enabled": true, "retry": null}, "empty": {}}}}'
        tools:
        - name: process_data
          parameters:
            type: object
            properties:
              payload:
                type: object
      TOOLCALLING.batch.7.f:
        description: Numeric precision edge preserves integer-like number literal
        ref: https://www.llama.com/docs/model-cards-and-prompt-formats/llama3_1/
        model_text: '<|python_tag|>{"name": "set_limit", "arguments": {"count": 9007199254740993}}'
        tools:
        - name: set_limit
          parameters:
            type: object
            properties:
              count:
                type: number
  TOOLCALLING.batch.8.yaml:
    family: llama3_json
    mode: batch
    cases:
      TOOLCALLING.batch.8.a:
        description: Narration before tool call only
        ref: dynamo
        model_text: 'I will check the weather. <|python_tag|>{"name": "get_weather", "arguments": {"location": "NYC"}}'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.8.b:
        description: Narration after tool call only
        ref: dynamo
        model_text: '<|python_tag|>{"name": "get_weather", "arguments": {"location": "NYC"}} Let me know if you need more.'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.8.c:
        description: Narration both before and after (sandwich)
        ref: originated from https://github.com/vllm-project/vllm/blob/b53c507bc91f87e28b03e9b54bbff7c76e97d58b/tests/tool_parsers/test_llama3_json_tool_parser.py#L128
        model_text: 'I will check the weather. <|python_tag|>{"name": "get_weather", "arguments": {"location": "NYC"}} Let me know if you need more.'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.8.d:
        description: Narration between multiple tool calls
        ref: dynamo
        model_text: 'I will check the weather. <|python_tag|>{"name": "get_weather", "arguments": {"location": "NYC"}} Then check LA weather. <|python_tag|>{"name": "get_weather", "arguments": {"location": "LA"}}'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
  TOOLCALLING.batch.yaml:
    family: llama3_json
    model_label: Llama 3 (JSON fmt)
    mode: batch
    cases:
      TOOLCALLING.batch.1:
        description: Single tool call (happy path)
        model_text: '<|python_tag|>{"name": "get_weather", "arguments": {"location": "NYC"}}'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.3:
        description: No tool call (plain text)
        model_text: Hello, how can I help you today?
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.9.a:
        description: Empty model text
        model_text: ''
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.9.b:
        description: Blank / whitespace-only model text
        ref: dynamo
        model_text: '   '
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.10:
        description: Duplicate calls (same name twice, semicolon-separated)
        model_text: '<|python_tag|>{"name": "get_weather", "arguments": {"location": "NYC"}};{"name": "get_weather", "arguments": {"location": "LA"}}'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.30.a:
        description: Llama JSON call separator `;` inside one argument string value
        ref: dynamo
        model_text: '<|python_tag|>{"name": "run_query", "arguments": {"sql": "SELECT a; SELECT b"}}'
        tools:
        - name: run_query
          parameters:
            type: object
            properties:
              sql:
                type: string
      TOOLCALLING.batch.30.b:
        description: JSON structural delimiters `}` and `]` inside one argument string value
        ref: dynamo
        model_text: '<|python_tag|>{"name": "run_query", "arguments": {"sql": "SELECT value WHERE note has brace } and bracket ]"}}'
        tools:
        - name: run_query
          parameters:
            type: object
            properties:
              sql:
                type: string
      TOOLCALLING.batch.30.c:
        description: Start marker `<|python_tag|>` text inside one argument string value
        ref: dynamo
        model_text: '<|python_tag|>{"name": "run_query", "arguments": {"sql": "literal <|python_tag marker|>{name:x} stays text"}}'
        tools:
        - name: run_query
          parameters:
            type: object
            properties:
              sql:
                type: string
      TOOLCALLING.batch.31.a:
        description: Multi-call Llama JSON response with call separator `;` inside the first argument string
        ref: dynamo
        model_text: '<|python_tag|>{"name": "run_query", "arguments": {"sql": "SELECT a; SELECT b"}};{"name": "get_time", "arguments": {"timezone": "EST"}}'
        tools:
        - name: run_query
          parameters:
            type: object
            properties:
              sql:
                type: string
        - name: get_time
          parameters:
            type: object
            properties:
              timezone:
                type: string
      TOOLCALLING.batch.31.b:
        description: Multi-call response with structural delimiters inside one argument string value
        ref: dynamo
        model_text: '<|python_tag|>{"name": "run_query", "arguments": {"sql": "SELECT value WHERE note has brace } and bracket ]"}};{"name": "get_time", "arguments": {"timezone": "EST"}}'
        tools:
        - name: run_query
          parameters:
            type: object
            properties:
              sql:
                type: string
        - name: get_time
          parameters:
            type: object
            properties:
              timezone:
                type: string
      TOOLCALLING.batch.13.a:
        description: Unknown-only call under default behavior
        ref: originated from https://github.com/sgl-project/sglang/blob/612785ffdcaf35552f1ed433a981d596ca9fe900/test/registered/unit/function_call/test_unknown_tool_name.py#L29
        model_text: '<|python_tag|>{"name": "unknown_tool", "arguments": {"location": "NYC"}}'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.13.c:
        description: Mixed known and unknown calls in one response
        ref: dynamo
        model_text: '<|python_tag|>{"name": "get_weather", "arguments": {"location": "NYC"}};{"name": "unknown_tool", "arguments": {"location": "LA"}}'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
  TOOLCALLING.stream.1.yaml:
    family: llama3_json
    model_label: Llama 3 (JSON fmt)
    mode: stream
    cases:
      TOOLCALLING.stream.1.a:
        description: Complete tool-call payload delivered in one content chunk
        ref: derived from TOOLCALLING.batch.1
        chunks:
        - delta_text: '<|python_tag|>{"name": "get_weather", "arguments": {"location": "NYC"}}'
        - delta_text: ''
          finish_reason: tool_calls
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.stream.1.b:
        description: Complete tool call split across parser-significant boundaries
        ref: derived from TOOLCALLING.batch.1
        chunks:
        - delta_text: <|python_tag|>
        - delta_text: '{"name": "get_weather", '
        - delta_text: '"arguments": {"location": "NYC"}}'
        - delta_text: ''
          finish_reason: tool_calls
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
  TOOLCALLING.stream.2.yaml:
    family: llama3_json
    model_label: Llama 3 (JSON fmt)
    mode: stream
    cases:
      TOOLCALLING.stream.2:
        description: Multiple tool calls split across multiple content chunks
        ref: derived from TOOLCALLING.batch.2.a
        chunks:
        - delta_text: <|python_
        - delta_text: tag|>{"
        - delta_text: 'name": "get_w'
        - delta_text: eathe
        - delta_text: 'r", "arguments": '
        - delta_text: '{"l'
        - delta_text: 'ocation":'
        - delta_text: ' "NYC"}'
        - delta_text: '};{"name": "g'
        - delta_text: et_ti
        - delta_text: 'me", "arguments":'
        - delta_text: ' {"'
        - delta_text: timezone"
        - delta_text: ': "EST"'
        - delta_text: '}}'
        - delta_text: ''
          finish_reason: tool_calls
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        - name: get_time
          parameters:
            type: object
            properties:
              timezone:
                type: string
  TOOLCALLING.stream.3.yaml:
    family: llama3_json
    model_label: Llama 3 (JSON fmt)
    mode: stream
    cases:
      TOOLCALLING.stream.3:
        description: Complete single tool call with a grammar token split across chunk boundaries
        ref: derived from TOOLCALLING.batch.1
        chunks:
        - delta_text: <|
        - delta_text: pyt
        - delta_text: hon_t
        - delta_text: ag|>{"name"
        - delta_text: ': "get_weather", "a'
        - delta_text: rg
        - delta_text: ume
        - delta_text: 'nts":'
        - delta_text: ' {"location'
        - delta_text: '": "NYC"}}'
        - delta_text: ''
          finish_reason: tool_calls
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
  TOOLCALLING.stream.4.yaml:
    family: llama3_json
    model_label: Llama 3 (JSON fmt)
    mode: stream
    cases:
      TOOLCALLING.stream.4.a:
        description: Truncated stream terminates after a complete in-flight tool-call body
        ref: derived from TOOLCALLING.batch.5.a
        chunks:
        - delta_text: '<|python_tag|>{"name": "get_weather", "arguments": {"location": "NYC"}'
        - delta_text: ''
          finish_reason: stop
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.stream.4.b:
        description: Stream terminates mid-call body before the in-flight argument payload is complete
        ref: derived from TOOLCALLING.batch.5.c
        chunks:
        - delta_text: '<|python_tag|>{"name": "get_'
        - delta_text: 'weather", "arguments": {"loc'
        - delta_text: ''
          finish_reason: stop
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.stream.4.c:
        description: Stream reaches length after a valid inner tool-call body without the required outer wrapper, followed by repeated close markers
        ref: derived from nemotron-ultra-preview-tool-call-leak-repro/repro_tool_call_leak.py
        chunks:
        - delta_text: '{"name": "get_weather", "arguments": {"location": "NYC"}}</|python_tag|></|python_tag|></|python_tag|>'
        - delta_text: ''
          finish_reason: length
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
