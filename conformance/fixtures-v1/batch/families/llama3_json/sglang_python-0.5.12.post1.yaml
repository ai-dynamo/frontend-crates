corpus: batch
family: llama3_json
capture: sglang_python-0.5.12.post1
documents:
  TOOLCALLING.batch.2.yaml:
    family: llama3_json
    mode: batch
    cases:
      TOOLCALLING.batch.2.a:
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_time
              arguments:
                timezone: EST
            normal_text: ''
      TOOLCALLING.batch.2.c:
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_time
              arguments:
                timezone: EST
            normal_text: 'Both: Done.'
            explanation: preserves trailing text after final parsed JSON object
      TOOLCALLING.batch.2.d:
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_weather
              arguments:
                location: LA
            normal_text: ''
  TOOLCALLING.batch.4.yaml:
    family: llama3_json
    mode: batch
    cases:
      TOOLCALLING.batch.4.a:
        expected:
          sglang_python:
            calls: []
            normal_text: nonsense
            explanation: impl-defined recovery contract; strips python_tag before returning malformed action text
      TOOLCALLING.batch.4.b:
        expected:
          sglang_python:
            calls: []
            normal_text: '{"name": "get_weather", "arguments": {"location": "NYC"'
            explanation: impl-defined recovery contract; strips python_tag before returning malformed action text
      TOOLCALLING.batch.4.c:
        expected:
          sglang_python:
            calls: []
            normal_text: ''
      TOOLCALLING.batch.4.e:
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments: {}
            normal_text: ''
            explanation: SGLang Llama32Detector scans past the malformed prefix and recovers the later valid JSON object.
  TOOLCALLING.batch.5.yaml:
    family: llama3_json
    mode: batch
    cases:
      TOOLCALLING.batch.5.a:
        expected:
          sglang_python:
            calls: []
            normal_text: '{"name": "get_weather", "arguments": {"location": "NYC"}'
            explanation: impl-defined recovery contract; strips python_tag before returning incomplete action text
      TOOLCALLING.batch.5.c:
        expected:
          sglang_python:
            calls: []
            normal_text: '{"name": "get_weather", "arguments": {"loc'
            explanation: impl-defined recovery contract; strips python_tag before returning incomplete action text
      TOOLCALLING.batch.5.d:
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: Boston
            normal_text: 'I''ll start by fetching the weather for both Boston and New York at the same time!{"name": "get_weather", "arguments": {"location": "New York"}'
            explanation: impl-defined recovery contract; strips python_tag and preserves malformed trailing JSON after first recovered call
      TOOLCALLING.batch.5.e:
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: Boston
            normal_text: 'I''ll start by fetching the weather for both Boston and New York at the same time!{"name": "get_weather", "arguments": {"location": "New York'
            explanation: impl-defined recovery contract; strips python_tag and preserves malformed trailing JSON after first recovered call
