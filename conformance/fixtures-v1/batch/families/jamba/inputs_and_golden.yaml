corpus: batch
family: jamba
capture: inputs
documents:
  TOOLCALLING.batch.2.yaml:
    family: jamba
    mode: batch
    cases:
      TOOLCALLING.batch.2.a:
        description: Parallel calls in JSON array
        ref: dynamo
        model_text: '<tool_calls>[{"name": "get_weather", "arguments": {"location": "NYC"}}, {"name": "get_time", "arguments": {"timezone": "EST"}}]</tool_calls>'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        - name: get_time
          parameters:
            type: object
            properties:
              timezone:
                type: string
      TOOLCALLING.batch.2.c:
        description: With surrounding narration
        ref: dynamo
        model_text: 'Both: <tool_calls>[{"name": "get_weather", "arguments": {"location": "NYC"}}, {"name": "get_time", "arguments": {"timezone": "EST"}}]</tool_calls> Done.'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        - name: get_time
          parameters:
            type: object
            properties:
              timezone:
                type: string
      TOOLCALLING.batch.2.d:
        description: Same-name twice
        ref: dynamo
        model_text: '<tool_calls>[{"name": "get_weather", "arguments": {"location": "NYC"}}, {"name": "get_weather", "arguments": {"location": "LA"}}]</tool_calls>'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.2.b:
        description: Two back-to-back fence pairs — not applicable to this family
        explanation: jamba's multi-call form is exercised by TOOLCALLING.batch.2.a / 2.c / 2.d; no back-to-back fence/wrapper pattern applies to this family's parser syntax.
  TOOLCALLING.batch.4.yaml:
    family: jamba
    mode: batch
    cases:
      TOOLCALLING.batch.4.a:
        description: Tool_calls wrapper with garbage
        ref: dynamo
        model_text: <tool_calls>nonsense</tool_calls>
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.4.b:
        description: Missing close brace in JSON
        ref: dynamo
        model_text: '<tool_calls>[{"name": "get_weather", "arguments": {"location": "NYC"]</tool_calls>'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.4.c:
        description: Missing name key
        ref: dynamo
        model_text: '<tool_calls>[{"arguments": {"location": "NYC"}}]</tool_calls>'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.4.d:
        description: Missing </tool_calls> close
        ref: dynamo
        model_text: '<tool_calls>[{"name": "get_weather", "arguments": {"location": "NYC"}}]'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.4.e:
        description: Malformed-prefix recovery — n/a for this family's syntax
        explanation: 'TOOLCALLING.batch.4.e is specific to llama3_json''s raw JSON-object scanner: a malformed JSON-looking prefix is followed by a complete JSON object, and the detector may resynchronize on the later object. This family uses a framed parser grammar instead of that raw JSON-prefix scanner; malformed-input coverage for this family lives in TOOLCALLING.batch.4.a through 4.d.'
      TOOLCALLING.batch.4.f:
        description: Tool-name XML tag case - n/a for this family's syntax
        explanation: TOOLCALLING.batch.4.f is specific to Qwen3-Coder XML syntax, where the model may emit a tool-name tag such as <terminal> inside <tool_call> instead of the required <function=Terminal> opener. This family does not use Qwen3-Coder's <function=...> opener.
  TOOLCALLING.batch.5.yaml:
    family: jamba
    mode: batch
    cases:
      TOOLCALLING.batch.5.a:
        description: Missing </tool_calls> end marker
        ref: dynamo
        model_text: '<tool_calls>[{"name": "get_weather", "arguments": {"location": "NYC"}}]'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.5.b:
        description: Closing </tool_calls> without matching <tool_calls> open
        ref: dynamo
        model_text: '[{"name": "get_weather", "arguments": {"location": "NYC"}}]</tool_calls>'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.5.c:
        description: Truncation mid-arguments JSON
        ref: dynamo
        model_text: '<tool_calls>[{"name": "get_weather", "arguments": {"loc'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.5.d:
        description: Multi-call, last call missing only end marker (body complete)
        ref: dynamo
        model_text: 'I''ll start by fetching the weather for both Boston and New York at the same time!<tool_calls>[{"name": "get_weather", "arguments": {"location": "Boston"}}, {"name": "get_weather", "arguments": {"location": "New York"}}]'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.5.e:
        description: Multi-call, last call truncated mid-arg-value
        ref: dynamo
        model_text: 'I''ll start by fetching the weather for both Boston and New York at the same time!<tool_calls>[{"name": "get_weather", "arguments": {"location": "Boston"}}, {"name": "get_weather", "arguments": {"location": "New York'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
  TOOLCALLING.batch.6.yaml:
    family: jamba
    mode: batch
    cases:
      TOOLCALLING.batch.6.a:
        description: 'Canonical "arguments": {}'
        ref: dynamo
        model_text: '<tool_calls>[{"name": "get_time", "arguments": {}}]</tool_calls>'
        tools:
        - name: get_time
          parameters:
            type: object
            properties: {}
      TOOLCALLING.batch.6.b:
        description: Whitespace inside arguments {}
        ref: dynamo
        model_text: '<tool_calls>[{"name": "get_time", "arguments": { }}]</tool_calls>'
        tools:
        - name: get_time
          parameters:
            type: object
            properties: {}
      TOOLCALLING.batch.6.c:
        description: No arguments key
        ref: dynamo
        model_text: '<tool_calls>[{"name": "get_time"}]</tool_calls>'
        tools:
        - name: get_time
          parameters:
            type: object
            properties: {}
  TOOLCALLING.batch.7.yaml:
    family: jamba
    mode: batch
    cases:
      TOOLCALLING.batch.7.a:
        description: Standard scalar types
        ref: dynamo
        model_text: '<tool_calls>[{"name": "book_flight", "arguments": {"destination": "Paris", "passengers": 2, "first_class": true}}]</tool_calls>'
        tools:
        - name: book_flight
          parameters:
            type: object
            properties:
              destination:
                type: string
              passengers:
                type: integer
              first_class:
                type: boolean
      TOOLCALLING.batch.7.b:
        description: Unicode + escaped chars
        ref: dynamo
        model_text: '<tool_calls>[{"name": "get_weather", "arguments": {"location": "Tōkyō \"central\""}}]</tool_calls>'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.7.c:
        description: Schema mismatch — string value where schema declares integer
        ref: dynamo
        model_text: '<tool_calls>[{"name": "set_temperature", "arguments": {"celsius": "20"}}]</tool_calls>'
        tools:
        - name: set_temperature
          parameters:
            type: object
            properties:
              celsius:
                type: integer
      TOOLCALLING.batch.7.d:
        description: Nested object + array
        ref: dynamo
        model_text: '<tool_calls>[{"name": "process_data", "arguments": {"items": [1,2,3], "config": {"nested": true}}}]</tool_calls>'
        tools:
        - name: process_data
          parameters:
            type: object
            properties:
              items:
                type: array
              config:
                type: object
      TOOLCALLING.batch.7.e:
        description: Large / deep JSON-edge argument payload
        ref: dynamo
        model_text: '<tool_calls>[{"name": "process_data", "arguments": {"payload": {"regions": [{"name": "west", "scores": [1, 2, 3]}, {"name": "east", "scores": [4, 5, 6]}], "flags": {"enabled": true, "retry": null}, "empty": {}}}}]</tool_calls>'
        tools:
        - name: process_data
          parameters:
            type: object
            properties:
              payload:
                type: object
      TOOLCALLING.batch.7.f:
        description: Numeric precision edge preserves integer-like number literal
        ref: https://huggingface.co/ai21labs/Jamba-tiny-dev/blob/main/tokenizer_config.json
        model_text: '<tool_calls>[{"name": "set_limit", "arguments": {"count": 9007199254740993}}]</tool_calls>'
        tools:
        - name: set_limit
          parameters:
            type: object
            properties:
              count:
                type: number
  TOOLCALLING.batch.8.yaml:
    family: jamba
    mode: batch
    cases:
      TOOLCALLING.batch.8.a:
        description: Narration before tool call only
        ref: dynamo
        model_text: 'I will check the weather. <tool_calls>[{"name": "get_weather", "arguments": {"location": "NYC"}}]</tool_calls>'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.8.b:
        description: Narration after tool call only
        ref: dynamo
        model_text: '<tool_calls>[{"name": "get_weather", "arguments": {"location": "NYC"}}]</tool_calls> Let me know if you need more.'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.8.c:
        description: Narration both before and after (sandwich)
        ref: dynamo
        model_text: 'I will check the weather. <tool_calls>[{"name": "get_weather", "arguments": {"location": "NYC"}}]</tool_calls> Let me know if you need more.'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.8.d:
        description: Narration between multiple tool calls
        ref: dynamo
        model_text: 'I will check the weather. <tool_calls>[{"name": "get_weather", "arguments": {"location": "NYC"}}]</tool_calls> Then check LA weather. <tool_calls>[{"name": "get_weather", "arguments": {"location": "LA"}}]</tool_calls>'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
  TOOLCALLING.batch.yaml:
    family: jamba
    model_label: AI21 Jamba
    mode: batch
    cases:
      TOOLCALLING.batch.1:
        description: Single tool call (happy path)
        model_text: '<tool_calls>[{"name": "get_weather", "arguments": {"location": "NYC"}}]</tool_calls>'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.3:
        description: No tool call (plain text)
        model_text: Hello, how can I help you today?
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.9.a:
        description: Empty model text
        model_text: ''
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.9.b:
        description: Blank / whitespace-only model text
        ref: dynamo
        model_text: '   '
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.10:
        description: Duplicate calls (same name twice)
        model_text: '<tool_calls>[{"name": "get_weather", "arguments": {"location": "NYC"}}, {"name": "get_weather", "arguments": {"location": "LA"}}]</tool_calls>'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.30.a:
        description: JSON-array call separator `,` inside one argument string value
        model_text: '<tool_calls>[{"name": "run_query", "arguments": {"sql": "SELECT a, SELECT b"}}]</tool_calls>'
        tools:
        - name: run_query
          parameters:
            type: object
            properties:
              sql:
                type: string
      TOOLCALLING.batch.30.b:
        description: JSON structural delimiters `}` and `]` inside one argument string value
        ref: dynamo
        model_text: '<tool_calls>[{"name": "run_query", "arguments": {"sql": "SELECT value WHERE note has brace } and bracket ]"}}]</tool_calls>'
        tools:
        - name: run_query
          parameters:
            type: object
            properties:
              sql:
                type: string
      TOOLCALLING.batch.30.c:
        description: XML wrapper marker `<tool_calls>...</tool_calls>` text inside one argument string value
        ref: dynamo
        model_text: '<tool_calls>[{"name": "run_query", "arguments": {"sql": "literal <tool_calls marker>[]</tool_calls marker> stays text"}}]</tool_calls>'
        tools:
        - name: run_query
          parameters:
            type: object
            properties:
              sql:
                type: string
      TOOLCALLING.batch.31.a:
        description: Multi-call JSON array with call separator `,` inside the first argument string
        model_text: '<tool_calls>[{"name": "run_query", "arguments": {"sql": "SELECT a, SELECT b"}}, {"name": "get_time", "arguments": {"timezone": "EST"}}]</tool_calls>'
        tools:
        - name: run_query
          parameters:
            type: object
            properties:
              sql:
                type: string
        - name: get_time
          parameters:
            type: object
            properties:
              timezone:
                type: string
      TOOLCALLING.batch.31.b:
        description: Multi-call response with structural delimiters inside one argument string value
        ref: dynamo
        model_text: '<tool_calls>[{"name": "run_query", "arguments": {"sql": "SELECT value WHERE note has brace } and bracket ]"}}, {"name": "get_time", "arguments": {"timezone": "EST"}}]</tool_calls>'
        tools:
        - name: run_query
          parameters:
            type: object
            properties:
              sql:
                type: string
        - name: get_time
          parameters:
            type: object
            properties:
              timezone:
                type: string
      TOOLCALLING.batch.13.a:
        description: Unknown-only call under default behavior
        model_text: '<tool_calls>[{"name": "unknown_tool", "arguments": {"location": "NYC"}}]</tool_calls>'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.13.c:
        description: Mixed known and unknown calls in one response
        ref: dynamo
        model_text: '<tool_calls>[{"name": "get_weather", "arguments": {"location": "NYC"}}, {"name": "unknown_tool", "arguments": {"location": "LA"}}]</tool_calls>'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
  TOOLCALLING.stream.1.yaml:
    family: jamba
    model_label: AI21 Jamba
    mode: stream
    cases:
      TOOLCALLING.stream.1.a:
        description: Complete tool-call payload delivered in one content chunk
        ref: derived from TOOLCALLING.batch.1
        chunks:
        - delta_text: '<tool_calls>[{"name": "get_weather", "arguments": {"location": "NYC"}}]</tool_calls>'
        - delta_text: ''
          finish_reason: tool_calls
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.stream.1.b:
        description: Complete tool call split across parser-significant boundaries
        ref: derived from TOOLCALLING.batch.1
        chunks:
        - delta_text: <tool_calls>
        - delta_text: '[{"name": "get_weather", '
        - delta_text: '"arguments": {"location": "NYC"}}]'
        - delta_text: </tool_calls>
        - delta_text: ''
          finish_reason: tool_calls
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
  TOOLCALLING.stream.2.yaml:
    family: jamba
    model_label: AI21 Jamba
    mode: stream
    cases:
      TOOLCALLING.stream.2:
        description: Multiple tool calls split across multiple content chunks
        ref: derived from TOOLCALLING.batch.2.a
        chunks:
        - delta_text: <tool_cal
        - delta_text: ls>[{"n
        - delta_text: 'ame": "get_we'
        - delta_text: ather
        - delta_text: '", "arguments": {'
        - delta_text: '"lo'
        - delta_text: 'cation": '
        - delta_text: '"NYC"}}'
        - delta_text: ', {"name": "g'
        - delta_text: et_ti
        - delta_text: 'me", "arguments":'
        - delta_text: ' {"'
        - delta_text: timezone"
        - delta_text: ': "EST"'
        - delta_text: '}}]</tool_cal'
        - delta_text: ls>
        - delta_text: ''
          finish_reason: tool_calls
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        - name: get_time
          parameters:
            type: object
            properties:
              timezone:
                type: string
  TOOLCALLING.stream.3.yaml:
    family: jamba
    model_label: AI21 Jamba
    mode: stream
    cases:
      TOOLCALLING.stream.3:
        description: Complete single tool call with a grammar token split across chunk boundaries
        ref: derived from TOOLCALLING.batch.1
        chunks:
        - delta_text: <t
        - delta_text: ool
        - delta_text: _call
        - delta_text: 's>[{"name":'
        - delta_text: ' "get_weather", "ar'
        - delta_text: gu
        - delta_text: men
        - delta_text: 'ts": '
        - delta_text: '{"location"'
        - delta_text: ': "NYC"}}]</tool_ca'
        - delta_text: ll
        - delta_text: s>
        - delta_text: ''
          finish_reason: tool_calls
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
  TOOLCALLING.stream.4.yaml:
    family: jamba
    model_label: AI21 Jamba
    mode: stream
    cases:
      TOOLCALLING.stream.4.a:
        description: Truncated stream terminates after a complete in-flight tool-call body
        ref: derived from TOOLCALLING.batch.5.a
        chunks:
        - delta_text: '<tool_calls>[{"name": "get_weather", "arguments": {"location": "NYC"}}]'
        - delta_text: ''
          finish_reason: stop
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.stream.4.b:
        description: Stream terminates mid-call body before the in-flight argument payload is complete
        ref: derived from TOOLCALLING.batch.5.c
        chunks:
        - delta_text: '<tool_calls>[{"name": "get_'
        - delta_text: 'weather", "arguments": {"loc'
        - delta_text: ''
          finish_reason: stop
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.stream.4.c:
        description: Stream reaches length after a valid inner tool-call body without the required outer wrapper, followed by repeated close markers
        ref: derived from nemotron-ultra-preview-tool-call-leak-repro/repro_tool_call_leak.py
        chunks:
        - delta_text: '[{"name": "get_weather", "arguments": {"location": "NYC"}}]</tool_calls></tool_calls></tool_calls>'
        - delta_text: ''
          finish_reason: length
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
