      TOOLCALLING.stream.4.b:
        expected:
          vllm_python:
            explanation: vLLM emits the call with empty arguments on mid-body truncation; Dynamo's streaming jail suppresses the truncated <tool_calls> wrapper, emitting no call and no markup (aligned by ai-dynamo/dynamo#10847).
            calls:
            - name: get_weather
              arguments: {}
            normal_text: ''
      TOOLCALLING.stream.4.c:
        expected:
          vllm_python:
            explanation: vLLM's streaming jamba detector leaves the orphan </tool_calls> close markers in normal_text. Dynamo's streaming jail strips every </tool_calls> occurrence and keeps the inner JSON body (aligned by ai-dynamo/dynamo#10847).
            calls: []
            normal_text: '[{"name": "get_weather", "arguments": {"location": "NYC"}}]</tool_calls></tool_calls></tool_calls>'
