corpus: batch
family: jamba
capture: vllm_python-0.23.0
documents:
  TOOLCALLING.batch.2.yaml:
    family: jamba
    mode: batch
    cases:
      TOOLCALLING.batch.2.a:
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_time
              arguments:
                timezone: EST
            normal_text: ''
      TOOLCALLING.batch.2.c:
        expected:
          vllm_python:
            explanation: 'Cosmetic whitespace only: Dynamo trims the single space between the leading narration and the <tool_calls> fence; vLLM preserves it. Calls are identical.'
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_time
              arguments:
                timezone: EST
            normal_text: 'Both: '
      TOOLCALLING.batch.2.d:
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_weather
              arguments:
                location: LA
            normal_text: ''
  TOOLCALLING.batch.4.yaml:
    family: jamba
    mode: batch
    cases:
      TOOLCALLING.batch.4.a:
        expected:
          vllm_python:
            explanation: vLLM's jamba detector leaves the raw <tool_calls> envelope in normal_text when the wrapped payload is not a valid JSON array. Dynamo discards the unparseable wrapper (discard_unparseable_wrapper) so no tool-call markup reaches the user.
            calls: []
            normal_text: <tool_calls>nonsense</tool_calls>
      TOOLCALLING.batch.4.b:
        expected:
          vllm_python:
            explanation: vLLM's jamba detector leaves the raw <tool_calls> envelope in normal_text when the JSON body is malformed (missing close brace). Dynamo discards the unparseable wrapper so no tool-call markup reaches the user.
            calls: []
            normal_text: '<tool_calls>[{"name": "get_weather", "arguments": {"location": "NYC"]</tool_calls>'
      TOOLCALLING.batch.4.c:
        expected:
          vllm_python:
            explanation: vLLM's jamba detector leaves the raw <tool_calls> envelope in normal_text when no call carries a name key. Dynamo discards it so no tool-call markup reaches the user.
            calls: []
            normal_text: '<tool_calls>[{"arguments": {"location": "NYC"}}]</tool_calls>'
      TOOLCALLING.batch.4.d:
        expected:
          vllm_python:
            explanation: vLLM's jamba detector requires the closing </tool_calls> marker and leaves the unterminated wrapper in normal_text. Dynamo recovers the complete call body (strip_markup_on_recovery) and emits no markup.
            calls: []
            normal_text: '<tool_calls>[{"name": "get_weather", "arguments": {"location": "NYC"}}]'
  TOOLCALLING.batch.5.yaml:
