  TOOLCALLING.stream.4.yaml:
    family: jamba
    mode: stream
    cases:
      TOOLCALLING.stream.4.a:
        expected:
          vllm_python:
            explanation: vLLM's streaming jamba detector drops the arguments to an empty object on a truncated (finish_reason=stop) stream. Dynamo's streaming jail recovers the complete in-flight call body with full arguments.
            calls:
