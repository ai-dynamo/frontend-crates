corpus: batch
family: mistral
capture: vllm_python-0.23.0
documents:
  TOOLCALLING.batch.2.yaml:
    family: mistral
    mode: batch
    cases:
      TOOLCALLING.batch.2.a:
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_time
              arguments:
                timezone: EST
            normal_text: ''
      TOOLCALLING.batch.2.c:
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_time
              arguments:
                timezone: EST
            normal_text: 'Both: '
      TOOLCALLING.batch.2.d:
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_weather
              arguments:
                location: LA
            normal_text: ''
  TOOLCALLING.batch.4.yaml:
    family: mistral
    mode: batch
    cases:
      TOOLCALLING.batch.4.a:
        expected:
          vllm_python:
            calls: []
            normal_text: nonsense[/TOOL_CALLS]
            explanation: vLLM's mistral parser splits only on the [TOOL_CALLS] opener and has no [/TOOL_CALLS] concept; on a malformed body its pre-v11 path returns the raw post-opener text as content, leaking the [/TOOL_CALLS] close marker. Dynamo strips the wrapper markers on malformed recovery so nothing leaks (TOOLCALLING.batch.4 impl-defined recovery).
      TOOLCALLING.batch.4.b:
        expected:
          vllm_python:
            calls: []
            normal_text: '[{"name": "get_weather", "arguments": {"location": "NYC"][/TOOL_CALLS]'
            explanation: vLLM splits on the [TOOL_CALLS] opener and, when the JSON body fails both raw_decode and the array-regex fallback, returns the raw post-opener text as content, leaking the body and the [/TOOL_CALLS] close marker. Dynamo strips the wrapper markers on malformed recovery so nothing leaks (TOOLCALLING.batch.4 impl-defined recovery).
      TOOLCALLING.batch.4.c:
        expected:
          vllm_python:
            error: 'KeyError: ''name'''
            explanation: vLLM mistral_tool_parser raises KeyError when 'name' key is missing
      TOOLCALLING.batch.4.d:
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: ''
  TOOLCALLING.batch.5.yaml:
    family: mistral
    mode: batch
    cases:
      TOOLCALLING.batch.5.a:
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: ''
      TOOLCALLING.batch.5.b:
        expected:
          vllm_python:
            calls: []
            normal_text: '[{"name": "get_weather", "arguments": {"location": "NYC"}}][/TOOL_CALLS]'
            explanation: vLLM requires the [TOOL_CALLS] opener; with only an orphan [/TOOL_CALLS] close it treats the whole string as content and emits no call. Dynamo strips the orphan close marker and recovers the complete call body without leaking markup (TOOLCALLING.batch.5 impl-defined recovery).
      TOOLCALLING.batch.5.c:
        expected:
          vllm_python:
            calls: []
            normal_text: '[{"name": "get_weather", "arguments": {"loc'
            explanation: vLLM leaves the truncated post-marker JSON body in content; Dynamo suppresses the unterminated [TOOL_CALLS] call and emits empty content.
      TOOLCALLING.batch.5.d:
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: Boston
            - name: get_weather
              arguments:
                location: New York
            normal_text: I'll start by fetching the weather for both Boston and New York at the same time!
      TOOLCALLING.batch.5.e:
        expected:
          vllm_python:
            calls: []
            normal_text: '[{"name": "get_weather", "arguments": {"location": "Boston"}}, {"name": "get_weather", "arguments": {"location": "New York'
            explanation: vLLM leaves the raw truncated body in content; Dynamo recovers the complete leading call (Boston) and drops the truncated trailing call without fabricating it.
  TOOLCALLING.batch.6.yaml:
    family: mistral
    mode: batch
    cases:
      TOOLCALLING.batch.6.a:
        expected:
          vllm_python:
            calls:
            - name: get_time
              arguments: {}
            normal_text: ''
      TOOLCALLING.batch.6.b:
        expected:
          vllm_python:
            calls:
            - name: get_time
              arguments: {}
            normal_text: ''
      TOOLCALLING.batch.6.c:
        expected:
          vllm_python:
            calls:
            - name: get_time
              arguments: {}
            normal_text: ''
            explanation: vLLM's mistral_tool_parser fabricates an empty arguments object {} when the 'arguments' key is absent; Dynamo and SGLang drop the call because the required key is missing
  TOOLCALLING.batch.7.yaml:
    family: mistral
    mode: batch
    cases:
      TOOLCALLING.batch.7.a:
        expected:
          vllm_python:
            calls:
            - name: book_flight
              arguments:
                destination: Paris
                first_class: true
                passengers: 2
            normal_text: ''
      TOOLCALLING.batch.7.b:
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: Tōkyō "central"
            normal_text: ''
      TOOLCALLING.batch.7.c:
        expected:
          vllm_python:
            calls:
            - name: set_temperature
              arguments:
                celsius: '20'
            normal_text: ''
      TOOLCALLING.batch.7.d:
        expected:
          vllm_python:
            calls:
            - name: process_data
              arguments:
                items:
                - 1
                - 2
                - 3
                config:
                  nested: true
            normal_text: ''
      TOOLCALLING.batch.7.e:
        expected:
          vllm_python:
            calls:
            - name: process_data
              arguments:
                payload:
                  regions:
                  - name: west
                    scores:
                    - 1
                    - 2
                    - 3
                  - name: east
                    scores:
                    - 4
                    - 5
                    - 6
                  flags:
                    enabled: true
