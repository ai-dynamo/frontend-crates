            normal_text: ''
      TOOLCALLING.batch.30.c:
        expected:
          vllm_python:
            calls:
            - name: run_query
              arguments:
                sql: literal [TOOL_CALLS marker][][/TOOL_CALLS marker] stays text
            normal_text: ''
      TOOLCALLING.batch.31.a:
        expected:
          vllm_python:
            calls:
            - name: run_query
              arguments:
                sql: SELECT a, SELECT b
            - name: get_time
              arguments:
