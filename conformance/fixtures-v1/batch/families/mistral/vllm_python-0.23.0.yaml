      TOOLCALLING.batch.7.f:
        expected:
          vllm_python:
            calls:
            - name: set_limit
              arguments:
                count: 9007199254740993
            normal_text: ''
  TOOLCALLING.batch.8.yaml:
    family: mistral
    mode: batch
    cases:
      TOOLCALLING.batch.8.a:
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: 'I will check the weather. '
      TOOLCALLING.batch.8.b:
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: ''
      TOOLCALLING.batch.8.c:
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: 'I will check the weather. '
      TOOLCALLING.batch.8.d:
        expected:
          vllm_python:
            error: 'ValueError: Only one BOT token should have been outputted'
            explanation: vLLM mistral_tool_parser raises ValueError on two consecutive [TOOL_CALLS] envelopes
  TOOLCALLING.batch.yaml:
    family: mistral
