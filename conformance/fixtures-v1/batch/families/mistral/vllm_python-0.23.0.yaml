            normal_text: ''
      TOOLCALLING.batch.13.a:
        expected:
          vllm_python:
            calls:
            - name: unknown_tool
              arguments:
                location: NYC
            normal_text: ''
      TOOLCALLING.batch.13.c:
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: unknown_tool
              arguments:
                location: LA
            normal_text: ''
  TOOLCALLING.stream.1.yaml:
    family: mistral
    mode: stream
    cases:
      TOOLCALLING.stream.1.a:
        expected:
          vllm_python:
            calls: []
            normal_text: ''
            explanation: vLLM's streaming Mistral parser (pre-v11 ijson path) emits no call when the entire [TOOL_CALLS] payload arrives in one chunk via the parity harness (no incremental delta_token_ids to drive its coroutine); Dynamo buffers and recovers the call.
      TOOLCALLING.stream.1.b:
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: '[/TOOL_CALLS]'
            explanation: vLLM's streaming Mistral parser leaks the trailing [/TOOL_CALLS] close marker into content; Dynamo now keeps the jail open until the marker arrives and consumes it, so normal_text is empty.
  TOOLCALLING.stream.2.yaml:
    family: mistral
    mode: stream
    cases:
      TOOLCALLING.stream.2:
        expected:
          vllm_python:
            calls: []
            normal_text: '[TOOL_CAL'
            explanation: vLLM leaks the partial start marker prefix into content when [TOOL_CALLS] is split across chunks and emits no call; Dynamo buffers the marker fragments and recovers the calls with empty normal_text.
  TOOLCALLING.stream.3.yaml:
    family: mistral
    mode: stream
    cases:
      TOOLCALLING.stream.3:
        expected:
          vllm_python:
            calls: []
            normal_text: '[TOOL_CALL'
            explanation: vLLM leaks the partial start marker prefix into content when [TOOL_CALLS] is split across chunks and emits no call; Dynamo buffers the marker fragments and recovers the call with empty normal_text.
  TOOLCALLING.stream.4.yaml:
    family: mistral
    mode: stream
    cases:
      TOOLCALLING.stream.4.a:
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: ''
      TOOLCALLING.stream.4.b:
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments: '{"loc'
            normal_text: ''
            explanation: vLLM emits a malformed partial call with the incomplete argument fragment as arguments; Dynamo suppresses the unterminated call and emits empty content.
      TOOLCALLING.stream.4.c:
        expected:
          vllm_python:
            calls: []
            normal_text: '[{"name": "get_weather", "arguments": {"location": "NYC"}}][/TOOL_CALLS][/TOOL_CALLS][/TOOL_CALLS]'
            explanation: vLLM streaming sees no [TOOL_CALLS] opener in the chunk, so it emits the whole string as content with no call, leaking the orphan [/TOOL_CALLS] markers verbatim. Dynamo strips the orphan close markers at the confirmed end token and recovers the complete call body without leaking markup.
