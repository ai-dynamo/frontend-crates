corpus: batch
family: gemma4
capture: inputs
documents:
  TOOLCALLING.batch.2.yaml:
    family: gemma4
    mode: batch
    cases:
      TOOLCALLING.batch.2.a:
        description: Parallel calls (back-to-back sentinels)
        ref: originated from https://github.com/vllm-project/vllm/blob/b53c507bc91f87e28b03e9b54bbff7c76e97d58b/tests/tool_parsers/test_gemma4_tool_parser.py#L207
        model_text: <|tool_call>call:get_weather{location:<|"|>NYC<|"|>}<tool_call|><|tool_call>call:get_time{timezone:<|"|>EST<|"|>}<tool_call|>
        tools:
        - &id001
          name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        - &id002
          name: get_time
          parameters:
            type: object
            properties:
              timezone:
                type: string
      TOOLCALLING.batch.2.c:
        description: With surrounding narration
        ref: dynamo
        model_text: 'Both: <|tool_call>call:get_weather{location:<|"|>NYC<|"|>}<tool_call|><|tool_call>call:get_time{timezone:<|"|>EST<|"|>}<tool_call|> Done.'
        tools:
        - *id001
        - *id002
      TOOLCALLING.batch.2.d:
        description: Same-name twice
        ref: dynamo
        model_text: <|tool_call>call:get_weather{location:<|"|>NYC<|"|>}<tool_call|><|tool_call>call:get_weather{location:<|"|>LA<|"|>}<tool_call|>
        tools:
        - *id001
        - *id001
      TOOLCALLING.batch.2.b:
        description: Two back-to-back fence pairs — not applicable to this family
        explanation: gemma4's multi-call form is exercised by TOOLCALLING.batch.2.a / 2.c / 2.d; no back-to-back fence/wrapper pattern applies to this family's parser syntax.
  TOOLCALLING.batch.4.yaml:
    family: gemma4
    mode: batch
    cases:
      TOOLCALLING.batch.4.a:
        description: Sentinel pair with garbage
        ref: dynamo
        model_text: <|tool_call>nonsense<tool_call|>
        tools:
        - &id003
          name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.4.b:
        description: Missing close brace in body
        ref: originated from https://github.com/vllm-project/vllm/blob/b53c507bc91f87e28b03e9b54bbff7c76e97d58b/tests/tool_parsers/test_gemma4_tool_parser.py#L572
        model_text: <|tool_call>call:get_weather{location:<|"|>NYC<|"|><tool_call|>
        tools:
        - *id003
      TOOLCALLING.batch.4.c:
        description: No call:name prefix
        ref: dynamo
        model_text: <|tool_call>{location:<|"|>NYC<|"|>}<tool_call|>
        tools:
        - *id003
      TOOLCALLING.batch.4.d:
        description: Mismatched sentinels
        ref: dynamo
        model_text: <|tool_call>call:get_weather{location:<|"|>NYC<|"|>}</tool_call>
        tools:
        - *id003
      TOOLCALLING.batch.4.e:
        description: Malformed-prefix recovery — n/a for this family's syntax
        explanation: 'TOOLCALLING.batch.4.e is specific to llama3_json''s raw JSON-object scanner: a malformed JSON-looking prefix is followed by a complete JSON object, and the detector may resynchronize on the later object. This family uses a framed parser grammar instead of that raw JSON-prefix scanner; malformed-input coverage for this family lives in TOOLCALLING.batch.4.a through 4.d.'
      TOOLCALLING.batch.4.f:
        description: Tool-name XML tag case - n/a for this family's syntax
        explanation: TOOLCALLING.batch.4.f is specific to Qwen3-Coder XML syntax, where the model may emit a tool-name tag such as <terminal> inside <tool_call> instead of the required <function=Terminal> opener. This family does not use Qwen3-Coder's <function=...> opener.
  TOOLCALLING.batch.5.yaml:
    family: gemma4
    mode: batch
    cases:
      TOOLCALLING.batch.5.a:
        description: Missing <tool_call|> end marker
        ref: dynamo
        model_text: <|tool_call>call:get_weather{location:<|"|>NYC<|"|>}
        tools:
        - &id004
          name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.5.b:
        description: Closing <tool_call|> without matching <|tool_call> open
        ref: dynamo
        model_text: call:get_weather{location:<|"|>NYC<|"|>}<tool_call|>
        tools:
        - *id004
      TOOLCALLING.batch.5.c:
        description: Truncation mid-argument value
        ref: dynamo
        model_text: <|tool_call>call:get_weather{location:<|"|>N
        tools:
        - *id004
      TOOLCALLING.batch.5.d:
        description: Multi-call, last call missing only end marker (body complete)
        ref: dynamo
        model_text: I'll start by fetching the weather for both Boston and New York at the same time!<|tool_call>call:get_weather{location:<|"|>Boston<|"|>}<tool_call|><|tool_call>call:get_weather{location:<|"|>New York<|"|>}
        tools:
        - *id004
      TOOLCALLING.batch.5.e:
        description: Multi-call, last call truncated mid-arg-value
        ref: dynamo
        model_text: I'll start by fetching the weather for both Boston and New York at the same time!<|tool_call>call:get_weather{location:<|"|>Boston<|"|>}<tool_call|><|tool_call>call:get_weather{location:<|"|>New York
        tools:
        - *id004
      TOOLCALLING.batch.5.f:
        description: Bare valid call before a complete wrapped call
        ref: dynamo
        model_text: call:get_weather{location:<|"|>NYC<|"|>}<tool_call|><|tool_call>call:get_weather{location:<|"|>Boston<|"|>}<tool_call|>
        tools:
        - *id004
      TOOLCALLING.batch.5.g:
        description: Closing <tool_call|> without matching <|tool_call> open after prefix prose
        ref: dynamo
        model_text: I will check that. call:get_weather{location:<|"|>NYC<|"|>}<tool_call|>
        tools:
        - *id004
  TOOLCALLING.batch.6.yaml:
    family: gemma4
    mode: batch
    cases:
      TOOLCALLING.batch.6.a:
        description: Canonical empty {} body
        ref: originated from https://github.com/vllm-project/vllm/blob/b53c507bc91f87e28b03e9b54bbff7c76e97d58b/tests/tool_parsers/test_gemma4_tool_parser.py#L560
        model_text: <|tool_call>call:get_time{}<tool_call|>
        tools:
        - &id005
          name: get_time
          parameters:
            type: object
            properties: {}
      TOOLCALLING.batch.6.b:
        description: Whitespace inside empty {}
        ref: dynamo
        model_text: <|tool_call>call:get_time{ }<tool_call|>
        tools:
        - *id005
      TOOLCALLING.batch.6.c:
        description: No body (just call:name)
        ref: originated from https://github.com/vllm-project/vllm/blob/b53c507bc91f87e28b03e9b54bbff7c76e97d58b/tests/tool_parsers/test_gemma4_tool_parser.py#L280
        model_text: <|tool_call>call:get_time<tool_call|>
        tools:
        - *id005
  TOOLCALLING.batch.7.yaml:
    family: gemma4
    mode: batch
    cases:
      TOOLCALLING.batch.7.a:
        description: Standard scalar types
        ref: originated from https://github.com/vllm-project/vllm/blob/b53c507bc91f87e28b03e9b54bbff7c76e97d58b/tests/tool_parsers/test_gemma4_tool_parser.py#L236
        model_text: <|tool_call>call:book_flight{destination:<|"|>Paris<|"|>,passengers:2,first_class:true}<tool_call|>
        tools:
        - name: book_flight
          parameters:
            type: object
            properties:
              destination:
                type: string
              passengers:
                type: integer
              first_class:
                type: boolean
      TOOLCALLING.batch.7.b:
        description: Unicode in value
        ref: originated from https://github.com/vllm-project/vllm/blob/b53c507bc91f87e28b03e9b54bbff7c76e97d58b/tests/tool_parsers/test_gemma4_tool_parser.py#L630
        model_text: <|tool_call>call:get_weather{location:<|"|>Tōkyō central<|"|>}<tool_call|>
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.7.c:
        description: Schema mismatch — string value where schema declares integer
        ref: dynamo
        model_text: <|tool_call>call:set_temperature{celsius:<|"|>20<|"|>}<tool_call|>
        tools:
        - name: set_temperature
          parameters:
            type: object
            properties:
              celsius:
                type: integer
      TOOLCALLING.batch.7.d:
        description: Nested object + array (existing)
        ref: originated from https://github.com/vllm-project/vllm/blob/b53c507bc91f87e28b03e9b54bbff7c76e97d58b/tests/tool_parsers/test_gemma4_tool_parser.py#L179
        model_text: <|tool_call>call:process_data{items:[1,2,3],config:{nested:true}}<tool_call|>
        tools:
        - name: process_data
          parameters:
            type: object
            properties:
              items:
                type: array
              config:
                type: object
      TOOLCALLING.batch.7.e:
        description: Large / deep JSON-edge argument payload
        ref: dynamo
        model_text: <|tool_call>call:process_data{payload:{regions:[{name:<|"|>west<|"|>,scores:[1,2,3]},{name:<|"|>east<|"|>,scores:[4,5,6]}],flags:{enabled:true,retry:null},empty:{}}}<tool_call|>
        tools:
        - name: process_data
          parameters:
            type: object
            properties:
              payload:
                type: object
      TOOLCALLING.batch.7.f:
        description: Numeric precision edge preserves integer-like number literal
        ref: inferhub live capture on nvidia/google/gemma-4-31b-it
        model_text: <|tool_call>call:set_limit{count:9007199254740993}<tool_call|>
        tools:
        - name: set_limit
          parameters:
            type: object
            properties:
              count:
                type: number
  TOOLCALLING.batch.8.yaml:
    family: gemma4
    mode: batch
    cases:
      TOOLCALLING.batch.8.a:
        description: Narration before tool call only
        ref: originated from https://github.com/vllm-project/vllm/blob/b53c507bc91f87e28b03e9b54bbff7c76e97d58b/tests/tool_parsers/test_gemma4_tool_parser.py#L194
        model_text: I will check the weather. <|tool_call>call:get_weather{location:<|"|>NYC<|"|>}<tool_call|>
        tools:
        - &id006
          name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.8.b:
        description: Narration after tool call only
        ref: dynamo
        model_text: <|tool_call>call:get_weather{location:<|"|>NYC<|"|>}<tool_call|> Let me know if you need more.
        tools:
        - *id006
      TOOLCALLING.batch.8.c:
        description: Narration both before and after (sandwich)
        ref: dynamo
        model_text: I will check the weather. <|tool_call>call:get_weather{location:<|"|>NYC<|"|>}<tool_call|> Let me know if you need more.
        tools:
        - *id006
      TOOLCALLING.batch.8.d:
        description: Narration between multiple tool calls
        ref: dynamo
        model_text: I will check the weather. <|tool_call>call:get_weather{location:<|"|>NYC<|"|>}<tool_call|> Then check LA weather. <|tool_call>call:get_weather{location:<|"|>LA<|"|>}<tool_call|>
        tools:
        - *id006
  TOOLCALLING.batch.yaml:
    family: gemma4
    model_label: Gemma 4
    mode: batch
    cases:
      TOOLCALLING.batch.1:
        description: Single tool call (happy path)
        model_text: <|tool_call>call:get_weather{location:<|"|>NYC<|"|>}<tool_call|>
        tools:
        - &id007
          name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.3:
        description: No tool call (plain text)
        model_text: Hello, how can I help you today?
        tools:
        - *id007
      TOOLCALLING.batch.9.a:
        description: Empty model text
        model_text: ''
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.9.b:
        description: Blank / whitespace-only model text
        ref: dynamo
        model_text: '   '
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.10:
        description: Duplicate calls (same name twice)
        model_text: <|tool_call>call:get_weather{location:<|"|>NYC<|"|>}<tool_call|><|tool_call>call:get_weather{location:<|"|>LA<|"|>}<tool_call|>
        tools:
        - *id007
      TOOLCALLING.batch.30.a:
        description: Call/body delimiters `,`, `:`, and `{}` inside one argument string value
        ref: dynamo
        model_text: <|tool_call>call:run_query{sql:<|"|>SELECT a,b:and{brace}<|"|>}<tool_call|>
        tools:
        - name: run_query
          parameters:
            type: object
            properties:
              sql:
                type: string
      TOOLCALLING.batch.30.b:
        description: Structural delimiters `}` and `]` inside one argument string value
        ref: dynamo
        model_text: <|tool_call>call:run_query{sql:<|"|>SELECT value WHERE note has brace } and bracket ]<|"|>}<tool_call|>
        tools:
        - name: run_query
          parameters:
            type: object
            properties:
              sql:
                type: string
      TOOLCALLING.batch.30.c:
        description: Tool-call marker `<|tool_call>` text inside one argument string value
        ref: dynamo
        model_text: <|tool_call>call:run_query{sql:<|"|>literal <|tool_call marker> call:get_time{} stays text<|"|>}<tool_call|>
        tools:
        - name: run_query
          parameters:
            type: object
            properties:
              sql:
                type: string
      TOOLCALLING.batch.31.a:
        description: Multi-call response with Gemma delimiters `,`, `:`, and `{}` inside the first argument string
        ref: dynamo
        model_text: <|tool_call>call:run_query{sql:<|"|>SELECT a,b:and{brace}<|"|>}<tool_call|><|tool_call>call:get_time{timezone:<|"|>EST<|"|>}<tool_call|>
        tools:
        - name: run_query
          parameters:
            type: object
            properties:
              sql:
                type: string
        - name: get_time
          parameters:
            type: object
            properties:
              timezone:
                type: string
      TOOLCALLING.batch.31.b:
        description: Multi-call response with structural delimiters inside one argument string value
        ref: dynamo
        model_text: <|tool_call>call:run_query{sql:<|"|>SELECT value WHERE note has brace } and bracket ]<|"|>}<tool_call|><|tool_call>call:get_time{timezone:<|"|>EST<|"|>}<tool_call|>
        tools:
        - name: run_query
          parameters:
            type: object
            properties:
              sql:
                type: string
        - name: get_time
          parameters:
            type: object
            properties:
              timezone:
                type: string
      TOOLCALLING.batch.13.a:
        description: Unknown-only call under default behavior
        ref: originated from https://github.com/sgl-project/sglang/blob/612785ffdcaf35552f1ed433a981d596ca9fe900/test/registered/unit/function_call/test_function_call_parser.py#L4312
        model_text: <|tool_call>call:unknown_tool{location:<|"|>NYC<|"|>}<tool_call|>
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.13.c:
        description: Mixed known and unknown calls in one response
        ref: dynamo
        model_text: <|tool_call>call:get_weather{location:<|"|>NYC<|"|>}<tool_call|><|tool_call>call:unknown_tool{location:<|"|>LA<|"|>}<tool_call|>
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
  TOOLCALLING.stream.1.yaml:
    family: gemma4
    model_label: Gemma 4
    mode: stream
    cases:
      TOOLCALLING.stream.1.a:
        description: Complete tool-call payload delivered in one content chunk
        ref: derived from TOOLCALLING.batch.1
        chunks:
        - delta_text: <|tool_call>call:get_weather{location:<|"|>NYC<|"|>}<tool_call|>
        - delta_text: ''
          finish_reason: tool_calls
        tools: &id008
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.stream.1.b:
        description: Complete tool call split across parser-significant boundaries
        ref: derived from TOOLCALLING.batch.1
        chunks:
        - delta_text: <|tool_call>
        - delta_text: 'call:'
        - delta_text: get_weather
        - delta_text: '{location:'
        - delta_text: <|"|>
        - delta_text: NYC
        - delta_text: <|"|>}
        - delta_text: <tool_call|>
        - delta_text: ''
          finish_reason: tool_calls
        tools: *id008
  TOOLCALLING.stream.2.yaml:
    family: gemma4
    model_label: Gemma 4
    mode: stream
    cases:
      TOOLCALLING.stream.2:
        description: Multiple tool calls split across multiple content chunks
        ref: derived from TOOLCALLING.batch.2.a
        chunks:
        - delta_text: <|tool_ca
        - delta_text: ll>call
        - delta_text: :get_weather{
        - delta_text: locat
        - delta_text: ion:<|"|>NYC<|"|>
        - delta_text: '}<t'
        - delta_text: ool_call|
        - delta_text: '><|tool'
        - delta_text: _call>call:ge
        - delta_text: t_tim
        - delta_text: e{timezone:<|"|>E
        - delta_text: ST<
        - delta_text: '|"|>}<too'
        - delta_text: l_call|
        - delta_text: '>'
        - delta_text: ''
          finish_reason: tool_calls
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        - name: get_time
          parameters:
            type: object
            properties:
              timezone:
                type: string
  TOOLCALLING.stream.3.yaml:
    family: gemma4
    model_label: Gemma 4
    mode: stream
    cases:
      TOOLCALLING.stream.3:
        description: Complete single tool call with a grammar token split across chunk boundaries
        ref: derived from TOOLCALLING.batch.1
        chunks:
        - delta_text: <|
        - delta_text: too
        - delta_text: l_cal
        - delta_text: l>call:get_
        - delta_text: weather{location:<|
        - delta_text: '"|'
        - delta_text: '>NY'
        - delta_text: C<|"|
        - delta_text: '>}<tool_cal'
        - delta_text: l|>
        - delta_text: ''
          finish_reason: tool_calls
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
  TOOLCALLING.stream.4.yaml:
    family: gemma4
    model_label: Gemma 4
    mode: stream
    cases:
      TOOLCALLING.stream.4.a:
        description: Truncated stream terminates after a complete in-flight tool-call body
        ref: derived from TOOLCALLING.batch.5.a
        chunks:
        - delta_text: <|tool_call>call:get_weather{location:<|"|>NYC<|"|>}
        - delta_text: ''
          finish_reason: stop
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.stream.4.b:
        description: Stream terminates mid-call body before the in-flight argument payload is complete
        ref: derived from TOOLCALLING.batch.5.c
        chunks:
        - delta_text: <|tool_call>call:get_w
        - delta_text: eather{location:<|"|>N
        - delta_text: ''
          finish_reason: stop
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.stream.4.c:
        description: Stream reaches length after a valid inner tool-call body without the required outer wrapper, followed by repeated close markers
        ref: derived from nemotron-ultra-preview-tool-call-leak-repro/repro_tool_call_leak.py
        chunks:
        - delta_text: call:get_weather{location:<|"|>NYC<|"|>}<tool_call|><tool_call|><tool_call|>
        - delta_text: ''
          finish_reason: length
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
