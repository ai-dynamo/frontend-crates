            normal_text: ''
      TOOLCALLING.stream.4.b:
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments: {}
            normal_text: ''
            explanation: SGLang emits the function name from a mid-body truncated call; Dynamo follows Gemma4 batch.5 and drops incomplete envelopes without leaking markup.
