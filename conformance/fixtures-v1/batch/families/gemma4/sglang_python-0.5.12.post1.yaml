corpus: batch
family: gemma4
capture: sglang_python-0.5.12.post1
documents:
  TOOLCALLING.batch.2.yaml:
    family: gemma4
    mode: batch
    cases:
      TOOLCALLING.batch.2.a:
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_time
              arguments:
                timezone: EST
            normal_text: ''
      TOOLCALLING.batch.2.c:
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_time
              arguments:
                timezone: EST
            normal_text: 'Both: '
            explanation: preserves pre-tool-call whitespace and drops trailing normal_text after tool-call wrapper end
      TOOLCALLING.batch.2.d:
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_weather
              arguments:
                location: LA
            normal_text: ''
  TOOLCALLING.batch.4.yaml:
    family: gemma4
    mode: batch
    cases:
      TOOLCALLING.batch.4.a:
        expected:
          sglang_python:
            calls: []
            normal_text: <|tool_call>nonsense<tool_call|>
            explanation: SGLang leaks the tool call tag into normal_text on the recovery path
      TOOLCALLING.batch.4.b:
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: ''
            explanation: accepts missing close brace before closing sentinel
      TOOLCALLING.batch.4.c:
        expected:
          sglang_python:
            calls: []
            normal_text: <|tool_call>{location:<|"|>NYC<|"|>}<tool_call|>
            explanation: SGLang leaks the tool call tag into normal_text on the recovery path
      TOOLCALLING.batch.4.d:
        expected:
          sglang_python:
            calls: []
            normal_text: <|tool_call>call:get_weather{location:<|"|>NYC<|"|>}</tool_call>
            explanation: SGLang leaks the tool call tag into normal_text on the recovery path
  TOOLCALLING.batch.5.yaml:
    family: gemma4
    mode: batch
    cases:
      TOOLCALLING.batch.5.a:
        expected:
          sglang_python:
            calls: []
            normal_text: <|tool_call>call:get_weather{location:<|"|>NYC<|"|>}
            explanation: SGLang leaks the tool call tag into normal_text on the recovery path; Dynamo recovers the complete call body with only the end marker missing.
      TOOLCALLING.batch.5.b:
        expected:
          sglang_python:
            calls: []
            normal_text: call:get_weather{location:<|"|>NYC<|"|>}<tool_call|>
            explanation: SGLang leaks the tool call tag into normal_text on the recovery path; Dynamo recovers the complete call body with only the start marker missing.
      TOOLCALLING.batch.5.c:
        expected:
          sglang_python:
            calls: []
            normal_text: <|tool_call>call:get_weather{location:<|"|>N
            explanation: SGLang leaks the tool call tag into normal_text on the recovery path
      TOOLCALLING.batch.5.d:
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: Boston
            normal_text: I'll start by fetching the weather for both Boston and New York at the same time!
            explanation: vLLM drops the trailing Gemma call when only the final <tool_call|> marker is missing; Dynamo recovers the complete trailing call body.
      TOOLCALLING.batch.5.e:
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: Boston
            normal_text: I'll start by fetching the weather for both Boston and New York at the same time!
      TOOLCALLING.batch.5.f:
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: Boston
            normal_text: call:get_weather{location:<|"|>NYC<|"|>}<tool_call|>
            explanation: vLLM and SGLang treat the bare Gemma call before the first <|tool_call> marker as content; Dynamo recovers it as the first structured call before parsing the wrapped call.
      TOOLCALLING.batch.5.g:
        expected:
          sglang_python:
            calls: []
            normal_text: I will check that. call:get_weather{location:<|"|>NYC<|"|>}<tool_call|>
            explanation: SGLang leaks the tool call tag into normal_text on the recovery path; Dynamo preserves the prefix prose, recovers the complete call body, and strips the orphan start marker.
  TOOLCALLING.batch.6.yaml:
    family: gemma4
    mode: batch
    cases:
      TOOLCALLING.batch.6.a:
        expected:
          sglang_python:
            calls:
            - name: get_time
              arguments: {}
            normal_text: ''
      TOOLCALLING.batch.6.b:
        expected:
          sglang_python:
            calls:
            - name: get_time
              arguments: {}
            normal_text: ''
      TOOLCALLING.batch.6.c:
        expected:
          sglang_python:
            calls: []
            normal_text: <|tool_call>call:get_time<tool_call|>
            explanation: SGLang leaks the tool call tag into normal_text on the recovery path
  TOOLCALLING.batch.7.yaml:
    family: gemma4
    mode: batch
    cases:
      TOOLCALLING.batch.7.a:
        expected:
          sglang_python:
            calls:
            - name: book_flight
              arguments:
                destination: Paris
                passengers: 2
                first_class: true
            normal_text: ''
      TOOLCALLING.batch.7.b:
        expected:
          sglang_python:
            calls:
            - name: get_weather
              arguments:
                location: Tōkyō central
            normal_text: ''
      TOOLCALLING.batch.7.c:
        expected:
          sglang_python:
            calls:
            - name: set_temperature
              arguments:
                celsius: '20'
            normal_text: ''
      TOOLCALLING.batch.7.d:
        expected:
          sglang_python:
            calls:
            - name: process_data
              arguments:
                items:
                - 1
                - 2
                - 3
                config:
                  nested: true
            normal_text: ''
      TOOLCALLING.batch.7.e:
        expected:
          sglang_python:
            explanation: SGLang keeps the Gemma-style bare null token as the string 'null'; Dynamo and vLLM parse it as JSON null.
            calls:
            - name: process_data
              arguments:
                payload:
                  regions:
                  - name: west
                    scores:
                    - 1
                    - 2
                    - 3
                  - name: east
                    scores:
                    - 4
                    - 5
                    - 6
                  flags:
                    enabled: true
                    retry: 'null'
                  empty: {}
            normal_text: ''
      TOOLCALLING.batch.7.f:
        expected:
          sglang_python:
            calls:
            - name: set_limit
              arguments:
                count: 9007199254740993
            normal_text: ''
  TOOLCALLING.batch.8.yaml:
    family: gemma4
    mode: batch
    cases:
      TOOLCALLING.batch.8.a:
