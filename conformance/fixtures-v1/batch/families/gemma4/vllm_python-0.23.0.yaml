                - 1
                - 2
                - 3
                config:
                  nested: true
            normal_text: ''
      TOOLCALLING.batch.7.e:
        expected:
          vllm_python:
            calls:
            - name: process_data
              arguments:
                payload:
                  regions:
                  - name: west
                    scores:
                    - 1
                    - 2
                    - 3
                  - name: east
                    scores:
                    - 4
                    - 5
                    - 6
                  flags:
                    enabled: true
                    retry: null
                  empty: {}
            normal_text: ''
      TOOLCALLING.batch.7.f:
        expected:
          vllm_python:
            calls:
            - name: set_limit
              arguments:
                count: 9007199254740993
            normal_text: ''
  TOOLCALLING.batch.8.yaml:
    family: gemma4
    mode: batch
    cases:
      TOOLCALLING.batch.8.a:
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
