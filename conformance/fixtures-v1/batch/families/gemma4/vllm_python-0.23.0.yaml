            normal_text: ''
      TOOLCALLING.batch.31.b:
        expected:
          vllm_python:
            calls:
            - name: run_query
              arguments:
                sql: SELECT value WHERE note has brace } and bracket ]
            - name: get_time
              arguments:
                timezone: EST
            normal_text: ''
      TOOLCALLING.batch.13.a:
        expected:
          vllm_python:
            calls:
            - name: unknown_tool
              arguments:
                location: NYC
            normal_text: ''
      TOOLCALLING.batch.13.c:
        expected:
