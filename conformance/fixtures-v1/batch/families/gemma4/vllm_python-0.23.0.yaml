corpus: batch
family: gemma4
capture: vllm_python-0.23.0
documents:
  TOOLCALLING.batch.2.yaml:
    family: gemma4
    mode: batch
    cases:
      TOOLCALLING.batch.2.a:
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_time
              arguments:
                timezone: EST
            normal_text: ''
      TOOLCALLING.batch.2.c:
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_time
              arguments:
                timezone: EST
            normal_text: 'Both:'
      TOOLCALLING.batch.2.d:
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_weather
              arguments:
                location: LA
            normal_text: ''
  TOOLCALLING.batch.4.yaml:
    family: gemma4
    mode: batch
    cases:
      TOOLCALLING.batch.4.a:
        expected:
          vllm_python:
            calls: []
            normal_text: <|tool_call>nonsense<tool_call|>
            explanation: vLLM leaks the tool call tag into normal_text on the recovery path
      TOOLCALLING.batch.4.b:
        expected:
          vllm_python:
            calls: []
            normal_text: <|tool_call>call:get_weather{location:<|"|>NYC<|"|><tool_call|>
            explanation: vLLM leaks the tool call tag into normal_text on the recovery path
      TOOLCALLING.batch.4.c:
        expected:
          vllm_python:
            calls: []
            normal_text: <|tool_call>{location:<|"|>NYC<|"|>}<tool_call|>
            explanation: vLLM leaks the tool call tag into normal_text on the recovery path
      TOOLCALLING.batch.4.d:
        expected:
          vllm_python:
            calls: []
            normal_text: <|tool_call>call:get_weather{location:<|"|>NYC<|"|>}</tool_call>
            explanation: vLLM leaks the tool call tag into normal_text on the recovery path
  TOOLCALLING.batch.5.yaml:
    family: gemma4
    mode: batch
    cases:
      TOOLCALLING.batch.5.a:
        expected:
          vllm_python:
            calls: []
            normal_text: <|tool_call>call:get_weather{location:<|"|>NYC<|"|>}
            explanation: vLLM leaks the tool call tag into normal_text on the recovery path; Dynamo recovers the complete call body with only the end marker missing.
      TOOLCALLING.batch.5.b:
        expected:
          vllm_python:
            calls: []
            normal_text: call:get_weather{location:<|"|>NYC<|"|>}<tool_call|>
            explanation: vLLM leaks the tool call tag into normal_text on the recovery path; Dynamo recovers the complete call body with only the start marker missing.
      TOOLCALLING.batch.5.c:
        expected:
          vllm_python:
            calls: []
            normal_text: <|tool_call>call:get_weather{location:<|"|>N
            explanation: vLLM leaks the tool call tag into normal_text on the recovery path
      TOOLCALLING.batch.5.d:
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: Boston
            normal_text: I'll start by fetching the weather for both Boston and New York at the same time!
            explanation: vLLM drops the trailing Gemma call when only the final <tool_call|> marker is missing; Dynamo recovers the complete trailing call body.
      TOOLCALLING.batch.5.e:
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: Boston
            normal_text: I'll start by fetching the weather for both Boston and New York at the same time!
      TOOLCALLING.batch.5.f:
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: Boston
            normal_text: call:get_weather{location:<|"|>NYC<|"|>}<tool_call|>
            explanation: vLLM and SGLang treat the bare Gemma call before the first <|tool_call> marker as content; Dynamo recovers it as the first structured call before parsing the wrapped call.
      TOOLCALLING.batch.5.g:
        expected:
          vllm_python:
            calls: []
            normal_text: I will check that. call:get_weather{location:<|"|>NYC<|"|>}<tool_call|>
            explanation: vLLM leaks the tool call tag into normal_text on the recovery path; Dynamo preserves the prefix prose, recovers the complete call body, and strips the orphan start marker.
  TOOLCALLING.batch.6.yaml:
    family: gemma4
    mode: batch
    cases:
      TOOLCALLING.batch.6.a:
        expected:
          vllm_python:
            calls:
            - name: get_time
              arguments: {}
            normal_text: ''
      TOOLCALLING.batch.6.b:
        expected:
          vllm_python:
            calls:
            - name: get_time
              arguments: {}
            normal_text: ''
      TOOLCALLING.batch.6.c:
        expected:
          vllm_python:
            calls: []
            normal_text: <|tool_call>call:get_time<tool_call|>
            explanation: vLLM leaks the tool call tag into normal_text on the recovery path
  TOOLCALLING.batch.7.yaml:
    family: gemma4
    mode: batch
    cases:
      TOOLCALLING.batch.7.a:
