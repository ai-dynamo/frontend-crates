            normal_text: ''
  TOOLCALLING.stream.1.yaml:
    family: gemma4
    mode: stream
    cases:
      TOOLCALLING.stream.1.a:
        expected:
          vllm_python:
            calls: []
            normal_text: ''
            explanation: vLLM's Gemma4 streaming parser misses a complete one-chunk tool call when start and end markers arrive in the same delta; Dynamo and SGLang parse the complete call.
      TOOLCALLING.stream.1.b:
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: ''
  TOOLCALLING.stream.2.yaml:
    family: gemma4
    mode: stream
    cases:
      TOOLCALLING.stream.2:
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            - name: get_time
              arguments:
                timezone: EST
            normal_text: ''
  TOOLCALLING.stream.3.yaml:
    family: gemma4
    mode: stream
    cases:
      TOOLCALLING.stream.3:
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: NYC
            normal_text: ''
  TOOLCALLING.stream.4.yaml:
    family: gemma4
    mode: stream
    cases:
      TOOLCALLING.stream.4.a:
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments: '{"location": "NYC'
            normal_text: ''
            explanation: vLLM emits partial arguments before the required `<tool_call|>` end marker; Dynamo and SGLang recover the complete call body.
      TOOLCALLING.stream.4.b:
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments: '{"location": "N'
            normal_text: ''
            explanation: vLLM emits partial arguments from a mid-body truncated call; Dynamo follows Gemma4 batch.5 and drops incomplete envelopes without leaking markup.
      TOOLCALLING.stream.4.c:
        expected:
          vllm_python:
            calls: []
            normal_text: call:get_weather{location:<|"|>NYC<|"|>}<tool_call|><tool_call|><tool_call|>
            explanation: vLLM preserves the raw Gemma call body as content when the opening <|tool_call> marker is missing; Dynamo recovers the complete bare call body and drops close-marker spam.
