            - name: get_weather
              arguments:
                location: LA
            normal_text: ''
      TOOLCALLING.batch.30.a:
        expected:
          vllm_python:
            calls:
            - name: run_query
              arguments:
                sql: SELECT a,b:and{brace}
            normal_text: ''
      TOOLCALLING.batch.30.b:
        expected:
          vllm_python:
            calls:
            - name: run_query
              arguments:
                sql: SELECT value WHERE note has brace } and bracket ]
            normal_text: ''
      TOOLCALLING.batch.30.c:
        expected:
