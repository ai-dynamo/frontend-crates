corpus: batch
family: nemotron_deci
capture: inputs
documents:
  TOOLCALLING.batch.2.yaml:
    family: nemotron_deci
    mode: batch
    cases:
      TOOLCALLING.batch.2.a:
        description: Parallel calls in JSON array
        ref: dynamo
        model_text: '<TOOLCALL>[{"name": "get_weather", "arguments": {"location": "NYC"}}, {"name": "get_time", "arguments": {"timezone": "EST"}}]</TOOLCALL>'
        tools:
        - &id001
          name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        - &id002
          name: get_time
          parameters:
            type: object
            properties:
              timezone:
                type: string
      TOOLCALLING.batch.2.b:
        description: Two back-to-back TOOLCALL wrappers
        ref: dynamo
        model_text: '<TOOLCALL>[{"name": "get_weather", "arguments": {"location": "NYC"}}]</TOOLCALL><TOOLCALL>[{"name": "get_time", "arguments": {"timezone": "EST"}}]</TOOLCALL>'
        tools:
        - *id001
        - *id002
      TOOLCALLING.batch.2.c:
        description: With surrounding narration
        ref: dynamo
        model_text: 'Both: <TOOLCALL>[{"name": "get_weather", "arguments": {"location": "NYC"}}, {"name": "get_time", "arguments": {"timezone": "EST"}}]</TOOLCALL> Done.'
        tools:
        - *id001
        - *id002
      TOOLCALLING.batch.2.d:
        description: Same-name twice
        ref: dynamo
        model_text: '<TOOLCALL>[{"name": "get_weather", "arguments": {"location": "NYC"}}, {"name": "get_weather", "arguments": {"location": "LA"}}]</TOOLCALL>'
        tools:
        - *id001
        - *id001
  TOOLCALLING.batch.4.yaml:
    family: nemotron_deci
    mode: batch
    cases:
      TOOLCALLING.batch.4.a:
        description: TOOLCALL wrapper with garbage
        ref: dynamo
        model_text: <TOOLCALL>nonsense</TOOLCALL>
        tools:
        - &id003
          name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.4.b:
        description: Unterminated JSON string in args
        ref: dynamo
        model_text: '<TOOLCALL>[{"name": "get_weather", "arguments": {"location": "NYC</TOOLCALL>'
        tools:
        - *id003
      TOOLCALLING.batch.4.c:
        description: Missing name key in JSON
        ref: dynamo
        model_text: '<TOOLCALL>[{"arguments": {"location": "NYC"}}]</TOOLCALL>'
        tools:
        - *id003
      TOOLCALLING.batch.4.d:
        description: Mismatched JSON brackets
        ref: dynamo
        model_text: '<TOOLCALL>[{"name": "get_weather", "arguments": {"location": "NYC"}}</TOOLCALL>'
        tools:
        - *id003
      TOOLCALLING.batch.4.e:
        description: Malformed-prefix recovery — n/a for this family's syntax
        explanation: 'TOOLCALLING.batch.4.e is specific to llama3_json''s raw JSON-object scanner: a malformed JSON-looking prefix is followed by a complete JSON object, and the detector may resynchronize on the later object. This family uses a framed parser grammar instead of that raw JSON-prefix scanner; malformed-input coverage for this family lives in TOOLCALLING.batch.4.a through 4.d.'
      TOOLCALLING.batch.4.f:
        description: Tool-name XML tag case - n/a for this family's syntax
        explanation: TOOLCALLING.batch.4.f is specific to Qwen3-Coder XML syntax, where the model may emit a tool-name tag such as <terminal> inside <tool_call> instead of the required <function=Terminal> opener. This family does not use Qwen3-Coder's <function=...> opener.
  TOOLCALLING.batch.5.yaml:
    family: nemotron_deci
    mode: batch
    cases:
      TOOLCALLING.batch.5.a:
        description: Missing </TOOLCALL> end marker
        ref: dynamo
        model_text: '<TOOLCALL>[{"name": "get_weather", "arguments": {"location": "NYC"}}]'
        tools:
        - &id004
          name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.5.b:
        description: Closing </TOOLCALL> without matching <TOOLCALL> open
        ref: dynamo
        model_text: '[{"name": "get_weather", "arguments": {"location": "NYC"}}]</TOOLCALL>'
        tools:
        - *id004
      TOOLCALLING.batch.5.c:
        description: Truncation mid-arguments JSON
        ref: dynamo
        model_text: '<TOOLCALL>[{"name": "get_weather", "arguments": {"loc'
        tools:
        - *id004
      TOOLCALLING.batch.5.d:
        description: Multi-call, last call missing only end marker (body complete)
        ref: dynamo
        model_text: 'I''ll start by fetching the weather for both Boston and New York at the same time!<TOOLCALL>[{"name": "get_weather", "arguments": {"location": "Boston"}}, {"name": "get_weather", "arguments": {"location": "New York"}}]'
        tools:
        - *id004
      TOOLCALLING.batch.5.e:
        description: Multi-call, last call truncated mid-arg-value
        ref: dynamo
        model_text: 'I''ll start by fetching the weather for both Boston and New York at the same time!<TOOLCALL>[{"name": "get_weather", "arguments": {"location": "Boston"}}, {"name": "get_weather", "arguments": {"location": "New York'
        tools:
        - *id004
  TOOLCALLING.batch.6.yaml:
    family: nemotron_deci
    mode: batch
    cases:
      TOOLCALLING.batch.6.a:
        description: 'Canonical "arguments": {}'
        ref: dynamo
        model_text: '<TOOLCALL>[{"name": "get_time", "arguments": {}}]</TOOLCALL>'
        tools:
        - &id005
          name: get_time
          parameters:
            type: object
            properties: {}
      TOOLCALLING.batch.6.b:
        description: Whitespace inside arguments {}
        ref: dynamo
        model_text: '<TOOLCALL>[{"name": "get_time", "arguments": { }}]</TOOLCALL>'
        tools:
        - *id005
      TOOLCALLING.batch.6.c:
        description: No arguments key
        ref: dynamo
        model_text: '<TOOLCALL>[{"name": "get_time"}]</TOOLCALL>'
        tools:
        - *id005
  TOOLCALLING.batch.7.yaml:
    family: nemotron_deci
    mode: batch
    cases:
      TOOLCALLING.batch.7.a:
        description: Standard scalar types
        ref: dynamo
        model_text: '<TOOLCALL>[{"name": "book_flight", "arguments": {"destination": "Paris", "passengers": 2, "first_class": true}}]</TOOLCALL>'
        tools:
        - name: book_flight
          parameters:
            type: object
            properties:
              destination:
                type: string
              passengers:
                type: integer
              first_class:
                type: boolean
      TOOLCALLING.batch.7.b:
        description: Unicode + escaped chars
        ref: dynamo
        model_text: '<TOOLCALL>[{"name": "get_weather", "arguments": {"location": "Tōkyō \"central\""}}]</TOOLCALL>'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.7.c:
        description: Schema mismatch — string value where schema declares integer
        ref: dynamo
        model_text: '<TOOLCALL>[{"name": "set_temperature", "arguments": {"celsius": "20"}}]</TOOLCALL>'
        tools:
        - name: set_temperature
          parameters:
            type: object
            properties:
              celsius:
                type: integer
      TOOLCALLING.batch.7.d:
        description: Nested object + array (existing)
        ref: dynamo
        model_text: '<TOOLCALL>[{"name": "process_data", "arguments": {"items": [1,2,3], "config": {"nested": true}}}]</TOOLCALL>'
        tools:
        - name: process_data
          parameters:
            type: object
            properties:
              items:
                type: array
              config:
                type: object
      TOOLCALLING.batch.7.e:
        description: Large / deep JSON-edge argument payload
        ref: dynamo
        model_text: '<TOOLCALL>[{"name": "process_data", "arguments": {"payload": {"regions": [{"name": "west", "scores": [1, 2, 3]}, {"name": "east", "scores": [4, 5, 6]}], "flags": {"enabled": true, "retry": null}, "empty": {}}}}]</TOOLCALL>'
        tools:
        - name: process_data
          parameters:
            type: object
            properties:
              payload:
                type: object
      TOOLCALLING.batch.7.f:
        description: Numeric precision edge test 7.f — not yet authored for this family
        explanation: Numeric precision edge test 7.f not yet authored for nemotron_deci; Qwen3-Coder coverage is provided by qwen3_coder 7.f.
  TOOLCALLING.batch.8.yaml:
    family: nemotron_deci
    mode: batch
    cases:
      TOOLCALLING.batch.8.a:
        description: Narration before tool call only
        ref: dynamo
        model_text: 'I will check the weather. <TOOLCALL>[{"name": "get_weather", "arguments": {"location": "NYC"}}]</TOOLCALL>'
        tools:
        - &id006
          name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.8.b:
        description: Narration after tool call only
        ref: dynamo
        model_text: '<TOOLCALL>[{"name": "get_weather", "arguments": {"location": "NYC"}}]</TOOLCALL> Let me know if you need more.'
        tools:
        - *id006
      TOOLCALLING.batch.8.c:
        description: Narration both before and after (sandwich)
        ref: dynamo
        model_text: 'I will check the weather. <TOOLCALL>[{"name": "get_weather", "arguments": {"location": "NYC"}}]</TOOLCALL> Let me know if you need more.'
        tools:
        - *id006
      TOOLCALLING.batch.8.d:
        description: Narration between multiple tool calls
        ref: dynamo
        model_text: 'I will check the weather. <TOOLCALL>[{"name": "get_weather", "arguments": {"location": "NYC"}}]</TOOLCALL> Then check LA weather. <TOOLCALL>[{"name": "get_weather", "arguments": {"location": "LA"}}]</TOOLCALL>'
        tools:
        - *id006
  TOOLCALLING.batch.yaml:
    family: nemotron_deci
    model_label: Nemotron (DeciLM) v1/v2
    mode: batch
    cases:
      TOOLCALLING.batch.1:
        description: Single tool call (happy path)
        model_text: '<TOOLCALL>[{"name": "get_weather", "arguments": {"location": "NYC"}}]</TOOLCALL>'
        tools:
        - &id007
          name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.13.c:
        description: Mixed known and unknown calls not applicable
        explanation: This case is not applicable to nemotron_deci because neither vLLM nor SGLang has a peer parser for this family.
      TOOLCALLING.batch.3:
        description: No tool call (plain text)
        model_text: Hello, how can I help you today?
        tools:
        - *id007
      TOOLCALLING.batch.9.a:
        description: Empty model text
        model_text: ''
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.9.b:
        description: Blank / whitespace-only model text
        ref: dynamo
        model_text: '   '
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.batch.10:
        description: Duplicate calls (same name twice)
        model_text: '<TOOLCALL>[{"name": "get_weather", "arguments": {"location": "NYC"}}, {"name": "get_weather", "arguments": {"location": "LA"}}]</TOOLCALL>'
        tools:
        - *id007
      TOOLCALLING.batch.30:
        description: Separator-character case not applicable
        explanation: This case is not applicable to nemotron_deci because neither vLLM nor SGLang has a peer parser for this family.
      TOOLCALLING.batch.31:
        description: Multi-call separator-character case not applicable
        explanation: This case is not applicable to nemotron_deci because neither vLLM nor SGLang has a peer parser for this family.
      TOOLCALLING.batch.13:
        description: Unknown tool name absent from supplied tools
        ref: dynamo
        model_text: '<TOOLCALL>[{"name": "unknown_tool", "arguments": {"location": "NYC"}}]</TOOLCALL>'
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
  TOOLCALLING.stream.1.yaml:
    family: nemotron_deci
    model_label: Nemotron (DeciLM) v1/v2
    mode: stream
    cases:
      TOOLCALLING.stream.1.a:
        description: Complete tool-call payload delivered in one content chunk
        ref: derived from TOOLCALLING.batch.1
        chunks:
        - delta_text: '<TOOLCALL>[{"name": "get_weather", "arguments": {"location": "NYC"}}]</TOOLCALL>'
        - delta_text: ''
          finish_reason: tool_calls
        tools: &id008
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.stream.1.b:
        description: Complete tool call split across parser-significant boundaries
        ref: derived from TOOLCALLING.batch.1
        chunks:
        - delta_text: <TOOLCALL>
        - delta_text: '[{"name": "get_weather", '
        - delta_text: '"arguments": {"location": "NYC"}}]'
        - delta_text: </TOOLCALL>
        - delta_text: ''
          finish_reason: tool_calls
        tools: *id008
  TOOLCALLING.stream.2.yaml:
    family: nemotron_deci
    model_label: Nemotron (DeciLM) v1/v2
    mode: stream
    cases:
      TOOLCALLING.stream.2:
        description: Multiple tool calls split across multiple content chunks
        ref: derived from TOOLCALLING.batch.2.a
        chunks:
        - delta_text: <TOOLCALL
        - delta_text: '>[{"nam'
        - delta_text: 'e": "get_weat'
        - delta_text: her",
        - delta_text: ' "arguments": {"l'
        - delta_text: oca
        - delta_text: 'tion": "N'
        - delta_text: 'YC"}}, '
        - delta_text: '{"name": "get'
        - delta_text: _time
        - delta_text: '", "arguments": {'
        - delta_text: '"ti'
        - delta_text: 'mezone": '
        - delta_text: '"EST"}}'
        - delta_text: ']</TOOLCALL>'
        - delta_text: ''
          finish_reason: tool_calls
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
        - name: get_time
          parameters:
            type: object
            properties:
              timezone:
                type: string
  TOOLCALLING.stream.3.yaml:
    family: nemotron_deci
    model_label: Nemotron (DeciLM) v1/v2
    mode: stream
    cases:
      TOOLCALLING.stream.3:
        description: Complete single tool call with a grammar token split across chunk boundaries
        ref: derived from TOOLCALLING.batch.1
        chunks:
        - delta_text: <T
        - delta_text: OOL
        - delta_text: CALL>
        - delta_text: '[{"name": "'
        - delta_text: get_weather", "argu
        - delta_text: me
        - delta_text: nts
        - delta_text: '": {"'
        - delta_text: 'location": '
        - delta_text: '"NYC"}}]</TOOLCALL>'
        - delta_text: ''
          finish_reason: tool_calls
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
  TOOLCALLING.stream.4.yaml:
    family: nemotron_deci
    model_label: Nemotron (DeciLM) v1/v2
    mode: stream
    cases:
      TOOLCALLING.stream.4.a:
        description: Truncated stream terminates after a complete in-flight tool-call body
        ref: derived from TOOLCALLING.batch.5.a
        chunks:
        - delta_text: '<TOOLCALL>[{"name": "get_weather", "arguments": {"location": "NYC"}}]'
        - delta_text: ''
          finish_reason: stop
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.stream.4.b:
        description: Stream terminates mid-call body before the in-flight argument payload is complete
        ref: derived from TOOLCALLING.batch.5.c
        chunks:
        - delta_text: '<TOOLCALL>[{"name": "get_w'
        - delta_text: 'eather", "arguments": {"loc'
        - delta_text: ''
          finish_reason: stop
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
      TOOLCALLING.stream.4.c:
        description: Stream reaches length after a valid inner tool-call body without the required outer wrapper, followed by repeated close markers
        ref: derived from nemotron-ultra-preview-tool-call-leak-repro/repro_tool_call_leak.py
        chunks:
        - delta_text: '[{"name": "get_weather", "arguments": {"location": "NYC"}}]</TOOLCALL></TOOLCALL></TOOLCALL>'
        - delta_text: ''
          finish_reason: length
        tools:
        - name: get_weather
          parameters:
            type: object
            properties:
              location:
                type: string
