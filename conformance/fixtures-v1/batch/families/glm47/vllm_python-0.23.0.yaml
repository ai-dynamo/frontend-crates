            - name: get_weather
              arguments:
                location: LA
            normal_text: ''
  TOOLCALLING.batch.4.yaml:
    family: glm47
    mode: batch
    cases:
      TOOLCALLING.batch.4.a:
        expected:
          vllm_python:
            calls:
            - name: <arg_key>location</arg_key><arg_value>NYC</arg_value>
              arguments: {}
            normal_text: ''
            explanation: vLLM treats the leading <arg_key>...</arg_value> bytes as a function name when no name precedes the first arg_key; Dynamo and SGLang both drop the malformed call
      TOOLCALLING.batch.4.d:
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments: {}
            normal_text: ''
  TOOLCALLING.batch.5.yaml:
    family: glm47
    mode: batch
    cases:
      TOOLCALLING.batch.5.a:
        expected:
          vllm_python:
            calls: []
            normal_text: <tool_call>get_weather<arg_key>location</arg_key><arg_value>NYC</arg_value>
            explanation: vLLM and SGLang preserve the truncated <tool_call>... markup as content on missing-end-token recovery; Dynamo drops to keep wire tags out of message.content
      TOOLCALLING.batch.5.b:
        expected:
          vllm_python:
            explanation: vLLM and SGLang preserve orphan GLM <arg_key>/<arg_value>/</tool_call> markup as content when opening <tool_call> is missing; Dynamo recovers the complete bare call body and strips the orphan close marker.
            calls: []
            normal_text: get_weather<arg_key>location</arg_key><arg_value>NYC</arg_value></tool_call>
      TOOLCALLING.batch.5.c:
        expected:
          vllm_python:
            calls: []
            normal_text: <tool_call>get_weather<arg_key>location</arg_key><arg_value>N
            explanation: vLLM and SGLang preserve the truncated <tool_call>... prefix as content on mid-arg-value truncation; Dynamo drops to keep wire tags out of message.content
      TOOLCALLING.batch.5.d:
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: Boston
            normal_text: I'll start by fetching the weather for both Boston and New York at the same time!
      TOOLCALLING.batch.5.e:
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: Boston
            normal_text: I'll start by fetching the weather for both Boston and New York at the same time!
      TOOLCALLING.batch.5.f:
        expected:
          vllm_python:
            calls:
            - name: get_weather
              arguments:
                location: Boston
            normal_text: get_weather<arg_key>location</arg_key><arg_value>NYC</arg_value></tool_call>
            explanation: vLLM and SGLang preserve the bare GLM call before the first <tool_call> as content; Dynamo recovers it as the first structured call before parsing the wrapped call.
      TOOLCALLING.batch.5.g:
        expected:
          vllm_python:
            explanation: vLLM and SGLang preserve orphan GLM <arg_key>/<arg_value>/</tool_call> markup as content when opening <tool_call> is missing; Dynamo preserves the prefix prose, recovers the complete bare call body, and strips the orphan close marker.
            calls: []
            normal_text: I will check that. get_weather<arg_key>location</arg_key><arg_value>NYC</arg_value></tool_call>
