corpus: reasoning
family: gemma4
capture: inputs
documents:
  REASONING.batch.yaml:
    family: gemma4
    model_label: Gemma 4
    mode: batch
    captured_with:
      vllm_python: 0.23.0
      sglang_python: 0.5.12.post1
    refs:
      upstream: 'inspired by vLLM Gemma4 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_gemma4_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
    cases:
      REASONING.batch.2.a:
        description: Gemma thought channel with role label stripped
        ref: 'inspired by vLLM Gemma4 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_gemma4_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: '<|channel>thought

          thinking<channel|>answer'
        expected:
          dynamo_v1:
            reasoning_text: thinking
            normal_text: answer
          vllm_python:
            reasoning_text: thinking
            normal_text: answer
          sglang_python:
            reasoning_text: thinking
            normal_text: answer
      REASONING.batch.3.a:
        description: Gemma reasoning followed by downstream tool-call text
        ref: 'inspired by vLLM Gemma4 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_gemma4_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: '<|channel>thought

          choose tool<channel|><|tool_call>call:get_weather{location:<|"|>NYC<|"|>}<tool_call|>'
        expected:
          dynamo_v1:
            reasoning_text: choose tool
            normal_text: <|tool_call>call:get_weather{location:<|"|>NYC<|"|>}<tool_call|>
          vllm_python:
            reasoning_text: choose tool
            normal_text: <|tool_call>call:get_weather{location:<|"|>NYC<|"|>}<tool_call|>
          sglang_python:
            reasoning_text: choose tool
            normal_text: <|tool_call>call:get_weather{location:<|"|>NYC<|"|>}<tool_call|>
      REASONING.batch.3.b:
        description: Open Gemma thought channel interrupted by downstream tool-call text is not configured
        ref: 'inspired by vLLM Gemma4 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_gemma4_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        explanation: Dynamo's Gemma reasoning parser has no downstream tool-call boundary while the thought channel is open; closed-channel handoff is covered by REASONING.batch.3.a.
      REASONING.batch.2.c:
        description: Gemma reasoning followed by normal answer text
        ref: 'inspired by vLLM Gemma4 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_gemma4_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: '<|channel>thought

          compute<channel|>answer'
        expected:
          dynamo_v1:
            reasoning_text: compute
            normal_text: answer
          vllm_python:
            reasoning_text: compute
            normal_text: answer
          sglang_python:
            reasoning_text: compute
            normal_text: answer
      REASONING.batch.2.d:
        description: Gemma normal text around reasoning
        ref: 'inspired by vLLM Gemma4 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_gemma4_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        spec_ref: lib/parsers/REASONING_CASES.md; https://docs.vllm.ai/en/v0.21.0/api/vllm/reasoning/gemma4_reasoning_parser/; https://docs.nvidia.com/dynamo/latest/user-guides/parsing/reasoning-parsing-dynamo
        model_text: 'before <|channel>thought

          thinking<channel|> after'
        expected:
          dynamo_v1:
            reasoning_text: thinking
            normal_text: before  after
          vllm_python:
            reasoning_text: thinking
            normal_text: ' after'
            explanation: vLLM drops text before the Gemma reasoning channel.
          sglang_python:
            reasoning_text: before thinking
            normal_text: ' after'
            explanation: Dynamo keeps text emitted before the reasoning open marker as normal_text; SGLang strips the start marker in place and folds that prefix into reasoning_text.
      REASONING.batch.1.b:
        description: No reasoning markers pass through as normal text
        ref: 'inspired by vLLM Gemma4 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_gemma4_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: plain answer
        expected:
          dynamo_v1:
            reasoning_text: ''
            normal_text: plain answer
          vllm_python:
            reasoning_text: ''
            normal_text: plain answer
          sglang_python:
            reasoning_text: ''
            normal_text: plain answer
      REASONING.batch.4:
        description: Dangling Gemma channel end marker extracts text before the marker as reasoning
        ref: 'inspired by vLLM Gemma4 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_gemma4_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: normal<channel|>answer
        expected:
          dynamo_v1:
            reasoning_text: normal
            normal_text: answer
          vllm_python:
            reasoning_text: normal
            normal_text: answer
          sglang_python:
            reasoning_text: ''
            normal_text: normal<channel|>answer
            explanation: Dynamo treats the text before an unpaired end marker as reasoning (implicit-opener recovery, matching vLLM); SGLang enters reasoning only on an explicit start marker, so the dangling end marker and surrounding text stay in normal_text.
      REASONING.batch.5:
        description: Open thought channel without close treats suffix as reasoning
        ref: 'inspired by vLLM Gemma4 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_gemma4_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        spec_ref: lib/parsers/REASONING_CASES.md; https://docs.vllm.ai/en/v0.21.0/api/vllm/reasoning/gemma4_reasoning_parser/; https://docs.nvidia.com/dynamo/latest/user-guides/parsing/reasoning-parsing-dynamo
        model_text: '<|channel>thought

          partial reasoning'
        expected:
          dynamo_v1:
            reasoning_text: partial reasoning
            normal_text: ''
          vllm_python:
            reasoning_text: partial reasoning
            normal_text: ''
          sglang_python:
            reasoning_text: partial reasoning
            normal_text: ''
      REASONING.batch.2.e:
        description: Empty Gemma reasoning channel
        ref: 'inspired by vLLM Gemma4 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_gemma4_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: '<|channel>thought

          <channel|>answer'
        expected:
          dynamo_v1:
            reasoning_text: ''
            normal_text: answer
          vllm_python:
            reasoning_text: ''
            normal_text: answer
          sglang_python:
            reasoning_text: ''
            normal_text: answer
      REASONING.batch.2.f:
        description: Complex Gemma reasoning content with Unicode and newlines
        ref: 'inspired by vLLM Gemma4 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_gemma4_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: '<|channel>thought

          Line 1

          Unicode: café

          JSON-ish: {"x": [1, true]}<channel|>Done.'
        expected:
          dynamo_v1:
            reasoning_text: 'Line 1

              Unicode: café

              JSON-ish: {"x": [1, true]}'
            normal_text: Done.
          vllm_python:
            reasoning_text: 'Line 1

              Unicode: café

              JSON-ish: {"x": [1, true]}'
            normal_text: Done.
          sglang_python:
            reasoning_text: 'Line 1

              Unicode: café

              JSON-ish: {"x": [1, true]}'
            normal_text: Done.
      REASONING.batch.1.a:
        description: Empty input
        ref: 'inspired by vLLM Gemma4 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_gemma4_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: ''
        expected:
          dynamo_v1:
            reasoning_text: ''
            normal_text: ''
          vllm_python:
            reasoning_text: ''
            normal_text: ''
          sglang_python:
            reasoning_text: ''
            normal_text: ''
      REASONING.batch.6.a:
        description: Multiple reasoning spans are concatenated by Dynamo
        ref: 'inspired by vLLM Gemma4 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_gemma4_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        spec_ref: lib/parsers/REASONING_CASES.md; https://docs.vllm.ai/en/v0.21.0/api/vllm/reasoning/gemma4_reasoning_parser/; https://docs.nvidia.com/dynamo/latest/user-guides/parsing/reasoning-parsing-dynamo
        model_text: '<|channel>thought

          first<channel|> middle <|channel>thought

          second<channel|> done'
        expected:
          dynamo_v1:
            reasoning_text: firstsecond
            normal_text: ' middle  done'
          vllm_python:
            reasoning_text: first
            normal_text: ' middle <|channel>thought

              second<channel|> done'
            explanation: Multi-span reasoning is out-of-spec model output; Dynamo preserves all reasoning and non-reasoning text without leaking protocol markers, while vLLM leaves the later complete channel in normal_text.
          sglang_python:
            reasoning_text: first
            normal_text: ' middle <|channel>thought

              second<channel|> done'
            explanation: Dynamo extracts every complete reasoning span and concatenates them; SGLang exits reasoning at the first end marker and leaves the later span, with its literal markers, in normal_text.
      REASONING.batch.6.b:
        description: Stray end marker after a complete reasoning span(unbalanced-tag)
        ref: dynamo
        spec_ref: tests/parity/README.md
        model_text: '<|channel>thought

          preamble<channel|>body<channel|>answer'
        expected:
          dynamo_v1:
            reasoning_text: preamble
            normal_text: bodyanswer
            explanation: 'Lossless split: stray <channel|> close marker after a complete reasoning span is stripped (parser-owned syntax must not appear in normal_text).'
          vllm_python:
            reasoning_text: preamble
            normal_text: body<channel|>answer
          sglang_python:
            reasoning_text: preamble
            normal_text: body<channel|>answer
      REASONING.batch.3.c:
        description: Recipientless Harmony commentary is not applicable to Gemma 4
        explanation: Gemma 4 uses Gemma thought channels, not Harmony commentary channels; visible text and downstream tool handoff use Gemma-specific markers.
      REASONING.batch.3.d:
        description: Directed Harmony commentary tool calls are not applicable to Gemma 4
        explanation: Gemma 4 does not use Harmony `commentary to=functions.*` envelopes; downstream tool calls use Gemma-specific tool markers.
      REASONING.batch.3.e:
        description: Directed Harmony analysis tool calls are not applicable to Gemma 4
        explanation: Gemma 4 does not use Harmony `analysis to=functions.*` envelopes; reasoning is represented by Gemma thought channels.
      REASONING.batch.3.f:
        description: Harmony analysis/commentary/final channel sequencing is not applicable to Gemma 4
        explanation: Gemma 4 has no Harmony channel protocol, so mixed analysis, commentary tool call, and final-channel sequencing is outside its grammar.
  REASONING.stream.yaml:
    family: gemma4
    model_label: Gemma 4
    mode: stream
    captured_with:
      vllm_python: 0.23.0
      sglang_python: 0.5.12.post1
    refs:
      upstream: 'inspired by vLLM Gemma4 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_gemma4_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
    cases:
      REASONING.stream.1.a:
        description: Empty stream chunk
        ref: 'inspired by vLLM Gemma4 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_gemma4_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        chunks:
        - ''
        expected:
          dynamo_v1:
            reasoning_text: ''
            normal_text: ''
          vllm_python:
            reasoning_text: ''
            normal_text: ''
          sglang_python:
            reasoning_text: ''
            normal_text: ''
      REASONING.stream.2.a:
        description: Gemma thought channel across chunks
        ref: 'inspired by vLLM Gemma4 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_gemma4_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        spec_ref: lib/parsers/REASONING_CASES.md; https://docs.vllm.ai/en/v0.21.0/api/vllm/reasoning/gemma4_reasoning_parser/; https://docs.nvidia.com/dynamo/latest/user-guides/parsing/reasoning-parsing-dynamo
        chunks:
        - '<|channel>thought

          step one

          '
        - step two<channel|>
        - The answer is 42.
        expected:
          dynamo_v1:
            reasoning_text: 'step one

              step two'
            normal_text: The answer is 42.
          vllm_python:
            reasoning_text: '<|channel>thought

              step one

              step two'
            normal_text: The answer is 42.
            explanation: Dynamo strips Gemma channel syntax and the thought role label; vLLM leaks the channel prefix in streaming.
          sglang_python:
            reasoning_text: 'step one

              step two'
            normal_text: The answer is 42.
      REASONING.stream.2.b:
        description: Multiple Gemma thought channels across chunks
        ref: 'inspired by vLLM Gemma4 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_gemma4_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        spec_ref: lib/parsers/REASONING_CASES.md; https://docs.vllm.ai/en/v0.21.0/api/vllm/reasoning/gemma4_reasoning_parser/; https://docs.nvidia.com/dynamo/latest/user-guides/parsing/reasoning-parsing-dynamo
        chunks:
        - '<|channel>thought

          first<channel|>'
        - ' middle '
        - '<|channel>thought

          second<channel|> done'
        expected:
          dynamo_v1:
            reasoning_text: firstsecond
            normal_text: ' middle  done'
          vllm_python:
            reasoning_text: first
            normal_text: ' middle <|channel>thought

              second<channel|> done'
            explanation: Dynamo extracts each complete Gemma thought channel across chunks; vLLM leaves the later complete channel in normal_text.
          sglang_python:
            reasoning_text: first
            normal_text: ' middle <|channel>thought

              second<channel|> done'
            explanation: Dynamo re-enters reasoning on each open marker across chunks and concatenates all spans; SGLang exits at the first end marker and does not re-enter, leaving the later span in normal_text.
      REASONING.stream.3.a:
        description: Start marker split across chunks
        ref: 'inspired by vLLM Gemma4 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_gemma4_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        spec_ref: lib/parsers/REASONING_CASES.md; https://docs.vllm.ai/en/v0.21.0/api/vllm/reasoning/gemma4_reasoning_parser/; https://docs.nvidia.com/dynamo/latest/user-guides/parsing/reasoning-parsing-dynamo
        chunks:
        - <|chan
        - 'nel>thought

          thinking<channel|>answer'
        expected:
          dynamo_v1:
            reasoning_text: thinking
            normal_text: answer
          vllm_python:
            reasoning_text: ''
            normal_text: '<|channel>thought

              thinking<channel|>answer'
            explanation: Dynamo buffers a split Gemma start delimiter and extracts the channel; vLLM leaves the full channel in normal_text.
          sglang_python:
            reasoning_text: thinking
            normal_text: answer
      REASONING.stream.3.b:
        description: End marker split across chunks
        ref: 'inspired by vLLM Gemma4 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_gemma4_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        spec_ref: lib/parsers/REASONING_CASES.md; https://docs.vllm.ai/en/v0.21.0/api/vllm/reasoning/gemma4_reasoning_parser/; https://docs.nvidia.com/dynamo/latest/user-guides/parsing/reasoning-parsing-dynamo
        chunks:
        - '<|channel>thought

          thinking<chan'
        - nel|>answer
        expected:
          dynamo_v1:
            reasoning_text: thinking
            normal_text: answer
          vllm_python:
            reasoning_text: '<|channel>thought

              thinking<channel|>answer'
            normal_text: ''
            explanation: Dynamo buffers a split Gemma end delimiter and resumes normal_text after it; vLLM keeps the delimiter and answer in reasoning_text.
          sglang_python:
            reasoning_text: thinking<channel|>answer
            normal_text: ''
            explanation: Dynamo buffers an end marker split across chunk boundaries and resumes normal_text after it; SGLang streams the partial delimiter as reasoning (it only holds back a partial marker when the whole pending buffer is a marker prefix), so the split marker is never reassembled and the answer stays in reasoning_text.
      REASONING.stream.3.c:
        description: Partial channel marker prefix later becomes normal text
        ref: 'inspired by vLLM Gemma4 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_gemma4_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        chunks:
        - plain <|chan
        - ce answer
        expected:
          dynamo_v1:
            reasoning_text: ''
            normal_text: plain <|chance answer
          vllm_python:
            reasoning_text: ''
            normal_text: plain <|chance answer
          sglang_python:
            reasoning_text: ''
            normal_text: plain <|chance answer
      REASONING.stream.1.b:
        description: Plain text never enters reasoning mode
        ref: 'inspired by vLLM Gemma4 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_gemma4_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        chunks:
        - plain
        - ' answer'
        expected:
          dynamo_v1:
            reasoning_text: ''
            normal_text: plain answer
          vllm_python:
            reasoning_text: ''
            normal_text: plain answer
          sglang_python:
            reasoning_text: ''
            normal_text: plain answer
      REASONING.stream.2.c:
        description: Stray end marker after a complete reasoning span, across chunks(unbalanced-tag)
        ref: dynamo
        spec_ref: tests/parity/README.md
        chunks:
        - '<|channel>thought

          preamble<channel|>'
        - body<channel|>
        - answer
        expected:
          dynamo_v1:
            reasoning_text: preamble
            normal_text: bodyanswer
            explanation: 'Lossless split: stray <channel|> close marker after a complete reasoning span is stripped (parser-owned syntax must not appear in normal_text).'
          vllm_python:
            reasoning_text: preamble
            normal_text: body<channel|>answer
          sglang_python:
            reasoning_text: preamble
            normal_text: body<channel|>answer
      REASONING.stream.4.a:
        description: Downstream streaming boundary is not applicable to Gemma 4
        explanation: Gemma 4 has no configured Harmony commentary boundary; closed-channel handoff is covered by REASONING.batch.3.a.
      REASONING.stream.4.b:
        description: Split downstream streaming boundary is not applicable to Gemma 4
        explanation: Gemma 4 has no Harmony `commentary to=functions.*` stream boundary to split across chunks.
      REASONING.stream.4.c:
        description: Partial downstream boundary recovery is not applicable to Gemma 4
        explanation: Gemma 4 has no Harmony commentary protocol, so partial commentary-boundary recovery is outside its grammar.
      REASONING.stream.4.d:
        description: Directed Harmony analysis tool calls are not applicable to Gemma 4
        explanation: This parser family does not use Harmony `analysis to=functions.*` envelopes, so split analysis-channel tool-call handoff is outside its grammar.
