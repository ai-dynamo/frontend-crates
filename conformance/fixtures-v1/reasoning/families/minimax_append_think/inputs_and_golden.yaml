corpus: reasoning
family: minimax_append_think
capture: inputs
documents:
  REASONING.batch.yaml:
    family: minimax_append_think
    model_label: MiniMax append-think
    mode: batch
    captured_with:
      vllm_python: 0.23.0
      sglang_python: 0.5.12.post1
    refs:
      upstream: 'inspired by vLLM MiniMax M2 append-think reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_minimax_m2_append_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
    cases:
      REASONING.batch.1.b:
        description: Plain text receives the synthetic think opener
        ref: 'inspired by vLLM MiniMax M2 append-think reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_minimax_m2_append_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: plain answer
        expected:
          dynamo_v1: &id001
            reasoning_text: ''
            normal_text: <think>plain answer
          vllm_python: *id001
          sglang_python: *id001
      REASONING.batch.2.a:
        description: MiniMax appends a synthetic think opener and leaves content inline
        ref: 'inspired by vLLM MiniMax M2 append-think reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_minimax_m2_append_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: thinking
        expected:
          dynamo_v1: &id002
            reasoning_text: ''
            normal_text: <think>thinking
          vllm_python: *id002
          sglang_python: *id002
      REASONING.batch.3.a:
        description: Reasoning-shaped text followed by downstream MiniMax tool-call text
        ref: 'inspired by vLLM MiniMax M2 append-think reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_minimax_m2_append_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: 'reasoning</think><minimax:tool_call>

          <invoke name="get_weather">

          <parameter name="location">NYC</parameter>

          </invoke>

          </minimax:tool_call>'
        expected:
          dynamo_v1: &id003
            reasoning_text: ''
            normal_text: '<think>reasoning</think><minimax:tool_call>

              <invoke name="get_weather">

              <parameter name="location">NYC</parameter>

              </invoke>

              </minimax:tool_call>'
          vllm_python: *id003
          sglang_python: *id003
      REASONING.batch.2.c:
        description: Reasoning-shaped text followed by normal answer text
        ref: 'inspired by vLLM MiniMax M2 append-think reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_minimax_m2_append_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: compute</think>answer
        expected:
          dynamo_v1: &id004
            reasoning_text: ''
            normal_text: <think>compute</think>answer
          vllm_python: *id004
          sglang_python: *id004
      REASONING.batch.4:
        description: Dangling end marker is left inline
        ref: 'inspired by vLLM MiniMax M2 append-think reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_minimax_m2_append_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: normal</think>answer
        expected:
          dynamo_v1: &id005
            reasoning_text: ''
            normal_text: <think>normal</think>answer
          vllm_python: *id005
          sglang_python: *id005
      REASONING.batch.5:
        description: Missing end marker is left inline
        ref: 'inspired by vLLM MiniMax M2 append-think reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_minimax_m2_append_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: partial reasoning
        expected:
          dynamo_v1: &id006
            reasoning_text: ''
            normal_text: <think>partial reasoning
          vllm_python: *id006
          sglang_python: *id006
      REASONING.batch.2.e:
        description: Empty input still emits the synthetic think opener
        ref: 'inspired by vLLM MiniMax M2 append-think reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_minimax_m2_append_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: ''
        expected:
          dynamo_v1: &id007
            reasoning_text: ''
            normal_text: <think>
          vllm_python: *id007
          sglang_python: *id007
      REASONING.batch.2.f:
        description: Complex content remains inline after the synthetic opener
        ref: 'inspired by vLLM MiniMax M2 append-think reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_minimax_m2_append_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: 'Line 1

          Unicode: café

          JSON-ish: {"x": [1, true]}'
        expected:
          dynamo_v1: &id008
            reasoning_text: ''
            normal_text: '<think>Line 1

              Unicode: café

              JSON-ish: {"x": [1, true]}'
          vllm_python: *id008
          sglang_python: *id008
      REASONING.batch.1.a:
        description: Empty input variant
        ref: 'inspired by vLLM MiniMax M2 append-think reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_minimax_m2_append_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: ''
        expected:
          dynamo_v1: &id009
            reasoning_text: ''
            normal_text: <think>
          vllm_python: *id009
          sglang_python: *id009
      REASONING.batch.6.a:
        description: Multiple think-looking spans remain inline
        ref: 'inspired by vLLM MiniMax M2 append-think reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_minimax_m2_append_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: first</think> middle <think>second</think> done
        expected:
          dynamo_v1: &id010
            reasoning_text: ''
            normal_text: <think>first</think> middle <think>second</think> done
          vllm_python: *id010
          sglang_python: *id010
      REASONING.batch.2.d:
        description: Normal text around think-looking markup remains inline after the synthetic opener
        ref: 'inspired by vLLM MiniMax M2 append-think reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_minimax_m2_append_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: before <think>thinking</think> after
        expected:
          dynamo_v1: &id011
            reasoning_text: ''
            normal_text: <think>before <think>thinking</think> after
          vllm_python: *id011
          sglang_python: *id011
      REASONING.batch.3.b:
        description: Open reasoning interrupted by downstream tool-call text is not configured for MiniMax append-think
        ref: 'inspired by vLLM MiniMax M2 append-think reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_minimax_m2_append_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        explanation: MiniMax append-think emits a synthetic normal-text wrapper instead of running an open reasoning-span boundary; closed-span handoff is covered by REASONING.batch.3.a.
      REASONING.batch.6.b:
        description: Stray end marker after a complete reasoning span(unbalanced-tag; passthrough — model output has no leading <think>, parser prepends it)
        ref: dynamo
        spec_ref: tests/parity/README.md
        model_text: preamble</think>body</think>answer
        expected:
          dynamo_v1:
            reasoning_text: ''
            normal_text: <think>preamble</think>body</think>answer
            explanation: MiniMaxAppendThinkParser prepends <think> before parsing (matching the append-think chat template); in default mode (no force_reasoning) the parser does not split on </think>, so the entire output stays in normal_text. This mirrors REASONING.batch.6.a passthrough behavior.
          vllm_python:
            reasoning_text: ''
            normal_text: <think>preamble</think>body</think>answer
          sglang_python:
            reasoning_text: ''
            normal_text: <think>preamble</think>body</think>answer
      REASONING.batch.3.c:
        description: Recipientless Harmony commentary is not applicable to MiniMax append-think
        explanation: MiniMax append-think does not use Harmony commentary channels; it emits a synthetic normal-text wrapper around model output.
      REASONING.batch.3.d:
        description: Directed Harmony commentary tool calls are not applicable to MiniMax append-think
        explanation: MiniMax append-think does not use Harmony `commentary to=functions.*` envelopes; downstream tool handoff uses MiniMax-specific output shape when applicable.
      REASONING.batch.3.e:
        description: Directed Harmony analysis tool calls are not applicable to MiniMax append-think
        explanation: MiniMax append-think does not use Harmony `analysis to=functions.*` envelopes; reasoning-shaped text remains inside the synthetic normal-text wrapper.
      REASONING.batch.3.f:
        description: Harmony analysis/commentary/final channel sequencing is not applicable to MiniMax append-think
        explanation: MiniMax append-think has no Harmony channel protocol, so mixed analysis, commentary tool call, and final-channel sequencing is outside its grammar.
  REASONING.stream.yaml:
    family: minimax_append_think
    model_label: MiniMax append-think
    mode: stream
    captured_with:
      vllm_python: 0.23.0
      sglang_python: 0.5.12.post1
    refs:
      upstream: 'inspired by vLLM MiniMax M2 append-think reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_minimax_m2_append_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
    cases:
      REASONING.stream.1.a:
        description: Empty stream chunk still receives the synthetic think opener
        ref: 'inspired by vLLM MiniMax M2 append-think reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_minimax_m2_append_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        chunks:
        - ''
        expected:
          dynamo_v1: &id012
            reasoning_text: ''
            normal_text: <think>
          vllm_python: *id012
          sglang_python: *id012
      REASONING.stream.2.a:
        description: First streamed chunk gets the synthetic think opener
        ref: 'inspired by vLLM MiniMax M2 append-think reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_minimax_m2_append_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        chunks:
        - 'reasoning '
        - content
        - </think>answer
        expected:
          dynamo_v1: &id013
            reasoning_text: ''
            normal_text: <think>reasoning content</think>answer
          vllm_python: *id013
          sglang_python: *id013
      REASONING.stream.2.b:
        description: Multiple append-think-looking spans remain normal text
        ref: 'inspired by vLLM MiniMax M2 append-think reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_minimax_m2_append_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        chunks:
        - first</think>
        - ' middle '
        - second</think> done
        expected:
          dynamo_v1: &id014
            reasoning_text: ''
            normal_text: <think>first</think> middle second</think> done
          vllm_python: *id014
          sglang_python: *id014
      REASONING.stream.3.a:
        description: Single chunk without a model-emitted think opener
        ref: 'inspired by vLLM MiniMax M2 append-think reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_minimax_m2_append_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        chunks:
        - thinking
        expected:
          dynamo_v1: &id015
            reasoning_text: ''
            normal_text: <think>thinking
          vllm_python: *id015
          sglang_python: *id015
      REASONING.stream.3.b:
        description: End marker split across chunks is still normal text
        ref: 'inspired by vLLM MiniMax M2 append-think reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_minimax_m2_append_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        chunks:
        - thinking</th
        - ink>answer
        expected:
          dynamo_v1: &id016
            reasoning_text: ''
            normal_text: <think>thinking</think>answer
          vllm_python: *id016
          sglang_python: *id016
      REASONING.stream.3.c:
        description: Partial marker-looking prefix remains normal text
        ref: 'inspired by vLLM MiniMax M2 append-think reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_minimax_m2_append_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        chunks:
        - plain <th
        - esis answer
        expected:
          dynamo_v1: &id017
            reasoning_text: ''
            normal_text: <think>plain <thesis answer
          vllm_python: *id017
          sglang_python: *id017
      REASONING.stream.1.b:
        description: Plain text is passed through after the synthetic opener
        ref: 'inspired by vLLM MiniMax M2 append-think reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_minimax_m2_append_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        chunks:
        - plain
        - ' answer'
        expected:
          dynamo_v1: &id018
            reasoning_text: ''
            normal_text: <think>plain answer
          vllm_python: *id018
          sglang_python: *id018
      REASONING.stream.2.c:
        description: Stray end marker after a complete reasoning span, across chunks(unbalanced-tag; passthrough — chunks reassemble without leading <think>)
        ref: dynamo
        spec_ref: tests/parity/README.md
        chunks:
        - preamble</think>
        - body</think>
        - answer
        expected:
          dynamo_v1:
            reasoning_text: ''
            normal_text: <think>preamble</think>body</think>answer
            explanation: MiniMaxAppendThinkParser prepends <think> before parsing (matching the append-think chat template); in default mode (no force_reasoning) the parser does not split on </think>, so the entire output stays in normal_text. This mirrors REASONING.batch.6.a passthrough behavior.
          vllm_python:
            reasoning_text: ''
            normal_text: <think>preamble</think>body</think>answer
          sglang_python:
            reasoning_text: ''
            normal_text: <think>preamble</think>body</think>answer
      REASONING.stream.4.a:
        description: Downstream streaming boundary is not applicable to MiniMax append-think
        explanation: MiniMax append-think has no configured Harmony commentary boundary; it emits a synthetic normal-text wrapper around model output.
      REASONING.stream.4.b:
        description: Split downstream streaming boundary is not applicable to MiniMax append-think
        explanation: MiniMax append-think has no Harmony `commentary to=functions.*` stream boundary to split across chunks.
      REASONING.stream.4.c:
        description: Partial downstream boundary recovery is not applicable to MiniMax append-think
        explanation: MiniMax append-think has no Harmony commentary protocol, so partial commentary-boundary recovery is outside its grammar.
      REASONING.stream.4.d:
        description: Directed Harmony analysis tool calls are not applicable to MiniMax append-think
        explanation: This parser family does not use Harmony `analysis to=functions.*` envelopes, so split analysis-channel tool-call handoff is outside its grammar.
