corpus: reasoning
family: kimi
capture: inputs
documents:
  REASONING.batch.yaml:
    family: kimi
    model_label: Kimi Unicode reasoning
    mode: batch
    captured_with:
      sglang_python: 0.5.12.post1
    cases:
      REASONING.batch.1.b:
        description: Plain text without Kimi reasoning delimiters
        ref: dynamo
        model_text: plain answer
        expected:
          dynamo_v1:
            reasoning_text: ''
            normal_text: plain answer
          vllm_python:
            unavailable: vLLM has no Kimi reasoning parser for this delimiter family.
          sglang_python:
            reasoning_text: ''
            normal_text: plain answer
      REASONING.batch.2.a:
        description: Single reasoning block with Kimi delimiters
        ref: dynamo
        model_text: ◁think▷thinking◁/think▷answer
        expected:
          dynamo_v1:
            reasoning_text: thinking
            normal_text: answer
          vllm_python:
            unavailable: vLLM has no Kimi reasoning parser for this delimiter family.
          sglang_python:
            reasoning_text: thinking
            normal_text: answer
      REASONING.batch.3.a:
        description: Reasoning followed by downstream tool-call text
        ref: dynamo
        model_text: ◁think▷choose tool◁/think▷<|tool_calls_section_begin|><|tool_call_begin|>functions.get_weather:0<|tool_call_argument_begin|>{"location":"NYC"}<|tool_call_end|><|tool_calls_section_end|>
        expected:
          dynamo_v1:
            reasoning_text: choose tool
            normal_text: <|tool_calls_section_begin|><|tool_call_begin|>functions.get_weather:0<|tool_call_argument_begin|>{"location":"NYC"}<|tool_call_end|><|tool_calls_section_end|>
          vllm_python:
            unavailable: vLLM has no Kimi reasoning parser for this delimiter family.
          sglang_python:
            reasoning_text: choose tool
            normal_text: <|tool_calls_section_begin|><|tool_call_begin|>functions.get_weather:0<|tool_call_argument_begin|>{"location":"NYC"}<|tool_call_end|><|tool_calls_section_end|>
      REASONING.batch.2.c:
        description: Reasoning followed by normal answer text
        ref: dynamo
        model_text: ◁think▷compute◁/think▷answer
        expected:
          dynamo_v1:
            reasoning_text: compute
            normal_text: answer
          vllm_python:
            unavailable: vLLM has no Kimi reasoning parser for this delimiter family.
          sglang_python:
            reasoning_text: compute
            normal_text: answer
      REASONING.batch.4:
        description: Dangling end marker without an opening think tag
        ref: dynamo
        spec_ref: tests/parity/README.md
        model_text: normal◁/think▷answer
        expected:
          dynamo_v1:
            reasoning_text: normal
            normal_text: answer
            explanation: 'Lossless split: a dangling close marker with no opener triggers recovery. The prefix becomes implicit reasoning and the parser-owned marker is stripped, matching the ASCII REASONING.batch.4 behavior. The unicode marker must never leak into normal_text.'
          vllm_python:
            unavailable: vLLM has no Kimi reasoning parser for this delimiter family.
          sglang_python:
            reasoning_text: ''
            normal_text: normal◁/think▷answer
      REASONING.batch.5:
        description: Missing end marker keeps the remaining text as reasoning
        ref: dynamo
        model_text: ◁think▷partial reasoning
        expected:
          dynamo_v1:
            reasoning_text: partial reasoning
            normal_text: ''
          vllm_python:
            unavailable: vLLM has no Kimi reasoning parser for this delimiter family.
          sglang_python:
            reasoning_text: partial reasoning
            normal_text: ''
      REASONING.batch.2.e:
        description: Empty reasoning block
        ref: dynamo
        model_text: ◁think▷◁/think▷answer
        expected:
          dynamo_v1:
            reasoning_text: ''
            normal_text: answer
          vllm_python:
            unavailable: vLLM has no Kimi reasoning parser for this delimiter family.
          sglang_python:
            reasoning_text: ''
            normal_text: answer
      REASONING.batch.2.f:
        description: Complex reasoning content with Unicode and newlines
        ref: dynamo
        model_text: '◁think▷Line 1

          Unicode: café

          JSON-ish: {"x": [1, true]}◁/think▷Done.'
        expected:
          dynamo_v1:
            reasoning_text: 'Line 1

              Unicode: café

              JSON-ish: {"x": [1, true]}'
            normal_text: Done.
          vllm_python:
            unavailable: vLLM has no Kimi reasoning parser for this delimiter family.
          sglang_python:
            reasoning_text: 'Line 1

              Unicode: café

              JSON-ish: {"x": [1, true]}'
            normal_text: Done.
      REASONING.batch.1.a:
        description: Empty input
        ref: dynamo
        model_text: ''
        expected:
          dynamo_v1:
            reasoning_text: ''
            normal_text: ''
          vllm_python:
            unavailable: vLLM has no Kimi reasoning parser for this delimiter family.
          sglang_python:
            reasoning_text: ''
            normal_text: ''
      REASONING.batch.6.a:
        description: Multiple reasoning spans are concatenated
        ref: dynamo
        model_text: ◁think▷first◁/think▷ middle ◁think▷second◁/think▷ done
        expected:
          dynamo_v1:
            reasoning_text: firstsecond
            normal_text: middle  done
          vllm_python:
            unavailable: vLLM has no Kimi reasoning parser for this delimiter family.
          sglang_python:
            reasoning_text: first
            normal_text: ' middle ◁think▷second◁/think▷ done'
      REASONING.batch.2.d:
        description: Normal text before and after a Kimi reasoning span
        ref: dynamo
        model_text: before ◁think▷thinking◁/think▷ after
        expected:
          dynamo_v1:
            reasoning_text: thinking
            normal_text: before  after
          vllm_python:
            unavailable: vLLM has no Kimi reasoning parser for this delimiter family.
          sglang_python:
            reasoning_text: before thinking
            normal_text: ' after'
      REASONING.batch.3.b:
        description: Open reasoning interrupted by downstream tool-call text is not configured for this Kimi delimiter family
        ref: dynamo
        explanation: Dynamo's Kimi Unicode-delimiter reasoning parser has no downstream tool-call boundary while reasoning is open; closed-span handoff is covered by REASONING.batch.3.a.
      REASONING.batch.6.b:
        description: Stray end marker after a complete reasoning span(unbalanced-tag)
        ref: dynamo
        spec_ref: tests/parity/README.md
        model_text: ◁think▷preamble◁/think▷body◁/think▷answer
        expected:
          dynamo_v1:
            reasoning_text: preamble
            normal_text: bodyanswer
            explanation: 'Lossless split: when a stray close marker appears outside any reasoning block, it is stripped (parser-owned syntax must not appear in normal_text). Reasoning is captured from the first <open>...<close> pair only; subsequent stray closes are discarded.'
          vllm_python:
            unavailable: 'UNAVAILABLE: vLLM has no reasoning parser for family=''kimi'''
          sglang_python:
            reasoning_text: preamble
            normal_text: body◁/think▷answer
      REASONING.batch.3.c:
        description: Recipientless Harmony commentary is not applicable to this Kimi delimiter family
        explanation: This parser family does not use Harmony commentary channels; visible text and downstream tool handoff use Kimi-specific reasoning and tool-call markers.
      REASONING.batch.3.d:
        description: Directed Harmony commentary tool calls are not applicable to this Kimi delimiter family
        explanation: This parser family does not use Harmony `commentary to=functions.*` envelopes; downstream tool calls use Kimi-specific tool-call markers.
      REASONING.batch.3.e:
        description: Directed Harmony analysis tool calls are not applicable to this Kimi delimiter family
        explanation: This parser family does not use Harmony `analysis to=functions.*` envelopes; reasoning is represented by Kimi-specific reasoning delimiters.
      REASONING.batch.3.f:
        description: Harmony analysis/commentary/final channel sequencing is not applicable to this Kimi delimiter family
        explanation: This parser family has no Harmony channel protocol, so mixed analysis, commentary tool call, and final-channel sequencing is outside its grammar.
  REASONING.stream.yaml:
    family: kimi
    model_label: Kimi Unicode reasoning
    mode: stream
    captured_with:
      sglang_python: 0.5.12.post1
    cases:
      REASONING.stream.1.a:
        description: Empty stream chunk
        ref: dynamo
        chunks:
        - ''
        expected:
          dynamo_v1:
            reasoning_text: ''
            normal_text: ''
          vllm_python:
            unavailable: vLLM has no Kimi reasoning parser for this delimiter family.
          sglang_python:
            reasoning_text: ''
            normal_text: ''
      REASONING.stream.2.b:
        description: Multiple reasoning spans across chunks
        ref: dynamo
        chunks:
        - ◁think▷first◁/think▷
        - ' middle '
        - ◁think▷second◁/think▷ done
        expected:
          dynamo_v1:
            reasoning_text: firstsecond
            normal_text: ' middle  done'
          vllm_python:
            unavailable: vLLM has no Kimi reasoning parser for this delimiter family.
          sglang_python:
            reasoning_text: first
            normal_text: ' middle ◁think▷second◁/think▷ done'
      REASONING.stream.2.a:
        description: Single reasoning block across chunks
        ref: dynamo
        chunks:
        - ◁think▷thin
        - king◁/think▷
        - answer
        expected:
          dynamo_v1:
            reasoning_text: thinking
            normal_text: answer
          vllm_python:
            unavailable: vLLM has no Kimi reasoning parser for this delimiter family.
          sglang_python:
            reasoning_text: thinking
            normal_text: answer
      REASONING.stream.3.a:
        description: Start marker split across chunks
        ref: dynamo
        chunks:
        - ◁thi
        - nk▷thinking◁/think▷answer
        expected:
          dynamo_v1:
            reasoning_text: thinking
            normal_text: answer
          vllm_python:
            unavailable: vLLM has no Kimi reasoning parser for this delimiter family.
          sglang_python:
            reasoning_text: thinking
            normal_text: answer
      REASONING.stream.3.b:
        description: End marker split across chunks
        ref: dynamo
        chunks:
        - ◁think▷thinking◁/thi
        - nk▷answer
        expected:
          dynamo_v1:
            reasoning_text: thinking
            normal_text: answer
          vllm_python:
            unavailable: vLLM has no Kimi reasoning parser for this delimiter family.
          sglang_python:
            reasoning_text: thinking◁/think▷answer
            normal_text: ''
      REASONING.stream.3.c:
        description: Partial start-marker prefix later becomes normal text
        ref: dynamo
        chunks:
        - plain ◁th
        - esis answer
        expected:
          dynamo_v1:
            reasoning_text: ''
            normal_text: plain ◁thesis answer
          vllm_python:
            unavailable: vLLM has no Kimi reasoning parser for this delimiter family.
          sglang_python:
            reasoning_text: ''
            normal_text: plain ◁thesis answer
      REASONING.stream.1.b:
        description: Plain text without reasoning markers
        ref: dynamo
        chunks:
        - plain
        - ' answer'
        expected:
          dynamo_v1:
            reasoning_text: ''
            normal_text: plain answer
          vllm_python:
            unavailable: vLLM has no Kimi reasoning parser for this delimiter family.
          sglang_python:
            reasoning_text: ''
            normal_text: plain answer
      REASONING.stream.2.c:
        description: Stray end marker after a complete reasoning span, across chunks(unbalanced-tag)
        ref: dynamo
        spec_ref: tests/parity/README.md
        chunks:
        - ◁think▷preamble◁/think▷
        - body◁/think▷
        - answer
        expected:
          dynamo_v1:
            reasoning_text: preamble
            normal_text: bodyanswer
            explanation: 'Lossless split: when a stray close marker appears outside any reasoning block, it is stripped (parser-owned syntax must not appear in normal_text). Reasoning is captured from the first <open>...<close> pair only; subsequent stray closes are discarded.'
          vllm_python:
            unavailable: 'UNAVAILABLE: vLLM has no reasoning parser for family=''kimi'''
          sglang_python:
            reasoning_text: preamble
            normal_text: body◁/think▷answer
      REASONING.stream.4.a:
        description: Downstream streaming boundary is not applicable to this Kimi delimiter family
        explanation: This parser family has no configured Harmony commentary boundary; closed-span handoff is covered by REASONING.batch.3.a.
      REASONING.stream.4.b:
        description: Split downstream streaming boundary is not applicable to this Kimi delimiter family
        explanation: This parser family has no Harmony `commentary to=functions.*` stream boundary to split across chunks.
      REASONING.stream.4.c:
        description: Partial downstream boundary recovery is not applicable to this Kimi delimiter family
        explanation: This parser family has no Harmony commentary protocol, so partial commentary-boundary recovery is outside its grammar.
      REASONING.stream.4.d:
        description: Directed Harmony analysis tool calls are not applicable to this Kimi delimiter family
        explanation: This parser family does not use Harmony `analysis to=functions.*` envelopes, so split analysis-channel tool-call handoff is outside its grammar.
