corpus: reasoning
family: mistral
capture: inputs
documents:
  REASONING.batch.yaml:
    family: mistral
    model_label: Mistral / Magistral
    mode: batch
    captured_with:
      vllm_python: 0.23.0
      sglang_python: 0.5.12.post1
    refs:
      upstream: 'inspired by vLLM Mistral reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_mistral_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
    cases:
      REASONING.batch.1.b:
        description: Plain text stays in force-reasoning mode in Dynamo
        ref: 'inspired by vLLM Mistral reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_mistral_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: plain answer
        expected:
          dynamo_v1:
            reasoning_text: plain answer
            normal_text: ''
          vllm_python:
            reasoning_text: ''
            normal_text: plain answer
            explanation: vLLM Mistral parser only enters reasoning after the explicit start token.
          sglang_python:
            reasoning_text: ''
            normal_text: plain answer
      REASONING.batch.2.a:
        description: Mistral THINK block
        ref: 'inspired by vLLM Mistral reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_mistral_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: '[THINK]thinking[/THINK]answer'
        expected:
          dynamo_v1: &id001
            reasoning_text: thinking
            normal_text: answer
          vllm_python: *id001
          sglang_python: *id001
      REASONING.batch.3.a:
        description: Mistral reasoning followed by downstream tool-call text
        ref: 'inspired by vLLM Mistral reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_mistral_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: '[THINK]choose tool[/THINK][TOOL_CALLS][{"name": "get_weather", "arguments": {"location": "NYC"}}][/TOOL_CALLS]'
        expected:
          dynamo_v1: &id002
            reasoning_text: choose tool
            normal_text: '[TOOL_CALLS][{"name": "get_weather", "arguments": {"location": "NYC"}}][/TOOL_CALLS]'
          vllm_python: *id002
          sglang_python: *id002
      REASONING.batch.3.b:
        description: Open reasoning interrupted by downstream tool-call text is not configured for Mistral
        ref: 'inspired by vLLM Mistral reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_mistral_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        explanation: Dynamo's Mistral reasoning parser has no downstream tool-call boundary while reasoning is open; closed-span handoff is covered by REASONING.batch.3.a.
      REASONING.batch.2.c:
        description: Mistral reasoning followed by normal answer text
        ref: 'inspired by vLLM Mistral reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_mistral_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: '[THINK]compute[/THINK]answer'
        expected:
          dynamo_v1: &id003
            reasoning_text: compute
            normal_text: answer
          vllm_python: *id003
          sglang_python: *id003
      REASONING.batch.2.d:
        description: Normal text around reasoning is not applicable in force-reasoning mode
        explanation: Force-reasoning parser families start inside reasoning; marker-free prefix text is not a normal-text prefix.
      REASONING.batch.4:
        description: Dangling Mistral end marker without an opening marker
        ref: 'inspired by vLLM Mistral reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_mistral_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: normal[/THINK]answer
        expected:
          dynamo_v1:
            reasoning_text: normal
            normal_text: answer
          vllm_python:
            reasoning_text: ''
            normal_text: normalanswer
            explanation: vLLM Mistral parser treats a dangling end marker as normal text and strips the marker.
          sglang_python:
            reasoning_text: ''
            normal_text: normal[/THINK]answer
      REASONING.batch.5:
        description: Force-reasoning parser treats unterminated text as reasoning
        ref: 'inspired by vLLM Mistral reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_mistral_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: partial reasoning
        expected:
          dynamo_v1:
            reasoning_text: partial reasoning
            normal_text: ''
          vllm_python:
            reasoning_text: ''
            normal_text: partial reasoning
            explanation: vLLM Mistral parser only enters reasoning after the explicit start token.
          sglang_python:
            reasoning_text: ''
            normal_text: partial reasoning
      REASONING.batch.2.e:
        description: Empty Mistral reasoning block
        ref: 'inspired by vLLM Mistral reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_mistral_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: '[THINK][/THINK]answer'
        expected:
          dynamo_v1: &id004
            reasoning_text: ''
            normal_text: answer
          vllm_python: *id004
          sglang_python: *id004
      REASONING.batch.2.f:
        description: Complex Mistral reasoning content with Unicode and newlines
        ref: 'inspired by vLLM Mistral reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_mistral_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: '[THINK]Line 1

          Unicode: café

          JSON-ish: {"x": [1, true]}[/THINK]Done.'
        expected:
          dynamo_v1: &id005
            reasoning_text: 'Line 1

              Unicode: café

              JSON-ish: {"x": [1, true]}'
            normal_text: Done.
          vllm_python: *id005
          sglang_python: *id005
      REASONING.batch.1.a:
        description: Empty input
        ref: 'inspired by vLLM Mistral reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_mistral_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: ''
        expected:
          dynamo_v1: &id006
            reasoning_text: ''
            normal_text: ''
          vllm_python: *id006
          sglang_python: *id006
      REASONING.batch.6.a:
        description: Multiple Mistral reasoning spans are concatenated by Dynamo
        ref: 'inspired by vLLM Mistral reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_mistral_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: '[THINK]first[/THINK] middle [THINK]second[/THINK] done'
        expected:
          dynamo_v1:
            reasoning_text: firstsecond
            normal_text: middle  done
          vllm_python:
            reasoning_text: first
            normal_text: ' middle [THINK]second[/THINK] done'
          sglang_python:
            reasoning_text: first
            normal_text: ' middle [THINK]second[/THINK] done'
      REASONING.batch.6.b:
        description: Stray end marker after a complete reasoning span(unbalanced-tag)
        ref: dynamo
        spec_ref: tests/parity/README.md
        model_text: '[THINK]preamble[/THINK]body[/THINK]answer'
        expected:
          dynamo_v1:
            reasoning_text: preamble
            normal_text: bodyanswer
            explanation: 'Lossless split: when a stray close marker appears outside any reasoning block, it is stripped (parser-owned syntax must not appear in normal_text). Reasoning is captured from the first <open>...<close> pair only; subsequent stray closes are discarded.'
          vllm_python:
            reasoning_text: preamble
            normal_text: body[/THINK]answer
          sglang_python:
            reasoning_text: preamble
            normal_text: body[/THINK]answer
      REASONING.batch.3.c:
        description: Recipientless Harmony commentary is not applicable to Mistral
        explanation: Mistral reasoning parsers do not use Harmony commentary channels; visible text and downstream tool handoff use Mistral-specific reasoning and tool-call markers.
      REASONING.batch.3.d:
        description: Directed Harmony commentary tool calls are not applicable to Mistral
        explanation: Mistral reasoning parsers do not use Harmony `commentary to=functions.*` envelopes; downstream tool calls use Mistral-specific tool-call markers.
      REASONING.batch.3.e:
        description: Directed Harmony analysis tool calls are not applicable to Mistral
        explanation: Mistral reasoning parsers do not use Harmony `analysis to=functions.*` envelopes; reasoning is represented by Mistral THINK tags.
      REASONING.batch.3.f:
        description: Harmony analysis/commentary/final channel sequencing is not applicable to Mistral
        explanation: Mistral reasoning parsers have no Harmony channel protocol, so mixed analysis, commentary tool call, and final-channel sequencing is outside their grammar.
  REASONING.stream.yaml:
    family: mistral
    model_label: Mistral / Magistral
    mode: stream
    captured_with:
      vllm_python: 0.23.0
      sglang_python: 0.5.12.post1
    refs:
      upstream: 'inspired by vLLM Mistral reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_mistral_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
    cases:
      REASONING.stream.1.a:
        description: Empty stream chunk
        ref: 'inspired by vLLM Mistral reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_mistral_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        chunks:
        - ''
        expected:
          dynamo_v1: &id007
            reasoning_text: ''
            normal_text: ''
          vllm_python: *id007
          sglang_python: *id007
      REASONING.stream.2.a:
        description: Mistral THINK block across chunks
        ref: 'inspired by vLLM Mistral reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_mistral_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        chunks:
        - '[THINK]thin'
        - king[/THINK]answer
        expected:
          dynamo_v1: &id008
            reasoning_text: thinking
            normal_text: answer
          vllm_python:
            reasoning_text: '[THINK]thinking'
            normal_text: answer
          sglang_python: *id008
      REASONING.stream.2.b:
        description: Multiple Mistral THINK spans across chunks
        ref: 'inspired by vLLM Mistral reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_mistral_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        chunks:
        - '[THINK]first[/THINK]'
        - ' middle '
        - '[THINK]second[/THINK] done'
        expected:
          dynamo_v1:
            reasoning_text: firstsecond
            normal_text: ' middle  done'
          vllm_python:
            reasoning_text: first
            normal_text: ' middle [THINK]second[/THINK] done'
          sglang_python:
            reasoning_text: first
            normal_text: ' middle [THINK]second[/THINK] done'
      REASONING.stream.3.a:
        description: Start marker split across chunks
        ref: 'inspired by vLLM Mistral reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_mistral_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        chunks:
        - '[TH'
        - INK]thinking[/THINK]answer
        expected:
          dynamo_v1: &id009
            reasoning_text: thinking
            normal_text: answer
          vllm_python:
            reasoning_text: ''
            normal_text: '[THINK]thinking[/THINK]answer'
          sglang_python: *id009
      REASONING.stream.3.b:
        description: End marker split across chunks
        ref: 'inspired by vLLM Mistral reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_mistral_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        chunks:
        - '[THINK]thinking[/TH'
        - INK]answer
        expected:
          dynamo_v1:
            reasoning_text: thinking
            normal_text: answer
          vllm_python:
            reasoning_text: '[THINK]thinking[/THINK]answer'
            normal_text: ''
          sglang_python:
            reasoning_text: thinking[/THINK]answer
            normal_text: ''
      REASONING.stream.3.c:
        description: Partial start-marker prefix later resolves as force-reasoning text
        ref: 'inspired by vLLM Mistral reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_mistral_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        chunks:
        - plain [TH
        - ESIS answer
        expected:
          dynamo_v1:
            reasoning_text: plain [THESIS answer
            normal_text: ''
          vllm_python:
            reasoning_text: ''
            normal_text: plain [THESIS answer
            explanation: vLLM Mistral streaming parser only enters reasoning after an explicit start marker.
          sglang_python:
            reasoning_text: ''
            normal_text: plain [THESIS answer
      REASONING.stream.1.b:
        description: Plain text stays in force-reasoning mode until an end marker
        ref: 'inspired by vLLM Mistral reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_mistral_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        chunks:
        - plain
        - ' answer'
        expected:
          dynamo_v1:
            reasoning_text: plain answer
            normal_text: ''
          vllm_python:
            reasoning_text: ''
            normal_text: plain answer
            explanation: vLLM Mistral streaming parser only enters reasoning after an explicit start marker.
          sglang_python:
            reasoning_text: ''
            normal_text: plain answer
      REASONING.stream.2.c:
        description: Stray end marker after a complete reasoning span, across chunks(unbalanced-tag)
        ref: dynamo
        spec_ref: tests/parity/README.md
        chunks:
        - '[THINK]preamble[/THINK]'
        - body[/THINK]
        - answer
        expected:
          dynamo_v1:
            reasoning_text: preamble
            normal_text: bodyanswer
            explanation: 'Lossless split: when a stray close marker appears outside any reasoning block, it is stripped (parser-owned syntax must not appear in normal_text). Reasoning is captured from the first <open>...<close> pair only; subsequent stray closes are discarded.'
          vllm_python:
            reasoning_text: preamble
            normal_text: body[/THINK]answer
          sglang_python:
            reasoning_text: preamble
            normal_text: body[/THINK]answer
      REASONING.stream.4.a:
        description: Downstream streaming boundary is not applicable to Mistral
        explanation: Mistral has no configured Harmony commentary boundary; closed-span handoff is covered by REASONING.batch.3.a.
      REASONING.stream.4.b:
        description: Split downstream streaming boundary is not applicable to Mistral
        explanation: Mistral has no Harmony `commentary to=functions.*` stream boundary to split across chunks.
      REASONING.stream.4.c:
        description: Partial downstream boundary recovery is not applicable to Mistral
        explanation: Mistral has no Harmony commentary protocol, so partial commentary-boundary recovery is outside its grammar.
      REASONING.stream.4.d:
        description: Directed Harmony analysis tool calls are not applicable to Mistral
        explanation: This parser family does not use Harmony `analysis to=functions.*` envelopes, so split analysis-channel tool-call handoff is outside its grammar.
