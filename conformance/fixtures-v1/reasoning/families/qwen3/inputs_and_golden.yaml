corpus: reasoning
family: qwen3
capture: inputs
documents:
  REASONING.batch.yaml:
    family: qwen3
    model_label: Qwen 3.x
    mode: batch
    captured_with:
      vllm_python: 0.23.0
      sglang_python: 0.5.12.post1
    refs:
      upstream: 'inspired by vLLM Qwen3 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_qwen3_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
    cases:
      REASONING.batch.1.b:
        description: Plain text without reasoning markers
        ref: 'inspired by vLLM Qwen3 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_qwen3_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        spec_ref: lib/parsers/REASONING_CASES.md; https://qwen.readthedocs.io/en/stable/inference/transformers.html#parsing-thinking-content; https://docs.nvidia.com/dynamo/latest/user-guides/parsing/reasoning-parsing-dynamo
        model_text: plain answer
        expected:
          dynamo_v1: &id001
            reasoning_text: ''
            normal_text: plain answer
          vllm_python:
            reasoning_text: plain answer
            normal_text: ''
            explanation: vLLM Qwen batch parser treats marker-free text as reasoning.
          sglang_python: *id001
      REASONING.batch.2.a:
        description: Single reasoning block
        ref: 'inspired by vLLM Qwen3 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_qwen3_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: <think>thinking</think>answer
        expected:
          dynamo_v1: &id002
            reasoning_text: thinking
            normal_text: answer
          vllm_python: *id002
          sglang_python: *id002
      REASONING.batch.3.a:
        description: Reasoning followed by downstream tool-call text
        ref: 'inspired by vLLM Qwen3 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_qwen3_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: '<think>choose the weather tool</think><tool_call>

          <function=get_weather>

          <parameter=location>

          NYC

          </parameter>

          </function>

          </tool_call>'
        expected:
          dynamo_v1: &id003
            reasoning_text: choose the weather tool
            normal_text: '<tool_call>

              <function=get_weather>

              <parameter=location>

              NYC

              </parameter>

              </function>

              </tool_call>'
          vllm_python: *id003
          sglang_python: *id003
      REASONING.batch.3.b:
        description: Open reasoning interrupted by downstream tool-call text is not configured for Qwen3
        ref: 'inspired by vLLM Qwen3 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_qwen3_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        explanation: Dynamo's qwen3 reasoning parser has no downstream tool-call boundary while reasoning is open; closed-span handoff is covered by REASONING.batch.3.a.
      REASONING.batch.2.c:
        description: Reasoning followed by normal answer text
        ref: 'inspired by vLLM Qwen3 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_qwen3_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: <think>compute</think>answer
        expected:
          dynamo_v1: &id004
            reasoning_text: compute
            normal_text: answer
          vllm_python: *id004
          sglang_python: *id004
      REASONING.batch.2.d:
        description: Normal text around reasoning
        ref: 'inspired by vLLM Qwen3 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_qwen3_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        spec_ref: lib/parsers/REASONING_CASES.md; https://qwen.readthedocs.io/en/stable/inference/transformers.html#parsing-thinking-content; https://docs.nvidia.com/dynamo/latest/user-guides/parsing/reasoning-parsing-dynamo
        model_text: before <think>thinking</think> after
        expected:
          dynamo_v1:
            reasoning_text: thinking
            normal_text: before  after
          vllm_python:
            reasoning_text: thinking
            normal_text: ' after'
            explanation: Dynamo keeps visible text outside a complete reasoning span as normal_text; vLLM drops the prefix.
          sglang_python:
            reasoning_text: before thinking
            normal_text: ' after'
            explanation: Dynamo keeps text emitted before the reasoning open marker as normal_text; SGLang strips the start marker in place and folds that prefix into reasoning_text.
      REASONING.batch.4:
        description: Dangling end marker without an opening think tag
        ref: 'inspired by vLLM Qwen3 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_qwen3_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: normal</think>answer
        expected:
          dynamo_v1:
            reasoning_text: normal
            normal_text: answer
          vllm_python:
            reasoning_text: normal
            normal_text: answer
          sglang_python:
            reasoning_text: ''
            normal_text: normal</think>answer
            explanation: Dynamo treats the text before an unpaired end marker as reasoning (implicit-opener recovery, matching vLLM); SGLang enters reasoning only on an explicit start marker, so the dangling end marker and surrounding text stay in normal_text.
      REASONING.batch.5:
        description: Missing end marker keeps the remaining text as reasoning
        ref: 'inspired by vLLM Qwen3 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_qwen3_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: <think>partial reasoning
        expected:
          dynamo_v1: &id005
            reasoning_text: partial reasoning
            normal_text: ''
          vllm_python: *id005
          sglang_python: *id005
      REASONING.batch.2.e:
        description: Empty reasoning block
        ref: 'inspired by vLLM Qwen3 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_qwen3_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: <think></think>answer
        expected:
          dynamo_v1: &id006
            reasoning_text: ''
            normal_text: answer
          vllm_python: *id006
          sglang_python: *id006
      REASONING.batch.2.f:
        description: Complex reasoning content with Unicode and newlines
        ref: 'inspired by vLLM Qwen3 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_qwen3_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: '<think>Line 1

          Unicode: café

          JSON-ish: {"x": [1, true]}</think>Done.'
        expected:
          dynamo_v1: &id007
            reasoning_text: 'Line 1

              Unicode: café

              JSON-ish: {"x": [1, true]}'
            normal_text: Done.
          vllm_python: *id007
          sglang_python: *id007
      REASONING.batch.1.a:
        description: Empty input
        ref: 'inspired by vLLM Qwen3 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_qwen3_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: ''
        expected:
          dynamo_v1: &id008
            reasoning_text: ''
            normal_text: ''
          vllm_python: *id008
          sglang_python: *id008
      REASONING.batch.6.a:
        description: Multiple reasoning spans are concatenated
        ref: 'inspired by vLLM Qwen3 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_qwen3_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        spec_ref: lib/parsers/REASONING_CASES.md; https://qwen.readthedocs.io/en/stable/inference/transformers.html#parsing-thinking-content; https://docs.nvidia.com/dynamo/latest/user-guides/parsing/reasoning-parsing-dynamo
        model_text: <think>first</think> middle <think>second</think> done
        expected:
          dynamo_v1:
            reasoning_text: firstsecond
            normal_text: middle  done
          vllm_python:
            reasoning_text: first
            normal_text: ' middle <think>second</think> done'
            explanation: Dynamo extracts each complete reasoning span; vLLM leaves the later complete span in normal_text.
          sglang_python:
            reasoning_text: first
            normal_text: ' middle <think>second</think> done'
            explanation: Dynamo extracts every complete reasoning span and concatenates them; SGLang exits reasoning at the first end marker and leaves the later span, with its literal markers, in normal_text.
      REASONING.batch.6.b:
        description: Stray end marker after a complete reasoning span(unbalanced-tag)
        ref: dynamo
        spec_ref: tests/parity/README.md
        model_text: <think>preamble</think>body</think>answer
        expected:
          dynamo_v1:
            reasoning_text: preamble
            normal_text: bodyanswer
            explanation: 'Lossless split: when a stray close marker appears outside any reasoning block, it is stripped (parser-owned syntax must not appear in normal_text). Reasoning is captured from the first <open>...<close> pair only; subsequent stray closes are discarded.'
          vllm_python:
            reasoning_text: preamble
            normal_text: body</think>answer
          sglang_python:
            reasoning_text: preamble
            normal_text: body</think>answer
      REASONING.batch.3.c:
        description: Recipientless Harmony commentary is not applicable to Qwen3
        explanation: Qwen3 does not use Harmony commentary channels; visible text and downstream tool handoff use Qwen-specific think and tool-call markers.
      REASONING.batch.3.d:
        description: Directed Harmony commentary tool calls are not applicable to Qwen3
        explanation: Qwen3 does not use Harmony `commentary to=functions.*` envelopes; downstream tool calls use Qwen-specific tool-call markers.
      REASONING.batch.3.e:
        description: Directed Harmony analysis tool calls are not applicable to Qwen3
        explanation: Qwen3 does not use Harmony `analysis to=functions.*` envelopes; reasoning is represented by think tags.
      REASONING.batch.3.f:
        description: Harmony analysis/commentary/final channel sequencing is not applicable to Qwen3
        explanation: Qwen3 has no Harmony channel protocol, so mixed analysis, commentary tool call, and final-channel sequencing is outside its grammar.
  REASONING.stream.yaml:
    family: qwen3
    model_label: Qwen 3.x
    mode: stream
    captured_with:
      vllm_python: 0.23.0
      sglang_python: 0.5.12.post1
    refs:
      upstream: 'inspired by vLLM Qwen3 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_qwen3_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
    cases:
      REASONING.stream.1.a:
        description: Empty stream chunk
        ref: 'inspired by vLLM Qwen3 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_qwen3_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        chunks:
        - ''
        expected:
          dynamo_v1: &id009
            reasoning_text: ''
            normal_text: ''
          vllm_python: *id009
          sglang_python: *id009
      REASONING.stream.2.a:
        description: Single reasoning block across chunks
        ref: 'inspired by vLLM Qwen3 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_qwen3_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        chunks:
        - <think>thin
        - king</think>
        - answer
        expected:
          dynamo_v1: &id010
            reasoning_text: thinking
            normal_text: answer
          vllm_python: *id010
          sglang_python: *id010
      REASONING.stream.2.b:
        description: Multiple reasoning spans across chunks
        ref: 'inspired by vLLM Qwen3 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_qwen3_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        spec_ref: lib/parsers/REASONING_CASES.md; https://qwen.readthedocs.io/en/stable/inference/transformers.html#parsing-thinking-content; https://docs.nvidia.com/dynamo/latest/user-guides/parsing/reasoning-parsing-dynamo
        chunks:
        - <think>first</think>
        - ' middle '
        - <think>second</think> done
        expected:
          dynamo_v1:
            reasoning_text: firstsecond
            normal_text: ' middle  done'
          vllm_python:
            reasoning_text: first
            normal_text: ' middle <think>second</think> done'
            explanation: Dynamo extracts each complete reasoning span across chunks; vLLM leaves the later complete span in normal_text.
          sglang_python:
            reasoning_text: first
            normal_text: ' middle <think>second</think> done'
            explanation: Dynamo re-enters reasoning on each open marker across chunks and concatenates all spans; SGLang exits at the first end marker and does not re-enter, leaving the later span in normal_text.
      REASONING.stream.3.a:
        description: Start marker split across chunks
        ref: 'inspired by vLLM Qwen3 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_qwen3_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        spec_ref: lib/parsers/REASONING_CASES.md; https://qwen.readthedocs.io/en/stable/inference/transformers.html#parsing-thinking-content; https://docs.nvidia.com/dynamo/latest/user-guides/parsing/reasoning-parsing-dynamo
        chunks:
        - <th
        - ink>thinking</think>answer
        expected:
          dynamo_v1: &id011
            reasoning_text: thinking
            normal_text: answer
          vllm_python:
            reasoning_text: <think>thinking
            normal_text: answer
            explanation: Dynamo buffers a split start delimiter and strips it; vLLM leaks the reconstructed delimiter.
          sglang_python: *id011
      REASONING.stream.3.b:
        description: End marker split across chunks
        ref: 'inspired by vLLM Qwen3 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_qwen3_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        spec_ref: lib/parsers/REASONING_CASES.md; https://qwen.readthedocs.io/en/stable/inference/transformers.html#parsing-thinking-content; https://docs.nvidia.com/dynamo/latest/user-guides/parsing/reasoning-parsing-dynamo
        chunks:
        - <think>thinking</th
        - ink>answer
        expected:
          dynamo_v1:
            reasoning_text: thinking
            normal_text: answer
          vllm_python:
            reasoning_text: thinking</think>answer
            normal_text: ''
            explanation: Dynamo buffers a split end delimiter and resumes normal_text after it; vLLM keeps the delimiter and answer in reasoning_text.
          sglang_python:
            reasoning_text: thinking</think>answer
            normal_text: ''
            explanation: Dynamo buffers an end marker split across chunk boundaries and resumes normal_text after it; SGLang streams the partial delimiter as reasoning (it only holds back a partial marker when the whole pending buffer is a marker prefix), so the split marker is never reassembled and the answer stays in reasoning_text.
      REASONING.stream.3.c:
        description: Partial start-marker prefix later becomes normal text
        ref: 'inspired by vLLM Qwen3 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_qwen3_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        spec_ref: lib/parsers/REASONING_CASES.md; https://qwen.readthedocs.io/en/stable/inference/transformers.html#parsing-thinking-content; https://docs.nvidia.com/dynamo/latest/user-guides/parsing/reasoning-parsing-dynamo
        chunks:
        - plain <th
        - esis answer
        expected:
          dynamo_v1: &id012
            reasoning_text: ''
            normal_text: plain <thesis answer
          vllm_python:
            reasoning_text: plain <thesis answer
            normal_text: ''
            explanation: vLLM Qwen streaming parser treats marker-free stream text as reasoning in this shape.
          sglang_python: *id012
      REASONING.stream.1.b:
        description: Plain text never enters reasoning mode
        ref: 'inspired by vLLM Qwen3 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_qwen3_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        spec_ref: lib/parsers/REASONING_CASES.md; https://qwen.readthedocs.io/en/stable/inference/transformers.html#parsing-thinking-content; https://docs.nvidia.com/dynamo/latest/user-guides/parsing/reasoning-parsing-dynamo
        chunks:
        - plain
        - ' answer'
        expected:
          dynamo_v1: &id013
            reasoning_text: ''
            normal_text: plain answer
          vllm_python:
            reasoning_text: plain answer
            normal_text: ''
            explanation: vLLM Qwen streaming parser treats text before a reasoning end marker as reasoning; serving may bypass it when thinking is disabled.
          sglang_python: *id013
      REASONING.stream.2.c:
        description: Stray end marker after a complete reasoning span, across chunks(unbalanced-tag)
        ref: dynamo
        spec_ref: tests/parity/README.md
        chunks:
        - <think>preamble</think>
        - body</think>
        - answer
        expected:
          dynamo_v1:
            reasoning_text: preamble
            normal_text: bodyanswer
            explanation: 'Lossless split: when a stray close marker appears outside any reasoning block, it is stripped (parser-owned syntax must not appear in normal_text). Reasoning is captured from the first <open>...<close> pair only; subsequent stray closes are discarded.'
          vllm_python:
            reasoning_text: preamble
            normal_text: body</think>answer
          sglang_python:
            reasoning_text: preamble
            normal_text: body</think>answer
      REASONING.stream.4.a:
        description: Downstream streaming boundary is not applicable to Qwen3
        explanation: Qwen3 has no configured tool-call start marker that force-exits open streaming reasoning; closed-span handoff is covered by REASONING.batch.3.a.
      REASONING.stream.4.b:
        description: Split downstream streaming boundary is not applicable to Qwen3
        explanation: Qwen3 has no configured tool-call start marker that force-exits open streaming reasoning, so there is no split downstream boundary to buffer.
      REASONING.stream.4.c:
        description: Partial downstream boundary recovery is not applicable to Qwen3
        explanation: Qwen3 has no configured tool-call start marker that force-exits open streaming reasoning, so partial tool-marker recovery is outside its grammar.
      REASONING.stream.4.d:
        description: Directed Harmony analysis tool calls are not applicable to Qwen3
        explanation: This parser family does not use Harmony `analysis to=functions.*` envelopes, so split analysis-channel tool-call handoff is outside its grammar.
