corpus: reasoning
family: granite
capture: inputs
documents:
  REASONING.batch.yaml:
    family: granite
    model_label: Granite
    mode: batch
    captured_with:
      vllm_python: 0.23.0
    refs:
      upstream: 'inspired by vLLM Granite reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_granite_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
    cases:
      REASONING.batch.1.b:
        description: Plain text without Granite reasoning markers
        ref: 'inspired by vLLM Granite reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_granite_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: plain answer
        expected:
          dynamo_v1:
            reasoning_text: ''
            normal_text: plain answer
          vllm_python:
            reasoning_text: ''
            normal_text: plain answer
          sglang_python:
            unavailable: SGLang has no reasoning parser for family='granite'
      REASONING.batch.2.a:
        description: Granite thought-process marker
        ref: 'inspired by vLLM Granite reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_granite_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: 'Here is my thought process: thinking Here is my response: answer'
        expected:
          dynamo_v1:
            reasoning_text: 'thinking '
            normal_text: answer
          vllm_python:
            reasoning_text: ' thinking '
            normal_text: ' answer'
          sglang_python:
            unavailable: SGLang has no reasoning parser for family='granite'
      REASONING.batch.3.a:
        description: Granite reasoning followed by downstream tool-call text is not covered by a paired Dynamo tool call parser
        ref: 'inspired by vLLM Granite reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_granite_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        explanation: Granite reasoning parsing has no paired Dynamo tool call parser fixture, so downstream handoff is outside this seed fixture set.
      REASONING.batch.2.c:
        description: Granite reasoning followed by normal answer text
        ref: 'inspired by vLLM Granite reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_granite_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: 'Here is my thought process: compute Here is my response: answer'
        expected:
          dynamo_v1:
            reasoning_text: 'compute '
            normal_text: answer
          vllm_python:
            reasoning_text: ' compute '
            normal_text: ' answer'
          sglang_python:
            unavailable: SGLang has no reasoning parser for family='granite'
      REASONING.batch.4:
        description: Dangling Granite response marker without a thought marker
        ref: 'inspired by vLLM Granite reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_granite_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: 'normal Here is my response: answer'
        expected:
          dynamo_v1:
            reasoning_text: ''
            normal_text: normal answer
          vllm_python:
            reasoning_text: ''
            normal_text: 'normal Here is my response: answer'
            explanation: vLLM leaves a dangling response marker (no preceding thought-process marker) in content; Dynamo consumes the marker so no markup leaks into normal_text.
          sglang_python:
            unavailable: SGLang has no reasoning parser for family='granite'
      REASONING.batch.5:
        description: Start marker without response marker keeps suffix as reasoning
        ref: 'inspired by vLLM Granite reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_granite_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: 'Here is my thought process: partial reasoning'
        expected:
          dynamo_v1:
            reasoning_text: partial reasoning
            normal_text: ''
          vllm_python:
            reasoning_text: ''
            normal_text: 'Here is my thought process: partial reasoning'
          sglang_python:
            unavailable: SGLang has no reasoning parser for family='granite'
      REASONING.batch.2.e:
        description: Empty Granite thought-process span
        ref: 'inspired by vLLM Granite reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_granite_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: 'Here is my thought process: Here is my response: answer'
        expected:
          dynamo_v1:
            reasoning_text: ''
            normal_text: answer
          vllm_python:
            reasoning_text: ''
            normal_text: ' answer'
          sglang_python:
            unavailable: SGLang has no reasoning parser for family='granite'
      REASONING.batch.2.f:
        description: Complex Granite reasoning content with Unicode and newlines
        ref: 'inspired by vLLM Granite reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_granite_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: 'Here is my thought process: Line 1

          Unicode: café

          JSON-ish: {"x": [1, true]} Here is my response: Done.'
        expected:
          dynamo_v1:
            reasoning_text: 'Line 1

              Unicode: café

              JSON-ish: {"x": [1, true]} '
            normal_text: Done.
          vllm_python:
            reasoning_text: ' Line 1

              Unicode: café

              JSON-ish: {"x": [1, true]} '
            normal_text: ' Done.'
          sglang_python:
            unavailable: SGLang has no reasoning parser for family='granite'
      REASONING.batch.1.a:
        description: Empty input
        ref: 'inspired by vLLM Granite reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_granite_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: ''
        expected:
          dynamo_v1:
            reasoning_text: ''
            normal_text: ''
          vllm_python:
            reasoning_text: ''
            normal_text: ''
          sglang_python:
            unavailable: SGLang has no reasoning parser for family='granite'
      REASONING.batch.6.a:
        description: Granite reasoning with multiple thought-process / response spans
        ref: 'inspired by vLLM Granite reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_granite_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: 'Here is my thought process: first Here is my response: middle Here is my thought process: second Here is my response: done'
        expected:
          dynamo_v1:
            reasoning_text: first second
            normal_text: middle done
          vllm_python:
            reasoning_text: ' first '
            normal_text: ' middle Here is my thought process: second Here is my response: done'
            explanation: vLLM stops after the first span and leaves the second span's markers in content; Dynamo consumes every thought-process / response marker so none leak.
          sglang_python:
            unavailable: SGLang has no reasoning parser for family='granite'
      REASONING.batch.2.d:
        description: Normal text before and after Granite thought-process markers
        ref: 'inspired by vLLM Granite reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_granite_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: 'before Here is my thought process: thinking Here is my response: after'
        expected:
          dynamo_v1:
            reasoning_text: 'before  thinking '
            normal_text: after
          vllm_python:
            reasoning_text: ' thinking '
            normal_text: ' after'
          sglang_python:
            unavailable: SGLang has no reasoning parser for family='granite'
      REASONING.batch.3.b:
        description: Open Granite reasoning interrupted by downstream tool-call text is not covered by a paired Dynamo tool call parser
        ref: 'inspired by vLLM Granite reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_granite_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        explanation: Granite reasoning parsing has no paired Dynamo tool call parser fixture or open-reasoning tool boundary in this seed fixture set.
      REASONING.batch.6.b:
        description: Stray end marker after a complete reasoning span(unbalanced-tag)
        ref: dynamo
        spec_ref: tests/parity/README.md
        model_text: ''
        expected:
          dynamo_v1:
            unavailable: 'Pattern not applicable: granite does not use paired open/close markers, so the 1-open + 2-close unbalanced-tag shape has no direct analog.'
          vllm_python:
            unavailable: 'Pattern not applicable: granite does not use paired open/close markers, so the 1-open + 2-close unbalanced-tag shape has no direct analog.'
          sglang_python:
            unavailable: 'UNAVAILABLE: SGLang has no reasoning parser for family=''granite'''
      REASONING.batch.3.c:
        description: Recipientless Harmony commentary is not applicable to Granite
        explanation: Granite does not use Harmony commentary channels; visible text and reasoning are separated by Granite thought-process and response markers.
      REASONING.batch.3.d:
        description: Directed Harmony commentary tool calls are not applicable to Granite
        explanation: Granite does not use Harmony `commentary to=functions.*` envelopes and has no paired Dynamo Harmony tool-call parser fixture.
      REASONING.batch.3.e:
        description: Directed Harmony analysis tool calls are not applicable to Granite
        explanation: Granite does not use Harmony `analysis to=functions.*` envelopes; reasoning is represented by Granite thought-process markers.
      REASONING.batch.3.f:
        description: Harmony analysis/commentary/final channel sequencing is not applicable to Granite
        explanation: Granite has no Harmony channel protocol, so mixed analysis, commentary tool call, and final-channel sequencing is outside its grammar.
  REASONING.stream.yaml:
    family: granite
    model_label: Granite
    mode: stream
    captured_with:
      vllm_python: 0.23.0
    refs:
      upstream: 'inspired by vLLM Granite reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_granite_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
    cases:
      REASONING.stream.1.a:
        description: Empty stream chunk
        ref: 'inspired by vLLM Granite reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_granite_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        chunks:
        - ''
        expected:
          dynamo_v1:
            reasoning_text: ''
            normal_text: ''
          vllm_python:
            reasoning_text: ''
            normal_text: ''
          sglang_python:
            unavailable: SGLang has no reasoning parser for family='granite'
      REASONING.stream.2.a:
        description: Granite thought-process marker across chunks
        ref: 'inspired by vLLM Granite reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_granite_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        chunks:
        - 'Here is my thought process: thin'
        - 'king Here is my response:'
        - ' answer'
        expected:
          dynamo_v1:
            reasoning_text: ' thinking '
            normal_text: ' answer'
          vllm_python:
            reasoning_text: 'Here is my thought process: thin'
            normal_text: ' answer'
          sglang_python:
            unavailable: SGLang has no reasoning parser for family='granite'
      REASONING.stream.2.b:
        description: Multiple thought-process spans across chunks
        ref: 'inspired by vLLM Granite reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_granite_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        chunks:
        - 'Here is my thought process: first Here is my response:'
        - ' middle '
        - 'Here is my thought process: second Here is my response: done'
        expected:
          dynamo_v1:
            reasoning_text: ' first  second '
            normal_text: ' middle  done'
          vllm_python:
            reasoning_text: ''
            normal_text: ' middle Here is my thought process: second Here is my response: done'
            explanation: vLLM stops after the first span and leaves the second span's markers in content; Dynamo re-enters reasoning on the later thought-process marker so none leak.
          sglang_python:
            unavailable: SGLang has no reasoning parser for family='granite'
      REASONING.stream.3.a:
        description: Start marker split across chunks
        ref: 'inspired by vLLM Granite reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_granite_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        chunks:
        - Here is my
        - ' thought process: thinking Here is my response: answer'
        expected:
          dynamo_v1:
            reasoning_text: ' thinking '
            normal_text: ' answer'
          vllm_python:
            reasoning_text: 'g '
            normal_text: ' answer'
            explanation: vLLM Granite streaming parser loses the prefix of the split start-marker span.
          sglang_python:
            unavailable: SGLang has no reasoning parser for family='granite'
      REASONING.stream.3.b:
        description: End marker split across chunks
        ref: 'inspired by vLLM Granite reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_granite_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        chunks:
        - 'Here is my thought process: thinking Here is my res'
        - 'ponse: answer'
        expected:
          dynamo_v1:
            reasoning_text: ' thinking '
            normal_text: ' answer'
          vllm_python:
            reasoning_text: 'Here is my thought process: thinking '
            normal_text: ' answer'
            explanation: vLLM retains the start marker in reasoning_text; Dynamo buffers the split response marker until complete so neither marker leaks.
          sglang_python:
            unavailable: SGLang has no reasoning parser for family='granite'
      REASONING.stream.3.c:
        description: Partial phrase prefix later becomes normal text
        ref: 'inspired by vLLM Granite reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_granite_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        chunks:
        - plain Here is my thou
        - ghtful answer
        expected:
          dynamo_v1:
            reasoning_text: ''
            normal_text: plain Here is my thoughtful answer
          vllm_python:
            reasoning_text: ''
            normal_text: plain Here is my thoughtful answer
          sglang_python:
            unavailable: SGLang has no reasoning parser for family='granite'
      REASONING.stream.1.b:
        description: Plain text never enters reasoning mode
        ref: 'inspired by vLLM Granite reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_granite_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        chunks:
        - plain
        - ' answer'
        expected:
          dynamo_v1:
            reasoning_text: ''
            normal_text: plain answer
          vllm_python:
            reasoning_text: ''
            normal_text: plain answer
          sglang_python:
            unavailable: SGLang has no reasoning parser for family='granite'
      REASONING.stream.2.c:
        description: Stray end marker after a complete reasoning span, across chunks(unbalanced-tag)
        ref: dynamo
        spec_ref: tests/parity/README.md
        chunks: []
        expected:
          dynamo_v1:
            unavailable: 'Pattern not applicable: granite parser does not use paired open/close markers, so the unbalanced-tag shape has no analog.'
          vllm_python:
            unavailable: 'Pattern not applicable: granite parser does not use paired open/close markers, so the unbalanced-tag shape has no analog.'
          sglang_python:
            unavailable: 'UNAVAILABLE: SGLang has no reasoning parser for family=''granite'''
      REASONING.stream.4.a:
        description: Downstream streaming boundary is not applicable to Granite
        explanation: Granite has no configured Harmony commentary boundary; it has no paired Dynamo Harmony tool-call parser fixture.
      REASONING.stream.4.b:
        description: Split downstream streaming boundary is not applicable to Granite
        explanation: Granite has no Harmony `commentary to=functions.*` stream boundary to split across chunks.
      REASONING.stream.4.c:
        description: Partial downstream boundary recovery is not applicable to Granite
        explanation: Granite has no Harmony commentary protocol, so partial commentary-boundary recovery is outside its grammar.
      REASONING.stream.4.d:
        description: Directed Harmony analysis tool calls are not applicable to Granite
        explanation: This parser family does not use Harmony `analysis to=functions.*` envelopes, so split analysis-channel tool-call handoff is outside its grammar.
