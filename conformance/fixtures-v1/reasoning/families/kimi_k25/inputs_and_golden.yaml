corpus: reasoning
family: kimi_k25
capture: inputs
documents:
  REASONING.batch.yaml:
    family: kimi_k25
    model_label: Kimi K2.5 / K2.6
    mode: batch
    captured_with:
      vllm_python: 0.23.0
      sglang_python: 0.5.12.post1
    refs:
      upstream: 'inspired by vLLM Kimi K2/K2.5 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_kimi_k2_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
    cases:
      REASONING.batch.1.b:
        description: Plain text stays in force-reasoning mode
        ref: 'inspired by vLLM Kimi K2/K2.5 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_kimi_k2_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        force_reasoning: true
        model_text: plain answer
        expected:
          dynamo_v1:
            reasoning_text: plain answer
            normal_text: ''
          vllm_python:
            reasoning_text: plain answer
            normal_text: ''
          sglang_python:
            reasoning_text: plain answer
            normal_text: ''
      REASONING.batch.2.a:
        description: Force-reasoning parser with explicit think tags
        ref: 'inspired by vLLM Kimi K2/K2.5 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_kimi_k2_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        force_reasoning: true
        model_text: <think>thinking</think>answer
        expected:
          dynamo_v1:
            reasoning_text: thinking
            normal_text: answer
          vllm_python:
            reasoning_text: thinking
            normal_text: answer
          sglang_python:
            reasoning_text: thinking
            normal_text: answer
      REASONING.batch.3.b:
        description: Tool-call section marker force-exits an open reasoning block
        ref: 'inspired by vLLM Kimi K2/K2.5 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_kimi_k2_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        force_reasoning: true
        model_text: thinking <|tool_calls_section_begin|><|tool_call_begin|>functions.get_weather:0<|tool_call_argument_begin|>{"location":"NYC"}<|tool_call_end|><|tool_calls_section_end|>
        expected:
          dynamo_v1:
            reasoning_text: 'thinking '
            normal_text: <|tool_calls_section_begin|><|tool_call_begin|>functions.get_weather:0<|tool_call_argument_begin|>{"location":"NYC"}<|tool_call_end|><|tool_calls_section_end|>
          vllm_python:
            reasoning_text: 'thinking '
            normal_text: <|tool_calls_section_begin|><|tool_call_begin|>functions.get_weather:0<|tool_call_argument_begin|>{"location":"NYC"}<|tool_call_end|><|tool_calls_section_end|>
          sglang_python:
            reasoning_text: 'thinking '
            normal_text: <|tool_calls_section_begin|><|tool_call_begin|>functions.get_weather:0<|tool_call_argument_begin|>{"location":"NYC"}<|tool_call_end|><|tool_calls_section_end|>
      REASONING.batch.2.c:
        description: Force-reasoning parser treats plain output as reasoning
        ref: 'inspired by vLLM Kimi K2/K2.5 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_kimi_k2_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        force_reasoning: true
        model_text: thinking without explicit tags
        expected:
          dynamo_v1:
            reasoning_text: thinking without explicit tags
            normal_text: ''
          vllm_python:
            reasoning_text: thinking without explicit tags
            normal_text: ''
          sglang_python:
            reasoning_text: thinking without explicit tags
            normal_text: ''
      REASONING.batch.4:
        description: Dangling end marker exits force-reasoning mode
        ref: 'inspired by vLLM Kimi K2/K2.5 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_kimi_k2_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        force_reasoning: true
        model_text: normal</think>answer
        expected:
          dynamo_v1:
            reasoning_text: normal
            normal_text: answer
          vllm_python:
            reasoning_text: normal
            normal_text: answer
          sglang_python:
            reasoning_text: normal
            normal_text: answer
      REASONING.batch.5:
        description: Missing end marker keeps the remaining text as reasoning
        ref: 'inspired by vLLM Kimi K2/K2.5 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_kimi_k2_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        force_reasoning: true
        model_text: partial reasoning
        expected:
          dynamo_v1:
            reasoning_text: partial reasoning
            normal_text: ''
          vllm_python:
            reasoning_text: partial reasoning
            normal_text: ''
          sglang_python:
            reasoning_text: partial reasoning
            normal_text: ''
      REASONING.batch.2.e:
        description: Empty reasoning block
        ref: 'inspired by vLLM Kimi K2/K2.5 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_kimi_k2_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        force_reasoning: true
        model_text: <think></think>answer
        expected:
          dynamo_v1:
            reasoning_text: ''
            normal_text: answer
          vllm_python:
            reasoning_text: ''
            normal_text: answer
          sglang_python:
            reasoning_text: ''
            normal_text: answer
      REASONING.batch.2.f:
        description: Complex reasoning content with Unicode and newlines
        ref: 'inspired by vLLM Kimi K2/K2.5 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_kimi_k2_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        force_reasoning: true
        model_text: '<think>Line 1

          Unicode: café

          JSON-ish: {"x": [1, true]}</think>Done.'
        expected:
          dynamo_v1:
            reasoning_text: 'Line 1

              Unicode: café

              JSON-ish: {"x": [1, true]}'
            normal_text: Done.
          vllm_python:
            reasoning_text: 'Line 1

              Unicode: café

              JSON-ish: {"x": [1, true]}'
            normal_text: Done.
          sglang_python:
            reasoning_text: 'Line 1

              Unicode: café

              JSON-ish: {"x": [1, true]}'
            normal_text: Done.
      REASONING.batch.1.a:
        description: Empty input
        ref: 'inspired by vLLM Kimi K2/K2.5 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_kimi_k2_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        force_reasoning: true
        model_text: ''
        expected:
          dynamo_v1:
            reasoning_text: ''
            normal_text: ''
          vllm_python:
            reasoning_text: ''
            normal_text: ''
          sglang_python:
            reasoning_text: ''
            normal_text: ''
      REASONING.batch.6.a:
        description: Multiple reasoning spans are concatenated
        ref: 'inspired by vLLM Kimi K2/K2.5 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_kimi_k2_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        force_reasoning: true
        model_text: <think>first</think> middle <think>second</think> done
        expected:
          dynamo_v1:
            reasoning_text: firstsecond
            normal_text: middle  done
          vllm_python:
            reasoning_text: first
            normal_text: ' middle <think>second</think> done'
            explanation: Dynamo extracts each complete reasoning span; vLLM Kimi K2 parser leaves the later complete span in normal_text.
          sglang_python:
            reasoning_text: first
            normal_text: ' middle <think>second</think> done'
            explanation: Dynamo extracts every complete reasoning span and concatenates them; SGLang exits reasoning at the first end marker and leaves the later span, with its literal markers, in normal_text.
      REASONING.batch.2.d:
        description: Normal text around reasoning is not applicable in force-reasoning mode
        explanation: Force-reasoning parser families start inside reasoning; marker-free prefix text is not a normal-text prefix.
      REASONING.batch.3.a:
        description: Closed reasoning span followed by Kimi tool-call section marker
        ref: 'inspired by vLLM Kimi K2/K2.5 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_kimi_k2_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        force_reasoning: true
        model_text: <think>choose tool</think><|tool_calls_section_begin|><|tool_call_begin|>functions.get_weather:0<|tool_call_argument_begin|>{"location":"NYC"}<|tool_call_end|><|tool_calls_section_end|>
        expected:
          dynamo_v1:
            reasoning_text: choose tool
            normal_text: <|tool_calls_section_begin|><|tool_call_begin|>functions.get_weather:0<|tool_call_argument_begin|>{"location":"NYC"}<|tool_call_end|><|tool_calls_section_end|>
          vllm_python:
            reasoning_text: choose tool
            normal_text: <|tool_calls_section_begin|><|tool_call_begin|>functions.get_weather:0<|tool_call_argument_begin|>{"location":"NYC"}<|tool_call_end|><|tool_calls_section_end|>
          sglang_python:
            reasoning_text: choose tool
            normal_text: <|tool_calls_section_begin|><|tool_call_begin|>functions.get_weather:0<|tool_call_argument_begin|>{"location":"NYC"}<|tool_call_end|><|tool_calls_section_end|>
      REASONING.batch.6.b:
        description: Stray end marker after a complete reasoning span(unbalanced-tag)
        ref: dynamo
        spec_ref: tests/parity/README.md
        model_text: <think>preamble</think>body</think>answer
        expected:
          dynamo_v1:
            reasoning_text: preamble
            normal_text: bodyanswer
            explanation: 'Lossless split: when a stray close marker appears outside any reasoning block, it is stripped (parser-owned syntax must not appear in normal_text). Reasoning is captured from the first <open>...<close> pair only; subsequent stray closes are discarded.'
          vllm_python:
            reasoning_text: preamble
            normal_text: body</think>answer
          sglang_python:
            reasoning_text: preamble
            normal_text: body</think>answer
      REASONING.batch.3.c:
        description: Recipientless Harmony commentary is not applicable to Kimi K2.5
        explanation: Kimi K2.5 uses Kimi tool-section markers, not Harmony commentary channels; visible text and downstream tool handoff use Kimi-specific markers.
      REASONING.batch.3.d:
        description: Directed Harmony commentary tool calls are not applicable to Kimi K2.5
        explanation: Kimi K2.5 does not use Harmony `commentary to=functions.*` envelopes; downstream tool calls use Kimi tool-section markers.
      REASONING.batch.3.e:
        description: Directed Harmony analysis tool calls are not applicable to Kimi K2.5
        explanation: Kimi K2.5 does not use Harmony `analysis to=functions.*` envelopes; reasoning is represented by think tags.
      REASONING.batch.3.f:
        description: Harmony analysis/commentary/final channel sequencing is not applicable to Kimi K2.5
        explanation: Kimi K2.5 has no Harmony channel protocol, so mixed analysis, commentary tool call, and final-channel sequencing is outside its grammar.
  REASONING.stream.yaml:
    family: kimi_k25
    model_label: Kimi K2.5 / K2.6
    mode: stream
    captured_with:
      vllm_python: 0.23.0
      sglang_python: 0.5.12.post1
    refs:
      upstream: 'inspired by vLLM Kimi K2/K2.5 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_kimi_k2_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
    cases:
      REASONING.stream.1.a:
        description: Empty stream chunk
        ref: 'inspired by vLLM Kimi K2/K2.5 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_kimi_k2_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        force_reasoning: true
        chunks:
        - ''
        expected:
          dynamo_v1:
            reasoning_text: ''
            normal_text: ''
          vllm_python:
            reasoning_text: ''
            normal_text: ''
          sglang_python:
            reasoning_text: ''
            normal_text: ''
      REASONING.stream.2.a:
        description: Force-reasoning stream exits on closing think tag
        ref: 'inspired by vLLM Kimi K2/K2.5 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_kimi_k2_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        force_reasoning: true
        chunks:
        - thinking
        - </think>answer
        expected:
          dynamo_v1:
            reasoning_text: thinking
            normal_text: answer
          vllm_python:
            reasoning_text: thinking
            normal_text: answer
          sglang_python:
            reasoning_text: thinking
            normal_text: answer
      REASONING.stream.2.b:
        description: Multiple reasoning spans across chunks
        ref: 'inspired by vLLM Kimi K2/K2.5 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_kimi_k2_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        force_reasoning: true
        chunks:
        - <think>first</think>
        - ' middle '
        - <think>second</think> done
        expected:
          dynamo_v1:
            reasoning_text: firstsecond
            normal_text: ' middle  done'
          vllm_python:
            reasoning_text: <think>first
            normal_text: ' middle <think>second</think> done'
            explanation: vLLM Kimi K2 streaming parser leaks the first start marker and leaves the later complete span in normal_text.
          sglang_python:
            reasoning_text: first
            normal_text: ' middle <think>second</think> done'
            explanation: Dynamo re-enters reasoning on each open marker across chunks and concatenates all spans; SGLang exits at the first end marker and does not re-enter, leaving the later span in normal_text.
      REASONING.stream.3.a:
        description: Opening think marker split across chunks
        ref: 'inspired by vLLM Kimi K2/K2.5 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_kimi_k2_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        force_reasoning: true
        chunks:
        - <thi
        - nk>thinking</think>answer
        expected:
          dynamo_v1:
            reasoning_text: thinking
            normal_text: answer
          vllm_python:
            reasoning_text: <think>thinking
            normal_text: answer
            explanation: Dynamo buffers a split start delimiter and strips it; vLLM Kimi K2 streaming parser leaks the reconstructed delimiter.
          sglang_python:
            reasoning_text: thinking
            normal_text: answer
      REASONING.stream.3.b:
        description: End marker split across chunks
        ref: 'inspired by vLLM Kimi K2/K2.5 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_kimi_k2_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        force_reasoning: true
        chunks:
        - <think>thinking</th
        - ink>answer
        expected:
          dynamo_v1:
            reasoning_text: thinking
            normal_text: answer
          vllm_python:
            reasoning_text: <think>thinking</think>answer
            normal_text: ''
            explanation: Dynamo buffers a split end delimiter and resumes normal_text after it; vLLM Kimi K2 streaming parser keeps the delimiter and answer in reasoning_text.
          sglang_python:
            reasoning_text: thinking</think>answer
            normal_text: ''
            explanation: Dynamo buffers an end marker split across chunk boundaries and resumes normal_text after it; SGLang streams the partial delimiter as reasoning (it only holds back a partial marker when the whole pending buffer is a marker prefix), so the split marker is never reassembled and the answer stays in reasoning_text.
      REASONING.stream.3.c:
        description: Partial start-marker prefix later resolves as force-reasoning text
        ref: 'inspired by vLLM Kimi K2/K2.5 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_kimi_k2_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        force_reasoning: true
        chunks:
        - plain <th
        - esis answer
        expected:
          dynamo_v1:
            reasoning_text: plain <thesis answer
            normal_text: ''
          vllm_python:
            reasoning_text: plain <thesis answer
            normal_text: ''
          sglang_python:
            reasoning_text: plain <thesis answer
            normal_text: ''
      REASONING.stream.1.b:
        description: Plain text stays in force-reasoning mode until an end marker
        ref: 'inspired by vLLM Kimi K2/K2.5 reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_kimi_k2_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        force_reasoning: true
        chunks:
        - plain
        - ' answer'
        expected:
          dynamo_v1:
            reasoning_text: plain answer
            normal_text: ''
          vllm_python:
            reasoning_text: plain answer
            normal_text: ''
          sglang_python:
            reasoning_text: plain answer
            normal_text: ''
      REASONING.stream.2.c:
        description: Stray end marker after a complete reasoning span, across chunks(unbalanced-tag)
        ref: dynamo
        spec_ref: tests/parity/README.md
        chunks:
        - <think>preamble</think>
        - body</think>
        - answer
        expected:
          dynamo_v1:
            reasoning_text: preamble
            normal_text: bodyanswer
            explanation: 'Lossless split: when a stray close marker appears outside any reasoning block, it is stripped (parser-owned syntax must not appear in normal_text). Reasoning is captured from the first <open>...<close> pair only; subsequent stray closes are discarded.'
          vllm_python:
            reasoning_text: <think>preamble
            normal_text: body</think>answer
          sglang_python:
            reasoning_text: preamble
            normal_text: body</think>answer
      REASONING.stream.4.a:
        description: Downstream streaming boundary is not applicable to Kimi K2.5
        explanation: Kimi K2.5 uses Kimi tool-section markers, not Harmony commentary channels; Harmony stream boundary cases are GPT-OSS specific.
      REASONING.stream.4.b:
        description: Split downstream streaming boundary is not applicable to Kimi K2.5
        explanation: Kimi K2.5 does not use Harmony `commentary to=functions.*` envelopes, so there is no Harmony stream boundary to split across chunks.
      REASONING.stream.4.c:
        description: Partial downstream boundary recovery is not applicable to Kimi K2.5
        explanation: Kimi K2.5 has no Harmony commentary protocol, so partial commentary-boundary recovery is outside its grammar.
      REASONING.stream.4.d:
        description: Directed Harmony analysis tool calls are not applicable to Kimi K2.5
        explanation: This parser family does not use Harmony `analysis to=functions.*` envelopes, so split analysis-channel tool-call handoff is outside its grammar.
