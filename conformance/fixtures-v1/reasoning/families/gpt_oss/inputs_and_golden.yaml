corpus: reasoning
family: gpt_oss
capture: inputs
documents:
  REASONING.batch.yaml:
    family: gpt_oss
    model_label: gpt-oss
    mode: batch
    captured_with:
      vllm_python: 0.23.0
      sglang_python: 0.5.12.post1
    refs:
      upstream: 'inspired by vLLM GPT-OSS reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_gptoss_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
    cases:
      REASONING.batch.1.b:
        description: Plain text without Harmony channel markers
        ref: 'inspired by vLLM GPT-OSS reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_gptoss_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: plain answer
        expected:
          dynamo_v1: &id001
            reasoning_text: ''
            normal_text: ''
          vllm_python:
            reasoning_text: ''
            normal_text: ''
          sglang_python: *id001
      REASONING.batch.2.a:
        description: Harmony analysis channel followed by final channel
        ref: 'inspired by vLLM GPT-OSS reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_gptoss_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: <|channel|>analysis<|message|>thinking<|end|><|start|>assistant<|channel|>final<|message|>answer
        expected:
          dynamo_v1: &id002
            reasoning_text: thinking
            normal_text: answer
          vllm_python: *id002
          sglang_python: *id002
      REASONING.batch.3.a:
        description: Harmony analysis followed by commentary tool-call channel
        ref: 'inspired by vLLM GPT-OSS reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_gptoss_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: <|channel|>analysis<|message|>choose tool<|end|><|start|>assistant<|channel|>commentary to=functions.get_weather <|constrain|>json<|message|>{"city":"SF"}<|call|>
        expected:
          dynamo_v1:
            reasoning_text: choose tool
            normal_text: <|start|>assistant<|channel|>commentary to=functions.get_weather <|constrain|>json<|message|>{"city":"SF"}<|call|>
            explanation: Unlike vLLM batch reasoning, Dynamo parses reasoning before tool calling. For GPT-OSS/Harmony, directed commentary is tool-call text, so Dynamo passes it in normal_text for the Harmony tool parser to emit structured tool_calls and remove the markup from final content.
          vllm_python:
            reasoning_text: choose tool
            normal_text: ''
            explanation: vLLM batch reasoning suppresses directed Harmony commentary at the reasoning layer; Dynamo keeps it because normal_text is the handoff to the Harmony tool parser.
          sglang_python:
            reasoning_text: choose tool
            normal_text: <|start|>assistant<|channel|>commentary to=functions.get_weather <|constrain|>json<|message|>{"city":"SF"}<|call|>
      REASONING.batch.3.c:
        description: Recipientless Harmony commentary is visible normal text
        ref: 'inspired by vLLM GPT-OSS reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_gptoss_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: <|channel|>commentary<|message|>I will check that.<|end|><|start|>assistant<|channel|>final<|message|>Done.
        expected:
          dynamo_v1: &id003
            reasoning_text: ''
            normal_text: 'I will check that.

              Done.'
          vllm_python: *id003
          sglang_python:
            reasoning_text: ''
            normal_text: I will check that.Done.
            explanation: SGLang drops the Harmony block boundary between recipientless commentary and final content, so two visible text blocks concatenate without the separator Dynamo/vLLM insert.
      REASONING.batch.3.d:
        description: Directed Harmony commentary tool call is not visible normal text
        ref: 'inspired by vLLM GPT-OSS reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_gptoss_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: <|channel|>commentary to=functions.get_weather <|constrain|>json<|message|>{"city":"SF"}<|call|>
        expected:
          dynamo_v1:
            reasoning_text: ''
            normal_text: <|channel|>commentary to=functions.get_weather <|constrain|>json<|message|>{"city":"SF"}<|call|>
            explanation: Unlike vLLM batch reasoning, Dynamo parses reasoning before tool calling. For GPT-OSS/Harmony, directed commentary is tool-call text, so Dynamo passes it in normal_text for the Harmony tool parser to emit structured tool_calls and remove the markup from final content.
          vllm_python:
            reasoning_text: ''
            normal_text: ''
            explanation: vLLM batch reasoning suppresses directed Harmony commentary at the reasoning layer; Dynamo keeps it because normal_text is the handoff to the Harmony tool parser.
          sglang_python:
            reasoning_text: ''
            normal_text: <|channel|>commentary to=functions.get_weather <|constrain|>json<|message|>{"city":"SF"}<|call|>
      REASONING.batch.3.e:
        description: Directed Harmony analysis tool call is handed off to the tool-call parser
        ref: 'inspired by vLLM GPT-OSS reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_gptoss_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: <|channel|>analysis to=functions.search <|constrain|>json<|message|>{"q":"x"}<|call|>
        expected:
          dynamo_v1:
            reasoning_text: ''
            normal_text: <|channel|>analysis to=functions.search <|constrain|>json<|message|>{"q":"x"}<|call|>
            explanation: A directed Harmony call (to=functions.*) is a tool call regardless of the channel label — the recipient is the real signal. The gpt-oss engine emits a large fraction of real tool calls on the analysis channel (with a bare `code` constraint), so Dynamo now hands a directed analysis-channel call to the Harmony tool parser (like SGLang) instead of keeping its payload in reasoning_text. Keeping it in reasoning dropped/leaked those tool calls. Supersedes the prior contract from
          vllm_python:
            reasoning_text: '{"q":"x"}'
            normal_text: ''
            explanation: 'vLLM''s reasoning layer kept the directed analysis-channel payload in reasoning_text (prior contract). FLAG: this row was previously aliased to Dynamo and has NOT been re-verified against current vLLM after Dynamo''s behavior change — confirm before relying on it.'
          sglang_python:
            reasoning_text: ''
            normal_text: <|channel|>analysis to=functions.search <|constrain|>json<|message|>{"q":"x"}<|call|>
            explanation: SGLang classifies a directed Harmony analysis channel ending in <|call|> as a tool_call handoff and emits the raw envelope in normal_text. Dynamo now matches this.
      REASONING.batch.3.f:
        description: Harmony analysis, directed commentary tool call, then final answer
        ref: 'inspired by vLLM GPT-OSS reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_gptoss_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: <|channel|>analysis<|message|>think<|end|><|start|>assistant<|channel|>commentary to=functions.get_weather <|constrain|>json<|message|>{"city":"SF"}<|call|><|start|>assistant<|channel|>final<|message|>It is sunny.
        expected:
          dynamo_v1:
            reasoning_text: think
            normal_text: <|start|>assistant<|channel|>commentary to=functions.get_weather <|constrain|>json<|message|>{"city":"SF"}<|call|><|start|>assistant<|channel|>final<|message|>It is sunny.
            explanation: Unlike vLLM batch reasoning, Dynamo parses reasoning before tool calling. For GPT-OSS/Harmony, directed commentary is tool-call text, so Dynamo passes it in normal_text for the Harmony tool parser to emit structured tool_calls, recover final text, and remove tool-call markup from final content.
          vllm_python:
            reasoning_text: think
            normal_text: It is sunny.
            explanation: vLLM batch reasoning suppresses directed Harmony commentary at the reasoning layer; Dynamo keeps it because normal_text is the handoff to the Harmony tool parser.
          sglang_python:
            reasoning_text: think
            normal_text: <|start|>assistant<|channel|>commentary to=functions.get_weather <|constrain|>json<|message|>{"city":"SF"}<|call|>It is sunny.
            explanation: SGLang preserves directed Harmony commentary for downstream parsing but strips the final-channel envelope before returning normal_text; Dynamo keeps the final Harmony envelope too so the downstream Harmony tool parser can recover final text after extracting the call.
      REASONING.batch.2.c:
        description: Harmony analysis followed by normal final answer text
        ref: 'inspired by vLLM GPT-OSS reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_gptoss_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: <|channel|>analysis<|message|>compute<|end|><|start|>assistant<|channel|>final<|message|>answer
        expected:
          dynamo_v1: &id004
            reasoning_text: compute
            normal_text: answer
          vllm_python: *id004
          sglang_python: *id004
      REASONING.batch.4:
        description: Final channel without prior analysis channel
        ref: 'inspired by vLLM GPT-OSS reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_gptoss_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: <|channel|>final<|message|>answer
        expected:
          dynamo_v1: &id005
            reasoning_text: ''
            normal_text: answer
          vllm_python: *id005
          sglang_python: *id005
      REASONING.batch.5:
        description: Analysis channel without a final or commentary channel
        ref: 'inspired by vLLM GPT-OSS reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_gptoss_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: <|channel|>analysis<|message|>partial reasoning<|end|>
        expected:
          dynamo_v1: &id006
            reasoning_text: partial reasoning
            normal_text: ''
          vllm_python: *id006
          sglang_python: *id006
      REASONING.batch.2.e:
        description: Empty analysis channel followed by final text
        ref: 'inspired by vLLM GPT-OSS reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_gptoss_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: <|channel|>analysis<|message|><|end|><|start|>assistant<|channel|>final<|message|>answer
        expected:
          dynamo_v1: &id007
            reasoning_text: ''
            normal_text: answer
          vllm_python: *id007
          sglang_python: *id007
      REASONING.batch.2.f:
        description: Complex Harmony analysis content with Unicode and newlines
        ref: 'inspired by vLLM GPT-OSS reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_gptoss_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: '<|channel|>analysis<|message|>Line 1

          Unicode: café

          JSON-ish: {"x": [1, true]}<|end|><|start|>assistant<|channel|>final<|message|>Done.'
        expected:
          dynamo_v1: &id008
            reasoning_text: 'Line 1

              Unicode: café

              JSON-ish: {"x": [1, true]}'
            normal_text: Done.
          vllm_python: *id008
          sglang_python: *id008
      REASONING.batch.1.a:
        description: Empty input
        ref: 'inspired by vLLM GPT-OSS reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_gptoss_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: ''
        expected:
          dynamo_v1: &id009
            reasoning_text: ''
            normal_text: ''
          vllm_python: *id009
          sglang_python: *id009
      REASONING.batch.6.a:
        description: Multiple Harmony analysis spans
        ref: 'inspired by vLLM GPT-OSS reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_gptoss_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        model_text: <|channel|>analysis<|message|>first<|end|><|start|>assistant<|channel|>analysis<|message|>second<|end|><|start|>assistant<|channel|>final<|message|>done
        expected:
          dynamo_v1: &id010
            reasoning_text: 'first

              second'
            normal_text: done
          vllm_python: *id010
          sglang_python:
            reasoning_text: firstsecond
            normal_text: done
            explanation: SGLang concatenates multiple Harmony analysis spans without an inserted separator, while Dynamo/vLLM preserve the span boundary with a newline.
      REASONING.batch.2.d:
        description: Normal text before a Harmony analysis channel is not a portable parser-level fixture
        explanation: Harmony reasoning content is channel-framed; prefix text before the first channel is outside this parser-level fixture contract.
      REASONING.batch.3.b:
        description: Open analysis channel interrupted by downstream tool-call text is not configured for Harmony
        ref: 'inspired by vLLM GPT-OSS reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_gptoss_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        explanation: Harmony tool calls require a commentary channel envelope; the closed analysis to commentary handoff is covered by REASONING.batch.3.a.
      REASONING.batch.6.b:
        description: Stray end marker after a complete reasoning span(unbalanced-tag)
        ref: dynamo
        spec_ref: tests/parity/README.md
        model_text: ''
        expected:
          dynamo_v1:
            unavailable: 'Pattern not applicable: gpt_oss does not use paired open/close markers, so the 1-open + 2-close unbalanced-tag shape has no direct analog.'
          vllm_python:
            unavailable: 'Pattern not applicable: gpt_oss does not use paired open/close markers, so the 1-open + 2-close unbalanced-tag shape has no direct analog.'
          sglang_python:
            unavailable: 'Pattern not applicable: gpt_oss does not use paired open/close markers, so the 1-open + 2-close unbalanced-tag shape has no direct analog.'
  REASONING.stream.yaml:
    family: gpt_oss
    model_label: gpt-oss
    mode: stream
    captured_with:
      vllm_python: 0.23.0
      sglang_python: 0.5.12.post1
    refs:
      upstream: 'inspired by vLLM GPT-OSS reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_gptoss_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
    cases:
      REASONING.stream.1.a:
        description: Empty stream chunk
        ref: 'inspired by vLLM GPT-OSS reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_gptoss_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        chunks:
        - ''
        expected:
          dynamo_v1: &id011
            reasoning_text: ''
            normal_text: ''
          vllm_python: *id011
          sglang_python: *id011
      REASONING.stream.2.a:
        description: Harmony analysis block across chunks
        ref: 'inspired by vLLM GPT-OSS reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_gptoss_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        chunks:
        - <|channel|>
        - analysis<|message|>thinking
        - <|end|><|start|>assistant<|channel|>final<|message|>
        - answer
        expected:
          dynamo_v1: &id012
            reasoning_text: thinking
            normal_text: answer
          vllm_python: *id012
          sglang_python: *id012
      REASONING.stream.2.b:
        description: Multiple Harmony analysis spans across chunks
        ref: 'inspired by vLLM GPT-OSS reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_gptoss_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        chunks:
        - <|channel|>analysis<|message|>first<|end|><|start|>assistant
        - <|channel|>analysis<|message|>second<|end|><|start|>assistant
        - <|channel|>final<|message|>done
        expected:
          dynamo_v1: &id013
            reasoning_text: 'first

              second'
            normal_text: done
          vllm_python: *id013
          sglang_python:
            reasoning_text: firstsecond
            normal_text: done
            explanation: SGLang concatenates multiple Harmony analysis spans without an inserted separator, while Dynamo/vLLM preserve the span boundary with a newline.
      REASONING.stream.3.a:
        description: Harmony start marker split across chunks
        ref: 'inspired by vLLM GPT-OSS reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_gptoss_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        chunks:
        - <|chan
        - nel|>analysis<|message|>thinking<|end|><|start|>assistant<|channel|>final<|message|>answer
        expected:
          dynamo_v1: &id014
            reasoning_text: thinking
            normal_text: answer
          vllm_python: *id014
          sglang_python: *id014
      REASONING.stream.3.b:
        description: Harmony end marker split across chunks
        ref: 'inspired by vLLM GPT-OSS reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_gptoss_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        chunks:
        - <|channel|>analysis<|message|>thinking<|e
        - nd|><|start|>assistant<|channel|>final<|message|>answer
        expected:
          dynamo_v1:
            reasoning_text: thinking
            normal_text: answer
          vllm_python:
            unavailable: vLLM gpt-oss streaming parity for a split Harmony end token needs explicit token_chunks; text-only chunks are not faithful.
          sglang_python:
            reasoning_text: thinking<|end|><|start|>assistant<|channel|>final<|message|>answer
            normal_text: ''
            explanation: SGLang does not recognize the split Harmony end marker in text-only streaming chunks, so the final-channel text remains in reasoning_text instead of being emitted as normal_text.
      REASONING.stream.3.c:
        description: Partial Harmony channel marker prefix later becomes non-channel text
        ref: 'inspired by vLLM GPT-OSS reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_gptoss_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        chunks:
        - plain <|chan
        - ce answer
        expected:
          dynamo_v1: &id015
            reasoning_text: ''
            normal_text: ''
          vllm_python:
            reasoning_text: ''
            normal_text: ''
          sglang_python: *id015
      REASONING.stream.4.a:
        description: Recipientless Harmony commentary is visible normal text across chunks
        ref: 'inspired by vLLM GPT-OSS reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_gptoss_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        chunks:
        - <|channel|>commentary<|message|>I will check that.<|end|><|start|>assistant
        - <|channel|>final<|message|>Done.
        expected:
          dynamo_v1: &id016
            reasoning_text: ''
            normal_text: 'I will check that.

              Done.'
          vllm_python: *id016
          sglang_python:
            reasoning_text: ''
            normal_text: I will check that.Done.
            explanation: SGLang drops the Harmony block boundary between recipientless commentary and final content, so two visible text blocks concatenate without the separator Dynamo/vLLM insert.
      REASONING.stream.4.b:
        description: Directed Harmony commentary tool recipient split across chunks
        ref: 'inspired by vLLM GPT-OSS reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_gptoss_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        chunks:
        - <|channel|>commentary to=functions.get_
        - weather <|constrain|>json<|message|>{"city":"SF"}<|call|>
        expected:
          dynamo_v1: &id017
            reasoning_text: ''
            normal_text: <|channel|>commentary to=functions.get_weather <|constrain|>json<|message|>{"city":"SF"}<|call|>
            explanation: Unlike vLLM streaming reasoning, Dynamo parses reasoning before tool calling. For GPT-OSS/Harmony, directed commentary is tool-call text, so Dynamo passes it in normal_text for the Harmony tool parser to emit structured tool_calls and remove the markup from final content.
          vllm_python:
            reasoning_text: ''
            normal_text: ''
            explanation: vLLM streaming reasoning suppresses directed Harmony commentary at the reasoning layer; Dynamo keeps it because normal_text is the handoff to the Harmony tool parser.
          sglang_python: *id017
      REASONING.stream.4.c:
        description: Two directed Harmony commentary tool calls in one stream
        ref: 'inspired by vLLM GPT-OSS reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_gptoss_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        chunks:
        - <|channel|>commentary to=functions.get_weather <|constrain|>json<|message|>{"city":"SF"}<|call|><|start|>assistant
        - <|channel|>commentary to=functions.get_time <|constrain|>json<|message|>{"tz":"PST"}<|call|>
        expected:
          dynamo_v1:
            reasoning_text: ''
            normal_text: <|channel|>commentary to=functions.get_weather <|constrain|>json<|message|>{"city":"SF"}<|call|><|channel|>commentary to=functions.get_time <|constrain|>json<|message|>{"tz":"PST"}<|call|>
            explanation: Unlike vLLM streaming reasoning, Dynamo parses reasoning before tool calling. For GPT-OSS/Harmony, directed commentary is tool-call text, so Dynamo passes it in normal_text for the Harmony tool parser to emit structured tool_calls and remove the markup from final content.
          vllm_python:
            reasoning_text: ''
            normal_text: ''
            explanation: vLLM streaming reasoning suppresses directed Harmony commentary at the reasoning layer; Dynamo keeps it because normal_text is the handoff to the Harmony tool parser.
          sglang_python:
            reasoning_text: ''
            normal_text: <|channel|>commentary to=functions.get_weather <|constrain|>json<|message|>{"city":"SF"}<|call|><|start|>assistant<|channel|>commentary to=functions.get_time <|constrain|>json<|message|>{"tz":"PST"}<|call|>
      REASONING.stream.4.d:
        description: Directed Harmony analysis tool recipient split across chunks
        ref: 'inspired by vLLM GPT-OSS reasoning tests: https://github.com/vllm-project/vllm/blob/39910f2b25aacc09f5e7f166cdf0030b19f8b9e8/tests/reasoning/test_gptoss_reasoning_parser.py; local taxonomy: lib/parsers/REASONING_CASES.md'
        chunks:
        - <|channel|>analysis to=functions.grep code<|message|>
        - '{"pattern":"foo"}<|call|>'
        expected:
          dynamo_v1:
            reasoning_text: ''
