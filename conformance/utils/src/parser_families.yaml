# Report identities for recorded peer pipelines. `impl` groups the comparison slots.
unified_peer_sources:
  vllm_python:
    impl: vllm
    label: "vLLM Python {version} (batch, Combined)"
    stream: false
    legacy_key: vllm
  vllm_rust:
    impl: vllm
    label: "vLLM Rust {version} (stream, Combined & Unified)"
    stream: true
    legacy_key: vllm_rust
  sglang_python:
    impl: sglang
    label: "SGLang Python {version} (stream, reasoning + tool detectors)"
    stream: true
    legacy_key: null

# Historical batch capture identities and release-source limitations.
unified_batch:
  dynamo_v1:
    source: dynamo_v1
    source_blockers:
      9.2.13: &missing_dynamo_release "Producer source unavailable: no release tag or crate publication for Dynamo 9.2.13; crates.io returned 404."
  dynamo_v1_jail:
    source: dynamo_v1
    source_blockers:
      9.2.13: *missing_dynamo_release
  vllm_python_batch: {source: vllm_python}
  sglang_python_batch: {source: sglang_python}

# Reader-facing grouping and comparison defaults; capture identities remain in code.
unified_display:
  comparison_defaults: [dynamo, null, null]
  comparison_slot_engines: [dynamo, sglang, vllm]
  comparison_languages: [python, rust]
  group_labels:
    v1_split: V1 parser cases
    1: TC Single call
    2: TC Multiple calls
    3: TC No call
    4: TC Malformed envelope
    5: TC Truncation / recovery
    6: TC Empty body
    7: TC Argument fidelity
    8: TC Content position
    10: Reasoning span
    11: Reasoning ↔ tool interleaving
    12: Adversarial nesting (reasoning + tool)
    30: Guided Decoding — baseline and argument fidelity
    31: Guided Decoding — invalid JSON or call structure
    32: Guided Decoding — tool markup around the payload
    33: Guided Decoding — invalid payload plus tool markup
    34: Guided Decoding — reasoning boundaries
    35: Guided Decoding — markers in visible answers
    36: Guided Decoding — response schemas after reasoning
    40: Prefilled Reasoning
    41: Prefilled Reasoning — malformed
    50: Prefilled Response
    51: Prefilled Response — malformed
    deepseek_v4: 'Single Family Test: DeepSeek V4-specific tests'
    gemma: 'Single Family Test: Gemma 4 guided call-prefix boundaries'
    glm5: 'Single Family Test: GLM argument handling'
    deepseek: 'Single Family Test: DeepSeek V4.1 DSML invocation bodies'
    deepseek_v41: 'Single Family Test: DeepSeek V4.1-specific tests'
    kimi_k2: 'Single Family Test: Kimi K2-specific tests'
    qwen3: 'Family-specific tests: Qwen3 and Nemotron v3 XML'
    nemotron_v3: 'Single Family Test: Nemotron v3 default reasoning'
    kimi: 'Single Family Test: Kimi K3 XTML'
    muse: 'Single Family Test: Muse-specific'
    muse_spark: 'Single Family Test: Muse Spark message phases'
    gpt_oss: 'Single Family Test: GPT-OSS Harmony'
    beam: 'Single Family Test: Beam-specific'
    dsml: 'DSML framing: DeepSeek V4 and V4.1 content-to-call separator'
  group_overrides:
    default_reasoning_without_opener: nemotron_v3
    default_reasoning_tool_without_closer: nemotron_v3
    xml_custom_type_double_quoted_object: qwen3
    xml_custom_type_single_quoted_object: qwen3
    guided_response_rejected_header_quote_ownership: deepseek_v4
  prefixes:
    deepseek: [deepseek_v41, ds41]
    deepseek_v4: [deepseek_v4, ds4]
    deepseek_v41: [deepseek_v41, ds41]
