# Parser-family registry (audit B2): one row per conformance family with the
# parser/detector name each engine uses. `null` = that engine has no parser for the
# family (rendered unavailable). This is the single source of truth for the peer
# capture maps in capture_driver.py (VLLM / VLLM_RUST / SGLANG) — adding a family or
# changing a peer parser name happens here, not in three parallel dicts.
#
# Columns:
#   vllm_python    vLLM Python tool-parser name        (None -> no vLLM capture)
#   vllm_rust      vLLM Rust tool-parser name          (None -> no vLLM Rust capture)
#   sglang_python  SGLang detector name                (None -> no SGLang detector)
#   dynamo_v2      Dynamo parser v2 family id           (None -> not implemented yet)
#   preferred_input  tokens | text  (how the Dynamo v2 parser is best driven)
families:
  deepseek_v3:    {vllm_python: deepseek_v3,    vllm_rust: deepseek_v3,  sglang_python: deepseekv3,  dynamo_v2: null,        preferred_input: text}
  deepseek_v3_1:  {vllm_python: deepseek_v31,   vllm_rust: deepseek_v31, sglang_python: deepseekv31, dynamo_v2: null,        preferred_input: text}
  deepseek_v3_2:  {vllm_python: deepseek_v32,   vllm_rust: deepseek_v32, sglang_python: deepseekv32, dynamo_v2: null,        preferred_input: text}
  deepseek_v4:    {vllm_python: deepseek_v4,    vllm_rust: deepseek_v4,  sglang_python: deepseekv4,  dynamo_v2: deepseek_v4, preferred_input: text}
  gemma4:         {vllm_python: gemma4,         vllm_rust: gemma4,       sglang_python: gemma4,      dynamo_v2: gemma4,      preferred_input: text}
  glm47:          {vllm_python: glm47,          vllm_rust: glm47,        sglang_python: glm47,       dynamo_v2: glm47,       preferred_input: text}
  hermes:         {vllm_python: hermes,         vllm_rust: hermes,       sglang_python: hermes,      dynamo_v2: null,        preferred_input: text}
  # inkling uses vLLM's unified parser (vllm/parser/inkling.py), not the legacy ToolParserManager
  # the capture harness drives, so a `check.sh vllm` refresh needs unified-parser support.
  inkling:        {vllm_python: inkling,        vllm_rust: null,         sglang_python: inkling,     dynamo_v2: null,        preferred_input: text}
  jamba:          {vllm_python: jamba,          vllm_rust: null,         sglang_python: null,        dynamo_v2: null,        preferred_input: text}
  kimi_k2:        {vllm_python: kimi_k2,        vllm_rust: kimi_k2,      sglang_python: kimi_k2,     dynamo_v2: kimi_k2,     preferred_input: text}
  llama3_json:    {vllm_python: llama3_json,    vllm_rust: llama3_json,  sglang_python: llama3,      dynamo_v2: null,        preferred_input: text}
  minimax_m2:     {vllm_python: minimax_m2,     vllm_rust: minimax_m2,   sglang_python: minimax-m2,  dynamo_v2: minimax_m2,  preferred_input: text}
  # vllm_rust gained MinimaxM3ToolParser / Phi4MiniJsonToolParser in 0.24.0; the older
  # vllm_rust-0.23.0 anchor keeps its recorded `unavailable` blocks (append-only), so
  # mapping them here only affects 0.24.0+ captures.
  minimax_m3:     {vllm_python: minimax_m3,     vllm_rust: minimax_m3,   sglang_python: minimax-m3,  dynamo_v2: minimax_m3,  preferred_input: text}
  mistral:        {vllm_python: mistral,        vllm_rust: mistral,      sglang_python: mistral,     dynamo_v2: null,        preferred_input: text}
  # vLLM's muse_glimmer parsers exist only in PR #51655 (unmerged); until a release
  # carries them, `check.sh vllm` cannot capture this family.
  muse_glimmer:   {vllm_python: muse_glimmer,   vllm_rust: null,         sglang_python: muse,        dynamo_v2: muse_glimmer, preferred_input: text}
  nemotron_deci:  {vllm_python: hermes,         vllm_rust: hermes,       sglang_python: null,        dynamo_v2: null,        preferred_input: text}
  nemotron_nano:  {vllm_python: hermes,         vllm_rust: hermes,       sglang_python: null,        dynamo_v2: null,        preferred_input: text}
  phi4:           {vllm_python: phi4_mini_json, vllm_rust: phi4_mini_json, sglang_python: null,      dynamo_v2: null,        preferred_input: text}
  pythonic:       {vllm_python: pythonic,       vllm_rust: null,         sglang_python: pythonic,    dynamo_v2: null,        preferred_input: text}
  qwen25:         {vllm_python: hermes,         vllm_rust: hermes,       sglang_python: qwen25,      dynamo_v2: null,        preferred_input: text}
  qwen3_coder:    {vllm_python: qwen3_coder,    vllm_rust: qwen3_coder,  sglang_python: qwen3_coder, dynamo_v2: qwen3_coder, preferred_input: text}
  # Harmony (gpt-oss) is driven by the Dynamo token path and captured via the
  # harmony-specific flow, not the peer maps above; listed for registry coverage.
  harmony:        {vllm_python: null,           vllm_rust: null,         sglang_python: null,        dynamo_v2: harmony,      preferred_input: tokens}
  harmony_text:   {vllm_python: null,           vllm_rust: null,         sglang_python: null,        dynamo_v2: harmony,      preferred_input: text}

# Family grammar tokens (DIS-2442): the single source both derived registries consume.
#   * markers.py builds the tool-call leak detector (_TOOL_CALL_MARKUP_RE) from the
#     union of every family's tokens — an undeclared token makes a markup leak render
#     as a clean green cell.
#   * tests/parity/markup.py consults the family's pairs/singletons when its heuristic
#     classifier cannot type a token — an unclassifiable token renders as a red
#     tt-orphan in the conformance popups (looks like a parse error).
# Keys per family (all optional, but the family key itself is REQUIRED — the coverage
# lint fails families without an entry; use an explicit {} for markup-less grammars):
#   pairs:      [[open, close], ...] exact-literal open/close token pairs
#   singletons: [tok, ...]           standalone tokens with no open/close semantics
#   leak:       [s, ...]             extra substrings for the leak detector only —
#                                    prefixes of parameterized tags (e.g. "<invoke"),
#                                    tokens the colorizer already handles specially
#   opaque:     [entry, ...]         regions whose BODY is argument DATA, not markup.
#                                    Inside one, NOTHING is a control token until that
#                                    region's own closer — mirroring the parser, which
#                                    reads a value to its own terminator so a
#                                    marker-looking substring inside it survives (I7).
#                                    Without this the colorizer paints an embedded
#                                    `</tool_call>` in a value as a real close and
#                                    mis-colors the rest of the value.
#                                    Two entry forms:
#                                      "<pair_id>"            region runs from an open
#                                        (or toggle) to that pair's own closer. A
#                                        pair_id is the OPEN token of a declared pair,
#                                        or the tag NAME of a parameterized tag
#                                        (`<parameter=cmd>` -> `parameter`).
#                                      {from: TOK, to: TOK}   region opened by a
#                                        SINGLETON, which has no closer of its own, so
#                                        the terminator is named explicitly.
markers:
  deepseek_v3:
    pairs: [["<｜tool▁calls▁begin｜>", "<｜tool▁calls▁end｜>"], ["<｜tool▁call▁begin｜>", "<｜tool▁call▁end｜>"]]
    singletons: ["<｜tool▁sep｜>"]
  deepseek_v3_1:
    pairs: [["<｜tool▁calls▁begin｜>", "<｜tool▁calls▁end｜>"], ["<｜tool▁call▁begin｜>", "<｜tool▁call▁end｜>"]]
    singletons: ["<｜tool▁sep｜>"]
  deepseek_v3_2:
    pairs: [["<｜DSML｜function_calls>", "</｜DSML｜function_calls>"]]
    leak: ["<｜DSML｜", "</｜DSML｜"]
  deepseek_v4:
    pairs: [["<｜DSML｜tool_calls>", "</｜DSML｜tool_calls>"]]
    leak: ["<｜DSML｜", "</｜DSML｜"]
  gemma4:
    pairs: [["<|tool_call>", "<tool_call|>"]]
    # `<|"|>` ... `<|"|>` quotes a raw string value; `__gemma_quote` is the pair id the
    # colorizer's classifier gives that toggle.
    opaque: ["__gemma_quote"]
    leak: ['<|"|>']
  glm47:
    pairs: [["<tool_call>", "</tool_call>"], ["<arg_key>", "</arg_key>"], ["<arg_value>", "</arg_value>"]]
  hermes:
    pairs: [["<tool_call>", "</tool_call>"]]
  inkling:
    pairs: [["<|content_invoke_tool_json|>", "<|end_message|>"]]
    singletons: ["<|message_model|>", "<|content_model_end_sampling|>"]
  jamba:
    pairs: [["<tool_calls>", "</tool_calls>"]]
  kimi_k2:
    pairs: [["<|tool_calls_section_begin|>", "<|tool_calls_section_end|>"], ["<|tool_call_begin|>", "<|tool_call_end|>"]]
    singletons: ["<|tool_call_argument_begin|>"]
    # The JSON argument blob runs from the singleton to the call close; a marker
    # inside one of its string values is data.
    opaque: [{from: "<|tool_call_argument_begin|>", to: "<|tool_call_end|>", json: true}]
  llama3_json:
    singletons: ["<|python_tag|>"]
  minimax_m2:
    pairs: [["<minimax:tool_call>", "</minimax:tool_call>"]]
    leak: ["<invoke", "</invoke", "<parameter", "</parameter"]
  minimax_m3:
    pairs: [["<tool_call>", "</tool_call>"]]
    singletons: ["]<]minimax[>["]
    leak: ["<invoke", "</invoke"]
  mistral:
    pairs: [["[TOOL_CALLS]", "[/TOOL_CALLS]"]]
  muse_glimmer:
    pairs: [["<atem:function_calls>", "</atem:function_calls>"]]
    # Channel framing around every routed message; the reasoning stage forwards
    # tool channels with this framing intact (like inkling's <|message_model|>).
    singletons: ["<|start|>", "<|message|>", "<|eom|>", "<|eot|>"]
    # `<atem:parameter name="K">` ... `</atem:parameter>` delimits a raw value the
    # parser reads to its own closer, so an enclosing marker inside it is data
    # (`I7`) — same shape as qwen3_coder's `<parameter=K>`.
    opaque: ["atem:parameter"]
    leak: ["<atem:invoke", "</atem:invoke", "<atem:parameter", "</atem:parameter"]
  nemotron_deci:
    pairs: [["<TOOLCALL>", "</TOOLCALL>"]]
  nemotron_nano:
    pairs: [["<tool_call>", "</tool_call>"]]
    leak: ["<function=", "</function", "<parameter=", "</parameter"]
  phi4:
    leak: ["functools["]
  # Pythonic output is a bare `[func(...)]` python list — no grammar markup exists to
  # leak or colorize; explicit empty declaration.
  pythonic: {}
  qwen25:
    pairs: [["<tool_call>", "</tool_call>"]]
  qwen3_coder:
    pairs: [["<tool_call>", "</tool_call>"]]
    # `<parameter=K>` ... `</parameter>` delimits a raw, UNQUOTED value: the grammar
    # has no escaping, so the value runs to its own closer and anything that looks
    # like an enclosing marker inside it is data.
    opaque: ["parameter"]
    leak: ["<function=", "</function", "<parameter=", "</parameter"]
  # Harmony's linear turn tokens pseudo-pair (`<|start|>` closes with `<|end|>` /
  # `<|return|>` / `<|call|>`) — richer than the pairs/singletons schema, so the
  # colorizer keeps its dedicated harmony logic and the tokens are declared for the
  # leak detector only.
  harmony:
    leak: ["<|start|>", "<|channel|>", "<|constrain|>", "<|message|>", "<|end|>", "<|return|>", "<|call|>"]
  harmony_text:
    leak: ["<|start|>", "<|channel|>", "<|constrain|>", "<|message|>", "<|end|>", "<|return|>", "<|call|>"]

# ---------------------------------------------------------------------------
# UNIFIED conformance path (the "Unified (reasoning + tools)" tab).
#
# One row per CORPUS family — the name the corpus and golden spec use, which is
# not always the registry name above (the Qwen XML grammar is `qwen3` in the
# corpus and `qwen3_coder` in `families:`/`markers:`).
#
# ADDING A FAMILY TO THE UNIFIED TAB = ADDING A ROW HERE. It replaces what used
# to be five hand-kept lists that had to agree: `FAMILIES` / `FAM_FILE` /
# `UNIFIED_FAMILIES` in gen_unified_golden.py, `parsers_for()` in BOTH
# unified_render.rs and capture_cross_version.rs, the `family_leak` match, and
# `MARKER_FAMILY` in unified_taxonomy.py.
#
# Columns:
#   registry          key into `families:` / `markers:` above (defaults to the row name)
#   native            true = has a native UnifiedParser; false = driven through the SPLIT path
#   reasoning_parser  v1 reasoning parser used by the SPLIT path
#   tool_parser       v2 tool parser used by the SPLIT path
#   golden_spec       filename under conformance/unified/golden_spec/
#   leak_markers      markup that is invisible to the SHARED leak list, so it must be
#                     enumerated per family. gemma4's channel opener leaves `thought\n`;
#                     qwen3's tool envelope has no `<|...|>` sentinels, so a leaked
#                     `<tool_call>` cannot be spotted generically. Families whose markers
#                     already contain `<|`/`|>` (kimi) need nothing here.
unified:
  gemma4:
    registry: gemma4
    native: false
    reasoning_parser: gemma4
    tool_parser: gemma4
    golden_spec: gemma4.yaml
    leak_markers: ["thought\n"]
  kimi_k2:
    registry: kimi_k2
    native: true
    reasoning_parser: kimi_k25
    tool_parser: kimi_k2
    golden_spec: kimi.yaml
    leak_markers: []
  muse_glimmer:
    native: true
    # Prefilled channels ARE supported: `initialize_request` opens the stream in the
    # channel the prompt already opened, which is a two-line change for this grammar.
    #
    # Guided tool output is supported. It used to be refused for this
    # family on the ground that `GuidedState` was built around a `ReasoningSpec` (an
    # open/close marker PAIR) and muse has none — reasoning opens with a dynamic
    # `to=self<|message|>` header it shares with the content and tool channels. Having
    # no marker pair is not the same as having no reasoning channel: the guided reader
    # now asks the family where a thought begins rather than assuming a fixed opener
    # string, and muse answers with the same header resolver its native scan uses. All
    # 81 unified scenarios are emitted for this family.
    guided_tool_output: true
    reasoning_parser: muse_glimmer
    tool_parser: muse_glimmer
    golden_spec: muse_glimmer.yaml
    leak_markers: ["<atem:function_calls>", "</atem:function_calls>", "<atem:invoke", "</atem:invoke>", "<atem:parameter", "</atem:parameter>"]
  qwen3:
    registry: qwen3_coder
    native: true
    reasoning_parser: qwen3
    tool_parser: qwen3_coder
    golden_spec: qwen3.yaml
    leak_markers: ["<tool_call>", "</tool_call>", "<function=", "</function>", "<parameter=", "</parameter>"]
